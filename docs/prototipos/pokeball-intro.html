<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jornada Kanto — Intro Pokébola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1024;
    --bg2:#141a35;
    --box:#fefbf0;
    --box-border:#1a1a2e;
    --ink:#1a1a2e;
    --blue:#2a5fd6;
    --red:#d1291b;
    --red-dark:#8f1a10;
    --yellow:#ffcb05;
    --green:#2f9e44;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.04) 1px, transparent 1px),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,0.03) 1px, transparent 1px),
      radial-gradient(circle at 40% 85%, rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(160deg, var(--bg), var(--bg2));
    background-size:60px 60px, 80px 80px, 70px 70px, cover;
    font-family:'Inter', system-ui, sans-serif;
    color:var(--ink);
    overflow:hidden;
  }

  /* ============ TELA DE LOGIN (fica atrás, revelada no fim) ============ */
  #login{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:24px 12px;
    opacity:0;
    transform:scale(.96);
    transition:opacity .7s ease, transform .7s ease;
  }
  #login.show{opacity:1; transform:scale(1);}
  .eyebrow{
    font-family:'Press Start 2P', monospace;
    font-size:.55rem; letter-spacing:.5px;
    color:var(--yellow); text-align:center;
    margin:0 0 14px; opacity:.9;
  }
  h1{
    font-family:'Press Start 2P', monospace;
    font-size:1.3rem; line-height:1.6;
    margin:0 0 22px; text-align:center;
    color:var(--yellow);
    text-shadow:3px 3px 0 var(--red-dark), 6px 6px 0 rgba(0,0,0,.4);
  }
  .box{
    background:var(--box);
    border:3px solid var(--box-border);
    border-radius:4px;
    box-shadow:5px 5px 0 rgba(0,0,0,.45);
    padding:20px 18px;
    width:100%; max-width:400px;
    position:relative;
  }
  .box.cursor::after{
    content:'▼';
    position:absolute; right:14px; bottom:8px;
    font-size:.8rem; color:var(--box-border);
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}
  .box p{font-size:.92rem; line-height:1.5; margin:0 0 14px;}
  .btn{
    display:block; width:100%;
    padding:13px 14px; margin:9px 0;
    border:3px solid var(--box-border); border-radius:3px;
    background:#fff; color:var(--ink);
    font-family:'Inter', sans-serif; font-weight:700; font-size:.92rem;
    text-align:center; cursor:pointer;
    box-shadow:4px 4px 0 var(--box-border);
    transition:transform .05s, box-shadow .05s;
  }
  .btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--box-border);}
  .btn.primary{background:var(--blue); color:#fff;}
  .replay{
    margin-top:26px;
    font-family:'Press Start 2P', monospace;
    font-size:.55rem; color:#8b93c9;
    background:none; border:none; cursor:pointer;
    text-decoration:underline;
  }

  /* ============ BOOT / POKÉBOLA ============ */
  #boot{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:38px;
    background:transparent;
  }
  #boot.gone{display:none;}

  .stage{
    width:240px; height:240px;
    position:relative;
    filter:drop-shadow(0 18px 22px rgba(0,0,0,.55));
  }
  .ball{
    position:absolute; inset:0;
    transform-origin:50% 88%;
  }

  /* metades — entram de fora da tela */
  .half{
    position:absolute; left:0; width:240px; height:120px;
    transition:transform .55s cubic-bezier(.34,1.3,.5,1);
  }
  .half.top{
    top:0;
    border-radius:120px 120px 0 0;
    background:
      radial-gradient(circle at 34% 118%, rgba(255,255,255,.42) 0 18%, transparent 45%),
      radial-gradient(circle at 30% 30%, #ff6a5b 0 30%, transparent 62%),
      linear-gradient(180deg, #e8402f 0%, var(--red) 62%, #a81f12 100%);
    border-bottom:9px solid var(--box-border);
    transform:translateY(-70vh);
  }
  .half.bottom{
    bottom:0;
    border-radius:0 0 120px 120px;
    background:
      radial-gradient(circle at 32% -14%, rgba(255,255,255,.85) 0 20%, transparent 50%),
      linear-gradient(180deg, #ffffff 0%, #e9e4d2 55%, #b9b2a0 100%);
    border-top:9px solid var(--box-border);
    transform:translateY(70vh);
  }
  .closed .half.top{transform:translateY(0);}
  .closed .half.bottom{transform:translateY(0);}

  /* impacto ao fechar */
  @keyframes clunk{
    0%{transform:scale(1,1);}
    30%{transform:scale(1.06,.92);}
    60%{transform:scale(.97,1.04);}
    100%{transform:scale(1,1);}
  }
  .ball.clunk{animation:clunk .35s ease-out;}

  /* balanço de captura (Gen 1) */
  @keyframes wobble{
    0%,100%{transform:rotate(0);}
    20%{transform:rotate(-14deg);}
    45%{transform:rotate(11deg);}
    70%{transform:rotate(-5deg);}
  }
  .ball.wobble{animation:wobble .8s ease-in-out;}

  /* botão central */
  .button{
    position:absolute; top:50%; left:50%;
    width:62px; height:62px;
    transform:translate(-50%,-50%) scale(0);
    background:var(--box-border);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
    z-index:3;
  }
  .closed .button{transform:translate(-50%,-50%) scale(1);}
  .button::before{
    content:''; position:absolute;
    width:44px; height:44px; border-radius:50%;
    background:#f4f1e4;
    border:4px solid #cfc9b4;
  }
  .core{
    position:relative; z-index:2;
    width:22px; height:22px; border-radius:50%;
    background:#d8d3c0;
    transition:background .15s;
  }
  /* luz vermelha acesa */
  .core.lit{
    background:radial-gradient(circle at 38% 34%, #ffd9d3 0 22%, #ff5040 45%, var(--red) 100%);
    box-shadow:
      0 0 10px 4px rgba(255,70,50,.95),
      0 0 34px 14px rgba(255,60,40,.55),
      0 0 70px 30px rgba(255,50,30,.22);
  }
  @keyframes corePulse{
    0%,100%{box-shadow:0 0 10px 4px rgba(255,70,50,.95),0 0 34px 14px rgba(255,60,40,.55),0 0 70px 30px rgba(255,50,30,.22);}
    50%{box-shadow:0 0 6px 2px rgba(255,70,50,.55),0 0 18px 7px rgba(255,60,40,.3),0 0 36px 14px rgba(255,50,30,.12);}
  }
  .core.lit.pulse{animation:corePulse 1s ease-in-out infinite;}
  /* clarão final do botão */
  .core.burst{
    background:#fffdf2;
    box-shadow:
      0 0 16px 8px rgba(255,255,240,.95),
      0 0 60px 30px rgba(255,240,180,.6),
      0 0 120px 60px rgba(255,220,120,.3);
  }

  /* estrelas do sucesso */
  .star{
    position:absolute; top:50%; left:50%;
    font-size:26px; z-index:5;
    pointer-events:none;
    animation:fly .9s ease-out forwards;
  }
  @keyframes fly{
    0%{transform:translate(-50%,-50%) scale(.4) rotate(0); opacity:1;}
    100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.25) rotate(var(--rot)); opacity:0;}
  }

  /* flash branco de transição */
  #flash{
    position:fixed; inset:0; z-index:20;
    background:#fffdf2; opacity:0; pointer-events:none;
  }
  #flash.go{animation:flashout 1s ease-out forwards;}
  @keyframes flashout{0%{opacity:0;} 18%{opacity:1;} 100%{opacity:0;}}

  /* ============ TEXTO + BARRA DE LOADING ============ */
  .load-ui{
    display:flex; flex-direction:column; align-items:center; gap:16px;
    opacity:0; transform:translateY(8px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .load-ui.show{opacity:1; transform:translateY(0);}
  .load-label{
    font-family:'Press Start 2P', monospace;
    font-size:.62rem; color:#e8ebff; letter-spacing:1px;
  }
  .load-label .dots::after{
    content:''; animation:dots 1.2s steps(4) infinite;
  }
  @keyframes dots{
    0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} 100%{content:'';}
  }
  /* barra estilo HP */
  .hpbar{
    width:230px; padding:5px;
    background:var(--box);
    border:3px solid var(--box-border);
    border-radius:4px;
    box-shadow:4px 4px 0 rgba(0,0,0,.45);
  }
  .hpbar .track{
    height:12px; background:#ddd7c2; border-radius:2px; overflow:hidden;
  }
  .hpbar .fill{
    height:100%; width:0%;
    background:linear-gradient(180deg,#5dd07a,var(--green));
    transition:width .25s linear;
  }
  @media (prefers-reduced-motion: reduce){
    .half, .button{transition-duration:.01s;}
    .ball.clunk,.ball.wobble,.core.lit.pulse,.star{animation:none !important;}
  }
</style>
</head>
<body>

<!-- tela de login (revelada no fim) -->
<div id="login">
  <p class="eyebrow">DESAFIO DOS GINÁSIOS · GEN 1</p>
  <h1>JORNADA<br>KANTO</h1>
  <div class="box cursor">
    <p>Bem-vindo, treinador! Faça login para continuar sua jornada.</p>
    <button class="btn primary">Entrar com Google</button>
    <button class="btn">Entrar com e-mail</button>
  </div>
  <button class="replay" onclick="location.reload()">▶ assistir intro de novo</button>
</div>

<!-- sequência de boot -->
<div id="boot">
  <div class="stage">
    <div class="ball" id="ball">
      <div class="half top"></div>
      <div class="half bottom"></div>
      <div class="button"><div class="core" id="core"></div></div>
    </div>
  </div>
  <div class="load-ui" id="loadUi">
    <div class="load-label">CARREGANDO<span class="dots"></span></div>
    <div class="hpbar"><div class="track"><div class="fill" id="fill"></div></div></div>
  </div>
</div>

<div id="flash"></div>

<script>
  const ball   = document.getElementById('ball');
  const core   = document.getElementById('core');
  const loadUi = document.getElementById('loadUi');
  const fill   = document.getElementById('fill');
  const boot   = document.getElementById('boot');
  const flash  = document.getElementById('flash');
  const login  = document.getElementById('login');
  const wait   = ms => new Promise(r => setTimeout(r, ms));

  function stars(){
    for(let i=0;i<8;i++){
      const s = document.createElement('div');
      s.className = 'star';
      s.textContent = i%2 ? '✦' : '★';
      s.style.color = i%2 ? '#ffcb05' : '#fff5d6';
      const ang = (Math.PI*2/8)*i + 0.4;
      s.style.setProperty('--dx', Math.cos(ang)*150+'px');
      s.style.setProperty('--dy', Math.sin(ang)*150+'px');
      s.style.setProperty('--rot', (i%2? 160:-160)+'deg');
      document.querySelector('.stage').appendChild(s);
      setTimeout(()=>s.remove(), 1000);
    }
  }

  async function run(){
    await wait(450);

    // 1. metades fecham
    ball.parentElement.classList.add('closed');
    ball.classList.add('closed');
    document.querySelector('.stage').classList.add('closed');
    await wait(560);
    ball.classList.add('clunk');            // impacto
    await wait(380);

    // 2. luz vermelha acende + balanço de captura
    core.classList.add('lit');
    ball.classList.add('wobble');
    await wait(850);
    ball.classList.remove('wobble');
    core.classList.add('pulse');

    // 3. carregando (aqui, no jogo real, entra o await do Firebase)
    loadUi.classList.add('show');
    for(let p=0; p<=100; p+=4){
      fill.style.width = p+'%';
      await wait(90);
    }
    await wait(250);

    // 4. captura concluída: clarão + estrelas
    core.classList.remove('pulse');
    core.classList.add('burst');
    stars();
    await wait(450);
    flash.classList.add('go');
    await wait(320);

    // 5. revela o login
    boot.classList.add('gone');
    login.classList.add('show');
  }
  run();
</script>
</body>
</html>
