<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jornada Kanto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1024;
    --bg2:#141a35;
    --box:#fefbf0;
    --box-border:#1a1a2e;
    --ink:#1a1a2e;
    --muted:#6b6b80;
    --blue:#2a5fd6;
    --blue-dark:#1c3f96;
    --red:#d1291b;
    --red-dark:#8f1a10;
    --yellow:#ffcb05;
    --green:#2f9e44;
    --green-dark:#1f6b2f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.04) 1px, transparent 1px),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,0.03) 1px, transparent 1px),
      radial-gradient(circle at 40% 85%, rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(160deg, var(--bg), var(--bg2));
    background-size: 60px 60px, 80px 80px, 70px 70px, cover;
    font-family:'Inter', system-ui, sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:24px 12px 60px;
  }
  #app{width:100%;max-width:460px;}

  .eyebrow{
    font-family:'Press Start 2P', monospace;
    font-size:.55rem;
    letter-spacing:.5px;
    color:var(--yellow);
    text-align:center;
    margin:0 0 10px;
    opacity:.9;
  }

  .box{
    background:var(--box);
    border:3px solid var(--box-border);
    border-radius:4px;
    box-shadow:5px 5px 0 rgba(0,0,0,.45);
    padding:18px 16px;
    margin-bottom:16px;
    position:relative;
  }
  .box.cursor::after{
    content:'▼';
    position:absolute;
    right:14px;
    bottom:8px;
    font-size:.8rem;
    color:var(--box-border);
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  h1{
    font-family:'Press Start 2P', monospace;
    font-size:1.05rem;
    line-height:1.6;
    margin:0 0 10px;
    text-align:center;
    color:var(--box-border);
  }
  .jornada-title{
    font-family:'Press Start 2P', monospace;
    font-size:1.3rem;
    line-height:1.6;
    margin:0 0 22px;
    text-align:center;
    color:var(--yellow);
    text-shadow:3px 3px 0 var(--red-dark), 6px 6px 0 rgba(0,0,0,.4);
  }
  h2{
    font-family:'Press Start 2P', monospace;
    font-size:.8rem;
    line-height:1.7;
    margin:0 0 12px;
    color:var(--box-border);
  }
  p{font-size:.92rem;line-height:1.5;margin:0 0 12px;color:var(--ink);}
  p:last-child{margin-bottom:0;}
  strong{color:var(--blue-dark);}

  .btn{
    display:block;
    width:100%;
    padding:13px 14px;
    margin:9px 0;
    border:3px solid var(--box-border);
    border-radius:3px;
    background:#fff;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:.92rem;
    text-align:left;
    cursor:pointer;
    box-shadow:4px 4px 0 var(--box-border);
    transition:transform .05s, box-shadow .05s;
  }
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--box-border);}
  .btn:disabled{background:#e2e2e2;color:#9a9a9a;cursor:not-allowed;box-shadow:2px 2px 0 #b8b8b8;}
  .btn.primary{background:var(--blue);color:#fff;}
  .btn.danger{background:var(--red);color:#fff;text-align:center;font-size:1rem;}
  .btn.success{background:var(--green);color:#fff;}
  .btn.secondary{background:#e2e2e2;color:var(--ink);}
  .btn.selected{background:var(--yellow);border-color:var(--box-border);}
  .btn .mon-name{font-size:.98rem;font-weight:800;display:block;}
  .btn .mon-sub{font-size:.72rem;font-weight:600;opacity:.85;display:block;margin-top:3px;}

  .modal-overlay{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(12,16,36,0.75);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
  }
  .modal-box{
    background:var(--box);
    border:3px solid var(--box-border);
    border-radius:4px;
    box-shadow:6px 6px 0 rgba(0,0,0,.45);
    padding:22px 18px;
    max-width:380px;
    width:100%;
    text-align:center;
  }
  .modal-icon{font-size:2rem;margin-bottom:6px;}
  .modal-box h2{margin:0 0 10px;}
  .modal-box p{margin-bottom:14px;}
  .modal-box .btn{text-align:center;}

  .type-pill{
    display:inline-block;
    padding:2px 7px;
    border-radius:3px;
    font-size:.62rem;
    font-weight:800;
    color:#fff;
    margin-right:4px;
    text-shadow:0 1px 1px rgba(0,0,0,.35);
    letter-spacing:.3px;
    text-transform:uppercase;
  }

  .pool-badge{
    font-family:'Press Start 2P', monospace;
    text-align:center;
    font-size:.85rem;
    color:var(--blue-dark);
    background:#e9edfc;
    border:2px solid var(--blue-dark);
    border-radius:3px;
    padding:8px;
    margin:4px 0 14px;
  }
  .pool-badge-main{font-size:.85rem;}
  .pool-badge-sub{font-size:.6rem;text-align:center;margin-top:6px;}

  .level-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:2px dashed #ddd7c2;
    gap:8px;
  }
  .level-row:last-of-type{border-bottom:none;}
  .level-info .mon-name{font-weight:800;font-size:.92rem;}
  .level-info .mon-sub{font-size:.7rem;color:var(--muted);font-weight:700;}
  .level-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .circle-btn{
    width:32px;height:32px;border-radius:50%;
    border:2px solid var(--box-border);
    background:var(--blue);color:#fff;
    font-size:1.1rem;font-weight:800;line-height:1;
    cursor:pointer;box-shadow:2px 2px 0 var(--box-border);
  }
  .circle-btn:active:not(:disabled){transform:translate(1px,1px);box-shadow:none;}
  .circle-btn:disabled{background:#d8d8d8;border-color:#b8b8b8;box-shadow:none;cursor:not-allowed;}
  .alloc-num{font-family:'Press Start 2P', monospace;font-size:.75rem;width:20px;text-align:center;}

  .attempts{
    font-size:.75rem;
    font-weight:700;
    color:var(--red-dark);
    text-align:center;
    background:#ffe9e6;
    border:2px solid var(--red-dark);
    border-radius:3px;
    padding:6px;
    margin-bottom:12px;
  }

  .team-mini{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;}
  .team-chip{
    background:#eef0f7;
    border:2px solid var(--box-border);
    border-radius:3px;
    padding:6px 9px;
    font-size:.72rem;
    font-weight:700;
  }

  .hp-bar-wrap{margin-top:8px;width:100%;}
  .hp-bar-track{
    background:#e2e2e2;
    border:2px solid var(--box-border);
    border-radius:6px;
    height:12px;
    overflow:hidden;
  }
  .hp-bar-fill{
    height:100%;
    transition:width .8s ease-out, background-color .5s ease-out;
  }
  .hp-bar-fill.hp-high{background:var(--green-dark);}
  .hp-bar-fill.hp-mid{background:#f5a623;}
  .hp-bar-fill.hp-low{background:var(--red);}
  .hp-bar-label{
    font-size:.62rem;
    color:var(--muted);
    margin-top:3px;
    text-align:center;
    font-weight:700;
  }

  .team-alive-row{display:flex;justify-content:space-between;gap:8px;margin:10px 0;flex-wrap:wrap;}
  .team-alive-chip{
    background:#eef0f7;
    border:2px solid var(--box-border);
    border-radius:3px;
    padding:5px 9px;
    font-size:.68rem;
    font-weight:700;
    flex:1;
    text-align:center;
  }

  .battle-vs{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin:14px 0 10px;
  }
  .fighter{flex:1;text-align:center;font-weight:800;font-size:.85rem;}
  .fighter-emoji{font-size:1.9rem;line-height:1.2;margin-bottom:2px;}
  .fighter-types{margin:3px 0 6px; display:flex; justify-content:center; flex-wrap:wrap; gap:2px;}
  .fighter-types .type-pill{margin-right:0;}
  .fighter-level{display:block;font-size:.68rem;color:var(--muted);font-weight:700;margin-top:1px;}
  .vs-swords{font-size:1.4rem;display:inline-block;}
  .vs-swords.spin{animation:swordSpin .9s linear infinite;}
  @keyframes swordSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .loading-dots{display:flex;justify-content:center;gap:6px;margin:16px 0 8px;}
  .loading-dots span{
    width:8px;height:8px;border-radius:50%;
    background:var(--box-border);
    animation:dotPulse 1s infinite ease-in-out;
  }
  .loading-dots span:nth-child(2){animation-delay:.15s;}
  .loading-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes dotPulse{0%,80%,100%{opacity:.25;transform:scale(.7);} 40%{opacity:1;transform:scale(1);}}
  .loading-text{text-align:center;font-size:.78rem;color:var(--muted);margin:0;}
  .battle-result-line{text-align:center;font-size:1rem;margin:14px 0 0;}
  .sudden-death-note{
    display:inline-block;
    margin-top:6px;
    font-size:.72rem;
    font-weight:700;
    color:#a15c00;
    font-style:italic;
  }

  .order-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:2px dashed #ddd7c2;
  }
  .order-row:last-of-type{border-bottom:none;}
  .order-num{
    font-family:'Press Start 2P', monospace;
    font-size:.75rem;
    color:var(--blue-dark);
    width:28px;
    flex-shrink:0;
    text-align:center;
  }
  .order-info{flex:1;min-width:0;}
  .order-info .mon-name{font-weight:800;font-size:.9rem;display:block;}
  .order-info .mon-sub{font-size:.7rem;display:block;margin-top:2px;}
  .order-controls{display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
  .order-controls .circle-btn{width:28px;height:28px;font-size:.85rem;}

  .status-list{margin:6px 0 4px;}
  .matchup-row{
    padding:7px 0;
    font-size:.85rem;
    font-weight:600;
    border-bottom:1px dashed #ddd7c2;
  }
  .matchup-row:last-child{border-bottom:none;}
  .matchup-row .vs{color:var(--muted);font-weight:800;margin:0 2px;}
  .win-text{color:var(--green-dark);font-weight:800;}
  .lose-text{color:var(--red-dark);font-weight:800;}
  .status-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 0;
    font-size:.85rem;
    font-weight:700;
    border-bottom:1px dashed #ddd7c2;
  }
  .status-row:last-child{border-bottom:none;}
  .status-row .icon{font-size:1.05rem;}
  .status-row.fainted{color:#9a9a9a;text-decoration:line-through;}
  .league-history-btn{
    display:inline-block;
    width:auto;
    margin:0 0 0 auto;
    padding:6px 10px;
    border:2px solid var(--box-border);
    border-radius:3px;
    background:#fff;
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:.7rem;
    cursor:pointer;
    box-shadow:2px 2px 0 var(--box-border);
    white-space:nowrap;
    flex-shrink:0;
  }
  .league-history-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--box-border);}
  .league-history-btn.danger{border-color:var(--red-dark);color:var(--red-dark);}

  .home-header{text-align:center;margin-bottom:18px;}
  .home-title{
    font-family:'Press Start 2P', monospace;
    font-size:1rem;
    color:var(--yellow);
    letter-spacing:1px;
    margin-bottom:8px;
    text-shadow:2px 2px 0 rgba(0,0,0,.35);
  }
  .home-tagline{font-size:.78rem;color:#b8bcd9;font-weight:600;}

  .home-menu-row{display:flex;gap:10px;margin-bottom:20px;}
  .home-menu-card{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    padding:16px 8px 14px;
    border:3px solid var(--box-border);
    border-top-width:6px;
    border-radius:4px;
    background:var(--box);
    box-shadow:4px 4px 0 rgba(0,0,0,.4);
    cursor:pointer;
    font-family:'Inter', sans-serif;
  }
  .home-menu-card.pokedex{border-top-color:var(--red);}
  .home-menu-card.achievements{border-top-color:var(--yellow);}
  .home-menu-card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.4);}
  .home-menu-icon{font-size:1.7rem;line-height:1;}
  .home-menu-title{font-family:'Press Start 2P', monospace;font-size:.62rem;color:var(--ink);}
  .home-menu-stat{font-size:.64rem;font-weight:700;color:var(--muted);}

  .home-section-label{
    font-family:'Press Start 2P', monospace;
    font-size:.6rem;
    color:var(--yellow);
    opacity:.85;
    margin:6px 4px 10px;
    letter-spacing:.5px;
  }
  .league-wins-total-box{display:flex;align-items:center;gap:14px;}
  .league-wins-total-icon{font-size:2.2rem;flex-shrink:0;}
  .league-wins-total-num{font-family:'Press Start 2P', monospace;font-size:1.5rem;color:var(--blue-dark);line-height:1;}
  .league-wins-total-label{font-size:.72rem;color:var(--muted);font-weight:700;margin-top:4px;}
  .leaderboard-list{display:flex;flex-direction:column;gap:6px;}
  .leaderboard-row{
    display:flex;align-items:center;gap:10px;
    padding:7px 10px;
    background:#fdf6e3;
    border:2px solid var(--box-border);
    border-radius:3px;
  }
  .leaderboard-rank{font-family:'Press Start 2P', monospace;font-size:.68rem;color:var(--blue-dark);width:28px;flex-shrink:0;}
  .leaderboard-name{flex:1;font-weight:800;font-size:.85rem;color:var(--ink);}
  .leaderboard-count{font-weight:800;font-size:.8rem;color:var(--red-dark);flex-shrink:0;}

  .save-slot-card{
    display:block;
    width:100%;
    background:var(--box);
    border:3px solid var(--box-border);
    border-radius:4px;
    box-shadow:4px 4px 0 rgba(0,0,0,.4);
    padding:12px 16px;
    margin-bottom:10px;
    font-family:'Inter', sans-serif;
    text-align:left;
  }
  .save-slot-card.complete{border-color:#b88c00;box-shadow:4px 4px 0 rgba(184,140,0,.4);}
  .save-slot-card.empty{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-style:dashed;
    box-shadow:none;
    background:rgba(254,251,240,.07);
    border-color:#5c6089;
    cursor:pointer;
  }
  .save-slot-empty-text{font-size:.82rem;font-weight:700;color:#c7cae8;}
  .save-slot-add{font-family:'Inter',sans-serif;font-weight:800;font-size:.8rem;color:#89aaff;}
  .save-slot-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .save-slot-name{font-size:.92rem;font-weight:800;color:var(--ink);}
  .save-slot-actions{display:flex;gap:6px;flex-shrink:0;}
  .save-slot-team-btn{
    background:#eaf0ff;
    border:2px solid var(--blue-dark);
    border-radius:3px;
    color:var(--blue-dark);
    font-size:.85rem;
    cursor:pointer;
    padding:5px 8px;
    line-height:1;
  }
  .save-slot-team-btn:active{transform:translate(1px,1px);}
  .save-slot-delete{
    background:#fdeceb;
    border:2px solid var(--red-dark);
    border-radius:3px;
    color:var(--red-dark);
    font-size:.85rem;
    cursor:pointer;
    opacity:1;
    padding:5px 8px;
    line-height:1;
  }
  .save-slot-delete:active{transform:translate(1px,1px);}
  .badge-pip-row{display:flex;gap:4px;margin-bottom:11px;}
  .badge-pip{width:11px;height:11px;border-radius:50%;border:2px solid var(--box-border);background:transparent;flex-shrink:0;}
  .badge-pip.filled{background:var(--yellow);}
  .save-slot-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .save-slot-progress{font-size:.68rem;font-weight:700;color:var(--muted);}
  .save-slot-continue{
    padding:8px 16px;
    border:2px solid var(--box-border);
    border-radius:3px;
    background:var(--blue);
    color:#fff;
    font-weight:800;
    font-size:.75rem;
    cursor:pointer;
    box-shadow:2px 2px 0 var(--box-border);
    flex-shrink:0;
  }
  .save-slot-continue:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--box-border);}

  .pokedex-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(52px,1fr));
    gap:6px;
  }
  .pokedex-cell{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid var(--box-border);
    border-radius:3px;
    background:#fff;
  }
  .pokedex-cell.unknown{background:#e8e4d0;opacity:.6;}
  .pokedex-cell.mystery{
    background:linear-gradient(135deg,#2b2f5c,#4a2f6b);
    border-color:#9b6bd6;
    cursor:pointer;
    box-shadow:0 0 8px rgba(155,107,214,.6);
  }
  .pokedex-mystery{font-size:1.2rem;color:#e8d9ff;}
  .pokedex-owned-badge{font-size:.85rem;}
  .pokedex-cell.caught{background:#fff;}
  .pokedex-number{font-size:.55rem;font-weight:800;color:var(--muted);}

  .achievement-row{align-items:flex-start;}
  .achievement-row.locked{opacity:.45;}
  .achievement-text{font-size:.78rem;}
  .achievement-desc{font-size:.68rem;font-weight:600;color:var(--muted);}

  .status-row .tag{
    margin-left:auto;
    font-size:.65rem;
    font-weight:800;
    text-decoration:none;
    padding:2px 7px;
    border-radius:3px;
    letter-spacing:.3px;
    text-transform:uppercase;
  }
  .tag.alive{background:#d3f9d8;color:var(--green-dark);}
  .tag.dead{background:#ffe3e3;color:var(--red-dark);}

  .result-banner{
    font-family:'Press Start 2P', monospace;
    text-align:center;
    padding:14px 10px;
    border:3px solid var(--box-border);
    border-radius:3px;
    font-size:.8rem;
    line-height:1.8;
    margin-bottom:14px;
  }
  .result-banner.win{background:#d3f9d8;color:var(--green-dark);}
  .result-banner.lose{background:#ffe3e3;color:var(--red-dark);}

  .badges-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .badge-chip{
    background:#fff9db;
    border:2px solid var(--yellow);
    border-radius:3px;
    padding:8px 12px;
    font-size:.78rem;
    font-weight:800;
    box-shadow:2px 2px 0 var(--box-border);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .badge-chip-img{width:22px;height:22px;object-fit:contain;flex-shrink:0;}

  .faint-xp-note{
    background:#fff9db;
    border:2px solid var(--yellow);
    border-radius:3px;
    padding:8px 10px;
    font-size:.78rem;
    margin:0 0 10px;
  }

  .badge-earned{
    text-align:center;
    background:#fff9db;
    border:3px solid var(--yellow);
    border-radius:4px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:4px 4px 0 var(--box-border);
  }
  .badge-earned .badge-icon{font-size:2.4rem;}
  .badge-sprite-img{width:72px;height:72px;object-fit:contain;margin:0 auto 6px;display:block;}
  .badge-earned .badge-text{
    font-family:'Press Start 2P', monospace;
    font-size:.78rem;
    line-height:1.9;
    color:var(--box-border);
    margin-top:8px;
  }

  .trainer-code-box{
    font-family:'Inter', monospace;
    font-size:.8rem;
    word-break:break-all;
    background:#f1f3f5;
    border:2px solid var(--box-border);
    border-radius:3px;
    padding:10px;
    margin:8px 0;
    user-select:all;
    cursor:text;
  }
  .code-input{
    width:100%;
    min-height:70px;
    font-family:'Inter', monospace;
    font-size:.85rem;
    border:2px solid var(--box-border);
    border-radius:3px;
    padding:8px;
    margin:8px 0;
    resize:vertical;
    box-sizing:border-box;
  }
  .error-text{color:var(--red-dark);font-size:.8rem;font-weight:700;margin:4px 0 8px;}
  .hint-text{color:var(--blue-dark);font-size:.78rem;font-weight:700;margin:4px 0 8px;}

  .league-match{
    border:2px dashed #ddd7c2;
    border-radius:3px;
    padding:8px 10px;

  /* ============ INTRO POKÉBOLA (toca uma vez a cada carregamento da página) ============ */
  #boot{
    position:fixed; inset:0; z-index:9999;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:38px;
    background:linear-gradient(160deg, var(--bg), var(--bg2));
  }
  #boot.gone{display:none;}
  .intro-stage{
    width:240px; height:240px;
    position:relative;
    filter:drop-shadow(0 18px 22px rgba(0,0,0,.55));
  }
  .intro-ball{ position:absolute; inset:0; transform-origin:50% 88%; }
  .intro-half{
    position:absolute; left:0; width:240px; height:120px;
    transition:transform .55s cubic-bezier(.34,1.3,.5,1);
  }
  .intro-half.top{
    top:0; border-radius:120px 120px 0 0;
    background:
      radial-gradient(circle at 34% 118%, rgba(255,255,255,.42) 0 18%, transparent 45%),
      radial-gradient(circle at 30% 30%, #ff6a5b 0 30%, transparent 62%),
      linear-gradient(180deg, #e8402f 0%, var(--red) 62%, #a81f12 100%);
    border-bottom:9px solid var(--box-border);
    transform:translateY(-70vh);
  }
  .intro-half.bottom{
    bottom:0; border-radius:0 0 120px 120px;
    background:
      radial-gradient(circle at 32% -14%, rgba(255,255,255,.85) 0 20%, transparent 50%),
      linear-gradient(180deg, #ffffff 0%, #e9e4d2 55%, #b9b2a0 100%);
    border-top:9px solid var(--box-border);
    transform:translateY(70vh);
  }
  .intro-stage.closed .intro-half.top{transform:translateY(0);}
  .intro-stage.closed .intro-half.bottom{transform:translateY(0);}
  @keyframes introClunk{
    0%{transform:scale(1,1);} 30%{transform:scale(1.06,.92);} 60%{transform:scale(.97,1.04);} 100%{transform:scale(1,1);}
  }
  .intro-ball.clunk{animation:introClunk .35s ease-out;}
  @keyframes introWobble{
    0%,100%{transform:rotate(0);} 20%{transform:rotate(-14deg);} 45%{transform:rotate(11deg);} 70%{transform:rotate(-5deg);}
  }
  .intro-ball.wobble{animation:introWobble .8s ease-in-out;}
  .intro-button{
    position:absolute; top:50%; left:50%;
    width:62px; height:62px;
    transform:translate(-50%,-50%) scale(0);
    background:var(--box-border);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
    z-index:3;
  }
  .intro-stage.closed .intro-button{transform:translate(-50%,-50%) scale(1);}
  .intro-button::before{
    content:''; position:absolute;
    width:44px; height:44px; border-radius:50%;
    background:#f4f1e4; border:4px solid #cfc9b4;
  }
  .intro-core{
    position:relative; z-index:2;
    width:22px; height:22px; border-radius:50%;
    background:#d8d3c0;
    transition:background .15s;
  }
  .intro-core.lit{
    background:radial-gradient(circle at 38% 34%, #ffd9d3 0 22%, #ff5040 45%, var(--red) 100%);
    box-shadow:0 0 10px 4px rgba(255,70,50,.95), 0 0 34px 14px rgba(255,60,40,.55), 0 0 70px 30px rgba(255,50,30,.22);
  }
  @keyframes introCorePulse{
    0%,100%{box-shadow:0 0 10px 4px rgba(255,70,50,.95),0 0 34px 14px rgba(255,60,40,.55),0 0 70px 30px rgba(255,50,30,.22);}
    50%{box-shadow:0 0 6px 2px rgba(255,70,50,.55),0 0 18px 7px rgba(255,60,40,.3),0 0 36px 14px rgba(255,50,30,.12);}
  }
  .intro-core.lit.pulse{animation:introCorePulse 1s ease-in-out infinite;}
  .intro-core.burst{
    background:#fffdf2;
    box-shadow:0 0 16px 8px rgba(255,255,240,.95), 0 0 60px 30px rgba(255,240,180,.6), 0 0 120px 60px rgba(255,220,120,.3);
  }
  .intro-star{
    position:absolute; top:50%; left:50%;
    font-size:26px; z-index:5; pointer-events:none;
    animation:introFly .9s ease-out forwards;
  }
  @keyframes introFly{
    0%{transform:translate(-50%,-50%) scale(.4) rotate(0); opacity:1;}
    100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.25) rotate(var(--rot)); opacity:0;}
  }
  #introFlash{
    position:fixed; inset:0; z-index:10000;
    background:#fffdf2; opacity:0; pointer-events:none;
  }
  #introFlash.go{animation:introFlashout 1s ease-out forwards;}
  @keyframes introFlashout{0%{opacity:0;} 18%{opacity:1;} 100%{opacity:0;}}
  .intro-load-ui{
    display:flex; flex-direction:column; align-items:center; gap:16px;
    opacity:0; transform:translateY(8px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .intro-load-ui.show{opacity:1; transform:translateY(0);}
  .intro-load-label{
    font-family:'Press Start 2P', monospace;
    font-size:.62rem; color:#e8ebff; letter-spacing:1px;
  }
  .intro-load-label .dots::after{
    content:''; animation:introDots 1.2s steps(4) infinite;
  }
  @keyframes introDots{
    0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} 100%{content:'';}
  }
  .intro-hpbar{
    width:230px; padding:5px;
    background:var(--box);
    border:3px solid var(--box-border);
    border-radius:4px;
    box-shadow:4px 4px 0 rgba(0,0,0,.45);
  }
  .intro-hpbar .track{ height:12px; background:#ddd7c2; border-radius:2px; overflow:hidden; }
  .intro-hpbar .fill{
    height:100%; width:0%;
    background:linear-gradient(180deg,#5dd07a,var(--green));
    transition:width .25s linear;
  }
  @media (prefers-reduced-motion: reduce){
    .intro-half, .intro-button{transition-duration:.01s;}
    .intro-ball.clunk, .intro-ball.wobble, .intro-core.lit.pulse, .intro-star{animation:none !important;}
  }

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function randomInt(min, max){
  return min + Math.floor(Math.random()*(max-min+1));
}

async function loadPermanentUserData(){
  if(!game.authUser) return;
  try{
    const snap = await userDocRef(game.authUser.uid).get();
    const d = snap.exists ? snap.data() : {};
    const permanent = new Set(d.pokedexCaught || []);
    // reconciliação: além do registro individual feito a cada captura (markCaught -> syncPermanentPokedex),
    // isso aqui é uma rede de segurança que roda TODA VEZ -- une o que já estiver nos saves atuais com o
    // registro permanente da conta. Antes isso só rodava uma única vez (só se o registro permanente estivesse
    // vazio), então qualquer captura "antiga" (de antes da sincronização individual existir, ou perdida por
    // alguma falha de rede pontual) nunca era migrada -- e ao apagar aquele save, a espécie sumia de vez
    let changed = false;
    (game.saveSlots||[]).forEach(s=>{
      if(s && s.caughtSpecies){
        s.caughtSpecies.forEach(id=>{ if(!permanent.has(id)){ permanent.add(id); changed = true; } });
      }
    });
    if(changed){
      await userDocRef(game.authUser.uid).set({ pokedexCaught: [...permanent] }, { merge: true });
    }
    game.permanentPokedex = [...permanent];
    game.leagueWinsTotal = d.leagueWinsTotal || 0;
    game.leagueWinsBySlot = d.leagueWinsBySlot || {};
  } catch(e){ console.error('Erro ao carregar dados permanentes da conta:', e); }
}
async function recordLeagueChampionWin(name, uid, slot){

  // outro jogador (ou ninguém) que resolveu essa partida, essa escrita é responsabilidade da Cloud Function

  if(uid && game.authUser && game.authUser.uid===uid){

}
async function recordLeaguePlacement(uid, slot, record){
  // grava a colocação final (Campeão, Vice, etc.) direto na conta do jogador, assim que a Liga termina --
  // isso evita ter que vasculhar várias Ligas depois só pra montar a lista "Suas últimas Ligas".
  // IMPORTANTE: guardado por SLOT (personagem), não só por conta -- uma mesma conta pode ter vários saves,
  // cada um com seu próprio treinador, e cada um pode ter uma trajetória bem diferente na Liga (inclusive
  // podendo se enfrentar entre si na mesma Liga, então misturar tudo numa lista só faria um sobrescrever o outro).
  if(!uid || slot==null) return;
  // mesma restrição de segurança do restante da Liga: o cliente só grava na PRÓPRIA conta; se foi outro
  // navegador (ou ninguém) que processou essa Liga, a Cloud Function cobre isso com privilégio de admin
  if(!game.authUser || game.authUser.uid !== uid) return;
  try{
    const ref = userDocRef(uid);
    const snap = await ref.get();
    const bySlot = (snap.exists && snap.data().leaguePlacementsBySlot) ? snap.data().leaguePlacementsBySlot : {};
    const slotKey = String(slot);
    const current = bySlot[slotKey] || [];
    if(current.some(p=>p.cycleId===record.cycleId && p.leagueId===record.leagueId)) return; // já registrado, evita duplicar
    const updated = [record, ...current].sort((a,b)=>b.cycleTime-a.cycleTime).slice(0, 12);
    await ref.set({ leaguePlacementsBySlot: { [slotKey]: updated } }, { merge: true });
    if(game.currentSaveSlot===slot){ game.myLeagueHistory = updated; }
  } catch(e){ console.error('Erro ao gravar colocação na Liga:', e); }
}
async function reconcileLeagueWinsFromHistory(){
  // rede de segurança: se por algum motivo a Cloud Function não rodou (ex: não foi implantada ainda) e
  // ninguém logado na própria conta processou a Final, o total da conta pode ficar desatualizado mesmo
  // com o ranking global correto. Isso corrige comparando com o histórico retido da Liga (até 12 ciclos).
  // aproveita a MESMA varredura pra também preencher retroativamente colocações de antes dessa funcionalidade existir.
  if(!game.authUser) return;
  try{
    const [scheduleSnap, userSnapEarly] = await Promise.all([scheduleDocRef().get(), userDocRef(game.authUser.uid).get()]);
    if(!scheduleSnap.exists) return;
    // marca, por slot, a partir de quando um save "conta" pra esse slot -- criado quando um save novo é
    // iniciado num slot reaproveitado (de um save apagado). Sem isso, essa mesma varredura (que busca por
    // UID da conta, não por save específico) ficaria ressuscitando pra sempre as Ligas do save antigo
    const slotResetAt = (userSnapEarly.exists && userSnapEarly.data().leagueSlotResetAt) ? userSnapEarly.data().leagueSlotResetAt : {};
    const completedEntries = (scheduleSnap.data().cycles||[]).filter(c=>c.status==='complete');
    const winsBySlotFromHistory = {};
    let totalFromHistory = 0;
    const backfillPlacementsBySlot = {};
    // busca todos os ciclos concluídos em paralelo, em vez de um de cada vez -- bem mais rápido
    const detailSnaps = await Promise.all(completedEntries.map(entry=>cycleDocRef(entry.id).get().catch(()=>null)));
    for(let i=0;i<completedEntries.length;i++){
      const entry = completedEntries[i];
      const detailSnap = detailSnaps[i];
      if(!detailSnap || !detailSnap.exists) continue;
      const cycleTime = entry.scheduledTime!=null ? entry.scheduledTime : Number(entry.id) || 0;
      for(const league of (detailSnap.data().leagues||[])){
        if(league.champion && league.champion.uid===game.authUser.uid){
          const slotKey = String(league.champion.slot);
          // o total "vitalício" da conta soma tudo, mas a contagem POR SLOT não conta vitórias de antes do
          // save atual desse slot ter começado (senão um save novo herdaria vitórias do save antigo apagado)
          if(cycleTime >= (slotResetAt[slotKey]||0)){
            winsBySlotFromHistory[slotKey] = (winsBySlotFromHistory[slotKey]||0) + 1;
          }
          totalFromHistory++;
        }
        // usa filter, não find -- a MESMA conta pode ter mais de um personagem (save) nessa Liga
        // (podem até ter se enfrentado entre si), então cada um precisa da própria colocação registrada
        const myParticipants = (league.rounds['0']||[]).flatMap(m=>[m.a,m.b]).filter(p=>p && p.uid===game.authUser.uid);
        for(const participant of myParticipants){
          if(participant.slot==null) continue;
          const slotKey = String(participant.slot);
          if(cycleTime < (slotResetAt[slotKey]||0)) continue; // pertence a um save antigo já apagado desse slot
          const placement = computePlacement(league, participant.name);
          if(placement){
            if(!backfillPlacementsBySlot[slotKey]) backfillPlacementsBySlot[slotKey] = [];
            // alguns ciclos antigos (de antes desse campo existir, ou de uma migração) podem estar sem
            // "scheduledTime"/"size" -- o Firestore recusa gravar "undefined", então sem esse fallback
            // um único registro velho malformado quebrava a gravação de TODO o histórico, não só o dele
            const leagueSize = league.size!=null ? league.size : ((league.rounds['0']||[]).length * 2 || REGULAR_LIGA_SIZE);
            backfillPlacementsBySlot[slotKey].push({ cycleId: entry.id, cycleTime, leagueId: league.id, leagueSize, placement });
          }
        }
      }
    }
    const currentTotal = game.leagueWinsTotal || 0;
    const currentBySlot = game.leagueWinsBySlot || {};
    const mergedBySlot = { ...currentBySlot };
    let needsUpdate = totalFromHistory > currentTotal;
    for(const slotKey in winsBySlotFromHistory){
      if(winsBySlotFromHistory[slotKey] > (currentBySlot[slotKey]||0)){
        mergedBySlot[slotKey] = winsBySlotFromHistory[slotKey];
        needsUpdate = true;
      }
    }
    const backfillSlotKeys = Object.keys(backfillPlacementsBySlot);
    if(backfillSlotKeys.length>0){
      const existingBySlot = (userSnapEarly.exists && userSnapEarly.data().leaguePlacementsBySlot) ? userSnapEarly.data().leaguePlacementsBySlot : {};
      const mergedPlacementsBySlot = {};
      let anyNew = false;
      for(const slotKey of backfillSlotKeys){
        const existing = existingBySlot[slotKey] || [];
        const existingKeys = new Set(existing.map(p=>p.cycleId+'-'+p.leagueId));
        const newOnes = backfillPlacementsBySlot[slotKey].filter(p=>!existingKeys.has(p.cycleId+'-'+p.leagueId));
        if(newOnes.length>0){
          mergedPlacementsBySlot[slotKey] = [...existing, ...newOnes].sort((a,b)=>b.cycleTime-a.cycleTime).slice(0,12);
          anyNew = true;
        }
      }
      if(anyNew){
        await userDocRef(game.authUser.uid).set({ leaguePlacementsBySlot: mergedPlacementsBySlot }, { merge: true });
        if(mergedPlacementsBySlot[String(game.currentSaveSlot)]){ game.myLeagueHistory = mergedPlacementsBySlot[String(game.currentSaveSlot)]; }
      }
    }
    if(needsUpdate){
      const newTotal = Math.max(currentTotal, totalFromHistory);
      await userDocRef(game.authUser.uid).set({ leagueWinsTotal: newTotal, leagueWinsBySlot: mergedBySlot }, { merge: true });
      game.leagueWinsTotal = newTotal;
      game.leagueWinsBySlot = mergedBySlot;
    }
  } catch(e){ console.error('Erro ao reconciliar vitórias da Liga:', e); }
}

function tryEvolve(p){
  const events = [];
  let currentId = p.speciesId;
  while(EVOLUTIONS[currentId] && p.level >= EVOLUTIONS[currentId].level){
    const step = EVOLUTIONS[currentId];
    const fromSp = SPECIES[currentId];
    const toSp = SPECIES[step.into];
    events.push({ fromName:fromSp.name, toName:toSp.name, atLevel:step.level, toSpeciesId:step.into });
    currentId = step.into;
    markCaught(currentId);
  }
  if(currentId !== p.speciesId){
    const newSp = SPECIES[currentId];
    p.speciesId = currentId;
    p.name = newSp.name;
    p.types = newSp.types;
    p.baseHp = newSp.hp;
    p.attack = newSp.attack;
    p.defense = newSp.defense;
    p.speed = newSp.speed;
  }
  return events;
}

function typeVsType(atk, def){
  const chart = TYPE_CHART[atk];
  if(!chart) return 1;
  const val = chart[def];
  return (val === undefined) ? 1 : val;
}
function bestMultiplier(atkTypes, defTypes){
  let best = 0;
  atkTypes.forEach(a=>{
    let m = 1;
    defTypes.forEach(d=> m *= typeVsType(a,d));
    if(m > best) best = m;
  });
  return best;
}
function multiplierForType(atkType, defTypes){
  let m = 1;
  defTypes.forEach(d=> m *= typeVsType(atkType, d));
  return m;
}
// doc 02 §4.2 -- antes o atacante SEMPRE usava o melhor tipo dele, o que fazia dual-type ser
// estritamente melhor que mono-type, sem nenhum lado ruim. Agora ele "escolhe o golpe" a cada
// confronto: 70% das vezes usa o tipo mais eficaz, 30% usa o outro. Dual-type continua bom,
// mas deixa de ser dominante automático.
const DUAL_TYPE_BEST_CHANCE = 0.70;
function rolledMultiplier(atkTypes, defTypes, rng){
  if(atkTypes.length < 2) return multiplierForType(atkTypes[0], defTypes);
  const mults = atkTypes.map(t=>multiplierForType(t, defTypes));
  const bestIdx = mults[0] >= mults[1] ? 0 : 1;
  const otherIdx = 1 - bestIdx;
  return (rng() < DUAL_TYPE_BEST_CHANCE) ? mults[bestIdx] : mults[otherIdx];
}
function calcDamage(attacker, defender, rng){
  rng = rng || Math.random;
  const mult = rolledMultiplier(attacker.types, defender.types, rng);
  const base = (attacker.level*2.5 + attacker.attack/6) * (attacker.dmgBonus || 1);
  let defense = Math.pow(defender.defense/70, 0.7); // 70 = referência (média de defesa da Gen 1); quanto maior a defesa do defensor, mais ele resiste
  const wins = defender.winsThisBattle||0;
  if(wins > 0){
    // depois da primeira vitória na mesma batalha, o pokémon fica mais vulnerável conforme o HP cai --
    // e quanto mais vitórias seguidas já acumulou nessa mesma batalha, mais forte fica essa vulnerabilidade
    // (1 vitória mal pesa; um pokémon que já venceu 3-4 vezes seguidas fica bem mais frágil no fim da sequência)
    const defHpPct = defender.hp / defender.maxHp;
    const minDefenseFactor = Math.max(0.1, 1 - wins*0.35);
    defense = defense * (minDefenseFactor + (1-minDefenseFactor) * defHpPct);
  }
  let levelFactor = 1 + (attacker.level - defender.level) * 0.033; // level pesa mais, pra evitar que o desmaio acumulado de lutas anteriores deixe o pokémon indefeso demais depois
  levelFactor = Math.max(0.45, Math.min(2.8, levelFactor));
  const dmg = Math.round((base * mult / defense) * levelFactor * (0.75 + rng()*0.5));
  return Math.max(1, dmg);
}
function effText(mult){
  if(mult >= 4) return ' Foi EXTREMAMENTE eficaz!! 💥';
  if(mult > 1) return ' Foi super eficaz!';
  if(mult < 1) return ' Não foi muito eficaz...';
  return '';
}

// doc 02 §4.1 -- Speed decide quem bate primeiro. Não é determinístico de propósito: a chance de
// sair na frente é proporcional à diferença de velocidade, então o rápido leva vantagem real
// (pode nocautear antes de apanhar) sem que o lento vire estatueta. Empate = 50/50.
function firstStrikeChance(a, b){
  const sa = a.speed || 50, sb = b.speed || 50;
  return 0.5 + 0.5 * ((sa - sb) / (sa + sb));
}
function doExchange(active, enemy, rng){
  rng = rng || Math.random;
  const activeFirst = rng() < firstStrikeChance(active, enemy);
  const first = activeFirst ? active : enemy;
  const second = activeFirst ? enemy : active;
  const dmgFromFirst = calcDamage(first, second, rng);
  second.hp = Math.max(0, second.hp - dmgFromFirst);
  if(second.hp <= 0){ return; } // desmaiou antes de revidar -- essa é a recompensa de ser rápido
  const dmgFromSecond = calcDamage(second, first, rng);
  first.hp = Math.max(0, first.hp - dmgFromSecond);
}
/* ---------------------------------------------------
   BÔNUS PASSIVOS DO TIME (doc 02 §3 insígnias e §4.5 diversidade)
   Aplicados como multiplicador de dano em cada pokémon do jogador antes da batalha.
--------------------------------------------------- */
function badgeDamageBonus(badgeCount){
  return Math.min(8, badgeCount||0) * 0.01; // +1% por insígnia, cap +8%
}
function diversityDamageBonus(team){
  const types = new Set();
  team.forEach(p=> (p.types||[]).forEach(t=>types.add(t)));
  return Math.min(6, types.size) * 0.02; // +2% por tipo único, cap +12%
}
function applyTeamBonuses(team, badgeCount){
  const bonus = 1 + badgeDamageBonus(badgeCount) + diversityDamageBonus(team);
  team.forEach(p=>{ p.dmgBonus = bonus; });
  return bonus;
}

function buildResult(team, brockTeam, win, matchups){
  return {
    win,
    matchups,
    playerStatus: team.map(p=>({ id:p.id, name:p.name, speciesId:p.speciesId, level:p.level, shiny:!!p.shiny, fainted: p.hp<=0, wins: p.winsThisBattle||0 })),
    brockStatus: brockTeam.map(p=>({ name:p.name, speciesId:p.speciesId, level:p.level, fainted: p.hp<=0 }))
  };
}

function simulateGymBattle(team, brockTeam, rng, opts){
  rng = rng || Math.random;
  opts = opts || {};
  const hpBuff = 1 + (opts.playerHpBuffPct || 0);
  team.forEach(p=>{ p.maxHp=Math.round(calcMaxHp(p)*hpBuff); p.hp=p.maxHp; p.winsThisBattle=0; if(p.dmgBonus==null) p.dmgBonus=1; });
  brockTeam.forEach(p=>{ p.maxHp=calcMaxHp(p); p.hp=p.maxHp; p.winsThisBattle=0; if(p.dmgBonus==null) p.dmgBonus=1; });

  const matchups = [];
  let brockIndex = 0;
  while(brockIndex < brockTeam.length){
    const enemy = brockTeam[brockIndex];
    let enemyDefeated = false;
    while(!enemyDefeated){
      const alive = team.filter(p=>p.hp>0);
      if(alive.length===0){ return buildResult(team, brockTeam, false, matchups); }
      const active = alive[0]; // respeita a ordem do time escolhida pelo jogador
      const playerHpBefore = active.hp;
      const enemyHpBefore = enemy.hp;
      const playerAliveBefore = alive.length;
      const enemyAliveBefore = brockTeam.length - brockIndex;
      while(active.hp>0 && enemy.hp>0){ doExchange(active, enemy, rng); }
      let enemyFainted = enemy.hp<=0;
      let activeFainted = active.hp<=0;
      let suddenDeath = false;
      let suddenDeathMessage = null;
      if(playerAliveBefore===1 && enemyAliveBefore===1 && enemyFainted && activeFainted){
        // último pokémon dos dois lados caiu junto: sorteia quem sobrevive com 1 HP, em vez de decidir por padrão
        suddenDeath = true;
        if(rng() < 0.5){
          active.hp = 1; enemy.hp = 0;
          suddenDeathMessage = `Troca de golpes fatais! ${active.name} mal ficou de pé, mas foi o suficiente pra decidir a batalha!`;
        } else {
          enemy.hp = 1; active.hp = 0;
          suddenDeathMessage = `Troca de golpes fatais! ${enemy.name} resistiu por um triz e virou o resultado no último suspiro!`;
        }
        enemyFainted = enemy.hp<=0;
        activeFainted = active.hp<=0;
      }
      const isTrade = enemyFainted && activeFainted; // os dois caíram juntos — ninguém "venceu" esse confronto
      const playerWon = enemyFainted && !activeFainted;
      const playerAliveAfter = activeFainted ? playerAliveBefore - 1 : playerAliveBefore;
      const enemyAliveAfter = enemyFainted ? enemyAliveBefore - 1 : enemyAliveBefore;
      matchups.push({
        player:active.name, playerSpecies:active.speciesId, playerLevel:active.level,
        enemy:enemy.name, enemySpecies:enemy.speciesId, enemyLevel:enemy.level,
        winner: isTrade ? null : (playerWon ? active.name : enemy.name),
        isTrade,
        suddenDeath, suddenDeathMessage,
        playerWon,
        playerHpBefore, playerHpAfter: active.hp, playerMaxHp: active.maxHp,
        enemyHpBefore, enemyHpAfter: enemy.hp, enemyMaxHp: enemy.maxHp,
        playerAliveBefore, playerAliveAfter, playerTeamSize: team.length,
        enemyAliveBefore, enemyAliveAfter, enemyTeamSize: brockTeam.length
      });
      if(enemyFainted){ enemyDefeated = true; active.winsThisBattle = (active.winsThisBattle||0) + 1; }
      else if(activeFainted){ enemy.winsThisBattle = (enemy.winsThisBattle||0) + 1; } // o inimigo sobreviveu e vai continuar lutando contra o próximo pokémon do jogador -- mesma regra de vulnerabilidade vale pros dois lados
    }
    brockIndex++;
  }
  // mesmo depois de derrotar todos os inimigos, confirma que o time do jogador não foi zerado
  // no mesmo golpe final (troca de golpes fatais no último confronto não deve virar vitória automática)
  const teamStillAlive = team.some(p=>p.hp>0);
  return buildResult(team, brockTeam, teamStillAlive, matchups);
}

function makeSeededRng(seedStr){
  let h = 1779033703 ^ seedStr.length;
  for(let i=0;i<seedStr.length;i++){
    h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function(){
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
}

function isPartOfEvolutionChain(speciesId){
  if(EVOLUTIONS[speciesId]) return true; // ainda evolui pra algo
  return Object.values(EVOLUTIONS).some(step => step.into === speciesId); // é o destino final de alguma evolução
}
const EEVEE_EVOLUTIONS = ['vaporeon', 'jolteon', 'flareon'];
function isAtFinalEvolutionStage(speciesId){
  // as evoluções do Eevee são escolhidas manualmente (fora da tabela normal de EVOLUTIONS),
  // mas ainda são evoluções finais e devem seguir o mesmo limite de +3 levels
  if(EEVEE_EVOLUTIONS.includes(speciesId)) return true;
  return isPartOfEvolutionChain(speciesId) && !EVOLUTIONS[speciesId];
}
function getMaxPerPokemon(){
  return Math.ceil(game.poolTotal / 2);
}
function addPoint(id){
  if(game.pool<=0) return;
  const maxPer = getMaxPerPokemon();
  if((game.alloc[id]||0) >= maxPer) return;
  const p = game.team.find(t=>t.id===id);
  if(p && (p.level + (game.alloc[id]||0)) >= 55) return; // acima do level 55 só sobe desmaiando em batalha
  if(p && isAtFinalEvolutionStage(p.speciesId) && (game.alloc[id]||0) >= 3) return; // na evolução final, no máx. 3 levels por distribuição
  game.alloc[id]=(game.alloc[id]||0)+1;
  game.pool--;
  render();
}
function removePoint(id){
  if((game.alloc[id]||0)>0){ game.alloc[id]--; game.pool++; render(); }

function confirmLevels(){
  const maxPer = getMaxPerPokemon();
  const anyCanReceive = game.team.some(p=>{
    const current = p.level + (game.alloc[p.id]||0);
    const allocHere = game.alloc[p.id]||0;
    const finalStageCap = isAtFinalEvolutionStage(p.speciesId) ? 3 : Infinity;
    return current < 55 && allocHere < maxPer && allocHere < finalStageCap;
  });
  if(game.pool!==0 && anyCanReceive) return;
  game.team.forEach(p=>{ p.level += (game.alloc[p.id]||0); });
  let evs = [];
  game.team.forEach(p=>{ evs = evs.concat(tryEvolve(p)); });
  if(evs.length>0){
    game.evolutions = evs;
    game.screen = 'evolution';

  render();
}

function hpBarClass(pct){
  if(pct > 50) return 'hp-high';
  if(pct > 20) return 'hp-mid';

function animateHpBars(){
  if(game.screen !== 'battling' || game.revealPhase !== 'result') return;

  if(enemyLabel){ enemyLabel.textContent = `${Math.max(0,m.enemyHpAfter)}/${m.enemyMaxHp} HP`; }
}
function finishBattle(){
  if(game.screen !== 'battling') return;
  const result = game.battleResult;
  // doc 03 proposta D -- O CANAL ESCONDIDO DO FEEDING: antes, cada pokémon que desmaiava dava
  // +1 nível de graça, ganhando ou perdendo. Deixar o time inteiro cair numa derrota rendia
  // +6 níveis fora da economia de pontos. Agora o bônus de desmaio só existe em batalha VENCIDA:
  // "perdeu lutando numa vitória" = experiência; "time inteiro no chão numa derrota" = nada.
  let anyLeveledUp = false;
  if(result.win){
    game.team.forEach(p=>{
      if(p.hp<=0 && p.hp!=null){
        p.level = Math.min(55, p.level + 1);
        const st = result.playerStatus.find(s=>s.id===p.id);
        if(st){ st.level = p.level; }
        anyLeveledUp = true;
      }
    });
  }
  result.leveledUpFromFaint = anyLeveledUp;
  applyNuzlockeFaints(result);
  if((game.team||[]).length === 0){ game.screen = 'gameover'; render(); return; }

  if(result.win){
    const rewards = computeVictoryRewards(result);
    game.lastRewards = rewards;
    game.nextLegPoints = rewards.net;
    game.pointsOwed = rewards.owedAfter;
    game.totalPointsEarned = (game.totalPointsEarned||0) + rewards.net;
    game.winStreak = (game.winStreak||0) + 1;
    game.bestStreak = Math.max(game.bestStreak||0, game.winStreak);
    if(game.declaredChallenge){
      game.challengesWon = [...new Set((game.challengesWon||[]).concat([game.declaredChallenge]))];
    }
    if(result.playerStatus.every(st=>!st.fainted)){ game.anyPerfectGym = true; }
    game.hpBuffNext = 0;          // o socorro da derrota expira ao vencer
    game.leaderRevealed = false;
    game.badgesEarned.push(GYMS[game.gymIndex].badge);
    game.screen = 'victory';
  } else {
    game.losses++;
    game.totalLossesJourney = (game.totalLossesJourney||0) + 1;
    game.winStreak = 0;           // qualquer derrota zera a maré (doc 04 §5)
    game.declaredChallenge = null;
    game.screen = game.losses>=5 ? 'gameover' : 'defeat';
  }
  render();
}

function encodeTeamCode(team){
  const payload = team.map(p=>`${p.speciesId}:${p.level}`).join(',');
  try{ return btoa(payload).replace(/=+$/,''); }
  catch(e){ return ''; }
}
function decodeTeamCode(code){
  if(!code) return null;
  let padded = code.trim();
  if(!padded) return null;
  while(padded.length % 4 !== 0) padded += '=';
  let payload;
  try{ payload = atob(padded); } catch(e){ return null; }
  const parts = payload.split(',').filter(Boolean);
  if(parts.length===0 || parts.length>6) return null;
  const team = [];
  for(const part of parts){
    const bits = part.split(':');
    if(bits.length!==2) return null;
    const id = bits[0];
    const lvl = parseInt(bits[1],10);
    if(!SPECIES[id] || !Number.isFinite(lvl) || lvl<1 || lvl>200) return null;
    team.push(createInstance(id, lvl));
  }
  return team;
}

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(()=>finish('✅ Copiado!')).catch(()=>finish('Selecione manualmente'));
  } else {

/* ===================================================================
   NOVA ESTRUTURA DE ARMAZENAMENTO DA LIGA (multi-documento)
   - leagues/schedule: índice leve com status/horários de cada ciclo
   - leagueCycles/{cycleId}: chaveamento completo de UM ciclo específico
   - leagueCycles/{cycleId}/registrants/{nomeSanitizado}: 1 doc por inscrito
     (isso é o que resolve a contenção de escrita quando muita gente se
     inscreve ao mesmo tempo -- cada pessoa escreve no PRÓPRIO documento,
     em vez de todo mundo brigar pra editar um único documento gigante)
=================================================================== */
const CYCLE_INTERVAL_MS = 60 * 60 * 1000; // uma Liga nova por hora
const PHASE_MS = 5 * 60 * 1000; // 5 minutos entre cada fase
const GRANDE_LIGA_SIZE = 16;
const REGULAR_LIGA_SIZE = 8;
function roundLabelsFor(numRounds){
  // o nome de cada rodada depende de quantas rodadas o chaveamento tem no total
  if(numRounds===4) return ['Oitavas de Final','Quartas de Final','Semifinal','Final'];
  return ['Quartas de Final','Semifinal','Final'];
}
function buildRounds(players){
  const n = players.length; // 8 (Liga normal) ou 16 (Grande Liga)
  const numRounds = Math.round(Math.log2(n));
  const rounds = {};
  const firstRound = [];
  for(let i=0;i<n;i+=2){
    firstRound.push({ a:players[i], b:players[i+1], winner:null, matchups:null, resolved:false });
  }
  rounds['0'] = firstRound;
  let matchCount = firstRound.length;
  for(let r=1; r<numRounds; r++){
    matchCount = matchCount/2;
    const roundMatches = [];
    for(let i=0;i<matchCount;i++){ roundMatches.push({ a:null, b:null, winner:null, matchups:null, resolved:false }); }
    rounds[String(r)] = roundMatches;
  }
  return rounds;
}
function shuffleWithSeed(arr, seedStr){
  const rng = makeSeededRng(seedStr);
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function computeNextScheduledTime(){

  if(target.getTime() <= now.getTime()){ target.setHours(target.getHours()+1); }
  return target.getTime();

const MAX_TEAM_LEVEL_SUM = 6 * 60;
function validateTeamForLeague(team){
  if(!team || team.length === 0) return { ok:false, reason:'time vazio' };
  if(team.length > 6) return { ok:false, reason:`time com ${team.length} pokémons` };
  const over = team.find(p=>p.level > MAX_LEVEL_PER_MON);
  if(over) return { ok:false, reason:`${over.name} está no nível ${over.level} (máximo alcançável: ${MAX_LEVEL_PER_MON})` };
  const sum = team.reduce((a,p)=>a+p.level, 0);
  if(sum > MAX_TEAM_LEVEL_SUM) return { ok:false, reason:`soma de níveis ${sum} acima do teto teórico ${MAX_TEAM_LEVEL_SUM}` };
  return { ok:true, levelSum:sum };
}
function teamStrength(code){
  const team = decodeTeamCode(code);
  if(!team) return 0;
  return team.reduce((acc,p)=>{
    const sp = SPECIES[p.speciesId];
    const bst = sp ? (sp.hp + sp.attack + sp.defense + sp.speed) : 300;
    return acc + p.level + bst/10;
  }, 0);
}
function makeRivalGhost(registrant){
  if(!registrant || !registrant.rivalCode) return null;
  const team = decodeTeamCode(registrant.rivalCode);
  if(!team || !validateTeamForLeague(team).ok) return null;
  const baseName = (registrant.rivalName || 'Rival').trim() || 'Rival';
  return { name:`👻 ${baseName} (fantasma de ${registrant.name})`.slice(0,90), code:registrant.rivalCode,
           uid:null, slot:null, isBot:true, ghostOf:registrant.name };
}
function fillWithGhosts(players, size){
  const filled = players.slice();
  let i = 0;
  while(filled.length < size && i < players.length * 4){
    const ghost = makeRivalGhost(players[i % players.length]);
    i++;
    if(ghost && !filled.some(p=>p.name===ghost.name)) filled.push(ghost);
  }
  return filled.length === size ? filled : null;
}
const MIN_REAL_PLAYERS_FOR_GHOST_LEAGUE = 3;

function resolveLeagueMatch(match, seedStr){
  const rng = makeSeededRng(seedStr);
  const rawA = decodeTeamCode(match.a.code);
  const rawB = decodeTeamCode(match.b.code);
  const okA = rawA && validateTeamForLeague(rawA).ok;
  const okB = rawB && validateTeamForLeague(rawB).ok;
  if(!okA || !okB){
    match.winner = okA ? match.a : match.b;
    match.resolved = true;
    match.matchups = [];
    match.invalidTeam = !okA ? (match.a && match.a.name) : (match.b && match.b.name);
    return;
  }
  const teamA = rawA, teamB = rawB;
  // todo mundo na Liga tem as 8 insígnias: o bônus de insígnia é igual pros dois lados,
  // quem faz diferença é a diversidade de tipos do time (doc 02 §4.5)
  applyTeamBonuses(teamA, 8);
  applyTeamBonuses(teamB, 8);
  const result = simulateGymBattle(teamA, teamB, rng);
  // diferente dos ginásios, os níveis ficam CONGELADOS na Liga -- depois da 8ª insígnia, o time do
  // treinador não sobe mais de nível, então nem precisa re-codificar/sincronizar nada aqui
  match.matchups = result.matchups;
  match.winner = result.win ? match.a : match.b;
  match.resolved = true;
}
async function migrateOldLeagueDataIfNeeded(){
  // se ainda existir o documento antigo (formato de antes da reestruturação), migra pro formato novo e o remove.
  // roda sozinho, sem precisar de ação manual -- só verifica uma vez por sessão.
  try{
    const oldRef = db.collection('leagues').doc('league_schedule_v1');
    const oldSnap = await oldRef.get();
    if(!oldSnap.exists) return; // nada pra migrar
    const oldData = oldSnap.data();
    console.log('Migrando dados antigos da Liga pro novo formato...');

    const scheduleSnap = await scheduleDocRef().get();
    const scheduleData = scheduleSnap.exists ? scheduleSnap.data() : { cycles: [], updatedAt: Date.now() };

    for(const oldCycle of (oldData.cycles||[])){
      const cycleId = makeCycleId(oldCycle.scheduledTime);
      if(!scheduleData.cycles.some(c=>c.id===cycleId)){
        scheduleData.cycles.push({ id: cycleId, scheduledTime: oldCycle.scheduledTime, status: oldCycle.status });
      }
      if(oldCycle.status==='registering'){
        for(const p of (oldCycle.registrants||[])){
          await registrantDocRef(cycleId, p.name).set(p);
        }
      } else if(oldCycle.leagues){
        await cycleDocRef(cycleId).set({
          scheduledTime: oldCycle.scheduledTime,
          leagues: oldCycle.leagues,
          leftover: oldCycle.leftover || [],
          qfTime: oldCycle.qfTime ?? null,
          sfTime: oldCycle.sfTime ?? null,
          finalTime: oldCycle.finalTime ?? null,
          phase4Time: oldCycle.phase4Time ?? null, // saves antigos de antes da Grande Liga não tinham esse campo
          updatedAt: Date.now()
        });
      }
    }
    scheduleData.updatedAt = Date.now();
    await scheduleDocRef().set(scheduleData);
    await oldRef.delete();
    console.log('Migração da Liga concluída.');
  } catch(e){ console.error('Erro ao migrar dados antigos da Liga:', e); }
}

async function ensureRegisteringCycle(){
  return await db.runTransaction(async (tx)=>{
    const snap = await tx.get(scheduleDocRef());
    const data = snap.exists ? snap.data() : { cycles: [], updatedAt: Date.now() };
    let entry = data.cycles.find(c=>c.status==='registering');
    if(!entry){
      entry = makeFreshScheduleCycleEntry(computeNextScheduledTime());
      data.cycles.push(entry);
      data.updatedAt = Date.now();
      tx.set(scheduleDocRef(), data);
    }
    return entry;
  });
}
async function countRegistrants(cycleId){
  try{
    const coll = registrantsCollRef(cycleId);
    if(typeof coll.count === 'function'){
      const snap = await coll.count().get();
      return snap.data().count;
    }
    const snap = await coll.get();
    return snap.size;
  } catch(e){ console.error('Erro ao contar inscritos:', e); return 0; }
}
async function registerForLeague(){
  const name = (game.trainerName || '').trim();
  if(!name){ game.leagueError = 'Seu save não tem um nome de treinador definido.'; render(); return; }
  game.leagueSubmitting = true;
  game.leagueError = null;
  render();
  const code = encodeTeamCode(game.team);
  const check = validateTeamForLeague(decodeTeamCode(code) || []);
  if(!check.ok){
    game.leagueSubmitting = false;
    game.leagueError = `Seu time não passou na validação da Liga: ${check.reason}. Se isso parece errado, avise no grupo.`;
    render();
    return;
  }
  // o fantasma do rival vai junto: ele preenche vagas ímpares no chaveamento em vez de
  // alguém ficar esperando o próximo ciclo (doc 02 §2.5)
  const rivalTeam = buildRivalTeam().map(o=>({ speciesId:o.speciesId, level:Math.min(MAX_LEVEL_PER_MON, o.level) }));
  const rivalCode = encodeTeamCode(rivalTeam);
  try{
    const cycleEntry = await ensureRegisteringCycle();
    const activeElsewhere = await isTrainerActiveInLeague(name);
    if(activeElsewhere){ throw new Error('ACTIVE_ELSEWHERE'); }
    const regRef = registrantDocRef(cycleEntry.id, name);
    await db.runTransaction(async (tx)=>{
      const snap = await tx.get(regRef);
      if(snap.exists){ throw new Error('DUPLICATE_NAME'); }
      tx.set(regRef, {
        name, code,
        uid: game.authUser ? game.authUser.uid : null,
        slot: game.currentSaveSlot,
        levelSum: check.levelSum,            // transparência: aparece no chaveamento (doc 04)
        nuzlocke: !!game.nuzlocke,           // quem zerou no Nuzlocke aparece marcado (doc 02 §3)
        rivalName: game.rivalName || 'Gary',
        rivalCode
      });
    });
    game.leagueSubmitting = false;
    render();
    if(game.screen==='league'){ refreshLeagueView(false); } // atualiza a tela na hora, sem esperar o próximo tick de 5s
  } catch(e){
    game.leagueSubmitting = false;
    if(e.message==='DUPLICATE_NAME') game.leagueError = 'Já existe um treinador inscrito com esse nome. Tente outro.';
    else if(e.message==='ACTIVE_ELSEWHERE') game.leagueError = 'Já existe um treinador com esse nome disputando uma Liga em andamento. Espere terminar ou use outro nome.';
    else { console.error(e); game.leagueError = 'Erro ao se inscrever. Confira sua conexão e tente de novo.'; }
    render();
  }
}
async function cancelLeagueRegistration(){
  const name = (game.trainerName || '').trim();
  if(!name) return;
  game.leagueSubmitting = true;
  game.leagueError = null;
  render();
  try{
    const scheduleSnap = await scheduleDocRef().get();
    const cycleEntry = scheduleSnap.exists ? (scheduleSnap.data().cycles||[]).find(c=>c.status==='registering') : null;
    if(cycleEntry){ await registrantDocRef(cycleEntry.id, name).delete(); }
    game.leagueSubmitting = false;
    render();
    if(game.screen==='league'){ refreshLeagueView(false); }
  } catch(e){
    console.error(e);
    game.leagueSubmitting = false;
    game.leagueError = 'Erro ao cancelar a inscrição. Confira sua conexão e tente de novo.';
    render();
  }
}
async function updateMyLeagueTeamCode(){
  if(!game.trainerName) return;
  const newCode = encodeTeamCode(game.team);
  try{
    const scheduleSnap = await scheduleDocRef().get();
    if(!scheduleSnap.exists) return;
    const cycles = scheduleSnap.data().cycles || [];
    const registering = cycles.find(c=>c.status==='registering');
    if(registering){
      const regRef = registrantDocRef(registering.id, game.trainerName);
      const regSnap = await regRef.get();
      if(regSnap.exists){ await regRef.set({ ...regSnap.data(), code: newCode }); }
    }
    for(const entry of cycles){
      if(entry.status!=='drawn') continue;
      await db.runTransaction(async (tx)=>{
        const ref = cycleDocRef(entry.id);
        const snap = await tx.get(ref);
        if(!snap.exists) return;
        const detail = snap.data();
        let touched = false;
        for(const league of detail.leagues||[]){
          for(const roundKey of Object.keys(league.rounds||{})){
            for(const match of league.rounds[roundKey]){
              if(!match.resolved){
                if(match.a && match.a.name===game.trainerName){ match.a.code = newCode; touched = true; }
                if(match.b && match.b.name===game.trainerName){ match.b.code = newCode; touched = true; }
              }
            }
          }
        }
        if(touched){ detail.updatedAt = Date.now(); tx.set(ref, detail); }
      });
    }
  } catch(e){ console.error('Erro ao atualizar ordem do time na Liga:', e); }
}
let leagueTeamCodeSyncTimer = null;
function scheduleLeagueTeamCodeSync(){
  if(leagueTeamCodeSyncTimer){ clearTimeout(leagueTeamCodeSyncTimer); }
  leagueTeamCodeSyncTimer = setTimeout(()=>{
    leagueTeamCodeSyncTimer = null;
    updateMyLeagueTeamCode();
  }, 800);
}

/* -------------------------------------------------------------------
   SORTEIO E AVANÇO DE FASES
   sorteio usa um "lacre" (claim) transacional no doc leve de agenda,
   pra garantir que só um processo sorteia cada ciclo mesmo com vários
   navegadores tentando ao mesmo tempo
------------------------------------------------------------------- */
const STUCK_CLAIM_THRESHOLD_MS = 3 * 60 * 1000; // se um "lacre" ficar preso por mais que isso, algo deu errado (ex: navegador fechado no meio do processamento) -- libera sozinho
async function claimCycleForProcessing(cycleId, fromStatus, toStatus){
  return await db.runTransaction(async (tx)=>{
    const snap = await tx.get(scheduleDocRef());
    if(!snap.exists) return false;
    const data = snap.data();
    const entry = data.cycles.find(c=>c.id===cycleId);
    if(!entry || entry.status!==fromStatus) return false;
    entry.status = toStatus;
    entry.claimedAt = (toStatus==='advancing' || toStatus==='drawing') ? Date.now() : null;
    data.updatedAt = Date.now();
    tx.set(scheduleDocRef(), data);
    return true;
  });
}
async function recoverStuckCycles(){
  // se algum navegador fechou (ou caiu a conexão) bem no meio de processar uma fase, o "lacre" pode ficar
  // preso pra sempre, já que nenhum outro navegador consegue reivindicar um ciclo fora do status esperado.
  // isso destrava sozinho qualquer lacre preso há mais tempo do que um processamento normal deveria levar
  // (também cobre lacres antigos, de antes dessa proteção existir, que nunca tiveram um horário registrado).
  try{
    await db.runTransaction(async (tx)=>{
      const snap = await tx.get(scheduleDocRef());
      if(!snap.exists) return;
      const data = snap.data();
      const now = Date.now();
      let changed = false;
      for(const entry of data.cycles){
        const isStuck = (entry.status==='advancing' || entry.status==='drawing') &&
          (!entry.claimedAt || (now - entry.claimedAt > STUCK_CLAIM_THRESHOLD_MS));
        if(isStuck){
          entry.status = entry.status==='advancing' ? 'drawn' : 'registering';
          entry.claimedAt = null;
          changed = true;
        }
      }
      if(changed){ data.updatedAt = Date.now(); tx.set(scheduleDocRef(), data); }
    });
  } catch(e){ console.error('Erro ao recuperar ciclos travados:', e); }
}
async function drawCycle(cycleEntry){
  const claimed = await claimCycleForProcessing(cycleEntry.id, 'registering', 'drawing');
  if(!claimed) return false; // outro processo já está cuidando desse sorteio
  try{
    const regSnap = await registrantsCollRef(cycleEntry.id).get();
    const registrants = regSnap.docs.map(d=>d.data());
    // porta de entrada: time impossível não entra no chaveamento
    const valid = registrants.filter(r=>{
      const team = decodeTeamCode(r.code);
      return team && validateTeamForLeague(team).ok;
    }).map(r=>({ ...r, levelSum: (decodeTeamCode(r.code)||[]).reduce((a,p)=>a+p.level,0) }));
    // divisões por força: fortes com fortes, novatos com novatos (doc 02 §4.5)
    const byStrength = valid.slice().sort((a,b)=>teamStrength(b.code) - teamStrength(a.code));
    const leagues = [];
    let cursor = 0;
    const grandeCount = Math.floor(byStrength.length / GRANDE_LIGA_SIZE);
    for(let i=0;i<grandeCount;i++){
      const band = byStrength.slice(cursor, cursor+GRANDE_LIGA_SIZE);
      leagues.push({ id: leagues.length, size: GRANDE_LIGA_SIZE, division:'Grande Liga', rounds: buildRounds(shuffleWithSeed(band, `draw-${cycleEntry.scheduledTime}-G${i}`)), champion:null });
      cursor += GRANDE_LIGA_SIZE;
    }
    const remaining = byStrength.length - cursor;
    const regularCount = Math.floor(remaining / REGULAR_LIGA_SIZE);
    for(let i=0;i<regularCount;i++){
      const band = byStrength.slice(cursor, cursor+REGULAR_LIGA_SIZE);
      leagues.push({ id: leagues.length, size: REGULAR_LIGA_SIZE, division:'Liga', rounds: buildRounds(shuffleWithSeed(band, `draw-${cycleEntry.scheduledTime}-R${i}`)), champion:null });
      cursor += REGULAR_LIGA_SIZE;
    }
    let leftover = byStrength.slice(cursor);
    // sobras não esperam mais um ciclo inteiro: os fantasmas dos rivais fecham as vagas (doc 02 §2.5)
    if(leftover.length >= MIN_REAL_PLAYERS_FOR_GHOST_LEAGUE){
      const filled = fillWithGhosts(leftover, REGULAR_LIGA_SIZE);
      if(filled){
        leagues.push({ id: leagues.length, size: REGULAR_LIGA_SIZE, division:'Liga (com fantasmas)', withGhosts:true,
          rounds: buildRounds(shuffleWithSeed(filled, `draw-${cycleEntry.scheduledTime}-Gh`)), champion:null });
        leftover = [];
      }
    }
    const detail = {
      scheduledTime: cycleEntry.scheduledTime,
      leagues,
      leftover,
      qfTime: cycleEntry.scheduledTime + PHASE_MS,
      sfTime: cycleEntry.scheduledTime + PHASE_MS*2,
      finalTime: cycleEntry.scheduledTime + PHASE_MS*3,
      phase4Time: cycleEntry.scheduledTime + PHASE_MS*4,
      updatedAt: Date.now()
    };
    await cycleDocRef(cycleEntry.id).set(detail);

    // quem ficou de fora entra automaticamente na próxima Liga (vira registrant novo lá)
    const nextScheduledTime = cycleEntry.scheduledTime + CYCLE_INTERVAL_MS;
    const nextCycleId = makeCycleId(nextScheduledTime);
    for(const p of leftover){
      await registrantDocRef(nextCycleId, p.name).set(p);
    }

    // atualiza a agenda: esse ciclo vira drawn/complete, e garante que o próximo ciclo de inscrição existe
    await db.runTransaction(async (tx)=>{
      const snap = await tx.get(scheduleDocRef());
      const data = snap.exists ? snap.data() : { cycles: [], updatedAt: Date.now() };
      const entry = data.cycles.find(c=>c.id===cycleEntry.id);
      if(entry){ entry.status = leagues.length>0 ? 'drawn' : 'complete'; }
      if(!data.cycles.some(c=>c.id===nextCycleId)){
        data.cycles.push({ id: nextCycleId, scheduledTime: nextScheduledTime, status:'registering' });
      }
      data.updatedAt = Date.now();
      tx.set(scheduleDocRef(), data);
    });
    return true;
  } catch(e){
    console.error('Erro ao sortear ciclo:', e);
    await claimCycleForProcessing(cycleEntry.id, 'drawing', 'registering'); // devolve o lacre se algo falhou no meio do caminho
    return false;
  }
}
async function advanceCyclePhases(cycleEntry){
  const claimed = await claimCycleForProcessing(cycleEntry.id, 'drawn', 'advancing');
  if(!claimed) return false;
  let pendingChampions = [], pendingPlacements = [], changed = false;
  try{
    const ref = cycleDocRef(cycleEntry.id);
    const snap = await ref.get();
    if(!snap.exists){ await claimCycleForProcessing(cycleEntry.id, 'advancing', 'drawn'); return false; }
    const detail = snap.data();
    const now = Date.now();
    const phaseTimes = [detail.qfTime, detail.sfTime, detail.finalTime, detail.phase4Time];
    for(const league of detail.leagues){
      const roundKeys = Object.keys(league.rounds).sort((a,b)=>Number(a)-Number(b));
      for(let ri=0; ri<roundKeys.length; ri++){
        if(now < phaseTimes[ri]) break;
        const round = league.rounds[roundKeys[ri]];
        for(let mi=0; mi<round.length; mi++){
          const match = round[mi];
          if(!match.resolved && match.a && match.b){
            resolveLeagueMatch(match, `${cycleEntry.scheduledTime}-L${league.id}-R${ri}-M${mi}`);
            changed = true;
            if(ri+1 < roundKeys.length){
              const nextRound = league.rounds[roundKeys[ri+1]];
              const nextMatch = nextRound[Math.floor(mi/2)];
              if(mi%2===0){ nextMatch.a = match.winner; } else { nextMatch.b = match.winner; }
            } else {
              league.champion = match.winner;
              pendingChampions.push({ name: match.winner.name, uid: match.winner.uid, slot: match.winner.slot });
              // o chaveamento inteiro dessa Liga já está resolvido agora -- aproveita pra gravar a
              // colocação final de todo mundo que participou, direto na conta de cada um
              const participants = [];
              (league.rounds['0']||[]).forEach(m=>{ if(m.a) participants.push(m.a); if(m.b) participants.push(m.b); });
              for(const p of participants){
                const placement = computePlacement(league, p.name);
                if(placement && p.uid){
                  // mesmo fallback defensivo de reconcileLeagueWinsFromHistory -- evita gravar "undefined"
                  // caso esse ciclo específico esteja com algum campo faltando
                  const cycleTime = cycleEntry.scheduledTime!=null ? cycleEntry.scheduledTime : Number(cycleEntry.id) || 0;
                  const leagueSize = league.size!=null ? league.size : ((league.rounds['0']||[]).length * 2 || REGULAR_LIGA_SIZE);
                  pendingPlacements.push({ uid: p.uid, slot: p.slot, record: { cycleId: cycleEntry.id, cycleTime, leagueId: league.id, leagueSize, placement } });
                }
              }
            }
          }
        }
      }
    }
    const allDone = detail.leagues.length>0 && detail.leagues.every(l=>l.champion);
    detail.updatedAt = Date.now();
    await ref.set(detail);
    await claimCycleForProcessing(cycleEntry.id, 'advancing', allDone ? 'complete' : 'drawn');
    for(const champ of pendingChampions){ await recordLeagueChampionWin(champ.name, champ.uid, champ.slot); }
    for(const p of pendingPlacements){ await recordLeaguePlacement(p.uid, p.slot, p.record); }
    return changed;
  } catch(e){
    console.error('Erro ao avançar fases do ciclo:', e);
    await claimCycleForProcessing(cycleEntry.id, 'advancing', 'drawn');
    return false;
  }
}
async function advanceLeagueOnce(){
  let anyChanged = false;
  try{
    await recoverStuckCycles();
    const scheduleSnap = await scheduleDocRef().get();
    if(!scheduleSnap.exists){
      await scheduleDocRef().set(makeFreshScheduleData());
      return true;
    }
    const data = scheduleSnap.data();
    const now = Date.now();
    if(!data.cycles.some(c=>c.status==='registering')){
      await ensureRegisteringCycle();
      anyChanged = true;
    }
    for(const entry of data.cycles.slice()){
      if(entry.status==='registering' && now >= entry.scheduledTime){
        const ok = await drawCycle(entry);
        if(ok) anyChanged = true;
      } else if(entry.status==='drawn'){
        const ok = await advanceCyclePhases(entry);
        if(ok) anyChanged = true;
      }
    }
  } catch(e){ console.error('Erro ao avançar a Liga:', e); }
  return anyChanged;
}

/* -------------------------------------------------------------------
   CARREGAMENTO PRA EXIBIÇÃO
   monta um objeto no formato {cycles:[...]} parecido com o antigo,
   mas buscando só o que é relevante ver AGORA (registro atual +
   ciclos já sorteados), sem puxar o histórico inteiro toda hora
------------------------------------------------------------------- */
async function loadLeagueViewData(){
  try{
    const scheduleSnap = await scheduleDocRef().get();
    const scheduleData = scheduleSnap.exists ? scheduleSnap.data() : { cycles: [] };
    // só busca (e mostra "ao vivo") o chaveamento do ciclo mais recente entre os que já foram sorteados
    // (drawn/advancing/complete) -- não necessariamente o mais recente CONCLUÍDO especificamente, porque assim
    // que uma Liga nova é sorteada, ela passa a ser "a atual" e a anterior (mesmo já encerrada) sai da tela
    // ao vivo, ficando disponível só via "Suas últimas Ligas" → "Rever"
    const activeTimes = scheduleData.cycles.filter(c=>c.status==='drawn' || c.status==='advancing' || c.status==='complete').map(c=>c.scheduledTime);
    const latestActiveTime = activeTimes.length>0 ? Math.max(...activeTimes) : null;
    const cycles = await Promise.all(scheduleData.cycles.map(async (entry)=>{
      if(entry.status==='registering'){
        const [registrantCount, amIRegistered] = await Promise.all([
          countRegistrants(entry.id),
          game.trainerName ? registrantDocRef(entry.id, game.trainerName).get().then(s=>s.exists).catch(()=>false) : Promise.resolve(false)
        ]);
        return { ...entry, registrantCount, registrants: { length: registrantCount }, leagues: null, amIRegistered };
      } else if(entry.scheduledTime===latestActiveTime && (entry.status==='drawn' || entry.status==='advancing' || entry.status==='complete')){
        // 'advancing' é um estado transitório (alguém, talvez outro jogador com a tela aberta, está processando
        // uma fase agora mesmo) -- o chaveamento já existe e continua legível nesse meio-tempo, só o status
        // muda por um instante. Buscar aqui também evita a tela "piscar" vazia enquanto isso acontece.
        try{
          const detailSnap = await cycleDocRef(entry.id).get();
          return detailSnap.exists ? { ...entry, ...detailSnap.data() } : entry;
        } catch(e){ return entry; }
      }
      return entry; // ciclo mais antigo (já superado por um mais novo) -- fica só com os dados leves (id, horário, status)
    }));
    return { cycles };
  } catch(e){
    console.error('Erro ao carregar a Liga:', e);
    return { cycles: [] };
  }
}
async function loadMyLeagueHistory(limit){
  // le direto da conta do jogador, filtrado pelo slot (personagem) atual -- uma mesma conta pode ter vários
  // saves, cada um com sua própria trajetória na Liga, então não faz sentido misturar tudo numa lista só
  if(!game.authUser || game.currentSaveSlot==null) return [];
  try{
    const snap = await userDocRef(game.authUser.uid).get();
    const bySlot = (snap.exists && snap.data().leaguePlacementsBySlot) ? snap.data().leaguePlacementsBySlot : {};
    const placements = bySlot[String(game.currentSaveSlot)] || [];
    return placements.slice(0, limit);
  } catch(e){ console.error('Erro ao carregar histórico da Liga:', e); return []; }
}
function findMyLeagueInCycle(cycle){
  if(!cycle.leagues) return null;
  return cycle.leagues.find(l=> Object.values(l.rounds).some(round=>
    round.some(m=> (m.a && m.a.name===game.trainerName) || (m.b && m.b.name===game.trainerName))
  )) || null;
}
function computePlacement(league, playerName){
  if(!league.champion) return null;
  if(league.champion.name===playerName) return 'Campeão';
  const roundKeys = Object.keys(league.rounds).sort((a,b)=>Number(a)-Number(b));
  const lastRoundIdx = roundKeys.length - 1;
  const finalMatch = league.rounds[roundKeys[lastRoundIdx]][0];
  if(finalMatch.a && finalMatch.b && (finalMatch.a.name===playerName || finalMatch.b.name===playerName)){
    return 'Vice-campeão';
  }
  for(let ri=lastRoundIdx-1; ri>=0; ri--){
    const round = league.rounds[roundKeys[ri]];
    const wasHere = round.some(m=> m.a && m.b && (m.a.name===playerName || m.b.name===playerName));
    if(wasHere){
      const eliminatedInSize = round.length * 2;
      const nextSize = eliminatedInSize / 2;
      return `${nextSize+1}º–${eliminatedInSize}º Lugar`;
    }
  }
  return null;
}

async function checkLeagueRegistrationStatus(){
  try{
    const scheduleSnap = await scheduleDocRef().get();
    if(!scheduleSnap.exists){ game.journeyEndRegistered = false; if(game.screen==='journeyEnd'){ render(); } return; }
    const cycles = scheduleSnap.data().cycles || [];
    const registering = cycles.find(c=>c.status==='registering');
    if(registering){
      const regSnap = await registrantDocRef(registering.id, game.trainerName).get();
      if(regSnap.exists){ game.journeyEndRegistered = true; if(game.screen==='journeyEnd'){ render(); } return; }
    }
    // além da inscrição em si, o jogador pode já estar competindo num ciclo sorteado (drawn/advancing) --
    // sem checar isso aqui, o aviso "você já está inscrito" (e por tabela, a confiança de que reordenar o
    // time aqui ainda tem efeito) sumia assim que a Liga saía da fase de inscrição e entrava em andamento,
    // mesmo com a sincronização em si continuando funcionando normalmente por trás
    const activeCycles = cycles.filter(c=>c.status==='drawn' || c.status==='advancing');
    for(const entry of activeCycles){
      const detailSnap = await cycleDocRef(entry.id).get();
      if(!detailSnap.exists) continue;
      const inThisCycle = (detailSnap.data().leagues||[]).some(league=>
        Object.values(league.rounds||{}).some(round=>
          round.some(m=> (m.a && m.a.name===game.trainerName) || (m.b && m.b.name===game.trainerName))
        )
      );
      if(inThisCycle){ game.journeyEndRegistered = true; if(game.screen==='journeyEnd'){ render(); } return; }
    }
    game.journeyEndRegistered = false;
  } catch(e){
    console.error('Erro ao checar inscrição na Liga:', e);
    game.journeyEndRegistered = false;
  }
  if(game.screen==='journeyEnd'){ render(); }
}

let leagueTickInterval = null;

async function refreshLeagueView(includeHistory){
  const data = await loadLeagueViewData();
  game.leagueData = data;
  // mesmo quando ESTE navegador não foi quem processou a mudança (ex: a Cloud Function ou o navegador de
  // outro jogador já cuidou disso), se o ciclo "atual" mostrado na tela mudou de identidade ou status desde
  // a última vez, trata como se algo tivesse mudado -- senão "Suas últimas Ligas" fica desatualizada
  // indefinidamente sempre que este navegador não é quem processa as fases
  const activeCycle = data.cycles.find(c=>c.leagues);
  const activeCycleSignature = activeCycle ? (activeCycle.id + ':' + activeCycle.status) : null;
  const cycleChangedRemotely = activeCycleSignature !== game.lastSeenLeagueCycleSignature;
  game.lastSeenLeagueCycleSignature = activeCycleSignature;
  if((includeHistory || cycleChangedRemotely) && game.trainerName){
    // garante que colocações/títulos estejam em dia antes de mostrar "Suas últimas Ligas" -- sem isso,
    // quem não foi o navegador que processou sua própria partida só veria o histórico depois de visitar a Home
    await reconcileLeagueWinsFromHistory();
    game.myLeagueHistory = await loadMyLeagueHistory(5);
  }
  if(game.screen==='league'){ render(); }
}
function startLeagueListener(){
  if(!leagueTickInterval){
    leagueTickInterval = setInterval(async ()=>{
      if(game.screen!=='league') return;
      const changed = await advanceLeagueOnce();
      await refreshLeagueView(changed); // só recarrega o histórico (mais pesado) se algo realmente avançou
    }, 5000);
  }
}

  const keepWinsBySlot = { ...(game.leagueWinsBySlot||{}) };
  delete keepWinsBySlot[String(slot)]; // save novo nesse slot começa zerado, não herda vitórias de um save antigo que foi apagado

  if(keepUser){
    try{
      // zera tanto o contador de vitórias quanto a lista de colocações desse slot -- sem isso, um save novo
      // criado num slot reaproveitado (de um save apagado) continuaria mostrando as Ligas do save antigo em
      // "Suas últimas Ligas", já que os dados ficam guardados por número de slot, não por save específico.
      // leagueSlotResetAt marca a partir de quando esse slot "conta" -- sem isso, a reconciliação (que
      // varre por UID da conta, não por save específico) ficaria ressuscitando as Ligas antigas de volta
      await userDocRef(keepUser.uid).set({
        leagueWinsBySlot: { [String(slot)]: 0 },
        leaguePlacementsBySlot: { [String(slot)]: [] },
        leagueSlotResetAt: { [String(slot)]: Date.now() }
      }, { merge: true });
    }
    catch(e){ console.error('Erro ao zerar vitórias do slot novo:', e); }
  }
