async function refreshLeagueView(includeHistory){
  const data = await loadLeagueViewData();
  game.leagueData = data;
  // mesmo quando ESTE navegador não foi quem processou a mudança (ex: a Cloud Function ou o navegador de
  // outro jogador já cuidou disso), se o ciclo "atual" mostrado na tela mudou de identidade ou status desde
  // a última vez, trata como se algo tivesse mudado -- senão "Suas últimas Ligas" fica desatualizada
  // indefinidamente sempre que este navegador não é quem processa as fases
  const activeCycle = data.cycles.find(c=>c.leagues);
  const activeCycleSignature = activeCycle ? (activeCycle.id + ':' + activeCycle.status) : null;
  const cycleChangedRemotely = activeCycleSignature !== game.lastSeenLeagueCycleSignature;
  game.lastSeenLeagueCycleSignature = activeCycleSignature;
  if((includeHistory || cycleChangedRemotely) && game.trainerName){
    // garante que colocações/títulos estejam em dia antes de mostrar "Suas últimas Ligas" -- sem isso,
    // quem não foi o navegador que processou sua própria partida só veria o histórico depois de visitar a Home
    await reconcileLeagueWinsFromHistory();
    game.myLeagueHistory = await loadMyLeagueHistory(5);
  }
  if(game.screen==='league'){ render(); }
}
function startLeagueListener(){
  if(!leagueTickInterval){
    leagueTickInterval = setInterval(async ()=>{
      if(game.screen!=='league') return;
      const changed = await advanceLeagueOnce();
      await refreshLeagueView(changed); // só recarrega o histórico (mais pesado) se algo realmente avançou
    }, 5000);
  }
}
function stopLeaguePolling(){
  if(leagueTickInterval){ clearInterval(leagueTickInterval); leagueTickInterval = null; }
}

function authErrorMessage(e){

  if(code==='auth/email-already-in-use') return 'Esse e-mail já está cadastrado. Tente entrar em vez de criar conta.';
  if(code==='auth/invalid-email') return 'E-mail inválido.';
  if(code==='auth/weak-password') return 'Senha muito fraca (mínimo 6 caracteres).';
  if(code==='auth/wrong-password' || code==='auth/user-not-found' || code==='auth/invalid-credential') return 'E-mail ou senha incorretos.';
  if(code==='auth/popup-closed-by-user') return 'Login cancelado.';

   SAVES (3 slots por usuário no Firestore)

const SAFE_SAVE_SCREENS = new Set(['start','walk','walkNext','wild','release','levels','evolution','eeveeChoice','teamOrder','preBattle','victory','defeat','gameover','journeyEnd']);
function saveDocRef(uid, slot){
  return db.collection('users').doc(uid).collection('saves').doc(String(slot));
}

  ]).then(()=>{ if(game.screen==='saveSelect'){ render(); } });
}
async function loadSaveSlots(){
  if(!game.authUser) return;
  const slots = new Array(MAX_SAVE_SLOTS).fill(null);
  try{
    const snap = await db.collection('users').doc(game.authUser.uid).collection('saves').get();
    snap.forEach(doc=>{
      const idx = parseInt(doc.id, 10);
      if(!isNaN(idx) && idx>=0 && idx<MAX_SAVE_SLOTS){ slots[idx] = doc.data(); }
    });
  } catch(e){ console.error('Erro ao carregar saves:', e); }
  game.saveSlots = slots;
  if(game.screen==='saveSelect'){ render(); }
}
function startNewSave(slot){

async function confirmNewSaveName(){
  const input = document.getElementById('new-save-name-input');
  const name = input ? input.value.trim() : '';
  if(!name){ game.newSaveNameError = 'Digite um nome de treinador.'; render(); return; }
  const slot = game.pendingNewSaveSlot;
  const keepUser = game.authUser, keepSlots = game.saveSlots, keepPokedex = game.permanentPokedex, keepWinsTotal = game.leagueWinsTotal;
  const keepWinsBySlot = { ...(game.leagueWinsBySlot||{}) };
  delete keepWinsBySlot[String(slot)]; // save novo nesse slot começa zerado, não herda vitórias de um save antigo que foi apagado
  game = freshGameDefaults();
  game.authUser = keepUser;
  game.saveSlots = keepSlots;
  game.permanentPokedex = keepPokedex;
  game.leagueWinsTotal = keepWinsTotal;
  game.leagueWinsBySlot = keepWinsBySlot;
  game.currentSaveSlot = slot;
  game.trainerName = name;
  game.myLeagueHistory = []; // idem -- o save novo não deve mostrar o histórico de Liga de quem usava esse slot antes
  game.screen = 'start';
  render();
  saveCurrentGame();
  if(keepUser){
    try{
      // zera tanto o contador de vitórias quanto a lista de colocações desse slot -- sem isso, um save novo
      // criado num slot reaproveitado (de um save apagado) continuaria mostrando as Ligas do save antigo em
      // "Suas últimas Ligas", já que os dados ficam guardados por número de slot, não por save específico.
      // leagueSlotResetAt marca a partir de quando esse slot "conta" -- sem isso, a reconciliação (que
      // varre por UID da conta, não por save específico) ficaria ressuscitando as Ligas antigas de volta
      await userDocRef(keepUser.uid).set({
        leagueWinsBySlot: { [String(slot)]: 0 },
        leaguePlacementsBySlot: { [String(slot)]: [] },
        leagueSlotResetAt: { [String(slot)]: Date.now() }
      }, { merge: true });
    }
    catch(e){ console.error('Erro ao zerar vitórias do slot novo:', e); }
  }
}
function serializeGame(){

let autoSaveDebounceTimer = null;
function maybeAutoSave(){
  if(!game.authUser || game.currentSaveSlot==null) return;
  if(!SAFE_SAVE_SCREENS.has(game.screen)) return;
  // agrupa cliques rápidos (ex: distribuir vários pontos de level seguidos) numa única gravação,
  // em vez de escrever no Firestore a cada clique individual
  if(autoSaveDebounceTimer){ clearTimeout(autoSaveDebounceTimer); }
  autoSaveDebounceTimer = setTimeout(()=>{
    autoSaveDebounceTimer = null;
    if(game.authUser && game.currentSaveSlot!=null && SAFE_SAVE_SCREENS.has(game.screen)){
      saveCurrentGame();
    }
  }, 800);
}
function flushPendingAutoSave(){
  if(!autoSaveDebounceTimer) return;
  clearTimeout(autoSaveDebounceTimer);
  autoSaveDebounceTimer = null;
  if(game.authUser && game.currentSaveSlot!=null && SAFE_SAVE_SCREENS.has(game.screen)){
    saveCurrentGame();
  }
}
function applySavedState(data){
  game.trainerName = data.trainerName || '';
  game.screen = SAFE_SAVE_SCREENS.has(data.screen) ? data.screen : 'preBattle';
  game.gymIndex = data.gymIndex || 0;
  game.starterId = data.starterId || null;
  game.wildOffer = data.wildOffer || [];
  game.wildSelected = data.wildSelected || [];
  game.team = data.team || [];
  game.releaseSelected = data.releaseSelected || [];
  game.pool = data.pool || 0;
  game.poolTotal = data.poolTotal || 0;
  game.alloc = data.alloc || {};
  game.losses = data.losses || 0;
  game.evolutions = data.evolutions || [];
  game.badgesEarned = data.badgesEarned || [];
  game.caughtSpecies = data.caughtSpecies || [];
  game.battleResult = data.battleResult || null;
  // rede de segurança: saves salvos antes dessa correção (ou qualquer dado corrompido) podem ter ficado
  // parados numa tela de resultado de batalha sem o resultado em si -- em vez de travar, volta pra uma
  // tela segura em que o jogador consegue seguir jogando normalmente
  const needsBattleResult = ['victory','defeat','gameover'].includes(game.screen);
  if(needsBattleResult && (!game.battleResult || !game.battleResult.matchups)){
    game.screen = 'preBattle';
  }
}
function reconcileInstanceIdCounter(){
  let maxId = 0;
  game.team.forEach(p=>{
    const match = /^mon(\d+)$/.exec(p.id||'');
    if(match){ maxId = Math.max(maxId, parseInt(match[1],10)); }
  });
  nextInstanceId = Math.max(nextInstanceId, maxId+1);
}
async function continueSave(slot){
  if(!game.authUser) return;
  try{
    const snap = await saveDocRef(game.authUser.uid, slot).get();
    if(!snap.exists) return;
    applySavedState(snap.data());
    game.currentSaveSlot = slot;
    reconcileInstanceIdCounter();
    render();
  } catch(e){ console.error(e); }
}
async function isTrainerActiveInLeague(trainerName){
  if(!trainerName) return false;
  try{
    const scheduleSnap = await scheduleDocRef().get();
    if(!scheduleSnap.exists) return false;
    const cycles = scheduleSnap.data().cycles || [];
    const checks = await Promise.all(cycles.map(async (entry)=>{
      if(entry.status==='registering'){
        const regSnap = await registrantDocRef(entry.id, trainerName).get();
        return regSnap.exists;
      } else if(entry.status==='drawn'){
        const detailSnap = await cycleDocRef(entry.id).get();
        if(!detailSnap.exists) return false;
        return (detailSnap.data().leagues||[]).some(league=>
          Object.values(league.rounds||{}).some(round=>
            round.some(m=> (m.a && m.a.name===trainerName) || (m.b && m.b.name===trainerName))
          )
        );
      }
      return false;
    }));
    return checks.some(Boolean);
  } catch(e){ console.error('Erro ao checar Liga:', e); return false; }
}
async function requestDeleteSave(slot){
  const s = game.saveSlots[slot];
  if(!s) return;
  game.deleteSaveChecking = slot;
  render();
  const isActive = await isTrainerActiveInLeague(s.trainerName);
  game.deleteSaveChecking = null;
  if(isActive){
    game.deleteSaveBlockedReason = `O save "${s.trainerName}" está inscrito ou disputando a Liga Pokémon agora. Cancele a inscrição (ou espere a Liga terminar) antes de deletar esse save.`;
    render();
    return;
  }
  game.deleteSaveTarget = slot;
  render();
}

function getAchievementAggregate(){
  const slots = (game.saveSlots || []).filter(Boolean);
  const caught = getAllCaughtSpecies();
  const maxBadges = slots.reduce((max,s)=> Math.max(max, s.badgeCount!=null ? s.badgeCount : (s.badgesEarned?s.badgesEarned.length:0)), 0);
  return {
    caughtCount: caught.size,
    totalSpecies: Object.keys(SPECIES).length,
    maxBadges,
    anyEvolution: slots.some(s=> (s.evolutions||[]).length>0),
    anyEeveeEvo: ['vaporeon','jolteon','flareon'].some(id=>caught.has(id)),
    anyLegendary: ['moltres','zapdos','articuno'].some(id=>caught.has(id)),
    anyFullTeam: slots.some(s=> (s.team||[]).length>=6),
    anyComeback: slots.some(s=> (s.losses||0)>0 && (s.badgeCount||0)>0),
    slotsUsed: slots.length,
    anyJourneyEnd: slots.some(s=> (s.badgeCount||0)>=8),
    trainerNames: [...new Set(slots.map(s=>s.trainerName).filter(Boolean))]
  };
}
async function computeLeagueAchievementExtra(trainerNames){
  const result = { anyRegistered:false, anySemifinal:false, anyRunnerUp:false, anyChampion:false };
  if(!trainerNames || trainerNames.length===0) return result;
  try{
    const scheduleSnap = await scheduleDocRef().get();
    if(!scheduleSnap.exists) return result;
    const cycles = scheduleSnap.data().cycles || [];
    const registering = cycles.find(c=>c.status==='registering');
    if(registering){
      const regChecks = await Promise.all(trainerNames.map(name=>registrantDocRef(registering.id, name).get().then(s=>s.exists).catch(()=>false)));
      if(regChecks.some(Boolean)){ result.anyRegistered = true; }
    }
    const completedEntries = cycles.filter(c=>c.status==='complete');
    const detailSnaps = await Promise.all(completedEntries.map(entry=>cycleDocRef(entry.id).get().catch(()=>null)));
    for(const detailSnap of detailSnaps){
      if(!detailSnap || !detailSnap.exists) continue;
      const detail = detailSnap.data();
      for(const name of trainerNames){
        for(const league of (detail.leagues||[])){
          const placement = computePlacement(league, name);
          if(placement==='Campeão'){ result.anyChampion = true; result.anyRunnerUp = true; result.anySemifinal = true; }
          else if(placement==='Vice-campeão'){ result.anyRunnerUp = true; result.anySemifinal = true; }
          else if(placement==='3º–4º Lugar'){ result.anySemifinal = true; }
        }
      }
    }
  } catch(e){ console.error('Erro ao checar conquistas da Liga:', e); }
  return result;
}

function renderPlayerStatus(list){

    const cls = p.fainted ? 'fainted' : '';
    return `<div class="status-row ${cls}">
      <span class="icon">${p.fainted?'❌':'✅'}</span>

      <span class="tag ${p.fainted?'dead':'alive'}">${p.fainted?'Desmaiou':'Sobreviveu'}</span>
    </div>`;
  }).join('');
}
function renderEnemyStatus(list){
  return list.map(p=>{
    const cls = p.fainted ? 'fainted' : '';
    return `<div class="status-row ${cls}">
      <span class="icon">${p.fainted?'❌':'🟢'}</span>

function matchupResultLine(m){
  if(m.isTrade){
    return `<span class="lose-text">${m.player} e ${m.enemy} caíram juntos</span>`;
  }
  const cls = m.playerWon ? 'win-text' : 'lose-text';
  return `<span class="${cls}">${m.winner} venceu</span>`;
}
function suddenDeathNote(m){
  if(!m.suddenDeath || !m.suddenDeathMessage) return '';
  return `<br><span class="sudden-death-note">💥 ${m.suddenDeathMessage}</span>`;
}
function renderMatchupLog(matchups){
  return matchups.map(m=>{
    return `<div class="matchup-row">${m.player} <span class="vs">×</span> ${m.enemy}: ${matchupResultLine(m)}${suddenDeathNote(m)}</div>`;

function renderHpBar(hp, maxHp, fillId, labelId){

      <div class="hp-bar-fill ${hpBarClass(pct)}" id="${fillId}" style="width:${pct}%"></div>
    </div>
    <div class="hp-bar-label" id="${labelId}">${Math.max(0,hp)}/${maxHp} HP</div>
  </div>`;
}

function escJs(str){
  return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}
function leagueMatchRow(match, roundLabel, ct, li, rk, mi){
  const isMyMatch = match.a && match.b && (match.a.name===game.trainerName || match.b.name===game.trainerName);
  const highlightClass = isMyMatch ? ' my-match' : '';
  if(!match.a || !match.b){
    const known = match.a || match.b;
    return `<div class="league-match pending${highlightClass}">
      <div class="league-match-title">${roundLabel}</div>
      <div class="league-match-players">${known?known.name:'?'} <span class="vs">vs</span> ${match.a&&match.b?'':'(aguardando adversário)'}</div>
    </div>`;
  }
  if(!match.resolved){
    return `<div class="league-match pending${highlightClass}">
      <div class="league-match-title">${roundLabel}</div>
      <div class="league-match-players centered">
        <span class="player-link" onclick="showPlayerTeamModal('${escJs(match.a.code)}','${escJs(match.a.name)}')">${match.a.name}</span>
        <span class="vs">vs</span>
        <span class="player-link" onclick="showPlayerTeamModal('${escJs(match.b.code)}','${escJs(match.b.name)}')">${match.b.name}</span>
      </div>
      <div class="league-match-status">⏳ Aguardando o horário da batalha</div>
    </div>`;
  }
  return `<div class="league-match resolved${highlightClass}">
    <div class="league-match-title">${roundLabel}</div>
    <div class="league-match-players centered">
      <span class="player-link ${match.winner.name===match.a.name?'win-text':''}" onclick="showPlayerTeamModal('${escJs(match.a.code)}','${escJs(match.a.name)}')">${match.a.name}</span>
      <span class="vs">vs</span>
      <span class="player-link ${match.winner.name===match.b.name?'win-text':''}" onclick="showPlayerTeamModal('${escJs(match.b.code)}','${escJs(match.b.name)}')">${match.b.name}</span>
    </div>
    <div class="league-match-status">🏅 ${match.winner.name} venceu!</div>
    ${match.matchups && match.matchups.length>0 ? `<button class="btn secondary league-watch-btn" onclick="watchLeagueMatch(${ct},${li},'${rk}',${mi})">▶ Assistir batalha</button>` : ''}
  </div>`;
}

  render();

function closePlayerTeamModal(){

        ${team.length>0 ? team.map(p=>`<div class="status-row"><span class="icon">${spriteHtml(p.speciesId,'sprite-sm')}</span><span>${p.name} — Lv.${p.level}</span></div>`).join('') : '<p>Não foi possível carregar esse time.</p>'}
      </div>
      <button class="btn secondary" onclick="closePlayerTeamModal()">Fechar</button>

function watchLeagueMatch(ct, li, rk, mi){
  let league = null;
  if(game.leagueHistoryView && game.leagueHistoryView.cycleTime===ct){
    league = game.leagueHistoryView.league;
  } else if(game.leagueData){
    const cycle = game.leagueData.cycles.find(c=>c.scheduledTime===ct);
    if(cycle && cycle.leagues){ league = cycle.leagues[li]; }
  }
  if(!league) return;
  const match = league.rounds[rk][mi];
  if(!match || !match.resolved || !match.matchups || match.matchups.length===0) return;
  game.leagueWatch = {
    playerAName: match.a.name,
    playerBName: match.b.name,
    matchups: match.matchups,
    winnerName: match.winner.name
  };
  game.leagueWatchIndex = 0;
  game.leagueWatchPhase = 'loading';
  game.screen = 'leagueWatch';
  render();
  setTimeout(advanceLeagueWatch, 1200);
}
function advanceLeagueWatch(){
  if(game.screen !== 'leagueWatch') return;
  const w = game.leagueWatch;
  if(game.leagueWatchPhase === 'loading'){
    game.leagueWatchPhase = 'result';
    render();
    setTimeout(animateLeagueWatchHpBars, 50);
    setTimeout(advanceLeagueWatch, 1300);
  } else if(game.leagueWatchIndex < w.matchups.length - 1){
    game.leagueWatchIndex++;
    game.leagueWatchPhase = 'loading';
    render();
    setTimeout(advanceLeagueWatch, 1200);
  }
}
function animateLeagueWatchHpBars(){
  if(game.screen !== 'leagueWatch' || game.leagueWatchPhase !== 'result') return;
  const m = game.leagueWatch.matchups[game.leagueWatchIndex];
  const playerFill = document.getElementById('hp-fill-player');
  const enemyFill = document.getElementById('hp-fill-enemy');
  const playerLabel = document.getElementById('hp-label-player');
  const enemyLabel = document.getElementById('hp-label-enemy');
  if(playerFill){
    const pct = Math.max(0, (m.playerHpAfter/m.playerMaxHp)*100);
    playerFill.style.width = pct + '%';
    playerFill.className = 'hp-bar-fill ' + hpBarClass(pct);
  }
  if(enemyFill){
    const pct = Math.max(0, (m.enemyHpAfter/m.enemyMaxHp)*100);
    enemyFill.style.width = pct + '%';
    enemyFill.className = 'hp-bar-fill ' + hpBarClass(pct);
  }
  if(playerLabel){ playerLabel.textContent = `${Math.max(0,m.playerHpAfter)}/${m.playerMaxHp} HP`; }
  if(enemyLabel){ enemyLabel.textContent = `${Math.max(0,m.enemyHpAfter)}/${m.enemyMaxHp} HP`; }
}
function leaveLeagueWatch(){
  const dest = game.leagueWatchReturnScreen || 'league';
  game.leagueWatchReturnScreen = null;
  game.screen = dest;
  render();
  if(dest==='pokedex'){ loadSaveSlots(); }
}

  <div class="box cursor">

      <span class="team-alive-chip">🎽 ${w.playerAName}: ${loading?m.playerAliveBefore:m.playerAliveAfter}/${m.playerTeamSize} vivos</span>
      <span class="team-alive-chip">🥊 ${w.playerBName}: ${loading?m.enemyAliveBefore:m.enemyAliveAfter}/${m.enemyTeamSize} vivos</span>
    </div>
    <div class="battle-vs">
      <div class="fighter">
        <div class="fighter-emoji">${playerSp?battleSpriteHtml(m.playerSpecies, m.enemySpecies, 'sprite-lg'):''}</div>${m.player} <span class="fighter-level">Lv.${m.playerLevel}</span>
        ${renderHpBar(m.playerHpBefore, m.playerMaxHp, 'hp-fill-player', 'hp-label-player')}
      </div>
      <span class="vs-swords ${loading?'spin':''}">⚔️</span>
      <div class="fighter">
        <div class="fighter-emoji">${enemySp?battleSpriteHtml(m.enemySpecies, m.playerSpecies, 'sprite-lg'):''}</div>${m.enemy} <span class="fighter-level">Lv.${m.enemyLevel}</span>

      ? `<div class="loading-dots"><span></span><span></span><span></span></div><p class="loading-text">Aguardando o resultado da batalha...</p>`

  </div>
  ${(!loading && isLast) ? `
  <div class="badge-earned">

function formatClock(ms){
  return new Date(ms).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}
function formatDateShort(ms){
  return new Date(ms).toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
}
function renderLeagueCycle(cycle){
  const phaseTimes = [cycle.qfTime, cycle.sfTime, cycle.finalTime, cycle.phase4Time];
  const myLeague = findMyLeagueInCycle(cycle);
  const otherLeagues = cycle.leagues.filter(l=> !myLeague || l.id!==myLeague.id);
  const myRoundCount = myLeague ? Object.keys(myLeague.rounds).length : 3;
  const roundNames = roundLabelsFor(myRoundCount);
  const nextPhaseIdx = phaseTimes.slice(0,myRoundCount).findIndex(t=>t && Date.now()<t);
  const grandeCount = cycle.leagues.filter(l=>l.size===GRANDE_LIGA_SIZE).length;
  const regularCount = cycle.leagues.filter(l=>l.size!==GRANDE_LIGA_SIZE).length;
  const leaguesSummary = [
    grandeCount>0 ? `${grandeCount} Grande Liga${grandeCount>1?'s':''} de 16 treinadores` : '',
    regularCount>0 ? `${regularCount} Liga${regularCount>1?'s':''} de 8 treinadores` : ''
  ].filter(Boolean).join(' e ');
  return `
  <div class="box">
    <h2>⚔️ Liga das ${formatClock(cycle.scheduledTime)}${cycle.status==='complete'?' — Encerrada':''}</h2>
    <p>${leaguesSummary} formada(s) simultaneamente.</p>
    ${cycle.status!=='complete' && nextPhaseIdx>=0 ? `<div class="pool-badge"><div class="pool-badge-main">${roundNames[nextPhaseIdx].toUpperCase()} ÀS ${formatClock(phaseTimes[nextPhaseIdx])}</div></div>` : ''}
  </div>
  ${myLeague ? `
  <div class="box"><h2>🎽 Sua Liga${myLeague.size===GRANDE_LIGA_SIZE?' — 🌟 Grande Liga':''}</h2></div>
  ${Object.keys(myLeague.rounds).sort((a,b)=>Number(a)-Number(b)).map((rk,ri)=>`
    <div class="box">
      <h2>${roundNames[ri]}</h2>
      ${myLeague.rounds[rk].map((m,mi)=>leagueMatchRow(m, roundNames[ri], cycle.scheduledTime, myLeague.id, rk, mi)).join('')}
    </div>
  `).join('')}
  ${myLeague.champion ? `
  <div class="badge-earned">
    <div class="badge-icon">👑</div>
    <div class="badge-text">Campeão da sua Liga:<br><strong>${myLeague.champion.name}</strong>!</div>
  </div>` : ''}
  ` : `<div class="box"><p>Você não está em nenhuma Liga dessa rodada.</p></div>`}
  ${otherLeagues.length>0 ? `
  <div class="box">
    <h2>Outras Ligas rolando junto</h2>
    <div class="status-list">
      ${otherLeagues.map(l=>`<div class="status-row"><span class="icon">${l.size===GRANDE_LIGA_SIZE?'🌟':'🏆'}</span><span>${l.size===GRANDE_LIGA_SIZE?'Grande Liga':'Liga'} ${l.id+1}${l.champion?` — campeão: ${l.champion.name}`:' — em andamento'}</span></div>`).join('')}
    </div>
  </div>` : ''}
  `;
}
function renderLeagueHistoryScreen(){
  const view = game.leagueHistoryView;
  if(!view) return `<div class="box"><p>Carregando...</p></div><button class="btn primary" onclick="leaveLeagueScreen()">⬅ Voltar</button>`;
  const { cycleTime, league } = view;
  const roundKeys = Object.keys(league.rounds).sort((a,b)=>Number(a)-Number(b));
  const roundNames = roundLabelsFor(roundKeys.length);
  const myPlacement = computePlacement(league, game.trainerName);
  return `
  <div class="box">
    <h2>${league.size===GRANDE_LIGA_SIZE?'🌟 Grande Liga':'🏆 Liga'} das ${formatClock(cycleTime)}</h2>
    ${myPlacement ? `<p>Seu resultado: <strong>${myPlacement}</strong></p>` : ''}
  </div>
  ${roundKeys.map((rk,ri)=>`
    <div class="box">
      <h2>${roundNames[ri]}</h2>
      ${league.rounds[rk].map((m,mi)=>leagueMatchRow(m, roundNames[ri], cycleTime, league.id, rk, mi)).join('')}
    </div>
  `).join('')}
  ${league.champion ? `
  <div class="badge-earned">
    <div class="badge-icon">👑</div>
    <div class="badge-text">Campeão:<br><strong>${league.champion.name}</strong>!</div>
  </div>` : ''}

function renderLeague(){
  const data = game.leagueData;
  if(!data){
    return `<div class="box"><h2>🏆 Liga Pokémon</h2><p>Carregando...</p></div>
    <button class="btn primary" onclick="leaveLeagueScreen()">⬅ Voltar</button>`;
  }
  const registeringCycle = data.cycles.find(c=>c.status==='registering');
  const drawnCycles = data.cycles.filter(c=>{
    if(!c.leagues || c.leagues.length===0) return false;
    if(c.status==='drawn' || c.status==='advancing') return true;
    // ligas já concluídas só continuam aparecendo aqui se o jogador participou dela -- assim a Liga que
    // acabou de terminar não some da tela (mostra o campeão!), mas ligas antigas de outras pessoas não
    // ficam acumulando indefinidamente nessa seção
    if(c.status==='complete') return !!findMyLeagueInCycle(c);
    return false;
  });
  const alreadyIn = registeringCycle ? !!registeringCycle.amIRegistered : false;

  let body = `
  <div class="box">
    <h2>🏆 Liga Pokémon</h2>
    <p>Todos os treinadores que já venceram as 8 insígnias e chegaram até aqui. Se inscreva para participar da liga.</p>
    <p>Serão criadas ligas de 16 ou 8 jogadores de acordo com o número de jogadores inscritos.</p>
    <p>Caso algum jogador fique de fora do sorteio das ligas por conta do número de participantes, ele será automaticamente inscrito na próxima liga.</p>
  </div>`;

  if(registeringCycle){
    const willBeGrande = registeringCycle.registrants.length >= GRANDE_LIGA_SIZE;
    const r1 = registeringCycle.scheduledTime + PHASE_MS;
    const r2 = registeringCycle.scheduledTime + PHASE_MS*2;
    const r3 = registeringCycle.scheduledTime + PHASE_MS*3;
    const r4 = registeringCycle.scheduledTime + PHASE_MS*4;
    body += `
    <div class="box">
      <p>Você está se inscrevendo para a Liga das <strong>${formatClock(registeringCycle.scheduledTime)}</strong>.</p>
      <div class="pool-badge">
        <div class="pool-badge-main">COMEÇA ÀS ${formatClock(registeringCycle.scheduledTime)}</div>
        ${willBeGrande ? `
        <div class="pool-badge-sub">Oitavas de Final: ${formatClock(r1)}</div>
        <div class="pool-badge-sub">Quartas de Final: ${formatClock(r2)}</div>
        <div class="pool-badge-sub">Semifinal: ${formatClock(r3)}</div>
        <div class="pool-badge-sub">Final: ${formatClock(r4)}</div>
        ` : `
        <div class="pool-badge-sub">Quartas de Final: ${formatClock(r1)}</div>
        <div class="pool-badge-sub">Semifinal: ${formatClock(r2)}</div>
        <div class="pool-badge-sub">Final: ${formatClock(r3)}</div>
        `}
      </div>
    </div>
    <div class="box">
      <h2>Inscritos</h2>
      <p>${registeringCycle.registrants.length} treinador(es) inscrito(s) até agora.</p>
    </div>
    ${!alreadyIn ? `
    <div class="box">
      <h2>Inscreva-se</h2>
      <p>Você vai se inscrever como <strong>${game.trainerName}</strong> (nome do seu save).</p>
      ${game.leagueError ? `<p class="error-text">${game.leagueError}</p>` : ''}
      <button class="btn danger" ${game.leagueSubmitting?'disabled':''} onclick="registerForLeague()">${game.leagueSubmitting?'Inscrevendo...':'Confirmar inscrição ⚔️'}</button>
    </div>` : `
    <div class="box">
      <h2>✅ Você está inscrito!</h2>
      <p>Você está confirmado como <strong>${game.trainerName}</strong> pra essa rodada.</p>
      ${game.leagueError ? `<p class="error-text">${game.leagueError}</p>` : ''}
      <button class="btn secondary" ${game.leagueSubmitting?'disabled':''} onclick="cancelLeagueRegistration()">${game.leagueSubmitting?'Cancelando...':'Cancelar inscrição'}</button>
    </div>`}
    `;
  }

  drawnCycles.forEach(cycle=>{ body += renderLeagueCycle(cycle); });

  if(game.trainerName){
    const myHistory = game.myLeagueHistory || [];
    if(myHistory.length>0){
      body += `
      <div class="box">
        <h2>📜 Suas últimas Ligas</h2>
        <div class="status-list">
          ${myHistory.map(h=>`
            <div class="status-row">
              <span class="icon">${h.leagueSize===GRANDE_LIGA_SIZE?'🌟':'🏅'}</span>
              <span>${h.leagueSize===GRANDE_LIGA_SIZE?'Grande Liga':'Liga'} ${formatDateShort(h.cycleTime)} - ${formatClock(h.cycleTime)}: <strong>${h.placement}</strong></span>
              <button class="league-history-btn" onclick="viewLeagueHistory('${h.cycleId}',${h.leagueId},${h.cycleTime})">▶ Rever</button>
            </div>
          `).join('')}
        </div>
      </div>`;
    }
  }

  return `
  ${body}
  ${game.leagueError && !registeringCycle ? `<p class="error-text">${game.leagueError}</p>` : ''}
  <button class="btn primary" onclick="leaveLeagueScreen()">⬅ Voltar</button>`;
}

async function startMewtwoBattle(slot){
  const saveData = game.saveSlots[slot];
  if(!saveData || !saveData.team || saveData.team.length===0) return;
  const team = saveData.team.map(p=> createInstance(p.speciesId, p.level));
  const mewtwoTeam = [createInstance('mewtwo', 99)];
  const result = simulateGymBattle(team, mewtwoTeam);
  if(result.win && game.authUser){
    try{
      const ref = saveDocRef(game.authUser.uid, slot);
      const snap = await ref.get();
      if(snap.exists){
        const freshData = snap.data();
        const updatedCaught = Array.from(new Set([...(freshData.caughtSpecies||[]), 'mewtwo']));
        await ref.set({ ...freshData, caughtSpecies: updatedCaught });
        game.saveSlots[slot] = { ...freshData, caughtSpecies: updatedCaught };
        if(game.currentSaveSlot===slot){ game.caughtSpecies = updatedCaught; }
      }
    } catch(e){ console.error('Erro ao salvar a captura do Mewtwo:', e); }
  }
  game.leagueWatch = {
    playerAName: saveData.trainerName,
    playerBName: 'Mewtwo Selvagem',
    matchups: result.matchups,
    winnerName: result.win ? saveData.trainerName : 'Mewtwo Selvagem'
  };
  game.leagueWatchIndex = 0;
  game.leagueWatchPhase = 'loading';
  game.leagueWatchReturnScreen = 'pokedex';
  game.screen = 'leagueWatch';
  render();
  setTimeout(advanceLeagueWatch, 1200);
}

/* ============ INTRO POKÉBOLA ============ */
(function(){
  const introBall = document.getElementById('introBall');
  const introStage = document.getElementById('introStage');
  const introCore = document.getElementById('introCore');
  const introLoadUi = document.getElementById('introLoadUi');
  const introFill = document.getElementById('introFill');
  const bootEl = document.getElementById('boot');
  const introFlashEl = document.getElementById('introFlash');
  const wait = ms => new Promise(r => setTimeout(r, ms));

  function introStars(){
    for(let i=0;i<8;i++){
      const s = document.createElement('div');
      s.className = 'intro-star';
      s.textContent = i%2 ? '✦' : '★';
      s.style.color = i%2 ? '#ffcb05' : '#fff5d6';
      const ang = (Math.PI*2/8)*i + 0.4;
      s.style.setProperty('--dx', Math.cos(ang)*150+'px');
      s.style.setProperty('--dy', Math.sin(ang)*150+'px');
      s.style.setProperty('--rot', (i%2? 160:-160)+'deg');
      introStage.appendChild(s);
      setTimeout(()=>s.remove(), 1000);
    }
  }

  async function runIntro(){
    await wait(450);

    // 1. metades fecham
    introStage.classList.add('closed');
    introBall.classList.add('closed');
    await wait(560);
    introBall.classList.add('clunk');
    await wait(380);

    // 2. luz vermelha acende + balanço de captura
    introCore.classList.add('lit');
    introBall.classList.add('wobble');
    await wait(850);
    introBall.classList.remove('wobble');
    introCore.classList.add('pulse');

    // 3. carregando -- ao mesmo tempo, o Firebase real já está resolvendo o login em segundo plano
    introLoadUi.classList.add('show');
    for(let p=0; p<=100; p+=4){
      introFill.style.width = p+'%';
      await wait(90);
    }
    await wait(250);

    // espera o Firebase confirmar se o jogador já está logado ou não, pra revelar a tela certa
    // por trás (sem isso, quem já tava logado veria a tela de login piscar por um instante antes
    // de cair na seleção de save). Tem um limite de segurança pra não travar o jogo se a conexão
    // estiver ruim ou o Firebase demorar demais pra responder.
    await Promise.race([authCheckedOnce, wait(4000)]);

    // 4. captura concluída: clarão + estrelas
    introCore.classList.remove('pulse');
    introCore.classList.add('burst');
    introStars();
    await wait(450);
    introFlashEl.classList.add('go');
    await wait(320);

    // 5. revela o jogo (a tela de login ou a seleção de save, o que já estiver certo por trás)
    bootEl.classList.add('gone');
  }
  runIntro();
})();
</script>
