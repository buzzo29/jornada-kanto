let autoSaveDebounceTimer = null;
function maybeAutoSave(){
  if(!game.authUser || game.currentSaveSlot==null) return;
  if(!SAFE_SAVE_SCREENS.has(game.screen)) return;
  // agrupa cliques rápidos (ex: distribuir vários pontos de level seguidos) numa única gravação,
  // em vez de escrever no Firestore a cada clique individual
  if(autoSaveDebounceTimer){ clearTimeout(autoSaveDebounceTimer); }
  autoSaveDebounceTimer = setTimeout(()=>{
    autoSaveDebounceTimer = null;
    if(game.authUser && game.currentSaveSlot!=null && SAFE_SAVE_SCREENS.has(game.screen)){
      saveCurrentGame();
    }
  }, 800);
}
function flushPendingAutoSave(){
  if(!autoSaveDebounceTimer) return;
  clearTimeout(autoSaveDebounceTimer);
  autoSaveDebounceTimer = null;
  if(game.authUser && game.currentSaveSlot!=null && SAFE_SAVE_SCREENS.has(game.screen)){
    saveCurrentGame();
  }

function reconcileInstanceIdCounter(){
  let maxId = 0;
  game.team.forEach(p=>{
    const match = /^mon(\d+)$/.exec(p.id||'');
    if(match){ maxId = Math.max(maxId, parseInt(match[1],10)); }
  });
  nextInstanceId = Math.max(nextInstanceId, maxId+1);
}

    render();
  } catch(e){ console.error(e); }

  try{
    const scheduleSnap = await scheduleDocRef().get();
    if(!scheduleSnap.exists) return false;
    const cycles = scheduleSnap.data().cycles || [];
    const checks = await Promise.all(cycles.map(async (entry)=>{
      if(entry.status==='registering'){
        const regSnap = await registrantDocRef(entry.id, trainerName).get();
        return regSnap.exists;
      } else if(entry.status==='drawn'){
        const detailSnap = await cycleDocRef(entry.id).get();
        if(!detailSnap.exists) return false;
        return (detailSnap.data().leagues||[]).some(league=>
          Object.values(league.rounds||{}).some(round=>
            round.some(m=> (m.a && m.a.name===trainerName) || (m.b && m.b.name===trainerName))
          )
        );
      }
      return false;
    }));
    return checks.some(Boolean);
  } catch(e){ console.error('Erro ao checar Liga:', e); return false; }
}

  try{

    const snap = await saveDocRef(game.authUser.uid, slot).get();

function getAchievementAggregate(){
  const slots = (game.saveSlots || []).filter(Boolean);
  const caught = getAllCaughtSpecies();
  const maxBadges = slots.reduce((max,s)=> Math.max(max, s.badgeCount!=null ? s.badgeCount : (s.badgesEarned?s.badgesEarned.length:0)), 0);
  return {
    caughtCount: caught.size,
    totalSpecies: Object.keys(SPECIES).length,
    maxBadges,
    anyEvolution: slots.some(s=> (s.evolutions||[]).length>0),
    anyEeveeEvo: ['vaporeon','jolteon','flareon'].some(id=>caught.has(id)),
    anyLegendary: ['moltres','zapdos','articuno'].some(id=>caught.has(id)),
    anyFullTeam: slots.some(s=> (s.team||[]).length>=6),
    anyComeback: slots.some(s=> (s.losses||0)>0 && (s.badgeCount||0)>0),
    slotsUsed: slots.length,
    anyJourneyEnd: slots.some(s=> (s.badgeCount||0)>=8),
    trainerNames: [...new Set(slots.map(s=>s.trainerName).filter(Boolean))]
  };
}
async function computeLeagueAchievementExtra(trainerNames){
  const result = { anyRegistered:false, anySemifinal:false, anyRunnerUp:false, anyChampion:false };
  if(!trainerNames || trainerNames.length===0) return result;
  try{
    const scheduleSnap = await scheduleDocRef().get();
    if(!scheduleSnap.exists) return result;
    const cycles = scheduleSnap.data().cycles || [];
    const registering = cycles.find(c=>c.status==='registering');
    if(registering){
      const regChecks = await Promise.all(trainerNames.map(name=>registrantDocRef(registering.id, name).get().then(s=>s.exists).catch(()=>false)));
      if(regChecks.some(Boolean)){ result.anyRegistered = true; }
    }
    const completedEntries = cycles.filter(c=>c.status==='complete');
    const detailSnaps = await Promise.all(completedEntries.map(entry=>cycleDocRef(entry.id).get().catch(()=>null)));
    for(const detailSnap of detailSnaps){
      if(!detailSnap || !detailSnap.exists) continue;
      const detail = detailSnap.data();
      for(const name of trainerNames){
        for(const league of (detail.leagues||[])){
          const placement = computePlacement(league, name);
          if(placement==='Campeão'){ result.anyChampion = true; result.anyRunnerUp = true; result.anySemifinal = true; }
          else if(placement==='Vice-campeão'){ result.anyRunnerUp = true; result.anySemifinal = true; }
          else if(placement==='3º–4º Lugar'){ result.anySemifinal = true; }
        }
      }
    }
  } catch(e){ console.error('Erro ao checar conquistas da Liga:', e); }
  return result;
}

// A terceira carta rara (doc 05 §5): aparece brilhando, com chance dobrada de shiny e uma
// oferta garantida acima da média. Sorte pura, positiva, e impossível de farmar perdendo.
const GOLDEN_ROUTE_CHANCE = 0.08;
const LEGENDARY_ROUTE_CHANCE = 0.05; // as aves só existem na rota canônica delas

function routesForLeg(legIndex){
  return ROUTE_MAP[legIndex] || ROUTE_MAP[ROUTE_MAP.length-1];
}
function findRoute(routeId){
  for(const pair of ROUTE_MAP){
    const found = pair.find(r=>r.id===routeId);
    if(found) return found;
  }
  return null;
}
function makeGoldenRoute(legIndex){
  const pair = routesForLeg(legIndex);
  const merged = [...new Set([].concat(pair[0].pool, pair[1].pool, pair[0].rare||[], pair[1].rare||[]))]
    .filter(id=>SPECIES[id]);
  return {
    id:'golden_'+legIndex, name:'Clareira Dourada', icon:'✨', risk:'dourada', golden:true,
    types:['Normal'], rumor:'Uma luz dourada atravessa as árvores. Isso quase nunca acontece.',
    pool: merged.length ? merged : LEGS[legIndex].pool, rare:[]
  };
}

/* ---------------------------------------------------

--------------------------------------------------- */
function goToRouteChoice(){
  const legIndex = game.gymIndex;
  const pair = routesForLeg(legIndex).map(r=>r.id);
  const cards = pair.slice();
  // no desafio diário a seed global decide as rotas douradas -- todo mundo enfrenta o mesmo mapa
  const roll = game.dailyChallenge ? dailyRng()() : Math.random();
  if(roll < GOLDEN_ROUTE_CHANCE){ cards.push('golden_'+legIndex); }
  game.routeCards = cards;
  game.screen = 'routeChoice';
  render();
}
function routeById(id){
  if(String(id).startsWith('golden_')) return makeGoldenRoute(parseInt(String(id).split('_')[1],10));
  return findRoute(id);
}
function chooseRoute(id){
  const route = routeById(id);
  if(!route) return;
  game.currentRoute = id;
  game.routeHistory = (game.routeHistory||[]).slice();
  game.routeHistory[game.gymIndex] = id;
  game.routeCards = null;
  game.pendingSteps = buildLegSteps();
  advanceJourney();
}

/* ===================================================================
   PIPELINE DA JORNADA
   Cada perna virou uma sequência de telas opcionais (rota, evento da
   rota, encontro selvagem, troca com NPC, emboscada, rival, cassino...).
   Em vez de encadear callbacks, a perna monta uma fila de "passos" e
   `advanceJourney()` vai consumindo até sobrar a distribuição de levels.
   =================================================================== */
function buildLegSteps(){
  const i = game.gymIndex;
  const steps = ['routeEvent', 'wild'];
  if(NPC_TRADE_LEGS.includes(i) && !(game.npcTradesDone||[]).includes(i)) steps.push('npcTrade');
  if(JESSIE_LEGS.includes(i)) steps.push('jessie');
  if(i >= 1) steps.push('rocket');
  steps.push('hideout');
  if(RIVAL_LEGS.includes(i)) steps.push('rival');
  if(i === CASINO_LEG && !game.casinoDone) steps.push('casino');
  if(i === SNORLAX_LEG && !game.routeEventDone['snorlax']) steps.push('snorlax');
  if(i >= 1) steps.push('dayCare');
  return steps;
}
function startLeg(){
  game.pendingSteps = [];
  goToRouteChoice();
}
// chamado depois da escolha de rota e no fim de cada passo
function advanceJourney(){
  // A fila é montada UMA vez, na escolha da rota (`chooseRoute`). Reconstruí-la aqui faria o
  // último passo da perna reabrir o encontro selvagem inteiro — a perna rodava duas vezes.
  if(!game.currentRoute){ goToRouteChoice(); return; }
  if(!Array.isArray(game.pendingSteps)) game.pendingSteps = [];
  while(game.pendingSteps.length){
    const step = game.pendingSteps.shift();
    if(runJourneyStep(step)) return; // o passo abriu uma tela; o resto continua quando ela terminar
  }
  collectDayCareMon();
  startLevelDistribution();
}
function runJourneyStep(step){
  switch(step){
    case 'routeEvent': return startRouteEvent();
    case 'wild':       return startWildEncounter();
    case 'npcTrade':   return startNpcTrade();
    case 'jessie':     return startJessieJames();
    case 'rocket':     return maybeRocketAmbush();
    case 'hideout':    return maybeOpenHideout();
    case 'rival':      return startRivalBattle();
    case 'casino':     return openCasino();
    case 'snorlax':    return startSnorlax();
    case 'dayCare':    return openDayCare();
  }
  return false;
}

/* ---------------------------------------------------
   ENCONTRO SELVAGEM (doc 02 §4.4 raridade + pity, doc 05 pools de rota)
--------------------------------------------------- */
const PITY_THRESHOLD_BST = 400;   // "raro" pra efeito de pity
const PITY_ENCOUNTERS = 3;        // 3 encontros secos garantem um raro no próximo
const SHINY_CHANCE = 1/128;

function bstOf(speciesId){
  const sp = SPECIES[speciesId];
  if(!sp) return 300;
  return sp.hp + sp.attack + sp.defense + sp.speed;
}
// Peso inverso ao BST: um Rattata aparece muito mais que um Dratini. Sem isso, todo pokémon
// do pool tinha exatamente a mesma chance e "raro" não queria dizer nada (doc 02 §4.4).
function rarityWeight(speciesId){
  const bst = bstOf(speciesId);
  return Math.max(0.15, Math.pow(420 / Math.max(120, bst), 2.2));
}
function weightedPick(pool, rng, exclude){
  const options = pool.filter(id=>SPECIES[id] && !(exclude||[]).includes(id));
  if(options.length===0) return null;
  const weights = options.map(rarityWeight);
  const total = weights.reduce((a,b)=>a+b,0);
  let r = rng() * total;
  for(let i=0;i<options.length;i++){
    r -= weights[i];
    if(r <= 0) return options[i];
  }
  return options[options.length-1];
}
function startWildEncounter(){
  const route = routeById(game.currentRoute) || { pool: LEGS[game.gymIndex].pool, rare:[], risk:'calma' };
  if(route.noWild) return false; // S.S. Anne / Silph Co. / Safári resolvem tudo no evento da rota
  const leg = LEGS[game.gymIndex];
  const rng = game.dailyChallenge ? dailyRng('wild'+game.gymIndex) : Math.random;
  const risky = route.risk === 'arriscada';
  const golden = !!route.golden;
  const levelBump = golden ? 2 : (risky ? 1 : 0);

  const picked = [];
  for(let i=0;i<leg.offerCount;i++){
    const id = weightedPick(route.pool, rng, picked);
    if(id) picked.push(id);
  }
  // raros da rota: 5% pras aves lendárias (que agora só existem na rota canônica delas),
  // 12% (ou 20% em rota arriscada) pros demais exclusivos
  (route.rare||[]).forEach(rareId=>{
    if(!SPECIES[rareId] || picked.includes(rareId)) return;
    const isBird = LEGENDARY_BIRDS.includes(rareId);
    const chance = isBird ? LEGENDARY_ROUTE_CHANCE : (risky ? 0.20 : 0.12);
    if(rng() < chance){ picked[Math.floor(rng()*picked.length)] = rareId; }
  });
  // pity: 3 encontros seguidos sem nada acima de 400 de BST garantem um raro agora
  const hasRare = picked.some(id=>bstOf(id) >= PITY_THRESHOLD_BST);
  if(!hasRare && (game.pityCounter||0) >= PITY_ENCOUNTERS){
    const candidates = [].concat(route.pool, route.rare||[])
      .filter(id=>SPECIES[id] && bstOf(id) >= PITY_THRESHOLD_BST && !LEGENDARY_BIRDS.includes(id));
    if(candidates.length){
      picked[Math.floor(rng()*picked.length)] = candidates[Math.floor(rng()*candidates.length)];
    }
  }
  // rota dourada: uma oferta garantidamente acima da média do próprio pool
  if(golden){
    const best = route.pool.slice().sort((a,b)=>bstOf(b)-bstOf(a))[0];
    if(best) picked[0] = best;
  }
  const finalHasRare = picked.some(id=>bstOf(id) >= PITY_THRESHOLD_BST);
  game.pityCounter = finalHasRare ? 0 : (game.pityCounter||0) + 1;

  // presentes de evento (Lapras da Silph, Gengar da torre, Porygon do cassino, Farfetch'd do capitão)
  // entram garantidos na próxima leva de ofertas
  if(game.pendingGift && SPECIES[game.pendingGift]){
    picked[picked.length-1] = game.pendingGift;
    game.pendingGift = null;
  }
  const shinyChance = golden ? SHINY_CHANCE*2 : SHINY_CHANCE;
  game.wildOffer = picked.map(id=>({
    speciesId: id,
    level: LEGENDARY_BIRDS.includes(id) ? 45 : Math.min(55, randomInt(leg.minLevel, leg.maxLevel) + levelBump),
    shiny: rng() < shinyChance
  }));
  game.wildSelected = [];
  game.screen = 'wild';
  render();
  return true;
}

function collectDayCareMon(){

/* ---------------------------------------------------
   RANKING DO DIA (doc 02 §3)
   Quem joga o desafio diário entra num placar do dia: quem zerou com menos derrotas.
--------------------------------------------------- */
function dailyRankDocRef(seed){ return db.collection('leagues').doc('daily_'+seed); }
async function submitDailyResult(){
  if(!game.dailyChallenge || !game.dailySeed || !game.authUser) return;
  const key = sanitizeForDocId(game.trainerName || 'sememnome');
  try{
    const entry = {
      name: game.trainerName || 'Sem nome',
      badges: game.badgesEarned.length,
      losses: game.totalLossesJourney || 0,
      points: game.totalPointsEarned || 0,
      nuzlocke: !!game.nuzlocke,
      at: Date.now()
    };
    await dailyRankDocRef(game.dailySeed).set({ seed: game.dailySeed, entries: { [key]: entry } }, { merge: true });
  } catch(e){ console.error('Erro ao enviar resultado do desafio diário:', e); }
}
async function loadDailyRanking(){
  if(!game.dailySeed) return;
  try{
    const snap = await dailyRankDocRef(game.dailySeed).get();
    const entries = (snap.exists && snap.data().entries) ? Object.values(snap.data().entries) : [];
    // ordem: mais insígnias, depois menos derrotas, depois menos pontos gastos
    entries.sort((a,b)=> (b.badges-a.badges) || (a.losses-b.losses) || (a.points-b.points));
    game.dailyRanking = entries.slice(0, 20);
    if(game.screen==='journeyEnd' || game.screen==='journeyDiary') render();
  } catch(e){ console.error('Erro ao carregar ranking do dia:', e); }
}

/* ---------------------------------------------------
   DESAFIO DIÁRIO COM SEED GLOBAL (doc 02 §3)
   Todo mundo que joga no mesmo dia enfrenta exatamente as mesmas ofertas,
   as mesmas rotas douradas e os mesmos eventos.
--------------------------------------------------- */
function todaySeedString(){
  const d = new Date();
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
let dailyRngCache = {};
function dailyRng(salt){
  const key = (game.dailySeed || todaySeedString()) + '|' + (salt||'');
  if(!dailyRngCache[key]) dailyRngCache[key] = makeSeededRng(key);
  return dailyRngCache[key];
}

/* ===================================================================
   MOTOR GENÉRICO DE BATALHAS DE EVENTO
   Rocket, rival, Jessie & James, Snorlax, torre de Lavender, dojo,
   S.S. Anne e Silph Co. usam todos o MESMO motor dos ginásios — muda só
   quem é o adversário, o texto e o que acontece no fim. Os desfechos
   ficam num registro por id (`EVENT_OUTCOMES`) porque callbacks não
   sobrevivem ao save no Firestore.
   =================================================================== */
function avgTeamLevel(){
  if(!game.team || game.team.length===0) return 5;
  return Math.round(game.team.reduce((a,p)=>a+p.level,0) / game.team.length);
}
function scaledTeam(list, offset){
  const avg = avgTeamLevel();
  return list.map(entry=>({
    speciesId: entry.species,
    level: Math.max(2, Math.min(60, entry.level != null ? entry.level : avg + (entry.rel||0) + (offset||0)))
  }));
}
function startEventBattle(cfg){
  game.eventBattle = cfg;
  game.eventResult = null;
  game.screen = 'eventIntro';
  render();
  return true;
}
function runEventBattle(){
  const cfg = game.eventBattle;
  if(!cfg) { advanceJourney(); return; }
  const myTeam = game.team.map(p=>Object.assign(createInstance(p.speciesId, p.level), { id:p.id, shiny:p.shiny }));
  applyTeamBonuses(myTeam, game.badgesEarned.length);
  const foeTeam = cfg.opponentTeam.map(o=>createInstance(o.speciesId, o.level));
  const result = simulateGymBattle(myTeam, foeTeam);
  game.eventResult = result;
  game.eventRevealIndex = 0;
  game.eventRevealPhase = 'loading';
  game.screen = 'eventBattling';
  render();
  setTimeout(advanceEventReveal, 1200);
}
function advanceEventReveal(){
  if(game.screen !== 'eventBattling') return;
  if(game.eventRevealPhase === 'loading'){
    game.eventRevealPhase = 'result';
    render();
    setTimeout(animateEventHpBars, 50);
    setTimeout(advanceEventReveal, 1300);
  } else {
    const matchups = game.eventResult.matchups;
    if(game.eventRevealIndex < matchups.length - 1){
      game.eventRevealIndex++;
      game.eventRevealPhase = 'loading';
      render();
      setTimeout(advanceEventReveal, 1200);
    } else {
      finishEventBattle();
    }
  }
}
function animateEventHpBars(){
  if(game.screen !== 'eventBattling' || game.eventRevealPhase !== 'result') return;
  const m = game.eventResult.matchups[game.eventRevealIndex];
  const pf = document.getElementById('hp-fill-player'), ef = document.getElementById('hp-fill-enemy');
  const pl = document.getElementById('hp-label-player'), el = document.getElementById('hp-label-enemy');
  if(pf){ const pct = Math.max(0,(m.playerHpAfter/m.playerMaxHp)*100); pf.style.width = pct+'%'; pf.className='hp-bar-fill '+hpBarClass(pct); }
  if(ef){ const pct = Math.max(0,(m.enemyHpAfter/m.enemyMaxHp)*100); ef.style.width = pct+'%'; ef.className='hp-bar-fill '+hpBarClass(pct); }
  if(pl){ pl.textContent = `${Math.max(0,m.playerHpAfter)}/${m.playerMaxHp} HP`; }
  if(el){ el.textContent = `${Math.max(0,m.enemyHpAfter)}/${m.enemyMaxHp} HP`; }
}
function finishEventBattle(){
  if(game.screen !== 'eventBattling') return;
  const cfg = game.eventBattle;
  const outcome = EVENT_OUTCOMES[cfg.id];
  game.eventOutcomeText = '';
  applyNuzlockeFaints(game.eventResult);
  if(game.eventResult.win){
    if(outcome && outcome.onWin) game.eventOutcomeText = outcome.onWin(cfg) || '';
  } else {
    if(outcome && outcome.onLose) game.eventOutcomeText = outcome.onLose(cfg) || '';
  }
  game.screen = 'eventResult';
  render();
}
function closeEventResultInner(){
  const cfg = game.eventBattle;
  game.eventBattle = null;
  game.eventResult = null;
  game.eventOutcomeText = '';
  if(cfg && cfg.returnScreen && !(cfg.chain && cfg.chain.length)){
    game.screen = cfg.returnScreen;
    render();
    return;
  }
  if(cfg && cfg.chain && cfg.chain.length){
    const next = cfg.chain.shift();
    // batalhas encadeadas (torre de Lavender, esconderijo, Silph) continuam sem redistribuir pontos
    if(game.eventChainFailed){ game.eventChainFailed = false; advanceJourney(); return; }
    startEventBattle(Object.assign({}, next, { chain: cfg.chain }));
    return;
  }
  advanceJourney();
}
function closeEventResult(){
  if((game.team||[]).length === 0){ game.screen = 'gameover'; render(); return; }
  closeEventResultInner();
}

/* ---------------------------------------------------
   MODO NUZLOCKE (doc 02 §3)
--------------------------------------------------- */
function applyNuzlockeFaints(result){
  if(!game.nuzlocke || !result || !result.playerStatus) return;
  const dead = result.playerStatus.filter(s=>s.fainted).map(s=>s.id);
  if(dead.length===0) return;
  game.faintedForever = (game.faintedForever||[]).concat(
    result.playerStatus.filter(s=>s.fainted).map(s=>({ name:s.name, speciesId:s.speciesId, level:s.level }))
  );
  game.team = game.team.filter(p=>!dead.includes(p.id));
}
// no Nuzlocke o time pode acabar zerado no meio de qualquer batalha -- aí a jornada termina
// ali mesmo, em vez de o jogo cair numa tela de distribuição sem ninguém pra receber pontos
function checkTeamWipe(){
  if((game.team||[]).length > 0) return false;
  game.screen = 'gameover';
  render();
  return true;
}

function randomRivalTaunt(){ return RIVAL_TAUNTS[Math.floor(Math.random()*RIVAL_TAUNTS.length)]; }
const RIVAL_STARTER_COUNTER = { bulbasaur:'charmander', charmander:'squirtle', squirtle:'bulbasaur' };
function rivalStarterEvolvedId(){
  const base = game.rivalStarterId || 'charmander';
  let cur = base, lvl = avgTeamLevel() + 1;
  while(EVOLUTIONS[cur] && lvl >= EVOLUTIONS[cur].level){ cur = EVOLUTIONS[cur].into; }
  return cur;
}
// doc 02 §2.1 — a mecânica de ouro: o que você recusou no encontro selvagem vira o time dele
function buildRivalTeam(){
  const avg = avgTeamLevel();
  const team = [{ speciesId: rivalStarterEvolvedId(), level: avg + 1 }];
  const refused = (game.rivalPool||[]).filter(id=>SPECIES[id]);
  const best = refused.slice().sort((a,b)=>bstOf(b)-bstOf(a)).slice(0, 5);
  best.forEach(id=>{
    let cur = id, lvl = avg + randomInt(-1, 1);
    while(EVOLUTIONS[cur] && lvl >= EVOLUTIONS[cur].level){ cur = EVOLUTIONS[cur].into; }
    team.push({ speciesId: cur, level: Math.max(3, lvl) });
  });
  while(team.length < 3){
    const filler = shuffle(LEGS[game.gymIndex].pool)[0];
    team.push({ speciesId: filler, level: Math.max(3, avg) });
  }
  return team.slice(0, 6);
}
function startRivalBattle(){
  game.rivalTaunt = randomRivalTaunt();
  return startEventBattle({
    id:'rival_battle', icon:'😤',
    title:`${escapeHtml(game.rivalName)} bloqueia o caminho!`,
    opponentName: game.rivalName,

    opponentTeam: buildRivalTeam(),

}

/* --- Zona de Safári (doc 02 §3): 8 ofertas, 30% de fuga --- */
const SAFARI_FLEE_CHANCE = 0.30;
function openSafari(){
  const route = routeById(game.currentRoute);
  const leg = LEGS[game.gymIndex];
  const pool = [].concat(route.pool, route.rare||[]).filter(id=>SPECIES[id]);
  const picked = [];
  for(let i=0;i<8;i++){
    const id = weightedPick(pool, Math.random, picked);
    if(id) picked.push(id);
  }
  game.safariOffer = picked.map(id=>({
    speciesId:id, level: randomInt(leg.minLevel, leg.maxLevel), status:'wild'
  }));
  game.safariCaught = [];
  game.screen = 'safari';
  render();
  return true;
}
function safariTry(index){
  const entry = game.safariOffer[index];
  if(!entry || entry.status !== 'wild') return;
  if(game.safariCaught.length >= 3){ return; }
  if(Math.random() < SAFARI_FLEE_CHANCE){
    entry.status = 'fled';
  } else {
    entry.status = 'caught';
    game.safariCaught.push(index);
  }
  render();
}
function finishSafari(){
  if(game.safariCaught.length>=3 && !game.safariOffer.some(e=>e.status==='fled')){ game.safariPerfect = true; }
  game.safariCaught.forEach(i=>{
    const e = game.safariOffer[i];
    if(!e) return;
    game.team.push(Object.assign(createInstance(e.speciesId, e.level), { shiny: Math.random() < SHINY_CHANCE }));
    markCaught(e.speciesId);
  });
  game.safariOffer = null;
  game.safariCaught = [];
  if(game.team.length > 6){ game.releaseSelected = []; game.screen = 'release'; render(); return; }
  advanceJourney();
}

function startNpcTrade(){
  const done = game.npcTradesDone || [];
  const available = NPC_TRADES.filter(t=>!done.includes(t.id) && !getAllCaughtSpecies().has(t.giveId));
  const usable = available.filter(t=> game.team.some(p=>p.types.some(ty=>t.wantTypes.includes(ty))) );
  const pick = usable[0] || available[0];
  if(!pick) return false;
  const eligible = game.team.filter(p=>p.types.some(ty=>pick.wantTypes.includes(ty)));
  if(eligible.length===0) return false;
  game.npcTradeOffer = { tradeId: pick.id, eligibleIds: eligible.map(p=>p.id) };
  game.screen = 'npcTrade';
  render();
  return true;
}
function acceptNpcTrade(monId){
  const offer = game.npcTradeOffer;
  if(!offer) return;
  const trade = NPC_TRADES.find(t=>t.id===offer.tradeId);
  const idx = game.team.findIndex(p=>p.id===monId);
  if(!trade || idx<0) return;
  const given = game.team[idx];
  const received = createInstance(trade.giveId, given.level);
  received.shiny = given.shiny;
  game.team[idx] = received;
  markCaught(trade.giveId);
  game.npcTradesDone = (game.npcTradesDone||[]).concat([trade.id]);
  game.npcTradeOffer = null;
  game.lastTradeText = `${given.name} foi trocado por ${received.name} (Lv.${received.level})!`;
  advanceJourney();
}

/* ===================================================================
   ECONOMIA DE HABILIDADE (docs 03 e 04)

   Princípio: A DERROTA DEFINE O PISO, O MÉRITO E A SORTE DEFINEM O TETO.
   - Perder nunca cria pontos: adianta pontos que a próxima vitória desconta
     (empréstimo, doc 03 proposta A).
   - Desmaiar só rende nível em batalha VENCIDA (doc 03 proposta D) — era esse
     o canal escondido que fazia perder de propósito valer a pena.
   - A vitória deixa de valer +10 fixos e passa a valer de +8 a +14 conforme
     desempenho, mais bônus opcionais de risco, conhecimento, sorte e sequência.
   Resultado: o feeder não apanha, ele só fica pobre.
   =================================================================== */
const WIN_BASE_POINTS = 8;
const SURVIVOR_BONUS_CAP = 3;
const STREAK_BONUS_CAP = 4;
const REMATCH_LEVEL_CAP = 3;      // doc 03 proposta C: o ginásio "aprende" a cada revanche
const GIOVANNI_RELIEF_CAP = 4;    // doc 02 §1.4: cada emboscada Rocket vencida enfraquece o Giovanni
const DEFEAT_ADVANCE = 5;         // o adiantamento entregue na hora da dificuldade
/* IMPORTANTE — por que o adiantamento é UM POR GINÁSIO, e não um por derrota:
   `game.losses` zera a cada ginásio, então um jogador pode perder de propósito 4 vezes em CADA
   um dos 8 ginásios (32 derrotas), não só 4 na jornada inteira como os docs 03/04 supunham.
   Se cada derrota adiantasse +5, seriam +160 adiantados contra no máximo ~14 por vitória: a
   dívida nunca seria quitada e o empréstimo viraria doação — o exploit voltaria inteiro
   (foi exatamente isso que `tools/sim-economia.js` pegou).
   Com o teto de 5 por ginásio, o adiantamento é SEMPRE menor que a base da vitória (+8), então
   ele é integralmente descontado e o saldo líquido de perder de propósito é exatamente zero —
   enquanto o feeder abre mão de tudo que é mérito: primeira tentativa, sobreviventes, maré e
   desafios. Da 2ª derrota em diante o socorro continua existindo, mas em forma de INFORMAÇÃO e
   FÔLEGO (time do líder revelado, reordenar, +10% de HP, reforço de emergência), nunca de poder
   permanente — que é a proposta E do doc 03. */

/* --- Desafios declarados (doc 04 §2): risco escolhido, nunca imposto --- */
const DECLARED_CHALLENGES = [
  { id:'four',     icon:'4️⃣', name:'Só 4 Pokémon',        desc:'Os 2 últimos da sua ordem ficam de fora.',              bonus:3 },
  { id:'notype',   icon:'🚫', name:'Sem vantagem de tipo', desc:'Quem tiver vantagem contra o líder fica no banco.',     bonus:4 },
  { id:'blind',    icon:'🎲', name:'Ordem cega',           desc:'A ordem do seu time é sorteada na hora da batalha.',    bonus:3 },
  { id:'handicap', icon:'🪢', name:'Mão amarrada',         desc:'Seu Pokémon mais forte fica de fora da batalha.',       bonus:3 }
];
function challengeById(id){ return DECLARED_CHALLENGES.find(c=>c.id===id) || null; }
function declareChallenge(id){
  game.declaredChallenge = (game.declaredChallenge===id) ? null : id;
  render();
}
function setMvpBet(id){
  game.mvpBet = (game.mvpBet===id) ? null : id;
  render();
}
function toggleScoreBet(){
  game.scoreBet = !game.scoreBet;
  render();
}
function hasTypeAdvantageAgainstGym(mon, gymTeam){
  return gymTeam.some(foe=>{
    const sp = SPECIES[foe.species || foe.speciesId];
    return sp && bestMultiplier(mon.types, sp.types) > 1;
  });
}
// devolve o time que realmente entra em campo, já com o handicap declarado aplicado
function battleLineup(){
  const gym = GYMS[game.gymIndex];
  let lineup = game.team.slice();
  switch(game.declaredChallenge){
    case 'four':
      lineup = lineup.slice(0, 4);
      break;
    case 'notype':
      lineup = lineup.filter(p=>!hasTypeAdvantageAgainstGym(p, gym.team));
      break;
    case 'blind':
      lineup = shuffle(lineup);
      break;
    case 'handicap': {
      let strongestIdx = 0, best = -1;
      lineup.forEach((p,i)=>{
        const score = p.level*10 + p.attack;
        if(score > best){ best = score; strongestIdx = i; }
      });
      lineup = lineup.filter((_,i)=>i!==strongestIdx);
      break;
    }
  }
  return lineup.length ? lineup : game.team.slice();
}
function challengeIsViable(id){
  const saved = game.declaredChallenge;
  game.declaredChallenge = id;
  const ok = battleLineup().length > 0 && !(id==='notype' && battleLineup().length===game.team.length && game.team.length===0);
  game.declaredChallenge = saved;
  if(id==='four') return game.team.length > 4;
  if(id==='handicap') return game.team.length > 1;
  if(id==='notype'){
    const gym = GYMS[game.gymIndex];
    const remaining = game.team.filter(p=>!hasTypeAdvantageAgainstGym(p, gym.team));
    return remaining.length > 0 && remaining.length < game.team.length;
  }
  return ok;
}

/* --- Time do líder: revanche encarece, emboscadas Rocket aliviam o Giovanni --- */
// doc 03 proposta C, com a dose que o próprio doc pede ("cuidado, senão pune demais quem está
// travado de verdade"): a PRIMEIRA revanche é contra o líder no nível normal. A escalada só
// começa da segunda em diante, e para em +3.
function rematchLevelBump(){
  return Math.min(REMATCH_LEVEL_CAP, Math.max(0, (game.losses||0) - 1));
}
function gymTeamForBattle(){
  const gym = GYMS[game.gymIndex];
  const rematchBump = rematchLevelBump();
  const giovanniRelief = (game.gymIndex===7) ? Math.min(GIOVANNI_RELIEF_CAP, game.rocketAmbushesWon||0) : 0;
  return gym.team.map(b=>createInstance(b.species, Math.max(2, b.level + rematchBump - giovanniRelief)));
}
function gymLevelAdjustNote(){
  const rematchBump = rematchLevelBump();
  const giovanniRelief = (game.gymIndex===7) ? Math.min(GIOVANNI_RELIEF_CAP, game.rocketAmbushesWon||0) : 0;
  const parts = [];
  if(rematchBump>0) parts.push(`<strong>+${rematchBump} nível</strong> no time dele (ele decorou sua estratégia)`);
  if(giovanniRelief>0) parts.push(`<strong>-${giovanniRelief} nível</strong> por cada emboscada Rocket que você venceu`);
  return parts.length ? parts.join(' e ') : '';
}

/* --- A nota da vitória (doc 04 §1) --- */
function computeVictoryRewards(result){
  const items = [];
  const status = result.playerStatus || [];
  const survivors = status.filter(s=>!s.fainted).length;

  items.push({ label:'Base da vitória', pts: WIN_BASE_POINTS });
  const survBonus = Math.min(SURVIVOR_BONUS_CAP, survivors);
  if(survBonus > 0) items.push({ label:`${survBonus} Pokémon de pé no fim`, pts: survBonus });
  if((game.losses||0) === 0) items.push({ label:'Vitória de primeira tentativa', pts: 2 });
  if(survivors === status.length && status.length > 0) items.push({ label:'Vitória perfeita ✨ (ninguém desmaiou)', pts: 1 });

  // maré de vitórias (doc 04 §5)
  const streakBonus = Math.min(STREAK_BONUS_CAP, Math.max(0, (game.winStreak||0)));
  if(streakBonus > 0) items.push({ label:`🔥 Maré de vitórias (${(game.winStreak||0)+1} seguidas)`, pts: streakBonus });

  // desafio declarado (doc 04 §2)
  const ch = challengeById(game.declaredChallenge);
  if(ch) items.push({ label:`${ch.icon} Desafio cumprido: ${ch.name}`, pts: ch.bonus });

  // aposta do treinador (doc 04 §3)
  if(game.mvpBet){
    const maxWins = Math.max(0, ...status.map(s=>s.wins||0));
    const betted = status.find(s=>s.id===game.mvpBet);
    if(betted && maxWins>0 && (betted.wins||0) === maxWins){
      items.push({ label:`🧠 MVP na mosca: ${betted.name}`, pts: 2 });
    } else {
      items.push({ label:`🧠 Aposta de MVP furada`, pts: 0 });
    }
  }
  if(game.scoreBet){
    const fainted = status.filter(s=>s.fainted).length;
    items.push({ label: fainted<=2 ? '🎯 Placar previsto (até 2 desmaios)' : '🎯 Previsão de placar furada', pts: fainted<=2 ? 1 : 0 });
  }

  const gross = items.reduce((a,it)=>a+it.pts, 0);
  // empréstimo: o adiantamento das derrotas é descontado aqui (doc 03 proposta A)
  const owed = game.pointsOwed || 0;
  const paid = Math.min(owed, gross);
  const net = gross - paid;
  return { items, gross, paid, net, owedAfter: owed - paid };
}

function openRoulette(){
  game.roulette = { cards:[0,1,2], picked:null, prize:null, line:null };
  game.screen = 'roulette';
  render();
}
function pickRouletteCard(index){
  if(!game.roulette || game.roulette.picked != null) return;
  const total = ROULETTE_PRIZES.reduce((a,p)=>a+p.weight,0);
  let r = Math.random()*total, chosen = ROULETTE_PRIZES[ROULETTE_PRIZES.length-1];
  for(const p of ROULETTE_PRIZES){ r -= p.weight; if(r<=0){ chosen = p; break; } }
  game.roulette.picked = index;
  game.roulette.prize = chosen.id;
  if(chosen.id === 'points'){
    game.nextLegPoints = (game.nextLegPoints||0) + 3;
    game.totalPointsEarned = (game.totalPointsEarned||0) + 3;
  } else if(chosen.id === 'candy'){
    game.rareCandyPending = (game.rareCandyPending||0) + 1;
  } else {
    game.roulette.line = GLORY_LINES[Math.floor(Math.random()*GLORY_LINES.length)];
    game.stickers = (game.stickers||[]).concat([GYMS[game.gymIndex].badge]);
  }
  render();
}
function useRareCandy(monId){
  if((game.rareCandyPending||0) <= 0) return;
  const mon = game.team.find(p=>p.id===monId);
  if(!mon) return;
  mon.level = Math.min(55, mon.level + 1);
  game.rareCandyPending--;
  tryEvolve(mon);
  render();
}
function closeRoulette(){
  game.roulette = null;
  goAfterGymVictory();
}

/* --- Socorro não-numérico na derrota (doc 03 proposta E) --- */
function prepareRetry(){
  // o adiantamento: +5 agora, descontados da próxima vitória. O total da jornada não sobe.
  const alreadyAdvanced = (game.advanceUsedAtGym === game.gymIndex);
  const advance = alreadyAdvanced ? 0 : DEFEAT_ADVANCE;
  game.advanceUsedAtGym = game.gymIndex;
  game.pool = advance;
  game.poolTotal = advance;
  game.pointsOwed = (game.pointsOwed||0) + advance;
  game.totalPointsEarned = (game.totalPointsEarned||0) + advance;
  game.leaderRevealed = true;          // informação: o time completo do líder fica visível
  // Fôlego crescente: +10% de HP por derrota acumulada, até +30%. É temporário (expira na
  // vitória) e NÃO vai para a Liga -- por isso não reabre o feeding: nada disso vira poder
  // permanente. É a resposta à segunda restrição do doc 03: perder não pode virar espiral
  // da morte. Quem perde de verdade ganha fôlego; quem perde de propósito ganha nada que dure.
  game.hpBuffNext = Math.min(0.30, 0.10 * (game.losses||1));
  game.declaredChallenge = null;
  game.mvpBet = null;
  game.scoreBet = false;
  game.alloc = {};
  game.team.forEach(p=> game.alloc[p.id]=0 );
  // na 4ª derrota, à beira do game over: reforço de emergência do pool da rota atual
  if(game.losses >= 3 && !game.emergencyUsed && game.team.length < 6){
    const route = routeById(game.currentRoute);
    const pool = (route && route.pool && route.pool.length) ? route.pool : LEGS[game.gymIndex].pool;
    game.emergencyOffer = shuffle(pool).slice(0,3);
    game.screen = 'emergency';
    render();
    return;
  }
  game.screen = (advance > 0) ? 'levels' : 'teamOrder';
  render();
}
function takeEmergencyMon(id){
  game.emergencyUsed = true;
  const leg = LEGS[game.gymIndex];
  const mon = createInstance(id, randomInt(leg.minLevel, leg.maxLevel));
  markCaught(id);
  if(game.team.length < 6){ game.team.push(mon); game.alloc[mon.id] = 0; }
  game.emergencyOffer = null;
  game.screen = (game.poolTotal > 0) ? 'levels' : 'teamOrder';
  render();
}
function skipEmergency(){
  game.emergencyUsed = true;
  game.emergencyOffer = null;
  game.screen = (game.poolTotal > 0) ? 'levels' : 'teamOrder';
  render();
}

/* --- Teto teórico: quanto de nível é possível ter honestamente (doc 04) ---
   Não é limite de jogo: é a régua que a Cloud Function usa pra recusar time forjado. --- */
function theoreticalMaxPoints(){
  // 20 iniciais + 7 distribuições no melhor caminho possível (nota máxima + bônus + eventos)
  return 20 + 7 * 26;
}
function currentTeamLevelSum(){
  return (game.team||[]).reduce((a,p)=>a+p.level, 0);
}

];
function extraAchievementAggregate(){
  const slots = (game.saveSlots || []).filter(Boolean);
  const caught = getAllCaughtSpecies();
  const challengesWon = [];
  slots.forEach(sl=>{ (sl.challengesWon||[]).forEach(c=>{ if(!challengesWon.includes(c)) challengesWon.push(c); }); });
  return {
    anyShiny: slots.some(sl=>(sl.team||[]).some(p=>p.shiny)) || (game.team||[]).some(p=>p.shiny),
    maxJessie: slots.reduce((m,sl)=>Math.max(m, sl.jessieDefeats||0), game.jessieDefeats||0),
    maxRivalWins: slots.reduce((m,sl)=>Math.max(m, sl.rivalWins||0), game.rivalWins||0),
    maxRocket: slots.reduce((m,sl)=>Math.max(m, sl.rocketAmbushesWon||0), game.rocketAmbushesWon||0),
    maxStreak: slots.reduce((m,sl)=>Math.max(m, sl.bestStreak||0), game.bestStreak||0),
    anyPerfect: slots.some(sl=>sl.anyPerfectGym) || !!game.anyPerfectGym,
    challengesWon,
    anyAllRisky: slots.some(sl=>{
      const rh = sl.routeHistory||[];
      return rh.length>=8 && rh.every(id=>{ const r = routeById(id); return r && (r.risk==='arriscada'||r.golden); });
    }),
    anyGolden: slots.some(sl=>(sl.routeHistory||[]).some(id=>String(id).startsWith('golden_'))) ||
               (game.routeHistory||[]).some(id=>String(id).startsWith('golden_')),
    anyNuzlockeWin: slots.some(sl=>sl.nuzlocke && (sl.badgeCount||0)>=8),
    anyFossil: caught.has('omanyte') || caught.has('kabuto'),
    anyTradeEvo: ['machamp','golem','alakazam','gengar'].some(id=>caught.has(id)),
    anySnorlax: caught.has('snorlax'),
    anySafari3: slots.some(sl=>(sl.safariPerfect)) || !!game.safariPerfect
  };
}

function renderLevels(){
  const gym = GYMS[game.gymIndex];
  const maxPer = getMaxPerPokemon();
  let message;
  if(game.losses>0){
    message = `Seus Pokémons treinaram no vale da derrota: <strong>+${game.poolTotal} pontos adiantados</strong> da sua próxima vitória. Não é presente — é empréstimo, e por isso perder nunca aumenta seu total.`;
  } else if(game.gymIndex===0){
    message = `Antes da batalha, você recebe <strong>20 levels</strong> para distribuir entre os membros do seu time.`;
  } else {
    message = `Você recebe <strong>${game.poolTotal} pontos</strong> — a nota que sua vitória anterior mereceu${(game.pointsOwed||0)>0 ? ' (já descontado o que foi adiantado nas derrotas)' : ''}.`;
  }
  message += ` Você pode colocar no máximo <strong>${maxPer} levels</strong> em um único Pokémon nesta distribuição.`;
  return `
  <div class="box">
    <h2>⭐ Distribua os Levels</h2>
    <p>${message}</p>
  </div>
  <div class="pool-badge">
    <div class="pool-badge-main">LEVELS RESTANTES: ${game.pool}</div>
    <div class="pool-badge-sub">MÁX. POR POKÉMON: ${maxPer}</div>
  </div>
  <div class="box">
    ${game.team.map(p=>{
      const sp = SPECIES[p.speciesId];
      const current = p.level + (game.alloc[p.id]||0);
      const allocatedHere = game.alloc[p.id]||0;
      const atPoolMax = allocatedHere >= maxPer;
      const atLevelCap = current >= 55;
      const atFinalStageCap = isAtFinalEvolutionStage(p.speciesId) && allocatedHere >= 3;
      const atMax = atPoolMax || atLevelCap || atFinalStageCap;
      const capLabel = atLevelCap ? ' (nível 55 — só sobe desmaiando em batalha)' : (atFinalStageCap ? ' (máx. +3 — já está na evolução final)' : (atPoolMax ? ' (máx.)' : ''));
      return `<div class="level-row">
        <div class="level-info">
          <span class="mon-name">${spriteHtml(p.speciesId,'sprite-sm')} ${p.name} — Lv.${current}${capLabel}</span>
          <span class="mon-sub">${typesHtml(p.types)}</span>
        </div>
        <div class="level-controls">
          <button class="circle-btn" onclick="removePoint('${p.id}')" ${allocatedHere<=0?'disabled':''}>−</button>
          <span class="alloc-num">${allocatedHere}</span>
          <button class="circle-btn" onclick="addPoint('${p.id}')" ${(game.pool<=0||atMax)?'disabled':''}>+</button>
        </div>
      </div>`;
    }).join('')}
  </div>
  <button class="btn success" ${(game.pool===0 || !game.team.some(p=>{
    const allocHere = game.alloc[p.id]||0;
    const finalStageCap = isAtFinalEvolutionStage(p.speciesId) ? 3 : Infinity;
    return (p.level+allocHere)<55 && allocHere<maxPer && allocHere<finalStageCap;
  }))?'':'disabled'} onclick="confirmLevels()">Confirmar e seguir para a batalha ⚔️</button>`;
}

function matchupResultLine(m){

}

// Nome de treinador e nome de rival são texto livre do jogador e aparecem no chaveamento,
// no ranking e nos fantasmas da Liga. Tudo isso é montado com innerHTML, então precisa passar
// por aqui — sem escapar, um nome como `<img src=x onerror=...>` roda no navegador de todo mundo.
function escapeHtml(str){
  return String(str == null ? '' : str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escJs(str){
  return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}
// doc 04 — transparência: mostrar a soma de níveis de cada time no chaveamento. Se a comunidade
// enxerga, a própria Liga cria cultura, e vocês ganham dados reais pra decidir depois, com calma,
// se algum limite chega a ser necessário.
function playerChip(p){
  if(!p) return '?';
  const sum = p.levelSum != null ? p.levelSum : (decodeTeamCode(p.code)||[]).reduce((a,m)=>a+m.level,0);
  const ghost = p.isBot ? '<span class="ghost-tag" title="Fantasma do rival preenchendo a vaga">👻 BOT</span> ' : '';
  const nuz = p.nuzlocke ? '<span class="ghost-tag" title="Zerou a jornada no modo Nuzlocke">☠️ NUZLOCKE</span> ' : '';
  return `${nuz}${ghost}<span class="player-link" onclick="showPlayerTeamModal('${escJs(p.code)}','${escJs(p.name)}')">${escapeHtml(p.name)}</span><span class="level-sum" title="Soma de níveis do time">Σ${sum}</span>`;
}
function leagueMatchRow(match, roundLabel, ct, li, rk, mi){
  const isMyMatch = match.a && match.b && (match.a.name===game.trainerName || match.b.name===game.trainerName);
  const highlightClass = isMyMatch ? ' my-match' : '';
  if(!match.a || !match.b){
    const known = match.a || match.b;
    return `<div class="league-match pending${highlightClass}">
      <div class="league-match-title">${roundLabel}</div>
      <div class="league-match-players">${known?escapeHtml(known.name):'?'} <span class="vs">vs</span> ${match.a&&match.b?'':'(aguardando adversário)'}</div>
    </div>`;
  }
  if(!match.resolved){
    return `<div class="league-match pending${highlightClass}">
      <div class="league-match-title">${roundLabel}</div>
      <div class="league-match-players centered">
        ${playerChip(match.a)}
        <span class="vs">vs</span>
        ${playerChip(match.b)}
      </div>
      <div class="league-match-status">⏳ Aguardando o horário da batalha</div>
    </div>`;
  }
  return `<div class="league-match resolved${highlightClass}">
    <div class="league-match-title">${roundLabel}</div>
    <div class="league-match-players centered">
      <span class="${match.winner.name===match.a.name?'win-text':''}">${playerChip(match.a)}</span>
      <span class="vs">vs</span>
      <span class="${match.winner.name===match.b.name?'win-text':''}">${playerChip(match.b)}</span>
    </div>
    <div class="league-match-status">🏅 ${escapeHtml(match.winner.name)} venceu!${match.invalidTeam ? ` <span class="hint-text">(${escapeHtml(match.invalidTeam)} foi desclassificado por time inválido)</span>` : ''}</div>
    ${match.matchups && match.matchups.length>0 ? `<button class="btn secondary league-watch-btn" onclick="watchLeagueMatch(${ct},${li},'${rk}',${mi})">▶ Assistir batalha</button>` : ''}
  </div>`;
}

function watchLeagueMatch(ct, li, rk, mi){
  let league = null;
  if(game.leagueHistoryView && game.leagueHistoryView.cycleTime===ct){
    league = game.leagueHistoryView.league;
  } else if(game.leagueData){
    const cycle = game.leagueData.cycles.find(c=>c.scheduledTime===ct);
    if(cycle && cycle.leagues){ league = cycle.leagues[li]; }
  }
  if(!league) return;
  const match = league.rounds[rk][mi];
  if(!match || !match.resolved || !match.matchups || match.matchups.length===0) return;
  game.leagueWatch = {
    playerAName: match.a.name,
    playerBName: match.b.name,
    matchups: match.matchups,
    winnerName: match.winner.name
  };
  game.leagueWatchIndex = 0;
  game.leagueWatchPhase = 'loading';
  game.screen = 'leagueWatch';
  render();
  setTimeout(advanceLeagueWatch, 1200);
}
function advanceLeagueWatch(){
  if(game.screen !== 'leagueWatch') return;
  const w = game.leagueWatch;
  if(game.leagueWatchPhase === 'loading'){
    game.leagueWatchPhase = 'result';
    render();
    setTimeout(animateLeagueWatchHpBars, 50);
    setTimeout(advanceLeagueWatch, 1300);
  } else if(game.leagueWatchIndex < w.matchups.length - 1){
    game.leagueWatchIndex++;
    game.leagueWatchPhase = 'loading';
    render();
    setTimeout(advanceLeagueWatch, 1200);
  }
}
function animateLeagueWatchHpBars(){
  if(game.screen !== 'leagueWatch' || game.leagueWatchPhase !== 'result') return;
  const m = game.leagueWatch.matchups[game.leagueWatchIndex];
  const playerFill = document.getElementById('hp-fill-player');
  const enemyFill = document.getElementById('hp-fill-enemy');
  const playerLabel = document.getElementById('hp-label-player');
  const enemyLabel = document.getElementById('hp-label-enemy');
  if(playerFill){
    const pct = Math.max(0, (m.playerHpAfter/m.playerMaxHp)*100);
    playerFill.style.width = pct + '%';
    playerFill.className = 'hp-bar-fill ' + hpBarClass(pct);
  }
  if(enemyFill){
    const pct = Math.max(0, (m.enemyHpAfter/m.enemyMaxHp)*100);
    enemyFill.style.width = pct + '%';
    enemyFill.className = 'hp-bar-fill ' + hpBarClass(pct);
  }
  if(playerLabel){ playerLabel.textContent = `${Math.max(0,m.playerHpAfter)}/${m.playerMaxHp} HP`; }
  if(enemyLabel){ enemyLabel.textContent = `${Math.max(0,m.enemyHpAfter)}/${m.enemyMaxHp} HP`; }
}

function formatClock(ms){
  return new Date(ms).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}
function formatDateShort(ms){
  return new Date(ms).toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
}
function renderLeagueCycle(cycle){
  const phaseTimes = [cycle.qfTime, cycle.sfTime, cycle.finalTime, cycle.phase4Time];
  const myLeague = findMyLeagueInCycle(cycle);
  const otherLeagues = cycle.leagues.filter(l=> !myLeague || l.id!==myLeague.id);
  const myRoundCount = myLeague ? Object.keys(myLeague.rounds).length : 3;
  const roundNames = roundLabelsFor(myRoundCount);
  const nextPhaseIdx = phaseTimes.slice(0,myRoundCount).findIndex(t=>t && Date.now()<t);
  const grandeCount = cycle.leagues.filter(l=>l.size===GRANDE_LIGA_SIZE).length;
  const regularCount = cycle.leagues.filter(l=>l.size!==GRANDE_LIGA_SIZE).length;
  const leaguesSummary = [
    grandeCount>0 ? `${grandeCount} Grande Liga${grandeCount>1?'s':''} de 16 treinadores` : '',
    regularCount>0 ? `${regularCount} Liga${regularCount>1?'s':''} de 8 treinadores` : ''
  ].filter(Boolean).join(' e ');
  return `
  <div class="box">
    <h2>⚔️ Liga das ${formatClock(cycle.scheduledTime)}${cycle.status==='complete'?' — Encerrada':''}</h2>
    <p>${leaguesSummary} formada(s) simultaneamente.</p>
    ${cycle.status!=='complete' && nextPhaseIdx>=0 ? `<div class="pool-badge"><div class="pool-badge-main">${roundNames[nextPhaseIdx].toUpperCase()} ÀS ${formatClock(phaseTimes[nextPhaseIdx])}</div></div>` : ''}
  </div>
  ${myLeague ? `
  <div class="box"><h2>🎽 Sua Liga${myLeague.size===GRANDE_LIGA_SIZE?' — 🌟 Grande Liga':''}</h2></div>
  ${Object.keys(myLeague.rounds).sort((a,b)=>Number(a)-Number(b)).map((rk,ri)=>`
    <div class="box">
      <h2>${roundNames[ri]}</h2>
      ${myLeague.rounds[rk].map((m,mi)=>leagueMatchRow(m, roundNames[ri], cycle.scheduledTime, myLeague.id, rk, mi)).join('')}
    </div>
  `).join('')}
  ${myLeague.champion ? `
  <div class="badge-earned">
    <div class="badge-icon">👑</div>
    <div class="badge-text">Campeão da sua Liga:<br><strong>${escapeHtml(myLeague.champion.name)}</strong>!</div>
  </div>` : ''}
  ` : `<div class="box"><p>Você não está em nenhuma Liga dessa rodada.</p></div>`}
  ${otherLeagues.length>0 ? `
  <div class="box">
    <h2>Outras Ligas rolando junto</h2>
    <div class="status-list">
      ${otherLeagues.map(l=>`<div class="status-row"><span class="icon">${l.size===GRANDE_LIGA_SIZE?'🌟':'🏆'}</span><span>${l.size===GRANDE_LIGA_SIZE?'Grande Liga':'Liga'} ${l.id+1}${l.champion?` — campeão: ${escapeHtml(l.champion.name)}`:' — em andamento'}</span></div>`).join('')}
    </div>
  </div>` : ''}
  `;
}

function renderLeague(){
  const data = game.leagueData;
  if(!data){
    return `<div class="box"><h2>🏆 Liga Pokémon</h2><p>Carregando...</p></div>
    <button class="btn primary" onclick="leaveLeagueScreen()">⬅ Voltar</button>`;
  }
  const registeringCycle = data.cycles.find(c=>c.status==='registering');
  const drawnCycles = data.cycles.filter(c=>{
    if(!c.leagues || c.leagues.length===0) return false;
    if(c.status==='drawn' || c.status==='advancing') return true;
    // ligas já concluídas só continuam aparecendo aqui se o jogador participou dela -- assim a Liga que
    // acabou de terminar não some da tela (mostra o campeão!), mas ligas antigas de outras pessoas não
    // ficam acumulando indefinidamente nessa seção
    if(c.status==='complete') return !!findMyLeagueInCycle(c);
    return false;
  });
  const alreadyIn = registeringCycle ? !!registeringCycle.amIRegistered : false;

  let body = `
  <div class="box">
    <h2>🏆 Liga Pokémon</h2>
    <p>Todos os treinadores que já venceram as 8 insígnias e chegaram até aqui. Se inscreva para participar da liga.</p>
    <p>Serão criadas ligas de 16 ou 8 jogadores de acordo com o número de jogadores inscritos.</p>
    <p>Caso algum jogador fique de fora do sorteio das ligas por conta do número de participantes, ele será automaticamente inscrito na próxima liga.</p>
  </div>`;

  if(registeringCycle){
    const willBeGrande = registeringCycle.registrants.length >= GRANDE_LIGA_SIZE;
    const r1 = registeringCycle.scheduledTime + PHASE_MS;
    const r2 = registeringCycle.scheduledTime + PHASE_MS*2;
    const r3 = registeringCycle.scheduledTime + PHASE_MS*3;
    const r4 = registeringCycle.scheduledTime + PHASE_MS*4;
    body += `
    <div class="box">
      <p>Você está se inscrevendo para a Liga das <strong>${formatClock(registeringCycle.scheduledTime)}</strong>.</p>
      <div class="pool-badge">
        <div class="pool-badge-main">COMEÇA ÀS ${formatClock(registeringCycle.scheduledTime)}</div>
        ${willBeGrande ? `
        <div class="pool-badge-sub">Oitavas de Final: ${formatClock(r1)}</div>
        <div class="pool-badge-sub">Quartas de Final: ${formatClock(r2)}</div>
        <div class="pool-badge-sub">Semifinal: ${formatClock(r3)}</div>
        <div class="pool-badge-sub">Final: ${formatClock(r4)}</div>
        ` : `
        <div class="pool-badge-sub">Quartas de Final: ${formatClock(r1)}</div>
        <div class="pool-badge-sub">Semifinal: ${formatClock(r2)}</div>
        <div class="pool-badge-sub">Final: ${formatClock(r3)}</div>
        `}
      </div>
    </div>
    <div class="box">
      <h2>Inscritos</h2>
      <p>${registeringCycle.registrants.length} treinador(es) inscrito(s) até agora.</p>
    </div>
    ${!alreadyIn ? `
    <div class="box">
      <h2>Inscreva-se</h2>
      <p>Você vai se inscrever como <strong>${escapeHtml(game.trainerName)}</strong> (nome do seu save).</p>
      ${game.leagueError ? `<p class="error-text">${game.leagueError}</p>` : ''}
      <button class="btn danger" ${game.leagueSubmitting?'disabled':''} onclick="registerForLeague()">${game.leagueSubmitting?'Inscrevendo...':'Confirmar inscrição ⚔️'}</button>
    </div>` : `
    <div class="box">
      <h2>✅ Você está inscrito!</h2>
      <p>Você está confirmado como <strong>${escapeHtml(game.trainerName)}</strong> pra essa rodada.</p>
      ${game.leagueError ? `<p class="error-text">${game.leagueError}</p>` : ''}
      <button class="btn secondary" ${game.leagueSubmitting?'disabled':''} onclick="cancelLeagueRegistration()">${game.leagueSubmitting?'Cancelando...':'Cancelar inscrição'}</button>
    </div>`}
    `;
  }

  drawnCycles.forEach(cycle=>{ body += renderLeagueCycle(cycle); });

  if(game.trainerName){
    const myHistory = game.myLeagueHistory || [];
    if(myHistory.length>0){
      body += `
      <div class="box">
        <h2>📜 Suas últimas Ligas</h2>
        <div class="status-list">
          ${myHistory.map(h=>`
            <div class="status-row">
              <span class="icon">${h.leagueSize===GRANDE_LIGA_SIZE?'🌟':'🏅'}</span>
              <span>${h.leagueSize===GRANDE_LIGA_SIZE?'Grande Liga':'Liga'} ${formatDateShort(h.cycleTime)} - ${formatClock(h.cycleTime)}: <strong>${h.placement}</strong></span>
              <button class="league-history-btn" onclick="viewLeagueHistory('${h.cycleId}',${h.leagueId},${h.cycleTime})">▶ Rever</button>
            </div>
          `).join('')}
        </div>
      </div>`;
    }
  }

  return `
  ${body}
  ${game.leagueError && !registeringCycle ? `<p class="error-text">${game.leagueError}</p>` : ''}
  <button class="btn primary" onclick="leaveLeagueScreen()">⬅ Voltar</button>`;
}

async function startMewtwoBattle(slot){
  const saveData = game.saveSlots[slot];
  if(!saveData || !saveData.team || saveData.team.length===0) return;
  const team = saveData.team.map(p=> createInstance(p.speciesId, p.level));
  const mewtwoTeam = [createInstance('mewtwo', 99)];
  const result = simulateGymBattle(team, mewtwoTeam);
  if(result.win && game.authUser){
    try{
      const ref = saveDocRef(game.authUser.uid, slot);
      const snap = await ref.get();
      if(snap.exists){
        const freshData = snap.data();
        const updatedCaught = Array.from(new Set([...(freshData.caughtSpecies||[]), 'mewtwo']));
        await ref.set({ ...freshData, caughtSpecies: updatedCaught });
        game.saveSlots[slot] = { ...freshData, caughtSpecies: updatedCaught };
        if(game.currentSaveSlot===slot){ game.caughtSpecies = updatedCaught; }
      }
    } catch(e){ console.error('Erro ao salvar a captura do Mewtwo:', e); }
  }
  game.leagueWatch = {
    playerAName: saveData.trainerName,
    playerBName: 'Mewtwo Selvagem',
    matchups: result.matchups,
    winnerName: result.win ? saveData.trainerName : 'Mewtwo Selvagem'
  };
  game.leagueWatchIndex = 0;
  game.leagueWatchPhase = 'loading';
  game.leagueWatchReturnScreen = 'pokedex';
  game.screen = 'leagueWatch';
  render();
  setTimeout(advanceLeagueWatch, 1200);
}

function renderAchievements(){
  ensureExtraAchievements();
  const agg = Object.assign(getAchievementAggregate(), extraAchievementAggregate());
  const extra = game.achievementsExtra || { anyRegistered:false, anySemifinal:false, anyRunnerUp:false, anyChampion:false };
  const loadingExtra = game.achievementsExtra === null;
  const unlockedCount = ACHIEVEMENTS.filter(ach=>ach.check(agg, extra)).length;
  return `
  <div class="box">
    <h2>🏆 Conquistas</h2>
    <p>${unlockedCount} de ${ACHIEVEMENTS.length} desbloqueadas, somando todos os seus saves.${loadingExtra?' (calculando conquistas da Liga...)':''}</p>
  </div>
  <div class="box">
    <div class="status-list">
      ${ACHIEVEMENTS.map(ach=>{
        const unlocked = ach.check(agg, extra);
        return `<div class="status-row achievement-row ${unlocked?'':'locked'}">
          <span class="icon">${unlocked ? ach.icon : '🔒'}</span>
          <span class="achievement-text"><strong>${ach.name}</strong><br><span class="achievement-desc">${ach.desc}</span></span>
        </div>`;
      }).join('')}
    </div>
  </div>
  <button class="btn primary" onclick="closeAchievements()">⬅ Voltar</button>`;
}

function renderNewSaveName(){
  return `
  <div class="box cursor">
    <h2>📝 Nome do Treinador</h2>
    <p>Como você quer ser chamado(a) nessa jornada?</p>
  </div>
  <div class="box">
    <input type="text" id="new-save-name-input" class="code-input" style="min-height:auto;" maxlength="20" placeholder="Seu nome de treinador">
    ${game.newSaveNameError ? `<p class="error-text">${game.newSaveNameError}</p>` : ''}
  </div>
  <div class="box">
    <h2>😤 Nome do rival</h2>
    <p class="hint-text">Ele vai ficar com todos os Pokémons que você recusar pelo caminho — e não vai deixar você esquecer disso.</p>
    <input type="text" id="new-rival-name-input" class="code-input" style="min-height:auto;" maxlength="20" placeholder="Gary" value="">
  </div>
  <div class="box">
    <h2>⚙️ Modos de jogo <span class="hint-text">(opcional)</span></h2>
    <button class="btn new-save-option ${game.pendingNuzlocke?'selected':''}" onclick="toggleNuzlocke()">
      <span class="mon-name">☠️ Modo Nuzlocke ${game.pendingNuzlocke?'✓':''}</span>
      <span class="mon-sub">Pokémon que desmaia é liberado para sempre. Para veteranos.</span>
    </button>
    <button class="btn new-save-option ${game.pendingDaily?'selected':''}" onclick="toggleDaily()">
      <span class="mon-name">📅 Desafio diário ${game.pendingDaily?'✓':''}</span>
      <span class="mon-sub">A seed do dia é global: todo mundo enfrenta exatamente as mesmas ofertas e as mesmas rotas douradas hoje.</span>
    </button>
  </div>
  <div class="box">
    <button class="btn success" onclick="confirmNewSaveName()">Começar jornada ⚔️</button>
  </div>
  <button class="btn secondary" onclick="openSaveSelect()">⬅ Voltar</button>`;
}

function render(){
  const app = document.getElementById('app');
  let html = '';
  switch(game.screen){
    case 'start': html = renderStart(); break;
    case 'walk': html = renderWalk(); break;
    case 'walkNext': html = renderWalkNext(); break;
    case 'wild': html = renderWild(); break;
    case 'eeveeChoice': html = renderEeveeChoice(); break;
    case 'release': html = renderRelease(); break;
    case 'levels': html = renderLevels(); break;
    case 'evolution': html = renderEvolution(); break;
    case 'teamOrder': html = renderTeamOrder(); break;
    case 'preBattle': html = renderPreBattle(); break;
    case 'battling': html = renderBattling(); break;
    case 'defeat': html = renderBattleResult(false); break;
    case 'victory': html = renderBattleResult(true); break;
    case 'gameover': html = renderGameOver(); break;
    case 'journeyEnd': html = renderJourneyEnd(); break;
    case 'trainerBattle': html = renderTrainerBattle(); break;
    case 'trainerBattling': html = renderTrainerBattling(); break;
    case 'trainerBattleResult': html = renderTrainerBattleResult(); break;
    case 'league': html = renderLeague(); break;
    case 'leagueHistory': html = renderLeagueHistoryScreen(); break;
    case 'leagueWatch': html = renderLeagueWatch(); break;
    case 'auth': html = renderAuth(); break;
    case 'saveSelect': html = renderSaveSelect(); break;
    case 'pokedex': html = renderPokedex(); break;
    case 'mewtwoPicker': html = renderMewtwoPicker(); break;
    case 'achievements': html = renderAchievements(); break;
    case 'newSaveName': html = renderNewSaveName(); break;
    case 'routeChoice': html = renderRouteChoice(); break;
    case 'routeEvent': html = renderRouteEvent(); break;
    case 'fossil': html = renderFossil(); break;
    case 'dojo': html = renderDojo(); break;
    case 'safari': html = renderSafari(); break;
    case 'npcTrade': html = renderNpcTrade(); break;
    case 'dayCare': html = renderDayCare(); break;
    case 'rocketHideout': html = renderRocketHideout(); break;
    case 'casino': html = renderCasino(); break;
    case 'emergency': html = renderEmergency(); break;
    case 'roulette': html = renderRoulette(); break;
    case 'eventIntro': html = renderEventIntro(); break;
    case 'eventBattling': html = renderEventBattling(); break;
    case 'eventResult': html = renderEventResult(); break;
    case 'journeyDiary': html = renderJourneyDiary(); break;
  }
  const noMenuScreens = new Set(['auth','saveSelect','newSaveName','battling','trainerBattling','leagueWatch','pokedex','achievements','mewtwoPicker','eventBattling']);
  if(game.authUser && !noMenuScreens.has(game.screen)){
    html += `<button class="home-nav-btn" onclick="goToSaveMenu()">🏠 Home</button>`;
  }
  if(game.showResetConfirm){ html += renderResetModal(); }
  if(game.deleteSaveTarget!=null){ html += renderDeleteSaveModal(); }
  if(game.deleteSaveBlockedReason){ html += renderSaveBlockedModal(); }
  if(game.playerTeamModal){ html += renderPlayerTeamModal(); }
  app.innerHTML = html;
  maybeAutoSave();
}

let resolveAuthChecked;
const authCheckedOnce = new Promise(res=>{ resolveAuthChecked = res; });
auth.onAuthStateChanged((user)=>{
  if(user){
    game.authUser = { uid:user.uid, email:user.email, displayName:user.displayName };
    game.authBusy = false;
    if(game.screen==='auth'){ openSaveSelect(); }
  } else {
    game.authUser = null;
    game.currentSaveSlot = null;
    if(game.screen!=='auth'){ game.screen = 'auth'; render(); }
  }
  resolveAuthChecked();
});
if(typeof window !== 'undefined'){
  window.addEventListener('beforeunload', flushPendingAutoSave);
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){
      flushPendingAutoSave();
    } else if(game.screen==='league'){
      // navegadores (principalmente no celular) pausam o "setInterval" enquanto a aba fica em segundo plano --
      // sem isso, ao voltar pra aba a tela continuaria mostrando dados desatualizados até o próximo tick de 5s
      // (que pode nem disparar imediatamente, dependendo de como o navegador retoma os temporizadores)
      advanceLeagueOnce().then(changed=>refreshLeagueView(changed));
    }
  });
}
migrateOldLeagueDataIfNeeded();

render();

/* ============ INTRO POKÉBOLA ============ */
(function(){
  const introBall = document.getElementById('introBall');
  const introStage = document.getElementById('introStage');
  const introCore = document.getElementById('introCore');
  const introLoadUi = document.getElementById('introLoadUi');
  const introFill = document.getElementById('introFill');
  const bootEl = document.getElementById('boot');
  const introFlashEl = document.getElementById('introFlash');
  const wait = ms => new Promise(r => setTimeout(r, ms));

  function introStars(){
    for(let i=0;i<8;i++){
      const s = document.createElement('div');
      s.className = 'intro-star';
      s.textContent = i%2 ? '✦' : '★';
      s.style.color = i%2 ? '#ffcb05' : '#fff5d6';
      const ang = (Math.PI*2/8)*i + 0.4;
      s.style.setProperty('--dx', Math.cos(ang)*150+'px');
      s.style.setProperty('--dy', Math.sin(ang)*150+'px');
      s.style.setProperty('--rot', (i%2? 160:-160)+'deg');
      introStage.appendChild(s);
      setTimeout(()=>s.remove(), 1000);
    }
  }

  async function runIntro(){
    await wait(450);

    // 1. metades fecham
    introStage.classList.add('closed');
    introBall.classList.add('closed');
    await wait(560);
    introBall.classList.add('clunk');
    await wait(380);

    // 2. luz vermelha acende + balanço de captura
    introCore.classList.add('lit');
    introBall.classList.add('wobble');
    await wait(850);
    introBall.classList.remove('wobble');
    introCore.classList.add('pulse');

    // 3. carregando -- ao mesmo tempo, o Firebase real já está resolvendo o login em segundo plano
    introLoadUi.classList.add('show');
    for(let p=0; p<=100; p+=4){
      introFill.style.width = p+'%';
      await wait(90);
    }
    await wait(250);

    // espera o Firebase confirmar se o jogador já está logado ou não, pra revelar a tela certa
    // por trás (sem isso, quem já tava logado veria a tela de login piscar por um instante antes
    // de cair na seleção de save). Tem um limite de segurança pra não travar o jogo se a conexão
    // estiver ruim ou o Firebase demorar demais pra responder.
    await Promise.race([authCheckedOnce, wait(4000)]);

    // 4. captura concluída: clarão + estrelas
    introCore.classList.remove('pulse');
    introCore.classList.add('burst');
    introStars();
    await wait(450);
    introFlashEl.classList.add('go');
    await wait(320);

    // 5. revela o jogo (a tela de login ou a seleção de save, o que já estiver certo por trás)
    bootEl.classList.add('gone');
  }
  runIntro();
})();
</script>
