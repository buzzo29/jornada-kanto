/* =====================================================================
   ROTAS -- escolha de caminho antes de cada ginásio (portado da versão
   do amigo, sem os eventos/minijogos extras que ele adicionou)
   ===================================================================== */
/* O histórico de rotas existe só pro mapa: ele guarda, por trecho, qual caminho a pessoa pegou.
   `currentRoute` sozinho não servia -- ele é sobrescrito no trecho seguinte, e aí o mapa não teria
   como lembrar que no trecho 2 você foi pelo Monte Lua. É estado de EXIBIÇÃO: nenhuma regra lê. */
function registrarRotaEscolhida(id){
  if(!Array.isArray(game.routeHistory)) game.routeHistory = [];
  game.routeHistory[game.gymIndex] = id;
}
function chooseRoute(id){
  const route = routeById(id);
  if(!route) return;
  game.currentRoute = id;
  registrarRotaEscolhida(id);
  game.routeCards = null;
  goToWildEncounter();
}

/* =====================================================================
   APROXIMAÇÃO DO GINÁSIO -- depois que o time está organizado, checa se
   uma emboscada da Equipe Rocket ou uma batalha de rival acontece antes
   de liberar a tela de batalha do ginásio. Seguro pra chamar de novo
   (ex: depois de resolver cada evento) -- só avança o que falta.
   ===================================================================== */
function proceedToGymApproach(){
  if(!game.gymApproachRocketChecked){
    game.gymApproachRocketChecked = true;
    if(maybeRocketAmbush()) return;
  }
  if(game.stolenMon){ game.screen = 'rocketHideout'; render(); return; }
  if(!game.gymApproachRivalChecked){
    game.gymApproachRivalChecked = true;
    if(maybeRivalBattle()) return;
  }
  game.screen = 'preBattle';
  render();
}

/* =====================================================================
   EQUIPE ROCKET -- emboscada no caminho + esconderijo de 2 fases pra
   resgatar o pokémon sequestrado
   ===================================================================== */
function rocketAmbushChance(){
  // as duas rotas de cada trecho agora são equivalentes em risco -- só o tipo de pokémon selvagem muda
  return 0.25;
}
function maybeRocketAmbush(){
  if(game.gymIndex < 1) return false; // só a partir da 2ª perna em diante
  if(game.stolenMon) return false; // um sequestro pendente de cada vez
  if(Math.random() >= rocketAmbushChance()) return false;
  const avg = avgTeamLevel();
  const size = Math.min(5, 2 + Math.floor(game.gymIndex/2));
  const picks = shuffle(ROCKET_POOL).slice(0, size);
  startSpecialBattle('rocket',
    picks.map(id=>({ speciesId:id, level: Math.max(2, avg + 3 + randomInt(0,3)) })),
    { opponentName: ROCKET_NAMES[Math.min(ROCKET_NAMES.length-1, Math.floor(game.gymIndex/2))],
      icon:'🚀', title:'Emboscada da Equipe Rocket!',
      intro:'Uma sombra sai do mato: «Parado aí! A Equipe Rocket fica com o que é seu.»' }
  );
  return true;
}
function maybeOpenHideout(){
  if(!game.stolenMon) return false;
  game.screen = 'rocketHideout';
  render();
  return true;
}
function enterHideout(){
  const avg = game.hideoutFoeLevel != null ? game.hideoutFoeLevel : avgTeamLevel();
  if((game.hideoutStage||0) === 0){
    startSpecialBattle('hideout1',
      [{speciesId:'raticate', level:avg+3}, {speciesId:'golbat', level:avg+3}],
      { opponentName:'Guarda Rocket', icon:'🕵️', title:'Esconderijo Rocket', sub:'Guarda da entrada',
        intro:`Duas batalhas seguidas te separam de ${game.stolenMon ? game.stolenMon.name : 'seu pokémon'}. Restam <strong>${game.hideoutAttemptsLeft||0} tentativa(s)</strong> antes de perdê-lo(a) pra sempre. Vamos lá.` }
    );
  } else {
    startSpecialBattle('hideout2',
      // Meowth entra como o pokémon do chefe: é o mascote da Equipe Rocket na série, e dá cara de
      // "chefe" à luta em vez de mais um time de Veneno. Fica no nível mais alto dos quatro
      [{speciesId:'koffing', level:avg+3}, {speciesId:'weezing', level:avg+4}, {speciesId:'muk', level:avg+4}, {speciesId:'meowth', level:avg+5}],
      { opponentName:'Chefe Rocket', icon:'👑', title:'Esconderijo Rocket', sub:'Sala dos fundos',
        intro:`O chefe da operação te encara. Restam <strong>${game.hideoutAttemptsLeft||0} tentativa(s)</strong>. É agora ou nunca.` }
    );
  }
}
function skipHideout(){
  // "deixar pra depois" precisa realmente deixar pra depois -- não pode passar pelo proceedToGymApproach()
  // inteiro, porque ali a presença de um stolenMon pendente manda de volta pro próprio esconderijo (loop).
  // O jogador ainda pode tentar de novo a qualquer momento pelo botão que fica na tela de preBattle.
  if(!game.gymApproachRivalChecked){
    game.gymApproachRivalChecked = true;
    if(maybeRivalBattle()) return;
  }
  game.screen = 'preBattle';
  render();
}

/* =====================================================================
   RIVAL -- reaparece em alguns pontos da jornada; o time dele é feito
   dos pokémons que você recusou pelo caminho
   ===================================================================== */
function avgTeamLevel(){
  if(!game.team.length) return 5;
  return Math.round(game.team.reduce((s,p)=>s+p.level,0) / game.team.length);
}
/* "Quão forte é essa espécie" -- usado só pra escolher os 5 que o rival leva entre os recusados.
   É o BST oficial da Gen 2, os SEIS atributos, o mesmo número que a ficha da Pokédex mostra ao
   jogador. Era a soma de 4 (hp+ataque+defesa+special da Gen 1), que deixava de fora a defesa
   especial E a velocidade. Medido na troca: a identidade dos 5 escolhidos muda em 63% dos casos,
   mas a força real do time do rival sobe só 1,2% (BST médio 488,1 -> 494,1) -- ele passa a
   escolher melhor, não a escolher mais forte. */
function bstOf(speciesId){
  const sp = SPECIES[speciesId];
  return sp ? (sp.hp + sp.attack + sp.defense + sp.spAtk + sp.spDef + sp.speed) : 300;
}
function rivalStarterEvolvedId(){
  const base = game.rivalStarterId || 'charmander';
  let cur = base, lvl = avgTeamLevel() + 1;
  while(EVOLUTIONS[cur] && lvl >= EVOLUTIONS[cur].level){ cur = EVOLUTIONS[cur].into; }
  return cur;
}
function buildRivalTeam(){
  const avg = avgTeamLevel();
  const team = [];
  const refused = (game.rivalPool||[]).filter(id=>SPECIES[id]);
  const best = refused.slice().sort((a,b)=>bstOf(b)-bstOf(a)).slice(0,5);
  best.forEach(id=>{
    let cur = id, lvl = avg + randomInt(-1,1);
    while(EVOLUTIONS[cur] && lvl >= EVOLUTIONS[cur].level){ cur = EVOLUTIONS[cur].into; }
    team.push({ speciesId: cur, level: Math.max(3, lvl) });
  });
  while(team.length < 2){
    const filler = shuffle(LEGS[game.gymIndex].pool)[0];
    team.push({ speciesId: filler, level: Math.max(3, avg) });
  }
  // o inicial dele (o que countera o SEU) fica SEMPRE por último, em qualquer encontro da jornada --
  // é a carta final dele, igual acontece na final da Elite 4. A ordem do array é a ordem em que a
  // batalha manda os pokémons pro campo, então basta ele fechar a lista
  const rest = team.slice(0,5);
  rest.push({ speciesId: rivalStarterEvolvedId(), level: avg+1 });
  return rest;
}
/* =====================================================================
   ELITE 4 -- o desafio final depois das 8 insígnias: 3 mestres + a
   FINAL contra o rival. Sem cura entre batalhas (2 escolhas de cura após
   cada vitória), e SEM segunda chance: perdeu = game over definitivo do
   save (o time continua valendo nas ligas online)
   ===================================================================== */
const ELITE_MAX_ATTEMPTS = 5; // tentativas TOTAIS -- cada uma é o rush completo (Lorelei até a final); perder reseta pro início, não continua de onde parou.
// Era 3; subiu pra 5. Todos os textos da interface leem esta constante, então mudar aqui basta.
// média de nível do time do rival na final. Ele tem 6 pokémon (a Elite tem 5) e é a quinta luta
// seguida, com o time do jogador já desgastado -- por isso a média fica um pouco acima do Lance (60)
const ELITE_RIVAL_AVG_LEVEL = 61;

const ELITE_FOUR = [
  { id:'lorelei', name:'Lorelei', icon:'🧊', title:'Mestra do Gelo', type:'Ice',
    intro:'«Ninguém passa do meu gelo sem congelar por dentro.» Seus pokémons de gelo não conhecem piedade.',
    team:[{speciesId:'dewgong',level:56},{speciesId:'cloyster',level:56},{speciesId:'slowbro',level:57},{speciesId:'jynx',level:57},{speciesId:'lapras',level:59}] },
  { id:'bruno', name:'Bruno', icon:'🥊', title:'Punho de Aço', type:'Fighting',
    intro:'«Força bruta também é uma arte. Vou te mostrar na prática.» Músculos e pedra, nada mais.',
    team:[{speciesId:'onix',level:57},{speciesId:'hitmonchan',level:58},{speciesId:'hitmonlee',level:58},{speciesId:'rhydon',level:59},{speciesId:'machamp',level:61}] },
  { id:'agatha', name:'Agatha', icon:'👻', title:'Dama Fantasma', type:'Ghost',
    intro:'«Há coisas nesse mundo que você não consegue nem tocar... mas elas tocam você.» Fantasmas e veneno.',
    team:[{speciesId:'gengar',level:58},{speciesId:'golbat',level:58},{speciesId:'haunter',level:59},{speciesId:'arbok',level:59},{speciesId:'gengar',level:61}] },
  { id:'lance', name:'Lance', icon:'🐉', title:'Mestre dos Dragões', type:'Dragon',
    intro:'«Dragões são criaturas míticas — e eu sou o último mestre deles. Mostre que você merece chegar à final.»',
    team:[{speciesId:'dragonair',level:59},{speciesId:'dragonair',level:59},{speciesId:'gyarados',level:60},{speciesId:'aerodactyl',level:60},{speciesId:'dragonite',level:62}] }
];
/* A Elite de Johto. Cada um pareado com o de Kanto da MESMA POSIÇÃO: mesmo número de pokémon e
   mesma média de nível, exatamente como foi feito com os 16 ginásios. A escolha é de tipo, não de
   dificuldade.
   O Koga aparece aqui porque é isso que acontece no jogo original: ele deixa o ginásio de Fuchsia
   e sobe pra Elite na Gen 2. O Bruno está nas duas listas porque está nos dois jogos -- e é por
   isso que o sorteio nunca repete um adversário (ver sortearCaminhoDaElite). */
const JOHTO_ELITE = [
  { id:'will', name:'Will', icon:'🔮', title:'Mente Alada', type:'Psychic',
    intro:'«Treinei a vida toda pra dominar os pokémons psíquicos... e agora estou pronto pra você.» Tudo aqui voa e lê a sua próxima jogada.',
    team:[{speciesId:'xatu',level:56},{speciesId:'jynx',level:56},{speciesId:'exeggutor',level:57},{speciesId:'slowbro',level:57},{speciesId:'xatu',level:59}] },
  { id:'koga_elite', name:'Koga', icon:'☠️', title:'Mestre do Veneno', type:'Poison',
    intro:'«Nos encontramos de novo — mas não como líder de ginásio. Aqui eu não me seguro.» O veneno dele corrói mais devagar do que parece.',
    team:[{speciesId:'ariados',level:57},{speciesId:'venomoth',level:58},{speciesId:'forretress',level:58},{speciesId:'muk',level:59},{speciesId:'crobat',level:61}] },
  { id:'bruno_johto', name:'Bruno', icon:'🥊', title:'Punho de Aço', type:'Fighting',
    intro:'«Você de novo? Ótimo. Meus punhos não esqueceram.» Músculos e pedra, nada mais.',
    team:[{speciesId:'hitmontop',level:58},{speciesId:'hitmonlee',level:58},{speciesId:'hitmonchan',level:59},{speciesId:'onix',level:59},{speciesId:'machamp',level:61}] },
  { id:'karen', name:'Karen', icon:'🌑', title:'Dama Sombria', type:'Dark',
    intro:'«Pokémon fortes. Pokémon fracos. Isso é só a opinião egoísta das pessoas.» O que ela traz não se intimida com nada.',
    team:[{speciesId:'umbreon',level:59},{speciesId:'murkrow',level:59},{speciesId:'vileplume',level:60},{speciesId:'gengar',level:60},{speciesId:'houndoom',level:62}] }
];
/* Qual dos dois em cada posição -- sorteado UMA VEZ, na primeira tentativa, e guardado no save.
   As tentativas seguintes enfrentam a mesma fila: perder e voltar não pode virar um jeito de
   re-sortear até cair um caminho fácil, e refazer a fila a cada tentativa apagaria o que o
   jogador aprendeu sobre ela.
   O Bruno está nas duas listas (está nos dois jogos), então o sorteio evita repetir adversário:
   se ele já saiu, a posição seguinte fica com o outro lado. */
function sortearCaminhoDaElite(){
  const vistos = new Set();
  const caminho = [];
  for(let i = 0; i < ELITE_FOUR.length; i++){
    const k = ELITE_FOUR[i], j = JOHTO_ELITE[i];
    const podeK = !vistos.has(k.name), podeJ = !vistos.has(j.name);
    let lado;
    if(podeK && podeJ) lado = Math.random() < 0.5 ? 'kanto' : 'johto';
    else lado = podeK ? 'kanto' : 'johto';
    caminho.push(lado);
    vistos.add(lado === 'kanto' ? k.name : j.name);
  }
  return caminho;
}
function eliteMembroDaEtapa(stage){
  const lado = (game.elitePath || [])[stage];
  return (lado === 'johto' ? JOHTO_ELITE : ELITE_FOUR)[stage];
}

function buildEliteRivalTeam(){
  // o time do rival na final: os melhores pokémons que VOCÊ recusou pelo caminho, totalmente
  // evoluídos e no auge -- e o inicial dele (vantagem de tipo contra o seu) como carta final
  let starter = game.rivalStarterId || 'charmander';
  while(EVOLUTIONS[starter]){ starter = EVOLUTIONS[starter].into; }
  const team = [];
  const refused = (game.rivalPool||[]).filter(id=>SPECIES[id]);
  const best = refused.slice().sort((a,b)=>bstOf(b)-bstOf(a)).slice(0,5);
  /* Níveis do time do rival: média ELITE_RIVAL_AVG_LEVEL, com variação em torno dela.
     Antes eram fixos em 53-55 com o inicial em 57, o que dava média 54,3 -- quase 6 níveis ABAIXO
     do Lance e mais fraco até que a Lorelei, a primeira da fila. A luta final da jornada era a mais
     fácil das cinco.
     O inicial dele fica no topo: é a carta final, e tem vantagem de tipo contra o seu. */
  best.forEach((id,i)=>{
    const cur = finalEvolutionOf(id);
    // sempre evolui até o fim, mesmo que o nível fique abaixo do limiar normal de evolução -- o
    // rival não é um pokémon selvagem crescendo aos poucos, é o time final dele
    team.push({ speciesId: cur, level: ELITE_RIVAL_AVG_LEVEL - 1 + (i%3) });
  });
  const fillers = ['gyarados','alakazam','exeggutor','rhydon','arcanine'];
  let fi = 0;
  while(team.length < 5 && fi < fillers.length){
    team.push({ speciesId: fillers[fi++], level: ELITE_RIVAL_AVG_LEVEL });
  }
  const parcial = team.slice(-5);
  // o inicial fecha a conta pra a média bater EXATA nos 6 pokémon
  const somaAtual = parcial.reduce((a,p)=>a+p.level,0);
  const nivelInicial = Math.max(2, ELITE_RIVAL_AVG_LEVEL*6 - somaAtual);
  parcial.push({ speciesId: starter, level: nivelInicial });
  return parcial;
}
function eliteOpponentForStage(stage){
  if(stage < ELITE_FOUR.length){
    const m = eliteMembroDaEtapa(stage);
    return { team: m.team.map(t=>({ speciesId:t.speciesId, level:t.level })),
      meta: { opponentName: m.name, icon: m.icon, type: m.type,
        title: `${m.icon} ${m.name} — ${m.title}`, intro: m.intro } };
  }
  return { team: buildEliteRivalTeam(),
    meta: { opponentName: game.rivalName, icon:'😤',
      title: `😤 A FINAL: ${escapeHtmlSafe(game.rivalName)}!`,
      intro: `«Eu SABIA que você chegaria até aqui. Treinei a vida inteira pra esse momento — aqui acaba a sua jornada!» O time dele está no auge, liderado pelo inicial que sempre teve vantagem contra o seu.` } };
}
function startEliteChallenge(){
  if((game.eliteAttemptsUsed||0) >= ELITE_MAX_ATTEMPTS) return; // sem tentativa sobrando -- não deveria nem chegar aqui pelo botão, mas protege contra clique repetido/atrasado
  /* A fila da Elite é sorteada UMA VEZ e vale pro save inteiro. Sortear a cada tentativa faria
     perder e voltar virar um jeito de re-sortear até cair um caminho fácil -- e apagaria o que o
     jogador aprendeu sobre a fila dele. */
  if(!Array.isArray(game.elitePath) || game.elitePath.length !== ELITE_FOUR.length){
    game.elitePath = sortearCaminhoDaElite();
  }
  game.eliteStatus = 'inProgress';
  game.eliteStage = 0;
  game.eliteHealsLeft = 0;
  // toda tentativa começa com o time inteiro em plena forma -- as 2 curas por vitória dentro do rush
  // continuam sendo o único jeito de recuperar no MEIO de uma tentativa; perder e recomeçar é que
  // sempre volta a cura completa, já que é um rush novo do zero
  game.team.forEach(p=>{ p.terrainBuffed = false; p.maxHp = calcMaxHp(p); p.hp = p.maxHp; });
  saveCurrentGame();
  // antes só ia direto pra luta da Lorelei -- agora passa pela mesma sala de preparação das lutas
  // seguintes primeiro (sem cura disponível ainda, já que ninguém desmaiou, mas COM a reordenação),
  // pra ter a mesma chance de organizar o time antes de qualquer uma das 5 batalhas, não só da 2ª em diante
  game.screen = 'eliteHeal';
  render();
}
function startNextEliteBattle(){
  const opp = eliteOpponentForStage(game.eliteStage);
  // Cada membro da Elite luta no PRÓPRIO domínio: o terreno é sorteado entre os que combinam com o
  // tipo dele (mesma regra dos ginásios, via pickTerrainForType). Um terreno por membro, não um pro
  // rush inteiro -- cada sala é o território de alguém.
  // A FINAL contra o rival fica sem terreno de propósito: ele não tem tipo, e ser a única luta neutra
  // do rush dá peso a ela -- é treinador contra treinador, sem vantagem de casa pra ninguém
  game.eliteTerrain = opp.meta.type ? pickTerrainForType(opp.meta.type) : null;
  startSpecialBattle('elite', opp.team, opp.meta);
}
function eliteHealPick(monId){
  if((game.eliteHealsLeft||0) <= 0) return;
  const p = game.team.find(m=>m.id===monId);
  if(!p) return;
  p.maxHp = calcMaxHp(p);
  if(p.hp >= p.maxHp) return; // já está com vida cheia -- não desperdiça a escolha
  p.hp = p.maxHp; // cura completa; se estava desmaiado (0), isso É o revive
  game.eliteHealsLeft -= 1;
  saveCurrentGame();
  render();
}
function openEliteIntro(){
  /* Sorteia a fila AQUI, e não no startEliteChallenge: esta tela LISTA os cinco adversários, e
     sortear depois dela faria o jogador ler uma fila e enfrentar outra.
     Continua sendo uma vez só por save -- quem já tem elitePath mantém o dele, inclusive entre
     tentativas (ver sortearCaminhoDaElite). */
  if(!Array.isArray(game.elitePath) || game.elitePath.length !== ELITE_FOUR.length){
    game.elitePath = sortearCaminhoDaElite();
  }
  game.screen = 'eliteIntro';
  render();
}
function maybeRivalBattle(){
  if(!RIVAL_LEGS.includes(game.gymIndex)) return false;
  if((game.rivalBattlesDone||[]).includes(game.gymIndex)) return false;
  game.rivalBattlesDone = (game.rivalBattlesDone||[]).concat(game.gymIndex);
  game.rivalTaunt = RIVAL_TAUNTS[Math.floor(Math.random()*RIVAL_TAUNTS.length)];
  startSpecialBattle('rival', buildRivalTeam(),
    { opponentName: game.rivalName, icon:'😤', title:`${escapeHtmlSafe(game.rivalName)} bloqueia o caminho!`,
      intro:`«${game.rivalTaunt}» — o time dele é feito de pokémons que <strong>você recusou</strong> pelo caminho.` }
  );
  return true;
}

/* =====================================================================
   MOTOR GENÉRICO DE "BATALHA ESPECIAL" -- reaproveita o mesmo motor de
   simulação e a mesma estética de revelação das batalhas de treinador,
   usado tanto pela Equipe Rocket quanto pelo rival
   ===================================================================== */
function startSpecialBattle(context, opponentTeam, meta){
  game.specialBattle = { context, opponentTeam, meta: meta||{} };
  game.specialBattleResult = null;
  game.screen = 'specialIntro';
  render();
}
// canção de ninar da Jigglypuff/Wigglytuff -- chamada NO MEIO da revelação da batalha, exatamente
// quando ela é a inimiga ativa (os confrontos anteriores, contra os outros pokémon da Rocket, já
// aconteceram normalmente). Corta a luta bem ali: ninguém desmaia de dano, o time inteiro cai no sono
// e a Rocket vence na hora. Rouba o shiny do time, se a pessoa tiver algum; senão, sorteia igual a
// derrota normal já fazia. De propósito deixa game.specialBattle intacto (context:'rocket') -- é dele
// que continueAfterSpecial() lê o contexto pra saber que deve mandar pro esconderijo depois
function triggerRocketSleepAmbush(){
  const r = game.specialBattleResult;
  const cutIndex = game.specialRevealIndex; // exclui o próprio confronto contra ela -- não teve luta de verdade
  r.matchups = r.matchups.slice(0, cutIndex);
  r.win = false;
  // ninguém desmaiou de dano -- só dormiu. Recalcula o status a partir da luta JÁ REALMENTE
  // acontecida (truncada) e força fainted:false em todo mundo, pra não mostrar como nocauteado
  r.playerStatus = deriveTeamStatusFromMatchups(r.matchups, 'player').map(p=>({ ...p, fainted:false }));
  r.brockStatus = deriveTeamStatusFromMatchups(r.matchups, 'enemy').map(p=>({ ...p, fainted:false }));
  r.leveledUpFromFaint = false; // ninguém desmaiou, então ninguém ganha o level bônus de "caiu em combate"
  let stolenMsg;
  game.rocketSleepStolenMon = null;
  if(game.team.length <= 1){
    stolenMsg = 'A Rocket fugiu com uns trocados, mas seu único pokémon ficou seguro.';
  } else {
    const shinyIdx = game.team.findIndex(p=>p.shiny);
    const idx = shinyIdx !== -1 ? shinyIdx : Math.floor(Math.random()*game.team.length);
    game.stolenMon = game.team.splice(idx,1)[0];
    game.hideoutStage = 0;
    game.hideoutAttemptsLeft = 3;
    game.hideoutFoeLevel = avgTeamLevel();
    game.rocketSleepStolenMon = game.stolenMon; // guardado à parte pra tela mostrar sprite+level dele
    saveCurrentGame();
    stolenMsg = `Enquanto isso, a Equipe Rocket <strong>sequestrou ${game.stolenMon.shiny?'seu Pokémon ✨shiny✨ ':''}${escapeHtmlSafe(game.stolenMon.name)}</strong>! Você tem <strong>3 tentativas</strong> de resgatá-lo(a) no esconderijo deles antes do próximo ginásio — depois disso, ele(a) se perde pra sempre.`;
  }
  game.specialResultMsg = `🎤 <strong>Jigglypuff cantou uma canção de ninar e todo mundo caiu no sono!</strong> ${stolenMsg}`;
  game.screen = 'specialResult';
  render();
}
function runSpecialBattle(){
  const cfg = game.specialBattle;
  if(!cfg) return;
  const foeTeam = cfg.opponentTeam.map(o=>createInstance(o.speciesId, o.level));
  // limpa primeiro SEMPRE: sem isso, o bônus do último ginásio (ou da luta anterior do rush da Elite)
  // vazaria pra cá. Rival e Rocket seguem sem terreno; a Elite 4 recebe o do membro logo abaixo
  game.team.forEach(p=>{ p.terrainBuffed = false; });
  const terrenoDaLuta = (cfg.context==='elite') ? game.eliteTerrain : null;
  if(terrenoDaLuta){
    applyTerrainBuff(game.team, terrenoDaLuta);
    applyTerrainBuff(foeTeam, terrenoDaLuta);
  }
  // snapshot de "estava vivo antes dessa batalha" -- na Elite (HP carrega entre lutas), um pokémon
  // que já tinha desmaiado numa luta anterior (e ainda não foi curado) continua com hp<=0 aqui sem
  // ter lutado de novo; sem esse snapshot, finishSpecialBattle acharia que ele "desmaiou agora" em
  // TODA luta seguinte e subiria o nível dele repetidamente à toa
  game.specialHpBeforeBattle = game.team.map(p=>p.hp);
  applySpecialtyBuff(game.team); // especialidade do treinador vale na jornada também
  const result = simulateGymBattle(game.team, foeTeam, undefined, { preservePlayerHp: cfg.context==='elite' });
  updateStreakRecord(result);
  preloadBattleSprites(result.matchups);
  game.specialBattleResult = result;
  game.specialRevealIndex = 0;
  game.specialRevealPhase = 'loading';
  game.screen = 'specialBattling';
  render();
  setTimeout(advanceSpecialReveal, 1200);
}
function advanceSpecialReveal(){
  if(game.screen !== 'specialBattling') return;
  if(game.specialRevealPhase === 'loading'){
    const m = game.specialBattleResult.matchups[game.specialRevealIndex];
    // Jigglypuff/Wigglytuff: quando ela é a inimiga ATIVA (é a vez dela entrar), tem 10% de chance de
    // cantar todo mundo pra dormir -- checado bem aqui, ANTES de animar esse confronto específico,
    // porque se acontecer não tem luta nenhuma contra ela: a Rocket já vence na hora
    if(game.specialBattle.context==='rocket' && (m.enemySpecies==='jigglypuff' || m.enemySpecies==='wigglytuff') && Math.random() < ROCKET_SLEEP_CHANCE){
      triggerRocketSleepAmbush();
      return;
    }
    game.specialHitSequence = buildAnimatedHitSequence(m);
    game.specialHitStep = 0;
    game.specialCurrentPlayerHp = m.playerHpBefore;
    game.specialCurrentEnemyHp = m.enemyHpBefore;
    if(game.specialHitSequence.length > 0){
      game.specialRevealPhase = 'animating';
      render();
      setTimeout(advanceSpecialReveal, 550);
    } else {
      game.specialRevealPhase = 'result';
      render();
      setTimeout(animateSpecialHpBars, 50);
      setTimeout(advanceSpecialReveal, 1300);
    }
  } else if(game.specialRevealPhase === 'animating'){
    const m = game.specialBattleResult.matchups[game.specialRevealIndex];
    const hit = game.specialHitSequence[game.specialHitStep];
    if(hit.side==='player'){ game.specialCurrentPlayerHp = Math.max(0, game.specialCurrentPlayerHp - hit.amount); }
    else { game.specialCurrentEnemyHp = Math.max(0, game.specialCurrentEnemyHp - hit.amount); }
    game.specialLastHit = hit;
    game.specialHitStep++;
    const isLastHit = game.specialHitStep >= game.specialHitSequence.length;
    const hitMaxHp = hit.side==='player' ? m.playerMaxHp : m.enemyMaxHp;
    const hitDuration = hpBarTransitionMs((hit.amount / hitMaxHp) * 100);
    if(isLastHit){
      game.specialRevealPhase = 'result';
      animateSpecialHpBars();
      setTimeout(render, hitDuration + 50);
      setTimeout(advanceSpecialReveal, hitDuration + 800);
    } else {
      animatePartialSpecialHpBars();
      setTimeout(advanceSpecialReveal, hitDuration + 150);
    }
  } else {
    const matchups = game.specialBattleResult.matchups;
    if(game.specialRevealIndex < matchups.length - 1){
      game.specialRevealIndex++;
      game.specialRevealPhase = 'loading';
      render();
      setTimeout(advanceSpecialReveal, 1200);
    } else {
      finishSpecialBattle();
    }
  }
}
function animatePartialSpecialHpBars(){
  if(game.screen !== 'specialBattling' || game.specialRevealPhase !== 'animating') return;
  const m = game.specialBattleResult.matchups[game.specialRevealIndex];
  const hit = game.specialLastHit;
  if(!hit) return;
  const isPlayer = hit.side === 'player';
  const maxHp = isPlayer ? m.playerMaxHp : m.enemyMaxHp;
  const currentHp = isPlayer ? game.specialCurrentPlayerHp : game.specialCurrentEnemyHp;
  const duration = hpBarTransitionMs((hit.amount / maxHp) * 100);
  const fill = document.getElementById(isPlayer ? 'hp-fill-player' : 'hp-fill-enemy');
  const label = document.getElementById(isPlayer ? 'hp-label-player' : 'hp-label-enemy');
  if(fill){
    fill.style.transitionDuration = duration + 'ms';
    const pct = Math.max(0, (currentHp/maxHp)*100);
    fill.style.transform = 'scaleX(' + (pct/100) + ')';
    fill.className = 'hp-bar-fill ' + hpBarClass(pct);
  }
  if(label){ label.textContent = `${Math.max(0,currentHp)}/${maxHp} HP`; }
}
function animateSpecialHpBars(){
  if(game.screen !== 'specialBattling' || game.specialRevealPhase !== 'result') return;
  const m = game.specialBattleResult.matchups[game.specialRevealIndex];
  const hit = game.specialLastHit;
  const playerFill = document.getElementById('hp-fill-player');
  const enemyFill = document.getElementById('hp-fill-enemy');
  const playerLabel = document.getElementById('hp-label-player');
  const enemyLabel = document.getElementById('hp-label-enemy');
  if(hit){
    const isPlayer = hit.side === 'player';
    const maxHp = isPlayer ? m.playerMaxHp : m.enemyMaxHp;
    const duration = hpBarTransitionMs((hit.amount / maxHp) * 100);
    const targetFill = isPlayer ? playerFill : enemyFill;
    if(targetFill){ targetFill.style.transitionDuration = duration + 'ms'; }
  }
  if(playerFill){
    const pct = Math.max(0, (m.playerHpAfter/m.playerMaxHp)*100);
    playerFill.style.transform = 'scaleX(' + (pct/100) + ')';
    playerFill.className = 'hp-bar-fill ' + hpBarClass(pct);
  }
  if(enemyFill){
    const pct = Math.max(0, (m.enemyHpAfter/m.enemyMaxHp)*100);
    enemyFill.style.transform = 'scaleX(' + (pct/100) + ')';
    enemyFill.className = 'hp-bar-fill ' + hpBarClass(pct);
  }
  if(playerLabel){ playerLabel.textContent = `${Math.max(0,m.playerHpAfter)}/${m.playerMaxHp} HP`; }
  if(enemyLabel){ enemyLabel.textContent = `${Math.max(0,m.enemyHpAfter)}/${m.enemyMaxHp} HP`; }
}
function finishSpecialBattle(){
  const cfg = game.specialBattle;
  const result = game.specialBattleResult;
  const win = result.win;
  /* Mesma mecânica dos ginásios: pokémon que desmaiou ganha +1 level.

     O filtro "estava vivo antes" existe pela ELITE, e só faz sentido lá: as 5 lutas do rush são uma
     tentativa só, o HP carrega entre elas, e sem o filtro um pokémon caído na luta 1 subia de nível
     de novo nas lutas 2 a 5 sem ter lutado.

     Só que ele estava valendo para TODOS os contextos, e aí quebrava Rocket e rival: nesses fluxos
     o time também não é curado entre tentativas (continueAfterSpecial devolve pro esconderijo com o
     HP como ficou), então da segunda tentativa em diante todo mundo entrava com hp 0, "não estava
     vivo antes", e ninguém ganhava o +1 -- diferente do ginásio, onde finishBattle dá o nível sempre
     que o pokémon termina caído. Agora o filtro fica restrito à Elite, que é de onde ele veio. */
  const hpBefore = (cfg.context === 'elite') ? (game.specialHpBeforeBattle || []) : [];
  let anyLeveledUp = false;
  game.team.forEach((p, idx)=>{
    const wasAlive = hpBefore[idx]==null || hpBefore[idx] > 0; // fora da Elite hpBefore é vazio, então isso é sempre true
    if(p.hp<=0 && wasAlive){
      p.level += 1;
      if(result.playerStatus[idx]){ result.playerStatus[idx].level = p.level; }
      anyLeveledUp = true;
    }
  });
  game.specialHpBeforeBattle = null;
  result.leveledUpFromFaint = anyLeveledUp;
  let msg = '';
  game.specialGrantsLevels = 0;
  if(cfg.context==='rocket'){
    if(win){
      game.specialGrantsLevels = 3;
      msg = 'Você espantou a Equipe Rocket! Isso rendeu <strong>+3 levels bônus</strong> — hora de reforçar o time.';
    } else if(game.team.length > 1){
      const idx = Math.floor(Math.random()*game.team.length);
      game.stolenMon = game.team.splice(idx,1)[0];
      game.hideoutStage = 0;
      game.hideoutAttemptsLeft = 3;
      // nível do guarda/chefe é travado aqui, na hora do roubo -- se recalculasse a média do time a cada
      // nova tentativa, um pokémon seu subindo de nível numa tentativa perdida deixaria o guarda mais forte
      // na tentativa seguinte, dando a impressão de que ELE também tivesse subido de nível ao ser derrotado
      game.hideoutFoeLevel = avgTeamLevel();
      msg = `«Valeu pela contribuição!» A Rocket <strong>sequestrou ${game.stolenMon.name}</strong>! Você tem <strong>3 tentativas</strong> de resgatá-lo(a) no esconderijo deles antes do próximo ginásio — depois disso, ele(a) se perde pra sempre.`;
    } else {
      msg = 'A Rocket fugiu com uns trocados, mas seu único pokémon ficou seguro.';
    }
  } else if(cfg.context==='hideout1'){
    if(win){ game.hideoutStage = 1; msg = 'Guarda derrotado! Só falta o chefe da sala dos fundos.'; }
    else {
      game.hideoutAttemptsLeft = Math.max(0, (game.hideoutAttemptsLeft||1) - 1);
      if(game.hideoutAttemptsLeft<=0){
        const lostMon = game.stolenMon;
        game.stolenMon = null; game.hideoutStage = 0; game.hideoutFoeLevel = null;
        msg = `Sem mais tentativas... <strong>${lostMon?lostMon.name:'seu pokémon'}</strong> foi perdido pra sempre.`;
      } else {
        msg = `Você foi expulso do esconderijo. Restam <strong>${game.hideoutAttemptsLeft} tentativa(s)</strong> antes do próximo ginásio.`;
      }
    }
  } else if(cfg.context==='hideout2'){
    if(win){
      const mon = game.stolenMon;
      game.stolenMon = null; game.hideoutStage = 0; game.hideoutFoeLevel = null;
      if(mon && game.team.length < 6){ game.team.push(mon); msg = `Resgate concluído! <strong>${mon.name}</strong> voltou pro time.`; }
      else if(mon){ game.stolenMon = mon; msg = `${mon.name} foi resgatado, mas seu time está cheio — ele espera na próxima vaga.`; }
      else { msg = 'Resgate concluído!'; }
    } else {
      game.hideoutAttemptsLeft = Math.max(0, (game.hideoutAttemptsLeft||1) - 1);
      if(game.hideoutAttemptsLeft<=0){
        const lostMon = game.stolenMon;
        game.stolenMon = null; game.hideoutStage = 0; game.hideoutFoeLevel = null;
        msg = `Sem mais tentativas... <strong>${lostMon?lostMon.name:'seu pokémon'}</strong> foi perdido pra sempre.`;
      } else {
        msg = `O chefe do esconderijo é osso duro. Restam <strong>${game.hideoutAttemptsLeft} tentativa(s)</strong>.`;
      }
    }
  } else if(cfg.context==='rival'){
    if(win){
      // vencer o rival rende 3 níveis em TODOS os modos (era 5 no normal).
      // A constante segue existindo caso um dia o difícil precise de um valor próprio
      game.specialGrantsLevels = isHardMode() ? HARD_RIVAL_BONUS : RIVAL_WIN_BONUS;
      msg = `Você venceu ${cfg.meta.opponentName}! «Droga... da próxima eu ganho.» Isso rendeu <strong>+${game.specialGrantsLevels} levels bônus</strong> pro seu time.`;
    } else {
      msg = `${cfg.meta.opponentName} venceu dessa vez. «Ainda bem que treinei mais que você.» Essa derrota <strong>não contou</strong> nas suas 5.`;
    }
  } else if(cfg.context==='elite'){
    // registra o pico ANTES de qualquer avanço ou reset -- eliteStage aqui ainda é "quantos membros
    // já foram batidos ao entrar nessa luta", então isso acumula o melhor de TODAS as tentativas,
    // mesmo que a atual reset pra 0 logo depois numa derrota. Sem isso, só dava pra saber onde a
    // ÚLTIMA tentativa parou, não a melhor de todas
    game.eliteBestStage = Math.max(game.eliteBestStage||0, game.eliteStage);
    if(win){
      if(game.eliteStage < ELITE_FOUR.length){
        // venceu um dos 3 membros -- avança e libera as 2 escolhas de cura
        game.eliteStage += 1;
        game.eliteHealsLeft = 2;
        const next = eliteOpponentForStage(game.eliteStage);
        msg = `${cfg.meta.opponentName} foi superado(a)! Antes de enfrentar <strong>${escapeHtmlSafe(next.meta.opponentName)}</strong>, você pode escolher <strong>2 pokémons</strong> pra reviver ou recuperar a vida. O resto do time segue como está.`;
      } else {
        // venceu a FINAL contra o rival -- campeão da Liga Pokémon
        game.eliteStatus = 'champion';
        game.accountEliteChampion = true;
        /* Conquista "Mestre do Disfarce": vencer a Elite COM UM DITTO NO TIME. Flag permanente,
           gravada no instante da vitória -- mesmo motivo do everComeback. Olhar o time do save
           depois não serve: ele muda, e daria a conquista pra quem só colocou o Ditto no time
           DEPOIS de ser campeão (e tiraria de quem venceu com ele e trocou em seguida). */
        if((game.team||[]).some(p=>p && p.speciesId==='ditto')) game.eliteDittoWin = true;
        /* O TIME DA VITÓRIA, congelado. Mesmo motivo do eliteDittoWin: o time do save continua
           mudando depois (o Mewtwo emprestado entra por 24h, por exemplo), e as conquistas de
           COMPOSIÇÃO -- time todo de Kanto, todo de Johto, monotipo -- mentiriam nos dois sentidos:
           dariam pra quem montou o time depois de campeão e tirariam de quem venceu e trocou. */
        game.eliteWinTeam = (game.team||[]).filter(p=>p && p.speciesId).map(p=>p.speciesId);
        if(game.authUser){
          userDocRef(game.authUser.uid).set({ eliteChampion: true }, { merge: true })
            .catch(e=>console.error('Erro ao gravar o título da Elite na conta:', e));
        }
        msg = `🏆 <strong>VOCÊ É O NOVO CAMPEÃO DA LIGA POKÉMON!</strong> ${escapeHtmlSafe(cfg.meta.opponentName)} não teve resposta. «...Você mereceu. Dessa vez.» De agora em diante, seu nome carrega o troféu <strong>🏆</strong> em todas as ligas online.`;
      }
    } else {
      // cada tentativa é o RUSH completo -- perder não continua de onde parou, reseta pro início
      game.eliteAttemptsUsed = (game.eliteAttemptsUsed||0) + 1;
      const attemptsLeft = ELITE_MAX_ATTEMPTS - game.eliteAttemptsUsed;
      if(attemptsLeft > 0){
        // ainda sobra tentativa -- volta pro início (não é 'defeated', é só a corrida atual que
        // acabou); eliteStage/eliteHealsLeft voltam a zero pra próxima vez que aceitar o desafio
        // recomeçar do zero de verdade (startEliteChallenge já cuida de curar o time inteiro de novo)
        game.eliteStatus = null;
        game.eliteStage = 0;
        game.eliteHealsLeft = 0;
        const foeName = cfg.meta.opponentName;
        // "o primeiro da fila" e não um nome fixo: a fila é sorteada por save (ver elitePath)
        msg = `💀 <strong>Derrota.</strong> ${escapeHtmlSafe(foeName)} foi forte demais dessa vez — e como cada tentativa é o desafio completo, é preciso recomeçar do zero, contra ${escapeHtmlSafe(eliteMembroDaEtapa(0).name)}. Essa foi sua tentativa <strong>${game.eliteAttemptsUsed} de ${ELITE_MAX_ATTEMPTS}</strong>. Ainda restam <strong>${attemptsLeft}</strong>.`;
      } else {
        // essa era a última -- agora sim, game over definitivo desse save
        game.eliteStatus = 'defeated';
        msg = `💀 <strong>GAME OVER.</strong> Era sua última das ${ELITE_MAX_ATTEMPTS} tentativas, e o time inteiro caiu diante da Elite. A jornada desse save termina agora... mas o time continua valendo nas <strong>ligas online</strong>, com toda a força que conquistou.`;
      }
    }
    saveCurrentGame();
  }
  game.specialResultMsg = msg;
  game.screen = 'specialResult';
  render();
}
function continueAfterSpecial(){
  const context = game.specialBattle ? game.specialBattle.context : null;
  const grantedLevels = game.specialGrantsLevels || 0;
  game.specialBattle = null;
  game.specialBattleResult = null;
  game.specialGrantsLevels = 0;
  game.rocketSleepStolenMon = null;
  if(context==='elite'){
    // 'eliteHeal' só faz sentido NO MEIO de um rush (time recém curado parcialmente, próxima luta
    // conhecida). Depois de campeão, derrota definitiva, OU uma derrota que resetou pra nova tentativa
    // (eliteStatus volta a null), volta pro resumo da jornada -- de lá, uma nova tentativa só começa
    // de verdade via startEliteChallenge (que cura o time inteiro); ir direto pra eliteHeal aqui
    // deixaria o time entrar na próxima tentativa ainda machucado da anterior
    game.screen = (game.eliteStatus==='inProgress') ? 'eliteHeal' : 'journeyEnd';
    saveCurrentGame();
    render();
    return;
  }
  if((context==='rocket' || context==='rival') && grantedLevels>0){
    // os levels bônus (Rocket ou vitória contra o rival) são distribuídos na hora, com a mesma tela usada após encontros selvagens
    game.pool = grantedLevels;
    game.poolTotal = grantedLevels;
    game.alloc = {};
    game.team.forEach(p=> game.alloc[p.id]=0 );
    game.levelsFromRocket = (context==='rocket');
    game.levelsFromRivalWin = (context==='rival');
    game.screen = 'levels';
    render();
    return;
  }
  if((context==='rocket' || context==='hideout1' || context==='hideout2') && game.stolenMon){
    game.screen = 'rocketHideout';
    render();
    return;
  }
  proceedToGymApproach();
}

function englishTypeFromPortuguese(ptName){
  return Object.keys(TYPE_NAMES_PT).find(en => TYPE_NAMES_PT[en] === ptName) || null;
}
// sorteia um terreno que combine com um tipo (em inglês). Base compartilhada entre os ginásios da
// jornada e a Elite 4 -- os dois querem a mesma coisa: "um cenário do domínio desse treinador"
function pickTerrainForType(englishType){
  const matching = englishType ? TERRAINS.filter(t=>t.types.includes(englishType)) : [];
  const pool = matching.length>0 ? matching : TERRAINS; // rede de segurança, não deveria cair aqui já que todo tipo tem pelo menos 1 terreno
  return pool[Math.floor(Math.random()*pool.length)];
}
function pickGymTerrain(gym){
  return pickTerrainForType(englishTypeFromPortuguese(gym.gymTypeName));
}
async function updateStreakRecord(result){
  // sequência = quantas batalhas COMPLETAS foram vencidas em sequência, sem o time inteiro desmaiar --
  // é uma estatística da CONTA (do treinador), não de um save específico
  if(result.win){
    game.trainerLastStreak = (game.trainerLastStreak||0) + 1;
    game.trainerBestStreak = Math.max(game.trainerBestStreak||0, game.trainerLastStreak);
  } else {
    game.trainerLastStreak = 0;
  }
  if(game.authUser){
    try{
      await userDocRef(game.authUser.uid).set({ trainerLastStreak: game.trainerLastStreak, trainerBestStreak: game.trainerBestStreak }, { merge:true });
    } catch(e){ console.error('Erro ao salvar sequência do treinador:', e); }
  }
}
async function updateTrainerStreakForUid(uid, won){
  // mesma lógica de cima, mas pra usar quando quem processa o resultado (Liga) pode não ser o próprio
  // dono da conta -- lê o valor atual direto do Firestore em vez de usar o game.* local
  if(!uid) return;
  try{
    const ref = userDocRef(uid);
    const snap = await ref.get();
    const d = snap.exists ? snap.data() : {};
    const currentLast = d.trainerLastStreak || 0;
    const currentBest = d.trainerBestStreak || 0;
    const newLast = won ? currentLast + 1 : 0;
    const newBest = Math.max(currentBest, newLast);
    await ref.set({ trainerLastStreak: newLast, trainerBestStreak: newBest }, { merge:true });
    if(game.authUser && game.authUser.uid === uid){
      game.trainerLastStreak = newLast;
      game.trainerBestStreak = newBest;
    }
  } catch(e){ console.error('Erro ao atualizar sequência do treinador:', e); }
}
function runBattle(){
  /* No difícil, metade do time do líder vem shiny.
     O sorteio é SEMEADO pela jornada + ginásio, não aleatório a cada batalha: o time do líder
     precisa ser o mesmo em todas as tentativas. Sorteando na hora, um Sandshrew shiny na primeira
     tentativa sumia na segunda -- o adversário mudava no meio da disputa, o que é confuso e
     injusto (o buff de shiny altera o dano). Mesma semente = mesmo time, sempre. */
  const base = gymAtual().team;
  /* Quais pokémon do líder são shiny: METADE DO TIME, quantidade exata -- não 50% de chance por
     pokémon. Sorteando por pokémon, um time de 3 saía com 0 ou 3 shinies em 1 de cada 4 batalhas,
     e "metade do time" virava só uma média.
     Os escolhidos vêm de um embaralhamento SEMEADO pela jornada + ginásio, então o time é sempre o
     mesmo em todas as tentativas daquele ginásio -- antes ele mudava a cada tentativa, e como
     shiny dá +15% de dano, o adversário mudava de força no meio da disputa. */
  const shinyIdx = new Set();
  if(isHardMode()){
    const quantos = Math.round(base.length * HARD_LEADER_SHINY_RATIO);
    const rng = makeSeededRng(`${game.starterId||''}|${game.rivalName||''}|${game.currentSaveSlot}|gym${game.gymIndex}`);
    const ordem = base.map((_,i)=>i);
    for(let i=ordem.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [ordem[i],ordem[j]]=[ordem[j],ordem[i]]; }
    ordem.slice(0, quantos).forEach(i=>shinyIdx.add(i));
  }
  const gymTeam = base.map((b, i)=>{
    const inst = createInstance(b.species, b.level);
    if(shinyIdx.has(i)) inst.shiny = true;
    return inst;
  });
  if(game.gymTerrain){
    applyTerrainBuff(game.team, game.gymTerrain); // seguro agora -- só marca a flag, não muta os atributos de verdade
    applyTerrainBuff(gymTeam, game.gymTerrain);
  }
  applySpecialtyBuff(game.team);
  const result = simulateGymBattle(game.team, gymTeam);
  updateStreakRecord(result);
  preloadBattleSprites(result.matchups);
  game.battleResult = result;
  game.revealIndex = 0;
  game.revealPhase = 'loading';
  game.screen = 'battling';
  render();
  setTimeout(advanceReveal, 1200);
}
function advanceReveal(){
  if(game.screen !== 'battling') return;
  if(game.revealPhase === 'loading'){
    const m = game.battleResult.matchups[game.revealIndex];
    game.revealHitSequence = buildAnimatedHitSequence(m);
    game.revealHitStep = 0;
    game.revealCurrentPlayerHp = m.playerHpBefore;
    game.revealCurrentEnemyHp = m.enemyHpBefore;
    if(game.revealHitSequence.length > 0){
      game.revealPhase = 'animating';
      render();
      setTimeout(advanceReveal, 550);
    } else {
      game.revealPhase = 'result';
      render();
      setTimeout(animateHpBars, 50);
      setTimeout(advanceReveal, 1300);
    }
  } else if(game.revealPhase === 'animating'){
    // NÃO chama render() aqui -- a barra já está no valor certo (da renderização inicial ao entrar em
    // 'animating', ou do golpe anterior), e o CSS consegue redirecionar suavemente pro novo alvo sem
    // precisar recriar a tela inteira. Recriar a tela reconstrói os sprites do zero a cada golpe, o que
    // causava um "piscar" visual perceptível toda vez que a barra atualizava
    const m = game.battleResult.matchups[game.revealIndex];
    const hit = game.revealHitSequence[game.revealHitStep];
    if(hit.side==='player'){ game.revealCurrentPlayerHp = Math.max(0, game.revealCurrentPlayerHp - hit.amount); }
    else { game.revealCurrentEnemyHp = Math.max(0, game.revealCurrentEnemyHp - hit.amount); }
    game.revealLastHit = hit;
    game.revealHitStep++;
    const isLastHit = game.revealHitStep >= game.revealHitSequence.length;
    const hitMaxHp = hit.side==='player' ? m.playerMaxHp : m.enemyMaxHp;
    const hitDuration = hpBarTransitionMs((hit.amount / hitMaxHp) * 100);
    if(isLastHit){
      // esse é o golpe que decide a luta -- muda pra fase 'result' JÁ AQUI, então precisa ser o
      // animador da fase 'result' (animateHpBars) a aplicar esse valor, e não o animatePartialHpBars
      // (que se recusaria, já que ele só age enquanto a fase ainda é 'animating'). Além da barra, a
      // MENSAGEM de texto ("X venceu!") só aparece com um render() de verdade -- sem ele, a tela ficava
      // presa em "Trocando golpes..." até a próxima luta, mesmo com a barra já toda zerada. Esse render()
      // só acontece UMA VEZ (na virada pro resultado), não a cada golpe, então não causa o piscar
      game.revealPhase = 'result';
      animateHpBars();
      setTimeout(render, hitDuration + 50); // espera a transição da barra terminar de verdade, pra não dar salto visual
      setTimeout(advanceReveal, hitDuration + 800);
    } else {
      animatePartialHpBars();
      setTimeout(advanceReveal, hitDuration + 150); // só avança pro próximo golpe depois que esse terminou de descer
    }
  } else {
    const matchups = game.battleResult.matchups;
    if(game.revealIndex < matchups.length - 1){
      game.revealIndex++;
      game.revealPhase = 'loading';
      render();
      setTimeout(advanceReveal, 1200);
    } else if(game.battleResultContext === 'neighborhoodGym'){
      finishNeighborhoodGymBattle();
    } else {
      finishBattle();
    }
  }
}
const HP_BAR_PCT_PER_SEC = 94; // velocidade constante da barra: pontos percentuais do total por segundo (25% mais rápido que antes)
function hpBarTransitionMs(deltaPct){
  const ms = Math.round((Math.abs(deltaPct) / HP_BAR_PCT_PER_SEC) * 1000);
  return Math.max(150, Math.min(1400, ms)); // nunca instantâneo demais nem lento demais
}
function animatePartialHpBars(){
  if(game.screen !== 'battling' || game.revealPhase !== 'animating') return;
  const m = game.battleResult.matchups[game.revealIndex];
  const hit = game.revealLastHit;
  if(!hit) return;
  const isPlayer = hit.side === 'player';
  const maxHp = isPlayer ? m.playerMaxHp : m.enemyMaxHp;
  const currentHp = isPlayer ? game.revealCurrentPlayerHp : game.revealCurrentEnemyHp;
  // a duração da transição é proporcional ao tamanho do golpe (em % do HP máximo), não um tempo fixo --
  // assim a barra sempre desce na MESMA velocidade visual, seja um golpe grande ou pequeno
  const deltaPct = (hit.amount / maxHp) * 100;
  const duration = hpBarTransitionMs(deltaPct);
  const fill = document.getElementById(isPlayer ? 'hp-fill-player' : 'hp-fill-enemy');
  const label = document.getElementById(isPlayer ? 'hp-label-player' : 'hp-label-enemy');
  if(fill){
    fill.style.transitionDuration = duration + 'ms';
    const pct = Math.max(0, (currentHp/maxHp)*100);
    fill.style.transform = 'scaleX(' + (pct/100) + ')';
    fill.className = 'hp-bar-fill ' + hpBarClass(pct);
  }
  if(label){ label.textContent = `${Math.max(0,currentHp)}/${maxHp} HP`; }
}
/* A animação lê a MESMA sequência do log (sequenciaDoConfronto) e só traduz o vocabulário:
   lá 'q' é quem BATE, aqui 'side' é quem APANHA. Enquanto as duas listas eram montadas em
   separado, o jogador via 3 golpes na tela e lia 4 linhas no log. */
function buildAnimatedHitSequence(m){
  return sequenciaDoConfronto(m).map(g => ({ side: g.q === 'p' ? 'enemy' : 'player', amount: g.d }));
}
function reconstruirSequencia(m){
  // já sabemos o resultado final (quem vence e com quanto HP fica) -- essa função só decide COMO
  // chegar visualmente até lá, usando no máximo 3 golpes na animação:
  //   1) o vencedor acerta uma parte do perdedor (entre 1% e 99% do dano total que o perdedor vai
  //      tomar) -- ainda não é fatal
  //   2) o perdedor, já sabendo que vai cair, desfere TODO o dano que ele tinha pra causar de uma vez
  //      só, num único golpe (em vez de espalhar em vários golpes pequenos)
  //   3) o vencedor termina de derrubar o perdedor com o resto do dano que faltava
  // Se o perdedor já entrou nessa luta com menos de 50% do próprio HP máximo (ou seja, já vinha
  // desgastado de uma luta anterior na mesma batalha), pula direto pros golpes 2 e 3 -- só 2 golpes
  // no total, sem o "aquecimento" inicial do vencedor
  const playerDmg = Math.max(0, m.playerHpBefore - m.playerHpAfter);
  const enemyDmg = Math.max(0, m.enemyHpBefore - m.enemyHpAfter);

  if(m.isTrade){
    // caso raro: os dois caem juntos -- cada lado desfere o próprio dano total num golpe só
    const seq = [];
    if(playerDmg>0) seq.push({side:'player', amount:playerDmg});
    if(enemyDmg>0) seq.push({side:'enemy', amount:enemyDmg});
    return seq;
  }

  const loserSide = m.playerWon ? 'enemy' : 'player';
  const winnerSide = m.playerWon ? 'player' : 'enemy';
  const loserTotalDmg = m.playerWon ? enemyDmg : playerDmg; // quanto o PERDEDOR toma no total
  const winnerTotalDmg = m.playerWon ? playerDmg : enemyDmg; // quanto o VENCEDOR toma no total (do perdedor)

  const loserHpBefore = m.playerWon ? m.enemyHpBefore : m.playerHpBefore;
  const loserMaxHp = m.playerWon ? m.enemyMaxHp : m.playerMaxHp;
  const loserAlreadyWeak = loserMaxHp > 0 && (loserHpBefore / loserMaxHp) < 0.5;

  const seq = [];
  if(loserAlreadyWeak || loserTotalDmg <= 1){
    // já entrou fragilizado (ou o dano total é pequeno demais pra dividir em parcial + final) -- só 2 golpes
    if(winnerTotalDmg > 0) seq.push({ side: winnerSide, amount: winnerTotalDmg }); // perdedor acerta o vencedor
    seq.push({ side: loserSide, amount: loserTotalDmg }); // vencedor termina de derrubar o perdedor
    return seq;
  }

  // 3 golpes: vencedor acerta uma parte (1% a 99%), perdedor acerta o dele todo de uma vez, vencedor termina
  /* 30% a 70%, nao 1% a 99%. Com a faixa aberta antiga, 1 em cada 7 confrontos sorteava um primeiro
     golpe abaixo de 15% do dano -- um arranhao seguido de um tranco que derrubava os outros 85%+ de
     uma vez. Ficava com cara de bug, embora o resultado estivesse certo. Estreitar mantem a variacao
     (nenhuma luta sai igual a outra) e tira os dois extremos. */
  /* DETERMINÍSTICO, não Math.random(). O log e a animação chamam esta função em momentos
     diferentes e precisam receber a MESMA divisão -- com sorteio, a linha do log mostrava um
     número e a barra descia outro, e cada redesenho da tela trocava os valores de novo.
     A semente sai do próprio confronto, então o mesmo confronto sempre divide igual. */
  const semente = (Math.abs(m.playerHpBefore*31 + m.enemyHpBefore*17 + playerDmg*7 + enemyDmg*3)) % 41;
  const firstHitPct = 0.30 + (semente/40)*0.40;
  const firstHitAmount = Math.max(1, Math.min(loserTotalDmg-1, Math.round(loserTotalDmg*firstHitPct)));
  const finishingHitAmount = loserTotalDmg - firstHitAmount;

  seq.push({ side: loserSide, amount: firstHitAmount }); // 1: vencedor acerta uma parte do perdedor (nao fatal)
  if(winnerTotalDmg > 0) seq.push({ side: winnerSide, amount: winnerTotalDmg }); // 2: perdedor acerta o vencedor, tudo de uma vez
  seq.push({ side: loserSide, amount: finishingHitAmount }); // 3: vencedor termina de derrubar o perdedor
  return seq;
}
function hpBarClass(pct){
  if(pct > 50) return 'hp-high';
  if(pct > 20) return 'hp-mid';
  return 'hp-low';
}
function animateHpBars(){
  if(game.screen !== 'battling' || game.revealPhase !== 'result') return;
  const m = game.battleResult.matchups[game.revealIndex];
  const hit = game.revealLastHit;
  const playerFill = document.getElementById('hp-fill-player');
  const enemyFill = document.getElementById('hp-fill-enemy');
  const playerLabel = document.getElementById('hp-label-player');
  const enemyLabel = document.getElementById('hp-label-enemy');
  if(hit){
    // usa a duração dinâmica só no lado que realmente foi atingido nesse último golpe -- o outro lado
    // não muda de valor aqui, então sua transição não importa
    const isPlayer = hit.side === 'player';
    const maxHp = isPlayer ? m.playerMaxHp : m.enemyMaxHp;
    const duration = hpBarTransitionMs((hit.amount / maxHp) * 100);
    const targetFill = isPlayer ? playerFill : enemyFill;
    if(targetFill){ targetFill.style.transitionDuration = duration + 'ms'; }
  }
  if(playerFill){
    const pct = Math.max(0, (m.playerHpAfter/m.playerMaxHp)*100);
    playerFill.style.transform = 'scaleX(' + (pct/100) + ')';
    playerFill.className = 'hp-bar-fill ' + hpBarClass(pct);
  }
  if(enemyFill){
    const pct = Math.max(0, (m.enemyHpAfter/m.enemyMaxHp)*100);
    enemyFill.style.transform = 'scaleX(' + (pct/100) + ')';
    enemyFill.className = 'hp-bar-fill ' + hpBarClass(pct);
  }
  if(playerLabel){ playerLabel.textContent = `${Math.max(0,m.playerHpAfter)}/${m.playerMaxHp} HP`; }
  if(enemyLabel){ enemyLabel.textContent = `${Math.max(0,m.enemyHpAfter)}/${m.enemyMaxHp} HP`; }
}
function finishBattle(){
  if(game.screen !== 'battling') return;
  const result = game.battleResult;
  let anyLeveledUp = false;
  game.team.forEach((p, idx)=>{
    if(p.hp<=0){
      p.level += 1;
      if(result.playerStatus[idx]){ result.playerStatus[idx].level = p.level; }
      anyLeveledUp = true;
    }
  });
  result.leveledUpFromFaint = anyLeveledUp;
  if(result.win){
    game.badgesEarned.push(gymAtual().badge);
    // 1ª insígnia = a jornada saiu do papel; aquele slot ganha direito a um sorteio novo de
    // iniciais na PRÓXIMA vez que for recriado (ver sorteioDosIniciais)
    if(game.badgesEarned.length === 1) limparSorteioDosIniciais(game.currentSaveSlot);
    game.screen = 'victory';
  } else {
    game.losses++;
    game.lossesTotal = (game.lossesTotal||0) + 1;   // acumula pra jornada toda; nunca é zerado
    game.screen = game.losses>=5 ? 'gameover' : 'defeat';
  }
  render();
}

function encodeTeamCode(team){
  const payload = team.map(p=>`${p.speciesId}:${p.level}${p.shiny?':1':''}`).join(',');
  try{ return btoa(payload).replace(/=+$/,''); }
  catch(e){ return ''; }
}
// monta o código de time especial com o Mewtwo emprestado do prêmio -- substitui o pokémon que foi banido
// pro Prof. Carvalho no momento da vitória (ou só adiciona, se o time tinha menos de 6 quando venceu).
// NUNCA mexe no save de verdade -- o time salvo continua intacto, só esse código derivado muda
function buildMewtwoTeamCode(saveData){
  const team = (saveData.team || []).slice();
  const reward = saveData.mewtwoReward;
  const mewtwoEntry = { speciesId:'mewtwo', level:MEWTWO_LOAN_LEVEL, shiny:false };
  if(reward && typeof reward.benchIndex === 'number' && reward.benchIndex >= 0 && reward.benchIndex < team.length){
    team[reward.benchIndex] = mewtwoEntry;
  } else {
    team.push(mewtwoEntry);
  }
  return encodeTeamCode(team);
}
function decodeTeamCode(code){
  if(!code) return null;
  let padded = code.trim();
  if(!padded) return null;
  while(padded.length % 4 !== 0) padded += '=';
  let payload;
  try{ payload = atob(padded); } catch(e){ return null; }
  const parts = payload.split(',').filter(Boolean);
  if(parts.length===0 || parts.length>6) return null;
  const team = [];
  for(const part of parts){
    const bits = part.split(':');
    if(bits.length<2 || bits.length>3) return null;
    const id = bits[0];
    const lvl = parseInt(bits[1],10);
    if(!SPECIES[id] || !Number.isFinite(lvl) || lvl<1 || lvl>200) return null;
    const inst = createInstance(id, lvl);
    if(bits[2]==='1'){ inst.shiny = true; }
    team.push(inst);
  }
  return team;
}

function runTrainerBattle(opponentTeam){
  game.trainerBattleOpponentName = null;   // batalha comum: a tela mostra só "Adversário"
  game.trainerBattlePlayerName = null;     // e o lado esquerdo é você mesmo (ver renderTrainerBattling)
  game.towerBattlePending = false;
  // mesmo cuidado da luta do Mewtwo: createInstance não traz a flag de shiny, e sem ela um shiny

    return inst;
  });

  updateStreakRecord(result);
  preloadBattleSprites(result.matchups);
  game.trainerBattleResult = result;
  game.trainerRevealIndex = 0;
  game.trainerRevealPhase = 'loading';
  game.screen = 'trainerBattling';
  render();
  setTimeout(advanceTrainerReveal, 1200);
}
function advanceTrainerReveal(){
  if(game.screen !== 'trainerBattling') return;
  if(game.trainerRevealPhase === 'loading'){
    const m = game.trainerBattleResult.matchups[game.trainerRevealIndex];
    game.trainerHitSequence = buildAnimatedHitSequence(m);
    game.trainerHitStep = 0;
    game.trainerCurrentPlayerHp = m.playerHpBefore;
    game.trainerCurrentEnemyHp = m.enemyHpBefore;
    if(game.trainerHitSequence.length > 0){
      game.trainerRevealPhase = 'animating';
      render();
      setTimeout(advanceTrainerReveal, 550);
    } else {
      game.trainerRevealPhase = 'result';
      render();
      setTimeout(animateTrainerHpBars, 50);
      setTimeout(advanceTrainerReveal, 1300);
    }
  } else if(game.trainerRevealPhase === 'animating'){
    const m = game.trainerBattleResult.matchups[game.trainerRevealIndex];
    const hit = game.trainerHitSequence[game.trainerHitStep];
    if(hit.side==='player'){ game.trainerCurrentPlayerHp = Math.max(0, game.trainerCurrentPlayerHp - hit.amount); }
    else { game.trainerCurrentEnemyHp = Math.max(0, game.trainerCurrentEnemyHp - hit.amount); }
    game.trainerLastHit = hit;
    game.trainerHitStep++;
    const isLastHit = game.trainerHitStep >= game.trainerHitSequence.length;
    const hitMaxHp = hit.side==='player' ? m.playerMaxHp : m.enemyMaxHp;
    const hitDuration = hpBarTransitionMs((hit.amount / hitMaxHp) * 100);
    if(isLastHit){
      game.trainerRevealPhase = 'result';
      animateTrainerHpBars();
      setTimeout(render, hitDuration + 50);
      setTimeout(advanceTrainerReveal, hitDuration + 800);
    } else {
      animatePartialTrainerHpBars();
      setTimeout(advanceTrainerReveal, hitDuration + 150);
    }
  } else {
    const matchups = game.trainerBattleResult.matchups;
    if(game.trainerRevealIndex < matchups.length - 1){
      game.trainerRevealIndex++;
      game.trainerRevealPhase = 'loading';
      render();
      setTimeout(advanceTrainerReveal, 1200);
    } else {
      finishTrainerBattle();
    }
  }
}

       primeira notificação do onSnapshot já vem com o estado atual, então o HP e o ranking se
       corrigem sozinhos -- inclusive o ataque que acabou de acontecer. */
    ligarEscutaDoBoss();

/* ===================================================================
   NOVA ESTRUTURA DE ARMAZENAMENTO DA LIGA (multi-documento)
   - leagues/schedule: índice leve com status/horários de cada ciclo
   - leagueCycles/{cycleId}: chaveamento completo de UM ciclo específico
   - leagueCycles/{cycleId}/registrants/{nomeSanitizado}: 1 doc por inscrito
     (isso é o que resolve a contenção de escrita quando muita gente se
     inscreve ao mesmo tempo -- cada pessoa escreve no PRÓPRIO documento,
     em vez de todo mundo brigar pra editar um único documento gigante)
=================================================================== */
const CYCLE_INTERVAL_MS = 60 * 60 * 1000; // uma Liga nova por hora
const PHASE_MS = 5 * 60 * 1000; // 5 minutos entre cada fase
const GRANDE_LIGA_SIZE = 16;
const REGULAR_LIGA_SIZE = 8;
const BOT_LEVEL = 45;
function gatherFinalEvolutionSpecies(allowedTypes){
  // pokémons "de última evolução" -- nada mais evolui a partir deles (não aparecem como chave em
  // EVOLUTIONS). Se a liga restringe tipos, só entram espécies desses tipos
  return Object.keys(SPECIES).filter(id=>{
    if(EVOLUTIONS[id]) return false;
    if(allowedTypes && allowedTypes.length>0){
      return SPECIES[id].types.some(t=>allowedTypes.includes(t));
    }
    return true;
  });
}
function createBotRegistrant(index, allowedTypes, seedBase){
  // time do bot é sorteado de forma determinística (mesma seed em qualquer navegador ou na Cloud
  // Function) -- assim, não importa quem de fato ganhe a corrida pra sortear esse ciclo, o time do
  // bot sai sempre igual
  const pool = gatherFinalEvolutionSpecies(allowedTypes);
  const shuffled = shuffleWithSeed(pool, `bot-${seedBase}-${index}`);
  const chosen = shuffled.slice(0, 6);
  const team = chosen.map(sid=>({ speciesId: sid, level: BOT_LEVEL }));
  return {
    name: `Bot ${index}`,
    code: encodeTeamCode(team),
    uid: `bot-${seedBase}-${index}`,
    slot: 'bot',
    registeredAt: 0, // bots sempre ficam no fim da fila de prioridade -- são só um preenchimento
    isBot: true
  };
}
function roundLabelsFor(numRounds){
  // o nome de cada rodada depende de quantas rodadas o chaveamento tem no total
  if(numRounds===4) return ['Oitavas de Final','Quartas de Final','Semifinal','Final'];
  return ['Quartas de Final','Semifinal','Final'];
}
function buildRounds(players){
  const n = players.length; // 8 (Liga normal) ou 16 (Grande Liga)
  const numRounds = Math.round(Math.log2(n));
  const rounds = {};
  const firstRound = [];
  for(let i=0;i<n;i+=2){
    firstRound.push({ a:players[i], b:players[i+1], winner:null, matchups:null, resolved:false });
  }
  rounds['0'] = firstRound;
  let matchCount = firstRound.length;
  for(let r=1; r<numRounds; r++){
    matchCount = matchCount/2;
    const roundMatches = [];
    for(let i=0;i<matchCount;i++){ roundMatches.push({ a:null, b:null, winner:null, matchups:null, resolved:false }); }
    rounds[String(r)] = roundMatches;
  }
  return rounds;
}
function shuffleWithSeed(arr, seedStr){
  const rng = makeSeededRng(seedStr);
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

   TRAINERS LEAGUE -- liga diária de pontos corridos (todos contra todos),

   da Liga Clássica/customizadas (estrutura de chaveamento não se aplica

// não existe mais horário fixo de abertura de inscrições -- elas abrem assim que a liga do dia
