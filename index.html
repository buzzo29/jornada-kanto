  /* mesma caixa dos botões de favoritar e apagar, na cor do Ginásio da Cidade -- os três formam uma
     fileira só, então precisam ter exatamente a mesma métrica */
  .save-slot-gym{
    background:#e9f7ee;
    border:2px solid var(--green-dark);
    border-radius:4px;
    color:var(--green-dark);
    font-size:1.1rem;
    cursor:pointer;
    padding:7px 9px;
    line-height:1;
  }
  .save-slot-gym:active{transform:translate(1px,1px);}
  .save-slot-fav{
    background:#fffbe8;
    border:2px solid #b88c00;
    border-radius:4px;
    color:#b88c00;
    font-size:1.1rem;
    cursor:pointer;
    padding:7px 9px;
    line-height:1;
  }
  .save-slot-fav.active{background:#fff3c4;}
  .save-slot-fav:active{transform:translate(1px,1px);}
  .save-slot-delete{
    background:#fdeceb;
    border:2px solid var(--red-dark);
    border-radius:4px;
    color:var(--red-dark);
    font-size:1.1rem;
    cursor:pointer;
    opacity:1;
    padding:7px 10px;
    line-height:1;
  }
  .save-slot-delete:active{transform:translate(1px,1px);}
  .save-slot-team-row{
    display:flex;
    gap:3px;
    margin:5px 0;
    overflow-x:auto;
    padding-bottom:2px;
  }
  /* variante só pra prévia do time do líder do Ginásio da Cidade -- lá o time é sempre fixo em até 6,
     então em vez de ficar colado à esquerda com espaço vazio sobrando, espalha proporcionalmente.
     Usa GRID com 6 colunas fixas (não flex) -- divide o espaço disponível de forma garantida, sem
     depender de uma cadeia de width:100% se propagando corretamente por vários elementos aninhados
     (span do sprite, img etc.), que se mostrou frágil. overflow:hidden em cada célula é uma rede de
     segurança extra: mesmo que algo relacionado a fonte/imagem tente ficar maior que o espaço
     disponível, fica CORTADO em vez de vazar visualmente pra fora do quadro */
  .save-slot-team-row.spread{ display:grid; grid-template-columns:repeat(6, 1fr); gap:3px; overflow-x:visible; }
  .save-slot-team-row.spread .save-slot-mon{ min-width:0; overflow:hidden; }
  /* quem desmaiou fica apagado -- é o que substituiu o selo de "Desmaiou" no fim da batalha */
  .save-slot-mon.caiu{opacity:.35;filter:grayscale(.5);}
  .save-slot-mon{
    flex:0 0 auto;
    text-align:center;
    min-width:52px;
  }
  .save-slot-mon-sprite{font-size:1.7rem; line-height:1.2;}
  .save-slot-mon-sprite .sprite-img{width:48px; height:48px;}
  .save-slot-mon-sprite .sprite-fallback{font-size:1.9rem;}
  /* maior só na prévia do time do líder do Ginásio da Cidade -- as OUTRAS listas de time (seletores
     de time, Trainers League etc.) continuam do tamanho normal, sem essa classe */
  .save-slot-mon-sprite.large{ width:100%; }
  /* selo de terreno: marca o pokémon que ganha o buff no terreno daquele ginásio. Fica na quina do
     sprite porque a fileira de time é o lugar onde a pessoa compara os seis de relance -- um selo
     embaixo do nível empurraria a linha e mudaria a altura de todas as telas que usam a fileira. */
  .save-slot-mon-sprite{position:relative;}
  /* só a seta, sem moldura: ela já é vermelha e chapada, e um círculo em volta virava um segundo
     elemento competindo com o sprite. O contorno branco resolve a leitura sobre sprite escuro. */
  .mon-terreno-selo{
    position:absolute; top:-1px; right:-1px; font-size:.7rem; line-height:1;
    filter:drop-shadow(0 0 1px #fff) drop-shadow(0 1px 1px rgba(0,0,0,.45));
  }
  .terreno-legenda{font-size:.62rem;color:var(--muted);font-weight:700;margin:6px 0 0;}
  .save-slot-mon-sprite.large .sprite-wrap{ display:block; width:100%; }
  .save-slot-mon-sprite.large .sprite-img{ display:block; margin:0 auto; width:100%; height:auto; max-width:68px; aspect-ratio:1/1; }
  .save-slot-mon-sprite.large .sprite-fallback{font-size:2.6rem;}
  .save-slot-mon-level{font-size:.62rem; font-weight:700; color:var(--muted);}
  .gym-terrain-line{display:flex;align-items:center;gap:8px;margin:8px 0 4px;color:#000;font-size:.8rem;font-weight:700;}
  /* toque de cor nos botões de ação do Ginásio da Cidade -- cada um combina com o próprio ícone,
     sem virar um bloco sólido saturado (mantém o texto escuro e legível, só um realce sutil) */
  .gym-action-square.gym-btn-team{background:#e3ecff; border-color:var(--box-border);}
  .gym-action-square.gym-btn-terrain{background:#e5f6e8; border-color:var(--box-border);}
  .gym-action-square.gym-btn-ranking{background:#fff6d6; border-color:var(--box-border);}
  .gym-action-square.gym-btn-location{background:#ffe6e6; border-color:var(--box-border);}
  .gym-action-square.gym-btn-history{background:#f0e6ff; border-color:var(--box-border);}
  .gym-action-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .gym-action-grid-box{padding:14px;}
  .gym-action-square{
    aspect-ratio:1/1;
    max-width:92px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:6px 4px;
    border:3px solid var(--box-border);
    border-radius:4px;
    box-shadow:3px 3px 0 rgba(0,0,0,.4);
    font-family:var(--font-ui);
    font-weight:800;
    font-size:.7rem;
    line-height:1.15;
    text-align:center;
    color:var(--ink);
    cursor:pointer;
  }
  .gym-action-square:active{transform:translate(1px,1px);box-shadow:2px 2px 0 rgba(0,0,0,.4);}
  .gym-action-icon{font-size:1.2rem;}
  .badge-pip-row{display:flex;gap:4px;margin-bottom:11px;}
  .badge-pip{width:11px;height:11px;border-radius:50%;border:2px solid var(--box-border);background:transparent;flex-shrink:0;}
  .badge-pip.filled{background:var(--yellow);}
  .save-slot-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .trainer-streak-box{padding:12px 16px;}
  .trainer-streak-row{display:flex; justify-content:space-between; font-size:.85rem; font-weight:800; color:var(--ink);}
  .gym-stat-row{font-size:.8rem;}
  .gym-stat-row.gym-stat-row{flex-direction:column;align-items:flex-start;gap:6px;} /* especificidade extra de propósito, pra vencer o display:flex + justify-content:space-between de .trainer-streak-row sem precisar duplicar a regra toda */
  .gym-stat-row span{white-space:nowrap;}
  .save-slot-progress{font-size:.7rem;font-weight:700;color:var(--muted);}
  .save-slot-continue{
    padding:8px 16px;
    border:2px solid var(--box-border);
    border-radius:3px;
    background:var(--blue);
    color:#fff;
    font-weight:800;
    font-size:.75rem;
    cursor:pointer;
    box-shadow:2px 2px 0 var(--box-border);
    flex-shrink:0;
  }
  .save-slot-continue:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--box-border);}
  .save-slot-continue.elite-active{background:var(--red);}
  .save-slot-continue.champion-state{background:var(--yellow);color:#000;}
  .save-slot-continue.defeated-state{background:#595959;color:#fff;}

  .pokedex-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(52px,1fr));
    gap:6px;
  }
  .pokedex-cell{
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid var(--box-border);
    border-radius:3px;
    background:#fff;
  }
  .pokedex-cell.unknown{background:#e8e4d0;opacity:.6;}
  .pokedex-cell.mystery{
    background:linear-gradient(135deg,#2b2f5c,#4a2f6b);
    border-color:#9b6bd6;
    cursor:pointer;
    box-shadow:0 0 8px rgba(155,107,214,.6);
  }
  .pokedex-mystery{font-size:1.2rem;color:#e8d9ff;}
  .pokedex-owned-badge{font-size:.85rem;}
  .pokedex-cell.caught{background:#fff;}
  .pokedex-cell.clickable{
    cursor:pointer;
    border-color:#b88c00;
    box-shadow:0 0 6px rgba(184,140,0,.5);
  }
  .pokedex-number{font-size:.55rem;font-weight:800;color:var(--muted);}
  /* célula de pokémon já registrado: abre a ficha. Fica com a mão do cursor e um leve
     levantar no hover -- sem borda nova, senão competiria com o .clickable dourado do Mewtwo,
     que significa outra coisa (abre o empréstimo) */
  .pokedex-cell.abrivel{cursor:pointer;transition:transform .08s;}
  .pokedex-cell.abrivel:hover{transform:translateY(-2px);}
  .dex-ficha{max-width:340px;}
  .dex-ficha-nome{font-family:var(--font-pixel);font-size:.8rem;margin:8px 0 2px;line-height:1.5;}
  .dex-ficha-num{font-size:.7rem;font-weight:800;color:var(--muted);}
  .dex-ficha-tipos{display:flex;gap:5px;justify-content:center;margin:8px 0 12px;flex-wrap:wrap;}
  .dex-ficha-shiny{font-size:.62rem;font-weight:800;color:var(--yellow-dark);}
  /* sprite à esquerda, atributos à direita. align-items:center mantém os dois lados
     equilibrados quando a lista é mais alta que a sprite */
  .dex-ficha-corpo{display:flex;align-items:center;gap:14px;margin:4px 0 14px;}
  .dex-ficha-sprite{flex-shrink:0;}
  .dex-stats{flex:1;min-width:0;text-align:left;}
  /* rótulo à esquerda e número à direita, na mesma linha, com os números alinhados entre si */
  .dex-stat{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px;}
  .dex-stat-nome{font-size:.62rem;font-weight:800;color:var(--muted);}
  .dex-stat-num{font-size:.72rem;font-weight:800;font-variant-numeric:tabular-nums;}
  .dex-stat.total{border-top:2px solid var(--box-border);margin-top:7px;padding-top:6px;}
  .dex-stat.total .dex-stat-nome,.dex-stat.total .dex-stat-num{color:var(--ink);}
  /* 320px: a sprite cede espaço pra lista, em vez de espremer os números */
  @media (max-width:340px){
    .dex-ficha-corpo{gap:10px;}
    .dex-ficha-corpo .sprite-lg .sprite-img{width:84px;height:84px;}
    .dex-stat-nome{font-size:.58rem;}
  }

  .achievement-row{align-items:flex-start;}
  .achievement-row.locked{opacity:.45;}
  .achievement-text{font-size:.8rem;}
  .achievement-desc{font-size:.7rem;font-weight:600;color:var(--muted);}

  .status-row .tag{
    margin-left:auto;
    font-size:.62rem;
    font-weight:800;
    text-decoration:none;
    padding:2px 7px;
    border-radius:3px;
    letter-spacing:.3px;
    text-transform:uppercase;
  }
  .tag.alive{background:#d3f9d8;color:var(--green-dark);}
  .tag.dead{background:#ffe3e3;color:var(--red-dark);}

  .result-banner{
    font-family:var(--font-pixel);
    text-align:center;
    padding:14px 10px;
    border:3px solid var(--box-border);
    border-radius:3px;
    font-size:.8rem;
    line-height:1.8;
    margin-bottom:14px;
  }
  .result-banner.win{background:#d3f9d8;color:var(--green-dark);}
  .result-banner.lose{background:#ffe3e3;color:var(--red-dark);}
  .encounter-banner{
    font-family:var(--font-pixel);
    text-align:center;
    padding:20px 12px;
    border:3px solid var(--box-border);
    border-radius:4px;
    font-size:1rem;
    line-height:1.8;
    margin-bottom:14px;
    box-shadow:5px 5px 0 rgba(0,0,0,.35);
  }
  .encounter-banner .encounter-icon{ font-size:2.2rem; display:block; margin-bottom:8px; }
  /* o salmao #ff8a75 sobre esse fundo escuro ficava perto demais do proprio fundo na tela do
     celular -- texto em fonte pixel, fino, sumia. Fundo mais escuro e texto quase branco com um
     toque de vermelho: mantem a identidade da Rocket e passa a ler de longe */
  .encounter-banner.rocket{ background:linear-gradient(160deg,#241d2b,#100d1a); color:#ffd9d0; border-color:#ff5a45; }
  .encounter-banner.rocket .encounter-sub{ color:#ff9c88; opacity:1; }
  .encounter-banner.rival{ background:linear-gradient(160deg,#ffe27a,#ffcb05); color:var(--red-dark); border-color:var(--red-dark); }
  .encounter-banner.elite{ background:linear-gradient(160deg,#2e2440,#1a1330); color:#ffd76a; border-color:var(--yellow); }
  .encounter-sub{ font-family:var(--font-ui); font-size:.8rem; font-weight:700; margin-top:6px; opacity:.85; }

  .badges-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
  .badge-chip{
    background:#fff9db;
    border:2px solid var(--yellow);
    border-radius:6px;
    padding:10px 12px;
    font-size:.8rem;
    font-weight:800;
    box-shadow:2px 2px 0 var(--box-border);
    display:flex;
    align-items:center;
    gap:8px;
  }
  /* selo do líder do Ginásio da Cidade -- ocupa a largura toda (alinhado com os outros quadros da
     tela), texto bem maior que o selo de insígnia normal */
  .badge-chip.gym-leader-chip{
    display:flex;
    width:100%;
    box-sizing:border-box;
    justify-content:center;
    align-items:center;
    gap:8px;
    padding:14px 16px;
    background:linear-gradient(180deg, #fffbe8, #fff2b8);
    border:3px solid var(--yellow);
    border-radius:10px;
    box-shadow:3px 3px 0 var(--box-border);
  }
  .gym-leader-chip-name{
    font-family:var(--font-pixel);
    font-size:.9rem;
    color:#000;
    line-height:1.4;
  }
  /* a opção que só existe naquele turno do dia (Espeon/Umbreon) -- moldura destacada pra ficar
     claro que ela não é uma das quatro de sempre */
  .btn.eevee-horario{ border-color:var(--yellow-dark); background:#fff8e0; }
  /* separador das duas regiões na escolha do inicial -- seis botões seguidos viram uma parede */
  .starter-regiao{
    font-family:var(--font-pixel); font-size:.55rem; letter-spacing:.08em;
    color:var(--muted); margin:9px 0 4px; padding-left:2px;
  }
  .starter-regiao:first-of-type{ margin-top:2px; }
  .badge-visual{display:inline-block;}
  .badge-visual-img{display:block;object-fit:contain;}
  .badge-visual-fallback{border-radius:50%;align-items:center;justify-content:center;border:2px solid rgba(0,0,0,.25);}
  .badge-visual.sm{width:22px;height:22px;}
  .badge-visual.sm .badge-visual-img, .badge-visual.sm .badge-visual-fallback{width:22px;height:22px;font-size:.75rem;}
  .badge-visual.lg{width:72px;height:72px;margin:0 auto 6px;}
  .badge-visual.lg .badge-visual-img, .badge-visual.lg .badge-visual-fallback{width:72px;height:72px;font-size:2.2rem;}

  .faint-xp-note{
    background:#fff9db;
    border:2px solid var(--yellow);
    border-radius:3px;
    padding:8px 10px;
    font-size:.8rem;
    margin:0 0 10px;
  }

  .badge-earned{
    text-align:center;
    background:#fff9db;
    border:3px solid var(--yellow);
    border-radius:4px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:4px 4px 0 var(--box-border);
  }
  .badge-earned .badge-icon{font-size:2.4rem;}
  .badge-earned .badge-text{
    font-family:var(--font-pixel);
    font-size:.8rem;
    line-height:1.9;
    color:var(--box-border);
    margin-top:8px;
  }

  .trainer-code-box{
    font-family:var(--font-ui);
    font-size:.8rem;
    word-break:break-all;
    background:#f1f3f5;
    border:2px solid var(--box-border);
    border-radius:3px;
    padding:10px;
    margin:8px 0;
    user-select:all;
    cursor:text;
  }
  .code-input{
    width:100%;
    min-height:70px;
    font-family:var(--font-ui);
    font-size:.85rem;
    border:2px solid var(--box-border);
    border-radius:3px;
    padding:8px;
    margin:8px 0;
    resize:vertical;
    box-sizing:border-box;
  }
  .error-text{color:var(--red-dark);font-size:.8rem;font-weight:700;margin:4px 0 8px;}
  .hint-text{color:var(--blue-dark);font-size:.8rem;font-weight:700;margin:4px 0 8px;}

  .league-match{
    position:relative;
    border:2px dashed #ddd7c2;
    border-radius:3px;
    padding:8px 10px;
    margin-bottom:8px;
  }
  .league-match-header-row{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:4px;}
  .league-match-header-row .league-match-title{margin-bottom:0;}
  .league-match:last-child{margin-bottom:0;}
  .league-match-title{font-size:.62rem;font-weight:800;color:var(--muted);text-transform:uppercase;margin-bottom:4px;}
  .league-match-players{font-size:.85rem;font-weight:700;}
  .league-match-players .vs{color:var(--muted);font-weight:800;margin:0 6px;}
  .league-match-status{font-size:.75rem;margin-top:4px;color:var(--muted);font-weight:700;}
  .league-match.resolved{border-style:solid;border-color:var(--green-dark);}
  .league-match.my-match{
    border-width:3px;
    border-color:var(--red-dark);
    background:#fff6e0;
    box-shadow:0 3px 0 rgba(0,0,0,.12);
  }
  .league-match.my-match.resolved{border-color:var(--red-dark);}
  .league-match-players.centered{text-align:center;}
  .player-link{
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:2px;
    text-decoration-style:dotted;
  }
  .mystery-name{color:var(--muted); font-style:italic;}
  .streak-badge{
    display:inline-block;
    margin-left:4px;
    padding:2px 9px;
    border-radius:10px;
    font-size:.6rem;
    font-weight:800;
    color:#fff;
    text-shadow:1px 1px 1px rgba(0,0,0,.35);
    vertical-align:middle;
  }
  .streak-tier-1{background:#f0a020;}
  .streak-tier-2{background:#e8801a;}
  .streak-tier-3{background:#e05a10; animation:streakPulse 1.1s ease-in-out infinite;}
  .streak-tier-4{background:#d03010; animation:streakPulse 0.8s ease-in-out infinite;}
  .streak-tier-5{background:#b01010; animation:streakPulse 0.55s ease-in-out infinite;}
  @keyframes streakPulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.1);}}
  .player-link:hover{opacity:.7;}
  .btn.secondary.league-watch-btn{margin-top:8px;padding:8px 10px;font-size:.7rem;}

  .reset-link{
    display:block;text-align:center;color:#8a8fae;
    font-size:.8rem;margin-top:4px;cursor:pointer;
    text-decoration:underline;
  }
  .home-nav-btn{
    display:block;
    margin:14px auto 4px;
    padding:9px 20px;
    border:2px solid var(--box-border);
    border-radius:3px;
    background:#fff;
    color:var(--ink);
    font-family:var(--font-ui);
    font-weight:800;
    font-size:.8rem;
    cursor:pointer;
    box-shadow:2px 2px 0 var(--box-border);
  }
  .home-nav-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--box-border);}
  /* linha com Logout + Instalar app lado a lado */
  .home-nav-row{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 4px;}
  .home-nav-row .home-nav-btn{margin:0;}
  .home-nav-btn.install{background:var(--yellow);}
  .leagues-big-btn{
    display:block;
    width:100%;
    margin:4px 0 14px;
    padding:16px 20px;
    border:3px solid var(--box-border);
    border-radius:4px;
    background:var(--blue);
    color:#fff;
    font-family:var(--font-pixel);
    font-weight:400;
    font-size:.85rem;
    text-align:center;
    box-shadow:4px 4px 0 rgba(0,0,0,.35);
  }
  .leagues-big-btn:active{transform:translate(2px,2px); box-shadow:2px 2px 0 rgba(0,0,0,.35);}
  /* Modos de jogo em grade 2x2. Com 4 modos numa fileira só, cada coluna ficava com ~85px e
     "Torre dos Treinadores" quebrava em três linhas ("Treinad/ores"). Em 2x2 a largura dobra,
     o rótulo cabe em duas linhas confortáveis, e a altura de cada card pode ser menor.
     A grade também escala melhor: um 5º modo vira uma terceira linha, sem espremer nada. */
  .home-modes-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:4px 0 14px;
  }
  /* ocupa as DUAS colunas da grade -- o Boss de Domingo é um evento, e só aparece um dia por
     semana; dividir espaço com outro botão o faria passar despercebido justamente no dia dele */
  .home-modes-row .home-btn-largo{ grid-column:1 / -1; }
  .home-modes-row .leagues-big-btn{
    min-width:0;
    margin:0;
    min-height:76px;
    padding:9px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    white-space:normal;
    word-break:break-word;
    line-height:1.5;
    font-size:.55rem;
  }
  .home-mode-icon{font-size:1.3rem;line-height:1;}
  .league-type-card{
    display:block;
    width:100%;
    text-align:left;
  }
  .league-type-filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .tl-standings{display:flex;flex-direction:column;gap:4px;margin-top:8px;}
  .tl-standings-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:7px 10px;
    background:#fff;
    border:2px solid var(--box-border);
    border-radius:5px;
  }
  .tl-standings-first{background:#fff8e0;border-color:var(--yellow-dark);}
  .tl-standings-rank{font-family:var(--font-pixel);font-size:.6rem;flex-shrink:0;width:28px;}
  .tl-standings-name{flex:1;font-weight:700;}
  .tl-standings-record{font-size:.75rem;color:var(--muted);font-weight:700;flex-shrink:0;}
  .tl-match-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 4px;
    border-bottom:1px solid #e5e0d0;
    font-size:.85rem;
  }
  .tl-match-row:last-child{border-bottom:none;}
  .tl-match-mine{background:#eef4ff;border-radius:4px;}
  .tl-match-winner{font-weight:800;}
  .tl-match-loser{color:var(--muted);text-decoration:line-through;}
  .tl-match-vs{font-size:.7rem;color:var(--muted);flex-shrink:0;width:22px;text-align:center;}
  .tl-match-terrain{margin-left:auto;flex-shrink:0;}
  .tl-locked-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .tl-locked-row{
    background:#eef0f7;
    border:2px solid var(--box-border);
    border-radius:4px;
    padding:5px 10px;
    font-size:.8rem;
    font-weight:700;
  }
  .tl-champion-box{background:#fff8e0;border-color:var(--yellow-dark);}
  .tl-champion-name{font-size:1.3rem; font-weight:800; text-align:center; margin:10px 0; color:#7a5200;}
  .pool-origin-tag{
    display:inline-block;
    font-size:.62rem;
    font-weight:700;
    color:var(--muted);
    background:#f0ede0;
    padding:1px 6px;
    border-radius:8px;
    margin-left:4px;
  }
  .badge-icon{font-size:1.3rem;}

  .sprite-wrap{display:inline-block; vertical-align:middle; line-height:1;}
  .sprite-img{display:inline-block; vertical-align:middle; image-rendering:pixelated; image-rendering:crisp-edges;}
  .sprite-flip .sprite-img{transform:scaleX(-1);}
  .sprite-fallback{display:none; vertical-align:middle;}
  .sprite-sm .sprite-img{width:48px;height:48px;}
  .sprite-sm .sprite-fallback{font-size:1.9rem;}
  .sprite-md .sprite-img{width:64px;height:64px;}
  .sprite-md .sprite-fallback{font-size:2.4rem;}
  .sprite-lg .sprite-img{width:110px;height:110px;}
  .sprite-lg .sprite-fallback{font-size:3.6rem;}

  /* ============ INTRO POKÉBOLA (toca uma vez a cada carregamento da página) ============ */
  #boot{
    position:fixed; inset:0; z-index:9999;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:38px;
    background:linear-gradient(160deg, var(--bg), var(--bg2));
  }
  #boot.gone{display:none;}
  .intro-stage{
    width:240px; height:240px;
    position:relative;
    filter:drop-shadow(0 18px 22px rgba(0,0,0,.55));
  }
  .intro-ball{ position:absolute; inset:0; transform-origin:50% 88%; }
  .intro-half{
    position:absolute; left:0; width:240px; height:120px;
    transition:transform .55s cubic-bezier(.34,1.3,.5,1);
  }
  .intro-half.top{
    top:0; border-radius:120px 120px 0 0;
    background:
      radial-gradient(circle at 34% 118%, rgba(255,255,255,.42) 0 18%, transparent 45%),
      radial-gradient(circle at 30% 30%, #ff6a5b 0 30%, transparent 62%),
      linear-gradient(180deg, #e8402f 0%, var(--red) 62%, #a81f12 100%);
    border-bottom:9px solid var(--box-border);
    transform:translateY(-70vh);
  }
  .intro-half.bottom{
    bottom:0; border-radius:0 0 120px 120px;
    background:
      radial-gradient(circle at 32% -14%, rgba(255,255,255,.85) 0 20%, transparent 50%),
      linear-gradient(180deg, #ffffff 0%, #e9e4d2 55%, #b9b2a0 100%);
    border-top:9px solid var(--box-border);
    transform:translateY(70vh);
  }
  .intro-stage.closed .intro-half.top{transform:translateY(0);}
  .intro-stage.closed .intro-half.bottom{transform:translateY(0);}
  @keyframes introClunk{
    0%{transform:scale(1,1);} 30%{transform:scale(1.06,.92);} 60%{transform:scale(.97,1.04);} 100%{transform:scale(1,1);}
  }
  .intro-ball.clunk{animation:introClunk .35s ease-out;}
  @keyframes introWobble{
    0%,100%{transform:rotate(0);} 20%{transform:rotate(-14deg);} 45%{transform:rotate(11deg);} 70%{transform:rotate(-5deg);}
  }
  .intro-ball.wobble{animation:introWobble .8s ease-in-out;}
  .intro-button{
    position:absolute; top:50%; left:50%;
    width:62px; height:62px;
    transform:translate(-50%,-50%) scale(0);
    background:var(--box-border);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
    z-index:3;
  }
  .intro-stage.closed .intro-button{transform:translate(-50%,-50%) scale(1);}
  .intro-button::before{
    content:''; position:absolute;
    width:44px; height:44px; border-radius:50%;
    background:#f4f1e4; border:4px solid #cfc9b4;
  }
  .intro-core{
    position:relative; z-index:2;
    width:22px; height:22px; border-radius:50%;
    background:#d8d3c0;
    transition:background .15s;
  }
  .intro-core.lit{
    background:radial-gradient(circle at 38% 34%, #ffd9d3 0 22%, #ff5040 45%, var(--red) 100%);
    box-shadow:0 0 10px 4px rgba(255,70,50,.95), 0 0 34px 14px rgba(255,60,40,.55), 0 0 70px 30px rgba(255,50,30,.22);
  }
  @keyframes introCorePulse{
    0%,100%{box-shadow:0 0 10px 4px rgba(255,70,50,.95),0 0 34px 14px rgba(255,60,40,.55),0 0 70px 30px rgba(255,50,30,.22);}
    50%{box-shadow:0 0 6px 2px rgba(255,70,50,.55),0 0 18px 7px rgba(255,60,40,.3),0 0 36px 14px rgba(255,50,30,.12);}
  }
  .intro-core.lit.pulse{animation:introCorePulse 1s ease-in-out infinite;}
  .intro-core.burst{
    background:#fffdf2;
    box-shadow:0 0 16px 8px rgba(255,255,240,.95), 0 0 60px 30px rgba(255,240,180,.6), 0 0 120px 60px rgba(255,220,120,.3);
  }
  .intro-star{
    position:absolute; top:50%; left:50%;
    font-size:1.6rem; z-index:5; pointer-events:none;
    animation:introFly .9s ease-out forwards;
  }
  @keyframes introFly{
    0%{transform:translate(-50%,-50%) scale(.4) rotate(0); opacity:1;}
    100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.25) rotate(var(--rot)); opacity:0;}
  }
  #introFlash{
    position:fixed; inset:0; z-index:10000;
    background:#fffdf2; opacity:0; pointer-events:none;
  }
  #introFlash.go{animation:introFlashout 1s ease-out forwards;}
  @keyframes introFlashout{0%{opacity:0;} 18%{opacity:1;} 100%{opacity:0;}}
  .intro-load-ui{
    display:flex; flex-direction:column; align-items:center; gap:16px;
    opacity:0; transform:translateY(8px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .intro-load-ui.show{opacity:1; transform:translateY(0);}
  .intro-load-label{
    font-family:var(--font-pixel);
    font-size:.62rem; color:#e8ebff; letter-spacing:1px;
  }
  .intro-load-label .dots::after{
    content:''; animation:introDots 1.2s steps(4) infinite;
  }
  @keyframes introDots{
    0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} 100%{content:'';}
  }
  .intro-hpbar{
    width:230px; padding:5px;
    background:var(--box);
    border:3px solid var(--box-border);
    border-radius:4px;
    box-shadow:4px 4px 0 rgba(0,0,0,.45);
  }
  .intro-hpbar .track{ height:12px; background:#ddd7c2; border-radius:2px; overflow:hidden; }
  .intro-hpbar .fill{
    height:100%; width:0%;
    background:linear-gradient(180deg,#5dd07a,var(--green));
    transition:width .25s linear;
  }
  #version-banner{
    display:none;
    position:fixed; left:0; right:0; top:0; z-index:9998;
    align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
    background:var(--blue-dark); color:#fff;
    padding:10px 14px;
    font-family:var(--font-ui); font-weight:800; font-size:.8rem;
    box-shadow:0 2px 0 rgba(0,0,0,.3);
  }
  #version-banner button{
    background:#fff; color:var(--blue-dark); border:none; border-radius:6px;
    padding:6px 12px; font-weight:800; cursor:pointer; font-size:.75rem;
    font-family:var(--font-ui);
  }
  @media (prefers-reduced-motion: reduce){
    .intro-half, .intro-button{transition-duration:.01s;}
    .intro-ball.clunk, .intro-ball.wobble, .intro-core.lit.pulse, .intro-star{animation:none !important;}
  }

  /* utilitários (SEMPRE por último no CSS -- precisam vencer as classes de componente) -- substituem os inline styles repetidos que a auditoria achou espalhados nos renders */
  .u-center{text-align:center;}
  .u-left{text-align:left;}
  .u-auto-h{min-height:auto;}
  .u-m0{margin:0;}
  .u-mt8{margin:8px 0 0;}
  .u-mb2{margin:0 0 2px;}
</style>

// pra cada espécie que É uma evolução (ex: 'dugtrio'), o nível mínimo em que ela existe de verdade --
// ninguém evolui pra Dugtrio antes do nível 26, então nenhum Dugtrio selvagem deveria aparecer abaixo
// disso. Calculado uma vez a partir de EVOLUTIONS em vez de percorrer o objeto toda hora
const EVOLVED_MIN_LEVEL = {};
Object.values(EVOLUTIONS).forEach(e=>{ EVOLVED_MIN_LEVEL[e.into] = e.level; });
// mapa reverso pronto: pra cada espécie EVOLUÍDA, quem evolui pra ela (o passo imediatamente anterior)
const PRE_EVOLUTION_OF = {};
Object.keys(EVOLUTIONS).forEach(fromId=>{ PRE_EVOLUTION_OF[EVOLUTIONS[fromId].into] = fromId; });
// toda a cadeia de pré-evolução de uma espécie (ela mesma + tudo que vem antes) -- usado pro Pokédex
// shiny: se o jogador capturou um Poliwhirl shiny e evoluiu pra Poliwrath, o Poliwhirl (e o Poliwag,
// antes dele) TAMBÉM foram shiny em algum momento, então contam como capturados nesse registro
function shinyChainSpeciesIds(speciesId){
  const chain = [speciesId];
  let current = speciesId;
  let guard = 0;
  while(PRE_EVOLUTION_OF[current] && guard++ < 10){
    current = PRE_EVOLUTION_OF[current];
    chain.push(current);
  }
  return chain;
}
// sorteia o nível de um pokémon selvagem respeitando esse mínimo -- preserva o "espalhamento" (a
// diferença entre max e min) do trecho, só desloca a faixa inteira pra cima quando precisa
function rollWildLevel(speciesId, minLevel, maxLevel){
  const floor = EVOLVED_MIN_LEVEL[speciesId];
  if(!floor || floor <= minLevel) return randomInt(minLevel, maxLevel);
  const spread = maxLevel - minLevel;
  /* O deslocamento pra cima não pode passar do nível em que ela PRÓPRIA evolui, senão o piso
     empurrava o bicho pra fora da própria janela: um Metapod (que existe do 7 ao 9) num trecho de
     3-6 saía com nível até 10 -- e aí, pela regra de coerência abaixo, viraria Butterfree na hora,
     apagando o Metapod do jogo. */
  const teto = EVOLUTIONS[speciesId] ? EVOLUTIONS[speciesId].level - 1 : Infinity;
  return randomInt(floor, Math.max(floor, Math.min(floor + spread, teto)));
}
/* A ESPÉCIE TEM QUE BATER COM O NÍVEL. Um Caterpie nível 17 não existe: aos 7 ele virou Metapod e
   aos 10, Butterfree. O encontro sorteia a espécie do pool e o nível do TRECHO, e os dois podiam
   discordar -- foi reportado com um Caterpie Lv.17 e um Weedle Lv.13 na mesma tela.
   É a MESMA regra do tryEvolve, inclusive parando nos pontos de bifurcação (Gloom, Poliwhirl,
   Slowpoke): quem escolhe entre Vileplume e Bellossom é o jogador, e escolher por ele aqui seria
   tirar a escolha ANTES mesmo da captura. Ele decide no primeiro nível que subir depois de pegar. */
function especieNoNivel(id, nivel){
  let cur = id, guarda = 0;
  while(EVOLUTIONS[cur] && nivel >= EVOLUTIONS[cur].level && guarda++ < 10){
    if(EVOLUTION_CHOICES[cur]) break;
    cur = EVOLUTIONS[cur].into;
  }
  return cur;
}

/* ============================================================================
   O CAMINHO ESCOLHIDO -- Kanto ou Johto, etapa por etapa

   `game.gymPath` guarda a região escolhida em CADA uma das 8 etapas: ['kanto','johto',...].
   É estado de JOGO, não de exibição: o ginásio enfrentado, a insígnia ganha e as rotas oferecidas
   saem daí. Save antigo não tem o campo -- `regiaoDaEtapa` devolve 'kanto' nesse caso, e a jornada
   dele continua exatamente como era.
   ============================================================================ */
const REGIOES = ['kanto','johto'];
/* A etapa já teve o caminho escolhido? Enquanto NÃO teve, nada na tela pode nomear o líder, a
   cidade ou o traço daquele trecho -- senão o jogo promete o Brock antes de o jogador escolher
   entre ele e o Falkner, e a escolha vira encenação. `regiaoDaEtapa` devolve 'kanto' como padrão
   (o que mantém save antigo funcionando), então é preciso perguntar ANTES de exibir. */
function etapaEscolhida(legIndex){ return !!(game.gymPath || [])[legIndex]; }
function regiaoDaEtapa(legIndex){
  const p = (game.gymPath || [])[legIndex];
  return p === 'johto' ? 'johto' : 'kanto';   // padrão e fallback de save antigo
}
function gymOf(legIndex){
  const lista = regiaoDaEtapa(legIndex) === 'johto' ? JOHTO_GYMS : KANTO_GYMS;
  return lista[legIndex] || lista[lista.length-1];
}
function gymAtual(){ return gymOf(game.gymIndex); }
/* Os 16 líderes. Serve pra procurar por insígnia: o save guarda o NOME da insígnia ganha, e ela
   pode ser de qualquer uma das duas regiões. */
function todosOsGinasios(){ return KANTO_GYMS.concat(JOHTO_GYMS); }
/* Funcao, e nao const: estes ajudantes ficam ANTES das tabelas de ginasio no arquivo, e um
   const avaliado na carga cairia na zona morta do KANTO_GYMS. Dentro de funcao, so roda depois. */
function numGinasios(){ return KANTO_GYMS.length; }
/* Os dois ginásios em disputa numa etapa -- é o que a tela de escolha mostra. */
function opcoesDeGinasio(legIndex){
  return [ { regiao:'kanto', gym: KANTO_GYMS[legIndex] },
           { regiao:'johto', gym: JOHTO_GYMS[legIndex] } ];
}
function routesForLeg(legIndex){
  const mapa = regiaoDaEtapa(legIndex) === 'johto' ? JOHTO_ROUTE_MAP : ROUTE_MAP;
  return mapa[legIndex] || mapa[mapa.length-1];
}
function routeById(routeId){
  for(const pair of ROUTE_MAP){ const found = pair.find(r=>r.id===routeId); if(found) return found; }
  for(const pair of JOHTO_ROUTE_MAP){ const found = pair.find(r=>r.id===routeId); if(found) return found; }
  return null;
}

/* O rival padrão mora na CONTA (users/{uid}.rivalNameDefault) e é ele que preenche a tela de nome
   do rival. Quem joga várias jornadas costuma manter o mesmo rival, e digitar o mesmo nome toda vez
   era pedágio. Trocar na tela troca o padrão -- não existe outro lugar pra editar, de propósito: o
   lugar natural de mexer no nome do rival é a tela que pergunta o nome do rival. */
function nomeDoRivalPadrao(){
  const daConta = (game.rivalNameDefault || '').trim();
  if(daConta) return daConta;
  /* Conta anterior ao padrão: em vez de oferecer 'Rafael' pra quem já tem rival há três jornadas,
     aproveita o nome que já está num save. Save não tem carimbo de tempo, então é o primeiro slot
     que tiver um -- e vira padrão de verdade quando a pessoa confirmar. */
  const doSave = (game.saveSlots || []).map(s => s && s.rivalName).find(n => n && n.trim());
  return (doSave || '').trim() || RIVAL_NAME_DEFAULT;
}

const SHINY_CHANCE = 1/128;
// nível do Mewtwo EMPRESTADO (o que entra no time por 24h) -- diferente do Lv.99 do desafio.
// Precisa bater com o MEWTWO_LOAN_LEVEL do index.js: o servidor é quem grava o Mewtwo no time salvo,
// o cliente usa esse valor pro código de time das ligas e pros textos da interface
const MEWTWO_LOAN_LEVEL = 70;
const SHINY_CHANCE_BONUS = 0.05; // 5% -- chance BASE do bônus (1º encontro depois de ativar, ou logo após capturar 1)
const SHINY_PITY_STEP = 0.10; // +10 pontos percentuais por encontro sem capturar nenhum shiny, enquanto o bônus durar
// enquanto o bônus estiver ativo, a chance por pokémon sobe a cada encontro selvagem sem sucesso --
// começa em 5%, sobe 10 pontos por encontro, até virar 100% garantido (chega lá por volta do 10º
// encontro seguido sem capturar nada).
//
// A escalada é um seguro contra azar, NÃO uma fábrica de shinies: ela existe pra quem ativou o bônus
// não terminar a hora de mãos vazias. Por isso ela vale UMA VEZ POR SAVE -- assim que a jornada
// consegue o primeiro shiny, o objetivo foi cumprido e a chance trava na base (5%) até o fim daquele
// save, mesmo que sobre tempo de bônus. Sem isso, uma hora de bônus rendia shiny atrás de shiny.
function currentShinyChance(){
  // no modo difícil a chance base é 4x maior: é a recompensa por jogar assim
  const base = isHardMode() ? HARD_SHINY_CHANCE : SHINY_CHANCE;
  if(!(game.shinyBonusExpiresAt && Date.now() < game.shinyBonusExpiresAt)) return base;
  if(game.shinyFoundThisSave) return SHINY_CHANCE_BONUS; // já teve o seu: fica na base, sem escalar
  return Math.min(1, SHINY_CHANCE_BONUS + (game.shinyPityCount||0) * SHINY_PITY_STEP);
}

function hexToRgba(hex, alpha){
  const clean = hex.replace('#','');
  const r = parseInt(clean.substring(0,2),16);
  const g = parseInt(clean.substring(2,4),16);
  const b = parseInt(clean.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function terrainBattleBgStyle(terrain){
  if(!terrain) return '';
  const color = terrainColor(terrain);
  // degradê suave, começando com a cor do terreno no topo do card e se dissolvendo no creme padrão --
  // dá uma ambientação visual sem prejudicar a leitura do conteúdo
  return `background: linear-gradient(180deg, ${hexToRgba(color,0.28)} 0%, ${hexToRgba(color,0.09)} 45%, transparent 75%), var(--box);`;
}
function terrainColor(terrain){
  return TYPE_COLORS[terrain.types[0]] || '#666';
}
function pickTerrain(rng, allowedIds){
  const pool = (allowedIds && allowedIds.length>0) ? TERRAINS.filter(t=>allowedIds.includes(t.id)) : TERRAINS;
  const usable = pool.length>0 ? pool : TERRAINS;
  return usable[Math.floor(rng()*usable.length)];
}
function applyTerrainBuff(team, terrain){
  // só marca a flag -- NÃO muta baseHp/attack/defense diretamente. Isso precisa ser seguro tanto pra
  // times temporários (Liga, descartados depois da partida) quanto pro game.team PERSISTENTE (ginásios) --
  // se mutasse os atributos de verdade aqui, o bônus se acumularia a cada ginásio que usasse esse terreno
  team.forEach(p=>{
    p.terrainBuffed = p.types.some(t=>terrain.types.includes(t));
  });
}

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function randomInt(min, max){
  return min + Math.floor(Math.random()*(max-min+1));
}

function preloadBattleSprites(matchups){
  // assim que o resultado de uma batalha é calculado, já sabemos TODAS as espécies que vão aparecer --
  // pré-carrega os sprites delas em segundo plano, pra evitar o "flash" de imagem quebrada que aparece
  // em conexões/dispositivos mais lentos quando o navegador só começa a buscar a imagem na hora exata
  // que ela precisa aparecer
  const urls = new Set();
  matchups.forEach(m=>{
    const playerSp = especieParaTela(m.playerSpecies);
    const enemySp = especieParaTela(m.enemySpecies);
    if(playerSp){
      urls.add(`https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/${m.playerShiny?'shiny/':''}${playerSp.dex}.png`);
    }
    if(enemySp){
      urls.add(`https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/${m.enemyShiny?'shiny/':''}${enemySp.dex}.png`);
    }
  });
  urls.forEach((url, i) => {
    setTimeout(() => { const img = new Image(); img.src = url; }, i * 250);
  });
}
function handleSpriteLoadError(img){
  // falhas de carregamento de sprite podem ser passageiras (rede lenta) OU específicas de um domínio
  // (ex: algum bloqueador de anúncios ou filtro de operadora barrando especificamente o CDN principal) --
  // tenta de novo no mesmo domínio, e se continuar falhando, troca pro domínio alternativo (confirmado
  // que serve as mesmas imagens) antes de desistir e mostrar o emoji de reserva
  const attempt = parseInt(img.dataset.retryAttempt || '0', 10);
  const usingFallbackDomain = img.dataset.usingFallback === '1';
  if(attempt >= 2 && !usingFallbackDomain && img.dataset.fallbackSrc){
    // esgotou as tentativas no domínio principal -- troca pro domínio alternativo
    img.dataset.usingFallback = '1';
    img.dataset.retryAttempt = '0';
    img.src = img.dataset.fallbackSrc;
    return;
  }
  if(attempt >= 2){
    img.style.display = 'none';
    if(img.nextElementSibling){ img.nextElementSibling.style.display = 'inline'; }
    return;
  }
  img.dataset.retryAttempt = String(attempt + 1);
  const baseSrc = usingFallbackDomain ? img.dataset.fallbackSrc : img.src.split('?')[0];
  const delays = [500, 1200];
  setTimeout(() => { img.src = baseSrc + '?retry=' + (attempt + 1); }, delays[attempt]);
}
function spriteHtml(speciesId, sizeClass, isShiny, flip){
  const sp = especieParaTela(speciesId);   // inclui quem luta sem estar na Pokédex (ver SPECIES_FORA_DA_DEX)
  if(!sp) return '';
  return spriteMarkupByDex(sp.dex, sp.name, sp.emoji, sizeClass, isShiny, flip);
}
function spriteMarkupByDex(dex, name, fallbackEmoji, sizeClass, isShiny, flip){
  const cls = (sizeClass || 'sprite-md') + (flip ? ' sprite-flip' : '');
  const shinyPath = isShiny ? 'shiny/' : '';
  const url = `https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/${shinyPath}${dex}.png`;
  const fallbackUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${shinyPath}${dex}.png`;
  return `<span class="sprite-wrap ${cls}"><img src="${url}" data-fallback-src="${fallbackUrl}" class="sprite-img" alt="${name}" onerror="handleSpriteLoadError(this)"><span class="sprite-fallback">${fallbackEmoji||'❔'}</span></span>`;
}
// dados só de EXIBIÇÃO pro disfarce do Ditto (pegadinha do Mew/Mewtwo) -- de propósito NÃO entram em
// SPECIES, porque tudo que está em SPECIES conta pro total da Pokédex (150) e pro "capturou tudo" que
// libera o desafio do Mewtwo de verdade. Um Mew que nunca é realmente capturado (sempre vira Ditto)
// não pode contar pra isso, senão a Pokédex mostraria uma vaga #151 impossível de completar
const DISGUISE_DISPLAY = {
  mew: { dex:151, name:'Mew', types:['Psychic'], emoji:'✨' },
  mewtwo: { dex:150, name:'Mewtwo', types:['Psychic'], emoji:'🧬' }
};
/* Espécies que EXISTEM em batalha mas NÃO entram no SPECIES -- pela mesma razão do
   DISGUISE_DISPLAY acima: tudo que está no SPECIES conta pro total da Pokédex e pro "capturou
   tudo" que libera o Mewtwo. O Mew do Boss de Domingo nunca é capturado, então não pode abrir
   uma vaga #151 impossível de completar. Só o que a TELA precisa -- os atributos dele vivem no
   servidor, que é quem calcula a luta. */
const SPECIES_FORA_DA_DEX = {
  mew: { dex:151, name:'Mew', types:['Psychic'], emoji:'✨' }
};
function especieParaTela(id){ return SPECIES[id] || SPECIES_FORA_DA_DEX[id] || null; }
function battleSpriteHtml(ownSpeciesId, opponentSpeciesId, sizeClass, isShiny, flip){
  // Ditto usa Transformar: na tela de batalha mostra o sprite do adversário, mas o nome continua "Ditto"
  const displaySpecies = (ownSpeciesId === 'ditto' && opponentSpeciesId && SPECIES[opponentSpeciesId]) ? opponentSpeciesId : ownSpeciesId;
  return spriteHtml(displaySpecies, sizeClass, isShiny, flip);
}

let nextInstanceId = 1;
/* Completa um pokémon do save com os campos derivados da espécie (types, name, atributos).
   Existe porque nem toda entrada de time é criada pelo createInstance: o Mewtwo do EMPRÉSTIMO é
   gravado pelo servidor com só {speciesId, level, shiny}, e qualquer tela que lesse p.types
   quebrava com "Cannot read properties of undefined (reading 'map')" -- foi o que acontecia ao
   abrir o resumo da jornada de um time com Mewtwo emprestado.
   Corrigir aqui, no carregamento, resolve TODAS as telas de uma vez, em vez de proteger cada
   `p.types` espalhado pelo arquivo. */
function hydrateTeamMember(p){
  if(!p || !p.speciesId) return p;
  const sp = SPECIES[p.speciesId];
  if(!sp) return p;
  if(!p.id) p.id = 'mon'+(nextInstanceId++);
  if(!p.name) p.name = sp.name;
  if(!Array.isArray(p.types)) p.types = sp.types;
  if(typeof p.baseHp !== 'number') p.baseHp = sp.hp;
  if(typeof p.attack !== 'number') p.attack = sp.attack;
  if(typeof p.defense !== 'number') p.defense = sp.defense;
  if(typeof p.spAtk !== 'number') p.spAtk = sp.spAtk;   // split do Especial (Gen 2): instancia velha nao tem
  if(typeof p.spDef !== 'number') p.spDef = sp.spDef;
  if(typeof p.speed !== 'number') p.speed = sp.speed;
  if(typeof p.maxHp !== 'number') p.maxHp = 0;
  if(typeof p.hp !== 'number') p.hp = 0;
  return p;
}
function hydrateTeam(team){ return (team||[]).map(hydrateTeamMember); }

// Antes disso houve um período de teste A/B em que só contas com userTest=true no Firestore usavam

//
// O servidor (functions/index.js) usa A MESMA fórmula e OS MESMOS buffs -- alinhado e verificado:
// 20 mil batalhas com times, seeds e terrenos idênticos deram 0 divergências, maxHp incluído.
// Se mexer em qualquer coisa daqui pra baixo, mexa lá também e rode a comparação de novo. Já houve
// um período em que os dois discordavam, e a mesma partida dava vencedor diferente em 12,6% dos casos.
//

const SHINY_BUFF_MULT = 1.20;     // +20% em TODOS os atributos (TERRAIN_BUFF_MULT = 1.15 fica lá em cima, junto de TERRAINS)
// Shiny e terreno valem em TUDO -- ataque, especial, defesa, velocidade e HP -- e MULTIPLICAM entre
// si: um shiny no terreno do tipo dele fica 1.20 x 1.15 = 1.38x em todos os atributos.
// Houve uma fase em que esses buffs foram só ofensivos (shiny 1.15, terreno 1.10). As constantes
// SHINY_BUFF_LEGACY/TERRAIN_BUFF_LEGACY daquela fase sumiram junto com os ifs de motor que as usavam,
// porque os valores de agora são exatamente os de antes dela -- manter as duas cópias só criaria de
// novo a chance de uma delas ficar pra trás, que foi o que aconteceu no servidor.
// diferente do buff de terreno (que muta os atributos de uma cópia temporária, descartada depois da
// batalha), o brilho é uma característica PERMANENTE do pokémon salvo -- se mutássemos baseHp/attack/
// defense diretamente, o bônus se acumularia toda vez que esse mesmo pokémon batalhasse de novo. Por
// isso aqui o bônus é calculado só na hora de USAR o valor, nunca gravado de volta na instância
// pra todas as 4 funções abaixo: saves bem antigos (ou dados corrompidos) podem estar sem o campo do
// stat -- sem essa rede de segurança, um stat ausente vira NaN, que se propaga pro cálculo de dano e
// pode travar a batalha num loop infinito (NaN nunca é > nem <= 0 em nenhuma comparação, então a
// detecção de "desmaiou" nunca dispara e a batalha nunca termina). Cai pro stat base da espécie,
// mesmo padrão já usado pela migração de velocidade logo abaixo
/* ---- ESPECIALIDADE DE TIPO ----------------------------------------------------------------
   Treinador que já levou SPECIALTY_THRESHOLD pokémon de um tipo ao nível SPECIALTY_LEVEL vira
   especialista nesse tipo, e todos os pokémon dele desse tipo ganham SPECIALTY_BUFF em TODOS os
   atributos. Vale em tudo: jornada, ligas e Ginásio da Cidade.

   NÃO acumula em tipo duplo -- um Charizard (Fogo/Voador) de quem é especialista nos dois ganha 1%,
   não 2%. Por isso o buff é um BOOLEANO na instância (specialtyBuffed), nunca um multiplicador que
   se soma: assim é impossível aplicar duas vezes, mesmo chamando a função repetido.

   Diferente do shiny e do terreno, este bônus vale nos DOIS motores e em todos os atributos --
   por isso é aplicado no fim de cada effective*, fora dos ifs de motor.

   Os três valores precisam bater com os do index.js (o servidor calcula as ligas com eles). */
const SPECIALTY_LEVEL = 65;
const SPECIALTY_THRESHOLD = 50;
const SPECIALTY_BUFF = 1.01;
// marca quais pokémon do time recebem o bônus. Chamada antes de cada batalha local, com as
// especialidades da conta -- a marca é descartada junto com a instância no fim da batalha
function applySpecialtyBuff(team, specialties){
  const set = new Set(specialties || game.specialties || []);
  for(const p of (team||[])){
    if(!p) continue;
    const tipos = p.types || (SPECIES[p.speciesId] && SPECIES[p.speciesId].types) || [];
    p.specialtyBuffed = set.size>0 && tipos.some(t=>set.has(t));
  }
}
function withSpecialty(v, p){ return p.specialtyBuffed ? Math.round(v * SPECIALTY_BUFF) : v; }
/* Shiny e terreno entram em TODOS os atributos, um depois do outro. Existirem num lugar só é o
   ponto: as cinco funções abaixo já estiveram fora de sincronia entre si e com o servidor, e era
   dali que vinha o bug de a mesma partida, com a mesma seed, dar vencedor diferente nos dois lados.
   Mudou aqui, mudou nos cinco atributos -- e o mesmo bloco precisa ir pro functions/index.js.

   O arredondamento é por buff, na ordem shiny -> terreno. Os dois arquivos têm que arredondar na
   MESMA ordem, senão voltam a divergir por 1 ponto de atributo em alguns pokémon. */
function withBuffs(v, p){
  if(p.shiny){ v = Math.round(v * SHINY_BUFF_MULT); }
  if(p.terrainBuffed){ v = Math.round(v * TERRAIN_BUFF_MULT); }
  return v;
}
function effectiveBaseHp(p){
  const v = (typeof p.baseHp === 'number') ? p.baseHp : ((SPECIES[p.speciesId] && SPECIES[p.speciesId].hp) || 50);
  return withSpecialty(withBuffs(v, p), p);
}
function effectiveAttack(p){
  const v = (typeof p.attack === 'number') ? p.attack : ((SPECIES[p.speciesId] && SPECIES[p.speciesId].attack) || 50);
  return withSpecialty(withBuffs(v, p), p);
}
function effectiveDefense(p){
  const v = (typeof p.defense === 'number') ? p.defense : ((SPECIES[p.speciesId] && SPECIES[p.speciesId].defense) || 50);
  return withSpecialty(withBuffs(v, p), p);
}
/* Sp.Atk e Sp.Def, oficiais da Gen 2. Instancia gravada ANTES do split nao tem os campos -- cai no
   valor da especie, mesma migracao ja usada pela velocidade. O 50 no fim so pega instancia de
   especie desconhecida; nenhuma das especies da tabela chega la.
   Existiu aqui um terceiro degrau, o campo `special` da Gen 1 (um numero so pra ataque E defesa
   especial). Saiu junto com o campo: o jogo nao usa mais nada da Gen 1 em atributo. */
function effectiveSpAtk(p){
  const sp = SPECIES[p.speciesId];
  const v = (typeof p.spAtk === 'number') ? p.spAtk
          : (sp && typeof sp.spAtk === 'number') ? sp.spAtk : 50;
  return withSpecialty(withBuffs(v, p), p);
}
function effectiveSpDef(p){
  const sp = SPECIES[p.speciesId];
  const v = (typeof p.spDef === 'number') ? p.spDef
          : (sp && typeof sp.spDef === 'number') ? sp.spDef : 50;
  return withSpecialty(withBuffs(v, p), p);
}
function effectiveSpeed(p){
  // instâncias salvas ANTES da velocidade existir não têm o campo -- cai pro valor da espécie.
  // A velocidade buffada entra também na chance de crítico (rng < speed/512, regra da Gen 1):
  // quem está no terreno do tipo dele critica mais, além de bater mais forte
  const v = (typeof p.speed === 'number') ? p.speed : ((SPECIES[p.speciesId] && SPECIES[p.speciesId].speed) || 50);
  return withSpecialty(withBuffs(v, p), p);
}
function calcMaxHp(p){
  // A ESCALA de HP é a clássica do jogo nos DOIS motores (Arcanine 67 = 455, como sempre foi) -- no
  // motor novo, o balanceamento Gen 1 é preservado porque o dano é calculado como FRAÇÃO da vida
  // (na matemática Gen 1) e aplicado sobre essa escala. Diferença que permanece: no motor novo,
  // buffs de shiny/terreno NÃO inflam o HP (effectiveBaseHp já cuida disso) -- parte do rebalanceamento
  return Math.round(30 + p.level*5 + effectiveBaseHp(p));
}
// HP na escala Gen 1 -- usado SÓ internamente pelo motor novo, pra converter o dano em fração da vida
function gen1MaxHp(p){ return Math.floor(2 * effectiveBaseHp(p) * p.level / 100) + p.level + 10; }

async function migrateLeagueLeaderboardName(oldName, newName, uid){
  // quando o treinador troca de nome, o ranking global de campeões (indexado pelo NOME, não pelo uid)
  // precisa "seguir" o jogador pro nome novo -- senão as vitórias antigas ficam presas no nome antigo
  if(!oldName || !newName || oldName === newName) return;
  try{
    /* Antes esta função decidia QUAIS rankings limpar olhando o leaguePlacements da conta, e ficava
       só nos tipos em que a pessoa aparecia como 'Campeão'. Isso deixava o nome antigo preso em dois
       casos, e os dois aconteceram de verdade:
         1. A TRAINERS LEAGUE nunca grava leaguePlacements. Ela registra o campeão direto no ranking
            (recordLeagueChampionWin) e pula o recordLeaguePlacement -- então, pra essa função, quem
            só venceu Trainers League nunca tinha sido campeão de nada.
         2. O histórico guarda no máximo 12 colocações. Título mais antigo que isso já saiu da lista.
       A correção é não confiar no histórico: varre TODOS os documentos champions_alltime_* e migra
       onde o nome antigo realmente aparece. É a única fonte que não mente sobre isso, porque é a
       própria que está sendo corrigida. */
    const rankingsSnap = await db.collection('leagues').get();
    const docsDeRanking = rankingsSnap.docs.filter(d => d.id.startsWith('champions_alltime_'));
    for(const docRanking of docsDeRanking){
      const ref = docRanking.ref;
      const dados = docRanking.data() || {};
      const wins = dados.wins || {};
      const oldCount = wins[oldName] || 0;
      if(oldCount <= 0) continue;   // esse ranking não tem o nome antigo, nada a fazer
      const newCount = (wins[newName] || 0) + oldCount;
      const payload = {
        wins: {
          [oldName]: firebase.firestore.FieldValue.delete(),
          [newName]: newCount
        }
      };
      // eliteNames também é indexado por nome -- sem migrar, o 🏆 de campeão da Elite 4 ficava
      // no nome antigo e sumia do ranking
      if(dados.eliteNames && dados.eliteNames[oldName]){
        payload.eliteNames = {
          [oldName]: firebase.firestore.FieldValue.delete(),
          [newName]: true
        };
      }
      await ref.set(payload, { merge: true });
    }
  } catch(e){ console.error('Erro ao migrar nome no ranking da Liga:', e); }
}

/* =====================================================================
   GINÁSIO DA CIDADE -- geolocalização e distância ficam aqui no cliente
   (grátis, sem limite); só a TRANSFORMAÇÃO coordenada->cidade passa pelo
   servidor (que fala com o Nominatim), e só quando a pessoa realmente se moveu
   ===================================================================== */
const NEIGHBORHOOD_GYM_RECHECK_METERS = 500; // só rechama a geocodificação se andou mais que isso
// fórmula de Haversine -- distância em metros entre duas coordenadas geográficas
function haversineDistanceMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.asin(Math.sqrt(a));
}
function getBrowserGeolocation(){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation){ reject(new Error('sem-suporte')); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
      err => reject(err),
      { timeout: 10000, maximumAge: 60000 }
    );
  });
}

// Nem toda notificação é só um aviso: algumas são a PORTA de acesso a um item que ainda não foi
// resgatado (o bônus shiny do campeão, o empréstimo do Mewtwo). Apagar uma dessas por engano faz a
// pessoa perder o item -- e no caso do bônus shiny não existe outra porta, ele vive só aqui. Por isso
// essas pedem confirmação; as outras continuam apagando na hora, sem atrito.
// Devolve null se for só um aviso, ou {titulo, aviso} descrevendo o que se perde se apagar.
function notificationPendingReward(n){
  if(!n) return null;
  if(n.type==='league_champion' && !(n.meta && n.meta.activated)){
    return {
      titulo:'Bônus Shiny ainda não ativado',
      aviso:'Essa é a <strong>única</strong> forma de ativar a sua hora de chance aumentada de shiny. Se apagar, o bônus é perdido pra sempre.'
    };
  }
  if(n.type==='mewtwo_loan_unlocked'){
    // vale nos 3 estados (livre, emprestado agora, em cooldown): o cooldown passa e essa notificação
    // volta a ser útil. O acesso pela célula do Mewtwo na Pokédex existe, então aqui o aviso é mais
    // brando que o do bônus shiny -- mas ainda merece a pergunta
    return {
      titulo:'Empréstimo do Mewtwo',
      aviso:'Você ainda pode chamar o Mewtwo pela célula dele na <strong>Pokédex</strong>, então não perde o direito -- mas perde este atalho.'
    };
  }
  return null;
}

// apaga otimista: some da tela na hora (bem mais leve que apagar um save ou sair de uma liderança).
// Se a chamada ao servidor falhar, devolve pra lista e avisa, em vez de deixar a pessoa achando que
// apagou quando na verdade não apagou
async function performDeleteNotification(notificationId){
  const previousList = game.notificationsList;
  game.notificationsList = (game.notificationsList||[]).filter(n=>n.id!==notificationId);
  render();
  try{
    await functionsClient.httpsCallable('deleteNotification')({ notificationId });
  } catch(e){
    console.error('Erro ao apagar notificação:', e);
    game.notificationsList = previousList;
    game.notificationsActionError = (e && e.message) || 'Não foi possível apagar essa notificação agora.';
    render();
  }
}
// abre o modal com a info do empréstimo -- clicado a partir da célula do Mewtwo na Pokédex, uma vez
// já capturado e desbloqueado. Mostra sprite+nível sempre; o resto do conteúdo (botão de usar, tempo
// restante ativo, ou tempo restante de cooldown) depende do estado atual, calculado na hora de renderizar
function openMewtwoLoanInfoModal(){
  game.showMewtwoLoanInfoModal = true;
  render();
}
function closeMewtwoLoanInfoModal(){
  game.showMewtwoLoanInfoModal = false;
  render();
}
// escolhe em qual dos times o Mewtwo emprestado vai entrar por 24h -- carrega os saves antes de mostrar,
// pra ter certeza que a lista está atualizada (o cooldown/estado ativo pode ter mudado desde a home)
async function openMewtwoLoanTeamPicker(){
  game.showMewtwoLoanInfoModal = false; // fecha o modal ao seguir pro seletor de time
  game.screen = 'mewtwoLoanTeamPicker';
  game.mewtwoLoanError = null;
  render();
  await loadSaveSlots();
  if(game.screen==='mewtwoLoanTeamPicker'){ render(); }
}
// se o time escolhido já tem 6, precisa passar pelo seletor de quem banir antes; senão, ativa direto
function pickMewtwoLoanTeam(slot){
  const s = game.saveSlots[slot];
  if(!s || !s.team || s.team.length===0) return;
  if(s.team.length >= 6){
    game.mewtwoLoanBenchSlot = slot;
    game.screen = 'mewtwoLoanBenchPicker';
    render();
  } else {
    confirmMewtwoLoanActivation(slot, null);
  }
}
async function confirmMewtwoLoanActivation(slot, benchIndex){
  game.mewtwoLoanError = null;
  game.mewtwoLoanSubmitting = true;
  render();
  try{
    await functionsClient.httpsCallable('activateMewtwoLoan')({ slot, benchIndex });
    game.mewtwoLoanActive = true;
    game.mewtwoLoanReadyToClaim = false;
    game.mewtwoLoanSubmitting = false;
    game.mewtwoLoanBenchSlot = null;
    game.screen = 'saveSelect';
    await loadSaveSlots();
  } catch(e){
    console.error('Erro ao ativar empréstimo do Mewtwo:', e);
    game.mewtwoLoanSubmitting = false;
    game.mewtwoLoanError = (e && e.message) || 'Não foi possível colocar o Mewtwo no time agora.';
  }
  render();
}

// abre a tela normal do Ginásio da Cidade pra um ginásio ESPECÍFICO que o time já defende -- sem
// precisar de localização nenhuma. Defender um ginásio vale à distância; só CONQUISTAR um novo (virar
// líder pela primeira vez) exige estar presencialmente no bairro
function openNeighborhoodGymRemote(city, countryCode){
  game.screen = 'neighborhoodGym';
  game.neighborhoodGymScreenState = 'ready';
  game.neighborhoodGymError = null;
  // mesmo formato usado pela localização por GPS, só que sem lat/lon -- o resto da tela (mostrar
  // líder, trocar time/terreno, ranking) já funciona igual, não precisa saber COMO chegou até aqui.
  // "remote:true" só serve pra saber que não tem coordenada real por trás desse valor
  game.neighborhoodGymLocation = { city, countryCode, hasGym: true, remote: true };
  render();
  loadNeighborhoodGymDetail();
}
async function openNeighborhoodGymScreen(){
  game.screen = 'neighborhoodGym';
  game.neighborhoodGymScreenState = 'locating';
  game.neighborhoodGymError = null;
  game.neighborhoodGymDetail = null;
  render();
  try{
    const pos = await getBrowserGeolocation();
    const cached = game.neighborhoodGymLocation;
    const distance = cached ? haversineDistanceMeters(pos.lat, pos.lon, cached.lat, cached.lon) : Infinity;
    if(cached && distance < NEIGHBORHOOD_GYM_RECHECK_METERS){
      // não se moveu o suficiente -- usa o que já sabíamos, sem gastar uma chamada de geocodificação
      game.neighborhoodGymScreenState = 'ready';
    } else {
      await refreshNeighborhoodGymLocation(pos);
    }
  } catch(e){
    game.neighborhoodGymScreenState = (e && e.message==='sem-suporte') ? 'noGeolocation' : 'error';
    game.neighborhoodGymError = (e && e.code===1) ? 'Permissão de localização negada.' : 'Não foi possível obter sua localização.';
    render();
    return;
  }
  // sempre busca o detalhe do ginásio de novo, mesmo com localização em cache -- a liderança pode
  // ter mudado sem a pessoa ter se movido nadinha
  await loadNeighborhoodGymDetail();
}
async function refreshNeighborhoodGymLocation(pos){
  try{
    const result = await functionsClient.httpsCallable('resolveNeighborhood')({ lat: pos.lat, lon: pos.lon });
    const info = { lat: pos.lat, lon: pos.lon, city: result.data.city, countryCode: result.data.countryCode, stateAbbr: result.data.stateAbbr,
      hasGym: result.data.hasGym, resolvedAt: Date.now() };
    game.neighborhoodGymLocation = info;
    game.neighborhoodGymScreenState = 'ready';
    if(game.authUser){
      userDocRef(game.authUser.uid).set({ neighborhoodGymLocation: info }, { merge:true })
        .catch(e=>console.error('Erro ao salvar localização:', e));
    }
  } catch(e){
    console.error('Erro ao identificar a cidade:', e);
    game.neighborhoodGymScreenState = 'error';
    game.neighborhoodGymError = (e && e.message) || 'Não foi possível identificar sua cidade agora.';
  }
}
async function forceRefreshNeighborhoodGymLocation(){
  game.neighborhoodGymScreenState = 'locating';
  game.neighborhoodGymDetail = null;
  render();
  try{
    const pos = await getBrowserGeolocation();
    await refreshNeighborhoodGymLocation(pos);
  } catch(e){
    game.neighborhoodGymScreenState = 'error';
    game.neighborhoodGymError = 'Não foi possível obter sua localização.';
    render();
    return;
  }
  if(game.neighborhoodGymScreenState==='ready'){ await loadNeighborhoodGymDetail(); }
  else { render(); }
}
async function loadNeighborhoodGymDetail(){
  const loc = game.neighborhoodGymLocation;
  if(!loc || !loc.hasGym){ game.neighborhoodGymDetail = null; render(); return; }
  game.neighborhoodGymDetailLoading = true;
  render();
  try{
    const result = await functionsClient.httpsCallable('getNeighborhoodGymDetail')({ city: loc.city, countryCode: loc.countryCode });
    game.neighborhoodGymDetail = result.data;
  } catch(e){ console.error('Erro ao buscar detalhe do ginásio:', e); }
  game.neighborhoodGymDetailLoading = false;
  render();
}

// abre o seletor de time+terreno -- serve tanto pra reivindicar um ginásio vago quanto pra um líder
// atualizar a própria defesa a qualquer momento (mesma tela, muda só o rótulo e o que acontece ao confirmar)
// abre o seletor de TIME -- serve tanto pra reivindicar um ginásio vago (nesse caso só pede o time
// mesmo) quanto pra um líder trocar só o time depois, sem mexer no terreno que já tinha escolhido
function openNeighborhoodGymTeamPicker(){
  game.screen = 'neighborhoodGymTeamPicker';
  render();
}
// escolher time: se o ginásio já tem líder de verdade (time+terreno configurados), troca o time na
// hora, igual antes. Mas se é uma REIVINDICAÇÃO (ginásio vago, ou "venceu mas ainda sem time") NÃO
// grava nada no servidor ainda -- só guarda a escolha localmente e manda pra escolha de terreno. Só
// quando os DOIS estiverem escolhidos é que vira uma única chamada ao servidor, com time+terreno
// juntos. Assim, se a pessoa fechar o app, cair a conexão ou voltar pra home nesse meio tempo, o
// ginásio continua vago de verdade -- nunca fica com time mas sem terreno esperando confirmação
function isNeighborhoodGymClaimInProgress(){
  const detail = game.neighborhoodGymDetail;
  return !detail || !detail.hasLeader || (detail.leaderTeamPreview||[]).length===0;
}
async function submitNeighborhoodGymTeam(slot){
  const loc = game.neighborhoodGymLocation;
  if(!loc) return;
  if(isNeighborhoodGymClaimInProgress()){
    game.neighborhoodGymPendingClaimSlot = slot;
    game.screen = 'neighborhoodGymTerrainPicker';
    render();
    return;
  }
  game.neighborhoodGymChallenging = true;
  render();
  try{
    await functionsClient.httpsCallable('setNeighborhoodGymDefense')({ city: loc.city, countryCode: loc.countryCode, slot });
    game.neighborhoodGymChallenging = false;
    game.screen = 'neighborhoodGym';
    await loadNeighborhoodGymDetail();
  } catch(e){
    console.error('Erro ao configurar o time do ginásio:', e);
    game.neighborhoodGymChallenging = false;
    game.neighborhoodGymError = (e && e.message) || 'Não foi possível configurar o time agora.';
    render();
  }
}
// abre o seletor de TERRENO -- pode chegar aqui de duas formas: "Alterar terreno" (já é líder, time
// já configurado) ou logo depois de escolher o time numa reivindicação (nesse caso,
// neighborhoodGymPendingClaimSlot está preenchido, e o envio junta os dois numa chamada só)
function openNeighborhoodGymTerrainPicker(){
  game.terrainFilter = null;   // sempre abre mostrando todos
  game.neighborhoodGymPendingClaimSlot = null; // "Alterar terreno" direto da tela principal nunca é reivindicação
  game.screen = 'neighborhoodGymTerrainPicker';
  render();
}
async function submitNeighborhoodGymTerrain(terrainId){
  const loc = game.neighborhoodGymLocation;
  if(!loc) return;
  const pendingSlot = game.neighborhoodGymPendingClaimSlot;
  game.neighborhoodGymChallenging = true;
  render();
  try{
    const payload = { city: loc.city, countryCode: loc.countryCode, terrainId };
    if(pendingSlot!=null){ payload.slot = pendingSlot; } // reivindicação: time+terreno na MESMA chamada
    await functionsClient.httpsCallable('setNeighborhoodGymDefense')(payload);
    game.neighborhoodGymChallenging = false;
    game.neighborhoodGymPendingClaimSlot = null;
    game.screen = 'neighborhoodGym';
    await loadNeighborhoodGymDetail();
  } catch(e){
    console.error('Erro ao configurar o terreno do ginásio:', e);
    game.neighborhoodGymChallenging = false;
    game.neighborhoodGymError = (e && e.message) || 'Não foi possível configurar o terreno agora.';
    render();
  }
}
// clique único em "Desafiar Ginásio" -- manda pra escolha de time. O que realmente limita é o
// cooldown de 10min POR TIME (server-side, exibido na própria lista) -- não uma janela geral pra
// completar a escolha, que só criaria uma expiração silenciosa e confusa
async function startNeighborhoodGymChallenge(){
  game.neighborhoodGymError = null;
  game.neighborhoodGymCooldowns = null; // {slot: msRestantes} -- carrega antes de mostrar a lista
  game.screen = 'neighborhoodGymChallengeTeamPicker';
  render();
  const loc = game.neighborhoodGymLocation;
  try{
    const result = await functionsClient.httpsCallable('getNeighborhoodGymChallengeCooldowns')({ city: loc.city, countryCode: loc.countryCode });
    game.neighborhoodGymCooldowns = result.data.cooldowns || {};
  } catch(e){
    console.error('Erro ao consultar cooldown de desafio:', e);
    game.neighborhoodGymCooldowns = {}; // falhou a consulta -- não trava a tela, só não mostra cooldown nenhum
  }
  render();
}
// escolheu o time -- copia pra um array próprio (não mexe no game.team, que é o save carregado
// agora mesmo) e vai pra tela de ordem, onde também mostra o time do líder de novo como referência
/* ORDEM DO TIME DE DEFESA -- só pro líder.
   `_idx` guarda a posição ORIGINAL de cada pokémon: é ela que vai pro servidor, que permuta o
   código guardado. Mesmo padrão da ordem da Torre. */
function openNeighborhoodGymDefenseOrder(){
  const detail = game.neighborhoodGymDetail;
  if(!detail || !(detail.leaderTeamPreview||[]).length) return;
  game.neighborhoodGymDefenseOrder = detail.leaderTeamPreview.map((p,i)=>({ ...p, _idx:i }));
  game.neighborhoodGymOrderError = null;
  game.screen = 'neighborhoodGymDefenseOrder';
  render();
}
function moveNeighborhoodGymDefenseOrder(pos, dir){
  const lista = game.neighborhoodGymDefenseOrder;
  if(!lista) return;
  const alvo = pos + dir;
  if(alvo < 0 || alvo >= lista.length) return;
  const tmp = lista[pos]; lista[pos] = lista[alvo]; lista[alvo] = tmp;
  render();
}
async function confirmNeighborhoodGymDefenseOrder(){
  const lista = game.neighborhoodGymDefenseOrder;
  const loc = game.neighborhoodGymLocation;
  if(!lista || !loc) return;
  game.neighborhoodGymOrderSaving = true;
  game.neighborhoodGymOrderError = null;
  render();
  try{
    const r = await functionsClient.httpsCallable('reorderNeighborhoodGymDefense')({
      city: loc.city, countryCode: loc.countryCode, order: lista.map(p=>p._idx)
    });
    // atualiza a prévia local com a ordem que o servidor confirmou, sem recarregar a tela inteira
    if(game.neighborhoodGymDetail && r.data && r.data.team){
      game.neighborhoodGymDetail.leaderTeamPreview = r.data.team;
    }
    game.neighborhoodGymOrderSaving = false;
    game.screen = 'neighborhoodGym';
  } catch(e){
    console.error('Erro ao reordenar a defesa:', e);
    game.neighborhoodGymOrderSaving = false;
    game.neighborhoodGymOrderError = (e && e.message) || 'Não foi possível salvar a ordem agora.';
  }
  render();
}
function pickNeighborhoodGymChallengeTeam(slot){
  const s = game.saveSlots[slot];
  if(!s || !s.team) return;
  game.neighborhoodGymChallengeSlot = slot;
  game.neighborhoodGymChallengeTeam = s.team.map(p=>{
    const inst = createInstance(p.speciesId, p.level);
    if(p.shiny){ inst.shiny = true; }
    return inst;
  });
  game.screen = 'neighborhoodGymChallengeOrderPicker';
  render();
}
function moveNeighborhoodGymChallengeOrder(id, dir){
  const team = game.neighborhoodGymChallengeTeam;
  const idx = team.findIndex(p=>p.id===id);
  const newIdx = idx + dir;
  if(newIdx<0 || newIdx>=team.length) return;
  const tmp = team[idx]; team[idx] = team[newIdx]; team[newIdx] = tmp;
  render();
}
// confirma e desafia de verdade -- o SERVIDOR resolve a luta (como sempre), mas agora recebe também a
// ordem escolhida (como um código de time, saneado e conferido contra o save real, igual à Trainers
// League) pra exibir a batalha animada igual a uma batalha normal, em vez de só mostrar o resultado
async function confirmNeighborhoodGymChallenge(){
  const loc = game.neighborhoodGymLocation;
  const slot = game.neighborhoodGymChallengeSlot;
  if(!loc || slot==null) return;
  game.neighborhoodGymChallenging = true;
  render();
  try{
    const orderedTeamCode = encodeTeamCode(game.neighborhoodGymChallengeTeam);
    const result = await functionsClient.httpsCallable('challengeNeighborhoodGym')({ city: loc.city, countryCode: loc.countryCode, slot, orderedTeamCode });
    game.neighborhoodGymChallenging = false;
    // alimenta o MESMO sistema de revelação animada usado nas batalhas normais -- só muda a origem
    // do resultado (calculado no servidor, não aqui), o resto do fluxo é idêntico
    game.battleResult = { win: result.data.win, matchups: result.data.matchups };
    game.battleResultContext = 'neighborhoodGym';
    game.neighborhoodGymBattleOpponentName = result.data.opponentName;
    game.neighborhoodGymBattleTerrain = game.neighborhoodGymDetail && game.neighborhoodGymDetail.leaderTerrain ? game.neighborhoodGymDetail.leaderTerrain : null;
    game.neighborhoodGymLastWin = result.data.win;
    game.revealIndex = 0;
    game.revealPhase = 'loading';
    preloadBattleSprites(result.data.matchups);
    game.screen = 'battling';
    render();
    setTimeout(advanceReveal, 1200);
  } catch(e){
    console.error('Erro ao desafiar o ginásio:', e);
    game.neighborhoodGymChallenging = false;
    game.neighborhoodGymError = (e && e.message) || 'Não foi possível processar o desafio agora.';
    game.screen = 'neighborhoodGym';
    render();
  }
}

// Pede ao servidor pra recontar as especialidades. Quem conta é ele, sempre: as regras do Firestore
// deixam o dono escrever no próprio documento, e como o bônus vale nas ligas, aceitar a contagem do
// cliente seria o mesmo que deixar qualquer um se declarar especialista em tudo.
// Chamada no carregamento e depois de batalhas que podem ter subido alguém pro nível 60.
let specialtySyncPending = false;
async function syncSpecialties(){
  if(!game.authUser || specialtySyncPending) return;
  specialtySyncPending = true;
  try{
    const r = await functionsClient.httpsCallable('syncTrainerSpecialties')();
    const antes = (game.specialties||[]).join(',');
    game.specialties = (r.data && r.data.specialties) || [];
    game.specialtyCounts = (r.data && r.data.counts) || {};
    // só redesenha se mudou -- essa função roda em segundo plano e não deve piscar a tela à toa
    if(game.specialties.join(',') !== antes){ render(); }
  } catch(e){
    console.error('Erro ao sincronizar especialidades:', e);
  } finally {
    specialtySyncPending = false;
  }
}
async function loadPermanentUserData(){
  if(!game.authUser) return;
  try{
    const snap = await userDocRef(game.authUser.uid).get();
    const d = snap.exists ? snap.data() : {};
    const permanent = new Set(d.pokedexCaught || []);
    // reconciliação: além do registro individual feito a cada captura (markCaught -> syncPermanentPokedex),
    // isso aqui é uma rede de segurança que roda TODA VEZ -- une o que já estiver nos saves atuais com o
    // registro permanente da conta. Antes isso só rodava uma única vez (só se o registro permanente estivesse
    // vazio), então qualquer captura "antiga" (de antes da sincronização individual existir, ou perdida por
    // alguma falha de rede pontual) nunca era migrada -- e ao apagar aquele save, a espécie sumia de vez
    const novos = [];               // só o que falta no registro do servidor -- ver o arrayUnion abaixo
    const permanentShiny = new Set(d.pokedexShinyCaught || []);
    const novosShiny = [];
    (game.saveSlots||[]).forEach(s=>{
      if(s && s.caughtSpecies){
        s.caughtSpecies.forEach(id=>{ if(!permanent.has(id)){ permanent.add(id); novos.push(id); } });
      }
      // rede de segurança pro Pokédex SHINY: diferente do normal, não existe um registro histórico de
      // "espécies já capturadas shiny" por save (caughtSpecies não distingue shiny) -- então só dá pra
      // recuperar retroativamente o que ainda está no TIME atual. Um shiny já liberado/evoluído antes
      // desse recurso existir infelizmente não tem como ser recuperado, mas fica registrado daqui pra frente
      if(s && s.team){
        s.team.forEach(p=>{
          if(p && p.shiny && p.speciesId){
            shinyChainSpeciesIds(p.speciesId).forEach(id=>{
              if(!permanentShiny.has(id)){ permanentShiny.add(id); novosShiny.push(id); }
            });
          }
        });
      }
    });
    /* arrayUnion em vez de reescrever a lista inteira. A versão anterior mandava [...permanent], o que
       é um read-modify-write: se a LEITURA lá em cima devolvesse menos do que o servidor tem (aba velha
       aberta, cache do SDK, dois aparelhos ao mesmo tempo), a escrita seguinte apagava a diferença --
       e esta era a ÚNICA escrita do projeto capaz de ENCOLHER a Pokédex; todas as outras já eram
       arrayUnion. Um jogador perdeu 49 espécies assim, o Mewtwo entre elas, e não havia backup pra
       restaurar (PITR desligado, retenção de 1h). Com arrayUnion quem soma é o servidor: encolher passa
       a ser impossível, não importa o que a leitura devolva. */
    if(novos.length){
      await userDocRef(game.authUser.uid).set(
        { pokedexCaught: firebase.firestore.FieldValue.arrayUnion(...novos) }, { merge: true });
    }
    if(novosShiny.length){
      await userDocRef(game.authUser.uid).set(
        { pokedexShinyCaught: firebase.firestore.FieldValue.arrayUnion(...novosShiny) }, { merge: true });
    }
    game.permanentPokedex = [...permanent];
    game.permanentShinyDex = [...permanentShiny];
    game.trainerName = d.trainerName || '';
    game.rivalNameDefault = d.rivalNameDefault || '';   // preenche a tela de nome do rival (ver nomeDoRivalPadrao)
    game.accountEliteChampion = !!d.eliteChampion;
    game.leagueWinsTotal = d.leagueWinsTotal || 0;
    game.trainerBestStreak = d.trainerBestStreak || 0;
    game.trainerLastStreak = d.trainerLastStreak || 0;
    game.shinyBonusExpiresAt = d.shinyBonusExpiresAt || 0; // se a pessoa recarregar o app com o bônus ainda ativo, continua valendo
    game.startersSorteados = d.startersSorteados || {};    // ver sorteioDosIniciais

    game.mewtwoLoanCooldownUntil = d.mewtwoLoanCooldownUntil || 0;
    game.mewtwoLoanUnlocked = !!d.mewtwoLoanUnlocked;
    game.specialties = d.specialties || [];      // valor já gravado; o syncSpecialties confirma depois
    game.specialtyCounts = d.specialtyCounts || {};
