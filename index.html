<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jornada Kanto</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0c1024">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jornada Kanto">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1024;
    --bg2:#141a35;
    --box:#fefbf0;
    --box-border:#1a1a2e;
    --ink:#1a1a2e;
    --muted:#6b6b80;
    --blue:#2a5fd6;
    --blue-dark:#1c3f96;
    --red:#d1291b;
    --red-dark:#8f1a10;
    --yellow:#ffcb05;
    --yellow-dark:#e0a800;
    --green:#2f9e44;
    --green-dark:#1f6b2f;
    /* famílias tipográficas -- SEMPRE usar via variável, nunca escrever a família na mão
       (a auditoria achou 4 grafias diferentes de 'Inter' e até um fallback monospace por engano) */
    --font-ui:'Inter', sans-serif;
    --font-pixel:'Press Start 2P', monospace;
  }
  *{box-sizing:border-box;}
  /* ZOOM POR TOQUE DUPLO: no celular, tocar rápido várias vezes no mesmo botão -- o "+" da
     distribuição de níveis é o caso clássico -- fazia o navegador entender toque duplo e dar zoom,
     e daí em diante mexer no jogo virava um transtorno. `manipulation` desliga SÓ o toque duplo; o
     pinça-pra-ampliar continua funcionando, que é o que importa pra quem precisa dele.
     O `maximum-scale=1` que já existe no viewport não resolve: o Safari do iPhone ignora esse
     atributo desde o iOS 10, de propósito.
     FAIXA BRANCA no atalho-app: em modo standalone, puxar além do fim da página revelava o fundo do
     <html>, que era transparente -- ou seja, branco. Com o fundo escuro aqui e o overscroll contido,
     a borracha não revela mais nada. */
  html{
    touch-action:manipulation;
    background:var(--bg);
    overscroll-behavior:none;
  }
  body{
    touch-action:manipulation;
    overscroll-behavior:none;
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.04) 1px, transparent 1px),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,0.03) 1px, transparent 1px),
      radial-gradient(circle at 40% 85%, rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(160deg, var(--bg), var(--bg2));
    background-size: 60px 60px, 80px 80px, 70px 70px, cover;
    font-family:var(--font-ui);
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:24px 12px 60px;
  }
  #app{width:100%;max-width:460px;}

  .eyebrow{
    font-family:var(--font-pixel);
    font-size:.55rem;
    letter-spacing:.5px;
    color:var(--yellow);
    text-align:center;
    margin:0 0 10px;
    opacity:.9;
  }

  .box{
    background:var(--box);
    border:3px solid var(--box-border);
    border-radius:4px;
    box-shadow:5px 5px 0 rgba(0,0,0,.45);
    padding:18px 16px;
    margin-bottom:16px;
    position:relative;
  }
  /* variante de destaque dourado -- mesmo visual do 1º lugar da tabela e do box de campeão */
  .box.gold-highlight{background:#fff8e0;border-color:var(--yellow-dark);}
  .box.cursor::after{
    content:'▼';
    position:absolute;
    right:14px;
    bottom:8px;
    font-size:.8rem;
    color:var(--box-border);
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0;}}

  h1{
    font-family:var(--font-pixel);
    font-size:1rem;
    line-height:1.6;
    margin:0 0 10px;
    text-align:center;
    color:var(--box-border);
  }
  .jornada-title{
    font-family:var(--font-pixel);
    font-size:1.3rem;
    line-height:1.6;
    margin:0 0 22px;
    text-align:center;
    color:var(--yellow);
    text-shadow:3px 3px 0 var(--red-dark), 6px 6px 0 rgba(0,0,0,.4);
  }
  h2{
    font-family:var(--font-pixel);
    font-size:.8rem;
    line-height:1.7;
    margin:0 0 12px;
    color:var(--box-border);
  }
  p{font-size:.9rem;line-height:1.5;margin:0 0 12px;color:var(--ink);}
  p:last-child{margin-bottom:0;}
  strong{color:var(--blue-dark);}

  .btn{
    display:block;
    width:100%;
    padding:13px 14px;
    margin:9px 0;
    border:3px solid var(--box-border);
    border-radius:3px;
    background:#fff;
    color:var(--ink);
    font-family:var(--font-ui);
    font-weight:700;
    font-size:.9rem;
    text-align:left;
    cursor:pointer;
    box-shadow:4px 4px 0 var(--box-border);
    transition:transform .05s, box-shadow .05s;
  }
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--box-border);}
  .btn:disabled{background:#e2e2e2;color:#9a9a9a;cursor:not-allowed;box-shadow:2px 2px 0 #b8b8b8;}
  .btn.primary{background:var(--blue);color:#fff;}
  .btn.danger{background:var(--red);color:#fff;text-align:center;font-size:1rem;}
  .btn.success{background:var(--green);color:#fff;}
  .btn.secondary{background:#e2e2e2;color:var(--ink);}
  .btn.selected{background:var(--yellow);border-color:var(--box-border);}
  .btn .mon-name{font-size:1rem;font-weight:800;display:block;}
  .btn .mon-sub{font-size:.7rem;font-weight:600;opacity:.85;display:block;margin-top:3px;}

  .modal-overlay{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(12,16,36,0.75);
    display:flex;
    /* flex-start + margin:auto no filho, em vez de align-items:center. Parece a mesma coisa quando o
       modal cabe na tela (o margin:auto centraliza), mas resolve um bug clássico: com
       align-items:center, um modal mais ALTO que a janela transborda pros dois lados e a parte de cima
       fica inalcançável -- não dá pra rolar até ela. Era o que travava o cartão de perfil no celular,
       com o botão Fechar fora de alcance */
    align-items:flex-start;
    justify-content:center;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:20px;
    /* respeita a barra de gestos do iPhone -- sem isso o último botão fica embaixo dela */
    padding-bottom:calc(20px + env(safe-area-inset-bottom));
    z-index:1000;
  }
  .modal-box{
    background:var(--box);
    border:3px solid var(--box-border);
    border-radius:4px;
    box-shadow:6px 6px 0 rgba(0,0,0,.45);
    padding:22px 18px;
    max-width:380px;
    width:100%;
    margin:auto; /* centraliza quando cabe, permite rolar quando não cabe (ver .modal-overlay) */
    text-align:center;
  }
  .modal-icon{font-size:2rem;margin-bottom:6px;}

  /* ---- Perfil público de treinador ---- */
  /* o nome vira link em TODA tela onde aparece (classificação, ranking, partidas, ginásio).
     Sublinhado pontilhado em vez de cor diferente: dentro das listas de ranking a cor já carrega
     significado (1º lugar, minha partida), e mais uma cor competindo virava ruído */

  /* ---------- TORRE DOS TREINADORES ---------- */
  /* A torre é desenhada de cima pra baixo (andar 10 no topo), como uma torre de verdade.
     Cada andar tem estado próprio: vencido (verde), atual (dourado pulsando) e bloqueado (apagado). */
  .tower-intro p{margin:0 0 8px;}
  .tower-shaft{
    margin:14px 0 10px;
    border-left:4px solid var(--box-border);
    border-right:4px solid var(--box-border);
    border-radius:6px 6px 0 0;
    padding:8px 6px 0;
    background:linear-gradient(180deg, rgba(255,203,5,.10), rgba(12,16,36,0) 60%);
  }
  .tower-floor{
    background:var(--box);
    border:3px solid var(--box-border);
    border-radius:4px;
    box-shadow:3px 3px 0 rgba(0,0,0,.4);
    padding:7px 9px;
    margin-bottom:7px;
  }
  .tower-floor.bloqueado{opacity:.45;}
  .tower-floor.vencido{border-color:var(--green-dark);background:#eef8f0;}
  .tower-floor.atual{
    border-color:var(--yellow-dark);background:#fff8e0;
    box-shadow:3px 3px 0 rgba(184,140,0,.45);
    animation:tower-atual 1.8s ease-in-out infinite;
  }
  @keyframes tower-atual{0%,100%{box-shadow:3px 3px 0 rgba(184,140,0,.45);}50%{box-shadow:3px 3px 0 rgba(184,140,0,.9);}}
  .tower-floor-head{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .tower-floor-num{
    font-family:var(--font-pixel);font-size:.6rem;color:#fff;background:var(--box-border);
    min-width:26px;text-align:center;padding:5px 3px;border-radius:3px;flex-shrink:0;
  }
  .tower-floor.vencido .tower-floor-num{background:var(--green-dark);}
  .tower-floor.atual .tower-floor-num{background:var(--yellow-dark);}
  .tower-floor-name{font-weight:800;font-size:.85rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tower-floor-avg{font-size:.62rem;font-weight:700;color:var(--muted);flex-shrink:0;}
  .tower-floor-team,.tower-your-team{display:flex;gap:4px;flex-wrap:wrap;}
  .tower-mon{display:flex;flex-direction:column;align-items:center;}
  .tower-mon .sprite-img{width:34px;height:34px;}
  .tower-mon-lv{font-size:.55rem;font-weight:800;color:var(--muted);}
  .tower-floor-hidden{font-size:.65rem;color:var(--muted);font-style:italic;}
  .tower-your-team{justify-content:center;margin:8px 0 10px;}
  /* seleção do time */
  .tower-pick-counter{
    font-family:var(--font-pixel);font-size:.55rem;color:var(--muted);
    text-align:center;margin:8px 0 10px;
  }
  .tower-pick-counter.ok{color:var(--green-dark);}
  .tower-pick-group{margin-bottom:10px;}
  .tower-pick-group-name{font-size:.65rem;font-weight:800;color:var(--muted);margin-bottom:4px;}
  .tower-pick-row{display:flex;gap:5px;flex-wrap:wrap;}
  .tower-pick{
    position:relative;background:var(--box);border:2px solid var(--box-border);border-radius:4px;
    padding:4px 3px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  }
  .tower-pick .sprite-img{width:38px;height:38px;}
  .tower-pick-lv{font-size:.55rem;font-weight:800;color:var(--muted);}
  .tower-pick.sel{border-color:var(--green-dark);background:#eef8f0;}
  .tower-pick.off{opacity:.35;cursor:not-allowed;}
  /* No modal do Doce Raro os quadros são MAIORES e ficam 3 por linha: aqui a pessoa escolhe um
     pokémon entre dezenas, olhando o sprite pra reconhecer quem é. Na torre, onde a escolha é de 6
     de um time conhecido, os quadros menores continuam melhores porque cabem mais na tela. */
  .candy-pick-row{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
  }
  .candy-pick-row .tower-pick{padding:8px 4px 6px;}
  .candy-pick-row .tower-pick .sprite-img{width:64px;height:64px;}
  .candy-pick-row .tower-pick-lv{
    font-size:.8rem;font-weight:800;margin-top:3px;
    display:flex;align-items:center;justify-content:center;gap:3px;  /* separa a estrela do "Lv." */
  }
  .candy-pick-row .tower-pick-check{width:20px;height:20px;font-size:.62rem;}
  /* botão desabilitado precisa PARECER desabilitado: o verde cheio convidava a clicar em algo
     que não responde */
  .btn.success:disabled{background:#9bb3a1;border-color:#7d9183;color:#eef2ee;cursor:not-allowed;box-shadow:none;}
  .btn.success:disabled:active{transform:none;}
  .tower-pick-check{
    position:absolute;top:-6px;right:-6px;background:var(--green-dark);color:#fff;
    font-size:.55rem;font-weight:800;width:17px;height:17px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;border:2px solid var(--box-border);
  }
  /* resultado do andar */
  .tower-result h2{margin:0 0 6px;}
  .tower-result.win{border-color:var(--green-dark);background:#eef8f0;}
  .tower-result.lose{border-color:var(--red);background:#fdeeee;}
  .tower-cleared{text-align:center;border-color:var(--yellow-dark);background:#fff8e0;}
  .tower-cleared-icon{font-size:2.4rem;line-height:1;margin-bottom:4px;}
  /* ranking */
  .tower-rank-list{text-align:left;margin-bottom:12px;}
  .tower-rank-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid rgba(26,26,46,.12);}
  .tower-rank-row:last-child{border-bottom:none;}
  .tower-rank-row.ouro{background:#fff8e0;border-radius:3px;}
  .tower-rank-pos{font-family:var(--font-pixel);font-size:.55rem;color:var(--muted);min-width:26px;}
  .tower-rank-name{flex:1;font-weight:800;font-size:.85rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tower-rank-count{font-weight:800;font-size:.9rem;display:flex;align-items:center;gap:3px;}
  .tower-rank-x{font-size:.75rem;}
  .tower-order-btn{font-size:.7rem;padding:6px 10px;margin:0;width:auto;}
  .tower-order-list{text-align:left;margin-bottom:12px;}
  .tower-candy{display:flex;align-items:center;gap:10px;border-color:var(--yellow-dark);background:#fff8e0;}
  .tower-candy-icon{font-size:1.9rem;line-height:1;flex-shrink:0;}
  .tower-candy-info{flex:1;display:flex;flex-direction:column;min-width:0;}
  .tower-candy-info .hint-text{margin:2px 0 0;}
  .tower-candy-btn{width:auto;margin:0;flex-shrink:0;padding:9px 16px;}
  .kanto-bonus-box{text-align:center;border-color:var(--yellow-dark);background:#fff8e0;}
  .kanto-bonus-icon{font-size:2.2rem;line-height:1;margin-bottom:4px;}
  .kanto-bonus-gain{font-size:1.05rem;font-weight:800;color:var(--green-dark);margin:6px 0;}
  /* bloco do doce dentro do quadro de torre vencida: separado por uma linha, pra não virar um
     parágrafo só com o texto da vitória */
  .tower-cleared-candy{
    margin-top:12px;padding-top:12px;
    border-top:2px dashed rgba(26,26,46,.25);
  }
  .tower-cleared-candy-top{font-size:1.05rem;margin-bottom:2px;}
  .tower-cleared-candy .hint-text{margin:0 0 10px;}
  .tower-cleared-candy .btn{margin:0;}
  .journey-badges-note{margin:0 0 10px;font-size:.85rem;}
  .elite-shiny-block{margin-top:12px;padding-top:12px;border-top:2px dashed rgba(26,26,46,.25);}
  .elite-shiny-block .hint-text{margin:0 0 10px;}
  .elite-shiny-block .btn{margin:0;}
  .elite-shiny-done{margin:10px 0 0;font-weight:800;color:var(--green-dark);font-size:.85rem;}
  .mode-card{display:block;width:100%;text-align:left;cursor:pointer;margin-bottom:12px;}
  .mode-card:active{transform:translate(2px,2px);}
  .mode-card p{margin:0 0 6px;font-size:.85rem;}
  .mode-card-title{font-family:var(--font-pixel);font-size:.72rem;margin-bottom:8px;color:var(--ink);}
  .mode-card.hard{border-color:#8a1f1f;background:#fdeeee;}
  .mode-card.hard .mode-card-title{color:#8a1f1f;}
  .mode-card-reward{color:var(--green-dark);font-weight:800;}
  .online-searching{text-align:center;}
  .online-radar{font-size:2.6rem;line-height:1;margin-bottom:6px;animation:online-pulse 1.4s ease-in-out infinite;}
  @keyframes online-pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.15);opacity:.6;}}
  .online-searching .save-slot-team-row{margin:10px 0;}
  .online-last{font-size:.72rem;color:var(--muted);text-align:center;margin:8px 0 0;font-weight:700;}
  /* painel de escolha: nesses 5 segundos o cronômetro é o elemento mais importante da tela */
  .online-choose{text-align:center;border-color:var(--yellow-dark);background:#fff8e0;}
  .online-choose.urgente{border-color:var(--red);background:#fdeeee;}
  /* durante a animação o painel fica na tela mas apagado: some-lo e trazê-lo de volta empurrava
     o conteúdo pra cima e pra baixo a cada confronto */
  .online-choose.esperando{opacity:.55;border-color:var(--box-border);background:var(--box);}
  .online-choose.esperando .online-timer{animation:none;color:var(--muted);font-size:1.2rem;}
  .online-vai,.online-vai-linha{color:var(--green-dark);animation:online-vai-in .3s ease-out;}
  /* convite: aparece por cima de qualquer tela. O botão de recusar fica sempre visível pra
     ninguém se sentir preso num aviso no meio de outra coisa */
  .convite-overlay{z-index:120;}
  .convite-box{border-color:var(--green-dark);}
  .convite-timer{font-family:var(--font-pixel);font-size:1.8rem;color:var(--green-dark);
    margin:6px 0 10px;animation:online-tick .5s ease-in-out infinite;}
  .convite-som{
    background:none;border:none;color:var(--muted);font-family:var(--font-ui);
    font-size:.68rem;font-weight:800;cursor:pointer;margin-top:6px;padding:4px;
  }
  @keyframes online-vai-in{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  .online-timer{font-family:var(--font-pixel);font-size:1.6rem;color:var(--yellow-dark);line-height:1;margin-bottom:6px;}
  .online-choose.urgente .online-timer{color:var(--red);animation:online-tick .5s ease-in-out infinite;}
  @keyframes online-tick{0%,100%{transform:scale(1);}50%{transform:scale(1.18);}}
  /* Cards maiores: 3 por linha em vez de 6 espremidos. Com sprite de 44px não dava pra
     reconhecer o pokémon de relance, que é a decisão que a pessoa toma em 5 segundos. */
  .online-pick-row{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:6px;margin-top:6px;
  }
  .online-pick-row .tower-pick .sprite-img{width:60px;height:60px;}
  /* nomes longos (Charizard, Nidoqueen) reduzem de tamanho em vez de virar reticências --
     num card de escolha, o nome cortado é justamente o que a pessoa precisa ler */
  .online-pick-nome{
    display:block;font-size:.66rem;font-weight:800;color:var(--ink);
    line-height:1.2;margin-top:2px;
    white-space:nowrap;max-width:100%;
    transform-origin:center;
  }
  @media (max-width:400px){ .online-pick-nome{font-size:.6rem;} }
  @media (max-width:340px){ .online-pick-nome{font-size:.54rem;} }
  .online-pick-lvl{display:block;font-size:.58rem;font-weight:800;color:var(--muted);}
  .online-choose h2{margin:0 0 4px;}
  .online-time-l{font-size:.52rem;font-weight:800;color:var(--muted);margin:10px 0 4px;text-align:center;}
  .online-pick.sem-clique{cursor:default;background:rgba(26,26,46,.04);}
  /* ícone da pokédex */
  .dex-icon{width:14px;height:14px;image-rendering:pixelated;vertical-align:-2px;}
  .dex-icon.grande{width:20px;height:20px;vertical-align:-4px;}
  /* botão da pokédex na tela de captura */
  .dex-icon.menu{width:32px;height:32px;vertical-align:middle;}
  .dex-icon.modo{width:26px;height:26px;vertical-align:middle;}
  .gym-hist-rodape{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;}
  .gym-hist-data{color:var(--muted);font-size:.7rem;font-weight:400;}
  .gym-rever{width:auto;margin:0;padding:6px 10px;font-size:.68rem;flex-shrink:0;}
  /* modal da pokédex: quase tela cheia, com rolagem interna */
  .dex-modal{max-width:560px;width:96%;max-height:90vh;display:flex;flex-direction:column;}
  .dex-modal-conteudo{overflow-y:auto;flex:1;text-align:left;margin-bottom:10px;}
  .dex-modal-conteudo .eyebrow{margin-top:0;}
  .fighter-oculto{opacity:.55;}
  .fighter-oculto .fighter-emoji{font-size:2.4rem;}
  .fighter-oculto-l{font-size:.62rem;font-weight:800;color:var(--muted);}
  .online-choose .hint-text{margin:0;}
  /* apresentação dos dois treinadores */
  .online-intro-head{text-align:center;}
  .online-trainer-card h2{margin:0 0 8px;text-align:center;}
  .online-stats-row{display:flex;gap:8px;margin-bottom:10px;}
  .online-stat{flex:1;text-align:center;background:rgba(26,26,46,.06);border-radius:4px;padding:6px 4px;}
  .online-stat-v{font-family:var(--font-pixel);font-size:.85rem;color:var(--ink);}
  .online-stat-l{font-size:.55rem;font-weight:800;color:var(--muted);margin-top:4px;line-height:1.3;}
  .online-stat.destaque{background:#eef8f0;border:2px solid var(--green-dark);}
  .online-buscar{margin:0 0 14px;}
  /* dois caminhos lado a lado: fila aleatória e lobby */
  .online-acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px;}
  .online-acoes .btn{margin:0;font-size:.78rem;padding:12px 8px;}
  .online-acoes-sub{text-align:center;margin:0 0 14px;font-size:.66rem;}
  /* lobby */
  .lobby-meu-time{margin-top:10px;}
  .lobby-meu-l{font-size:.55rem;font-weight:800;color:var(--muted);}
  /* lista compacta: uma linha por treinador dentro de uma caixa só */
  .lobby-lista{padding:6px 12px;}
  .lobby-linha{
    display:flex;align-items:center;gap:10px;
    padding:6px 0;border-bottom:2px dashed rgba(26,26,46,.15);
  }
  .lobby-linha:last-child{border-bottom:none;}
  .lobby-linha-info{flex:1;min-width:0;}
  .lobby-nome{font-weight:800;font-size:.85rem;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lobby-stats{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px;}
  .lobby-stat{
    font-size:.57rem;font-weight:800;color:var(--muted);
    background:rgba(26,26,46,.06);border-radius:3px;padding:2px 5px;
  }
  .lobby-stat strong{color:var(--ink);}
  .lobby-stat.pct{color:var(--green-dark);}
  .lobby-stat.novo{font-style:italic;}
  .lobby-stat.media{background:none;padding:2px 0;}
  .lobby-linha.enviando{opacity:.6;}
  .lobby-acao{
    flex-shrink:0;font-size:.95rem;cursor:pointer;line-height:1;
    background:var(--green);border:2px solid var(--box-border);border-radius:4px;
    padding:6px 10px;box-shadow:2px 2px 0 var(--box-border);
  }
  .lobby-acao:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--box-border);}
  .lobby-acao:disabled{opacity:.5;cursor:not-allowed;}
  .lobby-contador{
    font-family:var(--font-ui);font-size:.7rem;color:#fff;background:var(--green-dark);
    padding:2px 7px;border-radius:10px;vertical-align:middle;
  }
  .lobby-vazio{text-align:center;}
  .lobby-vazio-icon{font-size:2.2rem;line-height:1;margin-bottom:6px;}
  /* o nome ocupa o espaço livre pra empurrar o botão Rever pra direita, alinhando todos numa
     coluna -- colados no nome eles ficavam em posições diferentes a cada linha */
  /* linha do histórico: faixa colorida à esquerda com V/D, dados no meio, Rever à direita.
     Substituiu a lista genérica de status -- ali o resultado era um selo perdido no canto e a
     única outra informação era "10 confrontos", que não diz nada pra quem lê */
  .online-hist{
    display:flex;align-items:center;gap:10px;
    padding:8px 0;border-bottom:2px dashed rgba(26,26,46,.15);
  }
  .online-hist:last-child{border-bottom:none;}
  .online-hist-res{
    width:30px;height:30px;flex-shrink:0;border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-pixel);font-size:.7rem;color:#fff;
  }
  .online-hist.v .online-hist-res{background:var(--green-dark);}
  .online-hist.d .online-hist-res{background:var(--red);}
  .online-hist-mid{flex:1;min-width:0;}
  .online-hist-nome{font-weight:800;font-size:.92rem;line-height:1.25;}
  .online-hist-sub{font-size:.62rem;color:var(--muted);font-weight:700;margin-top:1px;}
  .online-placar-x{color:var(--muted);}
  .online-rever{width:auto;margin:0;padding:6px 10px;font-size:.68rem;flex-shrink:0;}
  /* resumo: barra de aproveitamento e os dois destaques */
  .online-stat.win .online-stat-v{color:var(--green-dark);}
  .online-stat.lose .online-stat-v{color:var(--red);}
  .online-barra{
    height:8px;border-radius:4px;background:var(--red);
    overflow:hidden;margin:2px 0 10px;
  }
  .online-barra-win{display:block;height:100%;background:var(--green-dark);}
  .online-extra{display:flex;gap:8px;flex-wrap:wrap;}
  .online-extra-item{
    flex:1 1 130px;display:flex;align-items:center;gap:8px;
    background:rgba(26,26,46,.06);border-radius:4px;padding:6px 8px;
  }
  .online-extra-icon{font-size:1.2rem;}
  .online-extra-l{font-size:.52rem;font-weight:800;color:var(--muted);}
  .online-extra-v{font-weight:800;font-size:.82rem;}
  .online-fav{display:flex;align-items:center;gap:10px;margin-bottom:10px;
    background:#fff8e0;border:2px solid var(--yellow-dark);border-radius:4px;padding:6px 8px;}
  .online-fav-l{font-size:.55rem;font-weight:800;color:var(--muted);}
  .online-fav-n{font-weight:800;font-size:.9rem;}
  .online-versus{font-family:var(--font-pixel);font-size:1.1rem;color:var(--yellow);text-align:center;margin:2px 0 12px;}
  .online-tc-head{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;}
  .online-tc-nome{font-family:var(--font-pixel);font-size:.78rem;color:var(--ink);}
  .online-tc-tag{
    font-size:.5rem;font-weight:800;color:#fff;background:var(--blue);
    padding:3px 6px;border-radius:3px;letter-spacing:.5px;
  }
  /* o cartão do próprio jogador ganha destaque azul: com dois cartões iguais empilhados,
     era fácil ler os números do adversário achando que eram os seus */
  .online-trainer-card.meu{border-color:var(--blue);}
  /* filtro de tipo na escolha de terreno */
  .terrain-filter{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
  .terrain-filter-chip{
    display:flex;align-items:center;gap:4px;
    background:var(--box);border:2px solid var(--box-border);border-radius:4px;
    padding:4px 7px;cursor:pointer;font-family:var(--font-ui);
    font-size:.68rem;font-weight:800;color:var(--ink);
  }
  .terrain-filter-chip.on{border-color:var(--blue);background:#e8f0ff;}
  .terrain-filter-chip .type-pill{font-size:.5rem;padding:2px 5px;}
  .terrain-filter-n{font-size:.6rem;color:var(--muted);}
  .terrain-filter-chip.on .terrain-filter-n{color:var(--blue-dark);}
  .online-countdown{
    font-family:var(--font-pixel);font-size:2rem;color:var(--yellow-dark);
    text-align:center;margin-top:8px;animation:online-tick .5s ease-in-out infinite;
  }
  /* mesmo visual do 3-2-1, só um pouco menor: a apresentação tem conteúdo em volta e um número
     gigante roubaria a atenção dos cartões, que é o que a pessoa deve ler nesses 10 segundos */
  .online-countdown.intro{font-size:1.6rem;margin:4px 0 6px;animation:none;color:var(--blue);}
  /* cards de escolha: barra de HP embaixo do sprite e marca de selecionado */
  .online-pick{position:relative;}
  /* a barra dos cards usa .hp-bar-fill, a MESMA classe da barra grande -- foi assim que as cores
     voltaram: antes eu tinha uma classe própria (.online-pick-hp-fill) e as regras de cor
     (.hp-bar-fill.hp-high etc.) simplesmente não se aplicavam, deixando tudo cinza */
  .online-pick-hp{display:block;width:100%;height:5px;background:rgba(26,26,46,.18);
    border-radius:3px;overflow:hidden;margin:3px 0 2px;}
  .online-pick-hp .hp-bar-fill{display:block;width:100%;height:100%;transform-origin:left center;
    transition:none;}
  .online-pick.escolhido{border-color:var(--green-dark);background:#eef8f0;}
  .online-pick-check{position:absolute;top:-7px;right:-7px;background:var(--green-dark);color:#fff;
    width:19px;height:19px;border-radius:50%;font-size:.65rem;font-weight:800;
    display:flex;align-items:center;justify-content:center;border:2px solid var(--box-border);}
  .online-pick .tower-pick-lv{font-size:.55rem;}
  .online-pick{padding:6px 4px;}
  /* save do modo difícil: borda vermelha e selo, pra distinguir de relance na home */
  .save-slot-card.hard-save{border-color:#8a1f1f;}
  .save-slot-hard-tag{
    font-family:var(--font-pixel);font-size:.5rem;color:#fff;background:#8a1f1f;
    padding:3px 6px;border-radius:3px;margin-left:6px;vertical-align:middle;white-space:nowrap;
  }

  .trainer-link{
    cursor:pointer;
    text-decoration:underline;
    text-decoration-style:dotted;
    text-underline-offset:3px;
    text-decoration-thickness:1px;
  }
  .trainer-link:hover{text-decoration-style:solid;color:var(--blue);}
  .trainer-profile-box{max-width:400px;}
  .tp-header{
    display:flex;align-items:center;gap:10px;
    border-bottom:2px solid var(--box-border);
    padding-bottom:10px;margin-bottom:12px;text-align:left;
  }
  .tp-header-name{font-family:var(--font-pixel);font-size:.8rem;line-height:1.5;word-break:break-word;}
  .tp-header-sub{font-size:.75rem;color:var(--muted);font-weight:700;margin-top:4px;}
  /* faixa de destaque: os 3 números que definem um treinador de relance */
  .tp-hero{display:flex;gap:6px;margin-bottom:12px;}
  .tp-hero-cell{
    flex:1;background:var(--bg);color:var(--box);
    border-radius:4px;padding:8px 4px;text-align:center;
  }
  .tp-hero-value{font-family:var(--font-pixel);font-size:.9rem;color:var(--yellow);}
  .tp-hero-label{font-size:.6rem;font-weight:700;opacity:.75;margin-top:5px;letter-spacing:.3px;}
  .tp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;}
  .tp-stat{
    background:rgba(26,26,46,.05);
    border-left:3px solid var(--blue);
    border-radius:3px;padding:6px 8px;text-align:left;
  }
  .tp-stat.tp-stat-gold{border-left-color:var(--yellow);}
  .tp-stat.tp-stat-red{border-left-color:var(--red);}
  .tp-stat.tp-stat-green{border-left-color:var(--green);}
  .tp-stat-value{font-weight:800;font-size:.95rem;}
  .tp-stat-label{font-size:.65rem;color:var(--muted);font-weight:700;}
  .tp-ace{
    display:flex;align-items:center;gap:10px;text-align:left;
    background:rgba(255,203,5,.14);
    border:2px solid var(--yellow-dark);
    border-radius:4px;padding:8px 10px;margin-bottom:12px;
  }
  .tp-ace-label{font-size:.65rem;color:var(--muted);font-weight:700;}
  .tp-ace-name{font-weight:800;font-size:.95rem;}
  .tp-empty{font-size:.75rem;color:var(--muted);margin-bottom:12px;}
  .tp-spec{
    text-align:left;margin-bottom:12px;padding:8px 10px;
    background:rgba(42,95,214,.07);
    border:2px solid var(--blue);border-radius:4px;
  }
  .tp-spec-label{font-size:.6rem;font-weight:800;color:var(--muted);letter-spacing:.3px;margin-bottom:6px;}
  .tp-spec-pills{display:flex;flex-wrap:wrap;gap:4px;}
  .tp-spec-hint{font-size:.65rem;color:var(--muted);margin:6px 0 0;}
  /* duas colunas quando couberem: a lista chega a 15 tipos e em coluna única ela sozinha passava da
     altura da tela. O auto-fit cai pra uma coluna em telas bem estreitas em vez de espremer as barras
     até virarem tracinhos ilegíveis */
  .tp-spec-progress{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:5px 8px;}
  .tp-spec-row{display:flex;align-items:center;gap:5px;min-width:0;}
  .tp-spec-row-type{flex-shrink:0;}
  /* pílula mais compacta só aqui dentro -- em duas colunas ela come a largura da barra */
  .tp-spec-row-type .type-pill{font-size:.55rem;padding:2px 5px;margin-right:0;}
  .tp-spec-bar{flex:1;min-width:14px;height:7px;background:rgba(26,26,46,.15);border-radius:4px;overflow:hidden;}
  .tp-spec-bar-fill{display:block;height:100%;background:var(--blue);}
  .tp-spec-row-count{font-size:.58rem;font-weight:800;color:var(--muted);flex-shrink:0;min-width:30px;text-align:right;}
  .tp-stat-clickable{cursor:pointer;}
  .tp-stat-clickable:hover{background:rgba(26,26,46,.11);}
  .tp-stat-more{color:var(--muted);font-weight:800;}
  .tp-gym-list{margin-bottom:12px;}
  .tp-gym-row{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    text-align:left;padding:8px 10px;
    border-bottom:1px solid rgba(26,26,46,.12);
  }
  .tp-gym-row:last-child{border-bottom:none;}
  .tp-gym-city{font-weight:800;font-size:.9rem;}
  .tp-gym-now{font-size:.62rem;font-weight:800;color:var(--green);white-space:nowrap;}
  .tp-gym-past{font-size:.62rem;font-weight:700;color:var(--muted);white-space:nowrap;}
  .modal-box h2{margin:0 0 10px;}
  .modal-box p{margin-bottom:14px;}
  .modal-box .btn{text-align:center;}

  .type-pill{
    display:inline-block;
    padding:2px 7px;
    border-radius:3px;
    font-size:.62rem;
    font-weight:800;
    color:#fff;
    margin-right:4px;
    text-shadow:0 1px 1px rgba(0,0,0,.35);
    letter-spacing:.3px;
    text-transform:uppercase;
  }

  .pool-badge{
    font-family:var(--font-pixel);
    text-align:center;
    font-size:.85rem;
    color:var(--blue-dark);
    background:#e9edfc;
    border:2px solid var(--blue-dark);
    border-radius:3px;
    padding:8px;
    margin:4px 0 14px;
  }
  .pool-badge-main{font-size:.85rem;}
  .pool-badge-sub{font-size:.6rem;text-align:center;margin-top:6px;}

  .level-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:2px dashed #ddd7c2;
    gap:8px;
  }
  .level-row:last-of-type{border-bottom:none;}
  .level-info .mon-name{font-weight:800;font-size:.9rem;}
  .level-info .mon-sub{font-size:.7rem;color:var(--muted);font-weight:700;}
  .level-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .circle-btn{
    width:32px;height:32px;border-radius:50%;
    border:2px solid var(--box-border);
    background:var(--blue);color:#fff;
    font-size:1.1rem;font-weight:800;line-height:1;
    cursor:pointer;box-shadow:2px 2px 0 var(--box-border);
  }
  .circle-btn:active:not(:disabled){transform:translate(1px,1px);box-shadow:none;}
  .circle-btn:disabled{background:#d8d8d8;border-color:#b8b8b8;box-shadow:none;cursor:not-allowed;}
  .notif-delete-btn{background:var(--red);border-color:var(--red-dark);flex-shrink:0;}
  .alloc-num{font-family:var(--font-pixel);font-size:.75rem;width:20px;text-align:center;}

  .attempts{
    font-size:.75rem;
    font-weight:700;
    color:var(--red-dark);
    text-align:center;
    background:#ffe9e6;
    border:2px solid var(--red-dark);
    border-radius:3px;
    padding:6px;
    margin-bottom:12px;
  }

  .team-mini{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;}
  .team-chip{
    background:#eef0f7;
    border:2px solid var(--box-border);
    border-radius:3px;
    padding:6px 9px;
    font-size:.7rem;
    font-weight:700;
  }
  .team-grid{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin:14px 0 4px;
  }
  .team-grid-card{
    display:flex;
    align-items:center;
    gap:9px;
    background:#fff;
    border:2px solid var(--box-border);
    border-left-width:5px;
    border-radius:5px;
    padding:6px 10px;
    box-shadow:2px 2px 0 rgba(0,0,0,.12);
  }
  .team-grid-num{
    font-family:var(--font-pixel);
    font-size:.5rem;
    color:#fff;
    background:var(--box-border);
    border-radius:50%;
    width:16px;height:16px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .team-grid-sprite{flex-shrink:0;}
  .team-grid-info{min-width:0; flex:1; display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .team-grid-name{font-weight:800; font-size:.8rem;}
  .team-grid-level{font-size:.7rem;color:var(--muted);font-weight:700; white-space:nowrap;}
  .prebattle-top-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;}
  .tl-round-pager{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .tl-round-pager-label{font-weight:800;}
  .tl-round-pager-buttons{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;}
  .tl-round-pager-buttons .btn-back-mini{flex:0 0 auto;}
  .btn-back-mini{
    font-family:var(--font-pixel);
    font-size:.55rem;
    background:#fff;
    border:2px solid var(--box-border);
    border-radius:4px;
    padding:6px 9px;
    cursor:pointer;
    box-shadow:2px 2px 0 rgba(0,0,0,.2);
    flex-shrink:0;
  }
  .btn-back-mini:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(0,0,0,.2);}
  .prebattle-leader-title{margin:2px 0 6px;}

  .hp-bar-wrap{margin-top:8px;width:100%;}
  .hp-bar-track{
    background:#e2e2e2;
    border:2px solid var(--box-border);
    border-radius:6px;
    height:12px;
    overflow:hidden;
  }
  .hp-bar-fill{
    height:100%;
    width:100%;
    transform-origin:left;
    transition:transform .5s linear, background-color .5s ease-out;
  }
  .hp-bar-fill.hp-high{background:var(--green-dark);}
  .hp-bar-fill.hp-mid{background:#f5a623;}
  .hp-bar-fill.hp-low{background:var(--red);}
  .hp-bar-label{
    font-size:.62rem;
    color:var(--muted);
    margin-top:3px;
    text-align:center;
    font-weight:700;
  }

  .team-alive-row{display:flex;justify-content:space-between;gap:8px;margin:10px 0;flex-wrap:wrap;}
  .team-alive-chip{
    background:#eef0f7;
    border:2px solid var(--box-border);
    border-radius:3px;
    padding:5px 9px;
    font-size:.8rem;
    font-weight:700;
    flex:1;
    text-align:center;
  }

  .battle-vs{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin:14px 0 10px;
  }
  .fighter{flex:1;text-align:center;font-weight:800;font-size:.85rem;}
  .fighter-emoji{font-size:1.9rem;line-height:1.2;margin-bottom:2px;}
  .route-card{ text-align:left; }
  .route-rumor{ display:block; font-size:.8rem; font-weight:600; color:var(--muted); font-style:italic; margin-top:4px; }
  .shiny-badge{ display:inline-block; font-size:.62rem; font-weight:800; color:#8a6d00; background:#fff3c4; padding:1px 6px; border-radius:8px; margin-left:4px; }
  .fighter-types{margin:3px 0 6px; display:flex; justify-content:center; flex-wrap:wrap; gap:2px;}
  .fighter-types .type-pill{margin-right:0;}
  .fighter-level{display:block;font-size:.7rem;color:var(--muted);font-weight:700;margin-top:1px;}
  .vs-swords{font-size:1.4rem;display:inline-block;}
  .vs-swords.spin{animation:swordSpin .9s linear infinite;}
  @keyframes swordSpin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .loading-dots{display:flex;justify-content:center;gap:6px;margin:16px 0 8px;}
  .loading-dots span{
    width:8px;height:8px;border-radius:50%;
    background:var(--box-border);
    animation:dotPulse 1s infinite ease-in-out;
  }
  .loading-dots span:nth-child(2){animation-delay:.15s;}
  .loading-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes dotPulse{0%,80%,100%{opacity:.25;transform:scale(.7);} 40%{opacity:1;transform:scale(1);}}
  .loading-text{text-align:center;font-size:.8rem;color:var(--muted);margin:0;}
  .battle-result-line{text-align:center;font-size:1rem;margin:0;}
  .battle-status-area{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .sudden-death-note{
    display:inline-block;
    margin-top:6px;
    font-size:.7rem;
    font-weight:700;
    color:#a15c00;
    font-style:italic;
  }

  .order-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:2px dashed #ddd7c2;
  }
  .order-row:last-of-type{border-bottom:none;}
  .order-num{
    font-family:var(--font-pixel);
    font-size:.75rem;
    color:var(--blue-dark);
    width:28px;
    flex-shrink:0;
    text-align:center;
  }
  .order-info{flex:1;min-width:0;}
  .order-info .mon-name{font-weight:800;font-size:.9rem;display:block;}
  .order-info .mon-sub{font-size:.7rem;display:block;margin-top:2px;}
  .order-controls{display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
  .order-controls .circle-btn{width:28px;height:28px;font-size:.85rem;}
  /* variante pra linhas com até 3 controles (setas + reviver/curar) -- em coluna única ficava alto
     demais e o align-items:center do .order-row empurrava o texto pro meio da linha, cortando o topo
     na hora de rolar. Aqui as setas ficam lado a lado (compacto) e o botão de cura entra embaixo */
  .order-row.elite-row{align-items:flex-start;}
  .order-controls-compact{display:flex;flex-direction:column;gap:4px;flex-shrink:0;align-items:flex-end;}
  .order-arrows-pair{display:flex;gap:4px;}
  .order-arrows-pair .circle-btn{width:28px;height:28px;font-size:.85rem;}

  .status-list{margin:6px 0 4px;}
  .matchup-row{
    padding:7px 0;
    font-size:.85rem;
    font-weight:600;
    border-bottom:1px dashed #ddd7c2;
  }
  .matchup-row:last-child{border-bottom:none;}
  .matchup-row .vs{color:var(--muted);font-weight:800;margin:0 2px;}
  /* tarja de salvamento -- fixa no alto, por cima de tudo */
  .save-aviso{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;
    gap:8px;padding:7px 10px;background:var(--yellow-dark);color:#fff;font-size:.66rem;
    font-weight:700;line-height:1.3;box-shadow:0 2px 6px rgba(0,0,0,.35);}
  .save-aviso.erro{background:var(--red-dark);}
  .save-aviso-txt{flex:1;min-width:0;}
  .save-aviso-cod{opacity:.85;font-weight:400;}
  .save-aviso-btn{flex:0 0 auto;background:rgba(255,255,255,.92);color:var(--ink);border:none;
    border-radius:4px;padding:5px 9px;font-family:var(--font-ui);font-size:.62rem;font-weight:800;
    cursor:pointer;}
  /* Cartão de confronto: os dois lados EMPILHADOS, cada um com a largura inteira.
     Lado a lado não serve: em 320px cada coluna fica com ~140px e o nome do golpe é cortado
     (Chicote de Cipó virava C...), que é justamente a informação que o log existe pra dar.
     Empilhado, cada lado cabe em duas linhas e o cartão fica em ~80px (era ~150).
     Sem linha de fulano venceu: quem caiu está apagado e com a barra no zero, o que já diz. */
  .matchup-row.mlog{border-bottom:none;background:rgba(26,26,46,.035);border-radius:6px;
    padding:7px 5px;margin-bottom:6px;}
  /* os dois de FRENTE UM PRO OUTRO, com o × no meio, como na tela de batalha */
  .mlog-grade{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:4px;}
  .mlog-lado{text-align:center;min-width:0;}
  .mlog-lado.caiu{opacity:.45;}
  .mlog-spr{line-height:0;}
  /* três seletores porque .sprite-sm .sprite-img vem DEPOIS neste arquivo: com dois, a regra de
     lá (48px) ganhava por empate de especificidade e o cartão ficava 30px mais alto */
  .mlog-lado .mlog-spr .sprite-img{width:40px;height:40px;}
  .mlog-nome{font-size:.66rem;font-weight:800;color:var(--ink);line-height:1.2;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mlog-lv{font-size:.56rem;font-weight:800;color:var(--muted);}
  .mlog-hp{font-size:.56rem;font-weight:800;color:var(--muted);}
  .mlog-x{align-self:center;font-size:.8rem;color:var(--muted);font-weight:800;padding-top:14px;}
  .mlog-res{text-align:center;font-size:.66rem;margin-top:3px;}
  /* barra curta com o número ao lado -- mesma marcação e mesmas classes de cor de sempre
     (renderHpBar); o rótulo dela sai de cena porque o número já está aqui do lado */
  .mlog-vida{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:1px;}
  .mlog-vida .hp-bar-wrap{margin:0;flex:0 0 44px;width:44px;}
  .mlog-vida .hp-bar-track{height:7px;border-width:1px;border-radius:4px;}
  .mlog-vida .hp-bar-label{display:none;}
  /* O nome do golpe vai DENTRO do selo do tipo: a cor já diz o tipo, e economiza uma linha.
     Sem o CAIXA ALTA do selo normal: "AVALANCHE DE PEDRAS" quebrava em duas linhas e esticava
     o cartão, e nome de golpe em maiúscula grita. Nome de tipo é rótulo, nome de golpe é nome. */
  .mlog-golpe{display:flex;align-items:center;justify-content:center;gap:4px;
    margin-top:3px;flex-wrap:wrap;}
  .mlog-golpe .type-pill{font-size:.55rem;padding:2px 6px;margin-right:0;max-width:100%;
    text-transform:none;letter-spacing:0;line-height:1.25;}
  .mlog-dano{font-size:.6rem;font-weight:800;color:var(--red-dark);flex:0 0 auto;}
  /* PASSO A PASSO: uma FRASE por golpe, na ordem em que aconteceram de verdade (matchup.golpes).
     A primeira versão era em colunas (quem bateu à esquerda, alvo e HP na ponta direita) e ficou
     ilegível: os dois lados da linha não pareciam ter relação um com o outro. Frase resolve.
     82% dos confrontos terminam em 4 golpes e 97% em até 6, então a lista quase nunca passa de
     quatro frases. */
  .mlog-passos{margin-top:6px;border-top:1px dashed #ddd7c2;padding-top:5px;
    display:flex;flex-direction:column;gap:3px;}
  /* Todas as frases centralizadas. A versão anterior encostava cada uma no lado de quem bateu;
     a alternância mostrava a troca de golpes, mas deixava o bloco em ziguezague. Quem diz de que
     lado é o golpe continua sendo a COR do nome (verde você, vermelho o adversário). */
  .mlog-passo{font-size:.62rem;font-weight:600;color:var(--ink);line-height:1.45;text-align:center;}
  .mlog-passo + .mlog-passo{border-top:1px dotted rgba(26,26,46,.09);padding-top:3px;}
  /* cada pokémon tem sempre a MESMA cor nas frases -- é o que deixa acompanhar a troca de golpes
     sem reler o nome inteiro a cada linha */
  .mlog-quem{font-weight:800;}
  .mlog-quem.p{color:var(--green-dark);}
  .mlog-quem.e{color:var(--red-dark);}
  .mlog-tira{font-weight:800;color:var(--red-dark);}
  .mlog-passos .type-pill{font-size:.55rem;padding:1px 5px;margin:0;
    text-transform:none;letter-spacing:0;}

  .win-text{color:var(--green-dark);font-weight:800;}
  .lose-text{color:var(--red-dark);font-weight:800;}
  .status-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 0;
    font-size:.85rem;
    font-weight:700;
    border-bottom:1px dashed #ddd7c2;
  }
  .status-row:last-child{border-bottom:none;}
  .status-row .icon{font-size:1rem;}
  .status-row.fainted{color:#9a9a9a;text-decoration:line-through;}
  .league-history-btn{
    display:inline-block;
    width:auto;
    margin:0 0 0 auto;
    padding:6px 10px;
    border:2px solid var(--box-border);
    border-radius:3px;
    background:#fff;
    font-family:var(--font-ui);
    font-weight:700;
    font-size:.7rem;
    cursor:pointer;
    box-shadow:2px 2px 0 var(--box-border);
    white-space:nowrap;
    flex-shrink:0;
  }
  .league-history-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--box-border);}
  .league-history-btn.danger{border-color:var(--red-dark);color:var(--red-dark);}

  .home-header{text-align:center;margin-bottom:18px;}
  .home-title{
    font-family:var(--font-pixel);
    font-size:1rem;
    color:var(--yellow);
    letter-spacing:1px;
    margin-bottom:8px;
    text-shadow:2px 2px 0 rgba(0,0,0,.35);
  }
  .home-tagline{font-size:.8rem;color:#b8bcd9;font-weight:600;}

  .home-menu-row{display:flex;gap:10px;margin-bottom:20px;}
  /* O nome do treinador é a identidade da conta e o atalho pro perfil -- ganha o mesmo tratamento
     dourado do 1º lugar e do box de campeão, com a faixa superior grossa dos cards do menu */
  .trainer-name-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px 14px;
    margin-bottom:14px;
    background:#fff8e0;
    border-color:var(--yellow-dark);
    border-top-width:6px;
    /* botão não herda a fonte do documento por padrão */
    font-family:inherit;
    width:100%;
    cursor:pointer;
    text-align:center;
  }
  .trainer-name-box:active{ transform:translate(2px,2px); box-shadow:3px 3px 0 rgba(0,0,0,.45); }
  .home-header-row{ display:flex; align-items:stretch; gap:8px; margin-bottom:14px; }
  .home-header-row .trainer-name-box{ margin-bottom:0; flex:1; min-width:0; }
  /* Caixa de entrada: a lista de títulos em cima, o corpo do que estiver aberto embaixo. Antes
     cada notificação era um card inteiro aberto, e com quatro ou cinco a tela virava uma parede de
     texto onde nem dava pra ver quantas eram. */
  .notif-caixa{ padding:0; overflow:hidden; }   /* a lista encosta na borda da caixa */
  /* Barra de cima da caixa: conta quantas são e liga o modo de escolher várias. */
  .notif-barra{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    padding:7px 9px; background:#efe7cf; border-bottom:2px solid var(--box-border);
  }
  .notif-barra-conta{ flex:1; min-width:0; font-size:.68rem; font-weight:800; color:var(--muted); }
  .notif-barra-btn{
    flex-shrink:0; padding:5px 8px; font-size:.68rem; font-weight:800;
    font-family:var(--font-ui); color:var(--ink);
    background:var(--box); border:2px solid var(--box-border); border-radius:3px; cursor:pointer;
  }
  .notif-barra-btn:disabled{ opacity:.45; cursor:not-allowed; }
  .notif-barra-btn.perigo:not(:disabled){ background:var(--red); border-color:var(--red-dark); color:#fff; }
  /* a caixinha de marcar é um SPAN dentro do botão da linha, não um <input type=checkbox>: a linha
     inteira já é o alvo do toque (num celular, mirar num quadradinho de 16px é pedir erro) */
  .notif-check{
    flex-shrink:0; width:17px; height:17px; line-height:15px; text-align:center;
    font-size:.7rem; font-weight:800; color:#fff;
    background:#fff; border:2px solid var(--box-border); border-radius:3px;
  }
  .notif-item.marcada{ background:var(--yellow); }
  .notif-item.marcada .notif-check{ background:var(--green); }
  .notif-lista{ display:flex; flex-direction:column; max-height:42vh; overflow-y:auto; }
  .notif-item{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    padding:9px 11px; background:var(--box); color:var(--ink);
    border:0; border-bottom:2px solid var(--box-border);
    font-family:var(--font-ui); cursor:pointer;
  }
  .notif-item:last-child{ border-bottom:0; }
  .notif-item.aberta{ background:var(--yellow); }
  .notif-item-icone{ font-size:1rem; flex-shrink:0; }
  /* o título trunca em vez de quebrar: numa lista, o que importa é a contagem de linhas ser
     previsível -- é ela que deixa a caixa de entrada legível de relance */
  .notif-item-titulo{ flex:1; min-width:0; font-size:.78rem; font-weight:700;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .notif-item.nova .notif-item-titulo{ font-weight:800; }
  .notif-nova{ flex-shrink:0; background:var(--red); color:#fff; font-size:.5rem; font-weight:800;
    letter-spacing:.04em; padding:2px 4px; border-radius:3px; }
  .notif-item-data{ flex-shrink:0; font-size:.6rem; font-weight:700; color:var(--muted); }
  /* fonte de TEXTO, não a de pixel dos títulos de seção: o título aqui é conteúdo, e a de
     pixel gastava três linhas a 320px. É a mesma do card antigo de notificação (.save-slot-name),
     então a tela não muda de cara -- muda de arrumação. */
  .notif-corpo-titulo{ font-family:var(--font-ui); font-size:.9rem; font-weight:800; color:var(--ink); margin:0; line-height:1.3; }
  .notif-corpo-texto{ margin:8px 0 0; }
  .notif-bell-btn{
    position:relative;
    flex-shrink:0;
    width:52px;
    background:var(--box);
    border:3px solid var(--box-border);
    border-radius:4px;
    box-shadow:4px 4px 0 rgba(0,0,0,.4);
    font-size:1.3rem;
    cursor:pointer;
  }
  .notif-bell-btn:active{ transform:translate(1px,1px); box-shadow:2px 2px 0 rgba(0,0,0,.4); }
  .notif-badge{
    position:absolute;
    top:-7px; right:-7px;
    background:var(--red);
    color:#fff;
    font-size:.62rem;
    font-weight:800;
    border-radius:50%;
    min-width:18px; height:18px;
    display:flex; align-items:center; justify-content:center;
    border:2px solid var(--box-border);
    padding:0 3px;
  }
  .trainer-name-value{
    /* mesma fonte dos títulos dos cards de Pokédex/Conquistas (.home-menu-title) */
    font-family:var(--font-pixel);
    font-size:.72rem;
    line-height:1.4;
    color:var(--ink);
    /* a Press Start 2P só tem um peso, então o navegador engrossa por conta própria (bold sintético).
       É o único jeito de deixar o traço mais cheio sem trocar de fonte */
    font-weight:700;
    /* nome longo não pode estourar a caixa e empurrar o sino */
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;
  }
  .home-menu-card{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    padding:16px 8px 14px;
    border:3px solid var(--box-border);
    border-top-width:6px;
    border-radius:4px;
    background:var(--box);
    box-shadow:4px 4px 0 rgba(0,0,0,.4);
    cursor:pointer;
    font-family:var(--font-ui);
  }
  .home-menu-card.pokedex{border-top-color:var(--red);}
  .home-menu-card.achievements{border-top-color:var(--yellow);}
  .home-menu-card.friends{border-top-color:var(--blue,#3b6ef2);}
  /* Com o terceiro card a linha aperta: em 320px o padding lateral de 8px sobrava mais que o
     texto. Testar em 320, não só em 390 -- "Conquistas" é a palavra que estoura primeiro. */
  .home-menu-card{padding-left:4px;padding-right:4px;}
  .home-menu-card .home-menu-icon{position:relative;}
  @media (max-width:360px){
    .home-menu-row{gap:6px;}
    .home-menu-title{font-size:.55rem;}
    .home-menu-stat{font-size:.56rem;line-height:1.25;}
  }

  /* ---- MAPA DE KANTO E JOHTO ---- */
  .kanto-moldura{ padding:8px; background:#0d1f30; border-color:#22405c; }
  .kanto-map{ display:block; width:100%; height:auto; border-radius:3px; }
  .km-terra{ fill:#2e6b46; stroke:#8fd6a6; stroke-width:2; }
  /* trecho percorrido: linha cheia e discreta. O trecho ATUAL é pontilhado e anda --
     é o único elemento animado do mapa, então o olho vai direto pra ele */
  /* a ponte entre as duas regiões: pontilhada e apagada, pra ler como "existe caminho aqui" e
     não como um trecho da jornada */
  .km-elo{ fill:none; stroke:#3d5a75; stroke-width:1.6; stroke-dasharray:3 5; stroke-linecap:round; }
  .km-elo-nome{ font-family:var(--font-pixel); font-size:7px; fill:#3d5a75; letter-spacing:.08em; }
  /* halo igual ao dos nomes de cidade: o rótulo da região passa por cima da terra e da água, e
     sem o contorno ele sumia dentro do verde */
  .km-regiao{
    font-family:var(--font-pixel); font-size:9px; fill:#9db4cc;
    letter-spacing:.16em; stroke:#0b1a28; stroke-width:3.5; paint-order:stroke fill;
  }
  .km-trecho{ fill:none; stroke:#ffd76e; stroke-width:3; stroke-linecap:round; opacity:.85; }
  .km-trecho.km-atual{ stroke:#fff; stroke-dasharray:7 7; opacity:1; animation:km-anda 1.1s linear infinite; }
  @keyframes km-anda{ to{ stroke-dashoffset:-28; } }
  .km-rota-disco{ fill:#12283d; stroke:#ffd76e; stroke-width:1.5; }
  .km-ponto{ stroke:#0d1f30; stroke-width:2.5; }
  /* cidade por descobrir é um ponto PEQUENO. Com o mesmo raio das outras, o começo da jornada
     mostrava nove círculos escuros no meio do verde e o mapa parecia furado. */
  .km-cidade.km-longe .km-ponto{ stroke-width:1.5; }
  .km-nome{
    font-family:var(--font-ui); font-size:9px; font-weight:800; fill:#e8f2ff;
    /* halo escuro desenhado ATRÁS do preenchimento -- sem paint-order o contorno cobre a letra */
    stroke:#0b1a28; stroke-width:2.5; paint-order:stroke fill;
  }
  .km-cidade.km-longe .km-nome{ fill:#6d829a; }
  .km-cidade.km-longe{ opacity:.65; }
  .km-alvo .km-ponto{ stroke:#fff; stroke-width:3; }
  /* o pulso é o "você está indo pra cá". Sem ele, a cidade atual some no meio das outras */
  .km-pulso{ opacity:.35; transform-origin:center; animation:km-pulsa 1.6s ease-out infinite; }
  @keyframes km-pulsa{ 0%{ opacity:.45; r:11; } 100%{ opacity:0; r:20; } }
  @media (prefers-reduced-motion:reduce){
    .km-trecho.km-atual, .km-pulso{ animation:none; }
    .km-pulso{ opacity:.3; }
  }
  .kanto-abertura h2{ margin-top:0; }

  /* trilha de insígnias: a leitura linear que o mapa não dá */
  .kanto-trilha{ margin:0 0 14px; }
  .kanto-trilha.compacta{ margin-bottom:10px; }
  .kt-selos{ display:flex; align-items:center; justify-content:center; gap:2px; }
  .kt-selo{
    width:28px; height:28px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:.8rem; border-radius:50%;
    background:var(--kt-cor); border:2px solid var(--box-border);
  }
  /* insígnia que falta some pra escala de cinza em vez de sumir: o lugar dela continua
     na fila, então dá pra contar quantas faltam sem ler número nenhum */
  .kt-selo.falta{ filter:grayscale(1); opacity:.35; }
  .kt-selo.atual{ box-shadow:0 0 0 3px #fff; transform:scale(1.12); }
  .kt-liga{ width:8px; height:3px; background:var(--box-border); opacity:.5; flex-shrink:0; }
  /* etapa cujo caminho ainda não foi escolhido: sem cor de insígnia e com "?" no lugar do símbolo */
  .kt-selo.kt-aberto{ opacity:.55; font-weight:700; }
  /* a trilha fica FORA de qualquer .box, direto sobre o fundo escuro do app -- por isso a
     legenda usa tons claros. Com var(--muted)/var(--ink) ela sumia no próprio fundo. */
  .kt-legenda{ text-align:center; margin-top:6px; font-size:.62rem; font-weight:700; color:#9db4cc; }
  .kt-legenda strong{ color:var(--yellow); }
  @media (max-width:360px){
    .kt-selo{ width:24px; height:24px; font-size:.7rem; }
    .kt-liga{ width:5px; }
  }
  .kanto-abrir{ margin-top:4px; }

  .kanto-diario{ margin-top:10px; }
  .kanto-diario-l{ font-size:.55rem; font-weight:800; color:var(--muted); letter-spacing:.05em; margin-bottom:5px; }
  .kanto-diario-linha{
    display:flex; align-items:center; gap:7px; padding:4px 0;
    font-size:.65rem; font-weight:700; border-top:2px solid var(--box-border);
  }
  .kd-icone{ font-size:.9rem; }
  .kd-nome{ flex:1; min-width:0; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kd-destino{ color:var(--muted); font-size:.6rem; white-space:nowrap; }

  /* ---- LISTA DE AMIGOS ---- */
  /* Uma linha por treinador, como no lobby e pelo mesmo motivo: a lista só serve se der pra ver
     quem está lá sem rolar. A diferença é que aqui a linha tem 4 ações, então elas são quadradas
     e do tamanho do dedo (34px) em vez de rótulos escritos. */
  .friend-lista{display:flex;flex-direction:column;gap:6px;}
  .friend-row{
    display:flex;align-items:center;gap:8px;
    padding:8px 10px;
    background:var(--box);
    border:3px solid var(--box-border);
    border-radius:4px;
  }
  .friend-row.enviando{opacity:.55;}
  .friend-row.pedido{border-left-width:7px;border-left-color:var(--green);}
  .friend-row.confirmando{border-left-width:7px;border-left-color:var(--red);background:#ffefef;}
  .friend-row-info{flex:1;min-width:0;}
  .friend-nome{
    font-family:var(--font-pixel);font-size:.62rem;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .friend-sub{
    display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;
    margin-top:4px;font-size:.6rem;font-weight:700;color:var(--muted);
  }
  .friend-sumiu{font-family:var(--font-ui);font-size:.55rem;color:var(--muted);font-weight:700;}
  .friend-presenca.on{color:var(--green);}
  .friend-presenca.recente{color:var(--ink);}
  .friend-presenca.off{opacity:.7;}
  /* O retrospecto é o número que decide se vale desafiar, então ganha cor: verde quando você está
     na frente, vermelho quando está atrás. Sem confronto nenhum ele fica apagado em vez de "0×0",
     que se lê como empate e não como "nunca jogaram". */
  .fr-h2h{font-weight:800;color:var(--ink);}
  .fr-h2h.ganhando{color:var(--green);}
  .fr-h2h.perdendo{color:var(--red);}
  .fr-h2h.vazio{opacity:.6;font-weight:700;}
  .friend-acoes{display:flex;gap:4px;flex-shrink:0;}
  .friend-btn{
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    font-size:.95rem;line-height:1;
    background:var(--box);
    border:3px solid var(--box-border);
    border-radius:4px;
    box-shadow:2px 2px 0 rgba(0,0,0,.35);
    cursor:pointer;font-family:inherit;
  }
  .friend-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(0,0,0,.35);}
  .friend-btn[disabled]{opacity:.4;cursor:default;box-shadow:none;transform:none;}
  .friend-btn.desafiar{background:#7038f8;color:#fff;}
  .friend-btn.aceitar{background:var(--green);color:#fff;}
  .friend-btn.recusar,.friend-btn.remover{background:#f6dede;}
  .friend-btn.adicionar{background:var(--green);color:#fff;}
  .friend-tag{font-size:.6rem;font-weight:800;color:var(--muted);white-space:nowrap;}
  .friend-tag.ok{color:var(--green);}

  .friend-busca-row{display:flex;gap:6px;margin-bottom:8px;}
  .friend-search-input{
    flex:1;min-width:0;

  .save-slot-card{

  /* o card INTEIRO é o botão de abrir o save (ver openSaveCard). Os controles internos -- renomear,
     favoritar, apagar, ver ginásio -- chamam event.stopPropagation() pra não dispararem a abertura */
  .save-slot-card.clickable{cursor:pointer;}
  /* Cartão da escolha de ginásio. Reaproveita o card de save (mesma moldura, mesmo toque) porque
     é a mesma leitura: um bloco grande e clicável com uma decisão dentro. */
  /* Linha do encontro selvagem. A lupa fica DENTRO do card, flutuando sobre ele: como o card é um
     <button>, ela não pode ser FILHA dele -- <button> dentro de <button> é HTML inválido e o clique
     de dentro se perde. Então ela continua IRMÃ no HTML e volta pra cima do card no position.
     De quebra o clique nela sobrevive ao card desabilitado: descendente de button desabilitado não
     recebe clique nenhum, e é justamente com 2 já escolhidos que dá vontade de consultar o terceiro. */
  .wild-linha{ position:relative; display:flex; flex-direction:column; }  /* flex: impede a margem do card de colapsar pra fora e desalinhar o top:50% */
  .wild-linha .wild-card{ padding-right:46px; }   /* espaço reservado: sem ele, nome comprido passa por baixo da lupa */
  /* O nível anda junto com o travessão. A 320px o nome comprido quebra de linha (já quebrava
     antes da lupa, com os maiores), e sem o nowrap a quebra caía DENTRO do "— Lv.16": sobrava um
     travessão pendurado no fim da primeira linha e um "Lv.16" órfão na segunda. */
  .wild-lv{ white-space:nowrap; }   /* sem fonte nem cor próprias: herda a linha do nome, que é como sempre foi */
  .wild-dex{
    position:absolute; right:9px; top:50%; margin-top:-16px;   /* margem negativa e não translate: o :active já usa o transform */
    width:32px; height:32px; font-size:.95rem; line-height:1;
    background:#fff; border:3px solid var(--box-border); border-radius:3px;
    box-shadow:3px 3px 0 var(--box-border); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .wild-dex:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--box-border); }
  .time-modal-lista{ display:flex; flex-direction:column; gap:6px; margin:8px 0 12px; }

  .time-modal-sprite{ flex-shrink:0; }
  /* text-align:left explicito: o .modal-box centraliza, e o nome ficava centralizado sobre
     uma linha de baixo alinhada a esquerda */
  .time-modal-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; text-align:left; }

  .gym-choice-card{ padding:11px 13px; position:relative; }
  /* a região fica no canto, fora do fluxo: é etiqueta, não conteúdo -- e assim o nome do líder
     pode ficar centralizado de verdade, sem ser empurrado por ela */
  .gym-choice-regiao{
    position:absolute; top:9px; right:11px;
    font-family:var(--font-pixel); font-size:.55rem; letter-spacing:.05em; color:var(--muted);
  }
  .gym-choice-corpo{ display:flex; align-items:center; gap:8px; }
  /* 58px pra insígnia de 52: cada pixel a mais aqui sai do nome do líder, que é centrado
     reservando o MESMO espaço do outro lado. Com 64 o "Lt. Surge" quebrava em duas linhas a 320px. */
  .gym-choice-selo-col{ display:flex; flex-direction:column; align-items:center; gap:3px; flex-shrink:0; width:58px; }
  .gym-choice-selo-nome{ font-size:.6rem; font-weight:800; color:var(--muted); text-align:center; line-height:1.15; }
  /* a margem da direita espelha a coluna da insígnia (58 + 8 de gap): sem ela o "centro" é o
     centro do espaço que SOBROU, e o nome nascia 37px à direita do centro do card */
  .gym-choice-info{ flex:1; min-width:0; text-align:center; margin-right:66px; }
  .gym-choice-lider{ font-family:var(--font-pixel); font-size:.82rem; color:var(--ink); line-height:1.3; }
  .gym-choice-tipo{ margin:5px 0 3px; }
  .gym-choice-cidade{ font-size:.75rem; font-weight:800; color:var(--blue-dark); }
  /* Os dois caminhos do trecho, um por linha, DENTRO da coluna centralizada. Como linha própria
     embaixo do corpo (a primeira versão) eles viravam um rodapé solto encostado na borda esquerda,
     e a insígnia deixava de cobrir a altura do card.
     Um por linha, e não "A ou B" na mesma linha: a coluna tem 132px a 320px e a frase inteira mede
     ~200, então quebraria no meio de um nome. Medido: o mais largo dos 32 caminhos ("Desvio por
     Lavender") dá 126px -- todos cabem numa linha só. */
  .gym-choice-rotas{ margin-top:7px; }
  .gym-choice-rotas-titulo{ display:block; font-size:.55rem; font-weight:800; letter-spacing:.06em; color:var(--muted); }
  .gym-choice-rota{ display:block; font-size:.68rem; font-weight:600; color:var(--muted); line-height:1.35; }
  /* insígnia da tela de escolha: maior que a do cinturão, menor que a da vitória */
  .badge-visual.gc{ width:52px; height:52px; }
  .badge-visual.gc .badge-visual-img, .badge-visual.gc .badge-visual-fallback{ width:52px; height:52px; font-size:1.5rem; }
  .save-slot-card.clickable:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.4);}
  .save-slot-empty-team{font-size:.75rem;color:var(--muted);margin:2px 0 0;}
  /* Faixa de estado no rodapé do card. As cores são as MESMAS dos antigos botões de continuar
     (.save-slot-continue e suas variantes) -- a faixa herdou o papel deles de sinalizar o estado, então
     herda também o código de cores, senão o jogador teria que reaprender o significado.
     As margens negativas sangram a faixa até as bordas internas do card (que tem padding 9px 13px),
     dando o visual de rodapé em vez de caixinha solta. Se o padding do card mudar, estes valores
     precisam mudar junto.
     clamp() no tamanho da fonte: o texto mais longo ("Jornada encerrada com vitória sobre a Elite 4!")
     tem que caber num celular de 320px sem virar três linhas, e não ficar minúsculo num tablet. */
  .save-slot-status{
    margin:8px -13px -9px;
    padding:5px 10px;
    border-top:2px solid var(--box-border);
    border-radius:0 0 2px 2px;
    text-align:center;
    font-weight:800;
    font-size:clamp(.6rem, 2.8vw, .72rem);
    line-height:1.25;
    color:#fff;
    overflow-wrap:break-word;
  }
  .save-slot-status.andamento{background:var(--blue);}
  .save-slot-status.elite{background:var(--red);}
  .save-slot-status.encerrada{background:#595959;}
  .save-slot-status.campeao{background:var(--yellow);color:#000;}
  .save-slot-card.favorited{border-color:var(--blue-dark);}
  .save-slot-card.empty{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-style:dashed;
    box-shadow:none;
    background:rgba(254,251,240,.07);
    border-color:#5c6089;
    cursor:pointer;
  }
  .save-slot-empty-text{font-size:.8rem;font-weight:700;color:#c7cae8;}
  .save-slot-add{font-family:var(--font-ui);font-weight:800;font-size:.8rem;color:#89aaff;}
  .save-slot-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;position:relative;}
  /* recuo pro selo da média, que está fora do fluxo (ver .team-avg-star). Só quando ele existe --
     save sem time nenhum não tem selo e não deve ficar com um vão à esquerda */
  .save-slot-card.has-avg-star .save-slot-top{padding-left:36px;}
  .save-slot-name{font-size:.9rem;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px;min-width:0;}
  /* Média de nível do time dentro de uma estrela.
     Desenhada em SVG, e não com clip-path: recorte não arredonda canto nenhum, e a estrela ficava
     angulosa demais. Aqui é UM caminho só com traço de junta redonda (stroke-linejoin:round), que
     arredonda as pontas E as reentrâncias de uma vez, mais paint-order:stroke pra o traço ser
     desenhado POR BAIXO do preenchimento -- assim ele engrossa pra fora sem comer o amarelo.
     A estrela é "gordinha" porque o raio interno é ~60% do externo (uma estrela clássica usa ~38%);
     é isso que abre espaço pro número no meio. */
  .team-avg-star{
    /* selo do CARD, não do nome: ancorado no canto superior esquerdo, DENTRO da área do card. Fica
       fora do fluxo, então o nome do time não é empurrado nem encolhe por causa dela -- só ganha um
       recuo (ver .save-slot-top) pra não passar por baixo.
       Sem rotação e sem transbordar a borda de propósito: encostar na borda deixa o card sujo, e o
       selo torto brigava com o alinhamento de todo o resto da tela */
    position:absolute;
    /* ancorada na LINHA do topo (.save-slot-top é position:relative), não no card: assim ela fica
       centrada com o nome mesmo que a altura da linha mude por causa dos botões de favoritar/apagar */
    top:50%; left:0; transform:translateY(-50%);
    display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;
    z-index:2;
    pointer-events:none; /* é decoração: não deve interceptar clique de nada que passe por baixo */
  }
  .team-avg-star svg{position:absolute;inset:0;width:100%;height:100%;}
  .team-avg-star-num{
    position:relative;z-index:1;
    font-size:.55rem;font-weight:800;color:var(--box-border);line-height:1;
    /* o centro ÓPTICO da estrela fica abaixo do geométrico (o corpo largo está na metade de cima) */
    margin-top:2px;
  }
  .team-avg-star-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .save-slot-rename{background:none;border:none;cursor:pointer;font-size:.8rem;padding:2px 3px;opacity:.75;vertical-align:middle;}
  .save-slot-rename:active{transform:translate(1px,1px);}
  .save-slot-actions{display:flex;gap:5px;flex-shrink:0;align-items:center;}
  /* rótulo do empréstimo do Mewtwo, na linha de ações. Discreto: é um aviso de prazo, não uma
     conquista -- não deve competir com o nome do time nem com os sprites */
  .save-slot-mewtwo{
    font-size:.62rem;font-weight:800;color:var(--muted);
    white-space:nowrap;margin-right:2px;
  }
  /* em tela bem estreita (320px) o rótulo espremia o nome do time. Nesse caso ele desce pra a
     linha de baixo, alinhado à direita, em vez de apertar tudo */
  @media (max-width:360px){
    .save-slot-top{flex-wrap:wrap;}
    .save-slot-mewtwo{
      order:10;width:100%;text-align:right;
      margin:4px 0 0;
