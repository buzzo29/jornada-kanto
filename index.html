const TRAINERS_LEAGUE_LOCK_HOUR = 11, TRAINERS_LEAGUE_LOCK_MIN = 0;
const TRAINERS_LEAGUE_START_HOUR = 11, TRAINERS_LEAGUE_START_MIN = 30;
const TRAINERS_LEAGUE_ROUND_MS = 30 * 60 * 1000;
const TRAINERS_LEAGUE_MAX_PLAYERS = 16;

function trainersLeagueCycleRef(dateId){ return db.collection('trainersLeagueCycles').doc(dateId); }
function trainersLeagueRegistrantsRef(dateId){ return trainersLeagueCycleRef(dateId).collection('registrants'); }
function trainersLeagueRegistrantRef(dateId, uid){ return trainersLeagueRegistrantsRef(dateId).doc(uid); }
// escolha de terreno (só o mandante grava) e troca de time por rodada (cada jogador grava a própria) --
// em sub-coleções separadas, uma por jogador, em vez de campos dentro do scheduleRounds: o Firestore não
// permite atualizar um elemento específico de um array aninhado sem reescrever o documento inteiro, o
// que criaria corrida entre dois jogadores mexendo ao mesmo tempo. Cada jogador só grava o próprio doc.
function trainersLeagueTerrainPicksRef(dateId){ return trainersLeagueCycleRef(dateId).collection('terrainPicks'); }
function trainersLeagueTerrainPickRef(dateId, uid){ return trainersLeagueTerrainPicksRef(dateId).doc(uid); }
function trainersLeagueTeamPicksRef(dateId){ return trainersLeagueCycleRef(dateId).collection('teamPicks'); }
function trainersLeagueTeamPickRef(dateId, uid){ return trainersLeagueTeamPicksRef(dateId).doc(uid); }
const TRAINERS_LEAGUE_TEAM_SWAP_DEADLINE_MS = 5 * 60 * 1000;
const TRAINERS_LEAGUE_TERRAIN_PICK_DEADLINE_MS = 10 * 60 * 1000;
const TRAINERS_LEAGUE_CLAIM_LEASE_MS = 2 * 60 * 1000; // prazo de validade da trava de processamento -- ver trainersLeagueClaim
// junta as duas formas possíveis do mapa por rodada: o formato CERTO (mapa aninhado, ex:
// overrides: {"5": code}) e o formato acidental antigo (campo com nome literal "overrides.5" no topo
// do documento). O acidente: set() com merge NÃO interpreta ponto como caminho aninhado -- isso é
// exclusivo do update(). As primeiras gravações usavam set com chave pontuada e criaram campos
// literais; esse normalizador resgata essas escolhas já feitas em vez de descartá-las
function extractRoundKeyedMap(docData, mapField){
  const out = {};
  if(docData && docData[mapField] && typeof docData[mapField] === 'object'){ Object.assign(out, docData[mapField]); }
  if(docData){
    for(const k of Object.keys(docData)){
      if(k.startsWith(mapField + '.')){ out[k.slice(mapField.length + 1)] = docData[k]; }
    }
  }
  return out;
}


// --- utilitários de tempo: tudo calculado no fuso de Brasília, de forma explícita, independente de
// onde o código roda (navegador do jogador em qualquer fuso, ou a Cloud Function) ---
function trainersLeagueTimeOnDate(dateStr, hour, minute){
  const hh = String(hour).padStart(2,'0');
  const mm = String(minute||0).padStart(2,'0');
  return new Date(`${dateStr}T${hh}:${mm}:00${TRAINERS_LEAGUE_TZ_OFFSET}`).getTime();
}
function trainersLeagueDateStrFromTime(timeMs){
  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit' });
  return fmt.format(new Date(timeMs));
}
function trainersLeagueTodayDateStr(){ return trainersLeagueDateStrFromTime(Date.now()); }
function trainersLeagueDateStrPlusDays(dateStr, days){
  const t = trainersLeagueTimeOnDate(dateStr, 12, 0); // meio-dia evita qualquer problema de borda
  return trainersLeagueDateStrFromTime(t + days*24*60*60*1000);
}
// qual ciclo (dateId) está com inscrição aberta ou prestes a abrir agora
function trainersLeagueActiveDateId(){
  const todayStr = trainersLeagueTodayDateStr();
  const now = Date.now();
  const lockTime = trainersLeagueTimeOnDate(todayStr, TRAINERS_LEAGUE_LOCK_HOUR, TRAINERS_LEAGUE_LOCK_MIN);
  if(now < lockTime){ return todayStr; } // dentro da janela de inscrição de hoje (até a trava das 11h)
  return trainersLeagueDateStrPlusDays(todayStr, 1); // depois da trava de hoje -- inscrições vão pra amanhã
}
// a inscrição de um dia só abre quando a liga do dia ANTERIOR não está mais pendente/rodando:
// terminou (complete), nunca virou liga (ficou em 'registering' até depois da própria trava, ex:
// menos de 2 inscritos), ou nem existiu. Enquanto a liga anterior roda, inscrever pro dia seguinte
// fica bloqueado -- é exatamente o "abre logo após acabar o campeonato do dia"
async function trainersLeaguePrevDayDone(targetDateId){
  const prevId = trainersLeagueDateStrPlusDays(targetDateId, -1);
  try{
    const snap = await trainersLeagueCycleRef(prevId).get();
    if(!snap.exists) return true;
    const st = snap.data().status;
    if(st === 'complete' || st === 'cancelled') return true;
    if(st === 'registering' && Date.now() >= trainersLeagueTimeOnDate(prevId, TRAINERS_LEAGUE_LOCK_HOUR, TRAINERS_LEAGUE_LOCK_MIN)) return true;
    return false; // locking/locked/active/advancing = liga anterior ainda em andamento
  } catch(e){ console.error('Erro ao checar a liga do dia anterior:', e); return true; } // na dúvida, não bloqueia
}

// --- algoritmo de rodízio (método do círculo): gera N-1 rodadas (N par) onde todo mundo enfrenta todo
// mundo exatamente uma vez. Se N for ímpar, entra um "bye" (folga) por rodada
function buildRoundRobinSchedule(players){
  const list = players.slice();
  if(list.length % 2 !== 0) list.push(null);
  const n = list.length;
  if(n < 2) return [];
  const numRounds = n - 1;
  // 1) gera os CONFRONTOS (quem joga com quem) pelo método do círculo -- só decide os pares, ainda
  // sem mandante/visitante definido
  const roundsPairs = [];
  let arr = list.slice();
  for(let r=0; r<numRounds; r++){
    const roundPairs = [];
    for(let i=0; i<n/2; i++){
      const p1 = arr[i], p2 = arr[n-1-i];
      if(p1 && p2){ roundPairs.push([p1, p2]); }
    }
    roundsPairs.push(roundPairs);
    const fixed = arr[0];
    const rest = arr.slice(1);
    rest.unshift(rest.pop());
    arr = [fixed, ...rest];
  }
  // 2) decide quem é mandante em cada confronto -- guloso: em cada partida, vira mandante quem tiver
  // MENOS jogos como mandante até agora (desempate: quem tiver MAIS jogos como visitante até agora).
  // O método do círculo puro deixa um jogador ("fixo") mandante em 100% dos jogos dele -- esse passo
  // evita isso, sem mudar quem joga contra quem
  const homeCount = {}, awayCount = {};
  players.forEach(p=>{ homeCount[p.uid]=0; awayCount[p.uid]=0; });
  const rounds = roundsPairs.map(roundPairs => ({
    matches: roundPairs.map(([p1,p2])=>{
      let home, away;
      if(homeCount[p1.uid] < homeCount[p2.uid]) { home=p1; away=p2; }
      else if(homeCount[p2.uid] < homeCount[p1.uid]) { home=p2; away=p1; }
      else if(awayCount[p1.uid] > awayCount[p2.uid]) { home=p1; away=p2; }
      else if(awayCount[p2.uid] > awayCount[p1.uid]) { home=p2; away=p1; }
      else { home=p1; away=p2; }
      homeCount[home.uid]++; awayCount[away.uid]++;
      return { a:home, b:away, winner:null, matchups:null, resolved:false, terrain:null };
    })
  }));
  // 3) polimento: passa de novo trocando mandante/visitante de uma partida sempre que isso reduz o
  // desbalanço total dos dois jogadores envolvidos -- o guloso sozinho já ajuda bastante, mas essa
  // passada extra (poucas iterações, sempre convergindo) deixa a diferença em no máximo ~1-2 jogos
  let improved = true, iterations = 0;
  while(improved && iterations < 200){
    improved = false; iterations++;
    for(const round of rounds){
      for(const m of round.matches){
        const beforeA = Math.abs(homeCount[m.a.uid]-awayCount[m.a.uid]);
        const beforeB = Math.abs(homeCount[m.b.uid]-awayCount[m.b.uid]);
        homeCount[m.a.uid]--; awayCount[m.b.uid]--;
        homeCount[m.b.uid]++; awayCount[m.a.uid]++;
        const afterA = Math.abs(homeCount[m.a.uid]-awayCount[m.a.uid]);
        const afterB = Math.abs(homeCount[m.b.uid]-awayCount[m.b.uid]);
        if((afterA+afterB) < (beforeA+beforeB)){
          const tmp = m.a; m.a = m.b; m.b = tmp;
          improved = true;
        } else {
          homeCount[m.a.uid]++; awayCount[m.b.uid]++;
          homeCount[m.b.uid]--; awayCount[m.a.uid]--;
        }
      }
    }
  }
  return rounds;
}

function resolveTrainersLeagueMatch(match, seedStr){
  const rng = makeSeededRng(seedStr);
  const teamA = decodeTeamCode(match.a.code);
  const teamB = decodeTeamCode(match.b.code);
  if(!teamA || !teamB){
    match.winner = teamA ? match.a : match.b;
    match.resolved = true;
    match.matchups = [];
    return;
  }
  if(match.terrain){
    const terrain = TERRAINS.find(t=>t.id===match.terrain.id);
    if(terrain){ applyTerrainBuff(teamA, terrain); applyTerrainBuff(teamB, terrain); }
  }
  // mesma regra do servidor: especialidade vem CONGELADA no registro do jogador, não lida agora
  applySpecialtyBuff(teamA, (match.a && match.a.specialties) || []);
  applySpecialtyBuff(teamB, (match.b && match.b.specialties) || []);
  const result = simulateGymBattle(teamA, teamB, rng);
  match.matchups = result.matchups;
  match.winner = result.win ? match.a : match.b;
  match.resolved = true;
}

// classificação: vitórias primeiro; empate em vitórias é desempatado por confronto direto (se um dos
// empatados venceu o outro); se ainda empatado, dividem a mesma posição -- não existe partida empatada
// (o sistema de batalha já garante um vencedor sempre), só é possível dois treinadores terminarem o dia
// com o mesmo total de vitórias
function computeTrainersLeagueStandings(players, scheduleRounds){
  const stats = {};
  players.forEach(p=>{ stats[p.uid] = { uid:p.uid, name:p.name, slot:p.slot, elite: !!p.elite, wins:0, losses:0, played:0, headToHead:{} }; });
  (scheduleRounds||[]).forEach(round=>{
    round.matches.forEach(match=>{
      if(!match.resolved || !match.a || !match.b || !match.winner) return;
      const winnerUid = match.winner.uid;
      const loserUid = (match.a.uid===winnerUid) ? match.b.uid : match.a.uid;
      if(stats[winnerUid]){ stats[winnerUid].wins++; stats[winnerUid].played++; stats[winnerUid].headToHead[loserUid]='W'; }
      if(stats[loserUid]){ stats[loserUid].losses++; stats[loserUid].played++; stats[loserUid].headToHead[winnerUid]='L'; }
    });
  });
  const list = Object.values(stats);
  list.sort((x,y)=>{
    if(y.wins !== x.wins) return y.wins - x.wins;
    if(x.headToHead[y.uid]==='W') return -1;
    if(y.headToHead[x.uid]==='W') return 1;
    return x.name.localeCompare(y.name); // desempate final só pra ordem estável, não afeta a colocação exibida
  });
  // atribui a posição (rank) -- treinadores realmente empatados (mesmas vitórias, sem confronto direto
  // que desempate) dividem a mesma posição
  let rank = 1;
  list.forEach((entry, idx)=>{
    if(idx>0){
      const prev = list[idx-1];
      const trulyTied = prev.wins===entry.wins && prev.headToHead[entry.uid]!=='W' && entry.headToHead[prev.uid]!=='W';
      if(!trulyTied){ rank = idx+1; }
    }
    entry.rank = rank;
  });
  return list;
}

// DESEMPATE NO TOPO: quando o dia acaba com 2+ treinadores empatados em 1º (mesmas vitórias, sem
// confronto direto que resolva), monta um mini-campeonato SÓ entre os empatados -- cada par joga uma
// vez, terreno sorteado por partida -- e usa o resultado desse mini-campeonato pra decidir quem fica
// com o rank 1 sozinho. Quem "perde" o desempate sobe pros ranks seguintes na ordem que ficou lá.
function buildTrainersLeagueTiebreak(dateId, players, standings){
  // empate de verdade = MESMO número de vitórias no topo -- não usa s.rank aqui de propósito: como
  // todo mundo joga contra todo mundo, o desempate por confronto direto (já usado pra ordenar a
  // classificação) sempre decide o rank entre 2 jogadores específicos que se enfrentaram, então nunca
  // haveria empate de rank de verdade pra detectar. Quem "empatou" pra fins de campeonato é quem tem
  // o mesmo total de vitórias do líder, ignorando o que o confronto direto já decidiu silenciosamente
  if(!standings.length) return null;
  const topWins = standings[0].wins;
  const topTied = standings.filter(s=>s.wins === topWins);
  if(topTied.length <= 1) return null;
  const tiedPlayers = topTied.map(t=>{
    // sorteia um time elegível pra decidir o desempate -- não existe mais time "padrão" da inscrição,
    // então quem empatou joga o desempate com um dos times prontos dele, sorteado de forma determinística
    const p = players.find(pp=>pp.uid===t.uid);
    const eligible = (p && p.eligibleCodes) ? p.eligibleCodes : [];
    const rng = makeSeededRng(`trainers-tiebreak-team-${dateId}-${t.uid}`);
    const code = eligible.length>0 ? eligible[Math.floor(rng()*eligible.length)] : null;
    return { uid:t.uid, name:t.name, code };
  });
  const miniRounds = buildRoundRobinSchedule(tiedPlayers);
  miniRounds.forEach((round, ri)=>{
    round.matches.forEach((match, mi)=>{
      const rng = makeSeededRng(`trainers-tiebreak-${dateId}-R${ri}-M${mi}`);
      const terrain = pickTerrain(rng, null);
      match.terrain = { id: terrain.id, name: terrain.name, icon: terrain.icon, types: terrain.types };
      if(match.a.code && match.b.code){
        resolveTrainersLeagueMatch(match, `trainers-tiebreak-match-${dateId}-R${ri}-${match.a.uid}-${match.b.uid}`);
      } else {
        // sem time válido pra decidir -- não deveria acontecer (quem chega no topo já jogou a
        // temporada inteira com time válido), mas não trava o encerramento da liga por segurança
        match.winner = match.a.code ? match.a : match.b;
        match.resolved = true; match.matchups = [];
      }
    });
  });
  return { players: tiedPlayers, scheduleRounds: miniRounds };
}
// aplica um desempate JÁ CALCULADO (vindo do documento salvo) sobre a classificação atual -- usado toda
// vez que a tela precisa mostrar a colocação final, sem precisar rejogar o desempate de novo
function applyTrainersLeagueTiebreak(standings, tiebreak){
  if(!tiebreak || !tiebreak.scheduleRounds) return standings;
  const miniStandings = computeTrainersLeagueStandings(tiebreak.players, tiebreak.scheduleRounds);
  const order = {};
  miniStandings.forEach((s, idx)=>{ order[s.uid] = idx; });
  standings.forEach(s=>{ if(order[s.uid] !== undefined){ s.rank = 1 + order[s.uid]; } });
  standings.sort((a,b)=>a.rank-b.rank);
  return standings;
}
// classificação final pronta pra exibir/gravar -- já com o desempate aplicado, se tiver acontecido
function computeTrainersLeagueStandingsFinal(data){
  const standings = computeTrainersLeagueStandings(data.players, data.scheduleRounds);
  return applyTrainersLeagueTiebreak(standings, data.tiebreak);
}

async function trainersLeagueEnsureCycleDoc(dateId){
  try{
    const ref = trainersLeagueCycleRef(dateId);
    const snap = await ref.get();
    if(!snap.exists){ await ref.set({ dateId, status:'registering', createdAt: Date.now() }, { merge:true }); }
  } catch(e){ console.error('Erro ao preparar o ciclo do Trainers League:', e); }
}

async function trainersLeagueClaim(dateId, fromStatus, toStatus){
  try{
    return await db.runTransaction(async (tx)=>{
      const ref = trainersLeagueCycleRef(dateId);
      const snap = await tx.get(ref);
      if(!snap.exists) return false;
      const data = snap.data();
      // trava com prazo de validade: se o status já está no estado transitório que essa operação
      // criaria (ex: 'advancing' quando alguém tenta avançar) mas a trava é VELHA (mais de 2min),
      // quem segurava morreu no meio (aba fechada, rede caiu) -- pode roubar e refazer. Sem isso, uma
      // aba que morre no meio do avanço deixa a liga presa em 'advancing' PRA SEMPRE, porque todo
      // mundo só consegue pegar a trava a partir de 'locked'/'active'. Roubo só do MESMO estado
      // transitório de propósito -- um avanço nunca rouba um 'locking' morto (pularia a trava de
      // inscrições com o chaveamento ainda não montado)
      const staleClaim = data.status === toStatus &&
        (!data.claimedAt || (Date.now() - data.claimedAt) > TRAINERS_LEAGUE_CLAIM_LEASE_MS);
      if(data.status !== fromStatus && !staleClaim) return false;
      tx.set(ref, { status: toStatus, claimedAt: Date.now() }, { merge:true });
      return true;
    });
  } catch(e){ console.warn('trainersLeagueClaim falhou (provavelmente outro processo já pegou):', e.message); return false; }
}

async function trainersLeagueDoLock(dateId){
  const claimed = await trainersLeagueClaim(dateId, 'registering', 'locking');
  if(!claimed) return false;
  try{
    const regSnap = await trainersLeagueRegistrantsRef(dateId).get();
    const registrants = regSnap.docs.map(d=>d.data());
    const ordered = registrants.slice().sort((a,b)=>(a.registeredAt||0)-(b.registeredAt||0));
    const selected = ordered.slice(0, TRAINERS_LEAGUE_MAX_PLAYERS);
    const overflow = ordered.slice(TRAINERS_LEAGUE_MAX_PLAYERS);

    const players = selected.map(r=>({ uid:r.uid, name:r.name, eligibleCodes:r.eligibleCodes||[], specialties:r.specialties||[], mewtwoTeamCode:r.mewtwoTeamCode||null }));
    const shuffled = shuffleWithSeed(players, `trainers-${dateId}`);
    const scheduleRounds = buildRoundRobinSchedule(shuffled);
    const numRounds = scheduleRounds.length;
    const normalStartTime = trainersLeagueTimeOnDate(dateId, TRAINERS_LEAGUE_START_HOUR, TRAINERS_LEAGUE_START_MIN);
    const startTime = Math.max(normalStartTime, Date.now()); // se a trava acontecer atrasada (por qualquer motivo), começa a 1ª rodada AGORA em vez de um horário que já passou -- evita resolver várias rodadas atrasadas de uma vez só
    const roundTimes = [];
    for(let i=0;i<numRounds;i++){ roundTimes.push(startTime + i*TRAINERS_LEAGUE_ROUND_MS); }

    // terreno NÃO é sorteado aqui mais -- cada mandante escolhe o dele (até 10min antes do confronto);
    // quem não escolher a tempo recebe sorteio automático dentro de trainersLeagueAdvanceRounds, perto
    // do horário do confronto

    await trainersLeagueCycleRef(dateId).set({
      dateId, status: numRounds>0 ? 'locked' : 'complete',
      players, scheduleRounds, roundTimes, currentRound: 0,
      lockedAt: Date.now(), updatedAt: Date.now()
    }, { merge:true });

    const nextDateId = trainersLeagueDateStrPlusDays(dateId, 1);
    await trainersLeagueEnsureCycleDoc(nextDateId);
    for(const p of overflow){
      await trainersLeagueRegistrantRef(nextDateId, p.uid).set(p, { merge:true });
    }
    return true;
  } catch(e){
    console.error('Erro ao travar/sortear o Trainers League:', e);
    await trainersLeagueClaim(dateId, 'locking', 'registering');
    return false;
  }
}

// checagem BARATA (só leitura, sem transação) se tem trabalho de verdade pra fazer agora -- terreno
// pra finalizar, partida pra resolver, ou o dia inteiro pronto pra fechar mas ainda não marcado como
// 'complete'. Usa continue em vez de break de propósito (mais seguro que a otimização por ordem que o
// corpo da função usa) -- é só leitura em memória, custo irrelevante, e nunca arrisca falso negativo
function trainersLeagueHasPendingWork(data){
  if(!data || !data.scheduleRounds || !data.roundTimes) return false;
  const now = Date.now();
  let anyUnresolved = false;
  for(let ri=0; ri<data.scheduleRounds.length; ri++){
    const round = data.scheduleRounds[ri];
    const roundTime = data.roundTimes[ri];
    if(roundTime==null || !round || !round.matches) continue;
    for(const match of round.matches){
      if(!match.resolved){
        anyUnresolved = true;
        if(now >= roundTime) return true;
      }
      if(!match.terrain && now >= roundTime - TRAINERS_LEAGUE_TERRAIN_PICK_DEADLINE_MS) return true;
    }
  }
  if(!anyUnresolved && data.status !== 'complete') return true; // tudo resolvido, só falta fechar o dia
  return false;
}
async function trainersLeagueAdvanceRounds(dateId){
  // evita disputar a trava (que é uma transação de ESCRITA) no documento compartilhado quando não há
  // nada pra fazer -- sem isso, cada cliente com a tela aberta tentava uma transação a cada 5s mesmo
  // no meio do intervalo entre rodadas, quando não existe trabalho nenhum
  try{
    const precheckSnap = await trainersLeagueCycleRef(dateId).get();
    if(!precheckSnap.exists) return false;
    if(!trainersLeagueHasPendingWork(precheckSnap.data())) return false;
  } catch(e){ console.error('Erro na checagem prévia do Trainers League:', e); }
  let claimed = await trainersLeagueClaim(dateId, 'locked', 'advancing');
  if(!claimed) claimed = await trainersLeagueClaim(dateId, 'active', 'advancing');
  if(!claimed) return false;
  try{
    const ref = trainersLeagueCycleRef(dateId);
    const snap = await ref.get();
    if(!snap.exists) return false;
    const data = snap.data();
    const now = Date.now();

    // 1) finaliza o terreno de toda partida cujo prazo do mandante (10min antes) já passou e ainda não
    // tem terreno definido -- usa a escolha dele se ele fez uma a tempo, senão sorteia (como sempre foi)
    for(let ri=0; ri<(data.scheduleRounds||[]).length; ri++){
      if(now < data.roundTimes[ri] - TRAINERS_LEAGUE_TERRAIN_PICK_DEADLINE_MS) break;
      const round = data.scheduleRounds[ri];
      for(let mi=0; mi<round.matches.length; mi++){
        const match = round.matches[mi];
        if(match.terrain) continue;
        let chosen = null;
        try{
          const pickSnap = await trainersLeagueTerrainPickRef(dateId, match.a.uid).get();
          const picks = extractRoundKeyedMap(pickSnap.exists ? pickSnap.data() : null, 'picks');
          const terrainId = picks[String(ri)];
          if(terrainId){ chosen = TERRAINS.find(t=>t.id===terrainId) || null; }
        } catch(e){ console.error('Erro ao ler escolha de terreno do mandante:', e); }
        if(!chosen){
          const rng = makeSeededRng(`trainers-terrain-${dateId}-R${ri}-M${mi}`);
          chosen = pickTerrain(rng, null);
        }
        match.terrain = { id: chosen.id, name: chosen.name, icon: chosen.icon, types: chosen.types };
      }
    }

    // 2) resolve as partidas cujo horário já chegou -- antes de resolver, busca o time mais recente de
    // cada jogador pra essa rodada específica (pode ter trocado até 5min antes); sem troca, usa o time
    // padrão da inscrição (já em match.a.code/match.b.code desde a trava). O código efetivamente usado
    // fica gravado na partida pra sempre -- histórico fiel do time que realmente batalhou
    for(let ri=0; ri<(data.scheduleRounds||[]).length; ri++){
      if(now < data.roundTimes[ri]) break;
      const round = data.scheduleRounds[ri];
      for(const match of round.matches){
        if(!match.resolved){
          for(const side of ['a','b']){
            let code = null;
            try{
              const pickSnap = await trainersLeagueTeamPickRef(dateId, match[side].uid).get();
              const overrides = extractRoundKeyedMap(pickSnap.exists ? pickSnap.data() : null, 'overrides');
              code = overrides[String(ri)] || null;
            } catch(e){ console.error('Erro ao ler troca de time da rodada:', e); }
            if(!code){
              // ninguém trocou pra essa rodada -- sorteia entre os times elegíveis do jogador (mesma
              // ideia do terreno sorteado quando o mandante não escolhe a tempo)
              const playerInfo = (data.players||[]).find(p=>p.uid===match[side].uid);
              // o time com o Mewtwo (se ativado pro dia) entra no MESMO sorteio que os times normais --
              // "disponível o dia todo" significa que qualquer rodada sem escolha manual pode puxar ele
              const eligible = (playerInfo && playerInfo.eligibleCodes) ? playerInfo.eligibleCodes.slice() : [];
              if(playerInfo && playerInfo.mewtwoTeamCode){ eligible.push(playerInfo.mewtwoTeamCode); }
              if(eligible.length>0){
                const rng = makeSeededRng(`trainers-randomteam-${dateId}-R${ri}-${match[side].uid}`);
                code = eligible[Math.floor(rng()*eligible.length)];
              }
            }
            if(code){ match[side].code = code; }
          }
          resolveTrainersLeagueMatch(match, `trainers-match-${dateId}-R${ri}-${match.a.uid}-${match.b.uid}`);
        }
      }
    }
    const allDone = (data.scheduleRounds||[]).every(round => round.matches.every(m=>m.resolved));
    data.status = allDone ? 'complete' : 'active';
    data.updatedAt = Date.now();
    let finalStandings = null;
    if(allDone){
      // acabou o dia -- se tiver empate no topo, resolve com uma batalha de desempate ANTES de gravar
      let standings = computeTrainersLeagueStandings(data.players, data.scheduleRounds);
      const tiebreak = buildTrainersLeagueTiebreak(dateId, data.players, standings);
      if(tiebreak){
        data.tiebreak = tiebreak;
        standings = applyTrainersLeagueTiebreak(standings, tiebreak);
      }
      finalStandings = standings;
    }
    await ref.set(data, { merge:false });
    if(allDone && finalStandings){
      for(const champ of finalStandings.filter(s=>s.rank===1)){
        await recordLeagueChampionWin(champ.name, champ.uid, TRAINERS_LEAGUE_TYPE);
      }
    }
    return true;
  } catch(e){
    console.error('Erro ao avançar rodadas do Trainers League:', e);
    await trainersLeagueClaim(dateId, 'advancing', 'locked');
    return false;
  }
}

async function checkAndAdvanceTrainersLeague(dateId){
  // ponto único chamado pelo cliente (e pela Cloud Function) pra empurrar o ciclo de hoje adiante,
  // conforme os horários forem passando -- ninguém precisa fazer nada manualmente
  try{
    await trainersLeagueEnsureCycleDoc(dateId);
    const snap = await trainersLeagueCycleRef(dateId).get();
    if(!snap.exists) return;
    const data = snap.data();
    const now = Date.now();
    const lockTime = trainersLeagueTimeOnDate(dateId, TRAINERS_LEAGUE_LOCK_HOUR, TRAINERS_LEAGUE_LOCK_MIN);
    // estados transitórios ('locking'/'advancing') TAMBÉM chamam a operação correspondente -- é dentro
    // dela (no trainersLeagueClaim) que mora a decisão de roubar ou não uma trava vencida. Sem isso,
    // uma liga presa em 'advancing' (processo morto no meio) ficava presa PRA SEMPRE: o porteiro aqui
    // via o status transitório, não chamava nada, e o código de recuperação nunca era alcançado
    if((data.status==='registering' || data.status==='locking') && now >= lockTime){
      await trainersLeagueDoLock(dateId);
      return;
    }
    if(data.status==='locked' || data.status==='active' || data.status==='advancing'){
      await trainersLeagueAdvanceRounds(dateId);
    }
  } catch(e){
    // sem isso, um erro aqui (ex: permissão faltando) virava um "Uncaught (in promise)" repetido a
    // cada 5 segundos pra sempre, já que essa função roda no intervalo de verificação periódica
    console.error('Erro ao verificar/avançar o Trainers League:', e);
  }
}

async function registerForTrainersLeague(){
  if(!game.authUser){ game.trainersLeagueError = 'Você precisa estar logado.'; render(); return; }
  const name = (game.trainerName || '').trim();
  if(!name){ game.trainersLeagueError = 'Sua conta não tem um nome de treinador definido.'; render(); return; }
  // não pede pra escolher UM time -- reúne todos os times prontos (8 insígnias) que a conta tem agora.
  // Cada partida usa o time trocado especificamente pra ela (até 5min antes); sem troca, sorteia entre
  // esses times elegíveis na hora de resolver (mesma ideia do terreno sorteado quando ninguém escolhe)
  const eligibleCodes = Array.from({length:MAX_SAVE_SLOTS}, (_, i) => i)
    .map(slot => game.saveSlots[slot])
    .filter(s => s && s.team && (s.badgeCount||0) >= 8)
    .map(s => encodeTeamCode(s.team));
  if(eligibleCodes.length === 0){
    game.trainersLeagueError = 'Você precisa de pelo menos um time com as 8 insígnias pra se inscrever.';
    render();
    return;
  }
  const dateId = trainersLeagueActiveDateId();
  const now = Date.now();
  const lockTime = trainersLeagueTimeOnDate(dateId, TRAINERS_LEAGUE_LOCK_HOUR, TRAINERS_LEAGUE_LOCK_MIN);
  if(now >= lockTime){ game.trainersLeagueError = 'As inscrições já se encerraram por hoje.'; render(); return; }
  const prevDone = await trainersLeaguePrevDayDone(dateId);
  if(!prevDone){ game.trainersLeagueError = 'As inscrições abrem assim que a liga do dia terminar.'; render(); return; }
  game.trainersLeagueSubmitting = true;
  game.trainersLeagueError = null;
  render();
  const uid = game.authUser.uid;
  try{
    await trainersLeagueEnsureCycleDoc(dateId);
    // especialidades entram CONGELADAS na inscrição: a liga do dia inteiro roda com o mesmo número,
    // então subir de especialista no meio do campeonato não muda partidas já agendadas
    await trainersLeagueRegistrantRef(dateId, uid).set({ uid, name, eligibleCodes, specialties: game.specialties||[], elite: !!game.accountEliteChampion, registeredAt: Date.now() }, { merge:true });
    game.trainersLeagueSubmitting = false;
    await refreshTrainersLeagueView();
  } catch(e){
    console.error(e);
    game.trainersLeagueSubmitting = false;
    game.trainersLeagueError = 'Erro ao se inscrever. Confira sua conexão e tente de novo.';
    render();
  }
}

function trainersLeagueDisplayDateId(){
  // qual dateId mostrar/verificar na tela principal agora -- SEMPRE o ciclo do dia corrente (hoje),
  // não importa em que fase ele esteja (inscrevendo, travado, ativo ou completo). Antes essa função
  // reaproveitava trainersLeagueActiveDateId(), que foi feita pra outro propósito (decidir em qual
  // ciclo uma NOVA inscrição deveria entrar) -- depois das 11h, aquela função sempre aponta pro dia
  // seguinte, o que fazia a tela principal (e a verificação periódica) abandonarem o ciclo de hoje
  // assim que a trava passava, mesmo com ele ainda travado/em andamento -- e por isso ninguém
  // conseguia empurrar o ciclo de hoje adiante, mesmo com a tela aberta
  return game.trainersLeagueViewDateId || trainersLeagueTodayDateStr();
}
// conta os inscritos de um dia da forma mais barata disponível: tenta a query de agregação (1 leitura,
// servidor devolve só o número); se ela não existir nessa versão do SDK ou falhar por qualquer motivo,
// cai no método tradicional (baixa os docs e conta) -- NUNCA deixa a contagem sem resposta por causa
// de uma otimização. Foi exatamente isso que sumiu com o box de inscrição de amanhã: a agregação
// falhando derrubava o carregamento inteiro do box no catch
async function trainersLeagueCountRegistrants(dateId){
  const collRef = trainersLeagueRegistrantsRef(dateId);
  try{
    if(typeof collRef.count === 'function'){
      const countSnap = await collRef.count().get();
      return countSnap.data().count;
    }
  } catch(e){ console.warn('Agregação count() indisponível, usando contagem tradicional:', e); }
  const snap = await collRef.get();
  return snap.docs.length;
}
async function refreshTrainersLeagueView(fromPoll = false){
  const primaryDateId = trainersLeagueDisplayDateId(); // data REAL do dia -- sempre usar essa pra matemática de calendário (amanhã, ontem), nunca o dateId abaixo, que pode virar um ID de liga-irmã (com sufixo, não é uma data de verdade)
  let dateId = primaryDateId;
  try{
    // POLL ADAPTATIVO: o tick roda a cada 5s, mas nem toda fase precisa dessa frequência --
    // 'registering' só tem o contador mudando (15s é mais que suficiente) e 'complete' não muda mais
    // nada além das inscrições de amanhã (30s serve). Só rodadas ativas merecem os 5s de verdade.
    // Chamadas explícitas (abrir a tela, depois de uma ação minha) passam fromPoll=false e nunca pulam
    if(fromPoll && game.trainersLeagueData){
      const st = game.trainersLeagueData.status;
      const minGap = st==='complete' ? 30000 : (st==='registering' ? 15000 : 0);
      if(minGap && game.trainersLeagueLastRefreshAt && (Date.now() - game.trainersLeagueLastRefreshAt) < minGap){
        return; // cedo demais pra essa fase -- pula o tick inteiro (zero leituras)
      }
    }
    game.trainersLeagueLastRefreshAt = Date.now();

    // CACHE da resolução de liga-irmã: uma vez descoberto "hoje eu estou no ciclo X", os polls
    // seguintes vão DIRETO nele (1 leitura), em vez de reler a principal e re-varrer as irmãs a cada
    // 5 segundos. Se o doc sumir ou eu não estar mais nele (não deveria acontecer, mas por segurança),
    // o cache é descartado e a resolução completa roda de novo
    let resolvedViaCache = false;
    if(game.trainersLeagueSiblingCache && game.trainersLeagueSiblingCache.primaryDateId === primaryDateId && game.authUser){
      const cachedId = game.trainersLeagueSiblingCache.cycleId;
      const cachedSnap = await trainersLeagueCycleRef(cachedId).get();
      if(cachedSnap.exists && (cachedSnap.data().players||[]).some(p=>p.uid===game.authUser.uid)){
        dateId = cachedId;
        game.trainersLeagueData = cachedSnap.data();
        resolvedViaCache = true;
      } else {
        game.trainersLeagueSiblingCache = null; // cache inválido -- resolução completa abaixo
      }
    }
    if(!resolvedViaCache){
      const snap = await trainersLeagueCycleRef(dateId).get();
      game.trainersLeagueData = snap.exists ? snap.data() : { dateId, status:'registering' };
      // se o dia já travou (ou passou disso) e teve mais de 16 inscritos, pode ter sido dividido em
      // várias ligas simultâneas (ciclos-irmãos). Se eu não estou na principal, procuro nos irmãos até
      // achar onde eu de fato fiquei, e passo a tratar ESSE como "meu" ciclo pro resto da função --
      // tudo daqui pra baixo usa a variável dateId, então a troca vale pra tudo automaticamente
      if(game.authUser && game.trainersLeagueData.status!=='registering' && (game.trainersLeagueData.siblingCycleIds||[]).length>0){
        const amIInPrimary = (game.trainersLeagueData.players||[]).some(p=>p.uid===game.authUser.uid);
        if(!amIInPrimary){
          for(const sid of game.trainersLeagueData.siblingCycleIds){
            const sibSnap = await trainersLeagueCycleRef(sid).get();
            if(sibSnap.exists && (sibSnap.data().players||[]).some(p=>p.uid===game.authUser.uid)){
              dateId = sid;
              game.trainersLeagueData = sibSnap.data();
              break;
            }
          }
        }
      }
      // memoriza o resultado (inclusive quando fiquei na principal mesmo) -- os próximos polls pulam a varredura
      if(game.authUser && game.trainersLeagueData.status!=='registering'){
        game.trainersLeagueSiblingCache = { primaryDateId, cycleId: dateId };
      }
    }
    game.trainersLeagueActiveCycleId = dateId; // guarda qual ciclo é o "meu" de verdade hoje -- outras telas (escolher terreno, trocar time) usam isso em vez de recalcular
    // contador de inscritos -- só precisa buscar durante as inscrições (é a única fase em que o
    // número ainda pode subir; depois da trava, data.players já tem a lista definitiva)
    if(game.trainersLeagueData.status === 'registering'){
      try{
        game.trainersLeagueRegistrantCount = await trainersLeagueCountRegistrants(dateId);
      } catch(e){ console.error('Erro ao contar inscritos:', e); game.trainersLeagueRegistrantCount = null; }
      // a inscrição de hoje só está aberta se a liga de ONTEM não estiver mais pendente
      game.trainersLeaguePrevDayDone = await trainersLeaguePrevDayDone(dateId);
    } else {
      game.trainersLeagueRegistrantCount = null;
      game.trainersLeaguePrevDayDone = null;
    }
    // liga de hoje ENCERRADA -> as inscrições de amanhã já abriram (regra nova); carrega o
    // necessário pra oferecer a inscrição de amanhã direto na tela do dia encerrado
    if(game.trainersLeagueData.status === 'complete'){
      try{
        const nextDateId = trainersLeagueDateStrPlusDays(primaryDateId, 1);
        const [nextCount, nextMyRegSnap] = await Promise.all([
          trainersLeagueCountRegistrants(nextDateId), // agregação quando disponível, contagem tradicional como reserva
          game.authUser ? trainersLeagueRegistrantRef(nextDateId, game.authUser.uid).get() : Promise.resolve({exists:false})
        ]);
        game.trainersLeagueNextDayInfo = {
          dateId: nextDateId,
          count: nextCount,
          myReg: nextMyRegSnap.exists ? nextMyRegSnap.data() : null
        };
      } catch(e){ console.error('Erro ao carregar inscrições de amanhã:', e); game.trainersLeagueNextDayInfo = null; }
    } else {
      game.trainersLeagueNextDayInfo = null;
    }
    if(game.authUser){
      // ECONOMIA nos polls: minha inscrição e meus picks só mudam por AÇÃO MINHA -- e toda ação já
      // chama refresh explícito (fromPoll=false). Então, num tick de poll em que o documento do ciclo
      // nem mudou (updatedAt idêntico ao anterior), reler esses 3 documentos é desperdício garantido.
      // O terreno do MANDANTE adversário é a exceção (muda por ação DELE) e continua sendo checado abaixo
      const cycleUnchanged = fromPoll && game.trainersLeagueLastCycleStamp &&
        game.trainersLeagueLastCycleStamp.dateId === dateId &&
        game.trainersLeagueLastCycleStamp.updatedAt === (game.trainersLeagueData.updatedAt || 0) &&
        game.trainersLeagueLastCycleStamp.status === game.trainersLeagueData.status;
      game.trainersLeagueLastCycleStamp = { dateId, updatedAt: game.trainersLeagueData.updatedAt || 0, status: game.trainersLeagueData.status };
      if(!cycleUnchanged){
        const regSnap = await trainersLeagueRegistrantRef(dateId, game.authUser.uid).get();
        game.trainersLeagueMyRegistration = regSnap.exists ? regSnap.data() : null;
        // carrega as MINHAS escolhas por rodada (time e terreno) -- a tela usa isso pra mostrar o time
        // atual da próxima partida e o selo do terreno já escolhido dentro do botão
        try{
          const [teamPickSnap, terrainPickSnap] = await Promise.all([
            trainersLeagueTeamPickRef(dateId, game.authUser.uid).get(),
            trainersLeagueTerrainPickRef(dateId, game.authUser.uid).get()
          ]);
          game.trainersLeagueMyTeamOverrides = extractRoundKeyedMap(teamPickSnap.exists ? teamPickSnap.data() : null, 'overrides');
          game.trainersLeagueMyTerrainPicks = extractRoundKeyedMap(terrainPickSnap.exists ? terrainPickSnap.data() : null, 'picks');
        } catch(e){
          console.error('Erro ao carregar minhas escolhas por rodada:', e);
          game.trainersLeagueMyTeamOverrides = {};
          game.trainersLeagueMyTerrainPicks = {};
        }
      }
      // se eu sou VISITANTE na minha próxima partida ainda não resolvida, busca o terreno que o
      // mandante já escolheu (se algum) -- só pra essa rodada específica, que é a única onde a
      // escolha dele já teria acontecido de verdade; evita ficar buscando terreno de rodadas futuras
      // distantes, onde quase certamente ainda não tem nada escolhido
      game.trainersLeagueOpponentTerrainPick = null;
      if(game.trainersLeagueData.scheduleRounds){
        const uid = game.authUser.uid;
        const nextIdx = game.trainersLeagueData.scheduleRounds.findIndex(r=>r.matches.some(m=>!m.resolved));
        if(nextIdx !== -1){
          const myNextMatch = game.trainersLeagueData.scheduleRounds[nextIdx].matches.find(m=>!m.resolved && (m.a.uid===uid || m.b.uid===uid));
          if(myNextMatch && myNextMatch.b.uid===uid && !myNextMatch.terrain){
            try{
              const homePickSnap = await trainersLeagueTerrainPickRef(dateId, myNextMatch.a.uid).get();
              const homePicks = extractRoundKeyedMap(homePickSnap.exists ? homePickSnap.data() : null, 'picks');
              const terrainId = homePicks[String(nextIdx)];
              if(terrainId){ game.trainersLeagueOpponentTerrainPick = TERRAINS.find(t=>t.id===terrainId) || null; }
            } catch(e){ console.error('Erro ao carregar o terreno escolhido pelo mandante:', e); }
          }
        }
      }
    } else {
      game.trainersLeagueMyRegistration = null;
      game.trainersLeagueMyTeamOverrides = {};
      game.trainersLeagueMyTerrainPicks = {};
      game.trainersLeagueOpponentTerrainPick = null;
    }
  } catch(e){
    console.error('Erro ao carregar o Trainers League:', e);
    // sem isso, um erro (ex: permissão do Firestore faltando pra essa coleção nova) deixava a tela
    // presa em "Carregando..." pra sempre, sem nenhuma pista visível de que algo deu errado
    game.trainersLeagueLoadError = e && e.message ? e.message : 'Erro desconhecido';
  }
  if(game.screen==='trainersLeague' || game.screen==='trainersLeagueRoundBrowser'){
    // só redesenha se algo mudou DE VERDADE desde a última vez -- mesmo padrão da Liga Clássica.
    // Sem essa guarda, o polling de 5s redesenhava a tela inteira sempre, recarregando os sprites
    // e causando o "piscar" constante
    const d = game.trainersLeagueData || {};
    const signature = JSON.stringify([
      d.status, d.updatedAt, d.currentRound,
      game.trainersLeagueRegistrantCount,
      game.trainersLeagueMyRegistration,
      game.trainersLeagueMyTeamOverrides,
      game.trainersLeagueMyTerrainPicks,
      game.trainersLeagueOpponentTerrainPick,
      game.trainersLeaguePrevDayDone,
      game.trainersLeagueNextDayInfo,
      game.trainersLeagueLoadError
    ]);
    if(signature !== game.trainersLeagueLastRenderSignature){
      game.trainersLeagueLastRenderSignature = signature;
      render();
    }
  }
}
let trainersLeagueTickInterval = null;
function startTrainersLeaguePolling(){
  if(trainersLeagueTickInterval) return;
  // não tenta mais avançar o ciclo por aqui -- o documento do ciclo agora é escrita exclusiva da
  // Cloud Function (regra do Firestore travada), então essa tentativa nunca mais teria sucesso.
  // O cliente só LÊ (a cada 5s) o que o cron (que roda a cada 1min) já avançou -- perde um pouco de
  // resposta instantânea, ganha em segurança (ninguém mais reescreve o chaveamento pelo console)
  trainersLeagueTickInterval = setInterval(async ()=>{
    if(game.screen!=='trainersLeague') return;
    await refreshTrainersLeagueView(true); // fromPoll: ativa o poll adaptativo + skips de leitura
  }, 5000);
}
function stopTrainersLeaguePolling(){
  if(trainersLeagueTickInterval){ clearInterval(trainersLeagueTickInterval); trainersLeagueTickInterval = null; }
}
function openTrainersLeague(){
  game.screen = 'trainersLeague';
  game.trainersLeagueError = null;
  game.trainersLeagueLoadError = null;
  game.trainersLeagueData = null;
  game.trainersLeagueMyRegistration = null;
  game.trainersLeagueViewDateId = null;
  game.trainersLeagueViewRound = null;
  game.trainersLeagueLastRenderSignature = null; // garante que o primeiro refresh sempre redesenha (a guarda anti-piscar pularia um render com dados iguais aos da última visita, prendendo o "Carregando...")
  render();
  refreshTrainersLeagueView();
  startTrainersLeaguePolling();
  loadLeagueLeaderboard(TRAINERS_LEAGUE_TYPE).then(lb=>{
    game.trainersLeagueLeaderboard = lb;
    if(game.screen==='trainersLeague'){ render(); }
  });
}
function leaveTrainersLeague(){
  stopTrainersLeaguePolling();
  game.screen = 'leagueTypesList';
  render();
}
function openTrainersLeagueHistory(){
  game.trainersLeagueHistoryData = null;
  game.screen = 'trainersLeagueHistory';
  render();
  loadTrainersLeagueHistory();
}
async function loadTrainersLeagueHistory(){
  const results = [];
  let cursor = trainersLeagueTodayDateStr();
  for(let i=0; i<14; i++){
    try{
      const snap = await trainersLeagueCycleRef(cursor).get();
      if(snap.exists && snap.data().status==='complete'){ results.push(snap.data()); }
    } catch(e){ console.error('Erro ao carregar histórico do Trainers League:', e); }
    cursor = trainersLeagueDateStrPlusDays(cursor, -1);
  }
  game.trainersLeagueHistoryData = results;
  if(game.screen==='trainersLeagueHistory'){ render(); }
}

const LEAGUE_HISTORY_RETENTION = 48;
function leagueTypesCollRef(){ return db.collection('leagueTypes'); }
function leagueTypeDocRef(typeId){ return leagueTypesCollRef().doc(typeId); }
function scheduleDocRef(typeId){ return db.collection('leagues').doc('schedule_'+(typeId||CLASSIC_LEAGUE_TYPE)); }
function cycleDocRef(typeId, cycleId){ return db.collection('leagueCycles').doc((typeId||CLASSIC_LEAGUE_TYPE)+'__'+cycleId); }
function registrantsCollRef(typeId, cycleId){ return cycleDocRef(typeId, cycleId).collection('registrants'); }
function sanitizeForDocId(str){
  const cleaned = String(str).trim().toLowerCase().replace(/[\/\s]+/g, '_').slice(0, 200);
  return cleaned || 'sememnome';
}

function computeNextScheduledTime(){
  const now = new Date();
  const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), 0, 0, 0);
  if(target.getTime() <= now.getTime()){ target.setHours(target.getHours()+1); }
  return target.getTime();
}
function makeCycleId(scheduledTime){ return String(scheduledTime); }
function makeFreshScheduleCycleEntry(scheduledTime){
  return { id: makeCycleId(scheduledTime), scheduledTime, status:'registering' };
}
function makeFreshScheduleData(){
  return { cycles: [ makeFreshScheduleCycleEntry(computeNextScheduledTime()) ], updatedAt: Date.now() };
}

/* -------------------------------------------------------------------
   INSCRIÇÃO / CANCELAMENTO
   cada um escreve no próprio documento (chave = nome sanitizado),
   então 1000 pessoas se inscrevendo ao mesmo tempo não brigam entre si
------------------------------------------------------------------- */
function assignMatchTerrain(match, seedStr, allowedTerrainIds){
  // sorteia o terreno assim que os dois adversários dessa partida já são conhecidos (não só na hora de
  // resolver) -- assim os treinadores já veem o terreno no chaveamento antes da luta acontecer
  if(match.terrain || !match.a || !match.b) return;
  const rng = makeSeededRng('terrain-'+seedStr);
  const terrain = pickTerrain(rng, allowedTerrainIds);
  match.terrain = { id: terrain.id, name: terrain.name, icon: terrain.icon, types: terrain.types };
}
function resolveLeagueMatch(match, seedStr, allowedTerrainIds){
  const rng = makeSeededRng(seedStr);
  const teamA = decodeTeamCode(match.a.code);
  const teamB = decodeTeamCode(match.b.code);
  if(!teamA || !teamB){
    match.winner = teamA ? match.a : match.b;
    match.resolved = true;
    match.matchups = [];
    return;
  }
  // reaproveita o terreno já sorteado e mostrado no chaveamento antes da luta -- só sorteia agora se por
  // algum motivo isso não tinha acontecido ainda (rede de segurança)
  if(!match.terrain){ assignMatchTerrain(match, seedStr, allowedTerrainIds); }
  const terrain = TERRAINS.find(t=>t.id===match.terrain.id);
  applyTerrainBuff(teamA, terrain);
  applyTerrainBuff(teamB, terrain);
  applySpecialtyBuff(teamA, (match.a && match.a.specialties) || []); // idem: snapshot da inscrição
  applySpecialtyBuff(teamB, (match.b && match.b.specialties) || []);
  const result = simulateGymBattle(teamA, teamB, rng);
  // diferente dos ginásios, os níveis ficam CONGELADOS na Liga -- depois da 8ª insígnia, o time do
  // treinador não sobe mais de nível, então nem precisa re-codificar/sincronizar nada aqui
  match.matchups = result.matchups;
  match.winner = result.win ? match.a : match.b;
  match.resolved = true;
}
async function migrateOldLeagueDataIfNeeded(){
  // se ainda existir o documento antigo (formato de antes da reestruturação), migra pro formato novo e o remove.
  // roda sozinho, sem precisar de ação manual -- só verifica uma vez por sessão. Sempre foi só a Liga
  // Clássica -- ligas customizadas não existiam nesse formato antigo
  try{
    const oldRef = db.collection('leagues').doc('league_schedule_v1');
    const oldSnap = await oldRef.get();
    if(!oldSnap.exists) return; // nada pra migrar
    const oldData = oldSnap.data();
    console.log('Migrando dados antigos da Liga pro novo formato...');

    const scheduleSnap = await scheduleDocRef(CLASSIC_LEAGUE_TYPE).get();
    const scheduleData = scheduleSnap.exists ? scheduleSnap.data() : { cycles: [], updatedAt: Date.now() };

    for(const oldCycle of (oldData.cycles||[])){
      const cycleId = makeCycleId(oldCycle.scheduledTime);
      if(!scheduleData.cycles.some(c=>c.id===cycleId)){
        scheduleData.cycles.push({ id: cycleId, scheduledTime: oldCycle.scheduledTime, status: oldCycle.status });
      }
      if(oldCycle.status==='registering'){
        for(const p of (oldCycle.registrants||[])){
          await registrantDocRef(CLASSIC_LEAGUE_TYPE, cycleId, p.name).set(p);
        }
      } else if(oldCycle.leagues){
        await cycleDocRef(CLASSIC_LEAGUE_TYPE, cycleId).set({
          scheduledTime: oldCycle.scheduledTime,
          leagues: oldCycle.leagues,
          leftover: oldCycle.leftover || [],
          qfTime: oldCycle.qfTime ?? null,
          sfTime: oldCycle.sfTime ?? null,
          finalTime: oldCycle.finalTime ?? null,
          phase4Time: oldCycle.phase4Time ?? null, // saves antigos de antes da Grande Liga não tinham esse campo
          updatedAt: Date.now()
        });
      }
    }
    scheduleData.updatedAt = Date.now();
    await scheduleDocRef(CLASSIC_LEAGUE_TYPE).set(scheduleData);
    await oldRef.delete();
    console.log('Migração da Liga concluída.');
  } catch(e){ console.error('Erro ao migrar dados antigos da Liga:', e); }
}

async function ensureRegisteringCycle(typeId){
  return await db.runTransaction(async (tx)=>{
    const snap = await tx.get(scheduleDocRef(typeId));
    const data = snap.exists ? snap.data() : { cycles: [], updatedAt: Date.now() };
    let entry = data.cycles.find(c=>c.status==='registering');
    if(!entry){
      entry = makeFreshScheduleCycleEntry(computeNextScheduledTime());
      data.cycles.push(entry);
      data.updatedAt = Date.now();
      tx.set(scheduleDocRef(typeId), data);
    }
    return entry;
  });
}

    if(typeof coll.count === 'function'){

async function registerForLeague(typeId, slot, useMewtwo){
  if(!game.authUser){ game.leagueError = 'Você precisa estar logado.'; render(); return; }
  const name = (game.trainerName || '').trim();
  if(!name){ game.leagueError = 'Sua conta não tem um nome de treinador definido.'; render(); return; }
  const saveData = game.saveSlots && game.saveSlots[slot];
  if(!saveData || !saveData.team || (saveData.badgeCount||0) < 8){
    game.leagueError = 'Esse time não está pronto pra Liga (precisa das 8 insígnias).';
    render();
    return;
  }
  const mewtwoReady = saveData.mewtwoReward && saveData.mewtwoReward.earned && !saveData.mewtwoReward.used;
  if(useMewtwo && !mewtwoReady){
    game.leagueError = 'Esse time não tem um Mewtwo disponível pra usar.';
    render();
    return;
  }
  game.leagueSubmitting = true;
  game.leagueError = null;
  render();
  const uid = game.authUser.uid;
  const code = useMewtwo ? buildMewtwoTeamCode(saveData) : encodeTeamCode(saveData.team);
  try{
    const cycleEntry = await ensureRegisteringCycle(typeId);
    const activeElsewhere = await isAccountActiveInLeague(typeId, uid);
    if(activeElsewhere){ throw new Error('ACTIVE_ELSEWHERE'); }
    const regRef = registrantDocRef(typeId, cycleEntry.id, uid);
    await db.runTransaction(async (tx)=>{
      const snap = await tx.get(regRef);
      if(snap.exists){ throw new Error('DUPLICATE'); }
      tx.set(regRef, { name, code, uid, slot, specialties: game.specialties||[], elite: !!game.accountEliteChampion, registeredAt: Date.now() });
    });
    if(useMewtwo){
      // gasta o prêmio AGORA -- "1 uso" é por chaveamento/dia inteiro, então vale a partir da
      // inscrição, mesmo que a Liga ainda tenha várias rodadas pela frente
      try{
        const saveRef = saveDocRef(uid, slot);
        const freshSnap = await saveRef.get();
        if(freshSnap.exists){
          const freshSave = freshSnap.data();
          const spentReward = { ...(freshSave.mewtwoReward||{}), used:true };
          await saveRef.set({ ...freshSave, mewtwoReward: spentReward }, { merge:true });
          game.saveSlots[slot] = { ...freshSave, mewtwoReward: spentReward };
        }
      } catch(e){ console.error('Erro ao marcar o Mewtwo como usado:', e); }
    }
    game.accountLeagueSlots = { ...(game.accountLeagueSlots||{}), [typeId]: slot };
    game.leagueSubmitting = false;
    game.screen = 'league';
    render();
    /* A lista do time inscrito sai do game.registeredTeam, e ele só era lido ao ABRIR a tela.
       Resultado: cancelar a inscrição e entrar com OUTRO time deixava o time antigo na tela até
       sair da Liga e voltar. O refreshLeagueView não resolve -- ele cuida do ciclo e do ranking,
       não da sua inscrição. */
    checkLeagueRegistrationStatus(typeId);
    refreshLeagueView(typeId, false); // atualiza a tela na hora, sem esperar o próximo tick de 5s
  } catch(e){
    game.leagueSubmitting = false;
    if(e.message==='DUPLICATE' || e.message==='ACTIVE_ELSEWHERE') game.leagueError = 'Sua conta já está inscrita nessa Liga em outra rodada.';
    else { console.error(e); game.leagueError = 'Erro ao se inscrever. Confira sua conexão e tente de novo.'; }
    render();
  }
}

}

async function updateRegisteredTeamCode(typeId){
  if(!game.authUser || !game.registeredTeam) return;
  const uid = game.authUser.uid;
  const newCode = encodeTeamCode(game.registeredTeam);
  try{
    const scheduleSnap = await scheduleDocRef(typeId).get();
    if(!scheduleSnap.exists) return;
    const cycles = scheduleSnap.data().cycles || [];
    const registering = cycles.find(c=>c.status==='registering');
    if(registering){
      const regRef = registrantDocRef(typeId, registering.id, uid);
      const regSnap = await regRef.get();
      if(regSnap.exists){ await regRef.set({ ...regSnap.data(), code: newCode }); }
    }
    for(const entry of cycles){
      if(entry.status!=='drawn') continue;
      await db.runTransaction(async (tx)=>{
        const ref = cycleDocRef(typeId, entry.id);
        const snap = await tx.get(ref);
        if(!snap.exists) return;
        const detail = snap.data();
        let touched = false;
        for(const league of detail.leagues||[]){
          for(const roundKey of Object.keys(league.rounds||{})){
            for(const match of league.rounds[roundKey]){
              if(!match.resolved){
                // casa por uid, não por nome -- mais confiável, já que o nome sozinho poderia colidir
                // entre contas diferentes
                if(match.a && match.a.uid===uid){ match.a.code = newCode; touched = true; }
                if(match.b && match.b.uid===uid){ match.b.code = newCode; touched = true; }
              }
            }
          }
        }
        if(touched){ detail.updatedAt = Date.now(); tx.set(ref, detail); }
      });
    }
  } catch(e){ console.error('Erro ao atualizar ordem do time na Liga:', e); }
}
let leagueTeamCodeSyncTimer = null;

  if(leagueTeamCodeSyncTimer){ clearTimeout(leagueTeamCodeSyncTimer); }
  leagueTeamCodeSyncTimer = setTimeout(()=>{

/* -------------------------------------------------------------------
   SORTEIO E AVANÇO DE FASES
   sorteio usa um "lacre" (claim) transacional no doc leve de agenda,
   pra garantir que só um processo sorteia cada ciclo mesmo com vários
   navegadores tentando ao mesmo tempo
------------------------------------------------------------------- */
const STUCK_CLAIM_THRESHOLD_MS = 3 * 60 * 1000; // se um "lacre" ficar preso por mais que isso, algo deu errado (ex: navegador fechado no meio do processamento) -- libera sozinho
async function claimCycleForProcessing(typeId, cycleId, fromStatus, toStatus){
  try{
    return await db.runTransaction(async (tx)=>{
      const snap = await tx.get(scheduleDocRef(typeId));
      if(!snap.exists) return false;
      const data = snap.data();
      const entry = data.cycles.find(c=>c.id===cycleId);
      if(!entry || entry.status!==fromStatus) return false;
      entry.status = toStatus;
      entry.claimedAt = (toStatus==='advancing' || toStatus==='drawing') ? Date.now() : null;
      data.updatedAt = Date.now();
      tx.set(scheduleDocRef(typeId), data);
      return true;
    });
  } catch(e){
    // sob contenção pesada (vários navegadores + a Cloud Function tentando reivindicar o mesmo ciclo ao
    // mesmo tempo), a transação pode falhar mesmo depois das tentativas automáticas do Firestore --
    // trata igual a "perdeu a corrida" (outro processo chegou primeiro), que já é um resultado esperado
    // e inofensivo aqui. Sem isso, essa exceção não tratada interrompia o resto do processamento
    // daquela rodada de verificação, e ainda aparecia como erro alarmante no console à toa
    console.warn('Não conseguiu reivindicar o ciclo pra processar agora (provavelmente outro processo já pegou):', e.message);
    return false;
  }
}
async function recoverStuckCycles(typeId){
  // se algum navegador fechou (ou caiu a conexão) bem no meio de processar uma fase, o "lacre" pode ficar
  // preso pra sempre, já que nenhum outro navegador consegue reivindicar um ciclo fora do status esperado.
  // isso destrava sozinho qualquer lacre preso há mais tempo do que um processamento normal deveria levar
  // (também cobre lacres antigos, de antes dessa proteção existir, que nunca tiveram um horário registrado).
  try{
    await db.runTransaction(async (tx)=>{
      const snap = await tx.get(scheduleDocRef(typeId));
      if(!snap.exists) return;
      const data = snap.data();
      const now = Date.now();
      let changed = false;
      for(const entry of data.cycles){
        const isStuck = (entry.status==='advancing' || entry.status==='drawing') &&
          (!entry.claimedAt || (now - entry.claimedAt > STUCK_CLAIM_THRESHOLD_MS));
        if(isStuck){
          entry.status = entry.status==='advancing' ? 'drawn' : 'registering';
          entry.claimedAt = null;
          changed = true;
        }
      }
      if(changed){ data.updatedAt = Date.now(); tx.set(scheduleDocRef(typeId), data); }
    });
  } catch(e){ console.error('Erro ao recuperar ciclos travados:', e); }
}
async function drawCycle(typeId, cycleEntry, leagueTypeConfig){
  const claimed = await claimCycleForProcessing(typeId, cycleEntry.id, 'registering', 'drawing');
  if(!claimed) return false; // outro processo já está cuidando desse sorteio
  try{
    const regSnap = await registrantsCollRef(typeId, cycleEntry.id).get();
    const registrants = regSnap.docs.map(d=>d.data());
    // prioriza por ordem de inscrição -- quem chegou primeiro tem prioridade de entrar no sorteio dessa
    // rodada; quem sobrar (por ter chegado por último) é quem fica de fora e vai pra próxima Liga.
    // dentro de cada grupo selecionado, os confrontos continuam sorteados normalmente
    const ordered = registrants.slice().sort((a,b)=>(a.registeredAt||0)-(b.registeredAt||0));
    const leagues = [];
    let cursor = 0;
    let workingList = ordered;
    let leftover = [];
    const botFillEnabled = leagueTypeConfig && leagueTypeConfig.botFillEnabled;
    if(botFillEnabled && ordered.length > 0){
      // com preenchimento por bots ativado, preferimos formar UM grupo maior completando com bots
      // sintéticos, em vez de fatiar em grupos completos + uma sobra pequena carregada pra próxima
      // rodada -- por isso NADA fica de fora quando essa opção está ligada
      const grandeGroupsFromReal = Math.floor(ordered.length / GRANDE_LIGA_SIZE);
      const remainder = ordered.length - grandeGroupsFromReal*GRANDE_LIGA_SIZE;
      workingList = ordered.slice(0, grandeGroupsFromReal*GRANDE_LIGA_SIZE);
      if(remainder > 0){
        const targetSize = remainder <= REGULAR_LIGA_SIZE ? REGULAR_LIGA_SIZE : GRANDE_LIGA_SIZE;
        const botsNeeded = targetSize - remainder;
        const realRemainder = ordered.slice(grandeGroupsFromReal*GRANDE_LIGA_SIZE);
        const bots = [];
        for(let i=1;i<=botsNeeded;i++){
          bots.push(createBotRegistrant(i, leagueTypeConfig.allowedTypes, cycleEntry.scheduledTime));
        }
        workingList = workingList.concat(realRemainder, bots);
      }
    }
    const grandeCount = Math.floor(workingList.length / GRANDE_LIGA_SIZE);
    for(let i=0;i<grandeCount;i++){
      const group = shuffleWithSeed(workingList.slice(cursor, cursor+GRANDE_LIGA_SIZE), `draw-${cycleEntry.scheduledTime}-g${leagues.length}`);
      leagues.push({ id: leagues.length, size: GRANDE_LIGA_SIZE, rounds: buildRounds(group), champion:null });
      cursor += GRANDE_LIGA_SIZE;
    }
    const remaining = workingList.length - cursor;
    const regularCount = Math.floor(remaining / REGULAR_LIGA_SIZE);
    for(let i=0;i<regularCount;i++){
      const group = shuffleWithSeed(workingList.slice(cursor, cursor+REGULAR_LIGA_SIZE), `draw-${cycleEntry.scheduledTime}-g${leagues.length}`);
      leagues.push({ id: leagues.length, size: REGULAR_LIGA_SIZE, rounds: buildRounds(group), champion:null });
      cursor += REGULAR_LIGA_SIZE;
    }
    if(!botFillEnabled){ leftover = ordered.slice(cursor); }
    // sorteia o terreno das Quartas (round 0) já aqui, assim que os confrontos são conhecidos -- as fases
    // seguintes (Semi/Final) recebem o terreno delas assim que os adversários forem definidos, no avanço de fase
    const allowedTerrainIds = leagueTypeConfig ? leagueTypeConfig.allowedTerrains : null;
    for(const league of leagues){
      (league.rounds['0']||[]).forEach((match, mi)=>{
        assignMatchTerrain(match, `${cycleEntry.scheduledTime}-L${league.id}-R0-M${mi}`, allowedTerrainIds);
      });
    }
    const detail = {
      scheduledTime: cycleEntry.scheduledTime,
      leagues,
      leftover,
      qfTime: cycleEntry.scheduledTime + PHASE_MS,
      sfTime: cycleEntry.scheduledTime + PHASE_MS*2,
      finalTime: cycleEntry.scheduledTime + PHASE_MS*3,
      phase4Time: cycleEntry.scheduledTime + PHASE_MS*4,
      updatedAt: Date.now()
    };
    await cycleDocRef(typeId, cycleEntry.id).set(detail);

    // quem ficou de fora entra automaticamente na próxima Liga (vira registrant novo lá)
    const nextScheduledTime = cycleEntry.scheduledTime + CYCLE_INTERVAL_MS;
    const nextCycleId = makeCycleId(nextScheduledTime);
    for(const p of leftover){
      await registrantDocRef(typeId, nextCycleId, p.uid).set(p);
    }

    // atualiza a agenda: esse ciclo vira drawn/complete, e garante que o próximo ciclo de inscrição existe
    await db.runTransaction(async (tx)=>{
      const snap = await tx.get(scheduleDocRef(typeId));
      const data = snap.exists ? snap.data() : { cycles: [], updatedAt: Date.now() };
      const entry = data.cycles.find(c=>c.id===cycleEntry.id);
      if(entry){ entry.status = leagues.length>0 ? 'drawn' : 'complete'; }
      if(!data.cycles.some(c=>c.id===nextCycleId)){
        data.cycles.push({ id: nextCycleId, scheduledTime: nextScheduledTime, status:'registering' });
      }
      data.updatedAt = Date.now();
      tx.set(scheduleDocRef(typeId), data);
    });
    return true;
  } catch(e){
    console.error('Erro ao sortear ciclo:', e);
    await claimCycleForProcessing(typeId, cycleEntry.id, 'drawing', 'registering'); // devolve o lacre se algo falhou no meio do caminho
    return false;
  }
}
// checagem BARATA (só leitura, sem transação) se tem alguma partida pronta pra resolver nesse ciclo
// agora -- evita disputar a trava de processamento quando não há trabalho nenhum. Usa continue em vez
// do break que o corpo da função original usa (aquele break assume fases em ordem -- mais seguro não
// assumir isso aqui, já que é só leitura em memória, custo irrelevante)
function leagueCycleHasPendingWork(detail){
  if(!detail || !detail.leagues) return false;
  const now = Date.now();
  const phaseTimes = [detail.qfTime, detail.sfTime, detail.finalTime, detail.phase4Time];
  for(const league of detail.leagues){
    const roundKeys = Object.keys(league.rounds||{}).sort((a,b)=>Number(a)-Number(b));
    for(let ri=0; ri<roundKeys.length; ri++){
      if(phaseTimes[ri]==null || now < phaseTimes[ri]) continue;
      const round = league.rounds[roundKeys[ri]];
      for(const match of round){
        if(!match.resolved && match.a && match.b) return true;
      }
    }
  }
  return false;
}
async function advanceCyclePhases(typeId, cycleEntry, leagueTypeConfig, leagueTypeName){
  // evita disputar a trava (transação de ESCRITA) no agendamento compartilhado quando não há nenhuma
  // partida pronta pra resolver ainda -- é o caso da grande maioria das chamadas de polling do cliente,
  // no meio do intervalo (às vezes horas) entre uma fase e a próxima
  try{
    const precheckSnap = await cycleDocRef(typeId, cycleEntry.id).get();
    if(!precheckSnap.exists) return false;
    if(!leagueCycleHasPendingWork(precheckSnap.data())) return false;
  } catch(e){ console.error('Erro na checagem prévia do ciclo da Liga:', e); }
  const claimed = await claimCycleForProcessing(typeId, cycleEntry.id, 'drawn', 'advancing');
  if(!claimed) return false;
  let pendingChampions = [], pendingPlacements = [], pendingStreakUpdates = [], changed = false;
  try{
    const ref = cycleDocRef(typeId, cycleEntry.id);
    const snap = await ref.get();
    if(!snap.exists){ await claimCycleForProcessing(typeId, cycleEntry.id, 'advancing', 'drawn'); return false; }
    const detail = snap.data();
    const now = Date.now();
    const phaseTimes = [detail.qfTime, detail.sfTime, detail.finalTime, detail.phase4Time];
    const allowedTerrainIds = leagueTypeConfig ? leagueTypeConfig.allowedTerrains : null;
    for(const league of detail.leagues){
      const roundKeys = Object.keys(league.rounds).sort((a,b)=>Number(a)-Number(b));
      for(let ri=0; ri<roundKeys.length; ri++){
        if(now < phaseTimes[ri]) break;
        const round = league.rounds[roundKeys[ri]];
        for(let mi=0; mi<round.length; mi++){
          const match = round[mi];
          if(!match.resolved && match.a && match.b){
            resolveLeagueMatch(match, `${cycleEntry.scheduledTime}-L${league.id}-R${ri}-M${mi}`, allowedTerrainIds);
            changed = true;
            // registra vitória/derrota pra cada participante de verdade (bots não têm conta) assim que
            // O PRÓPRIO confronto individual se resolve -- não precisa esperar a Liga toda acabar
            if(!match.a.isBot){ pendingStreakUpdates.push({ uid: match.a.uid, won: match.winner.uid === match.a.uid }); }
            if(!match.b.isBot){ pendingStreakUpdates.push({ uid: match.b.uid, won: match.winner.uid === match.b.uid }); }
            if(ri+1 < roundKeys.length){
              const nextRound = league.rounds[roundKeys[ri+1]];
              const nextMi = Math.floor(mi/2);
              const nextMatch = nextRound[nextMi];
              if(mi%2===0){ nextMatch.a = match.winner; } else { nextMatch.b = match.winner; }
              // assim que os dois adversários da próxima fase são conhecidos, já sorteia o terreno dela --
              // assim os treinadores veem o terreno no chaveamento antes da luta acontecer, não só depois
              assignMatchTerrain(nextMatch, `${cycleEntry.scheduledTime}-L${league.id}-R${ri+1}-M${nextMi}`, allowedTerrainIds);
            } else {
              league.champion = match.winner;
              if(!match.winner.isBot){
                pendingChampions.push({ name: match.winner.name, uid: match.winner.uid, slot: match.winner.slot });
              }
              // o chaveamento inteiro dessa Liga já está resolvido agora -- aproveita pra gravar a
              // colocação final de todo mundo que participou, direto na conta de cada um (bots não têm
              // conta de verdade, então não entram nem no ranking nem no histórico de ninguém)
              const participants = [];
              (league.rounds['0']||[]).forEach(m=>{ if(m.a) participants.push(m.a); if(m.b) participants.push(m.b); });
              for(const p of participants){
                if(p.isBot) continue;
                const placement = computePlacement(league, p.name);
                if(placement && p.uid){
                  // mesmo fallback defensivo de reconcileLeagueWinsFromHistory -- evita gravar "undefined"
                  // caso esse ciclo específico esteja com algum campo faltando
                  const cycleTime = cycleEntry.scheduledTime!=null ? cycleEntry.scheduledTime : Number(cycleEntry.id) || 0;
                  const leagueSize = league.size!=null ? league.size : ((league.rounds['0']||[]).length * 2 || REGULAR_LIGA_SIZE);
                  pendingPlacements.push({ uid: p.uid, record: { cycleId: cycleEntry.id, cycleTime, leagueId: league.id, leagueSize, placement, slot: p.slot, leagueTypeId: typeId, leagueTypeName: leagueTypeName||'Liga Clássica' } });
                }
              }
            }
          }
        }
      }
    }
    const allDone = detail.leagues.length>0 && detail.leagues.every(l=>l.champion);
    if(changed){
      // só regrava o documento se essa passada realmente resolveu algo -- gravar mesmo sem mudança
      // nenhuma corria o risco de sobrescrever, com uma versão antiga, uma troca de ordem de time (ou
      // qualquer outra escrita legítima) que tivesse acontecido bem entre a leitura e essa gravação
      detail.updatedAt = Date.now();
      await ref.set(detail);
    }
    await claimCycleForProcessing(typeId, cycleEntry.id, 'advancing', allDone ? 'complete' : 'drawn');
    for(const champ of pendingChampions){ await recordLeagueChampionWin(champ.name, champ.uid, typeId); }
    for(const p of pendingPlacements){ await recordLeaguePlacement(p.uid, p.record); }
    for(const su of pendingStreakUpdates){ await updateTrainerStreakForUid(su.uid, su.won); }
    return changed;
  } catch(e){
    console.error('Erro ao avançar fases do ciclo:', e);
    await claimCycleForProcessing(typeId, cycleEntry.id, 'advancing', 'drawn');
    return false;
  }
}
async function listActiveLeagueTypes(){
  // a Clássica não tem um doc de configuração "criado" pelo painel -- mas pode ter um doc especial
  // reservado (id 'classic') só pra controlar o preenchimento por bots, sem mexer em mais nada dela
  const classicEntry = { id: CLASSIC_LEAGUE_TYPE, name: 'Liga Clássica', description: null, allowedTypes: null, allowedTerrains: null, botFillEnabled: false };
  const types = [classicEntry];
  try{
    const snap = await leagueTypesCollRef().get();
    snap.forEach(doc=>{
      const data = doc.data();
      if(doc.id === CLASSIC_LEAGUE_TYPE){
        classicEntry.botFillEnabled = !!data.botFillEnabled;
        return;
      }
      if(data.active){ types.push({ id: doc.id, ...data }); }
    });
  } catch(e){ console.error('Erro ao carregar tipos de liga customizados:', e); }
  return types;
}
async function advanceLeagueOnce(){
  let anyChanged = false;
  try{
    const types = await listActiveLeagueTypes();
    // processa cada tipo de liga em sequência (nunca em paralelo) -- assim não corre risco de misturar
    // dados de ligas diferentes no meio do caminho
    for(const type of types){
      const changed = await advanceLeagueOnceForType(type.id, type);
      if(changed) anyChanged = true;
    }
  } catch(e){ console.error('Erro ao avançar a Liga:', e); }
  return anyChanged;
}
async function advanceLeagueOnceForType(typeId, typeConfig){
  let anyChanged = false;
  try{
    await recoverStuckCycles(typeId);
    const scheduleSnap = await scheduleDocRef(typeId).get();
    if(!scheduleSnap.exists){
      await scheduleDocRef(typeId).set(makeFreshScheduleData());
      return true;
    }
    const data = scheduleSnap.data();
    const now = Date.now();
    if(!data.cycles.some(c=>c.status==='registering')){
      await ensureRegisteringCycle(typeId);
      anyChanged = true;
    }
    for(const entry of data.cycles.slice()){
      if(entry.status==='registering' && now >= entry.scheduledTime){
        const ok = await drawCycle(typeId, entry, typeConfig);
        if(ok) anyChanged = true;
      } else if(entry.status==='drawn'){
        const ok = await advanceCyclePhases(typeId, entry, typeConfig, typeConfig.name);
        if(ok) anyChanged = true;
      }
    }
  } catch(e){ console.error(`Erro ao avançar a Liga (${typeId}):`, e); }
  return anyChanged;
}

/* -------------------------------------------------------------------
   CARREGAMENTO PRA EXIBIÇÃO
   monta um objeto no formato {cycles:[...]} parecido com o antigo,
   mas buscando só o que é relevante ver AGORA (registro atual +
   ciclos já sorteados), sem puxar o histórico inteiro toda hora
------------------------------------------------------------------- */
async function loadLeagueViewData(typeId){
  try{
    let scheduleSnap = await scheduleDocRef(typeId).get();
    if(!scheduleSnap.exists){
      // liga nova (ex: uma liga customizada recém-criada) que ninguém ainda abriu -- cria a agenda na
      // hora, em vez de esperar o próximo tick do polling (5s) pra ela aparecer
      await scheduleDocRef(typeId).set(makeFreshScheduleData());
      scheduleSnap = await scheduleDocRef(typeId).get();
    }
    const scheduleData = scheduleSnap.exists ? scheduleSnap.data() : { cycles: [] };
    // só busca (e mostra "ao vivo") o chaveamento do ciclo mais recente entre os que já foram sorteados
    // (drawn/advancing/complete) -- não necessariamente o mais recente CONCLUÍDO especificamente, porque assim
    // que uma Liga nova é sorteada, ela passa a ser "a atual" e a anterior (mesmo já encerrada) sai da tela
    // ao vivo, ficando disponível só via "Suas últimas Ligas" → "Rever"
    const activeTimes = scheduleData.cycles.filter(c=>c.status==='drawn' || c.status==='advancing' || c.status==='complete').map(c=>c.scheduledTime);
    const latestActiveTime = activeTimes.length>0 ? Math.max(...activeTimes) : null;
    const cycles = await Promise.all(scheduleData.cycles.map(async (entry)=>{
      if(entry.status==='registering'){
        const [registrantCount, amIRegistered] = await Promise.all([
          countRegistrants(typeId, entry.id),
          game.authUser ? registrantDocRef(typeId, entry.id, game.authUser.uid).get().then(s=>s.exists).catch(()=>false) : Promise.resolve(false)
        ]);
        return { ...entry, registrantCount, registrants: { length: registrantCount }, leagues: null, amIRegistered };
      } else if(entry.scheduledTime===latestActiveTime && (entry.status==='drawn' || entry.status==='advancing' || entry.status==='complete')){
        // 'advancing' é um estado transitório (alguém, talvez outro jogador com a tela aberta, está processando
        // uma fase agora mesmo) -- o chaveamento já existe e continua legível nesse meio-tempo, só o status
        // muda por um instante. Buscar aqui também evita a tela "piscar" vazia enquanto isso acontece.
        try{
          const detailSnap = await cycleDocRef(typeId, entry.id).get();
          return detailSnap.exists ? { ...entry, ...detailSnap.data() } : entry;
        } catch(e){ return entry; }
      }
      return entry; // ciclo mais antigo (já superado por um mais novo) -- fica só com os dados leves (id, horário, status)
    }));
    return { cycles };
  } catch(e){
    console.error('Erro ao carregar a Liga:', e);
    return { cycles: [] };
  }
}
async function loadGlobalLeagueHistory(limit){
  // busca as últimas N Ligas concluídas, de QUALQUER treinador -- diferente de "Suas últimas Ligas"
  // (que lê direto da própria conta), essa precisa vasculhar os ciclos recentes do calendário da Liga,
  // já que não existe uma lista "global" pronta em lugar nenhum
  try{
    const scheduleSnap = await scheduleDocRef(CLASSIC_LEAGUE_TYPE).get();
    if(!scheduleSnap.exists) return [];
    const cycles = scheduleSnap.data().cycles || [];
    const completedEntries = cycles
      .filter(c=>c.status==='complete')
      .sort((a,b)=>b.scheduledTime - a.scheduledTime)
      .slice(0, 20); // pega alguns ciclos a mais, já que cada um pode ter várias Ligas simultâneas dentro
    // busca todos os ciclos de uma vez (em paralelo) em vez de um await por vez dentro do loop --
    // eram até 20 idas e voltas sequenciais ao Firestore, que sozinhas seguravam a tela por vários
    // segundos no celular. Lê alguns docs a mais do que o limite estritamente precisaria, mas o
    // tempo total cai de ~20x a latência pra ~1x
    const detailSnaps = await Promise.all(completedEntries.map(entry=>cycleDocRef(CLASSIC_LEAGUE_TYPE, entry.id).get().catch(()=>null)));
    const allLeagues = [];
    for(let i=0;i<completedEntries.length;i++){
      if(allLeagues.length >= limit) break;
      const entry = completedEntries[i];
      const detailSnap = detailSnaps[i];
      if(!detailSnap || !detailSnap.exists) continue;
      const detail = detailSnap.data();
      (detail.leagues||[]).forEach(league=>{
        allLeagues.push({ cycleId: entry.id, cycleTime: entry.scheduledTime, league });
      });
    }
    allLeagues.sort((a,b)=>b.cycleTime - a.cycleTime);
    return allLeagues.slice(0, limit);
  } catch(e){ console.error('Erro ao carregar histórico global da Liga:', e); return []; }
}
async function loadMyLeagueHistory(limit){
  // lê direto da conta do jogador -- histórico é por CONTA agora, não mais por save/slot, já que só 1
  // time da conta pode estar inscrito na Liga por vez

  try{
    const snap = await userDocRef(game.authUser.uid).get();
    const placements = (snap.exists && snap.data().leaguePlacements) ? snap.data().leaguePlacements : [];

function findMyLeagueInCycle(cycle){
  if(!cycle.leagues || !game.authUser) return null;
  return cycle.leagues.find(l=> Object.values(l.rounds).some(round=>
    round.some(m=> (m.a && m.a.uid===game.authUser.uid) || (m.b && m.b.uid===game.authUser.uid))
  )) || null;
}
function computePlacement(league, playerName){
  if(!league.champion) return null;
  if(league.champion.name===playerName) return 'Campeão';
  const roundKeys = Object.keys(league.rounds).sort((a,b)=>Number(a)-Number(b));
  const lastRoundIdx = roundKeys.length - 1;
  const finalMatch = league.rounds[roundKeys[lastRoundIdx]][0];
  if(finalMatch.a && finalMatch.b && (finalMatch.a.name===playerName || finalMatch.b.name===playerName)){
    return 'Vice-campeão';
  }
  for(let ri=lastRoundIdx-1; ri>=0; ri--){
    const round = league.rounds[roundKeys[ri]];
    const wasHere = round.some(m=> m.a && m.b && (m.a.name===playerName || m.b.name===playerName));
    if(wasHere){
      const eliminatedInSize = round.length * 2;
      const nextSize = eliminatedInSize / 2;
      return `${nextSize+1}º–${eliminatedInSize}º Lugar`;
    }
  }
  return null;
}
