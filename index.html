async function checkLeagueRegistrationStatus(typeId){
  if(!game.authUser){
    game.accountLeagueSlots = { ...(game.accountLeagueSlots||{}), [typeId]: null };
    if(game.currentLeagueTypeId === typeId){ game.registeredTeam = null; }
    if(game.screen==='league'){ render(); }
    return;
  }
  try{
    const scheduleSnap = await scheduleDocRef(typeId).get();
    if(game.currentLeagueTypeId !== typeId){ return; } // usuário já saiu dessa liga -- descarta essa resposta atrasada
    if(!scheduleSnap.exists){
      game.accountLeagueSlots = { ...(game.accountLeagueSlots||{}), [typeId]: null };
      game.registeredTeam = null;
      if(game.screen==='league'){ render(); }
      return;
    }
    const cycles = scheduleSnap.data().cycles || [];
    const registering = cycles.find(c=>c.status==='registering');
    if(registering){
      const regSnap = await registrantDocRef(typeId, registering.id, game.authUser.uid).get();
      if(game.currentLeagueTypeId !== typeId){ return; }
      if(regSnap.exists){
        const data = regSnap.data();
        game.accountLeagueSlots = { ...(game.accountLeagueSlots||{}), [typeId]: data.slot!=null ? data.slot : null };
        game.registeredTeam = decodeTeamCode(data.code);
        if(game.screen==='league'){ render(); }
        return;
      }
    }
    // além da inscrição em si, a conta pode já estar competindo num ciclo sorteado (drawn/advancing) --
    // sem checar isso aqui, o aviso "você já está inscrito" sumia assim que a Liga saía da fase de
    // inscrição e entrava em andamento, mesmo com a sincronização continuando funcionando normalmente
    const activeCycles = cycles.filter(c=>c.status==='drawn' || c.status==='advancing');
    for(const entry of activeCycles){
      const detailSnap = await cycleDocRef(typeId, entry.id).get();
      if(game.currentLeagueTypeId !== typeId){ return; }
      if(!detailSnap.exists) continue;
      for(const league of (detailSnap.data().leagues||[])){
        for(const round of Object.values(league.rounds||{})){
          for(const m of round){
            const mine = (m.a && m.a.uid===game.authUser.uid) ? m.a : ((m.b && m.b.uid===game.authUser.uid) ? m.b : null);
            if(mine){
              game.accountLeagueSlots = { ...(game.accountLeagueSlots||{}), [typeId]: mine.slot!=null ? mine.slot : null };
              game.registeredTeam = decodeTeamCode(mine.code);
              if(game.screen==='league'){ render(); }
              return;
            }
          }
        }
      }
    }
    game.accountLeagueSlots = { ...(game.accountLeagueSlots||{}), [typeId]: null };
    game.registeredTeam = null;
  } catch(e){
    console.error('Erro ao checar inscrição na Liga:', e);
    game.accountLeagueSlots = { ...(game.accountLeagueSlots||{}), [typeId]: null };
    game.registeredTeam = null;
  }
  if(game.screen==='league'){ render(); }
}

/* -------------------------------------------------------------------
   ABERTURA DA TELA E POLLING
   (sem onSnapshot em tempo real dessa vez, já que os dados agora vêm
   de vários documentos -- um polling a cada 5s dá conta tranquilamente)
------------------------------------------------------------------- */
let leagueTickInterval = null;
const MAX_WATCHED_MATCHES = 300; // limite de partidas "assistidas" guardadas por conta, pra não crescer sem parar
async function loadWatchedMatches(){
  if(!game.authUser){ game.watchedMatches = new Set(); return; }
  try{
    const snap = await userDocRef(game.authUser.uid).get();
    const arr = (snap.exists && Array.isArray(snap.data().watchedMatches)) ? snap.data().watchedMatches : [];
    game.watchedMatches = new Set(arr);
  } catch(e){ console.error('Erro ao carregar partidas assistidas:', e); game.watchedMatches = new Set(); }
}
async function markMatchWatched(matchKey){
  if(!game.authUser || !matchKey) return;
  if(game.watchedMatches.has(matchKey)) return; // já estava marcada, não precisa gravar de novo
  game.watchedMatches.add(matchKey);
  render();
  try{
    let arr = Array.from(game.watchedMatches);
    if(arr.length > MAX_WATCHED_MATCHES){ arr = arr.slice(arr.length - MAX_WATCHED_MATCHES); } // descarta as mais antigas
    await userDocRef(game.authUser.uid).set({ watchedMatches: arr }, { merge:true });
  } catch(e){ console.error('Erro ao salvar partida assistida:', e); }
}
function isMatchRevealed(matchKey, roundIndex, phaseTimes){
  // sem gating (tela de histórico, por exemplo) -- sempre revelado
  if(!phaseTimes) return true;
  if(game.watchedMatches && game.watchedMatches.has(matchKey)) return true;
  // assim que a hora da PRÓXIMA fase chega, o resultado é revelado automaticamente pra todo mundo --
  // sem isso, alguém que nunca assiste ficaria pra sempre sem saber quem passou de fase
  const nextPhaseTime = phaseTimes[roundIndex+1];
  if(nextPhaseTime!=null && Date.now() >= nextPhaseTime) return true;
  return false;
}

function openLeague(typeId, typeConfig){
  const resolvedTypeId = typeId || CLASSIC_LEAGUE_TYPE;
  game.currentLeagueTypeId = resolvedTypeId;
  game.currentLeagueTypeConfig = typeConfig || null;
  game.leagueError = null;
  game.registeredTeam = null;
  // limpa tudo que é específico da liga anterior -- sem isso, a tela mostrava por um tempo os
  // confrontos/terrenos/ranking de qualquer que fosse a última liga vista, até o carregamento terminar
  game.leagueData = null;
  game.leagueLeaderboard = null;
  game.lastSeenLeagueCycleSignature = null;
  game.leagueScreenLoading = true;
  game.screen = 'league';
  render();

  const finishLoadingIfStillHere = () => {
    if(game.currentLeagueTypeId !== resolvedTypeId) return; // já saiu dessa liga nesse meio-tempo
    game.leagueScreenLoading = false;
    if(game.screen==='league'){ render(); }
  };

  // o "Carregando..." espera só o essencial (ciclo atual + status da sua inscrição). Históricos,
  // ranking e partidas assistidas chegam em segundo plano e cada seção aparece sozinha no render
  // conforme os dados chegam -- sem travar a tela e sem precisar de refresh
  Promise.all([
    refreshLeagueView(resolvedTypeId, true), // os históricos já saem daqui direto pro segundo plano
    checkLeagueRegistrationStatus(resolvedTypeId)
  ]).then(finishLoadingIfStillHere).catch(finishLoadingIfStillHere);
  loadWatchedMatches().then(()=>{
    if(game.currentLeagueTypeId===resolvedTypeId && game.screen==='league'){ render(); }
  }).catch(()=>{});
  loadLeagueLeaderboard(resolvedTypeId).then(lb=>{
    if(game.currentLeagueTypeId !== resolvedTypeId) return; // resposta atrasada de uma liga que já não é a atual
    game.leagueLeaderboard = lb;
    if(game.screen==='league'){ render(); }
  }).catch(()=>{});

  startLeagueListener();
}

// resolve qual código de time um jogador vai usar numa rodada: a troca escolhida (overridesMap), senão
// o MESMO sorteio determinístico que o avanço faz (eligibleCodes + Mewtwo ativado, seed idêntica) --
// por ser a mesma conta, o que essa função mostra é exatamente o que a batalha vai usar
function resolveTrainersLeagueTeamCodeForRound(data, roundIndex, uid, overridesMap){
  const override = (overridesMap||{})[String(roundIndex)];
  if(override) return override;
  const playerInfo = (data.players||[]).find(p=>p.uid===uid);
  const eligible = (playerInfo && playerInfo.eligibleCodes) ? playerInfo.eligibleCodes.slice() : [];
  if(playerInfo && playerInfo.mewtwoTeamCode){ eligible.push(playerInfo.mewtwoTeamCode); }
  if(eligible.length===0) return null;
  const rng = makeSeededRng(`trainers-randomteam-${data.dateId}-R${roundIndex}-${uid}`);
  return eligible[Math.floor(rng()*eligible.length)];
}
// clique no nome de um adversário DEPOIS do prazo de troca: busca a escolha dele e mostra o time no
// mesmo modal da Liga Clássica. Só é chamável depois do prazo -- antes disso o time é segredo

  } catch(e){ console.error('Erro ao buscar o time do jogador:', e); }

}
// quadro "Seu time" mostrado ACIMA da próxima rodada: o time escolhido pra ela (sprites + níveis,
// igual à tela inicial) com o botão de trocar embaixo -- o botão saiu do card da partida de propósito
function trainersLeagueMyTeamBoxHtml(data, roundIndex){
  const myUid = game.authUser ? game.authUser.uid : null;
  if(!myUid || roundIndex==null || roundIndex<0) return '';
  const round = data.scheduleRounds && data.scheduleRounds[roundIndex];
  if(!round) return '';
  const myMatch = round.matches.find(m=>!m.resolved && (m.a.uid===myUid || m.b.uid===myUid));
  if(!myMatch){
    // sem partida nessa rodada -- só mostra o aviso de folga se a pessoa está REALMENTE inscrita
    // nesse dia (número ímpar de inscritos gera 1 folga justa por jogador, uma vez no campeonato
    // inteiro); quem só está de passagem olhando a tela não vê nada, como já era antes
    const isRealParticipant = (data.players||[]).some(p=>p.uid===myUid);
    if(isRealParticipant){
      return `<div class="box"><h2>😴 Você está de folga nessa rodada!</h2></div>`;
    }
    return '';
  }
  const now = Date.now();
  const roundTime = data.roundTimes ? data.roundTimes[roundIndex] : null;
  const canSwap = roundTime!=null && now < roundTime - TRAINERS_LEAGUE_TEAM_SWAP_DEADLINE_MS;
  const canReorder = roundTime!=null && now < roundTime; // a ORDEM pode mudar até a hora da batalha (igual à Liga Clássica); só o TIME trava nos 5min
  const overrideCode = (game.trainersLeagueMyTeamOverrides||{})[String(roundIndex)];
  // depois do prazo, o time está travado -- mostra o que VAI batalhar (inclusive o sorteado, que é
  // determinístico e portanto já conhecido), igual à visibilidade da Liga Clássica pós-inscrição
  const finalCode = overrideCode || (!canSwap ? resolveTrainersLeagueTeamCodeForRound(data, roundIndex, myUid, game.trainersLeagueMyTeamOverrides) : null);
  const team = finalCode ? decodeTeamCode(finalCode) : null;
  const wasDrawn = !overrideCode && !!finalCode;
  const showReorderBtn = canReorder && !!finalCode; // precisa de um time CONHECIDO pra ordenar (escolhido, ou o sorteado já revelado pós-prazo)
  return `<div class="box">
    <h2>⚔️ Seu time para essa rodada</h2>
    ${team ? `
    <div class="save-slot-team-row">
      ${team.map(p=>{
        const sp = SPECIES[p.speciesId];
        return `<div class="save-slot-mon">
          <div class="save-slot-mon-sprite">${sp?spriteHtml(p.speciesId,'sprite-sm',p.shiny):'❔'}</div>
          <div class="save-slot-mon-level">Lv.${p.level}</div>
        </div>`;

function openTrainersLeagueOrderModal(dateId, roundIndex){
  const myUid = game.authUser ? game.authUser.uid : null;
  if(!myUid) return;
  // aceita tanto o time escolhido quanto o SORTEADO (pós-prazo de troca): reordenar o sorteado grava
  // ele como override com a nova ordem -- mesmo time, só a ordem muda, então não fura o prazo de troca
  let code = (game.trainersLeagueMyTeamOverrides||{})[String(roundIndex)];
  if(!code && game.trainersLeagueData){
    code = resolveTrainersLeagueTeamCodeForRound(game.trainersLeagueData, roundIndex, myUid, game.trainersLeagueMyTeamOverrides);
  }
  const team = code ? decodeTeamCode(code) : null;
  if(!team) return;
  game.trainersLeagueOrderModal = { dateId, roundIndex, team };
  render();
}

function moveTrainersLeagueOrder(idx, dir){
  const modal = game.trainersLeagueOrderModal;
  if(!modal) return;
  const newIdx = idx + dir;
  if(newIdx<0 || newIdx>=modal.team.length) return;
  const now = Date.now();
  const data = game.trainersLeagueData;
  const roundTime = data && data.roundTimes ? data.roundTimes[modal.roundIndex] : null;
  if(roundTime!=null && now >= roundTime){
    // a ORDEM pode mudar até a hora exata da batalha -- diferente do TIME, que trava 5min antes
    game.trainersLeagueOrderModal = null;
    game.trainersLeagueError = 'A batalha dessa rodada já começou -- não dá mais pra mudar a ordem.';
    render();
    return;
  }
  const tmp = modal.team[idx];
  modal.team[idx] = modal.team[newIdx];
  modal.team[newIdx] = tmp;
  render();
  // persiste a nova ordem no override da rodada (gravação pequena, sem debounce)
  const newCode = encodeTeamCode(modal.team);
  game.trainersLeagueMyTeamOverrides[String(modal.roundIndex)] = newCode;
  if(game.authUser){
    trainersLeagueTeamPickRef(modal.dateId, game.authUser.uid)
      .set({ overrides: { [String(modal.roundIndex)]: newCode } }, { merge:true })
      .catch(e=>console.error('Erro ao salvar a ordem do time:', e));
  }
}

function trainersLeagueMatchRow(match, roundLabel, dateId, roundIndex, matchIndex, phaseTimes){
  const myUid = game.authUser ? game.authUser.uid : null;
  const isMyMatch = myUid && (match.a.uid===myUid || match.b.uid===myUid);
  const highlightClass = isMyMatch ? ' my-match' : '';
  const matchKey = `trainers__${dateId}__${roundIndex}__${matchIndex}`;
  const nameA = trainerNameHtml(match.a, true); // sem link: o nome aqui abre o TIME (ver trainerNameHtml)
  const nameB = trainerNameHtml(match.b, true);
  const terrainBadge = match.terrain ? `<button class="terrain-inline-badge" style="background:${terrainColor(match.terrain)}" onclick="event.stopPropagation();openTerrainInfoModal('${match.terrain.id}')">${match.terrain.name}</button>` : '';
  const now = Date.now();
  const roundTime = phaseTimes ? phaseTimes[roundIndex] : null;
  const isHome = myUid && match.a.uid===myUid;
  // decide se o NOME fica clicável (revela o time) -- vale pra QUALQUER partida da lista, minha ou
  // não, só olhando o horário. Bug corrigido aqui: a versão antiga usava "!canSwapTeam" (que também
  // exigia isMyMatch), então partidas de OUTRAS pessoas liberavam o time assim que a rodada travava,
  // sem esperar os 5min de verdade -- só a MINHA partida respeitava o prazo corretamente
  const pastTeamRevealDeadline = roundTime!=null && now >= roundTime - TRAINERS_LEAGUE_TEAM_SWAP_DEADLINE_MS;
  const canPickTerrain = isHome && roundTime!=null && now < roundTime - TRAINERS_LEAGUE_TERRAIN_PICK_DEADLINE_MS;
  if(!match.resolved){
    // time de cada lado NUNCA aparece antes da partida (nem pra prévia por clique) -- pode ter sido
    // trocado até 5min antes, e o adversário não pode saber o que o outro vai usar.
    // O botão de trocar time saiu daqui de propósito -- mora no quadro "Seu time" acima da rodada
    const myTerrainPickId = canPickTerrain ? (game.trainersLeagueMyTerrainPicks||{})[String(roundIndex)] : null;
    const myPickedTerrain = myTerrainPickId ? TERRAINS.find(t=>t.id===myTerrainPickId) : null;
    const terrainBtnLabel = myPickedTerrain
      ? `🗺️ Terreno: <span class="terrain-inline-badge" style="background:${terrainColor(myPickedTerrain)}">${myPickedTerrain.name}</span>`
      : `🗺️ ${match.terrain?'Trocar':'Escolher'} terreno (até 10min antes)`;
    // pra quem NÃO é mandante (visitante) na SUA PRÓPRIA partida: mostra o terreno que o mandante já
    // escolheu, ao vivo (mesmo selo colorido da Liga Clássica), ou um aviso do prazo se ele ainda não
    // escolheu nada
    const isVisitorOfMyMatch = isMyMatch && myUid && match.b.uid===myUid;
    let visitorTerrainInfo = '';
    if(isVisitorOfMyMatch && !match.terrain){
      if(game.trainersLeagueOpponentTerrainPick){
        const t = game.trainersLeagueOpponentTerrainPick;
        visitorTerrainInfo = `<div class="tl-visitor-terrain"><span class="hint-text">🗺️ Terreno do mandante:</span> <span class="terrain-inline-badge" style="background:${terrainColor(t)}">${t.name}</span></div>`;
      } else if(roundTime!=null){
        const deadlineLabel = new Date(roundTime - TRAINERS_LEAGUE_TERRAIN_PICK_DEADLINE_MS).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
        visitorTerrainInfo = `<p class="hint-text">🗺️ Terreno da batalha será definido até as <strong>${deadlineLabel}</strong>.</p>`;
      }
    }
    return `<div class="league-match pending${highlightClass}">
      <div class="league-match-header-row">
        <div class="league-match-title">${roundLabel}</div>
        ${terrainBadge}
      </div>
      <div class="league-match-players centered">
        ${pastTeamRevealDeadline ? `
        <span class="player-link" onclick="showTrainersLeagueLockedTeam('${dateId}',${roundIndex},'${match.a.uid}','${escJs(match.a.name)}','${match.terrain ? match.terrain.types.join(",") : ''}')">${nameA}</span>
        <span class="vs">vs</span>
        <span class="player-link" onclick="showTrainersLeagueLockedTeam('${dateId}',${roundIndex},'${match.b.uid}','${escJs(match.b.name)}','${match.terrain ? match.terrain.types.join(",") : ''}')">${nameB}</span>
        ` : `
        <span>${nameA}</span>
        <span class="vs">vs</span>
        <span>${nameB}</span>
        `}
      </div>
      <div class="league-match-status">⏳ Aguardando o horário da batalha</div>
      ${canPickTerrain ? `<button class="btn secondary league-watch-btn" onclick="openTrainersLeagueTerrainPicker('${dateId}',${roundIndex})">${terrainBtnLabel}</button>` : ''}
      ${visitorTerrainInfo}
    </div>`;
  }

  // assistir (diferente da Liga Clássica, onde toda partida fica escondida até alguém assistir)
  const revealed = isMyMatch ? isMatchRevealed(matchKey, roundIndex, phaseTimes) : true;
  return `<div class="league-match resolved${highlightClass}">
    <div class="league-match-header-row">
      <div class="league-match-title">${roundLabel}</div>
      ${terrainBadge}
    </div>

      <span class="vs">vs</span>
      <span class="player-link ${revealed && match.winner.uid===match.b.uid?'win-text':''}" onclick="showPlayerTeamModal('${escJs(match.b.code)}','${escJs(match.b.name)}','${match.terrain ? match.terrain.types.join(",") : ''}','${escJs(match.b.uid||'')}')">${nameB}</span>

    <div class="league-match-status">${revealed ? `🏅 ${escapeHtmlSafe(match.winner.name)} venceu!` : '🔒 Assista a batalha pra saber quem venceu'}</div>

// cache em memória dos logs de batalha buscados sob demanda -- reassistir a mesma partida não
// refaz a busca no Firestore (o log de uma partida resolvida nunca muda)
const matchLogCache = {};
async function fetchStoredMatchLog(logDocRef, cacheKey){
  if(matchLogCache[cacheKey]){ return matchLogCache[cacheKey]; }
  try{
    const snap = await logDocRef.get();
    if(snap.exists && snap.data().matchups){
      matchLogCache[cacheKey] = snap.data().matchups;
      return matchLogCache[cacheKey];
    }
  } catch(e){ console.error('Erro ao buscar o log da batalha:', e); }
  return null;
}
async function watchTrainersLeagueMatch(dateId, roundIndex, matchIndex, matchKey){
  const data = game.trainersLeagueData;
  if(!data || !data.scheduleRounds || !data.scheduleRounds[roundIndex]) return;
  const match = data.scheduleRounds[roundIndex].matches[matchIndex];
  if(!match || !match.resolved) return;
  // formato antigo (log embutido na partida) funciona exatamente como sempre; formato novo
  // (logStored) busca o log sob demanda -- foi extraído pra um documento próprio pra não estourar
  // o limite de tamanho do documento do ciclo
  let matchups = (match.matchups && match.matchups.length>0) ? match.matchups : null;
  if(!matchups && match.logStored){
    matchups = await fetchStoredMatchLog(
      trainersLeagueCycleRef(dateId).collection('matchLogs').doc(`R${roundIndex}_M${matchIndex}`),
      `tl:${dateId}:R${roundIndex}:M${matchIndex}`
    );
  }
  if(!matchups || matchups.length===0) return;
  if(matchKey){ markMatchWatched(matchKey); } // revela essa partida pra sempre pra essa conta, a partir de agora
  game.leagueWatch = {
    playerAName: match.a.name,
    playerBName: match.b.name,
    matchups: matchups,
    winnerName: match.winner.name,
    terrain: match.terrain || null
  };
  preloadBattleSprites(matchups);
  game.leagueWatchIndex = 0;
  game.leagueWatchPhase = 'loading';
  game.leagueWatchReturnScreen = game.screen; // volta pra tela certa (liga ou navegador de rodadas)
  game.screen = 'leagueWatch';
  render();
  setTimeout(advanceLeagueWatch, 1200);
}

async function pickTrainersLeagueTeamForRound(slot){
  const target = game.trainersLeagueSwapTarget;
  if(!target || !game.authUser) return;
  const saveData = game.saveSlots && game.saveSlots[slot];
  if(!saveData || !saveData.team || (saveData.badgeCount||0) < 8){
    game.trainersLeagueError = 'Esse time não está pronto pro Trainers League (precisa das 8 insígnias).';
    render();
    return;
  }
  const now = Date.now();
  const data = game.trainersLeagueData;
  const roundTime = data && data.roundTimes ? data.roundTimes[target.roundIndex] : null;
  if(roundTime!=null && now >= roundTime - TRAINERS_LEAGUE_TEAM_SWAP_DEADLINE_MS){
    game.trainersLeagueError = 'Já passou dos 5 minutos antes dessa partida -- não dá mais pra trocar.';
    render();
    return;
  }
  game.trainersLeagueSubmitting = true;
  render();
  const code = encodeTeamCode(saveData.team);
  try{
    // grava só a chave dessa rodada específica dentro do mapa "overrides" -- usar notação de ponto no
    // campo (em vez de sobrescrever o objeto "overrides" inteiro) evita apagar trocas de outras rodadas
    await trainersLeagueTeamPickRef(target.dateId, game.authUser.uid).set(
      { overrides: { [String(target.roundIndex)]: code } }, // objeto ANINHADO de propósito -- set com merge funde mapas aninhados, mas trata chave pontuada como nome literal (só update interpreta pontos)
      { merge: true }
    );
    game.trainersLeagueSubmitting = false;
    leaveTrainersLeagueSwapPicker();
    await refreshTrainersLeagueView();
  } catch(e){
    console.error('Erro ao trocar time da rodada:', e);
    game.trainersLeagueSubmitting = false;
    game.trainersLeagueError = 'Erro ao trocar. Confira sua conexão e tente de novo.';
    render();
  }
}

function gatherEligiblePokemonForLeague(typeConfig){
  // junta os pokémons elegíveis (por tipo) de TODOS os saves completos (8 insígnias), sem repetir
  // espécie -- quando a mesma espécie aparece em mais de um save, fica só a de maior nível
  const allowedTypes = typeConfig.allowedTypes || [];
  const bySpecies = {};
  for(let slot=0; slot<MAX_SAVE_SLOTS; slot++){
    const s = game.saveSlots[slot];
    if(!s || !s.team || (s.badgeCount||0) < 8) continue;
    for(const p of s.team){
      const sp = SPECIES[p.speciesId];
      if(!sp) continue;
      if(allowedTypes.length>0 && !sp.types.some(t=>allowedTypes.includes(t))) continue;
      const existing = bySpecies[p.speciesId];
      if(!existing || p.level > existing.level){
        bySpecies[p.speciesId] = { speciesId:p.speciesId, level:p.level, shiny:!!p.shiny, sourceSlot: slot };
      }
    }
  }
  return Object.values(bySpecies).sort((a,b)=> SPECIES[a.speciesId].name.localeCompare(SPECIES[b.speciesId].name));
}

    return `<button class="btn ${isSel?'selected':''}" ${disabled} onclick="toggleCustomPickerMon('${p.speciesId}')">
      <span class="mon-name">${spriteHtml(p.speciesId,'sprite-sm',p.shiny)} ${sp.name}${p.shiny?' 🌟':''} — Lv.${p.level} ${isSel?'✓':''}</span>
      <span class="mon-sub">${typesHtml(sp.types)} <span class="pool-origin-tag">${escapeHtmlSafe(slotDisplayName(p.sourceSlot))}</span></span>
    </button>`;
  }).join('')}
  ${pool.length>0 ? `<button class="btn danger" ${(selected.length===0||game.leagueSubmitting)?'disabled':''} onclick="registerCustomTeamForLeague()">${game.leagueSubmitting?'Inscrevendo...':'Inscrever time ⚔️'}</button>` : ''}
  <button class="btn secondary" onclick="game.screen='league';render();">⬅ Voltar</button>`;
}
async function registerCustomTeamForLeague(){
  const typeId = game.currentLeagueTypeId;
  if(!game.authUser){ game.leagueTeamPickError = 'Você precisa estar logado.'; render(); return; }
  const selected = game.customPickerSelected || [];
  if(selected.length===0){ game.leagueTeamPickError = 'Escolha pelo menos 1 pokémon.'; render(); return; }
  const name = (game.trainerName||'').trim();
  if(!name){ game.leagueTeamPickError = 'Sua conta não tem um nome de treinador definido.'; render(); return; }
  const pool = game.customPickerPool || [];
  const team = selected.map(sid => pool.find(p=>p.speciesId===sid)).filter(Boolean).map(p=>({ speciesId:p.speciesId, level:p.level }));
  if(team.length===0){ game.leagueTeamPickError = 'Erro ao montar o time. Tente selecionar de novo.'; render(); return; }
  game.leagueSubmitting = true;
  game.leagueTeamPickError = null;
  render();
  const uid = game.authUser.uid;
  const code = encodeTeamCode(team);
  try{
    const cycleEntry = await ensureRegisteringCycle(typeId);
    const activeElsewhere = await isAccountActiveInLeague(typeId, uid);
    if(activeElsewhere){ throw new Error('ACTIVE_ELSEWHERE'); }
    const regRef = registrantDocRef(typeId, cycleEntry.id, uid);
    await db.runTransaction(async (tx)=>{
      const snap = await tx.get(regRef);
      if(snap.exists){ throw new Error('DUPLICATE'); }
      // slot fica 'custom' -- esse time não vem de um único save, é montado de vários, então não faz
      // sentido apontar pra um número de slot específico
      tx.set(regRef, { name, code, uid, slot: 'custom', specialties: game.specialties||[], elite: !!game.accountEliteChampion, registeredAt: Date.now() });
    });
    game.accountLeagueSlots = { ...(game.accountLeagueSlots||{}), [typeId]: 'custom' };
    game.leagueSubmitting = false;
    game.screen = 'league';
    render();
    refreshLeagueView(typeId, false);
  } catch(e){
    game.leagueSubmitting = false;
    if(e.message==='DUPLICATE' || e.message==='ACTIVE_ELSEWHERE') game.leagueTeamPickError = 'Sua conta já está inscrita nessa Liga em outra rodada.';
    else { console.error(e); game.leagueTeamPickError = 'Erro ao se inscrever. Confira sua conexão e tente de novo.'; }
    render();
  }
}
async function refreshLeagueView(typeId, includeHistory){
  const data = await loadLeagueViewData(typeId);
  if(game.currentLeagueTypeId !== typeId){ return; } // usuário já saiu dessa liga -- descarta essa resposta atrasada
  game.leagueData = data;
  // mesmo quando ESTE navegador não foi quem processou a mudança (ex: a Cloud Function ou o navegador de
  // outro jogador já cuidou disso), se o ciclo "atual" mostrado na tela mudou de identidade ou status desde
  // a última vez, trata como se algo tivesse mudado -- senão "Suas últimas Ligas" fica desatualizada
  // indefinidamente sempre que este navegador não é quem processa as fases
  const activeCycle = data.cycles.find(c=>c.leagues);
  const activeCycleSignature = activeCycle ? (activeCycle.id + ':' + activeCycle.status) : null;
  const cycleChangedRemotely = activeCycleSignature !== game.lastSeenLeagueCycleSignature;
  game.lastSeenLeagueCycleSignature = activeCycleSignature;
  if((includeHistory || cycleChangedRemotely) && game.trainerName){
    // históricos + reconciliação são a parte PESADA da tela (dezenas de leituras de documentos grandes)
    // -- rodam em segundo plano e atualizam a tela sozinhos quando terminam, em vez de segurar o
    // "Carregando..." e o tick de 5s. Os gatilhos ao vivo continuam exatamente os mesmos: primeira
    // abertura (includeHistory) e mudança de ciclo detectada remotamente (cycleChangedRemotely) --
    // nada passou a depender de refresh da página
    refreshLeagueHistoriesInBackground(typeId);
  }
  if(game.currentLeagueTypeId !== typeId){ return; }
  if(game.screen==='league'){ render(); }
}
let leagueHistoryRefreshInFlight = false;
async function refreshLeagueHistoriesInBackground(typeId){
  if(leagueHistoryRefreshInFlight) return; // abertura + tick de 5s podem coincidir -- não empilha varreduras
  leagueHistoryRefreshInFlight = true;
  try{
    // garante que colocações/títulos estejam em dia antes de mostrar "Suas últimas Ligas" -- sem isso,
    // quem não foi o navegador que processou sua própria partida só veria o histórico depois de visitar a Home
    await reconcileLeagueWinsFromHistory();
    if(game.currentLeagueTypeId !== typeId){ return; } // saiu dessa liga durante a varredura
    game.myLeagueHistory = await loadMyLeagueHistory(5);
    if(typeId === CLASSIC_LEAGUE_TYPE){ game.globalLeagueHistory = await loadGlobalLeagueHistory(10); }
    if(game.currentLeagueTypeId === typeId && game.screen==='league'){ render(); }
  } catch(e){ console.error('Erro ao atualizar históricos da Liga:', e); }
  finally{ leagueHistoryRefreshInFlight = false; }
}
function startLeagueListener(){
  if(!leagueTickInterval){
    // o cliente NÃO tenta mais avançar a Liga por aqui -- o cron do servidor (1x/min) cuida de todo o
    // avanço, e o refreshLeagueView já detecta sozinho quando o ciclo mudou remotamente (assinatura) pra
    // recarregar o histórico. Com muita gente na tela ao mesmo tempo, cada cliente tentando avançar a cada
    // 5s gerava transações/leituras à toa em TODOS os tipos de liga -- agora o polling é só leitura
    leagueTickInterval = setInterval(async ()=>{
      if(game.screen!=='league') return;
      const typeId = game.currentLeagueTypeId || CLASSIC_LEAGUE_TYPE;
      await refreshLeagueView(typeId, false);
    }, 5000);
  }
}
function stopLeaguePolling(){
  if(leagueTickInterval){ clearInterval(leagueTickInterval); leagueTickInterval = null; }
}
function leaveLeagueScreen(){
  stopLeaguePolling();
  game.screen = 'leagueTypesList';
  render();
}


function prepareRetry(){
  // no difícil a derrota rende menos desde o PRIMEIRO ginásio -- diferente do bolo de vitória,
  // que só é reduzido de vez a partir do 3º
  const bolo = isHardMode() ? HARD_DEFEAT_POOL : 5;
  game.pool = bolo;
  game.poolTotal = bolo;
  game.alloc = {};
  game.team.forEach(p=> game.alloc[p.id]=0 );
  game.levelsFromRocket = false;
  game.levelsFromRivalWin = false;
  game.screen = 'levels';
  render();
}
/* BÔNUS DE KANTO -- entregue ao vencer o Giovanni (8ª insígnia).
   Quanto menos derrotas na jornada inteira, mais níveis o time todo ganha.

   Por que existe: o jogo dá +1 nível a cada pokémon que DESMAIA numa batalha. Isso nasceu como
   rede pra quem estava atrás, mas como a distribuição normal trava no nível 55 e o desmaio não
   tem teto, quem perdia de propósito terminava até 16 níveis acima de quem vencia tudo limpo --
   e os jogadores descobriram e passaram a farmar derrota.
   Este bônus inverte o incentivo sem punir ninguém: quem apanhou muito continua com o que tinha,
   quem jogou bem recebe o prêmio que faltava. */
const KANTO_BONUS_TIERS = [
  { maxLosses: 5,  levels: 4 },
  { maxLosses: 10, levels: 3 },
  { maxLosses: 15, levels: 2 },
  { maxLosses: 22, levels: 1 },
  { maxLosses: Infinity, levels: 0 }
];
function kantoBonusLevels(totalLosses){
  const t = KANTO_BONUS_TIERS.find(x => (totalLosses||0) <= x.maxLosses);
  return t ? t.levels : 0;
}

/* ============================================================================
   MODO DIFÍCIL
   ----------------------------------------------------------------------------
   Escolhido ao criar o save e gravado nele pra sempre. O que muda:

   - menos pontos de nível por ginásio, mas SÓ A PARTIR DO 3º. Os dois primeiros
     ficam iguais ao normal, e isso não é generosidade: no começo o jogador tem 2
     pokémon contra os 3 do Brock, e simulando com o bolo reduzido desde o início
     100% das jornadas morriam no primeiro ginásio.
   - derrota rende 3 pontos em vez de 5, também só a partir do 3º ginásio.
   - metade dos pokémon dos líderes é shiny (efeito pequeno no dano, mas é o sinal
     visual do modo).
   - chance de shiny selvagem 4x maior -- a recompensa por jogar assim.

   Medido em simulação: 30% das jornadas difíceis chegam ao fim, contra 80% das
   normais, e o jogador perde 8,9 vezes contra 5,3. As mortes se concentram no
   Giovanni, no fim da jornada -- não no começo.
   ============================================================================ */
const HARD_MODE_FROM_GYM = 2;          // índice do ginásio (0=Brock): a partir do 3º
/* Bolo por vitória no difícil: a MESMA escala do normal, com metade dos valores.
   Fixar num número só (15 pra qualquer caso) apagava o gradiente -- vencer de primeira e vencer
   na última tentativa davam igual, e some o incentivo de jogar bem. A proporção entre os extremos
   é preservada: 3x no normal (30 vs 10) e 3x aqui (15 vs 5). */
const HARD_VICTORY_LEVEL_POOLS = [15, 13, 10, 8, 5];
/* Brock e Misty no difícil: escala com topo 20 em vez de 30. Fica entre o normal e o resto da
   jornada -- o começo aperta, mas não tanto quanto os ginásios seguintes.
   ATENÇÃO ao mexer nisto: com 20 no topo E derrota valendo 3, a simulação aponta ~11% das jornadas
   morrendo no PRÓPRIO Brock (antes era 0%). É o preço de apertar o início, onde o jogador tem 2
   pokémon contra os 3 do líder. Se esse número incomodar, é aqui que se mexe. */
const HARD_EARLY_VICTORY_POOLS = [20, 17, 13, 10, 7];
const HARD_DEFEAT_POOL = 3;            // bolo por derrota no difícil, em TODOS os ginásios (normal é 5)
const RIVAL_WIN_BONUS = 3;             // bônus por vencer o rival (era 5)
const HARD_RIVAL_BONUS = 3;            // bônus por vencer o rival no difícil
const HARD_LEADER_SHINY_RATIO = 0.5;   // fração do time do líder que vem shiny (quantidade exata)
const HARD_SHINY_CHANCE = 1/32;        // 4x a chance normal (1/128)

function isHardMode(){ return game.gameMode === 'hard'; }
// as regras do difícil só valem depois da Misty -- ver comentário acima
function hardRulesActive(){ return isHardMode() && game.gymIndex >= HARD_MODE_FROM_GYM; }

const GYM_VICTORY_LEVEL_POOLS = [30, 25, 20, 15, 10]; // índice = quantidade de derrotas antes de vencer (0 derrotas = venceu de primeira, ganha o máximo)
function continueJourney(){
  // captura ANTES de zerar losses -- assim a próxima distribuição de levels (no início da leg seguinte)
  // sabe quantas tentativas o jogador precisou pra vencer ESSE ginásio
  // no difícil o bolo é fixo e menor a partir do 3º ginásio; antes disso segue a tabela normal
  // a tabela usada muda com o modo, mas o índice é o mesmo: quantas derrotas custou este ginásio
  const tabela = !isHardMode() ? GYM_VICTORY_LEVEL_POOLS
    : (hardRulesActive() ? HARD_VICTORY_LEVEL_POOLS : HARD_EARLY_VICTORY_POOLS);
  game.pendingGymVictoryPool = tabela[Math.min(game.losses, tabela.length-1)];
  if(game.losses > 0){ game.everComeback = true; } // conquista "Superação": venceu um ginásio depois de perder nele -- flag PERMANENTE, porque a linha abaixo zera o contador (que era o único sinal antes, e por isso a conquista nunca destravava no momento certo)
  game.gymIndex++;
  game.losses = 0;
  game.gymTerrain = null; // sorteia de novo pro próximo ginásio, não reaproveita o do anterior
  game.gymApproachRocketChecked = false;
  game.gymApproachRivalChecked = false;
  // as rotas saem de dentro do escolherGinasio: até a região da etapa nova ser decidida, não dá
  // pra saber quais duas rotas oferecer
  irParaEscolhaDeGinasio();
  render();
}
function showJourneyEnd(){
  /* Bônus de Kanto: +N níveis pra TODO o time, conforme as derrotas da jornada (ver KANTO_BONUS_TIERS).
     Aplicado direto, sem passar pela distribuição -- de propósito: a distribuição trava no nível 55, e
     é justamente o jogador que venceu limpo que está nesse teto. Se o bônus respeitasse a trava, ele
     não receberia nada e a correção não corrigiria nada.
     A marca kantoBonusApplied garante uma vez só por save: sem ela, reabrir a tela de fim de jornada
     (ou recarregar o jogo nela) daria o bônus de novo. */
  if(!game.kantoBonusApplied){
    const b = kantoBonusLevels(game.lossesTotal||0);
    game.kantoBonusApplied = true;
    game.kantoBonusSeen = false;   // a caixa aparece nesta visita e some nas próximas
    game.kantoBonusLevels = b;
    if(b > 0){
      game.team.forEach(p => {
        p.level = Math.min(99, (p.level||1) + b);
        p.maxHp = calcMaxHp(p);   // o HP máximo depende do nível; sem recalcular, a barra fica defasada
        p.hp = p.maxHp;           // chega no fim da jornada com o time cheio
      });
    }
  }
  game.screen = 'journeyEnd';
  render();
}
/* Campos que são da CONTA, não do save: têm que sobreviver ao freshGameDefaults, tanto ao
   reiniciar a jornada quanto ao começar um save novo.

   Estão nesta lista ÚNICA porque antes eram um punhado de `const keepX = game.x` repetido nos
   dois lugares -- e bastava esquecer um nome numa das cópias pro campo sumir sem ninguém notar.
   Foi exatamente o que aconteceu com dois deles:

     permanentShinyDex  a Pokédex shiny voltava VAZIA ao entrar numa jornada. O jogador via todos
                        os slots em branco no botão "Consultar Pokédex" da tela de selvagens, e os
                        shiny só reapareciam depois de passar pela Pokédex da home -- que é a única
                        tela que recarregava tudo do servidor (openPokedex -> loadPermanentUserData).
                        De quebra, o marcador "já tenho" sumia dos shiny selvagens, que é justamente
                        onde ele mais importa.
     specialties        pior, porque o efeito era mecânico e invisível: quem era especialista jogava
                        a jornada nova INTEIRA sem o +1%, já que applySpecialtyBuff cai em
                        game.specialties e o syncSpecialties só dispara quando alguém do time chega
                        ao nível da especialidade. */
const CAMPOS_DA_CONTA = [
  'authUser','saveSlots','trainerName','rivalNameDefault','permanentPokedex','permanentShinyDex',
  'accountEliteChampion','leagueWinsTotal','leagueLeaderboard','trainerBestStreak','trainerLastStreak',
  'shinyBonusExpiresAt','shinyPityCount','specialties','specialtyCounts',
  'mewtwoLoanActive','mewtwoLoanCooldownUntil','mewtwoLoanUnlocked','mewtwoLoanReadyToClaim',
  'userTest','neighborhoodGymLocation','startersSorteados','bossTop10','bossKiller'
];
function snapshotDaConta(){
  const o = {};
  for(const k of CAMPOS_DA_CONTA){ o[k] = game[k]; }
  return o;
}
function restauraDadosDaConta(dados){
  for(const k of CAMPOS_DA_CONTA){ game[k] = dados[k]; }
}
function resetGame(){
  stopLeaguePolling();
  const conta = snapshotDaConta();
  const keepUser = game.authUser;
  const keepSlot = game.currentSaveSlot;
  game = freshGameDefaults();
  restauraDadosDaConta(conta);
  game.currentSaveSlot = keepSlot;
  game.pendingNewSaveSlot = keepSlot;
  // reiniciar a jornada zera o rival tambem (novo desafio, novo rival) -- por isso volta pra tela de
  // nome do rival em vez de ir direto pra escolha de inicial, senao o rival ficaria sem nome
  game.screen = keepUser ? 'newSaveName' : 'auth';
  render();
  if(keepUser && keepSlot!=null){ saveCurrentGame(); }
}
function requestReset(){
  game.showResetConfirm = true;
  render();
}
function cancelReset(){
  game.showResetConfirm = false;
  render();
}
function confirmReset(){
  resetGame();
}

/* ---------------------------------------------------
   AUTENTICAÇÃO (Firebase Auth)
--------------------------------------------------- */
function switchAuthMode(mode){
  /* leva junto o e-mail já digitado: sem isso, ir de "Entrar" pra "Criar conta" -- ou pro
     "Esqueci minha senha" -- limpava o campo e a pessoa digitava tudo de novo */
  const campo = document.getElementById('auth-email-input');
  if(campo) game.authEmail = campo.value;
  game.authMode = mode;
  game.authError = null;
  game.authNotice = null;
  render();
}
function authErrorMessage(e){
  const code = e && e.code;
  if(code==='auth/email-already-in-use') return 'Esse e-mail já está cadastrado. Tente entrar em vez de criar conta.';
  if(code==='auth/invalid-email') return 'E-mail inválido.';
  if(code==='auth/weak-password') return 'Senha muito fraca (mínimo 6 caracteres).';
  if(code==='auth/wrong-password' || code==='auth/user-not-found' || code==='auth/invalid-credential') return 'E-mail ou senha incorretos.';
  if(code==='auth/popup-closed-by-user') return 'Login cancelado.';
  if(code==='auth/too-many-requests') return 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.';
  if(code==='auth/missing-email') return 'Digite o e-mail da sua conta.';
  if(code==='auth/user-disabled') return 'Essa conta está desativada.';
  console.error(e);
  return 'Algo deu errado. Tente de novo.';
}
async function signInWithGoogle(){
  game.authBusy = true; game.authError = null; render();
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
  } catch(e){
    game.authError = authErrorMessage(e);
    game.authBusy = false;
    render();
  }
}
async function loginWithEmail(){
  const email = document.getElementById('auth-email-input')?.value.trim();
  const password = document.getElementById('auth-password-input')?.value;
  game.authEmail = email || '';   // o render do erro recria o campo: sem isso, errar a senha apagava o e-mail junto
  if(!email || !password){ game.authError = 'Preencha e-mail e senha.'; render(); return; }
  game.authBusy = true; game.authError = null; game.authNotice = null; render();
  try{
    await auth.signInWithEmailAndPassword(email, password);
  } catch(e){
    game.authError = authErrorMessage(e);
    game.authBusy = false;
    render();
  }
}
async function registerWithEmail(){
  const email = document.getElementById('auth-email-input')?.value.trim();
  const password = document.getElementById('auth-password-input')?.value;
  game.authEmail = email || '';
  if(!email || !password){ game.authError = 'Preencha e-mail e senha.'; render(); return; }
  if(password.length<6){ game.authError = 'A senha precisa ter pelo menos 6 caracteres.'; render(); return; }
  game.authBusy = true; game.authError = null; game.authNotice = null; render();
  try{
    await auth.createUserWithEmailAndPassword(email, password);
  } catch(e){
    game.authError = authErrorMessage(e);
    game.authBusy = false;
    render();
  }
}
/* Recuperação de senha.

   E-MAIL DESCONHECIDO NÃO É ERRO AQUI. O Firebase devolve auth/user-not-found, e repassar isso pra
   tela transforma o formulário num oráculo: qualquer um descobre quais e-mails têm conta no jogo
   testando um por um. A resposta é a mesma nos dois casos -- por isso a mensagem diz "se existir
   conta com esse e-mail".

   O resto do fluxo é do Firebase: o link do e-mail abre a página de troca de senha hospedada por
   ele, e a senha nova já vale no próximo login. Não há nada pra guardar do nosso lado. */
async function sendPasswordReset(){
  const campo = document.getElementById('auth-email-input');
  const email = campo ? campo.value.trim() : '';
  game.authEmail = email;
  if(!email){ game.authError = 'Digite o e-mail da sua conta.'; render(); return; }
  game.authBusy = true; game.authError = null; game.authNotice = null; render();
  try{
    await enviarEmailDeRecuperacao(email);
  } catch(e){
    if(!(e && e.code === 'auth/user-not-found')){   // ver o comentário acima
      game.authError = authErrorMessage(e);
      game.authBusy = false;
      render();
      return;
    }
  }
  game.authBusy = false;
  game.authMode = 'login';   // o próximo passo é entrar com a senha nova -- a tela já espera por isso
  game.authNotice = 'Se existir conta com esse e-mail, o link pra criar uma senha nova acabou de sair. Olhe também o spam. Se você sempre entrou com o 🔵 Google, pode continuar entrando por lá.';
  render();
}
/* O link volta pro jogo depois da troca (continue URL). Ele só é aceito se o domínio estiver na
   lista de autorizados do Firebase Auth -- e o SDK recusa a chamada INTEIRA quando não está, em vez
   de ignorar o extra. Daí a segunda tentativa pelada: melhor um e-mail sem link de volta do que
   e-mail nenhum. */
async function enviarEmailDeRecuperacao(email){
  try{
    await auth.sendPasswordResetEmail(email, { url: window.location.origin + '/', handleCodeInApp: false });
  } catch(e){
    const code = e && e.code;
    if(code==='auth/unauthorized-continue-uri' || code==='auth/invalid-continue-uri' || code==='auth/missing-continue-uri'){
      await auth.sendPasswordResetEmail(email);
      return;
    }
    throw e;
  }
}
/* ---------------------------------------------------
   INSTALAR COMO APP (PWA)
   O navegador dispara 'beforeinstallprompt' quando o site é instalável -- guardamos esse evento e
   só disparamos o prompt quando a pessoa clica no botão (não dá pra chamar do nada, tem que ser em
   resposta a um clique). O iPhone é o caso chato: o Safari NÃO dispara esse evento e não tem prompt
   nenhum -- instalar lá é manual, pelo menu Compartilhar, então mostramos instruções em vez do botão
--------------------------------------------------- */
function isIosDevice(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}
function isRunningAsInstalledApp(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function canShowInstallButton(){
  if(isRunningAsInstalledApp()) return false; // já está rodando como app instalado -- não faz sentido oferecer
  return !!game.deferredInstallPrompt || isIosDevice();
}
async function promptInstallApp(){
  if(isIosDevice() && !game.deferredInstallPrompt){
    game.showIosInstallModal = true; // no iPhone não tem prompt -- só dá pra explicar o caminho manual
    render();
    return;
  }
  const promptEvent = game.deferredInstallPrompt;
  if(!promptEvent) return;
  game.deferredInstallPrompt = null; // cada evento só pode ser usado UMA vez
  try{
    promptEvent.prompt();
    await promptEvent.userChoice;
  } catch(e){ console.error('Erro ao abrir o instalador do app:', e); }
  render();
}
function closeIosInstallModal(){
  game.showIosInstallModal = false;
  render();
}
function renderIosInstallModal(){
  return `
  <div class="modal-overlay">
    <div class="modal-box">
      <div class="modal-icon">📲</div>
      <h2>Instalar no iPhone</h2>
      <p>No iPhone a instalação é manual, pelo próprio Safari:</p>

/* SORTEIO DOS INICIAIS -- PRESO AO SLOT, não à tentativa.
   O que estava acontecendo: quem não gostava do resultado apagava o save e criava de novo. Sai
   barato -- recomeçar não custa nada -- e compensa: no modo normal são ~43 saves criados até um
   dos três vir shiny (2,3% por tentativa), 11 no difícil (9,1%).
   Agora o resultado fica gravado NA CONTA, por slot, e sobrevive ao delete: recriar no mesmo slot
   traz exatamente os mesmos iniciais. Um sorteio novo só acontece quando aquele slot conquista a
   1ª insígnia (ver limparSorteioDosIniciais) -- ou seja, pra rolar de novo tem que jogar de verdade.
   Quem joga limpo não perde nada: a chance por JORNADA continua a mesma.

   A chave inclui o MODO porque o difícil tem 4x a chance. Sem isso dava pra sortear no difícil,
   ver o resultado e recriar no normal levando o shiny -- trocando uma artimanha por outra. */
function chaveDoSorteio(slot, modo){ return String(slot) + ':' + (modo === 'hard' ? 'hard' : 'normal'); }
function sorteioDosIniciais(slot, modo){
  const chave = chaveDoSorteio(slot, modo);
  const guardado = game.startersSorteados && game.startersSorteados[chave];
  if(guardado){
    // só os iniciais conhecidos: se a lista de STARTERS mudar, o que falta é sorteado agora
    const resultado = {};
    let faltou = false;
    STARTERS.forEach(id=>{
      if(typeof guardado[id] === 'boolean') resultado[id] = guardado[id];
      else { resultado[id] = Math.random() < (modo==='hard' ? HARD_SHINY_CHANCE : SHINY_CHANCE); faltou = true; }
    });
    if(faltou) gravarSorteioDosIniciais(chave, resultado);
    return resultado;
  }
  const chance = (modo === 'hard') ? HARD_SHINY_CHANCE : SHINY_CHANCE;
  const resultado = {};
  STARTERS.forEach(id=>{ resultado[id] = Math.random() < chance; });
  gravarSorteioDosIniciais(chave, resultado);
  return resultado;
}
function gravarSorteioDosIniciais(chave, resultado){
  game.startersSorteados = game.startersSorteados || {};
  game.startersSorteados[chave] = resultado;
  if(!game.authUser) return;
  userDocRef(game.authUser.uid)
    .set({ startersSorteados: { [chave]: resultado } }, { merge: true })
    .catch(e=>console.error('Erro ao gravar o sorteio dos iniciais:', e));
}
/* Chamado quando o slot conquista a PRIMEIRA insígnia: a tentativa contou, então o próximo save
   naquele slot tem direito a um sorteio novo. Limpa os dois modos -- a jornada seguinte pode ser
   em qualquer um deles. */
function limparSorteioDosIniciais(slot){
  if(slot == null) return;
  const chaves = [chaveDoSorteio(slot,'normal'), chaveDoSorteio(slot,'hard')];
  chaves.forEach(k => { if(game.startersSorteados) delete game.startersSorteados[k]; });
  if(!game.authUser) return;
  const apagar = {};
  chaves.forEach(k => { apagar['startersSorteados.'+k] = firebase.firestore.FieldValue.delete(); });
  userDocRef(game.authUser.uid).update(apagar)
    .catch(e=>console.error('Erro ao liberar o sorteio dos iniciais:', e));
}

/* SALVAMENTO NÃO CONFIRMADO -- por que isso existe.
   `set()` resolve assim que o SDK aceita a gravação LOCALMENTE. Sem rede, ela vai pra uma fila em
   memória (não habilitamos persistência), o `await` volta sem erro nenhum, a tela segue como se
   tivesse salvado -- e a fila morre junto com a aba. O jogador joga uma hora e perde tudo sem um
   aviso sequer. Foi exatamente esse o sintoma reportado: o save no servidor congelado no estado
   do carregamento, regravado idêntico a cada vez que abria.
   `waitForPendingWrites()` só resolve quando o SERVIDOR confirma. É o único jeito de saber que o
   save chegou. Se não confirmar em CONFIRMA_SAVE_MS, o aviso sobe na tela. */
const CONFIRMA_SAVE_MS = 12000;
/* UM `undefined` EM QUALQUER CANTO DERRUBA O SAVE INTEIRO.
   O Firestore recusa o documento todo com "Unsupported field value: undefined" -- e a mensagem
   dele não diz QUAL campo. Foi assim que um save ficou dias sem gravar: o jogador jogava, o
   documento no servidor continuava congelado, e o erro morria no console.
   Aqui a gravação passa a limpar esses campos (o save ANDA, que é o que importa pro jogador) e a
   anotar no próprio documento quais foram, em `saveCamposRemovidos`. É autodiagnóstico: basta ler
   o save depois pra saber exatamente onde nasceu o undefined, em vez de adivinhar. */
function limparParaFirestore(valor, caminho, achados){
  if(valor === undefined) return undefined;
  if(Array.isArray(valor)){
    /* Laço por ÍNDICE, não .map(): map PULA buraco de array e o mantém no resultado -- e buraco,
       pro Firestore, é undefined igual. Foi esse o ponto cego da primeira versão: `Object.keys`
       também não lista buraco, então a varredura passava direto e a gravação continuava sendo
       recusada. Buraco vira null, que o Firestore aceita. */
    const saida = [];
    for(let i = 0; i < valor.length; i++){
      const limpo = limparParaFirestore(valor[i], caminho+'['+i+']', achados);
      if(limpo === undefined){ achados.push(caminho+'['+i+']'); saida.push(null); }
      else saida.push(limpo);
    }
    return saida;
  }
  if(valor && typeof valor === 'object'){
    const saida = {};
    for(const k of Object.keys(valor)){
      const sub = caminho ? caminho+'.'+k : k;
      const limpo = limparParaFirestore(valor[k], sub, achados);
      if(limpo === undefined){ achados.push(sub); continue; }
      saida[k] = limpo;
    }
    return saida;
  }
  return valor;
}
function avisoDeSave(estado, detalhe){
  const antes = game.saveAviso && game.saveAviso.estado;
  game.saveAviso = estado ? { estado, detalhe: detalhe||'', quando: Date.now() } : null;
  if(antes !== estado) render();   // só redesenha quando o aviso muda de estado
}
async function saveCurrentGame(){
  if(!game.authUser || game.currentSaveSlot==null) return;
  try{
    // merge:true é essencial aqui -- sem isso, cada salvamento SUBSTITUI o documento inteiro no
    // Firestore, apagando qualquer campo que serializeGame() não devolva (customName, favorite).
    // Esses dois só são escritos pelas telas de renomear/favoritar, nunca por aqui -- sem merge,
    // qualquer salvamento normal do jogo (autosave, fim de batalha, cura da Elite) apagava o nome
    // customizado e o favorito de volta pro padrão ("Time N", desfavoritado)
    const removidos = [];
    /* Duas passadas de propósito. A primeira NOMEIA o que estava indefinido (é o diagnóstico que
       vai gravado no documento); a segunda é o cinto de segurança: JSON.stringify some com
       undefined em objeto e transforma buraco de array em null, sem depender da minha varredura
       acertar todos os cantos. Perder progresso de novo por um canto esquecido não é aceitável. */
    const dados = JSON.parse(JSON.stringify(limparParaFirestore(serializeGame(), '', removidos)));
    if(removidos.length){
      console.warn('Campos indefinidos removidos do save:', removidos);
      dados.saveCamposRemovidos = removidos.slice(0, 12);
      dados.saveCamposRemovidosEm = Date.now();
    }
    await saveDocRef(game.authUser.uid, game.currentSaveSlot).set(dados, { merge: true });
    const confirmou = await Promise.race([
      db.waitForPendingWrites().then(()=>true),
      new Promise(r=>setTimeout(()=>r(false), CONFIRMA_SAVE_MS))
    ]);
    avisoDeSave(confirmou ? null : 'semConfirmacao');
    // um pokémon pode ter cruzado o nível 60 nessa jogada -- reconta em segundo plano, sem travar nada.
    // Só vale a pena chamar se alguém do time já está no limiar; senão é chamada desperdiçada
    if(game.team.some(p=>p.level >= SPECIALTY_LEVEL)){ syncSpecialties(); }
  } catch(e){
    console.error('Erro ao salvar:', e);
    avisoDeSave('erro', (e && (e.code || e.message)) || '');
  }
}

   agora do que uma hora de jogo perdida depois. */

      : '⚠️ <strong>Sem confirmação do servidor.</strong> O que você jogar agora pode se perder ao fechar o jogo.'}
      ${a.detalhe ? `<span class="save-aviso-cod">(${escapeHtmlSafe(String(a.detalhe))})</span>` : ''}</span>
    <button class="save-aviso-btn" onclick="tentarSalvarAgora()">Tentar salvar</button>

let autoSaveDebounceTimer = null;
function maybeAutoSave(){
  if(!game.authUser || game.currentSaveSlot==null) return;
  if(!SAFE_SAVE_SCREENS.has(game.screen)) return;
  // agrupa cliques rápidos (ex: distribuir vários pontos de level seguidos) numa única gravação,
  // em vez de escrever no Firestore a cada clique individual
  if(autoSaveDebounceTimer){ clearTimeout(autoSaveDebounceTimer); }
  autoSaveDebounceTimer = setTimeout(()=>{
    autoSaveDebounceTimer = null;
    if(game.authUser && game.currentSaveSlot!=null && SAFE_SAVE_SCREENS.has(game.screen)){
      saveCurrentGame();
    }
  }, 800);
}
function flushPendingAutoSave(){
  if(!autoSaveDebounceTimer) return;
  clearTimeout(autoSaveDebounceTimer);
  autoSaveDebounceTimer = null;
  if(game.authUser && game.currentSaveSlot!=null && SAFE_SAVE_SCREENS.has(game.screen)){
    saveCurrentGame();
  }
}
function applySavedState(data){
  // trainerName NÃO é mais lido daqui -- é por conta agora (já carregado antes, via loadPermanentUserData).
  // Saves antigos ainda têm esse campo salvo (de antes dessa mudança), mas não deve mais sobrescrever o
  // nome da conta ao continuar um save antigo
  game.screen = SAFE_SAVE_SCREENS.has(data.screen) ? data.screen : 'preBattle';
  game.routeCards = data.routeCards || null;
  game.gymIndex = data.gymIndex || 0;
  // saves anteriores a essa regra não têm o campo -- deduz pelo time: se já existe shiny nele, a
  // jornada claramente já conseguiu o dela. Não é perfeito (um shiny solto ou trocado não aparece
  // aqui), mas erra pro lado generoso e evita que save veterano recomece a escalada do zero
  game.shinyFoundThisSave = (typeof data.shinyFoundThisSave === 'boolean')
    ? data.shinyFoundThisSave
    : (data.team||[]).some(p=>p && p.shiny);
  game.starterId = data.starterId || null;
  game.wildEncounterSeq = data.wildEncounterSeq || 0;
  game.wildOffer = data.wildOffer || [];
  game.wildSelected = data.wildSelected || [];
  game.team = hydrateTeam(data.team);
  game.releaseSelected = data.releaseSelected || [];
  game.pool = data.pool || 0;
  game.poolTotal = data.poolTotal || 0;
  game.alloc = data.alloc || {};
  game.losses = data.losses || 0;
  game.lossesTotal = data.lossesTotal || 0;
  game.kantoBonusApplied = !!data.kantoBonusApplied;
  game.kantoBonusSeen = !!data.kantoBonusSeen;
  game.eliteShinyGranted = !!data.eliteShinyGranted;
  game.eliteShinyUsed = !!data.eliteShinyUsed;
  game.gameMode = data.gameMode === 'hard' ? 'hard' : 'normal';
  game.kantoBonusLevels = data.kantoBonusLevels || 0;
  game.everComeback = data.everComeback || false;
  game.eliteDittoWin = data.eliteDittoWin || false;
  game.eliteWinTeam = data.eliteWinTeam || null;
  // save anterior à bifurcação não tem o campo: fica vazio e regiaoDaEtapa devolve 'kanto' em tudo,
  // então a jornada dele continua idêntica ao que era
  game.gymPath = Array.isArray(data.gymPath) ? data.gymPath : [];
  game.pendingGymVictoryPool = data.pendingGymVictoryPool || null;
  game.gymTerrain = data.gymTerrain || null;
  game.eliteTerrain = data.eliteTerrain || null;
  game.evolutions = data.evolutions || [];
  game.badgesEarned = data.badgesEarned || [];
  game.caughtSpecies = data.caughtSpecies || [];
  game.battleResult = data.battleResult || null;
  game.currentRoute = data.currentRoute || null;
  // save antigo não tem histórico: começa vazio e o mapa desenha só os trechos daqui pra frente
  game.routeHistory = Array.isArray(data.routeHistory) ? data.routeHistory : [];
  game.rivalName = data.rivalName || RIVAL_NAME_DEFAULT;
  game.rivalPool = data.rivalPool || [];
  game.rivalStarterId = data.rivalStarterId || null;
  game.rivalBattlesDone = data.rivalBattlesDone || [];
  game.stolenMon = data.stolenMon || null;
  game.hideoutStage = data.hideoutStage || 0;
  game.hideoutAttemptsLeft = data.hideoutAttemptsLeft!=null ? data.hideoutAttemptsLeft : 3;
  game.hideoutFoeLevel = data.hideoutFoeLevel!=null ? data.hideoutFoeLevel : null;
  game.eliteStage = data.eliteStage!=null ? data.eliteStage : null;
  // save anterior ao sorteio não tem o campo: fica null e a próxima tentativa sorteia a fila dele
  game.elitePath = Array.isArray(data.elitePath) ? data.elitePath : null;
  game.eliteStatus = data.eliteStatus || null;
  game.eliteHealsLeft = data.eliteHealsLeft || 0;
  game.eliteAttemptsUsed = data.eliteAttemptsUsed || 0;
  game.eliteBestStage = data.eliteBestStage || 0;
  /* Um save 'defeated' que ainda tem tentativa sobrando volta a poder desafiar. Isso acontece em
     dois casos, e a diferença entre eles é o CONTADOR -- por isso o tratamento é separado:

     a) contador em ZERO: save anterior ao sistema de tentativas, de quando perder pra Elite marcava
        'defeated' direto e não havia contador. Teve uma chance só, então vira "gastou 1".

     b) contador MAIOR que zero: o save gastou tudo que existia na época, mas o limite subiu depois
        (de 3 pra 5). Aqui o contador é PRESERVADO -- quem gastou 3 fica com 3 usadas e 2 restantes.

     O bug que isso corrige: antes, os dois casos caíam na mesma linha e o contador era zerado pra 1.
     Quando o limite subiu pra 5, um save encerrado em 3/3 virava "1 usada" e ganhava 4 chances em
     vez das 2 esperadas -- apagando o histórico de derrotas dele de quebra. */
  if(game.eliteStatus==='defeated' && game.eliteAttemptsUsed < ELITE_MAX_ATTEMPTS){
    if(game.eliteAttemptsUsed === 0) game.eliteAttemptsUsed = 1; // caso (a): sem contador na origem
    game.eliteStatus = null;   // caso (b): preserva o contador, só reabre o desafio
    game.eliteStage = 0;
  }
  // resgate pra saves que já chegaram numa derrota DEFINITIVA (essa sim de verdade, 3/3 gastas) antes
  // do eliteBestStage existir -- nesse caso eliteStage ainda reflete onde a ÚLTIMA tentativa parou
  // (não é resetado no golpe final), o que é uma aproximação imperfeita mas bem melhor que mostrar
  // "chegou até a Lorelei" (0) pra quem na verdade tinha ido bem mais longe em alguma tentativa
  if(game.eliteStatus==='defeated' && game.eliteBestStage===0 && game.eliteStage>0){
    game.eliteBestStage = game.eliteStage;
  }
  // rede de segurança da Elite: as telas de batalha usam estado transitório (specialBattle) que não é
  // salvo -- se o save foi gravado no meio de uma batalha da Elite e recarregado, volta pra sala de
  // preparação (que mostra o próximo oponente e as curas pendentes) em vez de travar numa tela vazia.
  // IMPORTANTE: confere data.screen (o valor bruto salvo), não game.screen -- esse já foi substituído
  // por 'preBattle' duas linhas acima (screen de batalha não está em SAFE_SAVE_SCREENS), então checar
  // game.screen aqui nunca bateria com 'specialBattling'. E 'preBattle' quebra sozinho nesse cenário:
  // ele assume um ginásio atual (GYMS[gymIndex]), que não existe mais depois da jornada terminar
  if(game.eliteStatus==='inProgress' && ['specialIntro','specialBattling','specialResult'].includes(data.screen)){
    game.screen = 'eliteHeal';
  }
  // MESMO problema, fora da Elite: uma batalha de Rocket ou do rival também vive em specialBattle, que
  // não é salvo. Antes só a Elite tinha rede de segurança, então um save gravado numa emboscada da
  // Rocket voltava pra 'specialIntro' sem a batalha -- renderSpecialIntro devolvia string vazia, o
  // despachante caía no fallback e o botão "Continuar" não fazia nada. Aqui a checagem é pelo ESTADO
  // (specialBattle ausente), não pelo contexto, então cobre qualquer batalha especial: se a tela
  // depende dele e ele não veio, manda pra abordagem do próximo ginásio, que é para onde o jogo iria
  // naturalmente ao terminar uma dessas batalhas
  if(['specialIntro','specialBattling','specialResult'].includes(game.screen) && !game.specialBattle){
    game.screen = 'preBattle';
  }
  // rede de segurança: saves salvos antes dessa correção (ou qualquer dado corrompido) podem ter ficado
  // parados numa tela de resultado de batalha sem o resultado em si -- em vez de travar, volta pra uma
  // tela segura em que o jogador consegue seguir jogando normalmente
  const needsBattleResult = ['victory','defeat','gameover'].includes(game.screen);
  if(needsBattleResult && (!game.battleResult || !game.battleResult.matchups)){
    game.screen = 'preBattle';
  }
}
function reconcileInstanceIdCounter(){
  let maxId = 0;
  game.team.forEach(p=>{
    const match = /^mon(\d+)$/.exec(p.id||'');
    if(match){ maxId = Math.max(maxId, parseInt(match[1],10)); }
  });
  nextInstanceId = Math.max(nextInstanceId, maxId+1);
}
async function continueSave(slot){
  if(!game.authUser) return;
  try{
    const snap = await saveDocRef(game.authUser.uid, slot).get();
    if(!snap.exists) return;
    applySavedState(snap.data());
    game.currentSaveSlot = slot;
    /* O SORTEIO DOS INICIAIS É POR SLOT E POR MODO -- tem que ser refeito ao trocar de save.
       `game.startersShiny` é escrito só na criação do save (confirmNewSaveName) e não está no
       serializeGame nem no freshGameDefaults, então o `applySavedState` acima NÃO o toca. Sem esta
       linha ele atravessa de um save pro outro, e isso furava a trava anti save-scumming pelos
       dois lados:
         - criar no slot 0 em DIFÍCIL (4x a chance), ver o shiny, ir pra home e abrir um save
           parado na tela 'start' do slot 1 -> o inicial saía shiny num save NORMAL, com o sorteio
           de outro slot, e o sorteio do slot 1 continuava intacto pra ser usado depois;
         - e ao contrário: depois de um F5 o campo some, e um save parado em 'start' cujo sorteio
           TINHA shiny voltava sem estrela nenhuma -- perdia em silêncio o que tinha direito.
       Recompor pelo `startersSorteados` (que é da conta e sobrevive ao F5) resolve os dois. */
    game.startersShiny = (game.screen === 'start')
      ? sorteioDosIniciais(slot, game.gameMode) : {};
    reconcileInstanceIdCounter();
    render();
  } catch(e){ console.error(e); }
}
// mesma coisa, mas pra saves de 8/8 insígnias -- em vez de cair na tela salva (que costuma ser só a
// home, sem indicar visualmente que algo mudou), leva direto pro resumo da jornada, que é onde mora o
// convite da Elite 4 (ou o status dela, se já estiver em andamento/concluída). É especialmente
// necessário pros saves que já tinham terminado a jornada ANTES da Elite existir -- eles nunca tiveram
// chance de salvar nessa tela, então sem isso ficariam sem um jeito óbvio de continuar a história
async function continueCompleteSave(slot){
  if(!game.authUser) return;
  try{
    const snap = await saveDocRef(game.authUser.uid, slot).get();
    if(!snap.exists) return;
    applySavedState(snap.data());
    game.currentSaveSlot = slot;
    game.startersShiny = {};   // jornada terminada nunca volta pra escolha de inicial (ver continueSave)
    reconcileInstanceIdCounter();
    game.screen = 'journeyEnd';
    render();
  } catch(e){ console.error(e); }
}
async function isAccountActiveInLeague(typeId, uid){
  if(!uid) return false;
  try{
    const scheduleSnap = await scheduleDocRef(typeId).get();
    if(!scheduleSnap.exists) return false;
    const cycles = scheduleSnap.data().cycles || [];
    const checks = await Promise.all(cycles.map(async (entry)=>{
      if(entry.status==='registering'){
        const regSnap = await registrantDocRef(typeId, entry.id, uid).get();
        return regSnap.exists;
      } else if(entry.status==='drawn' || entry.status==='advancing'){
        const detailSnap = await cycleDocRef(typeId, entry.id).get();
        if(!detailSnap.exists) return false;
        return (detailSnap.data().leagues||[]).some(league=>
          Object.values(league.rounds||{}).some(round=>
            round.some(m=> (m.a && m.a.uid===uid) || (m.b && m.b.uid===uid))
          )
        );
      }
      return false;
    }));
    return checks.some(Boolean);
  } catch(e){ console.error('Erro ao checar Liga:', e); return false; }
}

async function findSlotActiveLeagueType(slot){
  if(!game.authUser) return null;
  const uid = game.authUser.uid;
  try{
    const types = await listActiveLeagueTypes();
    for(const type of types){
      const scheduleSnap = await scheduleDocRef(type.id).get();
      if(!scheduleSnap.exists) continue;
      const cycles = scheduleSnap.data().cycles || [];
      for(const entry of cycles){
        if(entry.status==='registering'){
          const regSnap = await registrantDocRef(type.id, entry.id, uid).get();
          if(regSnap.exists && regSnap.data().slot===slot){ return type; }
        } else if(entry.status==='drawn' || entry.status==='advancing'){
          const detailSnap = await cycleDocRef(type.id, entry.id).get();
          if(!detailSnap.exists) continue;
          const found = (detailSnap.data().leagues||[]).some(league=>
            Object.values(league.rounds||{}).some(round=>
              round.some(m=> (m.a && m.a.uid===uid && m.a.slot===slot) || (m.b && m.b.uid===uid && m.b.slot===slot))
            )
          );
          if(found) return type;
        }
      }
    }
  } catch(e){ console.error('Erro ao checar Liga pro slot:', e); }
  return null;
}
async function requestDeleteSave(slot){

  game.deleteSaveChecking = null;
  if(activeType){
    const blockedName = (game.saveSlots[slot] && game.saveSlots[slot].customName) || `Time ${slot+1}`;
    game.deleteSaveBlockedReason = `O ${escapeHtmlSafe(blockedName)} está inscrito ou disputando a ${escapeHtmlSafe(activeType.name||'Liga Clássica')} agora. Cancele a inscrição (ou espere a Liga terminar) antes de deletar esse time.`;
    render();

  // não bloqueia (diferente da liga) -- só avisa, já que apagar mesmo assim é uma escolha válida

    game.deleteSaveGymWarning = result.data.defending;
  } catch(e){ console.error('Erro ao checar defesa de ginásio do save:', e); }

async function confirmDeleteSave(){
  const slot = game.deleteSaveTarget;
  if(slot==null || !game.authUser) return;
  try{
    // antes de apagar, garante que nenhuma captura desse save se perca do Pokédex permanente da conta --
    // segurança extra, independente da reconciliação que já roda ao abrir a tela do Pokédex
    const snap = await saveDocRef(game.authUser.uid, slot).get();
    const caught = (snap.exists && snap.data().caughtSpecies) ? snap.data().caughtSpecies : [];
    if(caught.length>0){
      await userDocRef(game.authUser.uid).set(
        { pokedexCaught: firebase.firestore.FieldValue.arrayUnion(...caught) },
        { merge: true }
      );
      if(!game.permanentPokedex){ game.permanentPokedex = []; }
      caught.forEach(id=>{ if(!game.permanentPokedex.includes(id)){ game.permanentPokedex.push(id); } });
    }
    // se esse save estava defendendo algum Ginásio da Cidade, vaga a liderança ANTES de apagar --
    // gym docs são escrita exclusiva do servidor, então isso passa por uma função dedicada
    if(game.deleteSaveGymWarning){
      try{ await functionsClient.httpsCallable('vacateNeighborhoodGymForDeletedSave')({ slot }); }
      catch(e){ console.error('Erro ao vagar ginásio antes de apagar o save:', e); }
    }
    await saveDocRef(game.authUser.uid, slot).delete();
  } catch(e){ console.error(e); }
  game.deleteSaveTarget = null;
  game.deleteSaveGymWarning = null;
  await loadSaveSlots();
}

function getAchievementAggregate(){
  const slots = (game.saveSlots || []).filter(Boolean);
  const caught = getAllCaughtSpecies();
  const maxBadges = slots.reduce((max,s)=> Math.max(max, s.badgeCount!=null ? s.badgeCount : (s.badgesEarned?s.badgesEarned.length:0)), 0);
  const allTeams = slots.map(s=>s.team||[]);
  return {
    caughtCount: caught.size,
    totalSpecies: Object.keys(SPECIES).length,
    maxBadges,
    anyEvolution: slots.some(s=> (s.evolutions||[]).length>0),
    anyEeveeEvo: ['vaporeon','jolteon','flareon'].some(id=>caught.has(id)),
    anyLegendary: ['moltres','zapdos','articuno'].some(id=>caught.has(id)),
    anyFullTeam: slots.some(s=> (s.team||[]).length>=6),
    // everComeback é a flag PERMANENTE (gravada na hora da vitória, ver continueJourney); o critério
    // antigo (losses>0 no save) fica como fallback pra saves que estão no meio de uma sequência agora
    anyComeback: slots.some(s=> s.everComeback || ((s.losses||0)>0 && (s.badgeCount||0)>0)),
    slotsUsed: slots.length,
    anyJourneyEnd: slots.some(s=> (s.badgeCount||0)>=8),
    trainerNames: [...new Set(slots.map(s=>s.trainerName).filter(Boolean))],
    // sinais das conquistas novas -- tudo derivado do que os saves e a conta já guardam hoje
    hasMewtwo: caught.has('mewtwo'),
    hasDitto: caught.has('ditto'),
    // com Johto na tabela a Pokédex foi a 250; "completar Kanto" virou um marco próprio
    kantoCaught: [...caught].filter(id=>SPECIES[id] && SPECIES[id].dex <= 151).length,
    kantoTotal: Object.keys(SPECIES).filter(id=>SPECIES[id].dex <= 151).length,
    johtoCaught: [...caught].filter(id=>SPECIES[id] && SPECIES[id].dex >= 152).length,
    johtoTotal: Object.keys(SPECIES).filter(id=>SPECIES[id].dex >= 152).length,
    // os lendários de Johto: as três bestas e a dupla dos céus (ver LENDARIOS)
    allBeasts: ['raikou','entei','suicune'].every(id=>caught.has(id)),
    allTowerDuo: ['lugia','hooh'].every(id=>caught.has(id)),
    // marcas da raide do Mew -- vêm da CONTA, não dos saves (ver loadPermanentUserData)
    bossTop10: !!game.bossTop10,
    bossKiller: !!game.bossKiller,
    hasDragonite: caught.has('dragonite'),
    allBirds: ['moltres','zapdos','articuno'].every(id=>caught.has(id)),
    allEeveeEvos: ['vaporeon','jolteon','flareon'].every(id=>caught.has(id)),
    allStartersFinal: ['venusaur','charizard','blastoise'].every(id=>caught.has(id)),
    anyShinyTeam: allTeams.some(team=> team.some(p=>p.shiny)),
    maxTeamLevel: allTeams.reduce((max,team)=> Math.max(max, ...team.map(p=>p.level||0), 0), 0),
    anyTeamAll50: allTeams.some(team=> team.length>=6 && team.every(p=>(p.level||0)>=50)),
    savesWith8Badges: slots.filter(s=> (s.badgeCount||0)>=8).length,
    totalBadges: slots.reduce((sum,s)=> sum + (s.badgeCount||0), 0),
    maxCaughtOneSave: slots.reduce((max,s)=> Math.max(max, (s.caughtSpecies||[]).length), 0),
    anyMewtwoReward: slots.some(s=> s.mewtwoReward && s.mewtwoReward.earned),
    anyMewtwoUsed: slots.some(s=> s.mewtwoReward && s.mewtwoReward.used),
    bestStreak: game.trainerBestStreak || 0,
    leagueWinsTotal: game.leagueWinsTotal || 0,
    // --- sinais das conquistas novas ---
    /* 'champion' é gravado no save quando a Elite 4 é vencida. O time que vale é o CONGELADO na
       vitória (eliteWinTeam); save de antes desse campo cai no time atual, que é o que sempre foi
       usado -- assim ninguém perde uma conquista que já tinha. */
    eliteTeams: slots.filter(s=> s.eliteStatus==='champion')
      .map(s=> (s.eliteWinTeam && s.eliteWinTeam.length) ? s.eliteWinTeam : (s.team||[]).map(p=>p.speciesId)),
    /* O CAMINHO de cada jornada campeã: uma região por etapa. Save anterior à bifurcação não tem o
       campo -- e naquele tempo só existia Kanto, então conta como oito de Kanto (mesmo padrão do
       regiaoDaEtapa). */
    eliteGymPaths: slots.filter(s=> s.eliteStatus==='champion')
      .map(s=> (s.gymPath && s.gymPath.length) ? s.gymPath : new Array(8).fill('kanto')),
    // eliteAttemptsUsed só conta DERROTAS: zero quer dizer que passou de primeira
    eliteFirstTry: slots.some(s=> s.eliteStatus==='champion' && (s.eliteAttemptsUsed||0)===0),
    // média do time: usa o time mais forte entre todos os saves
    bestTeamAvg: allTeams.reduce((max,team)=>{
      if(!team.length) return max;
      const avg = team.reduce((sum,p)=>sum+(p.level||0),0) / team.length;
      return Math.max(max, avg);
    }, 0),
    anyEliteChampion: slots.some(s=> s.eliteStatus==='champion'),
    anyEliteDittoWin: slots.some(s=> s.eliteDittoWin),
    savesEliteChampion: slots.filter(s=> s.eliteStatus==='champion').length,
    // shinies: contagem na pokédex shiny da conta
    shinyCount: (game.permanentShinyDex||[]).length,
    // Ginásio da Cidade e Torre dos Treinadores viveriam bem como conquista, mas os contadores
    // deles só existem no SERVIDOR (leaderRecords e trainerTowerRanking) -- o cliente não carrega
    // nenhum dos dois na tela de conquistas. Ficam de fora até valer a pena buscar isso aqui.
    // jornada impecável: o contador de derrotas totais existe desde o Bônus de Kanto
    bestJourneyLosses: slots.filter(s=>(s.badgeCount||0)>=8)
      .reduce((min,s)=> Math.min(min, (typeof s.lossesTotal==='number') ? s.lossesTotal : 99), 99)
  };
}
async function computeLeagueAchievementExtra(trainerNames, uid){
  const result = { anyRegistered:false, anySemifinal:false, anyRunnerUp:false, anyChampion:false, anyTrainersChampion:false };
  if(!trainerNames || trainerNames.length===0) return result;

  // parte barata que SEMPRE roda, migrado ou não: só olha se existe inscrição ATIVA agora. Custo fixo
  // (1-2 leituras), não cresce com o histórico -- por isso fica de fora do cache/migração abaixo
  try{
    const scheduleSnap = await scheduleDocRef(CLASSIC_LEAGUE_TYPE).get();
    if(scheduleSnap.exists){
      const cycles = scheduleSnap.data().cycles || [];
      const registering = cycles.find(c=>c.status==='registering');
      if(registering && uid){
        const regSnap = await registrantDocRef(CLASSIC_LEAGUE_TYPE, registering.id, uid).get().catch(()=>({exists:false}));
        if(regSnap.exists){ result.anyRegistered = true; }
      }
    }
  } catch(e){ console.error('Erro ao checar inscrição atual da Liga:', e); }

  if(!uid) return result;

  // flags permanentes -- gravadas no momento exato em que cada evento acontece de verdade (ver
  // recordLeaguePlacement/recordLeagueChampionWin). Se a conta já foi migrada, isso é 1 leitura só,
  // não importa se o jogo já teve 5 ou 5000 ligas concluídas na história
  let userDoc = {};
  try{
    const snap = await userDocRef(uid).get();
    userDoc = snap.exists ? snap.data() : {};
  } catch(e){ console.error('Erro ao ler flags de conquista da conta:', e); }

  if(userDoc.achievementFlagsMigrated){
    result.anyRegistered = result.anyRegistered || !!userDoc.anyRegistered;
    result.anySemifinal = !!userDoc.anySemifinal;
    result.anyRunnerUp = !!userDoc.anyRunnerUp;
    result.anyChampion = !!userDoc.anyChampion;
    result.anyTrainersChampion = !!userDoc.anyTrainersChampion;
    return result;
  }

  // conta ainda não migrada -- faz o escaneamento completo (exatamente como sempre foi) UMA ÚNICA VEZ,
  // e grava o resultado pra nunca mais precisar escanear de novo. Isso preserva qualquer conquista de
  // liga já ganha ANTES dessa correção existir -- ninguém perde um troféu que já tinha
  try{
    const trainersRankSnap = await db.collection('leagues').doc('champions_alltime_trainers_league').get().catch(()=>({exists:false}));
    if(trainersRankSnap.exists){
      const wins = trainersRankSnap.data().wins || {};
      result.anyTrainersChampion = trainerNames.some(n=> (wins[n]||0) > 0);
    }
  } catch(e){ console.error('Erro ao checar conquistas da Trainers League:', e); }
  try{
    const scheduleSnap = await scheduleDocRef(CLASSIC_LEAGUE_TYPE).get();
    if(scheduleSnap.exists){
      const cycles = scheduleSnap.data().cycles || [];
      const completedEntries = cycles.filter(c=>c.status==='complete');
      const detailSnaps = await Promise.all(completedEntries.map(entry=>cycleDocRef(CLASSIC_LEAGUE_TYPE, entry.id).get().catch(()=>null)));
      for(const detailSnap of detailSnaps){
        if(!detailSnap || !detailSnap.exists) continue;
        const detail = detailSnap.data();
        for(const name of trainerNames){
          for(const league of (detail.leagues||[])){
            const placement = computePlacement(league, name);
            if(placement){ result.anyRegistered = true; }
            if(placement==='Campeão'){ result.anyChampion = true; result.anyRunnerUp = true; result.anySemifinal = true; }
            else if(placement==='Vice-campeão'){ result.anyRunnerUp = true; result.anySemifinal = true; }
            else if(placement==='3º–4º Lugar'){ result.anySemifinal = true; }
          }
        }
      }
    }
  } catch(e){ console.error('Erro ao checar conquistas da Liga:', e); }

  try{
    await userDocRef(uid).set({
      anyRegistered: result.anyRegistered, anySemifinal: result.anySemifinal, anyRunnerUp: result.anyRunnerUp,
      anyChampion: result.anyChampion, anyTrainersChampion: result.anyTrainersChampion, achievementFlagsMigrated: true
    }, { merge: true });
  } catch(e){ console.error('Erro ao migrar flags de conquista:', e); }

  return result;
}

async function openAchievements(){
  game.screen = 'achievements';
  game.achievementsExtra = null;
  render();
  await loadSaveSlots();
  await loadPermanentUserData();
  const agg = getAchievementAggregate();
  game.achievementsExtra = await computeLeagueAchievementExtra(agg.trainerNames, game.authUser ? game.authUser.uid : null);
  if(game.screen==='achievements'){ render(); }
}
function closeAchievements(){
  game.screen = 'saveSelect';
  render();
