   Desenhado em SVG aqui mesmo -- nenhuma imagem de fora. Já houve dois episódios
   neste projeto de imagem hotlinkada que funcionava local e morria publicada
   (ver GYM_BADGE_VISUALS), e um mapa quebrado é pior que mapa nenhum.

   O que ele mostra, e por quê:
   - Só o caminho JÁ PERCORRIDO é desenhado, mais o trecho atual pontilhado até
     a próxima cidade. Desenhar a jornada inteira de uma vez virava espaguete: o
     trajeto real de Kanto se cruza várias vezes (Celadon → Fuchsia → Saffron →
     Cinnabar → Viridian), e num celular isso lia como rabisco. Quem quiser a
     visão linear do que falta tem a trilha de insígnias, que é outra coisa.
   - Cada trecho concluído leva no meio o ÍCONE DA ROTA que a pessoa escolheu.
     É o que transforma o mapa em memória da jornada: dá pra olhar e lembrar que
     naquele trecho você foi pelo Monte Lua e não pela costa.
   - A cidade do ginásio atual pulsa; as vencidas mostram o selo da insígnia; as
     que ainda não chegaram ficam apagadas, sem nome. Saber o nome da cidade do
     8º ginásio antes de chegar lá não acrescenta nada.
   ============================================================================ */

/* Coordenadas no viewBox 300x420 (retrato, que é como o jogo é jogado).
   A geografia é a do Kanto de verdade -- relativa, não a escala. Mexer num
   ponto aqui move a cidade E as linhas do trajeto, que saem daqui. */
/* `lp` = onde o rótulo fica em relação ao ponto. Não é enfeite: com todos em cima,
   "Saffron City" caía por cima do ícone da rota e "Vermilion City" por cima da linha
   do trecho. Cada cidade tem o lado que sobra livre no desenho. */
const KANTO_PLACES = {
  indigo:   { x: 44,  y: 44,  name:'Planalto Índigo', icon:'🏛️', lp:'dir' },
  pewter:   { x: 70,  y: 106, name:'Pewter City',   lp:'dir' },
  cerulean: { x: 204, y: 66,  name:'Cerulean City', lp:'cima' },
  celadon:  { x: 110, y: 180, name:'Celadon City',  lp:'esq' },
  saffron:  { x: 192, y: 166, name:'Saffron City',  lp:'cima' },
  lavender: { x: 244, y: 190, name:'Lavender Town', icon:'👻', lp:'baixo' },
  vermilion:{ x: 198, y: 254, name:'Vermilion City',lp:'dir' },
  viridian: { x: 58,  y: 248, name:'Viridian City', lp:'dir' },
  pallet:   { x: 50,  y: 300, name:'Pallet Town',   icon:'🏠', lp:'dir' },
  fuchsia:  { x: 136, y: 344, name:'Fuchsia City',  lp:'dir' },
  cinnabar: { x: 62,  y: 396, name:'Ilha Cinnabar', lp:'esq', ilha:true }
};
// a ordem da jornada: casa, os 8 ginásios na ordem do GYMS, e a Liga no fim
const KANTO_GYM_CITIES = ['pewter','cerulean','vermilion','celadon','fuchsia','saffron','cinnabar','viridian'];
const KANTO_JOURNEY = ['pallet', ...KANTO_GYM_CITIES, 'indigo'];

/* ---------------------------------------------------------------------------
   JOHTO NO MAPA

   As duas regiões num SVG só, empilhadas: Kanto em cima (coordenadas intocadas, de quando o mapa
   era só dela) e Johto embaixo, deslocada em JOHTO_OFFSET_Y.

   Por que empilhado e não lado a lado, já que Johto fica a OESTE de Kanto: o jogo é jogado em
   retrato num celular. Lado a lado o viewBox iria a 620 de largura e, numa tela de 320, cada
   cidade e cada nome sairiam pela metade do tamanho -- o mapa vira enfeite ilegível. Empilhado, a
   largura continua 300 e cada região tem a mesma área que tinha sozinha.
   A silhueta já era assumidamente uma EVOCAÇÃO e não o contorno exato (ver a nota do
   KANTO_SILHUETA); a posição relativa das duas regiões segue a mesma licença.

   A ligação entre elas existe no jogo original -- Rotas 26/27 e as Quedas Tohjo, entre o oeste de
   Kanto e o leste de Johto -- e aparece aqui como um traço pontilhado permanente, pra explicar por
   que a jornada consegue pular de uma pra outra.
   --------------------------------------------------------------------------- */
const JOHTO_OFFSET_Y = 430;
const JOHTO_PLACES_BASE = {
  newbark:   { x: 252, y: 252, name:'Vila Broto Branco', icon:'🏠', lp:'dir' },
  blackthorn:{ x: 250, y: 96,  name:'Blackthorn City',  lp:'dir' },
  mahogany:  { x: 192, y: 56,  name:'Mahogany Town',    lp:'cima' },
  violet:    { x: 190, y: 130, name:'Violet City',      lp:'dir' },
  ecruteak:  { x: 120, y: 116, name:'Ecruteak City',    lp:'cima' },
  goldenrod: { x: 126, y: 212, name:'Goldenrod City',   lp:'dir' },
  azalea:    { x: 156, y: 306, name:'Azalea Town',      lp:'baixo' },
  olivine:   { x: 60,  y: 208, name:'Olivine City',     lp:'esq' },
  cianwood:  { x: 38,  y: 306, name:'Cianwood City',    lp:'esq', ilha:true },
  lakerage:  { x: 246, y: 30,  name:'Lago da Fúria', icon:'🔴', lp:'esq' }
};
/* Silhueta de Johto. Mesma licença da de Kanto: evoca a forma (massa larga a leste, braço que
   desce pro sul, Cianwood solta no mar a oeste) em vez de copiar o contorno. */
const JOHTO_SILHUETA = `M 96 18
  C 140 6, 196 10, 236 16 C 268 22, 280 46, 274 74
  C 270 100, 276 124, 272 148 C 268 176, 276 208, 266 238
  C 258 262, 240 274, 220 272 C 200 270, 190 284, 186 302
  C 182 326, 162 342, 138 338 C 116 334, 106 316, 110 296
  C 114 274, 100 262, 84 262 C 62 262, 48 248, 46 228
  C 44 208, 54 190, 50 172 C 44 148, 52 120, 68 104
  C 60 76, 70 34, 96 18 Z`;
const JOHTO_PLACES = Object.fromEntries(Object.entries(JOHTO_PLACES_BASE)
  .map(([id, p]) => [id, { ...p, y: p.y + JOHTO_OFFSET_Y, johto:true }]));
const JOHTO_GYM_CITIES = ['violet','azalea','goldenrod','ecruteak','cianwood','olivine','mahogany','blackthorn'];
// as duas tabelas viram uma só -- daqui pra baixo o mapa não precisa saber de qual região é o ponto
const MAP_PLACES = { ...KANTO_PLACES, ...JOHTO_PLACES };

/* A cidade de cada etapa DEPENDE DO CAMINHO ESCOLHIDO -- é isso que faz o traço do mapa seguir a
   jornada de verdade, e não uma jornada de Kanto que o jogador não fez. */
function cidadeDaEtapa(i){
  return (regiaoDaEtapa(i) === 'johto' ? JOHTO_GYM_CITIES : KANTO_GYM_CITIES)[i] || null;
}
/* A jornada DESTE treinador: casa, as oito cidades que ele escolheu, e a Liga.
   Etapas ainda não jogadas entram com a previsão de Kanto (o mesmo que regiaoDaEtapa devolve),
   e o desenho só mostra até a etapa atual -- então a previsão nunca chega a ser desenhada. */
function jornadaDoTreinador(){
  return ['pallet', ...KANTO_GYM_CITIES.map((_, i) => cidadeDaEtapa(i)), 'indigo'];
}

/* Silhueta de Kanto. Não é o contorno exato -- é uma forma que evoca o continente
   (massa vertical a oeste, baía ao sul, Cinnabar solta no mar). Contorno fiel em
   300px de largura vira ruído: no celular o que se lê são as cidades e a linha
   entre elas, não os recortes da costa. */
const KANTO_SILHUETA = `M 46 20
  C 96 6, 152 18, 190 14 C 232 10, 258 32, 268 62
  C 278 92, 266 120, 250 140 C 272 160, 278 196, 258 216
  C 240 234, 214 228, 202 244 C 214 264, 210 290, 194 302
  C 182 314, 172 316, 170 332 C 176 354, 158 374, 132 374
  C 110 374, 98 358, 100 338 C 102 326, 92 316, 80 318
  C 68 320, 62 336, 52 342 C 38 348, 26 334, 26 312
  C 26 292, 36 272, 40 256 C 24 232, 30 200, 40 180
  C 24 156, 24 122, 36 100 C 24 74, 28 40, 46 20 Z`;

// a cidade de cada ginásio, pelo índice dele no GYMS
function kantoCityOfGym(i){ return KANTO_PLACES[KANTO_GYM_CITIES[i]] || null; }

/* O rótulo com um halo escuro por baixo (paint-order:stroke) em vez de uma caixinha: caixa
   por trás de 11 nomes some com o mapa, e o halo mantém o texto legível mesmo passando por
   cima da linha do trajeto. */
function kantoRotuloSvg(p){
  const lp = p.lp || 'cima';
  const off = 15;
  let x = p.x, y = p.y - off, anchor = 'middle';
  if(lp === 'baixo'){ y = p.y + off + 4; }
  else if(lp === 'esq'){ x = p.x - 13; y = p.y + 3.5; anchor = 'end'; }
  else if(lp === 'dir'){ x = p.x + 13; y = p.y + 3.5; anchor = 'start'; }
  return `<text x="${x}" y="${y}" text-anchor="${anchor}" class="km-nome">${p.icon?p.icon+' ':''}${escapeHtmlSafe(p.name)}</text>`;
}

/* Curva suave entre dois pontos. Uma reta entre cidades fica dura e, quando dois
   trechos saem do mesmo ponto, colam um no outro. O desvio é perpendicular ao
   segmento, então a curva sempre "abre" pro mesmo lado independente da direção. */
function kantoCurva(a, b, forca){
  const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
  const dx = b.x-a.x, dy = b.y-a.y;
  const comp = Math.sqrt(dx*dx + dy*dy) || 1;
  const f = (forca==null ? 0.16 : forca);
  const cx = mx + (-dy/comp) * comp * f;
  const cy = my + ( dx/comp) * comp * f;
  return { d:`M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`, mx:(mx+cx)/2, my:(my+cy)/2 };
}

/* O SVG. `ateGinasio` = quantos ginásios já foram vencidos (= índice do atual).
   `rotas` = ids de rota escolhidos por trecho, na ordem (game.routeHistory). */
function kantoMapSvg(ateGinasio, rotas, rotaAtual){
  const venc = Math.max(0, Math.min(8, ateGinasio|0));
  const hist = rotas || [];
  const JORNADA = jornadaDoTreinador();   // as cidades que ESTE treinador escolheu
  let trechos = '', cidades = '';

  /* Trechos concluídos + o atual -- mas o ATUAL só entra depois de a etapa ter sido escolhida.
     Antes disso o traço apontava pra cidade de Kanto (o padrão do regiaoDaEtapa) e a tela
     prometia o Brock antes de o jogador escolher entre ele e o Falkner. */
  const ateOnde = etapaEscolhida(venc) ? venc : venc - 1;
  for(let i = 0; i <= ateOnde && i < JORNADA.length-1; i++){
    const a = MAP_PLACES[JORNADA[i]], b = MAP_PLACES[JORNADA[i+1]];
    if(!a || !b) continue;
    const atual = (i === venc);
    const c = kantoCurva(a, b);
    const rota = routeById(atual ? rotaAtual : hist[i]);
    trechos += `<path d="${c.d}" class="km-trecho ${atual?'km-atual':''}" />`;
    // o ícone da rota só entra quando ela JÁ foi escolhida -- no trecho atual, antes
    // da escolha, um ícone ali seria adiantar o que a pessoa ainda vai decidir
    if(rota){
      trechos += `<g class="km-rota-icone" transform="translate(${c.mx.toFixed(1)} ${c.my.toFixed(1)})">
        <circle r="11" class="km-rota-disco"/><text y="4.5" text-anchor="middle" font-size="12">${rota.icon}</text></g>`;
    }
  }

  /* Desenha TODAS as cidades das duas regiões, não só as da jornada deste treinador: as que ele
     não escolheu ficam apagadas, como as que ele ainda não alcançou. Um mapa que só mostra o
     caminho tomado esconde que havia outro. */
  const TODAS = ['pallet','indigo', ...KANTO_GYM_CITIES, ...JOHTO_GYM_CITIES, 'lavender', 'newbark', 'lakerage'];
  TODAS.forEach(id=>{
    const p = MAP_PLACES[id];
    if(!p) return;
    const i = JORNADA.indexOf(id);           // -1 = cidade fora da jornada deste treinador
    const naJornada = i >= 0;
    const etapa = KANTO_GYM_CITIES.indexOf(id) >= 0 ? KANTO_GYM_CITIES.indexOf(id)
                : JOHTO_GYM_CITIES.indexOf(id) >= 0 ? JOHTO_GYM_CITIES.indexOf(id) : -1;
    // a cor é a da insígnia DESTA cidade -- cada ponto pinta o próprio ginásio, então nunca
    // aparece Pewter City com a cor de uma insígnia de Johto
    const gym = etapa >= 0
      ? (JOHTO_GYM_CITIES.indexOf(id) >= 0 ? JOHTO_GYMS[etapa] : KANTO_GYMS[etapa])
      : null;
    const conquistada = naJornada && etapa >= 0 && etapa < venc;
    // a próxima parada só é apontada depois de escolhida -- ver a nota do `ateOnde` acima
    const atual = naJornada && (i === venc + 1) && etapaEscolhida(venc);
    const revelada = naJornada && i <= (etapaEscolhida(venc) ? venc + 1 : venc);
    const cor = gym ? (GYM_BADGE_VISUALS[gym.id]||{}).color || '#888' : '#7a8fa6';
    const classe = conquistada ? 'km-ok' : (atual ? 'km-alvo' : (revelada ? '' : 'km-longe'));
    cidades += `<g class="km-cidade ${classe}">
      ${atual ? `<circle cx="${p.x}" cy="${p.y}" r="15" class="km-pulso" fill="${cor}"/>` : ''}
      <circle cx="${p.x}" cy="${p.y}" r="${revelada?9:4.5}" fill="${revelada?cor:'#54697f'}" class="km-ponto"/>
      ${conquistada ? `<text x="${p.x}" y="${p.y+3.5}" text-anchor="middle" font-size="9" fill="#fff">✓</text>` : ''}
      ${revelada ? kantoRotuloSvg(p) : ''}
    </g>`;
  });

  const cin = KANTO_PLACES.cinnabar, cia = MAP_PLACES.cianwood;
  const ALTURA = JOHTO_OFFSET_Y + 420;
  /* A ponte entre as duas regiões -- Rotas 26/27 e as Quedas Tohjo no jogo original. Fica sempre
     visível, pontilhada, e não faz parte da jornada: existe pra explicar por que o traço do
     treinador consegue pular de um continente pro outro. */
  const pw = KANTO_PLACES.pallet, nb = MAP_PLACES.newbark;
  const ligacao = `<path d="M ${pw.x} ${pw.y+14} C ${pw.x-30} ${pw.y+70}, ${nb.x+40} ${nb.y-90}, ${nb.x} ${nb.y-14}"
    class="km-elo"/>
    <text x="150" y="${JOHTO_OFFSET_Y-8}" text-anchor="middle" class="km-elo-nome">~ Quedas Tohjo ~</text>`;
  const rotulo = (id, cls) => { const p = MAP_PLACES[id];
    return `<g class="km-cidade ${cls}"><circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#54697f"/>${kantoRotuloSvg(p)}</g>`; };
  return `<svg class="kanto-map" viewBox="0 0 300 ${ALTURA}" role="img" aria-label="Mapa de Kanto e Johto">
    <defs>
      <pattern id="km-onda" width="18" height="18" patternUnits="userSpaceOnUse">
        <path d="M0 12 q4.5 -4 9 0 t9 0" fill="none" stroke="#1d3a55" stroke-width="1.2"/>
      </pattern>
    </defs>
    <rect width="300" height="${ALTURA}" fill="#12283d"/>
    <rect width="300" height="${ALTURA}" fill="url(#km-onda)"/>
    <path d="${KANTO_SILHUETA}" class="km-terra"/>
    <ellipse cx="${cin.x}" cy="${cin.y}" rx="24" ry="16" class="km-terra"/>
    <g transform="translate(0 ${JOHTO_OFFSET_Y})"><path d="${JOHTO_SILHUETA}" class="km-terra"/></g>
    <ellipse cx="${cia.x}" cy="${cia.y}" rx="22" ry="15" class="km-terra"/>
    <text x="150" y="16" text-anchor="middle" class="km-regiao">KANTO</text>
    <text x="150" y="${JOHTO_OFFSET_Y+16}" text-anchor="middle" class="km-regiao">JOHTO</text>
    ${ligacao}
    ${rotulo('lavender','km-longe')}${rotulo('lakerage','km-longe')}
    ${trechos}${cidades}
  </svg>`;
}

/* Trilha de insígnias -- a visão LINEAR, que o mapa de propósito não dá. Oito selos
   na ordem: os ganhos acesos, o atual destacado, os que faltam apagados. Cabe no
   topo de qualquer tela da jornada e responde "quanto falta" num relance. */
function kantoTrailHtml(compacta){
  const venc = Math.max(0, Math.min(8, game.gymIndex|0));
  const gym = gymOf(venc);
  return `<div class="kanto-trilha ${compacta?'compacta':''}">
    <!-- Cada selo mostra o líder REALMENTE enfrentado naquela etapa. Etapa ainda não escolhida
         não tem líder: vira um selo neutro, sem cor e sem nome. Antes ela caía no padrão de
         Kanto e a trilha adiantava o líder de uma etapa que o jogador ainda ia decidir.
         (O comentário não cita nome de líder de propósito: ele vai junto no HTML da página, e
         um teste que procura nome de líder na tela acusaria este texto.) -->
    <div class="kt-selos">${KANTO_GYMS.map((_,i)=>{
      const decidida = etapaEscolhida(i);
      const g = decidida ? gymOf(i) : null;
      const v = g ? (GYM_BADGE_VISUALS[g.id] || {}) : {};
      const estado = i < venc ? 'ok' : (i === venc ? 'atual' : 'falta');
      return `<span class="kt-selo ${estado} ${g?'':'kt-aberto'}" style="--kt-cor:${v.color||'#4a5b6e'}"
        title="${g ? escapeHtmlSafe(g.leaderName)+' — '+escapeHtmlSafe(g.city) : 'Trecho '+(i+1)+' — caminho ainda não escolhido'}">${g ? (v.emoji||'🏅') : '?'}</span>`;
    }).join('<span class="kt-liga"></span>')}</div>
    ${venc >= numGinasios() ? `<div class="kt-legenda">8/8 · <strong>Planalto Índigo</strong></div>`
      : etapaEscolhida(venc)
        ? `<div class="kt-legenda">TRECHO ${venc+1}/8 · rumo a <strong>${escapeHtmlSafe(gymOf(venc).city)}</strong></div>`
        : `<div class="kt-legenda">TRECHO ${venc+1}/8 · <strong>escolha o caminho</strong></div>`}
  </div>`;
}
// botão que reabre o mapa de qualquer tela da jornada
function kantoMapBotaoHtml(){
  return `<button class="btn secondary kanto-abrir" onclick="openKantoMap()">🗺️ Ver o mapa</button>`;
}

/* --------------------------------------------------------------------------
   TELAS
   O mapa aparece em dois momentos com a MESMA função e molduras diferentes:
   na abertura da jornada ('kantoIntro'), onde ele é o assunto, e sob demanda
   ('kantoMap'), onde é consulta e tem um "voltar" pra tela de onde veio.
   -------------------------------------------------------------------------- */
function openKantoMap(){
  if(game.screen === 'kantoMap' || game.screen === 'kantoIntro') return;
  game.kantoMapVoltarPara = game.screen;
  game.screen = 'kantoMap';
  render();
}
function closeKantoMap(){
  game.screen = game.kantoMapVoltarPara || 'walk';
  game.kantoMapVoltarPara = null;
  render();
}
function comecarJornadaDoMapa(){
  irParaEscolhaDeGinasio();
  render();
}
/* ============================================================================
   "QUAL GINÁSIO VAMOS?" -- a bifurcação, uma vez por etapa

   Antes de ver as rotas, o treinador escolhe a REGIÃO daquela etapa. A escolha decide três coisas
   de uma vez: qual líder espera no fim, qual insígnia entra no cinturão e quais duas rotas
   aparecem em seguida. Por isso ela vem ANTES de `routeCards` ser calculado -- as rotas de Johto
   não existem até a região estar decidida.
   Os dois lados são equivalentes de propósito (mesmo número de pokémon e mesma média de nível no
   líder, mesmos níveis de selvagem vindos do LEGS): a escolha é de TIPO, não de dificuldade.
   ============================================================================ */
function irParaEscolhaDeGinasio(){
  // etapa já decidida (voltou pra tela, ou save antigo no meio da jornada): não pergunta de novo
  if((game.gymPath||[])[game.gymIndex]){ game.screen = game.gymIndex === 0 ? 'walk' : 'walkNext'; return; }
  game.screen = 'gymChoice';
}
function escolherGinasio(regiao){
  if(!REGIOES.includes(regiao)) return;
  if(!Array.isArray(game.gymPath)) game.gymPath = [];
  game.gymPath[game.gymIndex] = regiao;
  // as rotas só podem ser sorteadas AGORA: elas dependem da região que acabou de ser escolhida
  game.routeCards = routesForLeg(game.gymIndex).map(r=>r.id);
  game.screen = game.gymIndex === 0 ? 'walk' : 'walkNext';
  render();
}
function renderGymChoice(){
  const etapa = game.gymIndex;
  const opcoes = opcoesDeGinasio(etapa);
  return `
  ${kantoTrailHtml(true)}
  <div class="eyebrow">🧭 ESCOLHA DO CAMINHO</div>
  <div class="box cursor">
    <h2>Qual ginásio vamos?</h2>
    <p>Você está no <strong>trecho ${etapa+1} de 8</strong>. Os dois caminhos valem uma insígnia e
       são igualmente difíceis — o que muda é o <strong>tipo</strong> que espera no fim, e os
       pokémons que aparecem no caminho.</p>
  </div>
  ${opcoes.map(o=>{
    /* O tipo do ginásio vira SELO, não texto: é o mesmo selo colorido que a Pokédex e a tela de
       batalha usam, então o jogador reconhece "Pedra" pela cor antes de ler. O gymTypeName está
       em português e o typePill trabalha em inglês -- daí a tradução. */
    const tipoEn = englishTypeFromPortuguese(o.gym.gymTypeName);
    const rotas = (o.regiao === 'johto' ? JOHTO_ROUTE_MAP : ROUTE_MAP)[etapa] || [];
    return `
    <button class="save-slot-card clickable gym-choice-card" onclick="escolherGinasio('${escJs(o.regiao)}')">
      <span class="gym-choice-regiao">${o.regiao === 'johto' ? 'JOHTO' : 'KANTO'}</span>
      <div class="gym-choice-corpo">
        <!-- coluna da insígnia: badgeMarkup é a imagem de verdade, a mesma da tela de vitória e do
             cinturão; o emoji colorido continua como reserva dentro dele -->
        <div class="gym-choice-selo-col">
          ${badgeMarkup(o.gym.badge, 'gc')}
          <span class="gym-choice-selo-nome">${escapeHtmlSafe(o.gym.badge)}</span>
        </div>
        <div class="gym-choice-info">
          <div class="gym-choice-lider">${escapeHtmlSafe(o.gym.leaderName)}</div>
          <div class="gym-choice-tipo">${tipoEn ? typePill(tipoEn) : escapeHtmlSafe(o.gym.gymTypeName)}</div>
          <div class="gym-choice-cidade">${escapeHtmlSafe(o.gym.city)}</div>
          <div class="gym-choice-rotas">
            <span class="gym-choice-rotas-titulo">CAMINHOS</span>
            ${rotas.map(r=>`<span class="gym-choice-rota">${escapeHtmlSafe(r.icon+' '+r.name)}</span>`).join('')}
          </div>
        </div>
      </div>
    </button>`;
  }).join('')}
  ${botaoSeuTimeHtml()}
  ${kantoMapBotaoHtml()}`;
}
function renderKantoIntro(){
  const sp = SPECIES[game.starterId];

function renderKantoMapScreen(){
  const venc = Math.max(0, Math.min(8, game.gymIndex|0));
  const hist = game.routeHistory || [];
  const gym = gymOf(venc);
  return `
  <div class="eyebrow">🗺️ MAPA DE KANTO E JOHTO</div>
  <div class="box kanto-moldura">${kantoMapSvg(venc, hist, game.currentRoute)}</div>
  ${kantoTrailHtml()}
  <div class="box">
    <h2>${venc}/8 insígnias</h2>
    ${(()=>{
      // resumo de quantos trechos foram de cada lado -- o mapa já desenha os dois, isto é só a
      // leitura rápida de "que jornada foi a minha"
      const feitos = (game.gymPath||[]).slice(0, venc);
      if(!feitos.length) return '';
      const nJ = feitos.filter(r=>r==='johto').length, nK = feitos.length - nJ;
      if(!nJ) return `<p class="hint-text">🧭 Sua jornada até aqui foi inteira por <strong>Kanto</strong>.</p>`;
      if(!nK) return `<p class="hint-text">🧭 Sua jornada até aqui foi inteira por <strong>Johto</strong>.</p>`;
      return `<p class="hint-text">🧭 Sua jornada cruzou os dois continentes: <strong>${nK}</strong>
        ${nK===1?'trecho':'trechos'} em Kanto e <strong>${nJ}</strong> em Johto.</p>`;
    })()}
    <p>${venc >= numGinasios() ? `Todas as insígnias na mão. O Planalto Índigo espera.`
        : etapaEscolhida(venc)
          ? `Próxima parada: <strong>${escapeHtmlSafe(gymOf(venc).city)}</strong>, onde ${escapeHtmlSafe(gymOf(venc).leaderName)} lidera o Ginásio ${escapeHtmlSafe(gymOf(venc).gymTypeName)}.`
          : `Próxima parada: <strong>ainda não escolhida</strong> — o trecho ${venc+1} pode seguir por
             ${escapeHtmlSafe(KANTO_GYMS[venc].city)} (Kanto) ou por ${escapeHtmlSafe(JOHTO_GYMS[venc].city)} (Johto).`}</p>
    ${hist.length ? `<div class="kanto-diario">
      <div class="kanto-diario-l">POR ONDE VOCÊ PASSOU</div>
      ${hist.map((rid, i)=>{
        const r = routeById(rid); if(!r) return '';
        const g = gymOf(i);
        return `<div class="kanto-diario-linha"><span class="kd-icone">${r.icon}</span>
          <span class="kd-nome">${escapeHtmlSafe(r.name)}</span>
          <span class="kd-destino">→ ${escapeHtmlSafe(g ? g.city : '')}</span></div>`;
      }).join('')}
    </div>` : ''}
  </div>
  <button class="btn secondary" onclick="closeKantoMap()">⬅ Voltar</button>`;
}

function renderWalk(){
  const sp = SPECIES[game.starterId];
  const gym = gymAtual();
  const cards = (game.routeCards||[]).map(routeById).filter(Boolean);
  return `
  ${kantoTrailHtml(true)}
  <div class="box cursor">
    <h2>${spriteHtml(game.starterId,'sprite-sm')} Você escolheu ${sp.name}!</h2>
    <p>Com seu companheiro ao seu lado, você deixa o laboratório e começa a caminhar em direção ao Ginásio ${gym.gymTypeName}, na ${gym.city}, onde ${gym.leaderName} te espera.</p>
  </div>

function renderWalkNext(){
  const prevGym = gymOf(game.gymIndex-1);
  const gym = gymAtual();
  const cards = (game.routeCards||[]).map(routeById).filter(Boolean);
  return `
  ${kantoTrailHtml(true)}
  <div class="box cursor">
    <h2>🚶 Rumo à ${gym.city}</h2>
    <p>Com a <strong>${prevGym.badge}</strong> guardada com carinho, você deixa ${prevGym.city} para trás e segue viagem até ${gym.city}, onde ${gym.leaderName} te espera no Ginásio ${gym.gymTypeName}.</p>
  </div>
  ${renderRouteCardsBlock(cards)}
  ${kantoMapBotaoHtml()}`;
}

function renderRouteCardsBlock(cards){
  const gym = gymAtual();
  if(!cards || cards.length===0){
    // auto-recuperação: saves antigos (de antes do routeCards ser salvo) ou qualquer outro estado
    // inesperado sem cartas de rota -- gera de novo em vez de deixar a tela sem opção nenhuma
    game.routeCards = routesForLeg(game.gymIndex).map(r=>r.id);
    cards = game.routeCards.map(routeById).filter(Boolean);
    maybeAutoSave(); // salva a recuperação, pra não precisar regenerar de novo no próximo carregamento
  }
  return `
  <div class="eyebrow">🗺️ ESCOLHA DO CAMINHO</div>
  <div class="box cursor">
    <h2>Por onde você segue?</h2>
    <p>À frente está o Ginásio <strong>${gym.gymTypeName}</strong> de <strong>${gym.leaderName}</strong>. Cada caminho tem seus próprios Pokémons.</p>
  </div>
  ${cards.map(r=>`
    <button class="btn route-card" onclick="chooseRoute('${r.id}')">
      <span class="mon-name">${r.icon} ${r.name}</span>
      <span class="mon-sub">${typesHtml(r.types)}</span>
      <span class="route-rumor">💬 ${r.rumor}</span>
    </button>`).join('')}
  ${botaoSeuTimeHtml()}`;
}

  const enemySp = SPECIES[m.enemySpecies];

  return `
  <div class="eyebrow">${cfg.meta.icon||'⚔️'} ${((cfg.meta.title||'Batalha') + (cfg.meta.sub ? ' — ' + cfg.meta.sub : '')).toUpperCase()}</div>
  ${eliteTerrainBadgeHtml()}
  <div class="box cursor" style="${terrainBattleBgStyle(cfg.context==='elite' ? game.eliteTerrain : null)}">
    <div class="team-alive-row">
      <span class="team-alive-chip">🎒 ${escapeHtmlSafe(game.trainerName||'Você')}: ${(loading||animating)?m.playerAliveBefore:m.playerAliveAfter}/${m.playerTeamSize}</span>
      <span class="team-alive-chip">🥊 ${escapeHtmlSafe(cfg.meta.opponentName||'Adversário')}: ${(loading||animating)?m.enemyAliveBefore:m.enemyAliveAfter}/${m.enemyTeamSize}</span>
    </div>
    <div class="battle-vs">
      <div class="fighter">
        <div class="fighter-emoji">${playerSp?battleSpriteHtml(m.playerSpecies, m.enemySpecies, 'sprite-lg', m.playerShiny, true):''}</div>${m.player}${m.playerShiny?' 🌟':''} <span class="fighter-level">Lv.${m.playerLevel}</span>
        <div class="fighter-types">${playerSp?typesHtml(playerSp.types):''}</div>
        ${renderHpBar(displayPlayerHp, m.playerMaxHp, 'hp-fill-player', 'hp-label-player')}
      </div>
      <span class="vs-swords ${(loading||animating)?'spin':''}">⚔️</span>
      <div class="fighter">
        <div class="fighter-emoji">${enemySp?battleSpriteHtml(m.enemySpecies, m.playerSpecies, 'sprite-lg', m.enemyShiny):''}</div>${m.enemy}${m.enemyShiny?' 🌟':''} <span class="fighter-level">Lv.${m.enemyLevel}</span>
        <div class="fighter-types">${enemySp?typesHtml(enemySp.types):''}</div>
        ${renderHpBar(displayEnemyHp, m.enemyMaxHp, 'hp-fill-enemy', 'hp-label-enemy')}
      </div>
    </div>
    <div class="battle-status-area">${loading
      ? `<div class="loading-dots"><span></span><span></span><span></span></div><p class="loading-text">Aguardando o resultado da batalha...</p>`
      : (animating
        ? `<p class="loading-text">⚔️ Trocando golpes...</p>`
        : `<p class="battle-result-line">${matchupResultLine(m)}!${suddenDeathNote(m)}</p>`)

}

function slotDisplayName(slot){
  if(slot==null) return '?';
  if(slot==='custom') return 'time personalizado';
  const s = game.saveSlots && game.saveSlots[slot];
  return (s && s.customName) || `Time ${slot+1}`;
}
function escapeHtmlSafe(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}



function renderWild(){
  const caught = getAllCaughtSpecies();
  return `
  <div class="box">
    <h2>🌿 Pokémons selvagens!</h2>
    <p>No meio do caminho, alguns Pokémons selvagens aparecem. Escolha até <strong>2</strong> para se juntarem ao seu time — se não quiser nenhum, pode seguir em frente também.</p>
  </div>
  <div class="pool-badge">SELECIONADOS: ${game.wildSelected.length}/2</div>
  <div class="box">
    ${game.wildOffer.map(entry=>{
      const id = entry.speciesId;
      const disguiseInfo = entry.disguise ? DISGUISE_DISPLAY[entry.disguise] : null;
      const sp = disguiseInfo || SPECIES[id];
      const spriteMarkup = disguiseInfo
        ? spriteMarkupByDex(disguiseInfo.dex, disguiseInfo.name, disguiseInfo.emoji, 'sprite-sm', entry.shiny)
        : spriteHtml(id,'sprite-sm',entry.shiny);
      const isLegendary = ehLendario(id) || !!entry.disguise;
      const isSel = game.wildSelected.includes(id);
      /* O marcador respeita a pokédex CERTA: um shiny inédito não pode herdar o "já tenho" da
         versão normal -- era o que acontecia, e o jogador deixava passar um shiny que faltava.
         Nos disfarçados o badge some: um Ditto "já capturado" ao lado de um suposto Mew
         entregaria a pegadinha antes da hora. */
      const isCaught = entry.disguise ? false
        : (entry.shiny ? (game.permanentShinyDex||[]).includes(id) : caught.has(id));
      const disabled = (!isSel && game.wildSelected.length>=2) ? 'disabled' : '';
      /* A lupa é IRMÃ do card e não filha (ver .wild-dex no CSS: <button> dentro de <button> é
         HTML inválido). O disfarçado (Ditto fingindo de Mew) não ganha lupa: a ficha lê o SPECIES
         de verdade e entregaria a pegadinha. */
      return `<div class="wild-linha">
        <button class="btn wild-card ${isSel?'selected':''}" ${disabled} onclick="toggleWild('${id}')">
          <span class="mon-name">${spriteMarkup} ${sp.name} <span class="wild-lv">— Lv.${entry.level}</span> ${isSel?'✓':''} ${isLegendary?'✨':''} ${entry.shiny?'<span class="shiny-badge" title="Shiny! 1 em 128">🌟 SHINY</span>':''} ${isCaught?`<span class="pokedex-owned-badge" title="${entry.shiny?'Já está na sua Pokédex Shiny':'Já está na sua Pokédex'}">${pokedexIcon()}</span>`:''}</span>
          <span class="mon-sub">${typesHtml(sp.types)}</span>
        </button>
        ${disguiseInfo ? '' : `<button class="wild-dex" onclick="abrirPokedexFicha('${escJs(id)}', ${entry.shiny?'true':'false'})"
          aria-label="Ver a ficha de ${escapeHtmlSafe(sp.name)}" title="Ver os atributos">🔍</button>`}
      </div>`;
    }).join('')}
  </div>
  <button class="btn success" onclick="confirmWild()">Confirmar equipe ✔</button>
  ${botaoSeuTimeHtml()}
  <button class="btn secondary" onclick="abrirPokedexModal()">${pokedexIcon('grande')} Consultar Pokédex</button>`;
}
/* O time atual, sem sair da tela. A decisão de capturar depende de quem já está no time (tipo que
   falta, nível de quem está atrás), e antes disso exigia sair e voltar -- o que, desde a semente
   anti-artimanha, devolve a MESMA oferta mas custa a viagem.
   O botão é o MESMO nas três telas onde se decide alguma coisa sobre o time: o encontro selvagem,
   a escolha de ginásio e a escolha de rota. Nas duas últimas a pergunta é a mesma -- "que tipo
   falta no meu time?" -- e a resposta estava a duas telas de distância. O modal em si já é
   anexado no render principal, então serve em qualquer tela sem mais nada. */
function botaoSeuTimeHtml(){
  return `<button class="btn secondary" onclick="abrirTimeModal()">👥 Seu time (${(game.team||[]).length})</button>`;
}
function abrirTimeModal(){ game.timeModal = true; render(); }
function fecharTimeModal(){ game.timeModal = false; render(); }
function renderTimeModal(){
  if(!game.timeModal) return '';
  const time = game.team || [];
  return `
  <div class="modal-overlay" onclick="fecharTimeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h2>👥 Seu time</h2>
      ${time.length ? `<div class="time-modal-lista">${time.map((p,i)=>{
        const sp = SPECIES[p.speciesId];
        if(!sp) return '';
        /* Duas linhas na coluna da direita, e não tudo numa fileira só: em 320px os selos de dois
           tipos (Água + Voador) não cabiam ao lado do nome e passavam por cima dele. */
        return `<div class="time-modal-linha">
          <span class="time-modal-pos">${i+1}º</span>
          <span class="time-modal-sprite">${spriteHtml(p.speciesId,'sprite-sm',p.shiny)}</span>
          <span class="time-modal-info">
            <span class="time-modal-nome">${escapeHtmlSafe(sp.name)}${p.shiny?' 🌟':''}</span>
            <span class="time-modal-sub"><span class="time-modal-lv">Lv.${p.level}</span>${typesHtml(sp.types)}</span>
          </span>
        </div>`;
      }).join('')}</div>` : `<p class="hint-text">Seu time está vazio.</p>`}
      <button class="btn" onclick="fecharTimeModal()">Fechar</button>
    </div>
  </div>`;
}

/* DIA OU NOITE, pelo relógio DO CELULAR do jogador -- é assim que Espeon e Umbreon se separam no
   jogo original, e é a única mecânica daqui que olha a hora.
   Dia das 6h às 17h59, noite das 18h às 5h59: a mesma faixa do Gold/Silver/Crystal.
   O relógio é o do aparelho, não o do servidor, de propósito: quem joga às 22h no Brasil espera
   Umbreon, e um fuso escolhido por mim faria a tela discordar do celular na mão da pessoa. Dá pra
   adiantar o relógio pra pegar o outro? Dá -- e é o mesmo "custo" que o jogo original tinha. */
function ehDeDia(){ const h = new Date().getHours(); return h >= 6 && h < 18; }
function eeveeDoHorario(){
  return ehDeDia()
    ? { id:'espeon', quando:'É dia', porque:'O sol está alto — o Eevee responde à luz.' }
    : { id:'umbreon', quando:'É noite', porque:'A lua está no céu — o Eevee responde à escuridão.' };
}
function renderEeveeChoice(){
  const eevee = game.team.find(p=>p.speciesId==='eevee' && !p.eeveeResolved);
  if(!eevee) return `<div class="box"><p>Carregando...</p></div>`;
  const caught = getAllCaughtSpecies();
  const hora = eeveeDoHorario();
  const options = [
    {id:'keep', sp:SPECIES.eevee, label:'Manter como Eevee'},
    {id:'vaporeon', sp:SPECIES.vaporeon, label:'Evoluir para Vaporeon'},
    {id:'jolteon', sp:SPECIES.jolteon, label:'Evoluir para Jolteon'},
    {id:'flareon', sp:SPECIES.flareon, label:'Evoluir para Flareon'},
    {id:hora.id, sp:SPECIES[hora.id], label:'Evoluir para '+SPECIES[hora.id].name, horario:true}
  ];
  return `
  <div class="box cursor">
    <h2>🦊 Seu Eevee está pronto!</h2>
    <p>O Eevee pode evoluir de várias formas, ou continuar como está. Essa escolha é definitiva.</p>
    <p class="hint-text">${hora.id === 'espeon' ? '☀️' : '🌙'} <strong>${hora.quando}</strong> no seu
       relógio. ${hora.porque} Por isso a opção de <strong>${SPECIES[hora.id].name}</strong> está
       aberta agora — a outra aparece no outro turno do dia.</p>
  </div>
  <div class="box">
    ${options.map(o=>{
      const realId = o.id==='keep' ? 'eevee' : o.id;
      const isCaught = caught.has(realId);
      return `<button class="btn${o.horario?' eevee-horario':''}" onclick="chooseEeveeEvolution('${o.id}')">
      <span class="mon-name">${spriteHtml(realId,'sprite-sm')} ${o.label} ${o.horario?(hora.id==='espeon'?'☀️':'🌙'):''} ${isCaught?`<span class="pokedex-owned-badge">${pokedexIcon()}</span>`:''}</span>
      <span class="mon-sub">${typesHtml(o.sp.types)}</span>
    </button>`;
    }).join('')}
  </div>`;
}

  return `

    <h2>📦 PC do Prof. Carvalho</h2>
    <p>Seu time passou de <strong>6 Pokémons</strong>! Escolha <strong>${excess}</strong> para enviar ao Prof. Carvalho antes de continuar — não é permitido levar mais de 6 na equipe.</p>
  </div>
  <div class="pool-badge">SELECIONADOS PARA ENVIAR: ${game.releaseSelected.length}/${excess}</div>
  <div class="box">
    ${game.team.map(p=>{
      const sp = SPECIES[p.speciesId];
      const isSel = game.releaseSelected.includes(p.id);

function renderLevels(){
  const gym = gymAtual();
  const maxPer = getMaxPerPokemon();
  let message;
  if(game.levelsFromRocket){
    message = `Você espantou a Equipe Rocket! Isso rendeu <strong>+${game.poolTotal} levels</strong> bônus para reforçar o time.`;
  } else if(game.levelsFromRivalWin){
    message = `Você venceu seu rival! Isso rendeu <strong>+${game.poolTotal} levels</strong> bônus para reforçar o time.`;
  } else if(game.losses>0){
    message = `Não desanime! Você ganhou <strong>+${game.poolTotal} levels</strong> extras para reforçar o time antes de enfrentar ${gym.leaderName} de novo.`;
  } else if(game.gymIndex===0){
    message = `Antes da batalha, você recebe <strong>${game.poolTotal} levels</strong> para distribuir entre os membros do seu time.`;
  } else {
    message = `Parabéns pela vitória! Quanto menos tentativas você precisou, mais levels ganha — dessa vez foram <strong>+${game.poolTotal} levels</strong> para fortalecer seu time antes de enfrentar ${gym.leaderName}.`;
  }
  message += ` Você pode colocar no máximo <strong>${maxPer} levels</strong> em um único Pokémon nesta distribuição.`;
  return `
  <div class="box">
    <h2>⭐ Distribua os Levels</h2>
    <p>${message}</p>
  </div>
  <div class="pool-badge">
    <div class="pool-badge-main">LEVELS RESTANTES: ${game.pool}</div>
    <div class="pool-badge-sub">MÁX. POR POKÉMON: ${maxPer}</div>
  </div>
  <div class="box">
    ${game.team.map(p=>{
      const sp = SPECIES[p.speciesId];
      const current = p.level + (game.alloc[p.id]||0);
      const allocatedHere = game.alloc[p.id]||0;
      const atPoolMax = allocatedHere >= maxPer;
      const atLevelCap = current >= 55;
      const atLevel40Cap = !canAddLevelPoint(p, allocatedHere);
      const atMax = atPoolMax || atLevelCap || atLevel40Cap;
      const capLabel = atLevelCap ? ' (nível 55 — só sobe desmaiando em batalha)' : (atLevel40Cap ? ' (máx. +3 além do nível 40)' : (atPoolMax ? ' (máx.)' : ''));
      return `<div class="level-row">
        <div class="level-info">
          <span class="mon-name">${spriteHtml(p.speciesId,'sprite-sm',p.shiny)} ${p.name}${p.shiny?' 🌟':''} — Lv.${current}${capLabel}</span>
          <span class="mon-sub">${typesHtml(p.types)}</span>
        </div>
        <div class="level-controls">
          <button class="circle-btn" onclick="removePoint('${p.id}')" ${allocatedHere<=0?'disabled':''}>−</button>
          <span class="alloc-num">${allocatedHere}</span>
          <button class="circle-btn" onclick="addPoint('${p.id}')" ${(game.pool<=0||atMax)?'disabled':''}>+</button>
        </div>
      </div>`;
    }).join('')}
  </div>
  <button class="btn success" ${(game.pool===0 || !game.team.some(p=>{
    const allocHere = game.alloc[p.id]||0;
    return (p.level+allocHere)<55 && allocHere<maxPer && canAddLevelPoint(p, allocHere);
  }))?'':'disabled'} onclick="confirmLevels()">Confirmar e seguir para a batalha ⚔️</button>`;
}

function nomeDoGolpe(speciesId, tipo){
  if(!tipo) return null;
  const ov = MOVE_OVERRIDES[speciesId];
  if(ov && ov[tipo]) return ov[tipo];
  return MOVE_BY_TYPE[tipo] || null;
}
function matchupResultLine(m){
  if(m.isTrade){
    return `<span class="lose-text">${m.player} e ${m.enemy} caíram juntos</span>`;
  }
  const cls = m.playerWon ? 'win-text' : 'lose-text';
  return `<span class="${cls}">${m.winner} venceu</span>`;
}
function suddenDeathNote(m){
  if(!m.suddenDeath || !m.suddenDeathMessage) return '';
  return `<br><span class="sudden-death-note">💥 ${m.suddenDeathMessage}</span>`;
}
/* Cartão de confronto: os dois sprites, como cada um terminou de HP, e o golpe + dano de cada lado.
   O DANO sai da subtração dos HP que o matchup sempre guardou -- do motor só veio o TIPO do
   golpe (playerMove/enemyMove). Confrontos gravados ANTES disso (ligas e reprises antigas) não
   têm o tipo: ali o cartão mostra só o dano, em vez de inventar um nome.
   Não tem linha de "fulano venceu": quem caiu aparece apagado e com a barra no zero. */
function golpeSeloHtml(speciesId, tipo){
  const nome = nomeDoGolpe(speciesId, tipo);
  if(!nome) return '';
  // o selo do tipo com o NOME DO GOLPE dentro -- a cor já entrega o tipo
  return `<span class="type-pill" style="background:${TYPE_COLORS[tipo]||'#888'}">${nome}</span>`;
}
function renderMatchupLog(matchups){
  const lado = (m, id) => {
    // maxHp faltando (log antigo, gravado antes de o campo existir): cai no HP de entrada
    const maxHp = m.maxHp || Math.max(1, m.hpBefore || 1);
    const hp = Math.max(0, m.hp || 0);
    return `<div class="mlog-lado ${hp<=0?'caiu':''}">
      <div class="mlog-spr">${SPECIES[m.sp] ? spriteHtml(m.sp,'sprite-sm',!!m.shiny) : '❔'}</div>
      <div class="mlog-nome">${escapeHtmlSafe(m.nome||'')}${m.shiny?' 🌟':''}${m.lvl?` <span class="mlog-lv">Lv.${m.lvl}</span>`:''}</div>
      <div class="mlog-vida">
        ${renderHpBar(hp, maxHp, 'mlog-f-'+id, 'mlog-l-'+id)}
        <span class="mlog-hp">${hp}/${maxHp}</span>
      </div>
      ${m.semPassos ? `<div class="mlog-golpe">${golpeSeloHtml(m.sp, m.tipo)}<span class="mlog-dano">−${m.dano}</span></div>` : ''}
    </div>`;
  };
  return matchups.map((m, i)=>{
    // quanto CADA UM tirou: o dano do jogador é o que sumiu do HP do inimigo, e vice-versa
    const danoDoPlayer = Math.max(0, (m.enemyHpBefore||0) - (m.enemyHpAfter||0));
    const danoDoEnemy  = Math.max(0, (m.playerHpBefore||0) - (m.playerHpAfter||0));
    const aviso = suddenDeathNote(m);
    /* Com o passo a passo embaixo, o selo do golpe no cabeçalho vira repetição: o golpe aparece
       em toda frase. Ele só continua aparecendo em confronto ANTIGO, gravado antes do diário
       existir -- ali é a única forma de saber com o que cada um bateu. */
    const semPassos = !(m.golpes && m.golpes.length);
    return `<div class="matchup-row mlog">
      <div class="mlog-grade">
        ${lado({ nome:m.player, sp:m.playerSpecies, lvl:m.playerLevel, shiny:m.playerShiny,
                 hp:m.playerHpAfter, hpBefore:m.playerHpBefore, maxHp:m.playerMaxHp,
                 tipo:m.playerMove, dano:danoDoPlayer, semPassos }, i+'a')}
        <span class="mlog-x">×</span>
        ${lado({ nome:m.enemy, sp:m.enemySpecies, lvl:m.enemyLevel, shiny:m.enemyShiny,
                 hp:m.enemyHpAfter, hpBefore:m.enemyHpBefore, maxHp:m.enemyMaxHp,
                 tipo:m.enemyMove, dano:danoDoEnemy, semPassos }, i+'b')}
      </div>
      ${passosHtml(m)}
      ${aviso ? `<div class="mlog-res">${aviso}</div>` : ''}
    </div>`;
  }).join('');
}
/* O passo a passo do confronto, na ordem real em que os golpes aconteceram.
   Vem de matchup.golpes, escrito pelo motor durante a luta -- não é reconstrução.
   ATENÇÃO: a ANIMAÇÃO da batalha usa outra coisa (buildAnimatedHitSequence, que inventa até 3
   golpes a partir do HP antes/depois). Então o número de golpes aqui pode não bater com o que a
   animação mostrou. Confronto antigo, gravado antes disso, não tem a lista e o bloco some. */
/* O GOLPE MORIBUNDO NÃO VIRA LINHA.
   Regra do motor: na troca os dois atacam, e quem cai ainda conecta o contra-golpe pela metade
   (DYING_BLOW_FACTOR). Isso é real e o dano conta -- mas a ANIMAÇÃO nunca mostra um pokémon
   desmaiado batendo, e no log, escrito como linha própria, parecia defunto atacando.
   Aqui o dano dele é somado ao golpe ANTERIOR do mesmo pokémon: o log passa a ter as mesmas
   linhas que a animação mostrou e continua fechando com o HP do cartão (a soma das linhas
   permanece igual ao HP perdido). Se não existir golpe anterior (o pokémon entrou e caiu na
   mesma troca), ele entra como golpe normal ANTES do que derrubou -- os dois trocaram golpes
   na mesma troca, então essa é a ordem que a tela mostrou. */
function passosVisiveis(golpes){
  const saida = [];
  for(const g of golpes){
    if(!g.m){ saida.push(Object.assign({}, g)); continue; }
    /* GOLPE MORIBUNDO -- quem cai ainda revida, na mesma troca. Ele entra ANTES do golpe que o
       derrubou: assim ninguém aparece atacando depois de já ter caído, e a leitura fica na ordem
       que faz sentido -- quem morreu bateu primeiro, o outro respondeu e matou.
       Trocar a ordem não distorce nada: os dois golpes são do mesmo instante, e o motor só os
       aplica em sequência porque código roda em sequência. */
    const derrubou = saida.pop();
    saida.push(Object.assign({}, g, { m: 0 }));
    if(derrubou) saida.push(derrubou);
  }
  return saida;
}
/* A MESMA sequência serve o LOG e a ANIMAÇÃO -- é isso que garante que as duas contem a mesma
   história, com o mesmo número de golpes. Quando a luta real cabe no teto, é ela que vale; acima
   disso as duas usam a reconstrução de 3 golpes.
   Os golpes reais vêm sempre em par (os dois atacam em toda troca), então "cabe no teto" na
   prática significa uma troca só. */
const TETO_GOLPES = 3;
function sequenciaDoConfronto(m){
  const reais = passosVisiveis(m.golpes || []);
  if(reais.length && reais.length <= TETO_GOLPES) return reais;
  // a reconstrução fala em QUEM APANHA (side); aqui a lista é de QUEM BATE (q)
  return reconstruirSequencia(m).map(h => ({ q: h.side === 'player' ? 'e' : 'p', d: h.amount }));
}
function passosHtml(m){
  const golpes = sequenciaDoConfronto(m);   // a MESMA lista que a animação vai reproduzir
  if(!golpes.length) return '';
  const nomeP = escapeHtmlSafe(m.player||''), nomeE = escapeHtmlSafe(m.enemy||'');
  const ladoHtml = (doJogador) => `<span class="mlog-quem ${doJogador?'p':'e'}">${doJogador?nomeP:nomeE}</span>`;
  const seloDe = (doJogador) => golpeSeloHtml(doJogador?m.playerSpecies:m.enemySpecies, doJogador?m.playerMove:m.enemyMove);
  /* Uma frase só, sempre na mesma forma: "X atacou Y com GOLPE e tirou -N de HP."
     Já passaram por aqui marcação de crítico, de golpe moribundo e de "o tipo não pega nele" --
     cada uma virava ruído numa linha que se lê de relance. O número conta a história. */
  return `<div class="mlog-passos">${golpes.map(g=>{
    const doJogador = g.q === 'p';
    return `<div class="mlog-passo ${doJogador?'p':'e'}">
      ${ladoHtml(doJogador)} atacou ${ladoHtml(!doJogador)}${seloDe(doJogador)?` com ${seloDe(doJogador)}`:''} e tirou <span class="mlog-tira">−${g.d}</span> de HP.
    </div>`;
  }).join('')}</div>`;
}

function renderHpBar(hp, maxHp, fillId, labelId){
  const pct = Math.max(0, Math.min(100, (hp/maxHp)*100));
  return `
  <div class="hp-bar-wrap">
    <div class="hp-bar-track">
      <div class="hp-bar-fill ${hpBarClass(pct)}" id="${fillId}" style="transform:scaleX(${pct/100})"></div>
    </div>
    <div class="hp-bar-label" id="${labelId}">${Math.max(0,hp)}/${maxHp} HP</div>
  </div>`;
}

          : `<p>Parabéns! Você conquistou todas as <strong>8 insígnias</strong> de Kanto e está <strong>classificado para participar da Liga Pokémon</strong>!</p>`)
      : (()=>{
          const bolo = isHardMode()?HARD_DEFEAT_POOL:5;
          const teto = Math.ceil(bolo/2);
          // deixa claro que o bolo é do TIME: sem isso a pessoa acompanha um pokémon, vê ele subir
          // só até o teto e acha que o jogo entregou menos do que prometeu
          return `<p>Tentativa <strong>${game.losses}/5</strong> falhou. Você recebeu <strong>+${bolo} levels</strong> para distribuir no time — no máximo <strong>${teto}</strong> por pokémon.</p>`;
        })()}
  </div>
  ${win
    ? (hasNextGym
        ? `<button class="btn primary" onclick="continueJourney()">Continuar jornada ➜</button>`
        : `<button class="btn success" onclick="showJourneyEnd()">Ver resumo da jornada ➜</button>`)
    : `<button class="btn primary" onclick="prepareRetry()">Distribuir levels e tentar de novo</button>`}`;
}

/* Reclama o bônus shiny da vitória sobre a Elite.
   Serve pros dois casos: quem acabou de vencer E quem já era campeão antes deste prêmio existir --
   nesse segundo caso, a chamada acontece ao abrir a tela e o prêmio é entregue retroativamente.
   O servidor é idempotente por save, então chamar de novo não gera cupom duplicado. */
async function claimEliteShiny(){
  if(game.eliteStatus !== 'champion') return;
  // se já foi concedido E temos o id (ou já foi ativado), não há o que fazer.
  // Se foi concedido mas o id se perdeu (sessão antiga, save recarregado), chama assim mesmo:
  // o servidor devolve o cupom existente em vez de criar outro
  if(game.eliteShinyGranted) return;
  if(game.currentSaveSlot === null || game.currentSaveSlot === undefined) return;
  try{
    const r = await functionsClient.httpsCallable('claimEliteShinyBonus')({ slot: String(game.currentSaveSlot) });
    game.eliteShinyGranted = true;

    maybeAutoSave();
    loadNotificationsUnreadCount();   // o sino precisa refletir o cupom novo
    render();
  } catch(e){
    console.error('Erro ao reclamar o bônus da Elite:', e);
  }
}
async function activateEliteShiny(){
  if(game.currentSaveSlot === null || game.currentSaveSlot === undefined) return;
  game.eliteShinyError = null;
  try{
    // vai direto pelo save, sem depender de notificação -- ver activateEliteShinyBonus no index.js
    const r = await functionsClient.httpsCallable('activateEliteShinyBonus')({ slot: String(game.currentSaveSlot) });
    game.shinyBonusExpiresAt = r.data.expiresAt;
    game.eliteShinyUsed = true;
    maybeAutoSave();
    loadNotificationsUnreadCount();   // o sino precisa refletir o cupom novo
    render();
  } catch(e){
    console.error('Erro ao ativar o bônus da Elite:', e);
    // mostra a mensagem REAL do servidor. A versão anterior engolia o motivo num aviso genérico,
    // e ficava impossível saber se o problema era cupom já usado, id inválido ou função desatualizada
    const motivo = (e && e.message) ? e.message : 'erro desconhecido';
    game.eliteShinyError = motivo;
    render();
  }
}

  const status = game.eliteStatus;

  if(attemptsUsed > 0){
    // já perdeu ao menos uma vez, mas ainda tem tentativa sobrando -- distinto do convite original
    const attemptsLeft = ELITE_MAX_ATTEMPTS - attemptsUsed;
    return `<div class="box" style="border-color:var(--red-dark);">

  return `<div class="box" style="border-color:var(--red-dark);">
    <h2>⚔️ A Elite 4 te desafia!</h2>
    <p>As 8 insígnias abriram o caminho pro desafio final: 4 mestres e, na final, <strong>${escapeHtmlSafe(game.rivalName)}</strong>. Você tem <strong>${ELITE_MAX_ATTEMPTS} tentativas</strong> no total.</p>
    <button class="btn success" onclick="openEliteIntro()">Conhecer o desafio ➜</button>

function notificationIcon(type){
  if(type==='league_champion') return '👑';
  if(type==='league_started') return '🏆';
  if(type==='league_ended') return '🏁';
  if(type==='match_played') return '⚔️';
  if(type==='gym_leadership_lost') return '🚪';
  if(type==='mewtwo_loan_unlocked' || type==='mewtwo_loan_ended') return '🧬';
  if(type==='friend_request') return '👋';
  if(type==='friend_accepted') return '👥';
  if(type==='friend_challenge' || type==='friend_challenge_declined') return '⚔️';
  return '🔔';
}
/* O que cada notificação oferece pra FAZER. Fica separado do desenho da tela porque é a única
   parte que depende do estado do jogo (empréstimo ativo, desafio vencido, bônus já ativado). */
function ctaDaNotificacao(n){
  if(n.type==='league_champion'){
    return (n.meta && n.meta.activated)
      ? `<p class="u-mt8 win-text">✅ Bônus já ativado</p>`
      : `<button class="btn success u-mt8" onclick="activateShinyBonus('${escJs(n.id)}')">✨ Ativar bônus Shiny</button>`;
  }
  if(n.type==='friend_request'){
    // o botão leva pra lista, onde o pedido aparece com nome, presença e o que mais ajuda a
    // decidir -- aceitar de dentro da notificação seria aceitar às cegas
    return `<button class="btn primary u-mt8" onclick="openFriends()">👥 Ver na lista de amigos</button>`;
  }
  if(n.type==='friend_challenge'){
    // desafio tem prazo de 3 minutos: uma notificação de ontem não vale mais nada, e oferecer
    // "aceitar" nela só produziria um erro na cara de quem clicasse
    const vencido = !n.meta || !n.meta.expiresAt || Date.now() > n.meta.expiresAt;
    return vencido
      ? `<p class="u-mt8 hint-text">⏳ Esse desafio já expirou.</p>`
      : `<button class="btn success u-mt8" onclick="openFriends()">⚔️ Responder o desafio</button>`;
  }
  if(n.type==='mewtwo_loan_unlocked'){
    // 3 estados possíveis nesse momento: nunca usou ainda, já tem um emprestado em algum time
    // agora, ou está no cooldown de 7 dias depois do último uso -- cada um com sua própria mensagem
    if(game.mewtwoLoanActive){
      return `<p class="u-mt8 hint-text">🧬 Você já tem um Mewtwo emprestado agora.</p>`;
    }
    if(game.mewtwoLoanCooldownUntil && Date.now() < game.mewtwoLoanCooldownUntil){
      return `<p class="u-mt8 hint-text">🧬 Em cooldown -- disponível ${formatDateShort(game.mewtwoLoanCooldownUntil)} às ${formatClock(game.mewtwoLoanCooldownUntil)}.</p>`;
    }
    return `<button class="btn success mewtwo-loan-cta u-mt8" onclick="openMewtwoLoanTeamPicker()">
      ${spriteHtml('mewtwo','sprite-md',false)} Colocar Mewtwo no time
    </button>`;
  }
  return '';
}

function alternarSelecaoNotificacao(id){
  const sel = game.notifSelecionadas || [];
  game.notifSelecionadas = sel.includes(id) ? sel.filter(x=>x!==id) : sel.concat(id);
  render();

// o mesmo botão faz os dois: marcar todas e, quando já estão todas, desmarcar
function marcarTodasNotificacoes(){
  const todas = (game.notificationsList||[]).map(n=>n.id);
  game.notifSelecionadas = (game.notifSelecionadas||[]).length === todas.length ? [] : todas;
  render();

/* A MESMA pergunta do apagar avulso, em lote: se alguma das marcadas ainda guarda um prêmio pra
   resgatar (bônus shiny não ativado, empréstimo do Mewtwo), ela é NOMEADA na confirmação. Apagar o
   bônus sem ativar é perda definitiva, e num lote é ainda mais fácil levar junto sem ver. */
function pedirApagarSelecionadas(){
  const ids = game.notifSelecionadas || [];
  if(!ids.length) return;
  const avisos = (game.notificationsList||[])
    .filter(n=>ids.includes(n.id))
    .map(n=>({ n, premio: notificationPendingReward(n) }))
    .filter(x=>x.premio)
    .map(x=>({ titulo:x.premio.titulo, aviso:x.premio.aviso }));
  game.deleteNotifBulk = { ids, avisos };
  render();
}
function cancelarApagarSelecionadas(){ game.deleteNotifBulk = null; render(); }
// apaga otimista, igual ao avulso: some da tela na hora e volta se o servidor recusar
async function confirmarApagarSelecionadas(){
  const alvo = game.deleteNotifBulk;
  game.deleteNotifBulk = null;
  if(!alvo || !alvo.ids.length){ render(); return; }
  const anterior = game.notificationsList;
  game.notificationsList = (game.notificationsList||[]).filter(n=>!alvo.ids.includes(n.id));
  game.notifSelecionadas = [];
  game.notifModoSelecao = false;
  render();
  try{
    await functionsClient.httpsCallable('deleteNotifications')({ ids: alvo.ids });
  } catch(e){
    console.error('Erro ao apagar notificações:', e);
    game.notificationsList = anterior;
    game.notificationsActionError = (e && e.message) || 'Não foi possível apagar essas notificações agora.';
    render();
  }
}
/* Caixa de entrada: títulos em cima, corpo do que estiver aberto embaixo.
   Abre a mais recente sozinha -- a tela existe pra ler a notificação, e uma tela que abre com o
   painel de baixo vazio pede um clique só pra chegar onde a pessoa já queria chegar.
   O selo NOVA marca as que estavam por ler AO ABRIR a tela. A marcação de lida continua sendo em
   bloco, na abertura (ver openNotificationsScreen): se fosse uma a uma, o sino da home ficaria
   aceso enquanto sobrasse uma não aberta -- e a decisão antiga era não cobrar um clique por
   notificação. O selo é o que devolve a informação que a marcação em bloco apaga. */
function renderNotificationsScreen(){
  const list = game.notificationsList;
  let out = `<div class="result-banner win">🔔 Notificações</div>`;
  if(game.notificationsActionError){ out += `<div class="box"><p class="error-text">⚠️ ${escapeHtmlSafe(game.notificationsActionError)}</p></div>`; }
  if(!list){
    out += `<div class="box"><p class="hint-text">Carregando...</p></div>`;
  } else if(list.length===0){
    out += `<div class="box"><p>Nenhuma notificação ainda. Assim que sua liga começar, seu time jogar, ou você perder a liderança de um ginásio, aparece aqui.</p></div>`;
  } else {
    // a selecionada pode ter sido apagada: cai na mais recente sem precisar de tratamento à parte
    const aberta = list.find(n=>n.id===game.notificationSelected) || list[0];
    const novas = game.notificationsNovas || [];
    /* Modo de escolher várias: a linha passa a MARCAR em vez de abrir, e o corpo some da tela --
       ninguém está lendo uma notificação enquanto separa dez pra apagar, e sem ele a lista inteira
       cabe na tela. Foi pedido depois de um defeito encher a caixa de 21 avisos iguais. */
    const modo = !!game.notifModoSelecao;
    const marcadas = game.notifSelecionadas || [];
    const todasMarcadas = marcadas.length === list.length && list.length > 0;
    out += `<div class="box notif-caixa">
      <div class="notif-barra">
        ${modo
          ? `<span class="notif-barra-conta">${marcadas.length} de ${list.length}</span>
             <button class="notif-barra-btn" onclick="marcarTodasNotificacoes()">${todasMarcadas?'Nenhuma':'Todas'}</button>
             <button class="notif-barra-btn perigo" ${marcadas.length?'':'disabled'} onclick="pedirApagarSelecionadas()">🗑️ Apagar</button>
             <button class="notif-barra-btn" onclick="sairDoModoSelecao()">Cancelar</button>`
          : `<span class="notif-barra-conta">${list.length} notificaç${list.length===1?'ão':'ões'}</span>
             <button class="notif-barra-btn" onclick="entrarNoModoSelecao()">☑️ Selecionar</button>`}
      </div>
      <div class="notif-lista">
        ${list.map(n=>{
          const marcada = marcadas.includes(n.id);
          const classes = 'notif-item' + (modo ? (marcada?' marcada':'') : (n.id===aberta.id?' aberta':'')) + (novas.includes(n.id)?' nova':'');
          return `<button class="${classes}" onclick="${modo?'alternarSelecaoNotificacao':'abrirNotificacao'}('${escJs(n.id)}')">
          ${modo ? `<span class="notif-check">${marcada?'✔':''}</span>` : ''}

/* Reprise de um desafio do ginásio. Reaproveita a MESMA tela de revelação das outras batalhas,
   como a Torre e a Batalha Online já fazem.
   A perspectiva é a do DESAFIANTE, porque foi assim que o servidor gravou os confrontos: quem
   assiste vê a batalha do ponto de vista de quem atacou o ginásio, mesmo sendo o líder. */
function reverDesafioGinasio(idx){
  const entry = (game.neighborhoodGymChallengeHistoryData || [])[idx];
  if(!entry || !entry.matchups || !entry.matchups.length) return;
  game.trainerBattleResult = { matchups: entry.matchups, win: !!entry.challengerWon };
  game.trainerBattleOpponentName = entry.defenderName;
  // ÚNICO lugar que preenche isso: aqui a luta é de outra pessoa, então o lado esquerdo tem que
  // levar o nome do desafiante daquele desafio, e não o de quem está assistindo
  game.trainerBattlePlayerName = entry.challengerName;
  game.gymReplayPending = true;
  game.towerBattlePending = false;
  game.onlineBattlePending = false;
  game.onlineReplayPending = false;
  game.trainerRevealIndex = 0;
  game.trainerRevealPhase = 'loading';
  game.trainerHitSequence = [];
  game.trainerHitStep = 0;
  game.trainerMoveShown = false;
  preloadBattleSprites(entry.matchups);
  game.screen = 'trainerBattling';
  render();
  setTimeout(advanceTrainerReveal, 700);
}

/* Um pokémon ganha o buff quando algum tipo dele é do terreno -- MESMA regra do applyTerrainBuff,
   que é quem manda na batalha. Se as duas divergirem, a tela promete um bônus que a luta não dá. */
function ganhaBuffDeTerreno(speciesId, terrain){
  if(!terrain) return false;
  const sp = SPECIES[speciesId];
  return !!sp && (sp.types||[]).some(t => (terrain.types||[]).includes(t));
}
/* Fileira de time com o selo do terreno em quem se beneficia. Usada na tela do ginásio, na
   escolha de time do desafio e na ordem de batalha -- as três mostram o mesmo terreno. */
function timeComTerrenoHtml(lista, terrain){
  return `<div class="save-slot-team-row spread">${(lista||[]).map(p=>{
    const sp = SPECIES[p.speciesId];
    const buff = ganhaBuffDeTerreno(p.speciesId, terrain);
    return `<div class="save-slot-mon">
      <div class="save-slot-mon-sprite large">${sp?spriteHtml(p.speciesId,'sprite-md',p.shiny):'❔'}${
        buff ? `<span class="mon-terreno-selo" title="Ganha bônus no terreno ${escapeHtmlSafe(terrain.name)}">🔺</span>` : ''}</div>
      <div class="save-slot-mon-level">${p.shiny?'🌟 ':''}Lv.${p.level}</div>
    </div>`;
  }).join('')}</div>`;
}
function legendaTerrenoHtml(lista, terrain){
  if(!terrain) return '';
  const n = (lista||[]).filter(p=>ganhaBuffDeTerreno(p.speciesId, terrain)).length;
  return `<p class="terreno-legenda">🔺 ${n===0
    ? `Nenhum pokémon desse time ganha bônus no terreno ${escapeHtmlSafe(terrain.name)}.`
    : `<strong>${n}</strong> ${n===1?'pokémon ganha':'pokémon ganham'} bônus de terreno (${escapeHtmlSafe(terrain.name)}).`}</p>`;
}

// deriva o status FINAL de cada pokémon único a partir do log de confrontos -- o servidor não manda
// playerStatus/brockStatus prontos (só o log bruto), mas dá pra reconstruir: cada pokémon só aparece
// de novo numa luta SEGUINTE se sobreviveu a anterior, então a ÚLTIMA aparição dele no log já é o
// estado final (desmaiou ali, ou sobreviveu até o fim da batalha inteira)
function deriveTeamStatusFromMatchups(matchups, side){
  const bySpecies = new Map(); // nome como chave -- único dentro de um mesmo time
  for(const m of matchups){
    const speciesId = side==='player' ? m.playerSpecies : m.enemySpecies;
    const name = side==='player' ? m.player : m.enemy;
    const shiny = side==='player' ? m.playerShiny : m.enemyShiny;
    const level = side==='player' ? m.playerLevel : m.enemyLevel;
    const hpAfter = side==='player' ? m.playerHpAfter : m.enemyHpAfter;
    bySpecies.set(name, { speciesId, name, shiny, level, fainted: hpAfter<=0 });
  }
  return Array.from(bySpecies.values());
}

// nome do treinador com o 🏆 permanente de quem venceu a Elite 4 -- o troféu NUNCA entra no nome
// armazenado (rankings e conquistas são chaveados pelo nome puro; embutir o emoji quebraria o histórico),
// é só decoração na hora de exibir, guiada pela flag 'elite' que viaja junto nas inscrições
/* ============================================================================
   PERFIL PÚBLICO DE TREINADOR
   ----------------------------------------------------------------------------
   Qualquer nome de outro jogador na interface vira um link que abre um cartão
   com as conquistas dele. Os dados vêm da Cloud Function getTrainerProfile --
   não dá pra ler direto do Firestore porque as regras trancam users/{uid} no
   próprio dono (e é bom que tranquem: o documento tem o save inteiro).

   Nem toda tela tem o uid em mãos. O ranking histórico de campeões é indexado
   por NOME (é o que sobrevive quando um save é apagado), então nessas telas só
   temos o nome -- por isso a função aceita os dois e prefere o uid quando existe.
   ============================================================================ */
// vira link só se der pra identificar o treinador de algum jeito. O próprio jogador também
// é clicável -- ver o próprio cartão é útil, e abrir exceção pra isso só criaria um caso especial
function trainerProfileLink(inner, uid, name){
  const id = uid ? `uid:${uid}` : (name ? `name:${name}` : '');
  if(!id) return inner;
  // as DUAS camadas (string JS e atributo HTML) agora são responsabilidade do próprio escJs -- ver
  // o comentário lá. Passar escapeHtmlSafe por cima escaparia o & do &#39; de novo e quebraria
  // justamente o nome com apóstrofo que este trecho existia pra proteger
  const idAttr = escJs(id);
  return `<span class="trainer-link" onclick="openTrainerProfile('${idAttr}')" role="button" tabindex="0" title="Ver perfil de ${escapeHtmlSafe(name||'treinador')}">${inner}</span>`;
}
// plain=true devolve o nome SEM virar link. Usado nas linhas de partida, onde o nome já é clicável
// pra abrir o time do adversário -- dois onclick aninhados disparavam os dois modais em sequência
// (o de dentro e o de fora, por propagação). Ali o caminho pro perfil fica no TÍTULO do modal de time
function trainerNameHtml(p, plain){
  if(!p) return '';
  // o 🏆 de "já venceu a Elite 4" saiu daqui. Ele aparecia colado no nome em toda listagem (ranking,
  // classificação, partidas, inscritos), competindo por atenção com os troféus que ali significam
  // OUTRA coisa -- títulos de liga. Quem quiser essa informação continua tendo: ela está no cartão de
  // perfil, a um clique no nome. O campo p.elite segue existindo e sendo gravado; só não é mais
  // desenhado aqui
  const base = escapeHtmlSafe(p.name);
  if(plain) return base;
  return trainerProfileLink(base, p.uid, p.name);
}
// atalho da home: abre o PRÓPRIO perfil em modo DONO. Esse modo libera duas coisas que ninguém mais
// deve ver: o botão de trocar o nome e o progresso detalhado das especialidades (as barras "16/50").
// A permissão é passada aqui, não deduzida dentro do cartão comparando uid -- assim o modo dono só
// existe por esta porta, e não quando você encontra o próprio nome numa classificação ou num modal
// de time. Ali você é só mais um treinador, como qualquer outro te veria
function openMyTrainerProfile(){
  if(!game.authUser) return;
  openTrainerProfile('uid:'+game.authUser.uid, true);
}
async function openTrainerProfile(id, ownerView){
  const [tipo, ...resto] = String(id).split(':');
  const valor = resto.join(':');
  game.trainerProfile = { loading:true, data:null, error:null, name: tipo==='name' ? valor : null, ownerView: !!ownerView };
  render();
  try{
    const payload = tipo==='uid' ? { uid: valor } : { name: valor };
    const result = await functionsClient.httpsCallable('getTrainerProfile')(payload);
    // se o modal já foi fechado (ou outro perfil foi aberto) enquanto a chamada voltava, descarta
    if(!game.trainerProfile) return;
    game.trainerProfile = { loading:false, data: result.data, error:null, ownerView: !!ownerView };
  } catch(e){
    console.error('Erro ao carregar perfil do treinador:', e);
    if(!game.trainerProfile) return;
    game.trainerProfile = { loading:false, data:null, error:(e && e.message) || 'Não foi possível carregar esse perfil agora.', ownerView: !!ownerView };
  }
  render();
}
function closeTrainerProfile(){
  game.trainerProfile = null;
  render();
}
/* Texto que vai virar um argumento de string dentro de um onclick="..." -- ou seja, texto que
   passa por DOIS parsers: o de atributo HTML primeiro, o de JavaScript depois. Escapar só as
   aspas simples cobria o segundo e deixava o primeiro aberto: nome de treinador não filtra
   caractere nenhum (só corta em 20), então um `Ash" onmouseover="...` fechava o atributo e
   executava. O navegador desfaz as entidades ANTES de entregar o texto ao parser de JS, então as
   duas camadas convivem: \' vira &#39; no HTML e volta a \' na hora de virar código.
   A ordem importa -- o & tem que sair primeiro, senão um &#39; digitado no nome seria decodificado
   como aspa de verdade. */
function escJs(str){
  return String(str)
    .replace(/\\/g,'\\\\').replace(/'/g,"\\'")
    .replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
    .replace(/'/g,'&#39;');
}
function leagueMatchRow(match, roundLabel, ct, li, rk, mi, leagueRounds, phaseTimes, typeId){
  const isMyMatch = match.a && match.b && game.authUser && (match.a.uid===game.authUser.uid || match.b.uid===game.authUser.uid);
  const highlightClass = isMyMatch ? ' my-match' : '';
  const cycleId = String(ct);
  const roundIndex = Number(rk);
  const gated = !!phaseTimes;
  const matchKey = `${typeId}__${cycleId}__${li}__${rk}__${mi}`;

  // se o nome de A/B veio de uma partida da rodada ANTERIOR que ainda não foi revelada pra esse usuário,
  // mostra "❓ A definir" no lugar do nome -- senão dava pra descobrir quem ganhou só vendo quem "apareceu"
  // na fase seguinte, mesmo sem assistir a partida em si
  function displayName(side){
    const p = match[side];
    if(!p) return null;
    const shown = trainerNameHtml(p, true); // sem link: nessa linha o nome abre o TIME do adversário
    if(!gated || roundIndex===0 || !leagueRounds) return shown;
    const feedingRoundKey = String(roundIndex-1);
    const feedingRound = leagueRounds[feedingRoundKey];
    if(!feedingRound) return shown;
    const feedingIndex = side==='a' ? mi*2 : mi*2+1;
    const feedingMatch = feedingRound[feedingIndex];
    if(!feedingMatch || !feedingMatch.resolved) return shown; // ainda nem foi resolvida -- não tem o que esconder
    const feedingKey = `${typeId}__${cycleId}__${li}__${feedingRoundKey}__${feedingIndex}`;
    return isMatchRevealed(feedingKey, roundIndex-1, phaseTimes) ? shown : '❓ A definir';
  }

  if(!match.a || !match.b){
    const known = match.a || match.b;
    const knownSide = match.a ? 'a' : 'b';
    const knownName = known ? displayName(knownSide) : '?';
    return `<div class="league-match pending${highlightClass}">
      <div class="league-match-title">${roundLabel}</div>
      <div class="league-match-players">${knownName} <span class="vs">vs</span> ${match.a&&match.b?'':'(aguardando adversário)'}</div>
    </div>`;
  }
  const nameA = displayName('a');
  const nameB = displayName('b');
  const mysteryFeed = nameA==='❓ A definir' || nameB==='❓ A definir';
  if(!match.resolved){
    return `<div class="league-match pending${highlightClass}">
      <div class="league-match-header-row">
        <div class="league-match-title">${roundLabel}</div>
        ${match.terrain ? `<button class="terrain-inline-badge" style="background:${terrainColor(match.terrain)}" onclick="event.stopPropagation();openTerrainInfoModal('${match.terrain.id}')">${match.terrain.name}</button>` : ''}
      </div>
      <div class="league-match-players centered">
        ${mysteryFeed ? `<span class="mystery-name">${nameA}</span>` : `<span class="player-link" onclick="showPlayerTeamModal('${escJs(match.a.code)}','${escJs(match.a.name)}','${match.terrain ? match.terrain.types.join(",") : ''}','${escJs(match.a.uid||'')}')">${nameA}</span>`}
        <span class="vs">vs</span>
        ${mysteryFeed ? `<span class="mystery-name">${nameB}</span>` : `<span class="player-link" onclick="showPlayerTeamModal('${escJs(match.b.code)}','${escJs(match.b.name)}','${match.terrain ? match.terrain.types.join(",") : ''}','${escJs(match.b.uid||'')}')">${nameB}</span>`}
      </div>
      <div class="league-match-status">⏳ Aguardando o horário da batalha</div>
    </div>`;
  }
  const revealed = isMatchRevealed(matchKey, roundIndex, phaseTimes);
  return `<div class="league-match resolved${highlightClass}">
    <div class="league-match-header-row">
      <div class="league-match-title">${roundLabel}</div>
      ${match.terrain ? `<button class="terrain-inline-badge" style="background:${terrainColor(match.terrain)}" onclick="event.stopPropagation();openTerrainInfoModal('${match.terrain.id}')">${match.terrain.name}</button>` : ''}
    </div>
    <div class="league-match-players centered">
      <span class="player-link ${revealed && match.winner.name===match.a.name?'win-text':''}" onclick="showPlayerTeamModal('${escJs(match.a.code)}','${escJs(match.a.name)}','${match.terrain ? match.terrain.types.join(",") : ''}','${escJs(match.a.uid||'')}')">${nameA}</span>
      <span class="vs">vs</span>
      <span class="player-link ${revealed && match.winner.name===match.b.name?'win-text':''}" onclick="showPlayerTeamModal('${escJs(match.b.code)}','${escJs(match.b.name)}','${match.terrain ? match.terrain.types.join(",") : ''}','${escJs(match.b.uid||'')}')">${nameB}</span>
    </div>
    <div class="league-match-status">${revealed ? `🏅 ${match.winner.name} venceu!` : '🔒 Assista a batalha pra saber quem venceu'}</div>
    ${((match.matchups && match.matchups.length>0) || match.logStored) ? `<button class="btn secondary league-watch-btn" onclick="watchLeagueMatch(${ct},${li},'${rk}',${mi},'${matchKey}')">▶ Assistir batalha</button>` : ''}
  </div>`;
}

  return `

async function watchLeagueMatch(ct, li, rk, mi, matchKey){
  let league = null;
  if(game.leagueHistoryView && game.leagueHistoryView.cycleTime===ct){
    league = game.leagueHistoryView.league;
  } else if(game.leagueData){
    const cycle = game.leagueData.cycles.find(c=>c.scheduledTime===ct);
    if(cycle && cycle.leagues){ league = cycle.leagues[li]; }
  }
  if(!league) return;
  const match = league.rounds[rk][mi];
  if(!match || !match.resolved) return;
  // formato antigo (embutido) segue como sempre; formato novo (logStored) busca sob demanda --
  // o id do ciclo É o próprio scheduledTime (makeCycleId), então o caminho é derivável daqui
  let matchups = (match.matchups && match.matchups.length>0) ? match.matchups : null;
  if(!matchups && match.logStored){
    const typeId = game.currentLeagueTypeId || CLASSIC_LEAGUE_TYPE;
    const logId = `L${league.id}_R${rk}_M${mi}`;
    matchups = await fetchStoredMatchLog(
      cycleDocRef(typeId, makeCycleId(ct)).collection('matchLogs').doc(logId),
      `cl:${typeId}:${ct}:${logId}`
    );
  }
  if(!matchups || matchups.length===0) return;
  if(matchKey){ markMatchWatched(matchKey); } // revela essa partida pra sempre pra essa conta, a partir de agora
  game.leagueWatch = {
    playerAName: match.a.name,
    playerBName: match.b.name,
    matchups: matchups,
    winnerName: match.winner.name,
    terrain: match.terrain || null
  };
  preloadBattleSprites(matchups);
  game.leagueWatchIndex = 0;
  game.leagueWatchPhase = 'loading';
  game.screen = 'leagueWatch';
  render();
  setTimeout(advanceLeagueWatch, 1200);
}
function advanceLeagueWatch(){
  if(game.screen !== 'leagueWatch') return;
  const w = game.leagueWatch;
  if(game.leagueWatchPhase === 'loading'){
    const m = w.matchups[game.leagueWatchIndex];
    game.leagueWatchHitSequence = buildAnimatedHitSequence(m);
    game.leagueWatchHitStep = 0;
    game.leagueWatchCurrentPlayerHp = m.playerHpBefore;
    game.leagueWatchCurrentEnemyHp = m.enemyHpBefore;
    if(game.leagueWatchHitSequence.length > 0){
      game.leagueWatchPhase = 'animating';
      render();
      setTimeout(advanceLeagueWatch, 550);
    } else {
      game.leagueWatchPhase = 'result';
      render();
      setTimeout(animateLeagueWatchHpBars, 50);
      setTimeout(advanceLeagueWatch, 1300);
    }
  } else if(game.leagueWatchPhase === 'animating'){
    const hit = game.leagueWatchHitSequence[game.leagueWatchHitStep];
    if(hit.side==='player'){ game.leagueWatchCurrentPlayerHp = Math.max(0, game.leagueWatchCurrentPlayerHp - hit.amount); }
    else { game.leagueWatchCurrentEnemyHp = Math.max(0, game.leagueWatchCurrentEnemyHp - hit.amount); }
    game.leagueWatchLastHit = hit;
    game.leagueWatchHitStep++;
    const isLastHit = game.leagueWatchHitStep >= game.leagueWatchHitSequence.length;
    const m = w.matchups[game.leagueWatchIndex];
    const hitMaxHp = hit.side==='player' ? m.playerMaxHp : m.enemyMaxHp;
    const hitDuration = hpBarTransitionMs((hit.amount / hitMaxHp) * 100);
    if(isLastHit){
      game.leagueWatchPhase = 'result';
      animateLeagueWatchHpBars();
      setTimeout(render, hitDuration + 50);
      setTimeout(advanceLeagueWatch, hitDuration + 800);
    } else {
      animatePartialLeagueWatchHpBars();
      setTimeout(advanceLeagueWatch, hitDuration + 150);
    }
  } else if(game.leagueWatchIndex < w.matchups.length - 1){
    game.leagueWatchIndex++;
    game.leagueWatchPhase = 'loading';
    render();
    setTimeout(advanceLeagueWatch, 1200);
  }
}
function animatePartialLeagueWatchHpBars(){
  if(game.screen !== 'leagueWatch' || game.leagueWatchPhase !== 'animating') return;
  const m = game.leagueWatch.matchups[game.leagueWatchIndex];
  const hit = game.leagueWatchLastHit;
  if(!hit) return;
  const isPlayer = hit.side === 'player';
  const maxHp = isPlayer ? m.playerMaxHp : m.enemyMaxHp;
  const currentHp = isPlayer ? game.leagueWatchCurrentPlayerHp : game.leagueWatchCurrentEnemyHp;
  const duration = hpBarTransitionMs((hit.amount / maxHp) * 100);
  const fill = document.getElementById(isPlayer ? 'hp-fill-player' : 'hp-fill-enemy');
  const label = document.getElementById(isPlayer ? 'hp-label-player' : 'hp-label-enemy');
  if(fill){
    fill.style.transitionDuration = duration + 'ms';
    const pct = Math.max(0, (currentHp/maxHp)*100);
    fill.style.transform = 'scaleX(' + (pct/100) + ')';
    fill.className = 'hp-bar-fill ' + hpBarClass(pct);
  }
  if(label){ label.textContent = `${Math.max(0,currentHp)}/${maxHp} HP`; }
}
function animateLeagueWatchHpBars(){
  if(game.screen !== 'leagueWatch' || game.leagueWatchPhase !== 'result') return;
  const m = game.leagueWatch.matchups[game.leagueWatchIndex];
  const hit = game.leagueWatchLastHit;
  const playerFill = document.getElementById('hp-fill-player');
  const enemyFill = document.getElementById('hp-fill-enemy');
  const playerLabel = document.getElementById('hp-label-player');
  const enemyLabel = document.getElementById('hp-label-enemy');
  if(hit){
    const isPlayer = hit.side === 'player';
    const maxHp = isPlayer ? m.playerMaxHp : m.enemyMaxHp;
    const duration = hpBarTransitionMs((hit.amount / maxHp) * 100);
    const targetFill = isPlayer ? playerFill : enemyFill;
    if(targetFill){ targetFill.style.transitionDuration = duration + 'ms'; }
  }
  if(playerFill){
    const pct = Math.max(0, (m.playerHpAfter/m.playerMaxHp)*100);
    playerFill.style.transform = 'scaleX(' + (pct/100) + ')';
    playerFill.className = 'hp-bar-fill ' + hpBarClass(pct);
  }
  if(enemyFill){
    const pct = Math.max(0, (m.enemyHpAfter/m.enemyMaxHp)*100);
    enemyFill.style.transform = 'scaleX(' + (pct/100) + ')';
    enemyFill.className = 'hp-bar-fill ' + hpBarClass(pct);
  }
  if(playerLabel){ playerLabel.textContent = `${Math.max(0,m.playerHpAfter)}/${m.playerMaxHp} HP`; }
  if(enemyLabel){ enemyLabel.textContent = `${Math.max(0,m.enemyHpAfter)}/${m.enemyMaxHp} HP`; }
}

function formatClock(ms){
  return new Date(ms).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}
function formatDateShort(ms){
  return new Date(ms).toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
}
// converte um dateId (formato ISO 'YYYY-MM-DD', usado como chave interna) pro formato brasileiro
// dd/mm/aaaa só pra EXIBIÇÃO -- nunca usar o resultado como chave/query, só como texto pra tela
function formatDateIdBR(dateId){
  if(!dateId) return dateId;
  const parts = dateId.split('-');
  if(parts.length!==3) return dateId;
  const [y,m,d] = parts;
  return `${d}/${m}/${y}`;
}

        <h2>📜 Suas últimas Ligas</h2>
        <div class="status-list">
          ${myHistory.map(h=>`
            <div class="status-row">
              <span class="icon">${h.leagueSize===GRANDE_LIGA_SIZE?'🌟':'🏅'}</span>
              <span>${escapeHtmlSafe(h.leagueTypeName||'Liga Clássica')}${h.leagueSize===GRANDE_LIGA_SIZE?' (Grande Liga)':''} ${formatDateShort(h.cycleTime)} - ${formatClock(h.cycleTime)}: <strong>${h.placement}</strong></span>
              <button class="league-history-btn" onclick="viewLeagueHistory('${h.leagueTypeId||CLASSIC_LEAGUE_TYPE}','${h.cycleId}',${h.leagueId},${h.cycleTime})">▶ Rever</button>
            </div>
          `).join('')}
        </div>
      </div>`;
    }
    const globalHistory = game.globalLeagueHistory || [];
    if(globalHistory.length>0){
      body += `
      <div class="box">
        <h2>🌐 Últimas Ligas</h2>
        <div class="status-list">
          ${globalHistory.map(h=>`
            <div class="status-row">
              <span class="icon">${h.league.size===GRANDE_LIGA_SIZE?'🌟':'🏆'}</span>
              <span>${h.league.size===GRANDE_LIGA_SIZE?'Grande Liga':'Liga'} ${formatDateShort(h.cycleTime)} - ${formatClock(h.cycleTime)}${h.league.champion?` — campeão: <strong>${escapeHtmlSafe(h.league.champion.name)}</strong>`:''}</span>
              <button class="league-history-btn" onclick="viewLeagueHistory('${CLASSIC_LEAGUE_TYPE}','${h.cycleId}',${h.league.id},${h.cycleTime})">▶ Rever</button>
            </div>
          `).join('')}
        </div>
      </div>`;
    }
  }

  return `
  ${body}
  ${game.leagueError && !registeringCycle ? `<p class="error-text">${game.leagueError}</p>` : ''}
  <button class="btn primary" onclick="leaveLeagueScreen()">⬅ Voltar</button>`;
}

function towerTeamRowHtml(team){
