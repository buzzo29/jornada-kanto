  } catch(e){ console.error('Erro ao carregar dados permanentes da conta:', e); }
}
async function recordLeagueChampionWin(name, uid, typeId){
  // 1) ranking global (por nome de treinador, nunca é removido mesmo que o time seja apagado depois) --
  // um documento por TIPO de liga, já que o ranking é exclusivo de cada liga
  try{
    await db.collection('leagues').doc('champions_alltime_'+(typeId||CLASSIC_LEAGUE_TYPE)).set(
      { wins: { [name]: firebase.firestore.FieldValue.increment(1) } },
      { merge: true }
    );
  } catch(e){ console.error('Erro ao registrar campeão no ranking global:', e); }
  // 2) total permanente da conta (não é mais por slot -- só 1 time da conta compete por vez, então o
  // total já é, na prática, "quantas vezes essa conta venceu", sem precisar dividir por time).
  // por causa das regras do Firestore, o cliente só pode escrever na PRÓPRIA conta -- se foi o navegador de
  // outro jogador (ou ninguém) que resolveu essa partida, essa escrita é responsabilidade da Cloud Function
  // (que usa privilégio de admin, sem essa restrição). A reconciliação abaixo cobre o caso de ela não rodar.
  if(uid && game.authUser && game.authUser.uid===uid){
    try{
      const extraFlags = typeId===TRAINERS_LEAGUE_TYPE ? { anyTrainersChampion: true, achievementFlagsMigrated: true } : {};
      await userDocRef(uid).set({ leagueWinsTotal: firebase.firestore.FieldValue.increment(1), ...extraFlags }, { merge: true });
      game.leagueWinsTotal = (game.leagueWinsTotal||0) + 1;
      if(game.achievementsExtra && typeId===TRAINERS_LEAGUE_TYPE){ game.achievementsExtra = { ...game.achievementsExtra, anyTrainersChampion:true }; }
    } catch(e){ console.error('Erro ao registrar campeão na conta:', e); }
  }
}
async function recordLeaguePlacement(uid, record){
  // grava a colocação final (Campeão, Vice, etc.) direto na conta do jogador, assim que a Liga termina --
  // isso evita ter que vasculhar várias Ligas depois só pra montar a lista "Suas últimas Ligas".
  // Agora é uma lista ÚNICA por CONTA (não mais por slot/save) -- como só 1 time da conta pode estar
  // inscrito na Liga por vez, não existe mais o risco de times diferentes se sobrescreverem
  if(!uid) return;
  // mesma restrição de segurança do restante da Liga: o cliente só grava na PRÓPRIA conta; se foi outro
  // navegador (ou ninguém) que processou essa Liga, a Cloud Function cobre isso com privilégio de admin
  if(!game.authUser || game.authUser.uid !== uid) return;
  try{
    const ref = userDocRef(uid);
    const snap = await ref.get();
    const current = (snap.exists && snap.data().leaguePlacements) ? snap.data().leaguePlacements : [];
    // inclui leagueTypeId na checagem -- cycleId (um timestamp) e leagueId (um índice) podem coincidir
    // entre tipos de liga DIFERENTES rodando na mesma hora, então sem isso um resultado da Liga
    // Clássica poderia ser confundido como duplicata de um resultado de uma liga customizada (ou vice-versa)
    if(current.some(p=>p.cycleId===record.cycleId && p.leagueId===record.leagueId && p.leagueTypeId===record.leagueTypeId)) return; // já registrado, evita duplicar
    const updated = [record, ...current].sort((a,b)=>b.cycleTime-a.cycleTime).slice(0, LEAGUE_HISTORY_RETENTION);
    // flags permanentes de conquista, gravadas AGORA (no momento real do evento) em vez de precisar
    // vasculhar todo o histórico de ligas toda vez que alguém abre a home -- ver computeLeagueAchievementExtra.
    // Mesmo mapeamento placement->flag que o escaneamento antigo usava, só que escrito uma vez e lido depois
    const flagUpdates = { anyRegistered: true, achievementFlagsMigrated: true };
    if(record.placement==='Campeão'){ flagUpdates.anyChampion = true; flagUpdates.anyRunnerUp = true; flagUpdates.anySemifinal = true; }
    else if(record.placement==='Vice-campeão'){ flagUpdates.anyRunnerUp = true; flagUpdates.anySemifinal = true; }
    else if(record.placement==='3º–4º Lugar'){ flagUpdates.anySemifinal = true; }
    await ref.set({ leaguePlacements: updated, ...flagUpdates }, { merge: true });
    game.myLeagueHistory = updated;
    if(game.achievementsExtra){ game.achievementsExtra = { ...game.achievementsExtra, ...flagUpdates }; }
  } catch(e){ console.error('Erro ao gravar colocação na Liga:', e); }
}
async function reconcileLeagueWinsFromHistory(){
  // rede de segurança: se por algum motivo a Cloud Function não rodou (ex: não foi implantada ainda) e
  // ninguém logado na própria conta processou a Final, o total da conta pode ficar desatualizado mesmo
  // com o ranking global correto. Isso corrige comparando com o histórico retido de CADA tipo de liga
  // (até 12 ciclos cada). Aproveita a MESMA varredura pra também preencher retroativamente colocações
  // de antes dessa funcionalidade existir.
  if(!game.authUser) return;
  try{
    const [types, userSnapEarly] = await Promise.all([listActiveLeagueTypes(), userDocRef(game.authUser.uid).get()]);
    let totalFromHistory = 0;
    const backfillPlacements = [];
    for(const type of types){
      const scheduleSnap = await scheduleDocRef(type.id).get();
      if(!scheduleSnap.exists) continue;
      const completedEntries = (scheduleSnap.data().cycles||[]).filter(c=>c.status==='complete');
      // busca todos os ciclos concluídos em paralelo, em vez de um de cada vez -- bem mais rápido
      const detailSnaps = await Promise.all(completedEntries.map(entry=>cycleDocRef(type.id, entry.id).get().catch(()=>null)));
      for(let i=0;i<completedEntries.length;i++){
        const entry = completedEntries[i];
        const detailSnap = detailSnaps[i];
        if(!detailSnap || !detailSnap.exists) continue;
        const cycleTime = entry.scheduledTime!=null ? entry.scheduledTime : Number(entry.id) || 0;
        for(const league of (detailSnap.data().leagues||[])){
          if(league.champion && league.champion.uid===game.authUser.uid){ totalFromHistory++; }
          const myParticipants = (league.rounds['0']||[]).flatMap(m=>[m.a,m.b]).filter(p=>p && p.uid===game.authUser.uid);
          for(const participant of myParticipants){
            const placement = computePlacement(league, participant.name);
            if(placement){
              // alguns ciclos antigos (de antes desse campo existir, ou de uma migração) podem estar sem
              // "scheduledTime"/"size" -- o Firestore recusa gravar "undefined", então sem esse fallback
              // um único registro velho malformado quebrava a gravação de TODO o histórico, não só o dele
              const leagueSize = league.size!=null ? league.size : ((league.rounds['0']||[]).length * 2 || REGULAR_LIGA_SIZE);
              backfillPlacements.push({ cycleId: entry.id, cycleTime, leagueId: league.id, leagueSize, placement, leagueTypeId: type.id, leagueTypeName: type.name||'Liga Clássica' });
            }
          }
        }
      }
    }
    const currentTotal = game.leagueWinsTotal || 0;
    const needsTotalUpdate = totalFromHistory > currentTotal;
    if(backfillPlacements.length>0){
      const existing = (userSnapEarly.exists && userSnapEarly.data().leaguePlacements) ? userSnapEarly.data().leaguePlacements : [];
      const existingKeys = new Set(existing.map(p=>p.cycleId+'-'+p.leagueId+'-'+p.leagueTypeId));
      const newOnes = backfillPlacements.filter(p=>!existingKeys.has(p.cycleId+'-'+p.leagueId+'-'+p.leagueTypeId));
      if(newOnes.length>0){
        const updated = [...existing, ...newOnes].sort((a,b)=>b.cycleTime-a.cycleTime).slice(0, LEAGUE_HISTORY_RETENTION);
        await userDocRef(game.authUser.uid).set({ leaguePlacements: updated }, { merge: true });
        game.myLeagueHistory = updated;
      }
    }
    if(needsTotalUpdate){
      const newTotal = Math.max(currentTotal, totalFromHistory);
      await userDocRef(game.authUser.uid).set({ leagueWinsTotal: newTotal }, { merge: true });
      game.leagueWinsTotal = newTotal;
    }
  } catch(e){ console.error('Erro ao reconciliar vitórias da Liga:', e); }
}
async function loadLeagueLeaderboard(typeId){
  try{
    const snap = await db.collection('leagues').doc('champions_alltime_'+(typeId||CLASSIC_LEAGUE_TYPE)).get();
    const wins = (snap.exists && snap.data().wins) ? snap.data().wins : {};
    const eliteNames = (snap.exists && snap.data().eliteNames) ? snap.data().eliteNames : {};

/* EVOLUÇÕES COM BIFURCAÇÃO -- as três que a Gen 2 criou em cima de linhas de Kanto.
   No jogo original o que decide é a pedra (Folha ou Solar) ou o item de troca; aqui não existem
   itens, então quem decide é o jogador, na hora, como já acontece com o Eevee.
   A entrada em EVOLUTIONS continua existindo pro destino de Kanto: é o que `finalEvolutionOf`
   usa pra montar time de NPC (rival, Torre), onde não há ninguém pra escolher. O jogador nunca
   passa por ela -- o tryEvolve intercepta antes. */
const EVOLUTION_CHOICES = {
  gloom:     ['vileplume','bellossom'],
  poliwhirl: ['poliwrath','politoed'],
  slowpoke:  ['slowbro','slowking']
};
function tryEvolve(p){
  const events = [];
  let currentId = p.speciesId;
  while(EVOLUTIONS[currentId] && p.level >= EVOLUTIONS[currentId].level){
    /* Chegou num ponto de bifurcação: para aqui e deixa marcado. Quem resolve é a tela de
       escolha (ver evolucoesPendentes), e o tryEvolve roda de novo depois -- por isso a marca
       fica no pokémon e não numa variável solta. */
    if(EVOLUTION_CHOICES[currentId] && !p.evoChoiceResolved){
      p.pendingEvoChoice = currentId;
      break;
    }
    const step = EVOLUTIONS[currentId];
    const fromSp = SPECIES[currentId];
    const toSp = SPECIES[step.into];
    events.push({ fromName:fromSp.name, toName:toSp.name, atLevel:step.level, toSpeciesId:step.into, shiny: !!p.shiny });
    currentId = step.into;
    markCaught(currentId, !!p.shiny);
  }
  if(currentId !== p.speciesId){
    const newSp = SPECIES[currentId];
    p.speciesId = currentId;
    p.name = newSp.name;
    p.types = newSp.types;
    p.baseHp = newSp.hp;
    p.attack = newSp.attack;
    p.defense = newSp.defense;
    p.spAtk = newSp.spAtk;
    p.spDef = newSp.spDef;
  }
  return events;
}

function typeVsType(atk, def){
  const chart = TYPE_CHART[atk];
  if(!chart) return 1;
  const val = chart[def];
  return (val === undefined) ? 1 : val;
}
/* ============================================================================
   SUBTIPOS DE ATAQUE
   ----------------------------------------------------------------------------
   Alguns pokémon aprendem, na Gen 1, golpes de um tipo que NÃO é o tipo deles. O
   Porygon é Normal mas tem Psybeam; o Hitmonchan é Lutador mas tem os três socos
   elementais. Aqui isso vira "subtipo": um tipo alternativo que o pokémon pode usar
   pra atacar quando ele render mais dano que o tipo próprio.

   O caso que motivou: Porygon (Normal) contra um Fantasma. Normal não causa NADA em
   Fantasma, então sem subtipo ele fica inútil no confronto -- mesmo tendo, no jogo
   original, um golpe Psíquico que resolveria.

   REGRAS
   - Subtipo NÃO recebe STAB (o bônus de 1.5 de "mesmo tipo"). Sem essa regra o subtipo
     seria ganho puro e todo mundo ficaria mais forte de graça; com ela, ele só compensa
     quando a vantagem de tipo ou o atributo justificam.
   - Vale sempre, sem depender de nível.
   - Normal só é subtipo de quem tem TODOS os tipos especiais (Fogo, Água, Planta, Elétrico,
     Psíquico, Gelo, Dragão). Nesses, o lado físico fica inacessível: o Kingler é Água pura,
     com Ataque 130 e Especial 50, e sem o Normal os 130 nunca seriam usados.
     Quem já tem um tipo físico próprio (Venusaur tem Veneno, Geodude tem Pedra e Terra) NÃO
     recebe Normal -- ali ele não destravaria nada, só daria mais uma opção neutra. Na simulação,
     esse Normal de sobra derrubava a Chansey (Defesa 5) contra 61 espécies que não tinham
     motivo nenhum pra atacá-la pelo lado físico.

   Origem dos dados: golpes de nível da Gen 1 (PokeAPI), via gerar-cobertura.js.
   ATENÇÃO: o subtipo é calculado contra os tipos do SPECIES DESTE JOGO, não os da PokeAPI.
   A API devolve os tipos ATUAIS, e vários mudaram: Clefairy virou Fada, Magnemite ganhou Aço.
   Usar os tipos dela daria a Clefairy o subtipo 'Normal' -- que é o tipo dela aqui.

   PRA DESLIGAR: USE_SUBTYPES = false. O motor volta a considerar só os tipos próprios.
   ============================================================================ */
const USE_SUBTYPES = true;
/* 0,25 e não 0,10 porque o EXPOENTE_TIPO passou a ser 1.0: com o expoente em 0,6, a constante
   0,10 virava 0,25 depois da compressão -- que é a força escolhida (Hitmonlee tira ~15% da vida
   do Gengar). Deixar 0,10 com o expoente em 1.0 cortaria isso pela metade em silêncio. */
const IMUNIDADE_TEIMOSA = 0.25;   // ver GOLPE TEIMOSO em bestAttackType
/* EXPOENTE DO MULTIPLICADOR DE TIPO -- o parâmetro mais sensível do motor.
   1.0 = tabela oficial (2x é 2x). Abaixo de 1 comprime: em 0.6, um 2x virava 1,52x.
   Ele define o quanto o jogo é "sobre tipo" e o quanto é "sobre atributo", e entra em DOIS
   lugares: no dano e na escolha do golpe. Os dois têm que usar o mesmo valor -- quando a
   escolha usava o cru e o dano o comprimido, o motor escolhia um tipo e aplicava outro, e
   cliente e servidor discordavam do melhor golpe em 4% dos confrontos. */
const EXPOENTE_TIPO = 1.0;
/* Redutor do subtipo. Atacar por um subtipo rende SUBTYPE_PENALTY do dano normal.
   Existe porque o subtipo, mesmo sem STAB, ainda era escolhido em situações apertadas -- e
   nas simulações isso virava reviravolta grande demais em confrontos específicos (Gastly
   ganhava 50 pontos de taxa de vitória, a Chansey perdia 16).
   Com o redutor, o subtipo só vence quando tem folga de verdade: a vantagem de tipo ou o
   atributo do alvo precisam compensar tanto o STAB perdido quanto estes 15%.
   Vale tanto na ESCOLHA do tipo quanto no dano final -- se entrasse só num dos dois, o motor
   escolheria um golpe e aplicaria outro. */
const SUBTYPE_PENALTY = 0.85;
const SUBTYPES = {"charmander":["Normal"],"charmeleon":["Normal"],"squirtle":["Normal"],"wartortle":["Normal"],"blastoise":["Normal"],"butterfree":["Psychic"],"pikachu":["Normal"],"raichu":["Normal"],"sandshrew":["Poison"],"sandslash":["Poison"],"nidoranf":["Fighting"],"nidorina":["Fighting"],"nidoqueen":["Fighting"],"nidoranm":["Fighting"],"nidorino":["Fighting"],"nidoking":["Fighting"],"vulpix":["Normal"],"ninetales":["Normal"],"zubat":["Bug"],"golbat":["Bug"],"venonat":["Psychic"],"venomoth":["Psychic"],"psyduck":["Normal","Psychic"],"golduck":["Normal","Psychic"],"growlithe":["Normal"],"arcanine":["Normal"],"poliwag":["Normal"],"poliwhirl":["Normal"],"ponyta":["Normal"],"rapidash":["Normal"],"slowpoke":["Normal"],"slowbro":["Normal"],"magnemite":["Normal"],"magneton":["Normal"],"seel":["Ice","Normal"],"dewgong":["Normal"],"shellder":["Ice","Normal"],"cloyster":["Normal"],"gastly":["Psychic"],"haunter":["Psychic"],"gengar":["Psychic"],"drowzee":["Normal"],"hypno":["Normal"],"krabby":["Normal"],"kingler":["Normal"],"voltorb":["Normal"],"electrode":["Normal"],"exeggcute":["Normal"],"exeggutor":["Normal"],"hitmonchan":["Electric","Fire","Ice"],"tangela":["Normal"],"goldeen":["Flying","Normal"],"seaking":["Flying","Normal"],"staryu":["Normal"],"starmie":["Normal"],"mrmime":["Normal"],"jynx":["Ghost","Normal"],"electabuzz":["Normal"],"magmar":["Poison"],"magikarp":["Normal"],"lapras":["Normal"],"vaporeon":["Ice","Normal"],"jolteon":["Bug","Fighting","Normal"],"flareon":["Normal","Poison"],"porygon":["Psychic"],"kabuto":["Grass"],"kabutops":["Grass"],"dratini":["Normal"],"dragonair":["Normal"],"mewtwo":["Normal"]};
function subtiposDe(p){
  if(!USE_SUBTYPES) return [];
  return SUBTYPES[p.speciesId] || [];
}
/* Escolhe o tipo de ataque considerando tipos próprios E subtipos.
   O critério é o DANO estimado, não o multiplicador puro: um golpe 2x que usa o atributo
   fraco pode bater menos que um 1x com STAB usando o forte. Foi o que fez o Charmander
   preferir Normal a Fogo contra a Chansey (Especial altíssimo, Defesa baixa).
   Devolve o mesmo formato do bestMultiplier, mais 'stab' dizendo se o tipo é próprio. */
function bestAttackType(attacker, defender){
  const proprios = attacker.types || [];
  const candidatos = proprios.concat(subtiposDe(attacker).filter(t => !proprios.includes(t)));
  let melhor = null;
  for(const t of candidatos){
    let mult = 1;
    (defender.types || []).forEach(d => { mult *= typeVsType(t, d); });
    const especial = isSpecialType(t);
    const proprio = proprios.includes(t);
    const atk = especial ? effectiveSpAtk(attacker) : effectiveAttack(attacker);
    const def = especial ? effectiveSpDef(defender) : effectiveDefense(defender);
    // mesma compressão de tipo do motor (^0.6), pra a escolha refletir o dano que sai de verdade
    const nota = Math.pow(mult, EXPOENTE_TIPO) * (proprio ? 1.5 : SUBTYPE_PENALTY) * (atk / Math.max(1, def));
    if(!melhor || nota > melhor.nota) melhor = { mult, type: t, stab: proprio, nota };
  }
  /* GOLPE TEIMOSO -- quando NADA que o atacante tem machuca o alvo.
     Imunidade vale 0, e isso é o certo enquanto sobra alternativa: o Raichu simplesmente troca o
     Raio pelo golpe Normal contra um pokémon de Terra. Mas quem só tem o tipo imune (Hitmonlee
     Lutador puro contra Fantasma, Dugtrio Terra puro contra Voador) ficava com o piso de 1 de
     dano por golpe -- ou seja, perdia o confronto sem jogada possível, e aqui não dá pra trocar
     de pokémon no meio. Nesses casos o melhor golpe sai com multiplicador reduzido.
     A escolha é refeita aqui porque com tudo zerado todas as notas empatam em 0 e o laço acima
     ficaria com o primeiro candidato, não com o que rende mais. */
  if(melhor && melhor.mult === 0){
    let teimoso = null;
    for(const t of candidatos){
      const especial = isSpecialType(t);
      const proprio = proprios.includes(t);
      const atk = especial ? effectiveSpAtk(attacker) : effectiveAttack(attacker);
      const def = especial ? effectiveSpDef(defender) : effectiveDefense(defender);
      const nota = Math.pow(IMUNIDADE_TEIMOSA, EXPOENTE_TIPO) * (proprio ? 1.5 : SUBTYPE_PENALTY) * (atk / Math.max(1, def));
      if(!teimoso || nota > teimoso.nota){
        teimoso = { mult: IMUNIDADE_TEIMOSA, type: t, stab: proprio, nota, nulo: true };
      }
    }
    if(teimoso) return teimoso;
  }
  return melhor || { mult: 1, type: proprios[0], stab: true, nota: 0 };
}

function bestMultiplier(atkTypes, defTypes){
  let best = 0;
  let bestType = atkTypes[0];
  atkTypes.forEach(a=>{
    let m = 1;
    defTypes.forEach(d=> m *= typeVsType(a,d));
    if(m > best){ best = m; bestType = a; }
  });
  return { mult: best, type: bestType };
}
/* ===== MOTOR DE BATALHA -- fórmula oficial da Gen 1, adaptada pro formato do jogo =====
   Redesenhado do zero: o nível entra pelos ATRIBUTOS (2*base*L/100+5, como no jogo real), não por
   multiplicadores artificiais. Poder do golpe implícito reduzido (60) pra lutas mais longas --
   diferenças pequenas viram probabilidade, não certeza. Multiplicador de tipo comprimido (^0.6):
   no jogo real você TROCA de pokémon; aqui está preso no confronto, então tipo não pode ser sentença
   absoluta (2x vira ~1.5x; ~8 níveis compensam uma desvantagem 2x). Críticos oficiais da Gen 1
   (velocidade/512, nível dobrado). Buffs de shiny/terreno são SÓ OFENSIVOS (nunca defesa/HP) -- fim
   do penhasco "shiny+terreno fica imortal". Teto de dano por golpe (65% do HP máximo; 70% no crítico):
   one-shot não existe, todo pokémon sempre responde pelo menos 1x. Sem vulnerabilidade por vitórias
   (a causa do "estava no amarelo e foi pra zero do nada") -- anti-varredura é só dano persistente +
   golpe moribundo, gradual e previsível. */
const MOVE_POWER = 60;
const DMG_CAP_PCT = 0.65;
const DMG_CAP_PCT_CRIT = 0.70;
function statAtLevel(base, level){ return Math.floor(2*base*level/100) + 5; }
function calcDamage(attacker, defender, rng){
  return calcDamageNew(attacker, defender, rng);
}
/* ===== MOTOR LEGADO -- APOSENTADO no cliente (mantido aqui como referência) =====
   Esta era a fórmula que o jogo usou até a migração pro motor Gen 1. Está comentada, não deletada,
   porque é o plano B se o motor novo se mostrar ruim em produção -- basta descomentar e apontar
   calcDamage de volta pra cá.
   ATENÇÃO: este comentário já afirmou que o servidor ainda rodava esta fórmula. Não roda, e já
   não rodava quando isso foi escrito. Cliente e servidor usam o MESMO motor (o de baixo), e isso
   foi conferido numericamente: 6556 golpes com as mesmas seeds, zero divergências. Se você veio
   aqui atrás de uma diferença cliente/servidor pra corrigir, ela não existe -- não "conserte".
   Os dois problemas que motivaram a aposentadoria estão visíveis abaixo: os buffs de shiny/terreno
   entravam também na DEFESA e no HP (via effective*), e a vulnerabilidade por sequência de vitórias
   (o bloco `wins`) dobrava o dano recebido por quem estava ganhando -- a "morte súbita" que os
   jogadores relatavam.

function calcDamageLegacy(attacker, defender, rng){
  rng = rng || Math.random;
  const best = bestMultiplier(attacker.types, defender.types);
  const mult = best.mult;
  const special = isSpecialType(best.type);
  const STAB = 1.5;
  const atkStat = special ? effectiveSpAtk(attacker) : effectiveAttack(attacker);
  const defStat = special ? effectiveSpDef(defender) : effectiveDefense(defender);   // era effectiveSpecial nos dois lados; o split da Gen 2 aposentou aquela funcao
  const levelWeight = Math.pow(attacker.level/defender.level, (mult > 1 ? -0.4 : 0.5));
  const base = attacker.level*2.5 * ((atkStat*attacker.level) / (defStat*defender.level)) * levelWeight;
  let defense = 1;
  const wins = defender.winsThisBattle||0;
  if(wins > 0){
    // vulnerabilidade por sequência de vitórias na mesma batalha (só existe no motor legado)
    const defHpPct = defender.hp / defender.maxHp;
    const minDefenseFactor = Math.max(0.1, 1 - wins*0.35);
    defense = defense * (minDefenseFactor + (1-minDefenseFactor) * defHpPct);
  }
  const dmg = Math.round((base * mult * STAB / defense) * (0.85 + rng()*0.15));
  return Math.max(1, dmg);
}
===== fim do motor legado aposentado ===== */
// ===== MOTOR EM USO (todos os jogadores) -- fórmula oficial da Gen 1 =====
function calcDamageNew(attacker, defender, rng){
  rng = rng || Math.random;
  // considera tipos próprios E subtipos (ver SUBTYPES). Com USE_SUBTYPES=false isso vira
  // exatamente o bestMultiplier de antes, que continua ali intacto
  const best = bestAttackType(attacker, defender);
  /* Registro pro LOG: qual tipo este golpe usou. É só leitura -- nada daqui volta pra conta.
     O tipo escolhido não depende de HP (só de atributos e tipos, que não mudam durante o
     confronto), então na prática ele é o mesmo do começo ao fim da luta entre esses dois. */
  attacker.lastMoveType = best.type;
  const special = isSpecialType(best.type); // o tipo do golpe decide se é físico ou especial (tabela oficial Gen 1)
  // STAB só quando o tipo escolhido é PRÓPRIO do atacante. Subtipo não só perde o bônus como
  // ainda leva o redutor -- é isso que impede o subtipo de virar poder de graça
  const STAB = best.stab ? 1.5 : SUBTYPE_PENALTY;
  const atkBase = special ? effectiveSpAtk(attacker) : effectiveAttack(attacker); // COM buffs (ofensivo)
  const defBase = special ? effectiveSpDef(defender) : effectiveDefense(defender); // Gen 2: quem defende usa o Sp.Def, nao o mesmo numero do ataque
  const A = statAtLevel(atkBase, attacker.level);
  const D = statAtLevel(defBase, defender.level);
  const isCrit = rng() < (effectiveSpeed(attacker) / 512); // crítico oficial da Gen 1
  attacker.lastCrit = isCrit;   // registro pro log, como o lastMoveType acima
  /* Imunidade: o multiplicador é 0, mas o dano tem piso de 1 -- dano 0 dos dois lados travaria
     o laço da luta pra sempre. O log precisa saber a diferença entre "tirou 1" e "não teve
     efeito", senão o jogador vê um -1 sem explicação. */
  attacker.lastMoveNulo = !!best.nulo;
  const Leff = isCrit ? attacker.level*2 : attacker.level; // crítico dobra o nível na fórmula (regra oficial)
  const core = Math.floor(Math.floor(2*Leff/5 + 2) * MOVE_POWER * A / D / 50) + 2;
  const typeMult = Math.pow(best.mult, EXPOENTE_TIPO);
  const dmgGen1 = Math.round(core * STAB * typeMult * (0.85 + rng()*0.15)); // variação 85-100%, igual ao jogo oficial
  // converte pra FRAÇÃO da vida na escala Gen 1 (onde o balanceamento foi calibrado), aplica o teto
  // por golpe, e projeta essa fração na escala de HP real do jogo -- cada golpe tira exatamente a
  // mesma porcentagem que tiraria na Gen 1 pura, só que exibida nos números grandes de sempre
  let pct = dmgGen1 / gen1MaxHp(defender);
  pct = Math.min(pct, isCrit ? DMG_CAP_PCT_CRIT : DMG_CAP_PCT);
  const defMaxHp = defender.maxHp || calcMaxHp(defender);
  return Math.max(1, Math.round(pct * defMaxHp));
}
function effText(mult){
  if(mult >= 4) return ' Foi EXTREMAMENTE eficaz!! 💥';
  if(mult > 1) return ' Foi super eficaz!';
  if(mult < 1) return ' Não foi muito eficaz...';
  return '';
}

/* Golpe moribundo: quem cai ainda conecta o contra-golpe -- e desde 30/08/2026 ele vale CHEIO.
   Valeu metade por um tempo, e o efeito colateral era ilegível: o jogador via seu pokémon com
   vantagem de tipo tirando 112 em vez de 223 e procurava bug no multiplicador.
   Medido na mudança: 11,2% das batalhas trocam de vencedor, a taxa de vitória geral não se move
   (51,3% → 51,0%), e os confrontos que terminam no desempate sobem de 6,5% pra 14,6% -- mais
   gente cai junto, e o desempate (sobrevivente com 1-10% da vida) passa a decidir mais confronto. */
const DYING_BLOW_FACTOR = 1.0;
/* O 4º parâmetro é o DIÁRIO da luta: um registro por golpe, na ordem em que aconteceram, pro log
   conseguir contar o passo a passo. É só escrita -- nada aqui é lido de volta pelo motor, e passar
   ou não passar o array não muda um ponto de dano.
   Chaves curtas porque isso é gravado no Firestore junto com a batalha:
   q = quem bateu ('p' = o lado do jogador no confronto, 'e' = o outro), d = dano,
   hp = como o alvo ficou, c = foi crítico, m = foi golpe moribundo (o contra-golpe de quem caiu). */
function doExchange(active, enemy, rng, diario){
  rng = rng || Math.random;
  // Os DOIS sempre atacam em toda troca -- a velocidade (Gen 1 real) só decide QUEM conecta primeiro.
  // Se o primeiro golpe nocauteia, o caído ainda responde com o "golpe moribundo" (reduzido, nunca
  // cancelado). Isso impede que um pokémon raspando de HP varra uma fila inteira só por ser mais
  // rápido: cada abate cobra o seu preço, e o dano acumulado alcança o sweeper em 1-2 abates.
  const dmgToEnemy = calcDamage(active, enemy, rng);
  const dmgToActive = calcDamage(enemy, active, rng);
  const spdActive = effectiveSpeed(active);
  const spdEnemy = effectiveSpeed(enemy);
  // empate de velocidade: sorteio -- usa o mesmo rng da batalha, então nas Ligas (seed fixa) é determinístico
  const activeFirst = spdActive > spdEnemy || (spdActive === spdEnemy && rng() < 0.5);
  const first  = activeFirst ? active : enemy;
  const second = activeFirst ? enemy : active;
  const dmgByFirst  = activeFirst ? dmgToEnemy : dmgToActive;
  const dmgBySecond = activeFirst ? dmgToActive : dmgToEnemy;
  const firstHpBefore = first.hp, secondHpBefore = second.hp;
  second.hp = Math.max(0, second.hp - dmgByFirst);
  /* A marca sai da SITUAÇÃO (o segundo caiu e mesmo assim revidou), não de o dano ter sido
     reduzido. Enquanto ela era deduzida do dano, subir o DYING_BLOW_FACTOR pra 1.0 fazia a marca
     sumir junto -- e sem ela o log volta a mostrar pokémon atacando depois de cair, porque é ela
     que manda o revide vir ANTES do golpe que derrubou. */
  const segundoCaiu = second.hp <= 0;
  let counter = dmgBySecond;
  if(segundoCaiu && counter > 0){ // counter sempre > 0 agora (não existe mais imunidade total 0x)
    counter = Math.max(1, Math.round(counter * DYING_BLOW_FACTOR));
  }
  first.hp = Math.max(0, first.hp - counter);
  if(diario){
    /* O dano registrado é o que SAIU DE VERDADE da vida do alvo, não o número que a fórmula
       sorteou: um golpe de 101 num pokémon com 54 de HP tira 54. Gravar o valor cru fazia o log
       não fechar -- somando as linhas dava mais dano do que o pokémon tinha de vida. */
    diario.push({ q: activeFirst?'p':'e', d: secondHpBefore - second.hp, hp: second.hp, c: first.lastCrit?1:0, m:0, z: first.lastMoveNulo?1:0 });
    diario.push({ q: activeFirst?'e':'p', d: firstHpBefore  - first.hp,  hp: first.hp,  c: second.lastCrit?1:0, m: segundoCaiu?1:0, z: second.lastMoveNulo?1:0 });
  }
  // EMPATE NÃO EXISTE: se o golpe moribundo também derrubaria o primeiro, fica de pé quem tinha o
  // MAIOR percentual de HP entrando na troca, com 1%-10% do HP máximo (sorteado). Percentual igual
  // (ex: os dois cheios na primeira troca) favorece quem conectou primeiro.
  // A faixa já foi 1%-3% e depois 1%-10%; hoje é 5%-15%. Em 1%-3%, no nível 50, davam 3 a 10 HP:
  // o sobrevivente saía praticamente morto e caía no confronto seguinte quase de graça. Ele
  // continua saindo machucado de propósito (é um empate que ele venceu no desempate, não uma
  // vitória), mas com chance real de continuar. Medido na subida pra 5%-15%: 0,5% das batalhas
  // mudam de vencedor, e ele vence o confronto seguinte em 0,6% das vezes (era 0,2%).
  if(first.hp <= 0 && second.hp <= 0){
    const pctFirst = firstHpBefore / first.maxHp;
    const pctSecond = secondHpBefore / second.maxHp;
    const survivor = pctSecond > pctFirst ? second : first;
    const survivorHpBefore = (survivor === first) ? firstHpBefore : secondHpBefore;
    const pct = 0.05 + rng()*0.10;
    survivor.hp = Math.max(1, Math.min(survivorHpBefore, Math.round(survivor.maxHp * pct)));
    /* O desempate ressuscita quem sobrou DEPOIS dos dois golpes. Sem corrigir o diário, a última
       linha do log diria 0 de HP e a barra do mesmo cartão mostraria outro número. */
    if(diario){
      const linha = (survivor === second) ? diario[diario.length-2] : diario[diario.length-1];
      const antes = (survivor === second) ? secondHpBefore : firstHpBefore;
      if(linha){ linha.hp = survivor.hp; linha.d = antes - survivor.hp; linha.dz = 1; }
    }
  }
}

function buildResult(team, brockTeam, win, matchups){
  return {
    win,
    matchups,
    playerStatus: team.map(p=>({ name:p.name, speciesId:p.speciesId, level:p.level, fainted: p.hp<=0, buffed: !!p.terrainBuffed, shiny: !!p.shiny })),
    brockStatus: brockTeam.map(p=>({ name:p.name, speciesId:p.speciesId, level:p.level, fainted: p.hp<=0, buffed: !!p.terrainBuffed, shiny: !!p.shiny }))
  };
}

function simulateGymBattle(team, brockTeam, rng, opts){
  rng = rng || Math.random;
  opts = opts || {};
  if(opts.preservePlayerHp){
    /* Elite 4: o HP do time do jogador CARREGA de uma batalha pra outra. O que carrega é a
       FRAÇÃO de vida, não o número cru -- porque o TETO muda entre uma luta e outra: cada membro
       da Elite tem seu terreno, e o buff de terreno entra em todos os atributos, HP inclusive.
       Um Gyarados nível 73 tem teto 490 fora d'água e 504 dentro. Carregando o número cru, ele
       entrava na luta da Lorelei com 490/504 -- machucado sem ter apanhado (foi assim que o bug
       apareceu). E na luta seguinte, sem o terreno de Água, o teto voltava pra 490 com o HP cru
       em 504: mais vida que o máximo.
       Com a fração: cheio continua cheio, metade continua metade, desmaiado continua desmaiado. */
    team.forEach(p=>{
      const tetoAntigo = p.maxHp || 0;
      p.maxHp = calcMaxHp(p);
      const atual = (p.hp != null) ? p.hp : p.maxHp;
      const carregado = (tetoAntigo > 0 && tetoAntigo !== p.maxHp)
        ? Math.round(atual * p.maxHp / tetoAntigo)
        : atual;
      p.hp = Math.max(0, Math.min(carregado, p.maxHp));
    });
  } else {
    team.forEach(p=>{ p.maxHp=calcMaxHp(p); p.hp=p.maxHp; });
  }
  brockTeam.forEach(p=>{ p.maxHp=calcMaxHp(p); p.hp=p.maxHp; });

  const matchups = [];
  let brockIndex = 0;
  // a sequência de vitórias agora é do TREINADOR (de cada lado da batalha), não de um pokémon
  // específico -- trocar de pokémon não zera a sequência, só uma derrota de verdade zera
  let playerStreak = 0, enemyStreak = 0, maxPlayerStreak = 0;
  while(brockIndex < brockTeam.length){
    const enemy = brockTeam[brockIndex];
    let enemyDefeated = false;
    while(!enemyDefeated){
      const alive = team.filter(p=>p.hp>0);
      if(alive.length===0){
        const defeatResult = buildResult(team, brockTeam, false, matchups);
        defeatResult.playerBestStreak = maxPlayerStreak;
        return defeatResult;
      }
      const active = alive[0]; // respeita a ordem do time escolhida pelo jogador
      // reflete a sequência ATUAL do treinador em cada pokémon -- calcDamage usa esse campo pra
      // decidir a vulnerabilidade, sem precisar mudar a assinatura da função
      active.winsThisBattle = playerStreak;
      enemy.winsThisBattle = enemyStreak;
      const playerHpBefore = active.hp;
      const enemyHpBefore = enemy.hp;
      const playerAliveBefore = alive.length;
      const enemyAliveBefore = brockTeam.length - brockIndex;
      const diario = [];
      while(active.hp>0 && enemy.hp>0){ doExchange(active, enemy, rng, diario); }
      const enemyFainted = enemy.hp<=0 || Number.isNaN(enemy.hp); // NaN nunca é <=0 -- sem esse OR, um hp corrompido travaria a batalha pra sempre (ninguém nunca "desmaia")
      const activeFainted = active.hp<=0 || Number.isNaN(active.hp);
      // doExchange garante um único sobrevivente por troca -- empate/morte súbita não existem mais
      const suddenDeath = false, suddenDeathMessage = null;
      const isTrade = enemyFainted && activeFainted; // os dois caíram juntos — ninguém "venceu" esse confronto
      const playerWon = enemyFainted && !activeFainted;
      const playerAliveAfter = activeFainted ? playerAliveBefore - 1 : playerAliveBefore;
      const enemyAliveAfter = enemyFainted ? enemyAliveBefore - 1 : enemyAliveBefore;
      matchups.push({
        player:active.name, playerSpecies:active.speciesId, playerLevel:active.level, playerShiny: !!active.shiny, playerBuffed: !!active.terrainBuffed,
        enemy:enemy.name, enemySpecies:enemy.speciesId, enemyLevel:enemy.level, enemyShiny: !!enemy.shiny, enemyBuffed: !!enemy.terrainBuffed,
        playerTrainerStreak: playerStreak, enemyTrainerStreak: enemyStreak,
        winner: isTrade ? null : (playerWon ? active.name : enemy.name),
        isTrade,
        suddenDeath, suddenDeathMessage,
        playerWon,
        // tipo do golpe de cada lado -- vira nome de golpe no log (ver nomeDoGolpe)
        playerMove: active.lastMoveType || null, enemyMove: enemy.lastMoveType || null,
        golpes: diario,   // passo a passo do confronto, na ordem em que aconteceu
        playerHpBefore, playerHpAfter: active.hp, playerMaxHp: active.maxHp,
        enemyHpBefore, enemyHpAfter: enemy.hp, enemyMaxHp: enemy.maxHp,
        playerAliveBefore, playerAliveAfter, playerTeamSize: team.length,
        enemyAliveBefore, enemyAliveAfter, enemyTeamSize: brockTeam.length
      });
      if(isTrade){
        // os dois caíram na mesma troca (agora possível em qualquer confronto, via golpe moribundo):
        // ninguém venceu, então as duas sequências zeram
        enemyDefeated = true;
        playerStreak = 0; enemyStreak = 0;
      } else if(enemyFainted){
        enemyDefeated = true;
        playerStreak++; enemyStreak = 0;
        maxPlayerStreak = Math.max(maxPlayerStreak, playerStreak);
      } else if(activeFainted){
        enemyStreak++; playerStreak = 0; // o inimigo sobreviveu e vai continuar lutando contra o próximo pokémon do jogador
      }
    }
    brockIndex++;
  }
  // mesmo depois de derrotar todos os inimigos, confirma que o time do jogador não foi zerado
  // no mesmo golpe final (troca de golpes fatais no último confronto não deve virar vitória automática)
  const teamStillAlive = team.some(p=>p.hp>0);
  const result = buildResult(team, brockTeam, teamStillAlive, matchups);
  result.playerBestStreak = maxPlayerStreak;
  return result;
}

function makeSeededRng(seedStr){
  let h = 1779033703 ^ seedStr.length;
  for(let i=0;i<seedStr.length;i++){
    h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function(){
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
}

const LEGENDARY_BIRDS = ['moltres','zapdos','articuno'];
/* TODOS os lendários do jogo, das duas regiões. Existe pra que os oito sejam tratados igual:
   mesma chance (5% na rota onde moram) e o mesmo nível relativo.
   Antes só as três aves de Kanto eram reconhecidas como lendárias, e os cinco de Johto entravam
   como pokémon comum de rota -- o Lugia aparecia no NÍVEL DA ETAPA, ou seja, nível 23. */
const LENDARIOS = [...LEGENDARY_BIRDS, 'raikou', 'entei', 'suicune', 'lugia', 'hooh'];
function ehLendario(id){ return LENDARIOS.includes(id); }
/* O nível de um lendário selvagem: 12 acima do teto da etapa, com teto em 50.
   Os 12 vêm do que as aves de Kanto já faziam na prática (Articuno aparecia no nível 50 numa
   etapa cujo selvagem ia até 38) -- é o "achado raro que vale a etapa inteira" sem virar um
   pokémon que resolve o resto da jornada sozinho. O teto de 50 impede que um lendário do trecho 8
   nasça acima do time. */
function nivelDeLendario(leg){ return Math.min(50, (leg ? leg.maxLevel : 38) + 12); }
const STARTER_EVOLUTIONS = {
  bulbasaur:'ivysaur', charmander:'charmeleon', squirtle:'wartortle',
  chikorita:'bayleef', cyndaquil:'quilava', totodile:'croconaw',
  pichu:'pikachu'
};
function finalEvolutionOf(id){
  let cur = id;
  while(EVOLUTIONS[cur]){ cur = EVOLUTIONS[cur].into; }
  return cur;
}
/* A RAIZ da linha evolutiva -- a chave que identifica "é o mesmo bicho".
   `finalEvolutionOf` não serve pra isso desde que as evoluções se dividiram: Slowbro e Slowking
   têm finais diferentes mas são o MESMO Slowpoke, e Vileplume e Bellossom o mesmo Oddish. A raiz
   junta os dois lados da bifurcação, que é o que interessa pra não repetir espécie no time.
   O mapa é montado uma vez e guardado: são 250 espécies e isso roda a cada oferta selvagem. */
let _raizDaLinha = null;
function raizDaLinha(id){
  if(!_raizDaLinha){
    const pai = {};
    for(const de in EVOLUTIONS){ pai[EVOLUTIONS[de].into] = de; }
    // os destinos da bifurcação não aparecem como `into` no EVOLUTIONS -- entram aqui
    for(const de in EVOLUTION_CHOICES){ EVOLUTION_CHOICES[de].forEach(dest=>{ pai[dest] = de; }); }
    _raizDaLinha = {};
    Object.keys(SPECIES).forEach(sp=>{
      let cur = sp, guarda = 0;
      while(pai[cur] && guarda++ < 10) cur = pai[cur];
      _raizDaLinha[sp] = cur;
    });
  }
  return _raizDaLinha[id] || id;
}
/* As linhas que o time JÁ tem. É o que impede a oferta selvagem de repetir espécie -- e o motivo
   de ser por LINHA e não por espécie: dois Magikarp viram dois Gyarados, e era assim que gente
   chegava na liga com o time duplicado. Um Gyarados no time também bloqueia o Magikarp. */
function linhasDoTime(){
  return new Set((game.team||[]).filter(p=>p && p.speciesId).map(p=>raizDaLinha(p.speciesId)));
}
/* O TIPO DA ROTA PESA NO SORTEIO: quem é do tipo dela entra com o dobro de peso.
   É o que faz a rota fantasma parecer uma rota fantasma. Medido no Desvio por Lavender
   (Fantasma/Terra, 3 do tipo num pool de 9): a oferta trazia 1,00 do tipo e em 23,9% das vezes
   NENHUM; com o peso são 1,42 e 8,8%.
   "Dobro de peso" não é "dobro de chance" -- o sorteio é sem reposição e a oferta tem 3 vagas,
   então o efeito no conjunto é bem menor: na média das 32 rotas a fatia do tipo da rota vai de
   68,8% pra 77,8% da oferta. As rotas que já são quase todas do próprio tipo (Seafoam, Lago da
   Fúria) não mudam nada -- não há do que tirar.
   O PREÇO, medido: quem é de fora do tipo perde chance na rota. O caso extremo é o Porygon, que
   só mora na Usina (Elétrico): 29,9% -> 16,5% por oferta. Ninguém zera -- a menor chance entre as
   156 espécies em rota vai de 13,8% pra 10,1%, e o pior caso segue sendo a Zona de Safári, que é
   grande demais (20 espécies) pra 3 vagas.
   O sorteio com peso é o de Efraimidis-Spirakis: chave = U^(1/peso), maior primeiro. Com peso 1
   pra todo mundo ele É um embaralhamento uniforme -- por isso rota sem tipo declarado continua
   exatamente como era. */
const PESO_DO_TIPO_DA_ROTA = 2;
function embaralhaFavorecendoOTipo(pool, tiposDaRota){
  if(!tiposDaRota || !tiposDaRota.length) return shuffle(pool);
  return pool.map(id=>{
    const tipos = (SPECIES[id] && SPECIES[id].types) || [];
    const peso = tipos.some(x=>tiposDaRota.includes(x)) ? PESO_DO_TIPO_DA_ROTA : 1;
    return { id, chave: Math.pow(Math.random(), 1/peso) };
  }).sort((a,b)=>b.chave-a.chave).map(x=>x.id);
}
function buildOfferFromPool(pool, offerCount, tiposDaRota){
  // sorteia sem deixar duas fases da MESMA linha evolutiva aparecerem JUNTAS na mesma oferta (ex:
  // Gastly e Haunter) -- mas sem remover nenhuma espécie do pool permanentemente. A versão antiga
  // (dedupePoolByHighestEvolution) removia a fase mais fraca do pool inteiro pra sempre sempre que a
  // evolução dela também estivesse na mesma rota -- isso fazia espécies como Magnemite e Voltorb nunca
  // aparecerem na Usina de Força, já que Magneton e Electrode estavam no mesmo pool e "venciam" sempre.
  // Agora cada oferta sorteia livremente entre TODAS as fases, só evitando repetir a mesma linha
  // evolutiva dentro da MESMA oferta -- numa próxima oferta, a fase mais fraca tem a mesma chance
  const shuffled = embaralhaFavorecendoOTipo(pool, tiposDaRota);
  const offer = [];
  /* Começa já com as linhas do time: assim a oferta não repete o que o jogador tem, pelo mesmo
     mecanismo que já impedia duas fases da mesma linha na MESMA oferta.
     Se sobrar pouca coisa (pool curto, time cheio de linhas dali), o laço de reserva lá embaixo
     completa ignorando o time -- ficar sem oferta seria pior que oferecer um repetido. */
  const usedFamilies = linhasDoTime();
  for(const id of shuffled){
    if(offer.length >= offerCount) break;
    const family = raizDaLinha(id);
    if(usedFamilies.has(family)) continue;
    usedFamilies.add(family);
    offer.push(id);
  }
  /* RESERVA: se o filtro do time deixou a oferta curta, completa ignorando o que o time já tem.
     Uma rota de 7 espécies com um time de 6 linhas dali pode não ter 3 sobrando, e uma tela de
     encontro vazia (ou com uma opção só) é pior que oferecer um repetido. Continua sem repetir
     linha DENTRO da própria oferta. */
  if(offer.length < offerCount){
    const naOferta = new Set(offer.map(raizDaLinha));
    for(const id of shuffled){
      if(offer.length >= offerCount) break;
      const family = raizDaLinha(id);
      if(naOferta.has(family)) continue;
      naOferta.add(family);
      offer.push(id);
    }
  }
  return offer;
}
function goToWildEncounter(){
  /* A OFERTA É SORTEADA POR SEMENTE, NÃO PELO ACASO DO MOMENTO.
     Motivo: jogadores saíam do save na tela do encontro e voltavam até sair um shiny. Gravar o
     encontro assim que ele aparece (lá embaixo) resolve o caso normal, mas não o de quem mata o
     app antes da gravação chegar ao servidor -- o Firestore aqui não tem persistência offline,
     então uma escrita em trânsito morre com a aba.
     Com a semente presa ao CONTADOR de encontros do save, perder a gravação não adianta: o save
     volta com o contador antigo e o mesmo contador devolve exatamente a mesma oferta. Sortear de
     novo passa a exigir consumir o encontro -- ou seja, jogar.
     O contador sobe ANTES do sorteio pra que o primeiro encontro do save já tenha semente própria.
     A troca de Math.random é um empréstimo temporário: buildOfferFromPool, rollWildLevel e
     currentShinyChance sorteiam por dentro e não recebem rng por parâmetro. Tudo aqui é síncrono
     até o finally, então nada mais do app cai dentro da janela. */
  game.wildEncounterSeq = (game.wildEncounterSeq || 0) + 1;
  // a rota entra na semente pra que cada rota tenha SEU encontro fixo naquele ponto da jornada --
  // escolher outra rota é uma decisão do jogo, não um jeito de re-sortear a mesma rota
  const semente = [game.currentSaveSlot, game.rivalName||'', game.starterId||'',
                   'selvagem', game.wildEncounterSeq, game.currentRoute||''].join('|');
  const sorteioOriginal = Math.random;
  Math.random = makeSeededRng(semente);
  try{
    montaOfertaSelvagem();
  } finally {
    Math.random = sorteioOriginal;
  }
  game.wildSelected = [];
  game.wildDisguiseAcknowledged = false;
  game.screen = 'wild';
  render();
  /* GRAVA NA HORA, sem esperar o autosave (debounced em 800ms). Não é mais a única defesa -- a
     semente acima é --, mas mantém o contador no servidor o quanto antes. */
  saveCurrentGame();
}
function montaOfertaSelvagem(){
  const leg = LEGS[game.gymIndex];
  const route = routeById(game.currentRoute);
  const pool = (route && route.pool && route.pool.length) ? route.pool : leg.pool;
  let speciesOffer = buildOfferFromPool(pool, leg.offerCount, route && route.types);
  let offer = speciesOffer.map(id=>({ speciesId:id, level: id==='eevee' ? 45 : rollWildLevel(id, leg.minLevel, leg.maxLevel) }));
  // todos os mecanismos de "encontro especial" abaixo (pássaro lendário, pré-evolução de outro inicial,
  // raros da rota) disputam os MESMOS espaços da oferta -- usar uma lista compartilhada de espaços ainda
  // livres garante que um não sobrescreva o resultado do outro por acidente, o que fazia a chance real
  // ficar abaixo do valor configurado sempre que dois mecanismos acertavam na mesma oferta
  const availableSlots = offer.map((_, i) => i);
  function claimRandomSlot(){
    if(availableSlots.length === 0) return -1;
    const pick = Math.floor(Math.random()*availableSlots.length);
    return availableSlots.splice(pick, 1)[0];
  }
  /* SAIU um sorteio extra de 5% que dava uma ave qualquer no trecho 8. Ele é de quando as aves não
     tinham rota própria; hoje têm (Articuno nas Seafoam, Zapdos na Usina, Moltres na Victory Road,
     cada uma a 5%), e o sorteio antigo SOMAVA com o da rota: medido, Zapdos e Moltres apareciam a
     6,6% por encontro no trecho 8, contra os 5% de todos os outros. */
  if(game.gymIndex===4 && Math.random()<0.15){
    // rota 5 (antes do Koga): chance de achar a pré-evolução de outro inicial (nunca o do próprio jogador)
    const ownEvolution = STARTER_EVOLUTIONS[game.starterId];
    const options = Object.values(STARTER_EVOLUTIONS).filter(id=>id!==ownEvolution);
    const pick = options[Math.floor(Math.random()*options.length)];
    const slot = claimRandomSlot();
    if(slot>=0){ offer[slot] = { speciesId: pick, level: rollWildLevel(pick, leg.minLevel, leg.maxLevel) }; }
  }
  // chance extra de achar algo raro específico da rota escolhida (parte do sistema de rotas) -- cada
  // entrada tem sua PRÓPRIA chance independente (uma string simples usa 30% por padrão; um objeto
  // {species, chance} define uma chance customizada). Cada acerto ocupa um espaço ainda livre da oferta
  if(route && route.rare && route.rare.length){
    for(const rareEntry of route.rare){
      if(availableSlots.length === 0) break;
      const isObj = typeof rareEntry === 'object';
      const species = isObj ? rareEntry.species : rareEntry;
      // 10% padrão -- baixado de 30% porque um "raro" com chance própria protegida (reivindica a
      // vaga na marra, sem risco de ser atropelado depois) acabava mais fácil de achar que um comum
      // do pool (que corre risco duplo: precisa ser sorteado E sobreviver a tudo que roda depois).
      // Entradas com chance CUSTOMIZADA (aves lendárias, Dragonite) não são afetadas -- continuam com
      // o valor calibrado à mão que já tinham
      const chance = isObj ? rareEntry.chance : 0.10;
      if(Math.random() < chance){
        const slotPick = Math.floor(Math.random()*availableSlots.length);
        const offerIdx = availableSlots.splice(slotPick, 1)[0];
        const rareLevel = ehLendario(species) ? nivelDeLendario(leg)
                        : (species==='eevee' ? 45 : rollWildLevel(species, leg.minLevel, leg.maxLevel));
        offer[offerIdx] = { speciesId: species, level: rareLevel };
      }
    }
  }
  /* Num lugar só, depois de tudo: o pool, os raros da rota e a pré-evolução de inicial passam
     todos por aqui, então nenhum caminho novo escapa da regra por esquecimento. O disfarçado é
     Ditto por baixo, que não evolui, e os lendários também não -- ninguém precisa de exceção. */
  offer = offer.map(o => ({ ...o, speciesId: especieNoNivel(o.speciesId, o.level) }));
  offer.forEach(o=>{ o.shiny = Math.random() < currentShinyChance(); }); // shiny (1 em 128, ou a chance crescente do bônus, se estiver ativo)
  // registra que esse encontro rodou, PRA VALER na próxima chamada -- é isso que faz a chance subir
  // encontro após encontro enquanto a pessoa não captura nenhum shiny (currentShinyChance lê esse
  // contador). Só conta enquanto o bônus estiver de fato ativo -- fora do bônus, não tem pra que subir
  if(game.shinyBonusExpiresAt && Date.now() < game.shinyBonusExpiresAt && !game.shinyFoundThisSave){
    game.shinyPityCount = (game.shinyPityCount||0) + 1;
  }
  // pegadinha: 3% de chance de um "Mew" ou "Mewtwo" aparecer na oferta -- só nas rotas antes do Blaine
  // e do Giovanni (os dois ginásios finais). É sempre um Ditto disfarçado por baixo (speciesId continua
  // 'ditto', só o que aparece na tela muda). Se checa depois do sorteio de shiny de propósito -- assim
  // um disfarce raro tem a MESMA chance de vir "shiny" que qualquer outra entrada, e o Ditto que o
  // jogador realmente ganha carrega esse shiny
  if((game.gymIndex===6 || game.gymIndex===7) && Math.random() < 0.01 && !offer.some(o=>o.speciesId==='ditto')){
    const disguise = Math.random() < 0.5 ? 'mew' : 'mewtwo';
    const slot = claimRandomSlot();
    if(slot>=0){
      offer[slot] = { speciesId:'ditto', disguise, level: rollWildLevel('ditto', leg.minLevel, leg.maxLevel), shiny: offer[slot].shiny };
    }
  }
  game.wildOffer = offer;
}

function confirmWild(){
  if(game.wildSelected.length>2) return;
  // se escolheu um dos disfarçados e ainda não viu a revelação, mostra ela primeiro -- confirmWild()
  // roda de novo depois que o jogador clicar em "continuar" na tela de revelação, dessa vez seguindo
  // o fluxo normal (a flag evita o loop)
  if(!game.wildDisguiseAcknowledged){
    const disguisedPick = game.wildSelected.map(id=>game.wildOffer.find(o=>o.speciesId===id && o.disguise)).find(Boolean);
    if(disguisedPick){
      game.wildDisguiseReveal = disguisedPick.disguise;
      game.screen = 'wildDisguiseReveal';
      render();
      return;
    }
  }
  // guarda quem apareceu na oferta mas NÃO foi escolhido -- usado depois pra montar o time do rival
  game.wildOffer.forEach(o=>{
    if(!game.wildSelected.includes(o.speciesId)){ game.rivalPool = (game.rivalPool||[]).concat(o.speciesId); }
  });
  game.wildSelected.forEach(id=>{
    const offerEntry = game.wildOffer.find(o=>o.speciesId===id);
    // o nível vem da OFERTA (que já aplicou o nivelDeLendario); o fallback só existe pra oferta
    // gravada antes disso existir
    const level = (offerEntry && offerEntry.level) ? offerEntry.level
                : ehLendario(id) ? nivelDeLendario(LEGS[game.gymIndex])
                : (id==='eevee' ? 45 : LEGS[game.gymIndex].minLevel);
    const mon = createInstance(id, level);
    mon.shiny = !!(offerEntry && offerEntry.shiny);
    if(mon.shiny){
      game.shinyPityCount = 0;
      game.shinyFoundThisSave = true; // a partir daqui a escalada não volta neste save (ver currentShinyChance)
    }
    game.team.push(mon);
    markCaught(id, mon.shiny);
  });
  if(game.team.length > 6){
    game.releaseSelected = [];
    game.screen = 'release';
    render();
  } else {
    proceedAfterTeamLocked();
  }
}
function toggleRelease(id){

function confirmRelease(){

function hasUnresolvedEevee(){
  return game.team.some(p=>p.speciesId==='eevee' && !p.eeveeResolved);
}
function evolucoesPendentes(){
  return game.team.filter(p=>p.pendingEvoChoice && EVOLUTION_CHOICES[p.pendingEvoChoice]);
}
/* Aplica a escolha e segue: pode haver mais de um pokémon esperando na mesma distribuição de
   níveis, e o escolhido pode ainda ter evolução depois (hoje não tem, mas o tryEvolve no fim
   cobre isso sem depender da tabela de hoje). */
function escolherEvolucao(monId, destino){
  const p = game.team.find(x=>x.id===monId);
  if(!p || !p.pendingEvoChoice) return;
  const opcoes = EVOLUTION_CHOICES[p.pendingEvoChoice] || [];
  if(!opcoes.includes(destino)) return;
  const de = SPECIES[p.pendingEvoChoice], para = SPECIES[destino];
  p.pendingEvoChoice = null;
  p.evoChoiceResolved = true;
  p.speciesId = destino;
  p.name = para.name;
  p.types = para.types;
  p.baseHp = para.hp;
  p.attack = para.attack;
  p.defense = para.defense;
  p.spAtk = para.spAtk;
  p.spDef = para.spDef;
  markCaught(destino, !!p.shiny);
  game.evolutions = (game.evolutions||[]).concat([{
    fromName: de.name, toName: para.name, atLevel: p.level,
    toSpeciesId: destino, shiny: !!p.shiny, escolhida: true }]);
  // a escolha destrava o resto da linha, se houver
  game.evolutions = game.evolutions.concat(tryEvolve(p));
  resolverEvolucoes();
}
function resolverEvolucoes(){
  if(evolucoesPendentes().length){ game.screen = 'evoChoice'; render(); return; }
  game.screen = (game.evolutions||[]).length ? 'evolution' : 'teamOrder';
  render();
}
function renderEvoChoice(){
  const p = evolucoesPendentes()[0];
  if(!p) return `<div class="box"><p>Carregando...</p></div>`;

  const restantes = evolucoesPendentes().length - 1;
  return `

    <h2>${spriteHtml(p.pendingEvoChoice,'sprite-sm',p.shiny)} Seu ${escapeHtmlSafe(de.name)} está evoluindo!</h2>
    <p>Essa linha evolutiva se divide em <strong>duas</strong>. A escolha é definitiva.</p>
    ${restantes ? `<p class="hint-text">Mais ${restantes} pokémon ${restantes===1?'espera':'esperam'} escolha depois deste.</p>` : ''}
  </div>
  <div class="box">
    ${EVOLUTION_CHOICES[p.pendingEvoChoice].map(destino=>{
      const sp = SPECIES[destino];
      return `<button class="btn" onclick="escolherEvolucao('${escJs(p.id)}','${escJs(destino)}')">
        <span class="mon-name">${spriteHtml(destino,'sprite-sm',p.shiny)} ${sp.name}${caught.has(destino)?` <span class="pokedex-owned-badge">${pokedexIcon()}</span>`:''}</span>
        <span class="mon-sub">${typesHtml(sp.types)}</span>
      </button>`;
    }).join('')}
  </div>`;
}

  const eevee = game.team.find(p=>p.speciesId==='eevee' && !p.eeveeResolved);
  if(eevee){

    if(choice!=='keep'){

}
function startLevelDistribution(){
  game.pool = (game.gymIndex===0) ? 20 : (game.pendingGymVictoryPool || 10);
  game.poolTotal = game.pool;
  game.alloc = {};
  game.team.forEach(p=> game.alloc[p.id]=0 );
  game.levelsFromRocket = false;
  game.pendingGymVictoryPool = null;
  game.screen = 'levels';
  render();
}
const EEVEE_EVOLUTIONS = ['vaporeon', 'jolteon', 'flareon'];
function cannotEvolveFurther(speciesId){
  // não tem mais pra onde evoluir -- seja porque já chegou na forma final de uma linha evolutiva
  // (ex: Butterfree, Venusaur), seja porque nunca evoluiu (ex: Pinsir, Scyther), ou é uma das
  // evoluções escolhidas do Eevee. O próprio Eevee (ainda não evoluído) fica de fora -- ele ainda
  // pode evoluir através da escolha manual, mesmo não aparecendo na tabela normal de EVOLUTIONS
  if(speciesId === 'eevee') return false;
  if(EEVEE_EVOLUTIONS.includes(speciesId)) return true;
  return !EVOLUTIONS[speciesId];
}
const LEVEL_CAP_MIN_LEVEL = 40; // o limite de +3 níveis por distribuição só passa a valer a partir daqui
function levelDistributionPointsPastCap(p, allocSoFar){
  // quantos dos pontos já alocados nessa distribuição "contam" pro limite de +3 depois do nível 40 --
  // pontos que só levam o pokemon ATÉ o nível 40 são livres (não contam pro limite); só o que passar
  // de 40 conta. Ex: um pokémon no nível 33 pode subir livremente até 40 (7 pontos livres), e só os
  // próximos 3 pontos daí em diante contam pro limite -- parando no máximo em 43.
  // Vale pra QUALQUER pokémon, evoluindo ou não -- inclusive um que vá evoluir ao confirmar (ex:
  // Wartortle virando Blastoise): o limite trava no nível final pós-alocação, não na espécie atual.
  const effective = p.level + allocSoFar;
  return Math.max(0, effective - Math.max(p.level, LEVEL_CAP_MIN_LEVEL));
}
function canAddLevelPoint(p, allocSoFar){
  return levelDistributionPointsPastCap(p, allocSoFar+1) <= 3;
}
function getMaxPerPokemon(){
  return Math.ceil(game.poolTotal / 2);
}
function addPoint(id){
  if(game.pool<=0) return;
  const maxPer = getMaxPerPokemon();
  if((game.alloc[id]||0) >= maxPer) return;
  const p = game.team.find(t=>t.id===id);
  if(p && (p.level + (game.alloc[id]||0)) >= 55) return; // acima do level 55 só sobe desmaiando em batalha
  if(p && !canAddLevelPoint(p, game.alloc[id]||0)) return; // já alocou 3 pontos depois de cruzar o nível 40
  game.alloc[id]=(game.alloc[id]||0)+1;
  game.pool--;
  render();
}
function removePoint(id){
  if((game.alloc[id]||0)>0){ game.alloc[id]--; game.pool++; render(); }
}
function confirmLevels(){
  const maxPer = getMaxPerPokemon();
  const anyCanReceive = game.team.some(p=>{
    const current = p.level + (game.alloc[p.id]||0);
    const allocHere = game.alloc[p.id]||0;
    return current < 55 && allocHere < maxPer && canAddLevelPoint(p, allocHere);
  });
  if(game.pool!==0 && anyCanReceive) return;
  game.team.forEach(p=>{ p.level += (game.alloc[p.id]||0); });
  let evs = [];
  game.team.forEach(p=>{ evs = evs.concat(tryEvolve(p)); });
  game.evolutions = evs;
  // resolverEvolucoes decide a tela: escolha pendente -> 'evoChoice'; senão 'evolution' ou direto
  // pro 'teamOrder'. Antes isso era um if aqui, mas agora a escolha pode acrescentar eventos
  resolverEvolucoes();
}

  game.screen = 'teamOrder';
  render();
}
