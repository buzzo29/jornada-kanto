/* Reordenar o time da subida. Mesmo padrão da tela de ordem da jornada (setas ▲▼), pra a
   interação ser a que o jogador já conhece. A ordem só é gravada ao confirmar -- mexer aqui e
   sair não altera nada no servidor. */
function openTowerOrder(){
  const run = game.tower && game.tower.run;
  if(!run || !run.team) return;
  game.towerOrder = run.team.map((p,i)=>({ ...p, _idx:i }));   // _idx guarda a posição ORIGINAL
  render();
}
function closeTowerOrder(){ game.towerOrder = null; render(); }
function moveTowerOrder(pos, dir){
  const arr = game.towerOrder;
  if(!arr) return;
  const alvo = pos + dir;
  if(alvo < 0 || alvo >= arr.length) return;
  [arr[pos], arr[alvo]] = [arr[alvo], arr[pos]];
  render();
}
async function confirmTowerOrder(){
  const arr = game.towerOrder;
  if(!arr) return;
  game.towerLoading = true; render();
  try{
    const r = await functionsClient.httpsCallable('setTrainerTowerOrder')({ order: arr.map(p=>p._idx) });
    game.tower.run = r.data.run;
    game.towerOrder = null;
  } catch(e){
    console.error('Erro ao salvar a ordem:', e);
    game.towerError = (e && e.message) || 'Não foi possível salvar a ordem.';
  }
  game.towerLoading = false; render();
}
/* Gastar um Doce Raro: escolhe UM pokémon de qualquer save e sobe 1 nível.
   Diferente da seleção de time da torre, aqui vale QUALQUER save -- o doce é da conta, não da
   subida, e limitar a saves com 8 insígnias puniria quem está no meio de uma jornada nova. */
function openCandyPicker(){
  if(!(game.tower && game.tower.rareCandies > 0)) return;
  game.candyPicker = { erro:null };
  render();
}
function closeCandyPicker(){ game.candyPicker = null; render(); }
async function useRareCandyOn(slot, monId){
  game.candyPicker = { usando:true, erro:null };
  render();
  try{
    const r = await functionsClient.httpsCallable('useRareCandy')({ slot:String(slot), monId });
    game.tower.rareCandies = r.data.rareCandies;
    // o save mudou no servidor; recarrega os slots pra a home e a torre mostrarem o nível novo
    await loadSaveSlots();
    /* O doce sobe o nível no save E nas inscrições de liga -- quem repropaga é o servidor, no
       próprio useRareCandy (ver atualizarInscricoesComTime). O que ficava velho era a cópia na
       memória DESTA aba: a tela da Liga lê game.registeredTeam, lido só na abertura da tela. */
    game.registeredTeam = null;
    if(game.currentLeagueTypeId){ checkLeagueRegistrationStatus(game.currentLeagueTypeId); }
    game.candyPicker = r.data.rareCandies > 0 ? { erro:null } : null;
  } catch(e){
    console.error('Erro ao usar o doce:', e);
    game.candyPicker = { erro: (e && e.message) || 'Não foi possível usar o doce agora.' };
  }
  render();
}

  let corpo;

}

function renderTrainerTower(){
  const t = game.tower;
  const run = t && t.run;
  const escolhendo = run && !run.team && !run.cleared;

  if(game.towerLoading && !t){
    return `<div class="eyebrow">🗼 TORRE DOS TREINADORES</div>
      <div class="box"><p class="loading-text">Subindo as escadas...</p></div>
`;
  }
  if(!t){
    return `<div class="eyebrow">🗼 TORRE DOS TREINADORES</div>
      <div class="box"><p class="error-text">${escapeHtmlSafe(game.towerError||'Torre indisponível.')}</p></div>
`;
  }

  // A vitória de andar não tem painel próprio: a batalha inteira já foi mostrada na tela de
  // revelação, e o andar seguinte aparece logo abaixo. Só a DERROTA avisa, porque ela apaga o
  // time e a pessoa precisa entender por que voltou pro começo
  let resultadoHtml = '';
  if(game.towerBattle && !game.towerBattle.win){
    const b = game.towerBattle;
    resultadoHtml = `<div class="box tower-result lose">
      <h2>💀 Derrota no andar ${b.floor}</h2>
      <p>${escapeHtmlSafe(b.npcName)} foi forte demais. A subida acabou — monte um time novo e recomece do primeiro andar.</p>
    </div>`;
  }

  // ---- torre desenhada de cima pra baixo (andar 10 no topo) ----
  const andares = (t.floors||[]).slice().reverse().map(f => {
    // o andar atual fica destacado mesmo antes de montar o time -- é o próximo adversário, e saber
    // quem é ajuda a escolher. Antes eu exigia run.team, e o andar 1 aparecia bloqueado justo na
    // tela em que a pessoa está decidindo o time
    const atual = !run.cleared && f.floor === run.floor;
    /* Duas coisas que antes eram uma só, e por isso brigavam:

       REVELADO -- o time e o nome do andar aparecem. Vale até o andar mais alto alcançado HOJE,
       mesmo depois de uma derrota: quem chegou ao 8 continua vendo os times do 1 ao 8 na tentativa
       seguinte. Quem decide isso é o servidor (towerVisibleFloors, pelo bestFloor), então aqui
       basta olhar se o time veio na resposta.

       VENCIDO (o detalhe verde) -- só os andares derrotados NESTA tentativa. Antes isso também
       saía do bestFloor do dia, e quem perdia no 8 recomeçava vendo os andares 1 a 7 já verdes,
       como se tivesse passado por eles de novo. Agora sai do run.floor: no andar 3, verdes são
       o 1 e o 2.

       O andar revelado que ainda não foi vencido nesta tentativa não é 'bloqueado': fica sem
       classe, com o card normal. Assim o time continua legível -- 'bloqueado' esmaece o cartão,
       e esmaecer justamente o que a pessoa conquistou o direito de ver seria o contrário do ponto. */
    const revelado = !!f.team;
    const vencido = run.cleared || f.floor < (run.floor || 1);
    const cls = vencido ? 'vencido' : (atual ? 'atual' : (revelado ? '' : 'bloqueado'));
    const timeHtml = f.team ? towerTeamRowHtml(f.team) : `<div class="tower-floor-hidden">time desconhecido</div>`;
    return `<div class="tower-floor ${cls}">
      <div class="tower-floor-head">
        <span class="tower-floor-num">${f.floor}</span>
        <span class="tower-floor-name">${revelado||atual ? escapeHtmlSafe(f.name) : '???'}</span>
      </div>
      ${timeHtml}
    </div>`;
  }).join('');

  // ---- painel de ação ----
  let acao = '';
  if(run.cleared){
    const d = t.rareCandies || 0;
    acao = `<div class="box tower-cleared">
      <div class="tower-cleared-icon">🏆</div>
      <h2>Torre vencida hoje!</h2>
      <p>Você derrotou os 10 treinadores. A torre inteira troca depois da meia-noite — volte amanhã pra enfrentar 10 novos.</p>
      ${d > 0 ? `
        <div class="tower-cleared-candy">
          <div class="tower-cleared-candy-top">🍬 <strong>${d} Doce Raro${d===1?'':'s'}</strong></div>
          <p class="hint-text">Cada um sobe 1 nível de um pokémon seu.</p>
          <button class="btn success" onclick="openCandyPicker()">Usar agora</button>
        </div>` : ''}
    </div>`;
  } else if(escolhendo){
    const elegiveis = towerEligiblePokemon();
    const escolhidos = game.towerPick;
    const especiesUsadas = new Set(escolhidos.map(p=>p.speciesId));
    if(!elegiveis.length){
      acao = `<div class="box"><p class="error-text">Você precisa de pelo menos um save com as <strong>8 insígnias</strong> pra entrar na Torre.</p></div>`;
    } else {
      // agrupa por time de origem
      const porTime = {};
      elegiveis.forEach(p => { (porTime[p.teamName] ||= []).push(p); });
      const listas = Object.entries(porTime).map(([nome, mons]) => `
        <div class="tower-pick-group">
          <div class="tower-pick-group-name">${escapeHtmlSafe(nome)}</div>
          <div class="tower-pick-row">${mons.map(p=>{
            const sp = SPECIES[p.speciesId];
            const sel = escolhidos.some(x=>x.slot===p.slot && x.idx===p.idx);
            const bloqueado = !sel && (escolhidos.length>=6 || especiesUsadas.has(p.speciesId));
            return `<button class="tower-pick ${sel?'sel':''} ${bloqueado?'off':''}"
              onclick="towerTogglePick(${p.slot},${p.idx})"
              ${bloqueado?'disabled':''}
              title="${escapeHtmlSafe(sp?sp.name:'?')} Lv.${p.level}${bloqueado&&especiesUsadas.has(p.speciesId)?' -- espécie já escolhida':''}">
              ${sp?spriteHtml(p.speciesId,'sprite-sm',p.shiny):'❔'}
              <span class="tower-pick-lv">${p.shiny?'🌟':''}Lv.${p.level}</span>
              ${sel?`<span class="tower-pick-check">${escolhidos.findIndex(x=>x.slot===p.slot&&x.idx===p.idx)+1}</span>`:''}
            </button>`;
          }).join('')}</div>
        </div>`).join('');
      acao = `<div class="box">
        <h2>Monte seu time</h2>
        <p class="hint-text">6 pokémon de qualquer time com as 8 insígnias. <strong>Sem repetir espécie.</strong> O time escolhido vale a subida inteira — se perder, recomeça do primeiro andar.</p>
        <div class="tower-pick-counter ${escolhidos.length===6?'ok':''}">${escolhidos.length} de 6 escolhidos</div>
        ${listas}
        <button class="btn success" ${escolhidos.length!==6||game.towerLoading?'disabled':''} onclick="startTowerRun()">
          ${game.towerLoading?'Entrando...':'⚔️ Entrar na Torre'}
        </button>
      </div>`;
    }
  } else {
    const f = (t.floors||[])[run.floor-1];
    acao = `<div class="box">
      <h2>Andar ${run.floor} de 10</h2>
      <p>Seu adversário é <strong>${escapeHtmlSafe(f?f.name:'???')}</strong>.</p>
    </div>
    <div class="save-slot-card">
      <div class="save-slot-top">
        <span class="save-slot-name"><span class="team-avg-star-name">Seu time</span></span>
        <span class="save-slot-actions">
          <button class="btn secondary tower-order-btn" onclick="openTowerOrder()">🔀 Ordem</button>
        </span>
      </div>
      ${towerTeamRowHtml(run.team)}
    </div>
    <button class="btn success" ${game.towerLoading?'disabled':''} onclick="fightTowerFloor()">
      ${game.towerLoading?'Lutando...':'⚔️ Enfrentar '+escapeHtmlSafe(f?f.name:'')}
    </button>`;
  }

  const doces = t.rareCandies || 0;
  // quando a torre foi vencida, o doce aparece DENTRO do quadro de vitória -- duas caixas falando
  // da mesma coisa, uma em cima da outra, seria ruído
  const candyHtml = (doces > 0 && !(run && run.cleared)) ? `<div class="box tower-candy">
    <div class="tower-candy-icon">🍬</div>
    <div class="tower-candy-info">
      <strong>${doces} Doce Raro${doces===1?'':'s'}</strong>
      <span class="hint-text">Cada um sobe 1 nível de um pokémon seu.</span>
    </div>
    <button class="btn success tower-candy-btn" onclick="openCandyPicker()">Usar</button>
  </div>` : '';

  return `
  <div class="eyebrow">🗼 TORRE DOS TREINADORES</div>
  ${candyHtml}
  <div class="box tower-intro">
    <p>10 andares, 10 treinadores. Eles trocam <strong>todo dia</strong> depois da meia-noite.</p>
    <p class="hint-text">Vencer um andar cura e revive seu time. Perder devolve você ao primeiro andar.</p>
    <button class="btn secondary" onclick="openTowerRanking()">🏅 Ranking da Torre</button>
  </div>
  ${game.towerError ? `<div class="box"><p class="error-text">${escapeHtmlSafe(game.towerError)}</p></div>` : ''}
  ${resultadoHtml}
  ${acao}
  <div class="tower-shaft">${andares}</div>`;
}

  if(st.loading){

      <p class="error-text">${escapeHtmlSafe(st.error)}</p>`;
  } else {
    const d = st.data || {};
    const t = d.titles || { classic:0, trainers:0, custom:0, total:0 };
    const ace = d.topPokemon;
    const especie = ace && SPECIES[ace.speciesId] ? SPECIES[ace.speciesId] : null;
    const pokedexPct = d.pokedex!=null ? Math.round((d.pokedex/150)*100) : null;
    // um selo curto que resume o treinador -- hierarquia deliberada: campeão de liga vale mais que

    let selo = 'Treinador';
    if(t.total >= 5) selo = '⭐ Lenda das ligas';

    else if(d.gymsLed > 0) selo = '🏟️ Líder de ginásio';

    // 3 números de destaque -- os que um jogador quer saber antes de encarar alguém numa liga
    const hero = `<div class="tp-hero">

      <div class="tp-hero-cell"><div class="tp-hero-value">${d.pokedex!=null?d.pokedex:'--'}</div><div class="tp-hero-label">POKÉDEX</div></div>
      <div class="tp-hero-cell"><div class="tp-hero-value">${d.eliteWins||0}</div><div class="tp-hero-label">ELITE 4</div></div>
    </div>`;

    // o grid é FIXO: toda linha aparece sempre, com 0 quando não há conquista. Antes as linhas zeradas

    // tem 0 títulos de Trainers League ou se essa liga nem existe
    const gymsLed = d.gymsLed || 0;

    const aceHtml = (ace && especie) ? `<div class="tp-ace">

        </div>
      </div>

  }
  // a lista de ginásios substitui o conteúdo do cartão em vez de abrir um segundo modal empilhado --

  if(st.showGyms && st.data){

// estrela da média de nível (ver .team-avg-star no CSS). Fica numa constante porque é markup fixo:
// deixar isso no meio do template do card só polui a leitura do card
const STAR_SVG = `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M 50,12 L 63.5,31.4 L 86.1,38.3 L 71.9,57.1 L 72.3,80.7 L 50,73 L 27.7,80.7 L 28.1,57.1 L 13.9,38.3 L 36.5,31.4 Z" fill="var(--yellow)" stroke="var(--box-border)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke"/></svg>`;
// O card inteiro virou o botão. Esta função reproduz o roteamento que os botões faziam: save
// incompleto (inclusive game over por 5 derrotas) vai pro continueSave; save com as 8 insígnias vai
// pro continueCompleteSave, que sabe distinguir campeão/derrotado/Elite disponível. A decisão fica
// AQUI, num lugar só -- antes ela estava espalhada pelos rótulos dos botões no template
// Rótulo de estado do save, mostrado no rodapé do card. Substitui a informação que os botões de
// "Continuar / Elite 4 / Ver jornada" carregavam antes -- sem eles, dois saves de 8 insígnias (um
// campeão, um derrotado) ficariam visualmente idênticos.
// A ordem dos testes importa: game over por derrotas na jornada vem ANTES da contagem de insígnias,
// porque um save pode ter esgotado as 5 derrotas com qualquer número de insígnias.
function saveStatusLabel(s){
  const badges = s.badgeCount||0;
  if(badges < 8){
    if((s.losses||0) >= 5) return { texto:'Jornada encerrada!', cls:'encerrada' }; // mesmo limite do finishBattle()
    return { texto:'Em busca das 8 insígnias', cls:'andamento' };
  }
  if(s.eliteStatus==='champion') return { texto:'Jornada encerrada com vitória sobre a Elite 4!', cls:'campeao' };
  // 'defeated' com tentativa sobrando = save que ainda pode desafiar (ver a migração no
  // applySavedState): ou é anterior ao contador, ou gastou tudo antes de o limite subir
  const derrotaLegada = s.eliteStatus==='defeated' && (s.eliteAttemptsUsed||0) < ELITE_MAX_ATTEMPTS;
  if(s.eliteStatus==='defeated' && !derrotaLegada) return { texto:'Jornada encerrada!', cls:'encerrada' };
  return { texto:'Desafio da Elite 4', cls:'elite' };
}
/* ============================================================================
   BOSS DE DOMINGO -- cliente
   Raide GLOBAL: um Mew nível 999 só pro jogo inteiro. A barra de vida dele é a MESMA pra todo
   mundo e nunca regenera -- o que um jogador tirou fica tirado. Ninguém derruba sozinho.

   EM AVALIAÇÃO: o botão da home só aparece pra conta com userTest. Isso aqui é só a interface --
   quem fecha a porta de verdade é o `bossRequireTester` no servidor, porque o estado é global e
   uma Cloud Function é chamável direto, sem passar por esta tela.

   A luta inteira é resolvida no SERVIDOR e o cliente só anima o resultado (mesmo desenho da
   Torre). O cliente manda o SLOT, nunca o time: aceitar um time montado na hora seria aceitar
   seis pokémon nível 99 inventados no console, e aqui o estrago não ficaria no save de quem
   trapaceou -- ficaria na barra que todo mundo vê.
   ============================================================================ */
/* A raide é COLETIVA: enquanto você olha a tela, outros treinadores estão batendo. Sem acompanhar,
   a barra e o ranking congelam no que existia quando a tela abriu -- duas contas abertas lado a
   lado mostravam números diferentes, e nem o próprio ataque atualizava o ranking.

   ESCUTA EM TEMPO REAL, não consulta de tempos em tempos. Os dois documentos são de leitura
   liberada nas regras (`globalBoss/{id}`), então o cliente assina os dois e o Firestore avisa
   quando mudam. É mais barato E mais rápido que perguntar de 5 em 5 segundos:

     consultando 5/5s   2 telas abertas por 1h = 2 x 720 x 3 leituras = 4.320
     escutando          2 telas abertas por 1h com 20 ataques = 2 x 20 x 2 = 80 (+4 na abertura)

   e a barra anda no instante em que o outro treinador bate, em vez de até 5s depois.
   O polling continua no código como REDE: se a escuta não subir (regra, rede, navegador antigo),
   `onSnapshot` chama o callback de erro e a tela cai pro laço de 5s -- ficar em silêncio seria
   pior, porque a tela pararia de andar sem nada explicando. */
/* Domingo pelo relógio DO JOGADOR. O servidor não checa o dia: se alguém abrir a tela numa
   segunda pelo console, não quebra nada -- a raide é a mesma, só não estaria anunciada. Fechar
   isso no servidor obrigaria a escolher um fuso pro mundo inteiro, e o jogador que vê "domingo"
   no celular dele não entenderia por que o botão sumiu. */
function ehDomingo(){ return new Date().getDay() === 0; }
const BOSS_POLL_MS = 5000;
let bossPollTimer = null;
let bossEscutas = [];
function ligarEscutaDoBoss(){
  pararEscutaDoBoss();
  if(!db || !game.authUser){ agendarPollDoBoss(); return; }
  const aoMudar = (aplica) => (snap)=>{
    if(game.screen !== 'sundayBoss' || !game.bossState) return;
    const antes = assinaturaDoBoss();
    aplica(snap.exists ? snap.data() : null);
    if(assinaturaDoBoss() === antes) return;
    if(game.bossEscolhendoTime){ atualizarBarraDoBossNoDom(); return; }
    render();
  };
  const aoFalhar = (e) => {
    console.error('Boss: escuta em tempo real falhou, caindo pro polling', e);
    pararEscutaDoBoss();
    agendarPollDoBoss();
  };
  try{
    bossEscutas.push(db.collection('globalBoss').doc('mew').onSnapshot(
      aoMudar(d => { if(d) game.bossState.boss = {
        hp:d.hp, maxHp:d.maxHp, level:d.level, golpes:d.golpes||0,
        batalhas:d.batalhas||0, derrotadoEm:d.derrotadoEm||null }; }), aoFalhar));
    bossEscutas.push(db.collection('globalBoss').doc('mewRank').onSnapshot(
      aoMudar(d => {
        game.bossState.ranking = (d && Array.isArray(d.lista)) ? d.lista : [];
        // a minha contribuição sai de graça do ranking quando eu estou nele -- sem leitura extra
        const eu = game.bossState.ranking.find(x=>x.uid === (game.authUser||{}).uid);
        if(eu) game.bossState.meu = { dano: eu.dano, batalhas: eu.batalhas };
      }), aoFalhar));
  }catch(e){ aoFalhar(e); }
}
function pararEscutaDoBoss(){
  bossEscutas.forEach(fn=>{ try{ fn(); }catch(e){} });   // onSnapshot devolve a função que cancela
  bossEscutas = [];
}
function agendarPollDoBoss(){
  pararPollDoBoss();
  bossPollTimer = setTimeout(async ()=>{
    if(game.screen !== 'sundayBoss'){ pararPollDoBoss(); return; }   // saiu da tela: o laço morre
    await atualizarEstadoDoBoss();
    if(game.screen === 'sundayBoss') agendarPollDoBoss();
  }, BOSS_POLL_MS);
}
function pararPollDoBoss(){
  if(bossPollTimer){ clearTimeout(bossPollTimer); bossPollTimer = null; }
}
function pararAcompanhamentoDoBoss(){ pararEscutaDoBoss(); pararPollDoBoss(); }
async function atualizarEstadoDoBoss(){
  if(!game.bossState) return;
  let d;
  try{
    const r = await functionsClient.httpsCallable('getSundayBoss')({ resumo:true });
    d = r.data;
  }catch(e){ return; }   // falha de rede no laço não vira tarja na tela: a próxima volta resolve
  if(game.screen !== 'sundayBoss') return;
  const antes = assinaturaDoBoss();
  game.bossState.boss = d.boss;
  game.bossState.meu = d.meu;
  game.bossState.ranking = d.ranking;
  if(assinaturaDoBoss() === antes) return;               // nada mudou: não redesenha à toa
  /* Com a lista de times aberta, um render() inteiro pode inserir uma linha no ranking e EMPURRAR
     os cards no instante do toque. Aí só a barra é atualizada no lugar, direto no DOM -- é a mesma
     regra das animações de batalha (ver CLAUDE.md). */
  if(game.bossEscolhendoTime){ atualizarBarraDoBossNoDom(); return; }
  render();
}
function assinaturaDoBoss(){
  const b = game.bossState.boss || {}, r = game.bossState.ranking || [];
  return [b.hp, b.batalhas, r.map(e=>e.uid+':'+e.dano).join(',')].join('|');
}
function atualizarBarraDoBossNoDom(){
  const b = game.bossState.boss || {};
  const fill = document.getElementById('boss-hp-fill');
  const label = document.getElementById('boss-hp-label');
  if(!fill || !label) return;
  const pct = Math.max(0, Math.min(100, (b.hp / b.maxHp) * 100));
  fill.style.transform = `scaleX(${pct/100})`;
  fill.className = 'hp-bar-fill ' + hpBarClass(pct);
  label.textContent = `${Math.max(0,b.hp)}/${b.maxHp} HP`;
}
async function openSundayBoss(){
  game.screen = 'sundayBoss';
  game.bossError = null;
  game.bossEscolhendoTime = false;   // sempre volta pro estado de leitura, não pra escolha

/* ============================================================================
   TORRE DOS TREINADORES -- cliente
   10 andares, um treinador por andar, trocados todo dia. O jogador monta um time de 6
   (sem repetir espécie) vindo de saves com as 8 insígnias e sobe até perder.
   Toda a lógica de verdade mora no servidor (ver index.js): aqui só exibimos e chamamos.
   ============================================================================ */
async function openTrainerTower(){
  game.screen = 'trainerTower';
  game.towerLoading = true;
  game.towerError = null;
  game.towerBattle = null;
  render();
  try{

    game.towerPick = [];
  } catch(e){
    console.error('Erro ao abrir a Torre:', e);

  }
  game.towerLoading = false;
  render();
}
// todos os pokémon elegíveis: de qualquer save com as 8 insígnias, sem repetir espécie na escolha
function towerEligiblePokemon(){
  const out = [];
  for(let slot=0; slot<MAX_SAVE_SLOTS; slot++){
    const s = game.saveSlots[slot];
    if(!s) continue;
    const badges = (typeof s.badgeCount==='number') ? s.badgeCount : ((s.badgesEarned||[]).length);
    if(badges < 8) continue;
    // monId identifica O POKÉMON, não a espécie: é ele que o servidor usa pra achar exatamente
    // este bicho, e não um xará de mesmo nível guardado em outro save
    (s.team||[]).forEach((p, i) => out.push({ slot, idx:i, monId: p.id || null, speciesId:p.speciesId, level:p.level, shiny:!!p.shiny, teamName: s.customName || ('Time '+(slot+1)) }));
  }
  return out;
}
function towerTogglePick(slot, idx){
  const todos = towerEligiblePokemon();
  const alvo = todos.find(p => p.slot===slot && p.idx===idx);
  if(!alvo) return;
  const jaIdx = game.towerPick.findIndex(p => p.slot===slot && p.idx===idx);
  if(jaIdx >= 0){ game.towerPick.splice(jaIdx, 1); render(); return; }
  if(game.towerPick.length >= 6) return;
  // regra do jogo: não pode repetir espécie
  if(game.towerPick.some(p => p.speciesId === alvo.speciesId)) return;
  game.towerPick.push(alvo);
  render();
}
async function startTowerRun(){
  if(game.towerPick.length !== 6) return;
  game.towerLoading = true; game.towerError = null; render();
  try{

      /* Manda a identidade completa, não só espécie+nível: com dois saves tendo o MESMO pokémon
         no MESMO nível, o servidor pegava o primeiro que casasse -- e quem escolheu o shiny
         entrava na torre com o normal. */
      team: game.towerPick.map(p => ({ speciesId:p.speciesId, level:p.level,

/* ============================================================================
   BATALHA ONLINE -- cliente
   ----------------------------------------------------------------------------
   Diferente das outras batalhas do jogo, esta acontece AO VIVO: um confronto por vez,
   com 5 segundos pra escolher quem entra depois de cada desmaio.

   O cliente não decide nada -- ele consulta o servidor a cada segundo e desenha o que
   vier. Isso mantém os dois jogadores vendo o mesmo estado, e quem tiver a internet
   mais lenta não fica com uma batalha diferente da do outro.
   ============================================================================ */
const ONLINE_POLL_MS = 1000;
/* Diferença entre o relógio do servidor e o deste aparelho. Todos os prazos da batalha online
   são carimbos do servidor; comparar com Date.now() local desloca a contagem inteira quando os
   relógios não batem -- e eles quase nunca batem em celular. */
let offsetServidor = 0;
function agoraServidor(){ return Date.now() + offsetServidor; }
function ajustarRelogio(serverNow){
  if(typeof serverNow !== 'number') return;
  // metade do tempo de ida e volta é uma aproximação boa o bastante pra uma contagem de segundos
  offsetServidor = serverNow - Date.now();
}
let onlinePollTimer = null;

function stopOnlinePoll(){ if(onlinePollTimer){ clearTimeout(onlinePollTimer); onlinePollTimer = null; } }

async function carregarHistoricoOnline(){
  try{
    const r = await functionsClient.httpsCallable('getMyBattleHistory')();
    game.onlineHistorico = r.data;
    if(game.screen === 'onlineBattle') render();
  } catch(e){ console.error('Erro ao carregar histórico:', e); }
}
function openOnlineBattle(){
  stopOnlinePoll();            // só a consulta da batalha AO VIVO; a da fila é outra
  game.screen = 'onlineBattle';
  game.onlineBattleId = null;
  game.onlineState = null;
  /* Se já existe uma busca rodando em segundo plano, a tela abre direto em "Procurando oponente"
     e NADA do estado é limpo.
     Antes eu zerava onlineSearching aqui, e o efeito era pior do que mostrar a tela errada: o laço
     da busca checa essa flag, então clicar no botão cancelava silenciosamente a busca que estava
     em andamento -- do lado do servidor a pessoa continuava na fila, mas o jogo parava de olhar. */
  if(game.onlineSearching){ render(); return; }
  carregarHistoricoOnline();   // carrega em paralelo: a tela abre sem esperar
  game.onlineError = null;
  render();
}
/* AVISO SONORO -- sintetizado, sem arquivo de áudio.
   Três notas curtas em onda quadrada: combina com a estética 8-bit e não precisa de download.

   Detalhe que decide se funciona: navegador bloqueia áudio que não nasce de um gesto do usuário.
   Por isso o contexto é criado no CLIQUE em "Buscar oponente" -- ali existe gesto. Quando o
   convite chega, minutos depois e talvez em outra tela, o contexto já está liberado e só tocamos.

   O jogador pode silenciar; a escolha fica no localStorage, não no save, porque é preferência do
   aparelho e não da jornada (o mesmo save aberto no celular e no PC pode querer ajustes diferentes). */
let audioCtx = null;
function somLigado(){
  try{ return localStorage.getItem('jk_som') !== 'off'; } catch(e){ return true; }
}
function alternarSom(){
  try{
    localStorage.setItem('jk_som', somLigado() ? 'off' : 'on');
    if(somLigado()) prepararAudio();
  } catch(e){}
  render();
}
function prepararAudio(){
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){ console.error('Áudio indisponível:', e); }
}
/* O aviso de desafio de amigo pode chegar em qualquer tela, inclusive numa sessão em que a pessoa
   nunca passou pela busca de oponente -- e aí o audioCtx nem existia, então o som não saía.
   Navegador só libera áudio a partir de um gesto, então o primeiro toque em qualquer lugar do
   jogo serve de gesto. Uma vez só: depois disso o contexto fica liberado pelo resto da sessão. */
try{
  document.addEventListener('click', ()=>{ if(somLigado()) prepararAudio(); }, { once:true });
} catch(e){}
function tocarAvisoOponente(){
  if(!somLigado() || !audioCtx) return;
  try{
    // dó, mi, sol subindo -- curto e reconhecível, sem virar alarme irritante
    [[523.25,0],[659.25,0.12],[783.99,0.24]].forEach(([freq, atraso])=>{
      const osc = audioCtx.createOscillator();
      const vol = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      const t0 = audioCtx.currentTime + atraso;
      // envelope: sem ele o som estala no início e no fim
      vol.gain.setValueAtTime(0.0001, t0);
      vol.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02);
      vol.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
      osc.connect(vol); vol.connect(audioCtx.destination);
      osc.start(t0); osc.stop(t0 + 0.24);
    });
  } catch(e){ console.error('Erro ao tocar aviso:', e); }
}

/* A BUSCA É GLOBAL: continua rodando em qualquer tela do jogo.
   O timer não depende do game.screen, então dá pra sair da Batalha Online e ir jogar um save
   normalmente. Quando o oponente aparece, um aviso surge por cima da tela em que você estiver,
   com 15 segundos pra aceitar -- e quem não aceitar sai da busca, deixando o outro voltar pra fila
   em vez de esperar por alguém que não vai voltar. */
let buscaTimer = null;
function pararBuscaGlobal(){ if(buscaTimer){ clearTimeout(buscaTimer); buscaTimer = null; } }

/* Códigos de TODOS os times elegíveis, na mesma ordem em que a tela os mostra.
   Vão pro servidor no momento de entrar na fila (ou no lobby); QUAL deles vai jogar só é
   decidido depois, com os dois treinadores já conectados. Mandar todos aqui é o que permite ao
   servidor ter um padrão quando alguém não escolhe: ele não conhece os saves, só esta lista. */
function codigosElegiveisOnline(){
  return timeElegiveisOnline().map(slot => encodeTeamCode(game.saveSlots[slot].team));
}
async function startOnlineSearch(){
  const codes = codigosElegiveisOnline();
  if(!codes.length) return;
  prepararAudio();   // AQUI existe gesto do usuário: é o único momento em que dá pra liberar o áudio
  game.onlineSearching = true;
  game.onlineError = null;   // limpa aviso de uma busca anterior que expirou
  game.onlineSince = Date.now() - 1000;
  game.onlinePendente = null;
  // o estado "procurando..." é desenhado na própria tela da Batalha Online
  game.screen = 'onlineBattle';
  render();
  try{
    const r = await functionsClient.httpsCallable('joinBattleQueue')({ codes });
    if(r.data.pending){ mostrarConvite(r.data); return; }
    agendarBuscaGlobal();
  } catch(e){
    console.error('Erro ao entrar na fila:', e);
    game.onlineError = (e && e.message) || 'Não foi possível buscar oponente agora.';
    game.onlineSearching = false;
    render();
  }
}
function agendarBuscaGlobal(){
  pararBuscaGlobal();
  buscaTimer = setTimeout(async ()=>{
    if(!game.onlineSearching) return;   // não olha o screen: a busca vale em qualquer tela
    try{
      const r = await functionsClient.httpsCallable('pollBattleQueue')({ since: game.onlineSince });
      if(r.data.matched){ entrarNaBatalha(r.data.battleId); return; }
      if(r.data.pending){ mostrarConvite(r.data); return; }
      // caiu da fila sem batalha (expirou): reentra, senão a busca fica parada pra sempre
      if(!r.data.inQueue){
        const codes = codigosElegiveisOnline();
        if(codes.length) await functionsClient.httpsCallable('joinBattleQueue')({ codes });
      }
    } catch(e){ console.error('Erro na fila:', e); }
    agendarBuscaGlobal();
  }, 2500);
}
async function cancelOnlineSearch(){
  pararBuscaGlobal();
  game.onlineSearching = false;
  game.onlinePendente = null;
  render();
  try{ await functionsClient.httpsCallable('leaveBattleQueue')(); }
  catch(e){ console.error('Erro ao sair da fila:', e); }
}

// ---------- convite: oponente encontrado ----------
function mostrarConvite(dados){
  pararBuscaGlobal();
  tocarAvisoOponente();
  // vibra também: em celular no bolso o som pode estar no silencioso
  try{ if(navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch(e){}
  game.onlinePendente = {
    matchId: dados.matchId, deadline: dados.deadline,
    oponente: dados.oponente, aceitei: !!dados.aceitei,
    desafio: !!dados.desafio,      // veio do lobby: o texto muda
    doLobby: !!dados.doLobby
  };
  render();
  tickConvite();
}
function tickConvite(){
  pararBuscaGlobal();
  buscaTimer = setTimeout(async ()=>{
    const p = game.onlinePendente;
    if(!p) return;
    const restam = Math.max(0, Math.ceil((p.deadline - Date.now())/1000));
    const el = document.querySelector('.convite-timer');
    if(el && el.textContent !== String(restam)) el.textContent = restam;
    if(restam <= 0){
      // não aceitou a tempo: sai da busca. O servidor devolve o oponente pra fila sozinho.
      // O aviso importa: sem ele a tela simplesmente voltava pra seleção de time, e parecia
      // que a busca tinha falhado sozinha
      const nome = p.oponente || 'o oponente';
      game.onlinePendente = null;
      game.onlineSearching = false;
      game.onlineError = p.aceitei
        ? `${nome} não aceitou a tempo. Você saiu da busca — pode procurar de novo.`
        : 'Você não aceitou a tempo e saiu da busca.';
      render();
      return;
    }
    // se eu já aceitei, sigo consultando pra saber quando o outro aceitar
    if(p.aceitei){
      try{
        const r = await functionsClient.httpsCallable('pollBattleQueue')({ since: game.onlineSince });
        if(r.data.matched){ game.onlinePendente = null; entrarNaBatalha(r.data.battleId); return; }
        if(!r.data.pending){ game.onlinePendente = null; game.onlineSearching = false; render(); return; }
      } catch(e){ console.error('Erro ao aguardar aceite:', e); }
    }
    tickConvite();
  }, 900);
}
/* Recusar um desafio do lobby é diferente de cancelar a busca: o jogador continua no lobby,
   e é o servidor que devolve o outro lado (via leaveBattleQueue, que limpa a pendência). */
async function recusarDesafio(){
  game.onlinePendente = null;
  render();
  try{ await functionsClient.httpsCallable('leaveBattleQueue')(); }

}
async function aceitarConvite(){
  const p = game.onlinePendente;

    if(r.data.battleId){ game.onlinePendente = null; entrarNaBatalha(r.data.battleId); return; }
    p.aceitei = true;   // esperando o outro
    render();
  } catch(e){
    console.error('Erro ao aceitar:', e);

    game.onlineSearching = false;
    render();
  }
}

function entrarNaBatalha(battleId){
  stopOnlinePoll();
  game.onlineSearching = false;
  game.onlineBattleId = battleId;
  game.onlineState = null;
  game.onlineAnim = null;
  game.onlineVistos = 0;   // nenhum confronto exibido ainda: o 1º também vai ser animado
  game.screen = 'onlineFight';
  render();
  pollBatalha();
}
/* Assinatura do que está DESENHADO na tela. A consulta roda a cada segundo, mas redesenhar a
   tela inteira nesse ritmo é o que deixava tudo travado: cada render() reconstrói o HTML, o
   navegador joga fora a transição CSS da barra de HP no meio do caminho e a barra "pula". O mesmo
   valia pro cronômetro.
   Agora o render() só acontece quando algo que a tela mostra realmente mudou. */
function assinaturaBatalha(st){
  if(!st) return 'vazio';
  return [st.phase, st.matchups.length, st.eu.atual, st.oponente.atual, st.escolhaIdx, st.escolhi,
          st.escolhiTime, st.timeIdx, st.oponenteEscolheuTime].join('|');
}
async function pollBatalha(){
  if(game.screen !== 'onlineFight' || !game.onlineBattleId) return;
  try{
    const r = await functionsClient.httpsCallable('getOnlineBattle')({ battleId: game.onlineBattleId });
    const antes = game.onlineVistos === undefined ? -1 : game.onlineVistos;
    ajustarRelogio(r.data.serverNow);
    const assinaturaAntiga = assinaturaBatalha(game.onlineState);
    game.onlineState = r.data;
    /* Confronto novo: entra em modo animação. A tela mostra os dois lutadores com o HP ANTERIOR
       e desce as barras; a escolha só aparece quando a animação termina. */
    let animouAgora = false;
    if(r.data.matchups.length > antes){
      game.onlineVistos = r.data.matchups.length;
      if(antes >= 0){ iniciarAnimacaoOnline(r.data.matchups[r.data.matchups.length-1]); animouAgora = true; }
    }
    // durante a animação a tela NÃO é redesenhada: quem manda no DOM é a própria animação
    if(!animouAgora && !game.onlineAnim && assinaturaBatalha(r.data) !== assinaturaAntiga){
      render();
    }
    if(r.data.phase === 'done' && !game.onlineAnim){ stopOnlinePoll(); return; }
  } catch(e){
    console.error('Erro ao consultar a batalha:', e);
    game.onlineError = (e && e.message) || null;
  }
  stopOnlinePoll();
  onlinePollTimer = setTimeout(pollBatalha, ONLINE_POLL_MS);
}
async function escolherPokemonOnline(idx){
  if(!game.onlineBattleId) return;
  /* Marca a escolha na tela ANTES da resposta chegar. A ida e volta leva uns 200ms, e sem isso o
     ✓ só aparecia depois -- nos últimos segundos, dava a impressão de que o clique não pegou e a
     pessoa clicava de novo. */
  if(game.onlineState){ game.onlineState.escolhaIdx = idx; game.onlineState.escolhi = true; render(); }
  try{
    const r = await functionsClient.httpsCallable('pickOnlineBattlePokemon')({ battleId: game.onlineBattleId, index: idx });
    ajustarRelogio(r.data.serverNow);
    game.onlineState = r.data;
    render();
  } catch(e){
    // recusada (o confronto já começou): desfaz a marca em vez de deixar a tela mentindo
    console.error('Erro ao escolher:', e);
    if(game.onlineState){ game.onlineState.escolhaIdx = null; game.onlineState.escolhi = false; render(); }
  }
}
/* Anima a queda de HP do confronto recém-resolvido, no MESMO padrão das outras batalhas.
   A primeira versão interpolava as duas barras ao mesmo tempo, de forma contínua -- e ficava
   visivelmente diferente do resto do jogo, onde a batalha é contada em GOLPES: um lado bate,
   a barra do outro desce num movimento só, depois o outro revida.
   Aqui reaproveito o buildAnimatedHitSequence, que é a função que decide como chegar do "antes"
   ao "depois" em até 3 golpes -- exatamente a mesma que as batalhas normais usam. */
let onlineAnimTimer = null;
let introTickTimer = null;
let cronometroTimer = null;
function agendarTickCronometro(){
  clearTimeout(cronometroTimer);
  cronometroTimer = setTimeout(function tick(){
    const st = game.onlineState;
    if(game.screen!=='onlineFight' || !st || st.phase!=='choosing') return;
    const el = document.querySelector('.online-timer');
    if(el && !game.onlineAnim){
      const teto = st.primeiraEscolha ? 10 : 5;
      const s = Math.min(teto, Math.max(0, Math.ceil((st.deadline - agoraServidor())/1000)));
      if(el.textContent !== String(s)) el.textContent = s;
      const painel = el.closest('.online-choose');
      if(painel) painel.classList.toggle('urgente', s<=2);
    }
    cronometroTimer = setTimeout(tick, 250);
  }, 250);
}
function iniciarAnimacaoOnline(m){
  if(onlineAnimTimer){ clearTimeout(onlineAnimTimer); onlineAnimTimer = null; }
  const st = game.onlineState;
  const souA = st.souA;
  // os matchups vêm na perspectiva do A; se eu sou o B, troco os lados antes de animar
  const meuM = souA ? m : {
    playerHpBefore:m.enemyHpBefore, playerHpAfter:m.enemyHpAfter, playerMaxHp:m.enemyMaxHp,
    enemyHpBefore:m.playerHpBefore, enemyHpAfter:m.playerHpAfter, enemyMaxHp:m.playerMaxHp,
    playerWon: !m.playerWon && !m.isTrade, isTrade: m.isTrade
  };
  const meuNome = (st.eu.time[st.eu.atual] || {}).name || 'seu pokémon';
  const seq = buildAnimatedHitSequence(meuM);
  /* ORÇAMENTO DE TEMPO -- só no online. O servidor reserva BATTLE_ANIM_MS (5,2s) antes de abrir a
     janela de escolha, e desde que a animação passou a mostrar a luta REAL ela pode ser longa:
     medido em 2.888 confrontos, a mediana é 2,1s, mas a cauda chega a 10,7s (0,2% passam de 5,2s).
     Estourando o tempo, o painel de escolha aparece com o cronômetro no fim e a pessoa perde a
     escolha. Quando não cabe, cada golpe anima proporcionalmente mais rápido -- a luta continua
     sendo a mesma, só passa depressa. Na jornada não existe esse limite: lá ninguém está esperando. */
  const previsto = seq.reduce((acc,h)=>{
    const maxHp = h.side==='player' ? meuM.playerMaxHp : meuM.enemyMaxHp;
    return acc + hpBarTransitionMs((h.amount/Math.max(1,maxHp))*100) + 260;
  }, 0);
  game.onlineAnim = {
    m: meuM,
    seq,
    fator: previsto > ORCAMENTO_ANIM_ONLINE_MS ? ORCAMENTO_ANIM_ONLINE_MS/previsto : 1,
    passo: 0,
    meuHp: meuM.playerHpBefore,
    deleHp: meuM.enemyHpBefore,
    // "Vai Gengar!" fica 1 segundo antes de o primeiro golpe sair. Sem essa pausa, o confronto
    // começava no mesmo instante em que o pokémon aparecia -- não dava tempo de ver quem entrou
    anuncio: meuNome
  };
  render();
  setTimeout(()=>{
    if(!game.onlineAnim || game.screen!=='onlineFight') return;
    game.onlineAnim.anuncio = null;
    render();                              // troca o anúncio pelo "Trocando golpes..."
    setTimeout(proximoGolpeOnline, 250);
  }, ANUNCIO_MS);
}
const ANUNCIO_MS = 1000;
const ORCAMENTO_ANIM_ONLINE_MS = 4500;   // cabe nos 5,2s que o servidor reserva, com folga
function proximoGolpeOnline(){
  const a = game.onlineAnim;
  if(!a || game.screen !== 'onlineFight') return;
  if(a.passo >= a.seq.length){
    // acabou a animação: libera a escolha (ou a tela final, se a batalha terminou)
    game.onlineAnim = null;
    render();
    if(game.onlineState && game.onlineState.phase === 'done') stopOnlinePoll();
    return;
  }
  const hit = a.seq[a.passo++];
  // 'player' na sequência é sempre O MEU lado, porque o matchup já foi virado acima
  const meuLevaDano = hit.side === 'player';
  if(meuLevaDano) a.meuHp = Math.max(0, a.meuHp - hit.amount);
  else a.deleHp = Math.max(0, a.deleHp - hit.amount);
  const maxHp = meuLevaDano ? a.m.playerMaxHp : a.m.enemyMaxHp;
  const hpAgora = meuLevaDano ? a.meuHp : a.deleHp;
  // mesma curva de tempo do jogo, encolhida pelo fator quando a luta é longa demais pra janela
  const dur = Math.max(60, Math.round(hpBarTransitionMs((hit.amount / maxHp) * 100) * (a.fator||1)));
  atualizaBarra(meuLevaDano ? 'eu' : 'ele', hpAgora, maxHp, dur);
  onlineAnimTimer = setTimeout(proximoGolpeOnline, dur + Math.round(260 * (a.fator||1)));
}
// atualiza só a barra, direto no DOM e com transição CSS -- igual às outras batalhas.
// Redesenhar a tela a cada golpe faria os sprites piscarem
function atualizaBarra(lado, hp, maxHp, duracaoMs){
  const pct = Math.max(0, Math.min(100, (hp/maxHp)*100));
  const fill = document.getElementById('online-hp-'+lado);
  const label = document.getElementById('online-hplabel-'+lado);
  if(fill){
    if(duracaoMs) fill.style.transitionDuration = duracaoMs + 'ms';
    fill.style.transform = 'scaleX(' + (pct/100) + ')';
    fill.className = 'hp-bar-fill ' + hpBarClass(pct);
  }
  if(label) label.textContent = Math.max(0,hp) + '/' + maxHp + ' HP';
  /* O card do MEU pokémon lá embaixo acompanha a mesma descida. A tela não é redesenhada
     durante a animação (pra não travar), então sem esta atualização o card ficaria congelado
     no valor que veio do servidor -- que já é o pós-confronto, entregando o resultado antes. */
  if(lado === 'eu' && game.onlineState){
    const i = game.onlineState.eu.atual;
    const barra = document.getElementById('online-pickhp-'+i);
    const txt = document.getElementById('online-picklv-'+i);
    if(barra){
      if(duracaoMs) barra.style.transitionDuration = duracaoMs + 'ms';
      barra.style.transform = 'scaleX(' + (pct/100) + ')';
      barra.className = 'hp-bar-fill ' + hpBarClass(pct);
    }
    if(txt) txt.textContent = hp<=0 ? '✖' : (Math.max(0,hp) + '/' + maxHp);
  }
}
function sairDaBatalhaOnline(){
  stopOnlinePoll();

  game.onlineAnim = null;
  game.onlineBattleId = null;

// ---------- telas ----------
function timeElegiveisOnline(){
  return Array.from({length:MAX_SAVE_SLOTS}, (_,i)=>i).filter(slot=>{
    const s = game.saveSlots[slot];
    return s && s.team && (s.badgeCount||0) >= 8;
  });
}
/* Reprise: reaproveita a MESMA tela de revelação das outras batalhas (ver finishTrainerBattle),
   como a Torre já faz. A batalha já aconteceu -- aqui é só tocar o log de novo. */
async function reverPartidaOnline(battleId){
  game.onlineError = null;
  try{
    const r = await functionsClient.httpsCallable('getOnlineBattleReplay')({ battleId });
    const d = r.data;
    const meus = d.souA ? d.matchups : d.matchups.map(virarMatchup);
    game.trainerBattleResult = { matchups: meus, win: d.venci };
    game.trainerBattleOpponentName = d.oponente;
    // o servidor já vira os confrontos pela sua perspectiva (souA), então o lado esquerdo é você
    game.trainerBattlePlayerName = null;
    game.onlineReplayPending = true;
    game.towerBattlePending = false;
    game.onlineBattlePending = false;
    game.trainerRevealIndex = 0;
    game.trainerRevealPhase = 'loading';
    game.trainerHitSequence = [];
    game.trainerHitStep = 0;
    game.trainerMoveShown = false;
    preloadBattleSprites(meus);
    game.screen = 'trainerBattling';
    render();
    setTimeout(advanceTrainerReveal, 700);
  } catch(e){
    console.error('Erro ao rever a partida:', e);
    game.onlineError = (e && e.message) || 'Não foi possível abrir essa partida.';
    render();
  }
}
// vira um confronto pra a perspectiva do jogador B
function virarMatchup(m){
  return Object.assign({}, m, {
    player:m.enemy, playerSpecies:m.enemySpecies, playerLevel:m.enemyLevel,
    playerShiny:m.enemyShiny, playerBuffed:m.enemyBuffed,
    playerHpBefore:m.enemyHpBefore, playerHpAfter:m.enemyHpAfter, playerMaxHp:m.enemyMaxHp,
    playerAliveBefore:m.enemyAliveBefore, playerAliveAfter:m.enemyAliveAfter,
    playerTeamSize:m.enemyTeamSize,
    // os golpes também trocam de lado, senão o log do jogador B mostra o golpe do adversário
    playerMove:m.enemyMove, enemyMove:m.playerMove,
    enemy:m.player, enemySpecies:m.playerSpecies, enemyLevel:m.playerLevel,
    enemyShiny:m.playerShiny, enemyBuffed:m.playerBuffed,
    enemyHpBefore:m.playerHpBefore, enemyHpAfter:m.playerHpAfter, enemyMaxHp:m.playerMaxHp,
    enemyAliveBefore:m.playerAliveBefore, enemyAliveAfter:m.playerAliveAfter,
    enemyTeamSize:m.playerTeamSize,
    // o passo a passo também troca de lado: 'p' e 'e' são relativos a quem está lendo
    golpes: (m.golpes||[]).map(g => Object.assign({}, g, { q: g.q==='p'?'e':'p' })),
    playerWon: m.isTrade ? false : !m.playerWon
  });
}
/* ============================================================================
   LOBBY DE BATALHA -- escolher contra quem lutar
   A presença é mantida por carimbo de tempo: enquanto a tela está aberta, o cliente
   avisa o servidor a cada 4s. Fechou a aba, parou de avisar, some da lista em 20s --
   não existe "sair do lobby" que possa falhar.
   ============================================================================ */
const LOBBY_POLL_MS = 4000;
let lobbyTimer = null;
function pararLobby(){ if(lobbyTimer){ clearTimeout(lobbyTimer); lobbyTimer = null; } }

async function entrarNoLobby(){
  const codes = codigosElegiveisOnline();
  if(!codes.length) return;
  prepararAudio();   // gesto do usuário: libera o som do desafio
  game.lobbyJogadores = null;
  game.lobbyErro = null;
  game.onlineSince = Date.now() - 1000;
  game.screen = 'battleLobby';
  render();
  await pulsarLobby(codes);
  agendarLobby();
}
async function pulsarLobby(codes){
  try{
    const r = await functionsClient.httpsCallable('joinBattleLobby')(
      codes ? { codes, since: game.onlineSince } : { since: game.onlineSince });
    game.lobbyJogadores = r.data.jogadores || [];
    if(r.data.battleId){ pararLobby(); game.onlinePendente = null; entrarNaBatalha(r.data.battleId); return true; }
    if(r.data.convite && !game.onlinePendente){ mostrarConvite(r.data.convite); }
    if(!r.data.convite && game.onlinePendente && game.onlinePendente.doLobby){
      game.onlinePendente = null;   // o convite expirou ou foi recusado do outro lado
    }
    render();
  } catch(e){
    console.error('Erro no lobby:', e);
    game.lobbyErro = (e && e.message) || 'Não foi possível carregar o lobby.';
    render();
  }
  return false;
}
function agendarLobby(){
  pararLobby();
  lobbyTimer = setTimeout(async ()=>{
    if(game.screen !== 'battleLobby') return;
    const acabou = await pulsarLobby(null);   // sem código: só renova a presença
    if(!acabou) agendarLobby();
  }, LOBBY_POLL_MS);
}
async function sairDoLobby(){
  pararLobby();
  game.lobbyJogadores = null;
  try{ await functionsClient.httpsCallable('leaveBattleLobby')(); }
  catch(e){ console.error('Erro ao sair do lobby:', e); }
  openOnlineBattle();
}
async function desafiarJogador(uid, nome){
  game.lobbyErro = null;
  game.lobbyDesafiando = uid;

  try{

  } catch(e){
    console.error('Erro ao desafiar:', e);
    game.lobbyDesafiando = null;
    game.lobbyErro = (e && e.message) || 'Não foi possível desafiar agora.';
    render();
  }
}
function renderBattleLobby(){

         </div>`
      : `<div class="box lobby-lista">${lista.map(j=>{

          /* Card compacto: uma linha por treinador, em vez de uma caixa com três blocos
             empilhados. Com o formato anterior cabiam 3 na tela; agora cabem 8, e o lobby só
             faz sentido se dá pra ver quem está lá sem rolar. */
          // só o botão da direita é clicável; a linha em si não reage
          return `<div class="lobby-linha ${game.lobbyDesafiando===j.uid?'enviando':''}">
            <div class="lobby-linha-info">

                ${(t.seq>0) ? `<span class="lobby-stat">${t.seqVitoria?'🔥':'🧊'}${t.seq}</span>` : ''}
                <span class="lobby-stat media">${faixa(Math.round(j.mediaMin||j.media||0), Math.round(j.mediaMax||j.media||0))}</span>
              </div>

            <button class="lobby-acao" ${game.lobbyDesafiando?'disabled':''} onclick="desafiarJogador('${escJs(j.uid)}','${escJs(j.name)}')">${game.lobbyDesafiando===j.uid ? '⏳' : '⚔️'}</button>
          </div>`;

  <button class="btn secondary" onclick="sairDoLobby()">⬅ Sair do lobby</button>`;

/* ESCOLHA DO TIME -- primeira fase da batalha, com o oponente já do outro lado.
   A lista vem do SERVIDOR (são os códigos que este cliente mandou ao entrar na fila), não dos
   saves locais: assim os índices continuam batendo com os que o servidor guardou, mesmo que o
   jogador tenha ganhado a 8ª insígnia num outro save enquanto esperava na fila. */
async function escolherTimeOnline(idx){
  if(!game.onlineBattleId) return;
  // marca antes da resposta chegar, como na escolha de pokémon: sem isso o ✓ só aparece depois
  // da ida e volta e a pessoa clica de novo achando que o toque não pegou
  if(game.onlineState){ game.onlineState.timeIdx = idx; game.onlineState.escolhiTime = true; render(); }
  try{
    const r = await functionsClient.httpsCallable('pickOnlineBattleTeam')({ battleId: game.onlineBattleId, index: idx });
    ajustarRelogio(r.data.serverNow);
    game.onlineState = r.data;
    render();
  } catch(e){
    console.error('Erro ao escolher o time:', e);
    if(game.onlineState){ game.onlineState.timeIdx = null; game.onlineState.escolhiTime = false; render(); }
  }
}
function renderOnlineTeamPickFase(st){

/* Apresentação: 10 segundos com os cartões dos dois treinadores, depois 3, 2, 1, COMEÇAR!
   O relógio é do SERVIDOR (introUntil), não do cliente -- assim os dois veem a contagem
   sincronizada mesmo que um tenha aberto a tela um segundo depois do outro. */
function renderOnlineIntro(st){
  const faltam = Math.max(0, (st.introUntil||0) - agoraServidor());
  /* O número anda por DOM, não por render(): redesenhar a cada 200ms recriaria os sprites dos
     dois times e travaria a contagem. Nenhum render() acontece durante a apresentação inteira --
     a troca de tela vem do servidor, quando a fase muda pra escolha do inicial. */
  clearTimeout(introTickTimer);
  introTickTimer = setTimeout(function tick(){
    const s2 = game.onlineState;
    if(game.screen!=='onlineFight' || !s2 || s2.phase!=='intro') return;
    const alvo = document.querySelector('.online-intro-espera');
    if(alvo){
      const n = Math.ceil(Math.max(0,(s2.introUntil||0) - agoraServidor())/1000);
      if(alvo.textContent !== String(n)) alvo.textContent = n;
    }
    introTickTimer = setTimeout(tick, 200);
  }, 200);

  /* O bloco de contagem regressiva que existia aqui foi REMOVIDO.
     Quando a contagem virou fase própria no servidor, ele continuou disparando nos últimos 3
     segundos da apresentação -- e mostrava os dois primeiros pokémon em campo antes de a escolha
     do inicial acontecer, entregando quem abriria a batalha. Agora a apresentação é só cartões,
     do começo ao fim. */
  const cartao = (nome, stats, time, souEu) => {
    const fav = stats && stats.favorito ? SPECIES[stats.favorito] : null;
    const total = stats ? (stats.wins||0)+(stats.losses||0) : 0;

    const shinies = time.filter(p=>p.shiny).length;
    return `<div class="box online-trainer-card ${souEu?'meu':''}">
      <div class="online-tc-head">
        <span class="online-tc-nome">${stats && stats.elite ? '🏆 ' : ''}${escapeHtmlSafe(nome)}</span>
        ${souEu ? '<span class="online-tc-tag">VOCÊ</span>' : ''}
      </div>
      <div class="online-stats-row">
        <div class="online-stat win"><div class="online-stat-v">${stats?stats.wins:0}</div><div class="online-stat-l">VITÓRIAS</div></div>
        <div class="online-stat lose"><div class="online-stat-v">${stats?stats.losses:0}</div><div class="online-stat-l">DERROTAS</div></div>
        <div class="online-stat destaque"><div class="online-stat-v">${total?pct+'%':'--'}</div><div class="online-stat-l">APROVEIT.</div></div>
        <div class="online-stat"><div class="online-stat-v">${media}</div><div class="online-stat-l">MÉD. NÍVEL</div></div>
      </div>
      <div class="online-extra">
        ${fav ? `<div class="online-extra-item">
          ${spriteHtml(stats.favorito,'sprite-sm',false)}
          <div><div class="online-extra-l">MAIS USADO</div><div class="online-extra-v">${escapeHtmlSafe(fav.name)}</div></div>
        </div>` : `<div class="online-extra-item"><span class="online-extra-icon">🆕</span>
          <div><div class="online-extra-l">ESTREANTE</div><div class="online-extra-v">1ª batalha</div></div></div>`}
        ${(stats && stats.seq>0) ? `<div class="online-extra-item">
          <span class="online-extra-icon">${stats.seqVitoria?'🔥':'🧊'}</span>
          <div><div class="online-extra-l">SEQUÊNCIA</div><div class="online-extra-v">${stats.seq} ${stats.seqVitoria?(stats.seq===1?'vitória':'vitórias'):(stats.seq===1?'derrota':'derrotas')}</div></div>
        </div>` : ''}
        ${shinies>0 ? `<div class="online-extra-item">
          <span class="online-extra-icon">🌟</span>
          <div><div class="online-extra-l">SHINIES</div><div class="online-extra-v">${shinies} no time</div></div>
        </div>` : ''}
      </div>
      ${towerTeamRowHtml(time)}
    </div>`;
  };
  return `
  <div class="eyebrow">⚔️ BATALHA ONLINE</div>
  <div class="box online-intro-head">
    <h2>Times escolhidos!</h2>
    <div class="online-countdown intro"><span class="online-intro-espera">${Math.ceil(faltam/1000)}</span></div>
    <p class="hint-text">A batalha começa em instantes — dá uma olhada no adversário.</p>
  </div>
  ${cartao(st.eu.nome, st.euStats, st.eu.time, true)}
  <div class="online-versus">VS</div>
  ${cartao(st.oponente.nome, st.oponenteStats, st.oponente.time, false)}`;

/* Contagem regressiva com os iniciais JÁ escolhidos em campo. Fase própria no servidor, então
   os dois veem o mesmo 3-2-1 -- e ele só começa depois que a janela de escolha fechou. */
function renderOnlineCountdown(st){
  const faltam = Math.max(0, (st.countdownUntil||0) - agoraServidor());

  introTickTimer = setTimeout(function tick(){

      const n = Math.ceil(Math.max(0,(s2.countdownUntil||0) - agoraServidor())/1000);
      const txt = n>0 ? String(n) : 'COMEÇAR!';
      if(el.textContent !== txt) el.textContent = txt;
    }
    introTickTimer = setTimeout(tick, 200);
  }, 200);
  const meu = st.eu.time[st.eu.atual], dele = st.oponente.time[st.oponente.atual];

}
function renderOnlineFight(){
  const st = game.onlineState;
  if(st && st.phase === 'teamPick'){ return renderOnlineTeamPickFase(st); }
  if(st && st.phase === 'intro'){ return renderOnlineIntro(st); }
  if(st && st.phase === 'countdown'){ return renderOnlineCountdown(st); }
  if(!st){
    return `<div class="eyebrow">⚔️ BATALHA ONLINE</div>
      <div class="box"><p class="loading-text">Conectando com o oponente...</p></div>`;
  }
  const meu = st.eu.time[typeof st.escolhaIdx === 'number' && st.primeiraEscolha ? st.escolhaIdx : st.eu.atual];
  const dele = st.oponente.time[st.oponente.atual];
  const ultimo = st.matchups.length ? st.matchups[st.matchups.length-1] : null;
  const anim = game.onlineAnim;   // != null enquanto as barras estão descendo
  /* Na escolha do INICIAL os dois lutadores ficam em branco. Mostrar quem está em campo antes de
     a janela fechar entregaria a escolha do adversário -- e a graça é escolher sem saber o que
     vem do outro lado. Depois da contagem, os dois aparecem juntos. */
  const ocultarLutadores = st.primeiraEscolha && st.phase === 'choosing';
  /* Mesma ideia depois de um desmaio: o lado que CAIU some enquanto o dono escolhe o próximo.
     Deixar o pokémon desmaiado em campo com a barra zerada parecia que ele ia voltar pra luta --
     e é justamente a hora em que ninguém sabe o que vem do outro lado.
     Durante a animação NÃO vale: é ali que a barra dele desce até zero, e sumir com o sprite no
     meio da queda tiraria da tela exatamente o golpe que a pessoa está esperando ver. */
  const janelaDeTroca = st.phase === 'choosing' && !anim && !st.primeiraEscolha;
  const meuCaiu  = janelaDeTroca && meu  && meu.hp  <= 0;
  const deleCaiu = janelaDeTroca && dele && dele.hp <= 0;

  /* A tela final só entra DEPOIS da animação do último confronto.
     Antes eu checava 'done' primeiro, e o golpe que decidia a batalha nunca era mostrado: a tela
     pulava direto pro resultado. Agora o bloco de animação vem antes, e a vitória aparece quando
     a barra termina de descer. */
  if(st.phase === 'done' && !anim){
    /* Log no mesmo formato do fim das batalhas de ginásio: quem enfrentou quem, quem venceu, e o
       estado final dos dois times. Antes só dizia "foram 10 confrontos", que não conta nada da
       partida que a pessoa acabou de jogar. */
    const souA = st.souA;
    // os confrontos vêm na perspectiva do A; pra o log, viro os nomes quando eu sou o B
    /* virarMatchup (o mesmo da reprise) em vez de trocar só os nomes: agora o log tem sprite,
       nível e golpe de cada lado, e a virada parcial mostrava o nome do meu pokémon com o
       sprite e o golpe do adversário. */
    const logDaMinhaVista = st.matchups.map(m => souA ? m : virarMatchup(m));
    // mesma fileira das outras batalhas (teamStatusRowHtml): sprite, nível e quem caiu apagado
    const statusTime = (time) => teamStatusRowHtml((time||[]).map(p=>({
      speciesId: p.speciesId, level: p.level, shiny: p.shiny, fainted: p.hp <= 0
    })));
    return `
    <div class="result-banner ${st.venci?'win':'lose'}">${st.venci ? '🏆 VOCÊ VENCEU A BATALHA!' : '💥 VOCÊ PERDEU A BATALHA'}</div>
    <div class="box">
      <h2>${st.venci ? 'Vitória sobre' : 'Derrota para'} ${escapeHtmlSafe(st.oponente.nome)}</h2>
      <button class="btn success" onclick="sairDaBatalhaOnline()">⚔️ Batalhar de novo</button>
    </div>
    <div class="box">
      <h2>Log da batalha</h2>
      <div class="status-list">${renderMatchupLog(logDaMinhaVista)}</div>
    </div>
    <div class="box">
      <h2>Seu time</h2>
      <div class="status-list">${statusTime(st.eu.time)}</div>
    </div>
    <div class="box">
      <h2>Time de ${escapeHtmlSafe(st.oponente.nome)}</h2>
      <div class="status-list">${statusTime(st.oponente.time)}</div>
    </div>`;
  }

  const meuVivo = meu && meu.hp>0;
  /* Qual pokémon entra se o jogador não fizer nada. Espelha a regra do servidor
     (battlePrimeiroVivo): fica quem está em campo, se ainda estiver vivo; senão, o primeiro vivo
     da ordem. Marcar isso na tela mostra o que vai acontecer sozinho, em vez de deixar em branco. */
  const padraoOnline = (meu && meu.hp > 0) ? st.eu.atual : st.eu.time.findIndex(p => p.hp > 0);
  /* Teto no valor da janela: a animação pode terminar antes do tempo reservado no servidor, e sem
     o teto o cronômetro apareceria acima do que a janela realmente dá.
     A escolha do INICIAL tem 10s; as trocas do meio da batalha, 5s. */
  const tetoJanela = st.primeiraEscolha ? 10 : 5;
  const restam = st.deadline ? Math.min(tetoJanela, Math.max(0, Math.ceil((st.deadline - agoraServidor())/1000))) : 0;
  // durante a animação o painel de escolha nem aparece, então o cronômetro só começa depois --
  // e como o servidor reservou o tempo da animação, ele parte dos 5 segundos cheios
  /* O cronômetro anda por DOM, com um laço PRÓPRIO que se reagenda sozinho.
     Antes era um setTimeout único, disparado a cada render() -- funcionava enquanto a tela era
     redesenhada de segundo em segundo. Quando reduzi os redesenhos pra destravar a animação, o
     timer perdeu quem o realimentava: ele atualizava uma vez e ficava parado no 5.
     Agora o laço é independente do render, e só morre quando a fase muda. */
  if(st.phase === 'choosing'){ agendarTickCronometro(); }
  const precisaEscolher = st.phase==='choosing' && !st.escolhi;

  return `
  <div class="eyebrow">⚔️ BATALHA ONLINE</div>
  <div class="box cursor">
    <div class="team-alive-row">
      <span class="team-alive-chip">🎒 ${escapeHtmlSafe(st.eu.nome)}: ${st.eu.time.filter(p=>p.hp>0).length}/${st.eu.time.length}</span>
      <span class="team-alive-chip">🥊 ${escapeHtmlSafe(st.oponente.nome)}: ${st.oponente.time.filter(p=>p.hp>0).length}/${st.oponente.time.length}</span>
    </div>
    <div class="battle-vs">
      ${ocultarLutadores
        ? `${fighterOcultoHtml()}<span class="vs-swords">⚔️</span>${fighterOcultoHtml()}`
        : `${meuCaiu ? fighterOcultoHtml() : fighterOnlineHtml(meu,'eu', anim ? anim.meuHp : undefined)}
           <span class="vs-swords">⚔️</span>
           ${deleCaiu ? fighterOcultoHtml() : fighterOnlineHtml(dele,'ele', anim ? anim.deleHp : undefined)}`}
    </div>
    ${anim
      ? (anim.anuncio ? `<p class="loading-text online-vai-linha">Vai ${escapeHtmlSafe(anim.anuncio)}!</p>` : `<p class="loading-text">⚔️ Trocando golpes...</p>`)
      : (ultimo ? `<p class="online-last">${escapeHtmlSafe(ultimo.player)} × ${escapeHtmlSafe(ultimo.enemy)} — ${ultimo.winner ? escapeHtmlSafe(ultimo.winner)+' venceu' : 'os dois caíram'}</p>` : '')}
  </div>
  ${painelTimesHtml(st, anim, precisaEscolher, restam, padraoOnline)}`;
}

/* Painel dos dois times. Fica na tela do começo ao fim da batalha -- antes ele só aparecia na
   fase de escolha, e sumia durante a animação e no resultado, fazendo a tela "pular".
   O time do adversário aparece sem HP: mostra quem ainda está de pé, sem entregar o quanto
   cada um aguenta, que é informação que ele não deveria dar de graça. */
function fighterOcultoHtml(){
  return `<div class="fighter fighter-oculto">
    <div class="fighter-emoji">❔</div>
    <span class="fighter-oculto-l">aguardando</span>
  </div>`;
}
function painelTimesHtml(st, anim, precisaEscolher, restam, padraoOnline){
  const escolhendo = st.phase === 'choosing' && !anim;
  const cabecalho = (()=>{
    if(anim && anim.anuncio) return `<div class="online-timer">▶</div><h2 class="online-vai">Vai ${escapeHtmlSafe(anim.anuncio)}!</h2><p class="hint-text">&nbsp;</p>`;
    if(anim) return `<div class="online-timer">⚔️</div><h2>Trocando golpes...</h2><p class="hint-text">Aguarde o resultado do confronto.</p>`;
    if(st.phase === 'countdown') return `<h2>Preparar!</h2><p class="hint-text">A batalha começa em instantes.</p>`;
    if(st.phase === 'done') return `<h2>Fim da batalha</h2><p class="hint-text">&nbsp;</p>`;
    if(st.primeiraEscolha){
      return `<div class="online-timer">${restam}</div>` + (precisaEscolher
        ? `<h2>Quem começa?</h2><p class="hint-text">Você tem 10 segundos pra escolher quem abre a batalha. Sem escolha, vai o primeiro do time.</p>`
        : `<h2>Aguardando o oponente...</h2><p class="hint-text">Sua escolha já foi enviada.</p>`);
    }
    const vivos = st.eu.time.filter(p=>p.hp>0);
    if(vivos.length === 1){
      return `<div class="online-timer">${restam}</div><h2>Vai ${escapeHtmlSafe(vivos[0].name)}!</h2><p class="hint-text">É o seu último pokémon.</p>`;
    }
    return `<div class="online-timer">${restam}</div>` + (precisaEscolher
      ? `<h2>Quem entra?</h2><p class="hint-text">Se o tempo acabar, segue o próximo da ordem.</p>`
      : `<h2>Aguardando o oponente...</h2><p class="hint-text">Sua escolha já foi enviada.</p>`);
  })();

  const meus = st.eu.time.map((p,i)=>{
    const hpMostrado = (anim && i === st.eu.atual) ? anim.meuHp : p.hp;
    const morto = hpMostrado<=0;
    const escolhido = escolhendo && (typeof st.escolhaIdx === 'number' ? st.escolhaIdx === i : i === padraoOnline);
    const sp = SPECIES[p.speciesId];
    const pct = Math.max(0, Math.min(100, (hpMostrado/p.maxHp)*100));
    return `<button class="tower-pick online-pick ${morto?'off':''} ${escolhido?'escolhido':''}"
      ${(p.hp<=0 || !precisaEscolher || !!anim)?'disabled':''} onclick="escolherPokemonOnline(${i})"
      title="${escapeHtmlSafe(sp?sp.name:'?')} — ${p.hp}/${p.maxHp} HP">
      ${escolhido?'<span class="online-pick-check">✓</span>':''}
      ${sp?spriteHtml(p.speciesId,'sprite-md',p.shiny):'❔'}
      <span class="online-pick-nome">${escapeHtmlSafe(sp?sp.name:'?')}${p.shiny?' 🌟':''}</span>
      <span class="online-pick-lvl">Lv.${p.level}</span>
      <span class="online-pick-hp"><span class="hp-bar-fill ${hpBarClass(pct)}" id="online-pickhp-${i}" style="transform:scaleX(${pct/100})"></span></span>
      <span class="tower-pick-lv" id="online-picklv-${i}">${morto?'✖ caiu':hpMostrado+'/'+p.maxHp}</span>
    </button>`;
  }).join('');

  // adversário: só sprite e se está vivo. Sem HP e sem barra
  const deles = st.oponente.time.map(p=>{
    const morto = p.hp<=0;
    const sp = SPECIES[p.speciesId];
    return `<div class="tower-pick online-pick sem-clique ${morto?'off':''}" title="${escapeHtmlSafe(sp?sp.name:'?')} — Lv.${p.level}">
      ${sp?spriteHtml(p.speciesId,'sprite-md',p.shiny):'❔'}
      <span class="online-pick-nome">${escapeHtmlSafe(sp?sp.name:'?')}${p.shiny?' 🌟':''}</span>
      <span class="online-pick-lvl">Lv.${p.level}</span>
      <span class="tower-pick-lv">${morto?'✖ caiu':'&nbsp;'}</span>
    </div>`;
  }).join('');

  const urgente = escolhendo && restam<=2 ? 'urgente' : '';
  return `
  <div class="box online-choose ${anim?'esperando':''} ${urgente}">
    ${cabecalho}
    <div class="online-time-l">SEU TIME</div>
    <div class="online-pick-row">${meus}</div>
    <div class="online-time-l">TIME DE ${escapeHtmlSafe((st.oponente.nome||'').toUpperCase())}</div>
    <div class="online-pick-row">${deles}</div>
  </div>`;
}

/* ============================================================================
   LISTA DE AMIGOS
   ----------------------------------------------------------------------------
   Uma tela só, com três blocos: o desafio em aberto (quando existe), os pedidos
   recebidos, e a lista. A busca de treinador fica no rodapé -- adicionar amigo
   é o que menos acontece aqui, e ocupar o topo com ela empurraria a lista pra
   baixo em toda visita.

   Presença: o servidor NÃO tem batimento próprio (ver touchLastSeen). O carimbo
   é atualizado nas chamadas que a pessoa já faz, com folga de 5 minutos, então
   "agora há pouco" aqui significa "visto nos últimos 10 minutos" -- e é por isso
   que a faixa verde começa em 10min e não em 1. Prometer "online agora" com esse
   dado seria mentira metade das vezes.
   ============================================================================ */
const FRIEND_POLL_MS = 3000;
let friendChallengeTimer = null;
let friendCountdownTimer = null;

function pararPollDesafio(){
  if(friendChallengeTimer){ clearTimeout(friendChallengeTimer); friendChallengeTimer = null; }
  if(friendCountdownTimer){ clearTimeout(friendCountdownTimer); friendCountdownTimer = null; }
}

async function openFriends(){
  game.screen = 'friends';
  /* "só me interessa batalha criada DAQUI PRA FRENTE". Sem isso o poll do desafio ia com
     since:0, e o servidor respondia com o ponteiro da ÚLTIMA batalha jogada -- a tela de amigos
     abria e caía sozinha numa partida de ontem. A fila e o lobby já faziam isso; só aqui faltava. */
  game.onlineSince = Date.now();
  game.friendsData = null;
  game.friendsError = null;
  game.friendsBusy = null;
  game.friendsConfirmRemove = null;
  render();
  await carregarAmigos();
  agendarPollDesafio();
}
async function carregarAmigos(){
  try{
    const r = await functionsClient.httpsCallable('getMyFriends')();
    game.friendsData = r.data;
    game.friendChallenge = r.data.challenge || null;
    game.friendRequestCount = (r.data.requests || []).length;
  } catch(e){
    console.error('Erro ao carregar amigos:', e);
    game.friendsError = (e && e.message) || 'Não foi possível carregar sua lista agora.';
    game.friendsData = { friends: [], requests: [] };
  }
  if(game.screen==='friends') render();
}
function sairDosAmigos(){
  pararPollDesafio();
  game.friendsSearchResults = null;
  goToSaveMenu();
}

/* "visto por último" em texto. A granularidade é grossa de propósito: o carimbo do servidor tem
   folga de 5 minutos, então mostrar "há 3 min" seria precisão inventada. */
function vistoPorUltimo(ms){
  if(!ms) return { texto:'nunca visto', classe:'off' };
  const dif = Date.now() - ms;
  if(dif < 10*60000) return { texto:'agora há pouco', classe:'on' };
  if(dif < 60*60000) return { texto:'há ' + Math.round(dif/60000) + ' min', classe:'recente' };
  if(dif < 24*3600000) return { texto:'há ' + Math.round(dif/3600000) + 'h', classe:'' };
  const dias = Math.round(dif/86400000);
  if(dias < 30) return { texto:'há ' + dias + (dias===1?' dia':' dias'), classe:'off' };
  return { texto:formatDateShort(ms), classe:'off' };
}

   PEDIDOS
   -------------------------------------------------------------------------- */
async function enviarPedidoAmizade(alvoUid){
  game.friendsError = null;
  game.friendsBusy = alvoUid;
  render();
  try{
    const r = await functionsClient.httpsCallable('sendFriendRequest')({ targetUid: alvoUid });
    // marca o resultado no card da BUSCA, que é de onde o clique veio -- sem isso o botão volta
    // ao estado inicial e parece que o pedido não foi
    const achado = (game.friendsSearchResults||[]).find(t=>t.uid===alvoUid);
    if(achado){
      if(r.data.aceitoDireto){ achado.jaAmigo = true; }
      else { achado.pedidoEnviado = true; }
    }
    if(r.data.aceitoDireto) await carregarAmigos();   // ele já tinha pedido: viraram amigos agora
  } catch(e){
    console.error('Erro ao pedir amizade:', e);
    game.friendsError = (e && e.message) || 'Não foi possível enviar o pedido.';
  }
  game.friendsBusy = null;
  render();
}
async function responderPedidoAmizade(deUid, aceitar){
  game.friendsError = null;
  game.friendsBusy = deUid;
  render();
  try{
    await functionsClient.httpsCallable('respondFriendRequest')({ fromUid: deUid, accept: !!aceitar });
    await carregarAmigos();
  } catch(e){
    console.error('Erro ao responder pedido:', e);
    game.friendsError = (e && e.message) || 'Não foi possível responder agora.';
  }
  game.friendsBusy = null;
  render();
}
function pedirRemocaoAmigo(uid){ game.friendsConfirmRemove = uid; render(); }
function cancelarRemocaoAmigo(){ game.friendsConfirmRemove = null; render(); }
async function removerAmigo(uid){
  game.friendsBusy = uid;
  game.friendsConfirmRemove = null;
  render();
  try{
    await functionsClient.httpsCallable('removeFriend')({ targetUid: uid });
    await carregarAmigos();
  } catch(e){
    console.error('Erro ao remover amigo:', e);

}

/* --------------------------------------------------------------------------
   BUSCA
   O texto digitado NÃO passa por render() a cada tecla: recriar o HTML embaixo

function anotarBuscaAmigo(valor){ game.friendsSearchQuery = valor; }

   COMPARAR CONQUISTAS

async function abrirComparacao(uid, nome){

  }
