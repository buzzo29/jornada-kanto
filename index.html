function fecharComparacao(){ game.friendCompare = null; render(); }

/* --------------------------------------------------------------------------
   DESAFIO DIRETO
   Assíncrono, ao contrário do desafio do lobby: são 3 minutos, porque o amigo
   pode estar em qualquer tela (ou com o jogo fechado). Enquanto o desafio está
   de pé, esta tela consulta o servidor a cada 3s -- e é essa consulta que serve
   de sinal de vida pro outro lado (ver FRIEND_CHALLENGE_ALIVE_MS no servidor).
   Fechar a tela mata o desafio na prática: sem sinal, o aceite é recusado com
   "fulano saiu da tela" em vez de criar uma batalha contra ninguém.
   -------------------------------------------------------------------------- */
function agendarPollDesafio(){
  /* Para só o POLL, nunca o cronômetro. Antes chamava pararPollDesafio(), que mata os dois --
     e como esta função se reagenda a cada 3s, o cronômetro do desafio morria na primeira volta
     e ficava congelado no valor em que estava. Só voltava a andar se algo redesenhasse a tela. */
  if(friendChallengeTimer){ clearTimeout(friendChallengeTimer); friendChallengeTimer = null; }
  if(game.screen !== 'friends') return;
  friendChallengeTimer = setTimeout(async ()=>{
    if(game.screen !== 'friends') return;
    try{
      const r = await functionsClient.httpsCallable('pollFriendChallenge')({ since: game.onlineSince || Date.now() });
      if(r.data.battleId){ pararPollDesafio(); game.friendChallenge = null; entrarNaBatalha(r.data.battleId); return; }
      const antes = game.friendChallenge && game.friendChallenge.id;
      game.friendChallenge = r.data.challenge || null;
      const agora = game.friendChallenge && game.friendChallenge.id;
      /* Redesenha quando o desafio MUDA de identidade -- apareceu, sumiu ou é outro.
         Antes só redesenhava quando sumia, então um desafio que chegava com a tela já aberta
         não aparecia até alguma outra coisa redesenhar a tela. */
      if(antes !== agora) render();
    } catch(e){ console.error('Erro no poll do desafio:', e); }
    agendarPollDesafio();
  }, FRIEND_POLL_MS);
}
async function desafiarAmigo(uid, nome){
  const codes = codigosElegiveisOnline();
  if(!codes.length){
    game.friendsError = 'Você ainda não tem nenhum time com as 8 insígnias.';
    render(); return;
  }
  prepararAudio();   // gesto do usuário: é aqui que dá pra liberar o som do convite
  game.friendsError = null;
  game.friendsBusy = uid;
  game.onlineSince = Date.now() - 1000;
  render();
  try{
    const r = await functionsClient.httpsCallable('challengeFriend')({ targetUid: uid, codes });
    game.friendChallenge = r.data.challenge;
  } catch(e){
    console.error('Erro ao desafiar amigo:', e);
    game.friendsError = (e && e.message) || 'Não foi possível desafiar agora.';
  }
  game.friendsBusy = null;
  render();
  agendarPollDesafio();
}
async function cancelarDesafioAmigo(){
  try{ await functionsClient.httpsCallable('cancelFriendChallenge')(); }
  catch(e){ console.error('Erro ao cancelar desafio:', e); }
  game.friendChallenge = null;
  render();
}
async function responderDesafioAmigo(challengeId, aceitar){
  game.friendsError = null;
  game.friendsBusy = 'desafio';
  if(aceitar) prepararAudio();
  game.onlineSince = Date.now() - 1000;
  render();
  try{
    const payload = { challengeId, accept: !!aceitar };
    if(aceitar) payload.codes = codigosElegiveisOnline();
    const r = await functionsClient.httpsCallable('respondFriendChallenge')(payload);
    game.friendsBusy = null;
    game.friendChallenge = null;
    if(r.data.battleId){ pararPollDesafio(); entrarNaBatalha(r.data.battleId); return; }
  } catch(e){
    console.error('Erro ao responder desafio:', e);
    game.friendsError = (e && e.message) || 'Não foi possível responder agora.';
    game.friendsBusy = null;
    game.friendChallenge = null;   // qualquer erro aqui encerrou o desafio no servidor
  }
  render();
}
/* Aceitar um desafio a partir da NOTIFICAÇÃO -- o caminho mais provável, já que é lá que ele chega.
   Passa pela tela de amigos em vez de responder direto: o cronômetro e o "quem é esse treinador"
   estão lá, e aceitar às cegas um desafio de 3 minutos atrás não é o que a pessoa quer. */
function irParaDesafioAmigo(){ openFriends(); }

/* --------------------------------------------------------------------------
   AVISO DE DESAFIO EM QUALQUER TELA
   O desafio dura 3 minutos e chega quando o amigo clica -- quem foi desafiado pode estar em
   qualquer canto do jogo. Esta consulta roda solta, FORA da tela de amigos, e quando acha um
   desafio novo levanta o mesmo tipo de aviso do pareamento online: modal por cima da tela, som
   e vibração. Aceitar é na tela de amigos, que é onde estão o cronômetro e o "quem é esse".

   Duas decisões que não dá pra deduzir do código:
   - vai com `passivo:true`: consultar não pode manter vivo o desafio de quem desafiou e SAIU da
     tela -- o desafio morrer quando o desafiante fecha a tela é a regra que impede batalha
     contra aba fechada;
   - o intervalo é 10s, e não os 3s da tela de amigos. Aqui isso roda o tempo todo, pra todo
     jogador com o jogo aberto: 3s custaria 4x mais leitura o dia inteiro pra ganhar 7 segundos
     num prazo de 3 minutos.
   -------------------------------------------------------------------------- */
const DESAFIO_AVISO_MS = 10000;
let desafioAvisoTimer = null;
let desafioAvisoVisto = null;   // id do último desafio já avisado -- não avisa o mesmo duas vezes
function pararAvisoDesafio(){ if(desafioAvisoTimer){ clearTimeout(desafioAvisoTimer); desafioAvisoTimer = null; } }
function agendarAvisoDesafio(){
  pararAvisoDesafio();
  desafioAvisoTimer = setTimeout(async ()=>{
    const pular = !game.authUser || game.desafioAviso ||
                  game.screen === 'friends' ||      // lá o poll é mais rápido e cuida disso
                  game.screen === 'onlineFight';    // no meio de uma batalha, não
    if(pular){ agendarAvisoDesafio(); return; }
    try{
      const r = await functionsClient.httpsCallable('pollFriendChallenge')({ since: Date.now(), passivo: true });
      const c = r.data.challenge;
      if(c && c.sou === 'desafiado' && c.id !== desafioAvisoVisto){
        desafioAvisoVisto = c.id;
        game.desafioAviso = c;
        tocarAvisoOponente();
        // vibra também: em celular no bolso o som pode estar no silencioso
        try{ if(navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch(e){}
        render();
      }
    } catch(e){ console.error('Erro no aviso de desafio:', e); }
    agendarAvisoDesafio();
  }, DESAFIO_AVISO_MS);
}
function verDesafioDoAviso(){ game.desafioAviso = null; openFriends(); }
async function recusarDesafioDoAviso(){
  const c = game.desafioAviso;
  game.desafioAviso = null;
  render();
  if(!c) return;
  try{ await functionsClient.httpsCallable('respondFriendChallenge')({ challengeId: c.id, accept:false }); }
  catch(e){ console.error('Erro ao recusar desafio:', e); }
}
function renderAvisoDesafioModal(){
  const c = game.desafioAviso;
  if(!c) return '';
  const restam = Math.max(0, Math.ceil((c.expiresAt - Date.now())/1000));
  const relogio = Math.floor(restam/60) + ':' + String(restam%60).padStart(2,'0');
  /* cronômetro por DOM, com laço próprio: o modal fica por cima de telas que quase não
     redesenham (a jornada, a pokédex), então depender de render() deixaria ele parado */
  clearTimeout(avisoDesafioTick);
  avisoDesafioTick = setTimeout(function tick(){
    const cc = game.desafioAviso;
    if(!cc) return;
    const el = document.querySelector('.aviso-desafio-timer');
    const s = Math.max(0, Math.ceil((cc.expiresAt - Date.now())/1000));
    if(el){
      const txt = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
      if(el.textContent !== txt) el.textContent = txt;
    }
    if(s <= 0){ game.desafioAviso = null; render(); return; }   // venceu sozinho
    avisoDesafioTick = setTimeout(tick, 500);
  }, 500);
  return `
  <div class="modal-overlay convite-overlay">
    <div class="modal-box convite-box">
      <div class="modal-icon">⚔️</div>
      <h2>Você foi desafiado!</h2>
      <p><strong>${escapeHtmlSafe(c.oponente||'Um amigo')}</strong> quer batalhar com você.</p>
      <div class="convite-timer aviso-desafio-timer">${relogio}</div>
      <p class="hint-text">Aceite na tela de amigos. O time você escolhe depois, com os dois já conectados.</p>
      <button class="btn success" onclick="verDesafioDoAviso()">⚔️ Ver desafio</button>
      <button class="btn secondary" onclick="recusarDesafioDoAviso()">Agora não</button>
      <button class="convite-som" onclick="alternarSom()" title="${somLigado()?'Silenciar aviso':'Ativar aviso sonoro'}">${somLigado()?'🔊 Som ligado':'🔇 Som desligado'}</button>
    </div>
  </div>`;
}
let avisoDesafioTick = null;

/* Cronômetro do desafio por DOM, não por render(): um render por segundo recriaria a lista de
   amigos inteira debaixo do dedo de quem vai clicar em "aceitar". Mesma decisão da contagem da
   batalha online. */
function tickDesafioAmigo(){
  if(friendCountdownTimer) clearTimeout(friendCountdownTimer);
  friendCountdownTimer = setTimeout(function tick(){
    if(game.screen!=='friends' || !game.friendChallenge) return;
    const el = document.querySelector('.friend-challenge-timer');
    if(el){
      const restam = Math.max(0, Math.ceil((game.friendChallenge.expiresAt - Date.now())/1000));
      const txt = Math.floor(restam/60) + ':' + String(restam%60).padStart(2,'0');
      if(el.textContent !== txt) el.textContent = txt;
      if(restam <= 0){ game.friendChallenge = null; render(); return; }
    }
    friendCountdownTimer = setTimeout(tick, 500);
  }, 500);
}

/* --------------------------------------------------------------------------
   TELA
   -------------------------------------------------------------------------- */
function friendRivalryHtml(r){
  if(!r || !r.total) return `<span class="fr-h2h vazio">sem confrontos</span>`;
  const classe = r.wins > r.losses ? 'ganhando' : (r.wins < r.losses ? 'perdendo' : '');
  return `<span class="fr-h2h ${classe}" title="Retrospecto em batalhas online">${r.wins} <b>×</b> ${r.losses}</span>`;
}
function renderFriendsScreen(){
  const d = game.friendsData;
  let out = `<div class="result-banner win">👥 Amigos</div>`;
  if(game.friendsError){ out += `<div class="box"><p class="error-text">⚠️ ${escapeHtmlSafe(game.friendsError)}</p></div>`; }

  // 1) desafio em aberto -- sempre no topo, é o único bloco com prazo correndo
  const c = game.friendChallenge;
  if(c){
    const restam = Math.max(0, Math.ceil((c.expiresAt - Date.now())/1000));
    const relogio = Math.floor(restam/60) + ':' + String(restam%60).padStart(2,'0');
    out += c.sou === 'desafiante'
      ? `<div class="box friend-challenge esperando">
           <div class="fr-challenge-top">⚔️ Desafio enviado <span class="friend-challenge-timer">${relogio}</span></div>
           <p>Esperando <strong>${escapeHtmlSafe(c.oponente)}</strong> responder.</p>
           <p class="hint-text">Fique nesta tela: se você sair, o desafio cai. Assim que ele aceitar, a batalha começa aqui mesmo.</p>
           <button class="btn danger" onclick="cancelarDesafioAmigo()">✖ Cancelar desafio</button>
         </div>`
      : `<div class="box friend-challenge recebido">
           <div class="fr-challenge-top">⚔️ ${escapeHtmlSafe(c.oponente)} te desafiou <span class="friend-challenge-timer">${relogio}</span></div>
           <p class="hint-text">O time você escolhe depois, com os dois já conectados.</p>
           <div class="fr-challenge-acoes">
             <button class="btn success" ${game.friendsBusy?'disabled':''} onclick="responderDesafioAmigo('${escJs(c.id)}',true)">⚔️ Aceitar</button>
             <button class="btn secondary" ${game.friendsBusy?'disabled':''} onclick="responderDesafioAmigo('${escJs(c.id)}',false)">Agora não</button>
           </div>
         </div>`;
    tickDesafioAmigo();
  }

  if(!d){ return out + `<div class="box"><p class="loading-text">Carregando sua lista...</p></div>
    <button class="btn secondary" onclick="sairDosAmigos()">⬅ Voltar</button>`; }

  // 2) pedidos recebidos
  const pedidos = d.requests || [];
  if(pedidos.length){
    out += `<div class="box">
      <h2>Pedidos de amizade <span class="lobby-contador">${pedidos.length}</span></h2>
      ${pedidos.map(p=>`<div class="friend-row pedido">
        <div class="friend-row-info">
          <div class="friend-nome">${escapeHtmlSafe(p.name)}</div>
          <div class="friend-sub">${formatDateShort(p.createdAt)}</div>
        </div>
        <div class="friend-acoes">
          <button class="friend-btn aceitar" ${game.friendsBusy?'disabled':''} onclick="responderPedidoAmizade('${escJs(p.uid)}',true)" aria-label="Aceitar">✔</button>
          <button class="friend-btn recusar" ${game.friendsBusy?'disabled':''} onclick="responderPedidoAmizade('${escJs(p.uid)}',false)" aria-label="Recusar">✕</button>
        </div>
      </div>`).join('')}
    </div>`;
  }

  // 3) a lista
  const amigos = d.friends || [];
  const desafioAberto = !!c;
  out += `<div class="box">
    <h2>Sua lista ${amigos.length ? `<span class="lobby-contador">${amigos.length}/${d.max||50}</span>` : ''}</h2>`;
  if(!amigos.length){
    out += `<div class="lobby-vazio">
      <div class="lobby-vazio-icon">👋</div>
      <p>Sua lista está vazia.</p>
      <p class="hint-text">Busque um treinador pelo nome aqui embaixo e mande um pedido. Quando ele aceitar, vocês podem se desafiar direto, sem depender do lobby.</p>
    </div>`;
  } else {
    out += `<div class="friend-lista">${amigos.map(a=>{
      const visto = vistoPorUltimo(a.lastSeenAt);
      const confirmando = game.friendsConfirmRemove === a.uid;
      if(confirmando){
        return `<div class="friend-row confirmando">
          <div class="friend-row-info">
            <div class="friend-nome">Remover ${escapeHtmlSafe(a.name)}?</div>
            <div class="friend-sub">O retrospecto de vocês continua guardado.</div>
          </div>
          <div class="friend-acoes">
            <button class="friend-btn recusar" onclick="removerAmigo('${escJs(a.uid)}')" aria-label="Confirmar remoção">✔</button>
            <button class="friend-btn" onclick="cancelarRemocaoAmigo()" aria-label="Cancelar">✕</button>
          </div>
        </div>`;
      }
      /* A linha do amigo mostra SÓ presença e retrospecto. A pokédex saiu daqui: com 4 botões de
         ação sobram ~180px, e o terceiro número fazia metade das linhas quebrar numa altura
         diferente das outras -- a lista virava um serrote. Ela continua na busca (onde é o que
         separa dois homônimos) e no quadro de comparação. */
      return `<div class="friend-row ${game.friendsBusy===a.uid?'enviando':''}">
        <div class="friend-row-info">
          <div class="friend-nome">${a.eliteChampion?'🏆 ':''}${escapeHtmlSafe(a.name)}${a.sumiu?' <span class="friend-sumiu">conta apagada</span>':''}</div>
          <div class="friend-sub">
            <span class="friend-presenca ${visto.classe}">${visto.classe==='on'?'●':'○'} ${visto.texto}</span>
            ${friendRivalryHtml(a.rivalry)}
          </div>
        </div>
        <div class="friend-acoes">
          <button class="friend-btn desafiar" ${(desafioAberto||game.friendsBusy||a.sumiu)?'disabled':''} onclick="desafiarAmigo('${escJs(a.uid)}','${escJs(a.name)}')" aria-label="Desafiar ${escapeHtmlSafe(a.name)}" title="Desafiar pra uma batalha">⚔️</button>
          <button class="friend-btn" onclick="abrirComparacao('${escJs(a.uid)}','${escJs(a.name)}')" aria-label="Comparar conquistas" title="Comparar conquistas">📊</button>
          <button class="friend-btn" onclick="openTrainerProfile('uid:${escJs(a.uid)}')" aria-label="Ver perfil" title="Ver perfil">👤</button>
          <button class="friend-btn remover" onclick="pedirRemocaoAmigo('${escJs(a.uid)}')" aria-label="Remover amigo" title="Remover">🗑</button>
        </div>
      </div>`;
    }).join('')}</div>`;
  }
  out += `</div>`;

  // 4) busca -- no rodapé de propósito: adicionar amigo é o que menos acontece nesta tela
  const res = game.friendsSearchResults;
  out += `<div class="box friend-busca">
    <h2>Adicionar amigo</h2>
    <div class="friend-busca-row">
      <input id="friend-search-input" class="friend-search-input" type="text" maxlength="40"
             placeholder="Nome do treinador" autocomplete="off"
             oninput="anotarBuscaAmigo(this.value)"
             onkeydown="if(event.key==='Enter'){event.preventDefault();buscarTreinadores();}">
      <button class="btn primary friend-search-btn" ${game.friendsSearching?'disabled':''} onclick="buscarTreinadores()">${game.friendsSearching?'⏳':'🔎'}</button>
    </div>`;
  if(res){
    if(!res.length){
      out += `<p class="hint-text">Nenhum treinador com esse nome. O nome tem que ser exatamente como ele escreveu na conta.</p>`;
    } else {
      out += `<div class="friend-lista">${res.map(t=>{
        const visto = vistoPorUltimo(t.lastSeenAt);
        let acao;
        if(t.jaAmigo) acao = `<span class="friend-tag ok">✔ amigo</span>`;
        else if(t.pedidoEnviado) acao = `<span class="friend-tag">⏳ enviado</span>`;
        else if(t.pedidoRecebido) acao = `<button class="friend-btn aceitar" onclick="responderPedidoAmizade('${escJs(t.uid)}',true)" aria-label="Aceitar pedido">✔</button>`;
        else acao = `<button class="friend-btn adicionar" ${game.friendsBusy===t.uid?'disabled':''} onclick="enviarPedidoAmizade('${escJs(t.uid)}')" aria-label="Pedir amizade">${game.friendsBusy===t.uid?'⏳':'➕'}</button>`;
        /* Homônimos existem (nada no jogo impede) e é por isso que a linha da busca mostra pokédex,
           placar online e presença: sem esses números, escolher entre dois "Ash" seria sorteio. */
        return `<div class="friend-row">
          <div class="friend-row-info">
            <div class="friend-nome">${t.eliteChampion?'🏆 ':''}${escapeHtmlSafe(t.name)}</div>
            <div class="friend-sub">
              <span class="friend-presenca ${visto.classe}">${visto.classe==='on'?'●':'○'} ${visto.texto}</span>
              <span class="friend-dex">📕 ${t.pokedex||0}</span>
              <span class="friend-dex">⚔️ ${t.onlineWins||0}V ${t.onlineLosses||0}D</span>
            </div>
          </div>
          <div class="friend-acoes">
            <button class="friend-btn" onclick="openTrainerProfile('uid:${escJs(t.uid)}')" aria-label="Ver perfil">👤</button>
            ${acao}
          </div>
        </div>`;
      }).join('')}</div>
      <button class="btn secondary u-mt8" onclick="limparBuscaAmigos()">Limpar busca</button>`;
    }
  }
  out += `</div>
  <button class="btn secondary" onclick="sairDosAmigos()">⬅ Voltar</button>`;
  return out;
}

/* Modal de comparação. Uma linha por conquista, com o maior lado destacado -- a leitura que
   interessa é "quem está na frente em quê", e um número maior sem marcação nenhuma obriga a
   comparar de cabeça linha por linha. */
function renderFriendCompareModal(){
  const st = game.friendCompare;
  if(!st) return '';
  let corpo;
  if(st.loading){
    corpo = `<div class="modal-icon">📊</div><h2>Comparando...</h2>
      <p class="hint-text">Buscando as conquistas dos dois.</p>`;
  } else if(st.error){
    corpo = `<div class="modal-icon">⚠️</div><h2>Não deu</h2>
      <p class="error-text">${escapeHtmlSafe(st.error)}</p>`;
  } else {
    const me = st.data.me || {}, el = st.data.them || {};
    const tMe = me.titles || {total:0, classic:0, trainers:0, custom:0};
    const tEl = el.titles || {total:0, classic:0, trainers:0, custom:0};
    const r = st.data.rivalry || {total:0, wins:0, losses:0};
    const linhas = [
      ['Títulos de liga', tMe.total, tEl.total],
      ['Pokédex', me.pokedex||0, el.pokedex||0],
      ['Shinies', me.shinyDex||0, el.shinyDex||0],
      ['Elite 4', me.eliteWins||0, el.eliteWins||0],
      ['Torres vencidas', me.towerClears||0, el.towerClears||0],
      ['Melhor sequência', me.bestStreak||0, el.bestStreak||0],
      ['Ginásios liderados', me.gymsLed||0, el.gymsLed||0],
      ['Especialidades', (me.specialties||[]).length, (el.specialties||[]).length]
    ];
    const ganhos = linhas.filter(l=>l[1]>l[2]).length;
    const perdidos = linhas.filter(l=>l[1]<l[2]).length;
    corpo = `<div class="fc-head">
        <div class="fc-head-cell eu">VOCÊ</div>
        <div class="fc-head-vs">×</div>
        <div class="fc-head-cell">${escapeHtmlSafe(el.name || st.nome || 'Treinador')}</div>
      </div>
      ${r.total ? `<div class="fc-h2h">
        <div class="fc-h2h-l">EM BATALHA ONLINE</div>
        <div class="fc-h2h-v">${r.wins} <span>×</span> ${r.losses}</div>
        <div class="fc-h2h-sub">${r.total} confronto${r.total===1?'':'s'}${r.lastAt?` · último ${formatDateShort(r.lastAt)}`:''}</div>
      </div>` : `<div class="fc-h2h vazio"><div class="fc-h2h-sub">Vocês nunca se enfrentaram online.</div></div>`}
      <div class="fc-linhas">${linhas.map(([rot, a, b])=>`
        <div class="fc-linha">
          <span class="fc-v ${a>b?'ganha':(a<b?'perde':'')}">${a}</span>
          <span class="fc-rot">${rot}</span>
          <span class="fc-v ${b>a?'ganha':(b<a?'perde':'')}">${b}</span>
        </div>`).join('')}</div>
      <p class="hint-text fc-resumo">Você está na frente em <strong>${ganhos}</strong> de ${linhas.length} e atrás em <strong>${perdidos}</strong>.</p>`;
  }
  return `<div class="modal-overlay" onclick="if(event.target===this)fecharComparacao()">
    <div class="modal-box friend-compare-box">
      ${corpo}
      <button class="btn secondary" onclick="fecharComparacao()">Fechar</button>
    </div>
  </div>`;
}

function openSaveCard(slot){
  const s = game.saveSlots[slot];
  if(!s) return;
  if((s.badgeCount||0) >= 8){ continueCompleteSave(slot); }
  else { continueSave(slot); }
}
/* Contador do bônus shiny na home. Some sozinho quando o bônus expira -- a checagem é a mesma do
   currentShinyChance, então os dois nunca discordam sobre estar ativo ou não.
   Mostra minutos até faltar 1 minuto, e aí passa pra segundos: "falta 1min" parado por 60 segundos
   dá a impressão de travado justo no fim, que é quando a pessoa mais olha. */
function shinyBonusCounterHtml(){
  const restante = (game.shinyBonusExpiresAt || 0) - Date.now();
  if(restante <= 0) return '';
  const min = Math.floor(restante / 60000);
  const seg = Math.floor((restante % 60000) / 1000);
  const texto = min >= 1 ? `${min}min` : `${seg}s`;
  return `<span class="shiny-bonus-counter" title="Chance aumentada de shiny nos encontros selvagens">🌟 Shiny Bônus: ${texto}</span>`;
}
function renderSaveSelect(){
  const caughtCount = getAllCaughtSpecies().size;
  const totalSpecies = Object.keys(SPECIES).length;
  /* O card de Amigos mostra o que a pessoa PRECISA fazer, não o tamanho da lista: um pedido
     esperando resposta é a única coisa aqui que fica parada até alguém agir. */
  const pedidosPend = game.friendRequestCount || 0;
  const friendsTeaser = pedidosPend > 0
    ? `${pedidosPend} pedido${pedidosPend===1?'':'s'} esperando`
    : 'Desafie quem você conhece';
  let achievementsTeaser = `${ACHIEVEMENTS.length} desafios pra completar`;
  if(game.achievementsExtra){
    const agg = getAchievementAggregate();
    const unlocked = ACHIEVEMENTS.filter(ach=>ach.check(agg, game.achievementsExtra)).length;
    achievementsTeaser = `${unlocked}/${ACHIEVEMENTS.length} desbloqueadas`;
  }
  return `
  <div class="home-header">
    <div class="home-title">★ JORNADA KANTO ★</div>
  </div>
  <div class="home-header-row">
    <button class="box trainer-name-box" onclick="openMyTrainerProfile()" aria-label="Ver meu perfil de treinador">
      <span class="trainer-name-value">${escapeHtmlSafe(game.trainerName||'')}</span>
    </button>
    <button class="notif-bell-btn" onclick="openNotificationsScreen()" aria-label="Notificações">
      🔔${(game.notificationsUnreadCount||0)>0 ? `<span class="notif-badge">${game.notificationsUnreadCount>9?'9+':game.notificationsUnreadCount}</span>` : ''}
    </button>
  </div>
  <div class="home-menu-row">
    <button class="home-menu-card pokedex" onclick="openPokedex()">
      <span class="home-menu-icon">${pokedexIcon('menu')}</span>
      <span class="home-menu-title">Pokédex</span>
      <span class="home-menu-stat">${caughtCount}/${totalSpecies} registrados</span>
    </button>
    <button class="home-menu-card achievements" onclick="openAchievements()">
      <span class="home-menu-icon">${icone('conquistas','menu')}</span>
      <span class="home-menu-title">Conquistas</span>
      <span class="home-menu-stat">${achievementsTeaser}</span>
    </button>
    <button class="home-menu-card friends" onclick="openFriends()">
      <span class="home-menu-icon">👥${(game.friendRequestCount||0)>0 ? `<span class="notif-badge">${game.friendRequestCount>9?'9+':game.friendRequestCount}</span>` : ''}</span>
      <span class="home-menu-title">Amigos</span>
      <span class="home-menu-stat">${friendsTeaser}</span>
    </button>
  </div>
  <div class="home-modes-row">
    <button class="home-nav-btn leagues-big-btn" onclick="openLeagueTypesList()">
      <span class="home-mode-icon">${icone('ligas','modo')}</span><span>Ligas Pokémon</span></button>
    <button class="home-nav-btn leagues-big-btn" style="background:var(--green);" onclick="openNeighborhoodGymScreen()">
      <span class="home-mode-icon">${icone('ginasio','modo')}</span><span>Ginásio da Cidade</span></button>
    <button class="home-nav-btn leagues-big-btn" style="background:#8a5a00;" onclick="openTrainerTower()">
      <span class="home-mode-icon">${icone('torre','modo')}</span><span>Torre dos Treinadores</span></button>
    <button class="home-nav-btn leagues-big-btn" style="background:#7038f8;" onclick="openOnlineBattle()">
      <span class="home-mode-icon">${icone('batalha','modo')}</span><span>Batalha Online</span></button>
    ${ehDomingo() ? `
    <button class="home-nav-btn leagues-big-btn home-btn-largo" style="background:#c2185b;" onclick="openSundayBoss()">
      <span class="home-mode-icon">✨</span><span>Boss de Domingo</span></button>` : ''}
  </div>
  <div class="home-section-row">
    <span class="home-section-label">💾 SEUS TIMES</span>
    ${shinyBonusCounterHtml()}
  </div>
  ${Array.from({length:MAX_SAVE_SLOTS}, (_, i) => i).map(slot=>{
    const s = game.saveSlots[slot];
    if(!s){
      return `<button class="save-slot-card empty" onclick="startNewSave(${slot})">
        <span class="save-slot-empty-text">Slot ${slot+1} — vazio</span>
        <span class="save-slot-add">➕ Novo Jogo</span>
      </button>`;
    }
    // a contagem de insígnias não é mais lida aqui: quem interpreta o estado do save é o
    // saveStatusLabel, e a faixa colorida do rodapé é o único lugar que sinaliza jornada completa.
    // Antes a borda do card também ficava dourada nesse caso -- removido a pedido
    const team = s.team||[];
    // média de nível do time, arredondada. É o que diz de relance se um save está pronto pra uma liga --
    // as insígnias saíram daqui porque, com a jornada terminada em quase todos os saves, "8/8" era a
    // mesma informação em todo card e não distinguia nada
    const avgLevel = team.length ? Math.round(team.reduce((soma,p)=> soma + (p.level||0), 0) / team.length) : 0;
    const displayName = s.customName || `Time ${slot+1}`;
    return `<div class="save-slot-card ${s.favorite?'favorited':''} ${team.length?'has-avg-star':''} ${s.gameMode==='hard'?'hard-save':''} clickable"
      onclick="openSaveCard(${slot})" role="button" tabindex="0" aria-label="Abrir ${escapeHtmlSafe(displayName)}">
      <div class="save-slot-top">
        ${team.length ? `<span class="team-avg-star" title="Média de nível do time">${STAR_SVG}<span class="team-avg-star-num">${avgLevel}</span></span>` : ''}
        <span class="save-slot-name"><span class="team-avg-star-name">${s.eliteStatus==='champion'?'🏆 ':''}${escapeHtmlSafe(displayName)}</span>${s.gameMode==='hard'?'<span class="save-slot-hard-tag">DIFÍCIL</span>':''} <button class="save-slot-rename" onclick="event.stopPropagation();openRenameSlotModal(${slot})" aria-label="Renomear">✏️</button></span>
        <span class="save-slot-actions">
          ${game.myActiveGymDefenses && game.myActiveGymDefenses[slot] ? (()=>{
            const g = game.myActiveGymDefenses[slot];
            // ícone na linha de ações em vez de uma barra verde de largura inteira embaixo do card:
            // é uma informação de um save só, não merece mais peso visual que o time
            return `<button class="save-slot-gym" onclick="event.stopPropagation();openNeighborhoodGymRemote('${escJs(g.city)}','${escJs(g.countryCode||'')}')" title="Ver Ginásio ${escapeHtmlSafe(g.city)}" aria-label="Ver Ginásio ${escapeHtmlSafe(g.city)}">🏟️</button>`;
          })() : ''}
          ${s.mewtwoLoan && s.mewtwoLoan.active ? (()=>{
            // antes isso era um parágrafo de largura inteira embaixo do card, solto e sem relação
            // visual com nada. Aqui vira um rótulo curto na própria linha de ações, junto dos botões
            const msLeft = Math.max(0, s.mewtwoLoan.expiresAt - Date.now());
            const h = Math.floor(msLeft / 3600000);
            const m = Math.floor((msLeft % 3600000) / 60000);
            const tempo = h > 0 ? `${h}h${String(m).padStart(2,'0')}min` : `${m}min`;
            return `<span class="save-slot-mewtwo" title="O Mewtwo emprestado sai deste time quando o tempo acabar">Fim Mewtwo: ${tempo}</span>`;
          })() : ''}
          <button class="save-slot-fav ${s.favorite?'active':''}" onclick="event.stopPropagation();toggleFavoriteSlot(${slot})" aria-label="Favoritar">${s.favorite?'⭐':'☆'}</button>
          <button class="save-slot-delete" onclick="event.stopPropagation();requestDeleteSave(${slot})" ${game.deleteSaveChecking===slot?'disabled':''} aria-label="Deletar save">${game.deleteSaveChecking===slot?'⏳':'🗑'}</button>
        </span>
      </div>
      ${team.length ? `<div class="save-slot-team-row spread">
        ${team.map(p=>{
          const sp = SPECIES[p.speciesId];
          return `<div class="save-slot-mon">
            <div class="save-slot-mon-sprite large">${sp?spriteHtml(p.speciesId,'sprite-md',p.shiny):'❔'}</div>
            <div class="save-slot-mon-level">Lv.${p.level}</div>
          </div>`;
        }).join('')}
      </div>` : `<p class="save-slot-empty-team">Sem time</p>`}
      ${(()=>{ const st = saveStatusLabel(s); return `<div class="save-slot-status ${st.cls}">${st.texto}</div>`; })()}
    </div>`;
  }).join('')}
  <div class="home-nav-row">
    <button class="home-nav-btn" onclick="logout()">🚪 Logout</button>
    ${canShowInstallButton() ? `<button class="home-nav-btn install" onclick="promptInstallApp()">📲 Instalar app</button>` : ''}
  </div>`;
}

/* A Pokédex como modal, aberta de dentro da captura. Reusa renderPokedex() inteiro -- inclusive
   o alternador normal/shiny -- em vez de recriar a lista: assim ela não sai do lugar quando a
   Pokédex mudar, e o jogador vê exatamente a mesma tela que já conhece.
   Existe porque na hora de escolher entre 3 selvagens a pergunta é sempre "qual desses eu ainda
   não tenho?", e sair da tela pra conferir custava a captura. */
function abrirPokedexModal(){ game.pokedexModal = true; render(); }
function fecharPokedexModal(){ game.pokedexModal = false; game.pokedexFicha = null; render(); }
function renderPokedexModal(){
  if(!game.pokedexModal) return '';
  return `
  <div class="modal-overlay" onclick="fecharPokedexModal()">
    <div class="modal-box dex-modal" onclick="event.stopPropagation()">
      <div class="dex-modal-conteudo">${renderPokedex()}</div>
      <button class="btn secondary" onclick="fecharPokedexModal()">Fechar</button>
    </div>
  </div>`;
}
/* Ficha de um pokémon da Pokédex: sprite grande e os atributos base da espécie.
   Só abre pra quem JÁ ESTÁ REGISTRADO -- numa célula "???" ela entregaria de graça o que a pessoa
   ainda não capturou, e a Pokédex perderia a graça. Por isso o onclick só entra nas células caught.

   Os atributos vêm do SPECIES, não de uma instância: aqui é a ficha da ESPÉCIE, sem nível, buff de
   shiny/terreno ou especialidade. Mostrar o valor de um pokémon específico daria números diferentes

function renderPokedex(){
  const isShinyView = game.pokedexView==='shiny';
  const caught = getAllCaughtSpecies();
  const shinyCaught = new Set(game.permanentShinyDex || []);
  const allSpecies = Object.keys(SPECIES).map(id=>({id, dex:SPECIES[id].dex, name:SPECIES[id].name})).sort((a,b)=>a.dex-b.dex);
  const totalSpecies = Object.keys(SPECIES).length; // inclui o Mewtwo
  const caughtCount = caught.size;
  const shinyCount = shinyCaught.size;
  const otherSpeciesCaught = allSpecies.filter(s=>s.id!=='mewtwo').every(s=>caught.has(s.id));
  return `
  <div class="box">
    <h2>${isShinyView ? '✨ Pokédex Shiny' : '📖 Pokédex'}</h2>
    <p>${isShinyView
        ? `${shinyCount} shiny${shinyCount===1?'':'s'} capturado${shinyCount===1?'':'s'}, somando todos os seus saves.`
        : `${caughtCount} de ${totalSpecies} espécies registradas, somando todos os seus saves.`}</p>
    <button class="btn secondary" onclick="togglePokedexShinyView()">${isShinyView ? '⬅ Ver Pokédex normal' : '✨ Shiny'}</button>
  </div>
  <div class="box">
    <div class="pokedex-grid">
      ${allSpecies.map(s=>{
        if(isShinyView){
          // no modo shiny, "capturado" é especificamente "já pegou ESSA espécie brilhando" -- não tem
          // a lógica especial do Mewtwo aqui (desafio de captura normal, não tem uma versão shiny dele)
          const isShinyCaught = shinyCaught.has(s.id);
          return `<div class="pokedex-cell ${isShinyCaught?'caught abrivel':'unknown'}" title="${isShinyCaught?s.name+' ✨':'???'}" ${isShinyCaught?`onclick="abrirPokedexFicha('${s.id}',true)"`:''}>
            ${isShinyCaught ? spriteHtml(s.id,'sprite-sm',true) : `<span class="pokedex-number">#${String(s.dex).padStart(3,'0')}</span>`}
          </div>`;
        }
        const isCaught = caught.has(s.id);
        if(s.id==='mewtwo'){
          // só fica clicável (pra iniciar o desafio) depois que as outras 149 espécies já foram
          // registradas -- antes disso, é só mais uma célula "???" travada, igual as demais
          const canChallenge = !isCaught && otherSpeciesCaught;
          const canOpenLoanInfo = isCaught && game.mewtwoLoanUnlocked;
          // capturado abre a FICHA, não o empréstimo direto: o botão do empréstimo foi pra dentro dela,
          // assim o Mewtwo também mostra os atributos como qualquer outro e nada se perde
          return `<div class="pokedex-cell ${isCaught?'caught abrivel':(canChallenge?'mystery':'unknown')}${canOpenLoanInfo?' clickable':''}" title="${isCaught?s.name:'???'}" ${canChallenge?'onclick="openMewtwoChallenge()"':(isCaught?`onclick="abrirPokedexFicha('${s.id}',false)"`:'')}>
            ${isCaught ? spriteHtml(s.id,'sprite-sm') : (canChallenge ? `<span class="pokedex-mystery">❓</span>` : `<span class="pokedex-number">#${String(s.dex).padStart(3,'0')}</span>`)}
          </div>`;
        }
        return `<div class="pokedex-cell ${isCaught?'caught abrivel':'unknown'}" title="${isCaught?s.name:'???'}" ${isCaught?`onclick="abrirPokedexFicha('${s.id}',false)"`:''}>
          ${isCaught ? spriteHtml(s.id,'sprite-sm') : `<span class="pokedex-number">#${String(s.dex).padStart(3,'0')}</span>`}
        </div>`;
      }).join('')}
    </div>
  </div>
  ${game.pokedexModal ? '' : `<button class="btn primary" onclick="closePokedex()">⬅ Voltar</button>`}`;
}

async function chooseMewtwoBench(slot, index){
  if(!game.authUser) return;
  const saveData = game.saveSlots[slot];
  if(!saveData || !saveData.team || !saveData.team[index]) return;
  try{
    const ref = saveDocRef(game.authUser.uid, slot);
    const snap = await ref.get();
    if(snap.exists){
      const freshData = snap.data();
      const benchedPokemon = freshData.team[index]; // guardado só pra exibição -- o time salvo não muda
      const mewtwoReward = { ...(freshData.mewtwoReward||{}), earned:true, benchIndex:index, benchedPokemon, used:false };
      await ref.set({ ...freshData, mewtwoReward }, { merge:true });
      game.saveSlots[slot] = { ...freshData, mewtwoReward };
    }
  } catch(e){ console.error('Erro ao guardar a escolha do Mewtwo:', e); }
  game.pendingMewtwoBenchSlot = null;
  game.mewtwoBenchSlot = null;
  game.screen = 'pokedex';
  render();
  loadSaveSlots();
}
async function startMewtwoBattle(slot){
  const saveData = game.saveSlots[slot];
  if(!saveData || !saveData.team || saveData.team.length===0) return;
  // createInstance só copia espécie e nível -- a flag de shiny fica pra trás. Sem restaurar aqui,
  // um shiny do jogador entrava na luta do Mewtwo como comum: sprite normal, sem a estrela, e SEM
  // o buff ofensivo de shiny. Era a única batalha do jogo que reconstruía o time do zero em vez de
  // usar o game.team, então era a única com esse problema
  const team = saveData.team.map(p=>{
    const inst = createInstance(p.speciesId, p.level);
    inst.shiny = !!p.shiny;
    return inst;
  });
  // 1/128 -- vale tanto na primeira vitória (a que completa a Pokédex) quanto em qualquer reencontro
  // depois de um cooldown, já que os dois passam por essa mesma função
  const mewtwoIsShiny = Math.random() < SHINY_CHANCE;
  const mewtwoTeam = [createInstance('mewtwo', 99)];
  mewtwoTeam[0].shiny = mewtwoIsShiny; // só afeta a exibição NESSA luta -- o servidor decide, a partir do mesmo sorteio, se o Mewtwo que entra no time depois vem shiny
  applySpecialtyBuff(team);
  const result = simulateGymBattle(team, mewtwoTeam);
  if(result.win && game.authUser){
    try{
      const ref = saveDocRef(game.authUser.uid, slot);
      const snap = await ref.get();
      if(snap.exists){
        const freshData = snap.data();
        const updatedCaught = Array.from(new Set([...(freshData.caughtSpecies||[]), 'mewtwo']));
        await ref.set({ ...freshData, caughtSpecies: updatedCaught }, { merge:true });
        game.saveSlots[slot] = { ...freshData, caughtSpecies: updatedCaught };
        if(game.currentSaveSlot===slot){ game.caughtSpecies = updatedCaught; }
      }
    } catch(e){ console.error('Erro ao salvar a captura do Mewtwo:', e); }
  }
  // avisa o servidor do resultado -- ele decide se é a primeira vitória de todas (desbloqueia o
  // mecanismo inteiro) ou um reencontro depois de um cooldown (libera reivindicar de novo),
  // guardando também se ESSE Mewtwo específico saiu shiny
  try{
    await functionsClient.httpsCallable('reportMewtwoBattleResult')({ slot, win: result.win, shiny: mewtwoIsShiny });
    if(result.win){ game.mewtwoLoanUnlocked = true; game.mewtwoLoanReadyToClaim = true; }
  } catch(e){ console.error('Erro ao reportar resultado da batalha do Mewtwo:', e); }
  game.leagueWatch = {
    playerAName: saveData.trainerName,
    playerBName: mewtwoIsShiny ? 'Mewtwo ✨' : 'Mewtwo',
    matchups: result.matchups,
    winnerName: result.win ? saveData.trainerName : 'Mewtwo'
  };
  preloadBattleSprites(result.matchups);
  game.leagueWatchIndex = 0;
  game.leagueWatchPhase = 'loading';
  game.leagueWatchReturnScreen = 'pokedex';
  game.screen = 'leagueWatch';
  render();
  setTimeout(advanceLeagueWatch, 1200);
}

    case 'mewtwoLoanBenchPicker': html = renderMewtwoLoanBenchPicker(); break;
    case 'achievements': html = renderAchievements(); break;
    case 'newSaveMode': html = renderNewSaveMode(); break;
    case 'newSaveName': html = renderNewSaveName(); break;
  }
  if(!html){
    // rede de segurança: se game.screen acabou com um valor que nenhum case acima reconhece, o
    // switch não erra (não lança exceção) -- só deixa html vazio e a tela fica em branco em silêncio,
    // sem nada no console pra apontar a causa. Em vez disso, registra o valor exato (pra investigar da
    // próxima vez que acontecer) e volta pra um lugar seguro em vez de deixar a pessoa travada
    // duas causas possíveis, e confundir as duas custou tempo de investigação: ou game.screen tem um
    // valor que nenhum case reconhece, ou o case existe mas a função de render devolveu string vazia
    // por falta de estado (típico de tela que depende de estado transitório não salvo). A mensagem
    // separa os casos pra próxima investigação começar no lugar certo
    console.error('Tela sem conteúdo, recuperando:', game.screen,
      '-- ou nenhum case do despachante reconhece esse valor, ou o render dela devolveu vazio por falta de estado transitório (ex: specialBattle/battleResult não são salvos)');
    game.screen = game.authUser ? 'saveSelect' : 'auth';
    html = game.authUser ? renderSaveSelect() : renderAuth();
  }
  // 'newSaveMode' NÃO entra aqui: é a primeira tela da criação, e sem o botão Home a pessoa que
  // clicou num slot por engano fica presa nela
  const noMenuScreens = new Set(['auth','saveSelect','newSaveName','battling','trainerBattling','leagueWatch','pokedex','achievements','mewtwoPicker','mewtwoBenchPicker']);
  if(game.authUser && !noMenuScreens.has(game.screen)){
    html += `<button class="home-nav-btn" onclick="goToSaveMenu()">🏠 Home</button>`;
  }
  if(game.showResetConfirm){ html += renderResetModal(); }
  if(game.deleteSaveTarget!=null){ html += renderDeleteSaveModal(); }
  if(game.deleteNotifTarget){ html += renderDeleteNotificationModal(); }
  if(game.deleteNotifBulk){ html += renderDeleteNotificationsBulkModal(); }
  if(game.neighborhoodGymLeaveConfirm){ html += renderLeaveNeighborhoodGymModal(); }
  if(game.showMewtwoLoanInfoModal){ html += renderMewtwoLoanInfoModal(); }
  if(game.showIosInstallModal){ html += renderIosInstallModal(); }
  if(game.deleteSaveBlockedReason){ html += renderSaveBlockedModal(); }
  if(game.playerTeamModal){ html += renderPlayerTeamModal(); }
  // o perfil vem DEPOIS do modal de time de propósito: os modais empilham na ordem em que são
  // anexados, e o perfil é aberto A PARTIR do título do modal de time -- se viesse antes, abriria
  // atrás dele. Fica antes do de trocar nome, que por sua vez é aberto a partir do perfil
  if(game.pokedexModal){ html += renderPokedexModal(); }
  // DEPOIS do modal da Pokédex de propósito: os modais empilham na ordem em que são anexados, e a
  // ficha é aberta a partir de dentro dele -- se viesse antes, abriria atrás
  if(game.timeModal){ html += renderTimeModal(); }
  if(game.pokedexFicha){ html += renderPokedexFicha(); }
  if(game.onlinePendente){ html += renderConviteModal(); }   // aparece por cima de qualquer tela
  if(game.desafioAviso){ html += renderAvisoDesafioModal(); }   // desafio de amigo, idem
  html += renderAvisoDeSaveHtml();   // "não estou conseguindo salvar" -- por cima de tudo
  if(game.candyPicker){ html += renderCandyPickerModal(); }
  if(game.towerOrder){ html += renderTowerOrderModal(); }
  if(game.towerRanking){ html += renderTowerRankingModal(); }
  if(game.trainerProfile){ html += renderTrainerProfileModal(); }
  if(game.friendCompare){ html += renderFriendCompareModal(); }
  if(game.showTeamOrderModal){ html += renderRegisteredTeamOrderModal(); }
  if(game.renameSlotTarget!=null){ html += renderRenameSlotModal(); }
  if(game.editTrainerName){ html += renderEditTrainerNameModal(); }
  if(game.terrainInfoTarget){ html += renderTerrainInfoModal(); }
  /* A tela inteira é redesenhada a cada toque (innerHTML novo). Quando o redesenho é da MESMA tela
     -- tocar várias vezes no "+" da distribuição de níveis, por exemplo --, a rolagem tem que ficar
     onde estava: no atalho-app ela escorregava pra baixo a cada toque e acabava mostrando a faixa
     vazia embaixo do conteúdo. Trocar de tela não mexe em nada (fica como sempre foi). */
  const mesmaTela = game.screen === telaDoUltimoRender;
  const rolagemAntes = window.scrollY;
  app.innerHTML = html;
  telaDoUltimoRender = game.screen;
  if(mesmaTela && window.scrollY !== rolagemAntes){ window.scrollTo(0, rolagemAntes); }
  /* O campo de busca de amigo é recriado a cada render (innerHTML apaga o DOM inteiro), então o
     que a pessoa digitou é reposto aqui. Guardar o valor em game e repor depois é mais simples que
     evitar o render -- e é o que mantém a busca utilizável enquanto o poll do desafio roda. */
  if(game.screen==='friends') reporValorBuscaAmigo();
  maybeAutoSave();
}

let resolveAuthChecked;
const authCheckedOnce = new Promise(res=>{ resolveAuthChecked = res; });
auth.onAuthStateChanged((user)=>{

    game.authUser = { uid:user.uid, email:user.email, displayName:user.displayName };
    game.authBusy = false;
    if(game.screen==='auth'){ openSaveSelect(); }
    agendarAvisoDesafio();   // desafio de amigo pode chegar em qualquer tela, a partir de agora
  } else {
    game.authUser = null;
    game.currentSaveSlot = null;
    pararAvisoDesafio();
    /* devolve o formulário ao estado inicial: sem isso, quem sai da conta com a tela em "criar
       conta" ou "esqueci minha senha" reencontra aquele formulário no lugar do login -- e o e-mail
       da conta anterior continua preenchido num aparelho que pode não ser só dele */
    game.authMode = 'login'; game.authError = null; game.authNotice = null; game.authEmail = '';
    if(game.screen!=='auth'){ game.screen = 'auth'; render(); }
  }
  resolveAuthChecked();
});

async function migratePreMultiLeagueTypeDataIfNeeded(){
  // quando o suporte a múltiplos tipos de liga foi criado, os caminhos da Liga Clássica mudaram
  // (leagues/schedule -> leagues/schedule_classic, leagueCycles/{id} -> leagueCycles/classic__{id},
  // leagues/champions_alltime -> leagues/champions_alltime_classic). Isso migra o que ainda estiver
  // nos caminhos antigos pros novos, sem sobrescrever nada que já exista no caminho novo (só soma).
  try{
    const oldScheduleRef = db.collection('leagues').doc('schedule');
    const oldScheduleSnap = await oldScheduleRef.get();
    if(!oldScheduleSnap.exists) return; // nada pra migrar (conta nova, ou já migrado antes)
    console.log('Migrando a Liga Clássica pro formato com suporte a múltiplos tipos de liga...');
    const oldData = oldScheduleSnap.data();

    for(const oldCycle of (oldData.cycles||[])){
      const cycleId = oldCycle.id;
      if(oldCycle.status==='registering'){
        // migra os inscritos desse ciclo (ainda em fase de inscrição)
        const oldRegSnap = await db.collection('leagueCycles').doc(cycleId).collection('registrants').get();
        for(const doc of oldRegSnap.docs){
          await registrantDocRef(CLASSIC_LEAGUE_TYPE, cycleId, doc.id).set(doc.data());
        }
      } else {
        // migra o detalhe do chaveamento (já tinha sido sorteado)
        const oldDetailSnap = await db.collection('leagueCycles').doc(cycleId).get();
        if(oldDetailSnap.exists){
          await cycleDocRef(CLASSIC_LEAGUE_TYPE, cycleId).set(oldDetailSnap.data());
        }
      }
    }

    // soma os ciclos antigos na agenda nova, sem sobrescrever ciclos que já existam lá (ex: se alguém
    // já se inscreveu depois do caminho ter mudado, antes dessa migração rodar)
    const newScheduleSnap = await scheduleDocRef(CLASSIC_LEAGUE_TYPE).get();
    const newScheduleData = newScheduleSnap.exists ? newScheduleSnap.data() : { cycles: [], updatedAt: Date.now() };
    for(const oldCycle of (oldData.cycles||[])){
      if(!newScheduleData.cycles.some(c=>c.id===oldCycle.id)){
        newScheduleData.cycles.push(oldCycle);
      }
    }
    newScheduleData.updatedAt = Date.now();
    await scheduleDocRef(CLASSIC_LEAGUE_TYPE).set(newScheduleData);

    // migra o ranking global de campeões
    const oldRankRef = db.collection('leagues').doc('champions_alltime');
    const oldRankSnap = await oldRankRef.get();
    if(oldRankSnap.exists){
      await db.collection('leagues').doc('champions_alltime_'+CLASSIC_LEAGUE_TYPE).set(oldRankSnap.data(), { merge: true });
    }

    await oldScheduleRef.delete();
    console.log('Migração pro formato multi-liga concluída.');
  } catch(e){ console.error('Erro ao migrar dados pro formato multi-liga:', e); }
}
// As duas migrações leem a coleção 'leagues', e as regras do Firestore exigem usuário autenticado
// pra qualquer leitura ali. Rodando na carga do arquivo, elas disparavam ANTES de o Firebase Auth
// terminar de restaurar a sessão -- daí os dois "Missing or insufficient permissions" que apareciam
// no console em todo acesso. Não quebravam nada (o try/catch segurava, e as migrações são para dados
// que quase ninguém tem), mas poluíam o console e escondiam erro de verdade.
// authCheckedOnce resolve quando o onAuthStateChanged dispara pela primeira vez; o Promise.race com
// um tempo limite é a mesma proteção usada em outros pontos do arquivo, pra nunca ficar preso caso o
// Firebase não responda.
// Se ninguém estiver logado depois disso, não há o que migrar: as duas mexem em dados de conta.
(async () => {
  // tempo limite local: o `wait` do arquivo mora dentro do IIFE da intro e não é visível aqui
  const limite = new Promise(r=>setTimeout(r, 4000));
  await Promise.race([authCheckedOnce, limite]);
  if(!game.authUser) return;
  await migrateOldLeagueDataIfNeeded();
  await migratePreMultiLeagueTypeDataIfNeeded();
})();

render();

/* ============ INTRO POKÉBOLA ============ */
(function(){
  const introBall = document.getElementById('introBall');
  const introStage = document.getElementById('introStage');
  const introCore = document.getElementById('introCore');
  const introLoadUi = document.getElementById('introLoadUi');
  const introFill = document.getElementById('introFill');
  const bootEl = document.getElementById('boot');
  const introFlashEl = document.getElementById('introFlash');
  const wait = ms => new Promise(r => setTimeout(r, ms));

  function introStars(){
    for(let i=0;i<8;i++){
      const s = document.createElement('div');
      s.className = 'intro-star';
      s.textContent = i%2 ? '✦' : '★';
      s.style.color = i%2 ? '#ffcb05' : '#fff5d6';
      const ang = (Math.PI*2/8)*i + 0.4;
      s.style.setProperty('--dx', Math.cos(ang)*150+'px');
      s.style.setProperty('--dy', Math.sin(ang)*150+'px');
      s.style.setProperty('--rot', (i%2? 160:-160)+'deg');
      introStage.appendChild(s);
      setTimeout(()=>s.remove(), 1000);
    }
  }

  async function runIntro(){
    await wait(450);

    // 1. metades fecham
    introStage.classList.add('closed');
    introBall.classList.add('closed');
    await wait(560);
    introBall.classList.add('clunk');
    await wait(380);

    // 2. luz vermelha acende + balanço de captura
    introCore.classList.add('lit');
    introBall.classList.add('wobble');
    await wait(850);
    introBall.classList.remove('wobble');
    introCore.classList.add('pulse');

    // 3. carregando -- ao mesmo tempo, o Firebase real já está resolvendo o login em segundo plano
    introLoadUi.classList.add('show');
    for(let p=0; p<=100; p+=4){
      introFill.style.width = p+'%';
      await wait(90);
    }
    await wait(250);

    // espera o Firebase confirmar se o jogador já está logado ou não, pra revelar a tela certa
    // por trás (sem isso, quem já tava logado veria a tela de login piscar por um instante antes
    // de cair na seleção de save). Tem um limite de segurança pra não travar o jogo se a conexão
    // estiver ruim ou o Firebase demorar demais pra responder.
    await Promise.race([authCheckedOnce, wait(4000)]);

    // 4. captura concluída: clarão + estrelas
    introCore.classList.remove('pulse');
    introCore.classList.add('burst');
    introStars();
    await wait(450);
    introFlashEl.classList.add('go');
    await wait(320);

    // 5. revela o jogo (a tela de login ou a seleção de save, o que já estiver certo por trás)
    bootEl.classList.add('gone');
  }
  runIntro();
})();

/* -------------------------------------------------------------------
   VERIFICAÇÃO DE VERSÃO -- avisa o jogador se o arquivo publicado mudou
   desde que essa página carregou (ex: você fez um novo deploy enquanto
   ele estava com o jogo aberto). Não precisa lembrar de atualizar um
   número de versão manualmente a cada deploy: compara o HASH do HTML
   baixado agora contra o que foi baixado no carregamento, via um
   fetch com cache:'no-store' (ignora cache do navegador de propósito).
   Não recarrega sozinho -- só mostra o aviso, porque forçar reload no
   meio de uma animação de batalha seria bem ruim; o jogador decide a
   hora de clicar em "Atualizar agora".
------------------------------------------------------------------- */
let __initialPageHash = null;
async function __hashText(text){
  const enc = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function __captureInitialVersion(){
  try{
    const res = await fetch(location.pathname, { cache:'no-store' });
    const text = await res.text();
    __initialPageHash = await __hashText(text);
  } catch(e){ console.error('Não consegui capturar a versão inicial da página:', e); }
}
async function __checkForNewVersion(){
  if(!__initialPageHash) return; // ainda não tem o que comparar
  try{
    const res = await fetch(location.pathname + '?_=' + Date.now(), { cache:'no-store' });
    const text = await res.text();
    const hash = await __hashText(text);
    if(hash !== __initialPageHash){
      const banner = document.getElementById('version-banner');
      if(banner){ banner.style.display = 'flex'; }
    }
  } catch(e){ /* falha de rede passageira -- não faz nada, tenta de novo no próximo ciclo */ }
}
__captureInitialVersion();
setInterval(__checkForNewVersion, 5 * 60 * 1000); // confere a cada 5 minutos

/* Mantém o contador do bônus shiny andando na home.
   Atualiza o texto direto no DOM em vez de chamar render(): a home tem os cards de save com sprites,
   e redesenhar tudo a cada segundo só pra mexer num texto piscaria a tela inteira.
   Só age quando a home está aberta E o bônus está ativo; quando ele expira, o elemento é removido
   e o próximo render() já não o recria. */
setInterval(()=>{
  if(game.screen !== 'saveSelect') return;
  const el = document.querySelector('.shiny-bonus-counter');
  const html = shinyBonusCounterHtml();
  if(!html){ if(el) el.remove(); return; }
  if(el){
    // troca só o texto interno, preservando o elemento (e a animação de pulso, que reiniciaria)
    const novo = html.replace(/^<span[^>]*>/, '').replace(/<\/span>$/, '');
    if(el.innerHTML !== novo) el.innerHTML = novo;
  } else {
    // o bônus foi ativado com a home já aberta: insere sem redesenhar a tela
    const linha = document.querySelector('.home-section-row');
    if(linha) linha.insertAdjacentHTML('beforeend', html);
  }
}, 1000);
document.addEventListener('visibilitychange', () => {
  // cobre o caso mais comum: o jogador deixou a aba aberta em segundo plano por um tempo (às
  // vezes o dia inteiro) e voltou depois de você já ter feito um deploy novo nesse meio tempo
  if(document.visibilityState === 'visible'){ __checkForNewVersion(); }
});
